al": "Make 10-15 awards", "year": "2026", "stated": "RFP estimate", "result": "Hit on CoFo's own count: 14 named.", "sources": [{"url": "https://www.cofo.org/rfp", "title": "CoFo RFP"}, {"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "CoFo Substack: Our First Grantees"}]}, {"goal": "Award $1.5M in project grants", "year": "2026", "stated": "Science of Awakening program page", "result": "Unverified. The count is compatible with it, but about $100,000 is traced outside CoFo and no payments were seen.", "sources": [{"url": "https://cofo.org/awakening", "title": "CoFo: Science of Awakening"}]}, {"goal": "Award notices in May 2026; projects start in September 2026", "year": "2026", "stated": "RFP timeline", "result": "Partly verifiable. Awardees were publicly named 22 July with a September start. Actual notice dates and project starts are unconfirmed.", "sources": [{"url": "https://www.cofo.org/rfp", "title": "CoFo RFP"}, {"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "CoFo Substack: Our First Grantees"}]}, {"goal": "Publish State of the Field: Science of Awakening", "year": "Q3 2026", "stated": "Home and Insights pages", "result": "Apparent miss. No link as of 30 October 2026; newsletter delivery not tested.", "sources": [{"url": "https://cofo.org/insights", "title": "CoFo: Insights"}]}, {"goal": "Publish detailed application analysis", "year": "2026", "stated": "\"In the coming weeks\", 22 July post", "result": "Apparent miss. Not in the archive about 14 weeks later.", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/archive", "title": "CoFo Substack archive"}]}, {"goal": "Co-create a position paper and field-consensus research roadmap", "year": "2026", "stated": "Science of Awakening program page", "result": "Pending. No evidence found with two months left in the year.", "sources": [{"url": "https://cofo.org/awakening", "title": "CoFo: Science of Awakening"}]}, {"goal": "Fundamental Consciousness report and research map", "year": "Late 2026", "stated": "Program page", "result": "Pending. Not yet due.", "sources": [{"url": "https://cofo.org/fundamental-consciousness", "title": "CoFo: Fundamental Consciousness"}]}], "basis": "evidence"}, "dollars_to_change": {"latest": {"year": 2026, "spent": null, "summary": "[evidence] Actual spending unknown; no Form 990, audit or budget found. CoFo states $1.5M in project grants for 2026, against one significance-2 item and supporting items rated 1 to 2, all too early to judge and none yet a change in knowledge or practice."}, "earliest": {"year": 2025, "spent": null, "summary": "[evidence] Actual spending unknown. Visible products are the launch, a vision paper, the RFP and 128 LOIs. No change in the world can be assigned to 2025."}, "north_star": {"defensible": false, "measure": null, "series": [], "limits": "No spending data and no results. A research funder also has no common outcome unit. Dollars per grant or per proposal would be an activity measure, not efficiency.", "what_would_make_it_possible": "Audited spending by program would be the base. Later outcomes could then be tracked, such as validated measures adopted by independent labs, reuse of shared datasets, replicated findings, and outside funding that follows the program. No such measure exists today, and one should not be expected before about 2028-2029."}, "qualitative_judgment": "[inference] A donor so far got a working grant process, not a result. The process drew real interest, selected 14 teams with established research programs, and added a data-sharing condition. Spending in the program can reasonably be read as an option on a new field, one that might yield shared measures and a sharper definition of awakening. Nothing has been learned yet from funded work, and non-grant pillars have shown little.", "strongest_item": "The 14-project cohort with mandatory sharing among grantees. The list is public, two grantees confirm it, and the award count met the stated estimate.", "weakest_item": "Donor advising and CoFlow. Both are claimed as pillars, with no numbers, clients, reports or outputs found.", "basis": "inference"}, "trend": {"change_per_dollar": "insufficient_data", "reporting_direction": "insufficient_data", "rationale": "[evidence] There is no three-to-five-year baseline. The organization's exemption dates from August 2025 and no spending data exists. [inference] Reporting within its short life moved from aims to concrete output counts and a named grantee list, which is more specific but still not outcome reporting. No outcome could yet be reported. The next test is whether 2027-2028 reports describe what grantees found and who used it, or only cohort meetings and paper counts.", "basis": "inference"}, "peer_comparables": [{"peer": "Templeton World Charity Foundation (not in the supplied peer set; funder comparison)", "outcome": "Funded a large adversarial test of two major consciousness theories, published in Nature. It yielded a real if mixed research result: findings that challenged both theories and named no outright winner.", "value_text": "Part of a program described as a $30M commitment. This shows what an outcome-level result looks like for this kind of funder. It came from a far larger program over several years, so it is not a fair like-for-like benchmark for a one-year-old funder.", "year": "2025", "sources": [{"url": "https://eprints.ncl.ac.uk/306545", "title": "Newcastle repository: Nature paper record (search result)"}, {"url": "https://www.templetonworldcharity.org/blog/adversarial-collaboration-drives-breakthroughs-understanding-human-consciousness", "title": "TWCF blog (funder's framing; search result)"}, {"url": "https://www.quantamagazine.org/what-a-contest-of-consciousness-theories-really-proved-20230824/", "title": "Quanta Magazine on the earlier contest results (search result)"}]}, {"peer": "Tiny Blue Dot Foundation", "outcome": "Grant awards only; no outcome found. It funded 12 projects at up to $900,000 each over three years, a much larger award size than CoFo's cap.", "value_text": "Maximum about $10.8M by my arithmetic. The announcement reports no findings. This is an output comparison only.", "year": "2024", "sources": [{"url": "https://prnewswire.com/news-releases/tiny-blue-dot-foundation-announces-the-funding-of-12-neuroscientific-research-projects-related-to-the-science-of-perception-box-302208165.html", "title": "Tiny Blue Dot press release (30 July 2024)"}]}, {"peer": "Mind & Life Institute, Institute of Noetic Sciences, Institute for Advanced Consciousness Studies, Qualia Research Institute, International Society for Contemplative Research", "outcome": "No comparable outcome measure searched out or found for these peers in this pass.", "value_text": "No evidence found. Only one combined search covered Mind & Life, and none specifically covered the other four, so this is not a finding about their records.", "year": null, "sources": []}], "verdict": "In its latest year, The Consciousness Foundation demonstrably ran a real competitive grant call and selected 14 research projects on the science of awakening, but no research result or change in field practice has yet appeared, because the projects were only due to start in September 2026. It can fairly claim full credit for creating the funding call and the cohort's data-sharing condition, and an unknown share of whether the funded work happens at all, since some grantees have other funders. The cost is unknown: CoFo states $1.5M in project grants, about $100,000 of which is confirmed from a grantee's own statement, and no Form 990, audit or payment record exists. There is no meaningful earlier year to compare with. Most of the record rests on CoFo's own word, apart from two grantee confirmations, and its promised 2026 field analyses appear late. A donor today would be funding a plausible early-stage bet on a team and a process, not a demonstrated record of change.", "gaps": ["Correction to the earlier public-record scan: it found no awardee list. CoFo's Substack post of 22 July 2026 names all 14 projects. The scan's statements on award count and awardee list are superseded. CoFo's website program page still names none.", "Actual dollars paid and to whom: no evidence found. Only Melbourne's amount was seen, in search text only, and its overhead treatment is unknown. UVA's page gives no amount and sits on a dev subdomain.", "Total spending and spending by program in 2025 and 2026: no evidence found. No Form 990 data on ProPublica as of 30 October 2026.", "Whether projects actually began in September 2026, and whether the kickoff or quarterly meetings occurred: no evidence found.", "Independent confirmation of the other 12 awards: none found. Targeted searches may miss them, since acknowledgments of new grants are poorly indexed. The post lists Tewarie and Laureys at \"University of Laval\"; this affiliation was not checked.", "Additionality: no evidence on whether funded projects would have proceeded otherwise, or how much of each project CoFo's grant covers.", "Selection independence: the five reviewers are anonymous, and who chose the final 14 from 24 is unnamed. CoFo advisor Shamil Chandaria co-authored a 2025 paper with Ruben Laukkonen, who is PI on one funded project and co-I on another. No evidence of any advisor role in review or of any impropriety was found, and no recusal policy is published. [inference] This overlap is common in a small field, but it is a reason to ask for the conflict policy.", "Construct validity: a named reader comment on the July post argues one tradition's term is being misread as a meditative state. It is not reputable reporting, but it indicates a substantive scholarly question the program will have to handle. No expert review of the portfolio was found.", "Edge Esmeralda residency: CoFo's dollars and role are unknown. No publication from it was confirmed.", "Donor-advising dollars, clients and reports; CoFlow outputs; Bodymind RFP status; other grants outside the first call: no evidence found.", "The 2025 vision paper could not be read as text, so any targets inside it are unassessed.", "Five more comments on the July post and six on the March post were not visible. Newsletter-only releases were not tested.", "No academic citations to CoFo-funded work were found. None would be expected this early."], "documents_that_would_close_gaps": ["FY2025 Form 990 with Schedules A, I and O, and a draft or management accounts for 2026", "Grant ledger: awardee, amount, overhead, agreement date, payment date", "Sample executed grant agreement, including data-sharing terms and reporting duties", "Scoring sheets with identities removed and the written basis for choosing 14 from 24; reviewer conflict policy and recusal record, shared under NDA if needed", "Five-year program plan with any measures of success", "Board-approved 2026 and 2027 budgets by program and the funder breakdown", "Draft State of the Field report and the application analysis, with new publication dates", "Kickoff agenda and attendance, plus first quarterly meeting notes", "Grantee reference calls: would the project have run without this grant, and what share of its budget does the grant cover?", "Donor-advising log: clients, dollars moved, sample impact report", "Support agreement and amount for the Edge Esmeralda residency", "Readable text of the 2025 vision paper"], "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "CoFo Substack: Toward a Science of Awakening: Our First Grantees (22 July 2026)"}, {"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "CoFo Substack: Initial Learnings (24 March 2026)"}, {"url": "https://theconsciousnessfoundation.substack.com/p/toward-a-science-of-awakening", "title": "CoFo Substack: Toward a Science of Awakening (5 November 2025)"}, {"url": "https://theconsciousnessfoundation.substack.com/archive", "title": "CoFo Substack archive"}, {"url": "https://www.cofo.org/rfp", "title": "CoFo RFP"}, {"url": "https://cofo.org/awakening", "title": "CoFo: Science of Awakening"}, {"url": "https://cofo.org/bodymind", "title": "CoFo: Bodymind"}, {"url": "https://cofo.org/fundamental-consciousness", "title": "CoFo: Fundamental Consciousness"}, {"url": "https://cofo.org/approach", "title": "CoFo: Approach"}, {"url": "https://cofo.org/insights", "title": "CoFo: Insights"}, {"url": "https://dev.csc.virginia.edu/news/toward-science-awakening-grant", "title": "UVA Contemplative Sciences Center (31 August 2026)"}, {"url": "https://psychologicalsciences.unimelb.edu.au/CSC/news/csc-secures-international-research-grant", "title": "University of Melbourne CSC (search result only)"}, {"url": "https://www.unimelb.edu.au/newsroom/news/2021/march/university-welcomes-$10-million-gift-for-contemplative-studies-centre", "title": "University of Melbourne: $10 million gift (search result)"}, {"url": "https://www.edgecity.live/blog/a-month-at-the-consciousness-residency-2026", "title": "Edge City: Consciousness Residency recap"}, {"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "James W. Phillips: Bodymind #2 (19 March 2026)"}, {"url": "https://projects.propublica.org/nonprofits/organizations/334334115", "title": "ProPublica Nonprofit Explorer"}, {"url": "https://www.guidestar.org/profile/33-4334115", "title": "GuideStar profile"}, {"url": "https://rubenlaukkonen.substack.com/p/a-beautiful-loop", "title": "Ruben Laukkonen: A beautiful loop (search result)"}, {"url": "https://researchportal.scu.edu.au/esploro/outputs/journalArticle/A-beautiful-loop-An-active-inference/991013303524502368", "title": "A beautiful loop: publication record (search result)"}, {"url": "https://prnewswire.com/news-releases/tiny-blue-dot-foundation-announces-the-funding-of-12-neuroscientific-research-projects-related-to-the-science-of-perception-box-302208165.html", "title": "Tiny Blue Dot press release (30 July 2024)"}, {"url": "https://eprints.ncl.ac.uk/306545", "title": "Newcastle repository: Cogitate Nature paper record (search result)"}, {"url": "https://www.templetonworldcharity.org/blog/adversarial-collaboration-drives-breakthroughs-understanding-human-consciousness", "title": "TWCF blog (search result)"}, {"url": "https://www.quantamagazine.org/what-a-contest-of-consciousness-theories-really-proved-20230824/", "title": "Quanta Magazine (search result)"}, {"url": "https://www.researchgate.net/profile/Ruben-Laukkonen/publication/346993110_From_many_to_none_Meditation_and_the_plasticity_of_the_predictive_mind/links/5fdb5d5fa6fdccdcb8d2ec7f/From-many-to-none-Meditation-and-the-plasticity-of-the-predictive-mind.pdf", "title": "Laukkonen and Slagter paper, ERC funding acknowledgment (search result)"}]}, "landscape": {"field_definition": "[evidence] Specific field: philanthropic grantmaking and coordination for early-stage academic science of (a) \"awakening\", meaning lasting contemplative change in moment-to-moment experience, especially the sense of self; (b) \"bodymind\" mechanisms; and (c) fundamental theories of consciousness. Only (a) has made grants so far.\n\nPopulation: the direct users are senior academic researchers. The RFP limits PIs to professors or equivalents at universities and nonprofit research institutes, and excludes postdocs as PI and retreat centers as lead institution. Philanthropists are the second user group. [inference] The public benefits only distantly and speculatively. CoFo runs no clinical or practitioner service, and Phillips's March 2026 post says it will not run experiments itself.\n\nGeography: US-based, with applicants \"from around the world\". Sanctioned jurisdictions are excluded.\n\nMethod: awards of up to $100,000 in direct costs over up to 24 months, plus overhead capped at 15%, paid as a single disbursement. Awardees join a cohort that meets regularly and shares data. CoFo also plans roadmaps and field reports and advises donors.\n\nOut of scope: research solely on psychedelics, peak experiences or non-ordinary states, and projects that are solely cultural or programmatic.\n\nSources: https://www.cofo.org/rfp ; https://cofo.org/awakening ; https://cofo.org/fundamental-consciousness ; https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness ; https://dev.csc.virginia.edu/news/toward-science-awakening-grant", "problem_trend": {"direction": "contested", "rationale": "\"The problem\" here is a knowledge and funding gap, not a measurable social harm. No prevalence or outcome baseline exists, and I found no time series of funding for awakening research.\n\n[evidence, search summaries] Adjacent research output grew: one Web of Science study counted 16,581 mindfulness publications from 1966 to 2021, with exponential growth since 2006. That is mindfulness, not awakening, and the data ends in 2021.\n\n[evidence] Demand signal: 128 letters of intent and 54 invited teams for an estimated 10-15 awards. CoFo reports these numbers itself. They show researcher appetite at a small award size, not scientific quality.\n\n[evidence, search summaries] Public money is under threat but not shown to be falling. An advocacy group says the President's FY2026 and FY2027 budget requests would eliminate NCCIH, the federal complementary and integrative health center. It says the Senate FY2026 bill held funding at FY2025 levels. An NCCIH notice anticipated $2M in FY2026 for about three mechanistic awards. I did not confirm final appropriations.\n\n[evidence] Scarcity is widely perceived, but the data is old. A 2018 informal survey found many consciousness researchers saw funding and jobs as hard to obtain. A Swedish magazine reports little public investment and more generous private foundations.\n\n[evidence] Legitimacy is disputed. 124 scholars signed an open letter calling integrated information theory pseudoscience, and others contested that label. One letter author argued that funding can create false success stories.\n\n[inference] Interest is rising and federal support is at political risk, but no evidence shows the gap in awakening research widening or narrowing. CoFo's claim that it is not a priority for traditional funders is its own assertion and is only partly corroborated.", "basis": "inference", "sources": [{"url": "https://thim.mijn.bsl.nl/trends-and-developments-in-mindfulness-research-over-55-years-a-/19369330", "title": "Trends and developments in mindfulness research over 55 years (search result)"}, {"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "CoFo: Initial Learnings from our Science of Awakening Grant Program (24 March 2026)"}, {"url": "https://www.cofo.org/rfp", "title": "CoFo: Toward a Science of Awakening RFP"}, {"url": "https://cofo.org/awakening", "title": "CoFo: The Science of Awakening"}, {"url": "https://www.aacom.org/news-reports/news/2026/06/01/take-action-today---champion-nih--nccih-and-osteopathic-funding", "title": "AACOM: Champion NIH, NCCIH and Osteopathic Funding (1 June 2026; advocacy)"}, {"url": "https://www.aacom.org/news-reports/news/2026/05/18/protect-nih-funding--preserve-nccih-and-increase-osteopathic-research-funding---take-action-today!", "title": "AACOM: Protect NIH Funding, Preserve NCCIH (18 May 2026; advocacy)"}, {"url": "https://www.nccih.nih.gov/research/blog/nccih-reissues-funding-initiatives-for-phased-awards-of-mechanistic-studies-to-optimize-mind-and-body-interventions", "title": "NCCIH: reissued funding initiatives for mechanistic studies (search result)"}, {"url": "https://www.frontiersin.org/articles/10.3389/fpsyg.2018.02134/text", "title": "Frontiers in Psychology 2018: informal survey of consciousness science (search result)"}, {"url": "https://fof.se/artikel/scientists-portrayed-as-mass-murderers/", "title": "Forskning & Framsteg: report on the consciousness science dispute (search result)"}, {"url": "https://theconversation.com/nobody-knows-how-consciousness-works-but-top-researchers-are-fighting-over-which-theories-are-really-science-214074", "title": "The Conversation: researchers fighting over which theories are really science (search result)"}]}, "peers": [{"name": "Mind & Life Institute", "ein": "77-0284767", "website": "https://www.mindandlife.org", "relationship": "larger_incumbent", "how_they_differ": "[evidence] The established contemplative-science institution. Its grants are small: Varela, Hanser, BESS and Dill awards of $25,000, against CoFo's $100,000 ceiling. It targets developing scholars, and the search summary ties eligibility to its Summer Research Institute. CoFo targets senior PIs. Mind & Life also seeded the International Society for Contemplative Research (ISCR). [inference] Closest competitor for donors who want contemplative science, but with a broader remit than awakening.", "scale_note": "[evidence] FY2024 revenue $3,458,858, expenses $3,250,344, assets $9,223,026 (ProPublica). Revenue range 2020-2024: $3.0M to $5.1M. 2018 annual report: $704,246 across 20 projects. More than 90% of budget from charitable contributions, per its site.", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/770284767", "title": "ProPublica: Mind And Life Institute"}, {"url": "https://www.mindandlife.org/grants/current-research-grants/", "title": "Mind & Life: Current Research Grants"}, {"url": "https://media.mindandlife.org/email/2018-MindAndLife-AnnualReport.pdf", "title": "Mind & Life 2018 Annual Report (search result)"}, {"url": "https://mindandlife.org/support-us/", "title": "Mind & Life: Support Us (search result)"}]}, {"name": "Tiny Blue Dot Inc (Tiny Blue Dot Foundation)", "ein": "46-4924931", "website": null, "relationship": "larger_incumbent", "how_they_differ": "[evidence] A private foundation filing 990-PF, with awards up to $900,000 over three years on its \"Science of Perception Box\" framework. Its topics lean toward neuroscience and mental health, including psychedelics, VR therapy, breathwork and mindfulness studies. It has its own endowment, while CoFo solicits gifts as a public charity. [inference] Overlaps at the edges and is the largest private funder I could document. It does not target awakening as a construct. It is a possible co-funder, not a rival for donors.", "scale_note": "[evidence] FY2024 charitable disbursements $8,606,723, total assets $79,200,555, revenue $5,769,967 (ProPublica). A September 2025 release claims more than $40M awarded to date. CoFo's stated 2026 grant program is about one-sixth of its 2024 disbursements.", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/464924931", "title": "ProPublica: Tiny Blue Dot Inc"}, {"url": "https://finanzen.net/nachricht/aktien/tiny-blue-dot-foundation-opens-fourth-round-of-global-research-funding-on-the-science-of-perception-box-14792139", "title": "Tiny Blue Dot: fourth funding round release, 2 September 2025 (search result)"}]}, {"name": "Templeton World Charity Foundation", "ein": null, "website": "https://www.templetonworldcharity.org", "relationship": "larger_incumbent", "how_they_differ": "[evidence] Lists Accelerating Research on Consciousness as a current initiative, using adversarial collaboration and open science. This overlaps most with CoFo's Fundamental Consciousness program. Its Science of Religious and Spiritual Exercises initiative funds meditation, prayer and fasting research across traditions, which overlaps with CoFo's stated gap on non-Buddhist traditions. That 2023 call is closed, and I found no open consciousness call on its priorities page. [inference] It reaches the same scholars with larger grants, but it does not solicit public gifts. No EIN found; the initiative list suggests Bahamas ties, and legal domicile was not checked.", "scale_note": "[evidence, search results, 2023] Spiritual Exercises: $5M to 12 grants, plus a further call of up to $3M, with grants up to $260,000 or $500,000 over three years. Consciousness initiative described as \"multimillion dollar\" from 2019. Total foundation budget not established.", "sources": [{"url": "https://www.templetonworldcharity.org/our-priorities", "title": "TWCF: Our Priorities"}, {"url": "https://www.templetonworldcharity.org/our-priorities/science-religious-and-spiritual-exercises-RFP", "title": "TWCF: Spiritual Exercises RFP, now closed (search result)"}, {"url": "https://research-authority.tau.ac.il/sites/resauth.tau.ac.il/files/Templeton%20World%20Charity%20SoRSE%20RFP%202023.pdf", "title": "TWCF 2023 SoRSE RFP (search result)"}, {"url": "https://templetonworldcharity.org/blog/templeton-world-charity-foundation-announces-recently-awarded-accelerating-research", "title": "TWCF: Accelerating Research grants announced (search result)"}]}, {"name": "Institute of Noetic Sciences", "ein": "23-7236986", "website": "https://noetic.org", "relationship": "direct_competitor", "how_they_differ": "[evidence] A long-running 501(c)(3) with its own audited statements posted online. [inference, from what I know of its public profile and not checked in this pass] It operates its own research and public programs and does not act mainly as a regrantor, and its topics are more heterodox. It competes for the same consciousness-minded donors, not for the same academic outcomes.", "scale_note": "[evidence] FY ending June 2025: revenue $2,453,927, expenses $3,625,396, assets $19,229,601 (ProPublica). Revenue fell from $5.36M in FY2023. The FY2022 peak of $12.87M included $9.11M from asset sales.", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/237236986", "title": "ProPublica: Institute of Noetic Sciences"}, {"url": "https://noetic.org/wp-content/uploads/2022/07/FYE-Jun-30-2021-Audited-Financial-Statements-Issued-1.15.2022.pdf", "title": "IONS audited financial statements, FY2021 (search result)"}]}, {"name": "Institute for Advanced Consciousness Studies", "ein": "84-3926982", "website": null, "relationship": "complement", "how_they_differ": "[evidence] A Santa Monica research lab, not a funder. An aggregator lists a Tiny Blue Dot grant of about $647,659 in 2023 for enhancing meditative states with non-invasive technology, and the Survival and Flourishing Fund gave $379,000 in general support in January 2023. Those figures are not checked against 990s. [inference] It is the kind of nonprofit institute CoFo's RFP makes eligible. A donor who wants direct technical work could fund it with no intermediary. Its existence also undercuts the claim that no other organization does technoscientific work here.", "scale_note": "[evidence] FY2024 revenue $1,805,696, expenses $1,245,798, net assets $978,937 (ProPublica). Revenue grew in 2023 and 2024.", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/843926982", "title": "ProPublica: Institute for Advanced Consciousness Studies"}, {"url": "https://impala.digital/public/profiles/84-3926982/overview", "title": "Impala: IACS overview (search result)"}, {"url": "https://www.longtermwiki.com/grants/rnUcJoDLVE", "title": "LongtermWiki: General Support grant to IACS (search result)"}]}, {"name": "Qualia Research Institute", "ein": "82-5457325", "website": "https://qri.org", "relationship": "upstart", "how_they_differ": "[evidence] A small independent research nonprofit founded in 2018 that does its own consciousness research. It shares board member David Langer with CoFo, per the entity map, which found no money or control link. [inference] Same donor circle, different model: a lab, not a grantmaker. Revenue is thin and volatile, so a modest gift would matter more there, with more organizational risk.", "scale_note": "[evidence] FY2024 revenue $140,681, expenses $291,314, net assets $157,564. Revenue was $607,577 in 2021, and net assets have fallen every year since (ProPublica).", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/825457325", "title": "ProPublica: Qualia Research Institute"}, {"url": "https://wiki.qri.org/", "title": "QRI wiki (search result)"}]}, {"name": "International Society for Contemplative Research", "ein": "87-1367830", "website": null, "relationship": "coalition_partner", "how_they_differ": "[evidence] The field's professional society, seeded by a Mind & Life development grant. CoFo debuted its first call at ISCR's meeting. A search summary shows it advertising a subtle-energy fellowship of up to $50,000; the summary does not name the funder. [inference] It holds the convening role CoFo also wants, on far less money. CoFo's \"coordination\" work could help it or crowd it out. No formal partnership was found.", "scale_note": "[evidence] FY2024 revenue $95,035, expenses $170,018, net assets -$72,030 (ProPublica; listed under Canada). A Donorbox page showed a $250,000 goal and $0 raised at capture.", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/871367830", "title": "ProPublica: International Society For Contemplative Research"}, {"url": "https://www.mindandlife.org/grant/international-society-for-contemplative-research/", "title": "Mind & Life: grant to ISCR (search result)"}, {"url": "https://donorbox.org/https-iscrsociety-org-wp-content-uploads-2026-10-iscr-society-sep-26-update-pdf", "title": "ISCR Donorbox page (search result)"}, {"url": "https://x.com/contemresearch?lang=en", "title": "ISCR on X (search result)"}]}], "differentiation": {"position": "follower", "rationale": "Decision: a new, small entrant with one distinctive niche. It is not a leader, because no research results from its grants exist yet: projects were due to start only in September 2026. It is not a pure duplicate. Of the enum options, \"follower\" fits its scale and the fact that others got there first; it does not mean CoFo copies them.\n\nWhat is distinctive:\n- [evidence] An RFP aimed at awakening as a construct. I found no other call with that target, though my search was not exhaustive.\n- [evidence] A $100,000 ticket that sits between Mind & Life's $25,000 and Tiny Blue Dot's $900,000.\n- [evidence] Awardees agree to share data within a cohort. UVA describes this as a departure from the usual \"hub and spoke\" funding model.\n\nWhat is not distinctive:\n- [evidence] Fundamental Consciousness overlaps with Templeton World Charity's adversarial collaborations and is still \"being shaped\".\n- [evidence] Coordination overlaps with ISCR and with Mind & Life's convening role.\n- [evidence] Tiny Blue Dot and Templeton World Charity already fund meditation and contemplative practice research.\n\nThe March 2026 statement by Phillips that no other organization focuses on technoscientific research in this space is a personal view. [inference] Tiny Blue Dot's reported grant to the Institute for Advanced Consciousness Studies suggests it is overstated, at least if read broadly.\n\nThe real test is the shared definitions, standards and data the cohort is meant to produce. None exists yet.", "basis": "inference", "confidence": 0.6}, "counterfactual": {"if_org_disappeared": "[inference] Near-term harm would be small and fall on coordination, not on science already funded. The RFP pays awards as a single disbursement to the PI's institution within 60 days of award notification and compliance. If those payments were made, the 2026 cohort's projects would likely continue. I could not confirm payment.\n\nWhat would be lost:\n- [inference] The cohort meetings, data-sharing arrangement and planned roadmap.\n- [evidence for the plan; inference for the loss] The State of the Field report, the Bodymind report and the Fundamental Consciousness report and research map.\n- [inference] The only visible awakening-specific funding call, along with Bodymind's first RFP, which is still undelivered.\n\nThe organization has less than two years of track record, and no research outcome from it exists yet. Researchers would be returning to the funding environment they had in 2025.", "who_absorbs": "[inference] No one absorbs the whole thing, and parts could move.\n- Mind & Life could take some early-career work, at $25,000 per award.\n- Tiny Blue Dot could take proposals that fit its framework. A listing shows an October 2026 deadline.\n- Templeton World Charity could take adjacent senior proposals when it opens calls. No open call was visible.\n- ISCR is the natural home for convening but had negative net assets of $72,030 at end-2024.\n\n[speculation] If the chair is the main funder, as the X post suggests, the same capital might simply fund scientists directly or through another vehicle. In that case most of the money survives the organization's disappearance.", "if_gift_does_not_arrive": "Not determinable as of 30 October 2026. CoFo publishes no budget, funding gap or fundraising target, so no specific deliverable can be tied to a gift.\n\n[inference] A new gift probably would not fund the 2026 cohort, because awards were already issued and projects were due to start in September 2026. Its marginal uses would be a second awakening round, the first Bodymind RFP, the Fundamental Consciousness program, or operating costs.\n\n[evidence] A concrete unit: $115,000 funds one project at the ceiling ($100,000 direct plus 15% overhead). The first round invited 54 teams for an estimated 10-15 awards, so roughly 39-44 invited teams went unfunded (my arithmetic). Their quality is unknown.\n\n[speculation] If the chair backstops the budget, an outside gift may just displace the chair's money and fund nothing additional. Ask CoFo directly: what is the committed 2027 budget without you, and what specifically changes with your gift?", "basis": "inference", "confidence": 0.55, "sources": [{"url": "https://www.cofo.org/rfp", "title": "CoFo: RFP"}, {"url": "https://cofo.org/awakening", "title": "CoFo: The Science of Awakening"}, {"url": "https://cofo.org/bodymind", "title": "CoFo: Bodymind"}, {"url": "https://cofo.org/fundamental-consciousness", "title": "CoFo: Fundamental Consciousness"}, {"url": "https://cofo.org/donate", "title": "CoFo: Donate"}, {"url": "https://www.mindandlife.org/grants/current-research-grants/", "title": "Mind & Life: Current Research Grants"}, {"url": "https://www2.fundsforngos.org/?p=493871", "title": "Listing: Tiny Blue Dot call, deadline 5 October 2026 (search result)"}, {"url": "https://projects.propublica.org/nonprofits/organizations/871367830", "title": "ProPublica: ISCR"}]}, "right_unit": {"verdict": "Depends on what the donor is buying.\n\nFor awakening science specifically, CoFo is the right unit today, because I found no other vehicle dedicated to it. But it is not ready for a large unrestricted gift. Give program-restricted money, in tranches, tied to a named deliverable such as a second-round cohort or the shared measurement standards, and only after seeing a budget and the first 990 or internal financials.\n\nFor contemplative science broadly, Mind & Life is the safer unit, on the strength of its filings and grant history. For direct technical work, consider funding a lab directly.", "alternatives": ["Mind & Life Institute: broader contemplative science, multi-year 990s, $25,000 early-career awards.", "CoFo's unfunded finalists, funded directly: ask for a list of invited teams, or give to a university center such as UVA's Contemplative Sciences Center. CoFo's review would do the screening, and the donor would skip the intermediary layer.", "Institute for Advanced Consciousness Studies: a lab model for technical meditation research at $1.2M in annual expenses.", "ISCR: field infrastructure on about $170,000 in expenses. A small gift would be material, but check its negative net assets first.", "Co-funding through Tiny Blue Dot or Templeton World Charity: no evidence either accepts co-funding. Worth a call, not a plan.", "Policy: defending NCCIH appropriations would protect more money than this field's philanthropy, but only AACOM's advocacy surfaced here. NCCIH funds mind-body research broadly, not awakening, and I did not evaluate any advocacy vehicle."], "rationale": "[inference] CoFo's value proposition is coordination plus curation: selecting grantees, then making them share data. A donor pays for that layer only if it produces something individual grants would not. That output is promised and not yet visible, and the State of the Field report listed for Q3 2026 had no link when the entity map checked it on 30 October 2026.\n\n[evidence] The 128 letters of intent were heavily weighted toward self-report measures and Buddhist practitioners, and the field lacks common definitions and data repositories, per CoFo's own analysis. If that diagnosis is right, it supports a field-building intermediary and not more isolated lab grants. The diagnosis comes from the party that benefits from it.\n\n[inference] CoFo's donor-advising offer may have value even without a gift, but it creates a conflict: the adviser also solicits gifts for itself.", "basis": "inference"}, "funder_landscape": {"known_funders": [{"name": "Chair of CoFo (Winslow Strong, in that professional role)", "note": "[evidence, second-hand] The entity map's search-result summary of the July 2025 X post says the chair would commit substantial time and capital. Amount unconfirmed. [inference] Likely an early funder of the subject. No other funder of CoFo is named on the donate page, Substack or RFP.", "sources": [{"url": "https://cofo.org/donate", "title": "CoFo: Donate (no donors named)"}]}, {"name": "Tiny Blue Dot Inc", "note": "[evidence, aggregators] Funds peers and universities, including the Institute for Advanced Consciousness Studies and UW-Madison. No link to CoFo found.", "sources": [{"url": "https://grantedai.com/foundations/tiny-blue-dot-inc", "title": "Granted AI: Tiny Blue Dot (search result; figures unverified)"}, {"url": "https://impala.digital/public/profiles/84-3926982/overview", "title": "Impala: IACS (search result)"}]}, {"name": "Survival and Flourishing Fund", "note": "[evidence, aggregator] $379,000 general support to the Institute for Advanced Consciousness Studies, January 2023. No CoFo grant appeared in search excerpts; I did not review its full recommendation lists.", "sources": [{"url": "https://www.longtermwiki.com/grants/rnUcJoDLVE", "title": "LongtermWiki: General Support (search result)"}, {"url": "https://survivalandflourishing.fund/", "title": "Survival and Flourishing Fund (search result)"}]}, {"name": "Fidelity Charitable and other donor-advised funds", "note": "[evidence, aggregators] Listed as $175,000 to Qualia Research Institute and as a funder of the Institute for Advanced Consciousness Studies. [inference] Individual donors using donor-advised funds are important in this niche, and their identities are hidden.", "sources": [{"url": "https://www.causeiq.com/organizations/qualia-research-institute,825457325/", "title": "Cause IQ: QRI (search result)"}, {"url": "https://impala.digital/public/profiles/84-3926982/overview", "title": "Impala: IACS (search result)"}]}, {"name": "BESS Family Foundation; family of Laurisa S. Dill", "note": "[evidence] Named supporters of Mind & Life research awards at $25,000 each.", "sources": [{"url": "https://www.mindandlife.org/grants/current-research-grants/", "title": "Mind & Life: Current Research Grants"}]}, {"name": "Paul Tudor Jones II and Sonia Jones", "note": "[evidence, search results] $12M founding gift (2012) and a $40M lead gift for the Contemplative Commons at UVA's Contemplative Sciences Center, a CoFo grantee. These dwarf CoFo's grants, and this level of money reaches universities directly.", "sources": [{"url": "https://csc.virginia.edu/news/uva-launch-contemplative-sciences-center", "title": "UVA: launch of Contemplative Sciences Center (search result)"}, {"url": "https://giving.virginia.edu/where-to-give/contemplative-sciences-center", "title": "UVA Giving: Contemplative Sciences Center (search result)"}]}, {"name": "Templeton World Charity Foundation", "note": "[evidence] Direct funder of consciousness and spiritual-practice research, and of field-building such as a $234,000 grant to help US consciousness researchers compete for NIH and NSF funding (2020). No link to CoFo found.", "sources": [{"url": "https://www.templetonworldcharity.org/our-priorities", "title": "TWCF: Our Priorities"}, {"url": "https://news.uci.edu/2020/12/08/megan-peters-receives-twco-grant-to-help-consciousness-researchers-secure-funding/", "title": "UCI: Megan Peters TWCF grant (search result)"}]}], "concentration_note": "[inference] CoFo's funding is probably concentrated in the chair and a few individuals. This rests on the X post summary, a founding date of 2025, no named institutional funder, and a staff member asking readers in March 2026 to connect the organization with philanthropists. It is unverified until a 990 and Schedule A are available. High concentration would also raise the public-support-test question the entity map flagged.", "sophisticated_funders_present": "Present in the field, absent from CoFo's public record. Tiny Blue Dot and Templeton World Charity fund the field directly, and no institutional funder is publicly tied to CoFo. Absence of disclosure does not prove absence. The organization names no donors at all, so this is not a negative signal yet. It does mean no outside diligence can be borrowed.", "departures": "No evidence of any funder leaving CoFo; it is too young to have a history. I looked on CoFo's site, its Substack and through searches. For peers, [evidence] Qualia Research Institute revenue fell from $607,577 (2021) to $140,681 (2024), and IONS revenue fell from $5.36M (FY2023) to $2.45M (FY2025). The filings do not show who stopped giving or why. Templeton World Charity's initiative remains listed as current with no open call visible; I cannot tell whether that is a pause or normal cycle timing.", "basis": "inference"}, "room_for_funding": {"verdict": "Modest gifts can be absorbed mechanically. Large gifts are not supportable on current evidence. Decision: up to roughly one or two cohort-equivalents ($115,000 to about $1.5M depending on the donor's capacity), restricted and in tranches, and only with a budget in hand. Above $1.5M, a gift would exceed the entire stated 2026 grant program, and it would probably sit in reserves unless a dated second round or Bodymind RFP exists.", "last_big_increase": "None observable. No 990 data exists for EIN 33-4334115 (financial extract), and CoFo publishes no prior-year figures. The organization has no revenue history to judge.", "rationale": "For absorption:\n- [evidence] Demand exceeded supply: 54 invited teams against an estimated 10-15 awards.\n- [evidence] Bodymind and Fundamental Consciousness have no published grant calls. Each could take money once designed.\n- [evidence] The first round appears to have run close to schedule. The RFP promised awards in May 2026 and starts in September. A grantee post appeared on 22 July (the archive shows no year; 2026 inferred), and UVA announced its award on 31 August 2026.\n- [evidence] Regranting at $100,000 plus 15% overhead is a simple way to deploy money.\n\nAgainst:\n- [evidence] $1.5M in 2026 project grants is the only stated scale, and there is no stated budget, reserve policy or funding target.\n- [evidence] The donate page has no overhead policy. The 15% cap applies to grantees' institutions, not to CoFo's own costs.\n- [evidence] Non-grant outputs lag or remain plans: State of the Field was overdue as of the entity map's check, Bodymind's RFP has no date, and Fundamental Consciousness is still being shaped.\n- [inference] A small team, with a chief operating officer whose full-time status the entity map could not confirm, is running three programs plus donor advising. Rapid growth would strain it.\n- [inference] There is no evidence yet that the first cohort's science or data-sharing works. Results are unlikely before 2028 on a 24-month grant.\n\n[speculation] Displacement of the chair's capital is the biggest risk to additionality. Test this before sizing the gift.", "basis": "inference", "confidence": 0.5}, "gaps": ["Grantee list and actual dollars awarded. A CoFo Substack post titled \"Toward a Science of Awakening: Our First Grantees\" (22 July; year not shown, 2026 inferred) appears in the archive, but I could not retrieve its text. This also updates the entity map: CoFo's /awakening page states $1.5M in 2026 project grants, a planned figure, not a confirmed total. Actual awards and disbursements are unverified.", "CoFo's revenue, expenses, reserves, overhead, staff costs, runway and donor mix: no 990, audit or budget found. ProPublica has no filing data (financial extract). Ask for the determination letter, board-approved 2026 and 2027 budgets, and the first 990 when filed.", "How much of CoFo's funding comes from the chair, and whether an outside gift would be additive: no evidence found beyond a search-result summary of an X post.", "Whether any institutional funder backs CoFo: no evidence found on the site, Substack, or in searches. I did not review full Survival and Flourishing Fund recommendation lists or foundation 990-PF grant schedules.", "A funding time series for awakening or contemplative research: no evidence found. Final FY2026 and FY2027 NCCIH appropriations were not confirmed; those search results were advocacy pages and grant listings.", "Independent views of CoFo's grant selection or field standing: no evidence found. No researcher, peer funder or declined applicant was found assessing it. The demand figures and the field-gap analysis are self-reported.", "Whether Mind & Life's $704,246 grant figure remains representative: it dates from 2018, and I did not find a current grant total. Tiny Blue Dot's and Templeton World Charity's current meditation-specific totals were also not established. Aggregator totals for Tiny Blue Dot conflict, so I relied on ProPublica for its disbursements.", "Templeton World Charity's legal entity and EIN: not found. A later side-by-side should expect no 990 data for it. Whether any other awakening-specific funding call exists: none found, but the search was not exhaustive, so the uniqueness claim is provisional.", "Some items rest on search summaries, not pages I read: the mindfulness publication counts, NCCIH notices, Tiny Blue Dot's 2025 release, IACS grant figures and the ISCR fellowship. The Tiny Blue Dot award release returned HTTP 403. The University of Melbourne USD 100,000 grant is carried from the entity map, not reverified. It matches the $100,000 ceiling.", "Convergent Research (EIN 88-3013217; FY2025 revenue $112.7M per ProPublica) is not listed as a peer. Phillips compares CoFo to it loosely, and it is a model analog in science philanthropy, not a field peer. Including it would distort any financial comparison."], "sources": [{"url": "https://www.cofo.org/rfp", "title": "CoFo: Toward a Science of Awakening RFP"}, {"url": "https://cofo.org/awakening", "title": "CoFo: The Science of Awakening"}, {"url": "https://cofo.org/bodymind", "title": "CoFo: Bodymind"}, {"url": "https://cofo.org/fundamental-consciousness", "title": "CoFo: Fundamental Consciousness"}, {"url": "https://cofo.org/program-areas", "title": "CoFo: Program Areas"}, {"url": "https://cofo.org/approach", "title": "CoFo: Approach"}, {"url": "https://cofo.org/donate", "title": "CoFo: Donate"}, {"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "CoFo Substack: Initial Learnings (24 March 2026)"}, {"url": "https://theconsciousnessfoundation.substack.com/archive", "title": "CoFo Substack: archive"}, {"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "James W. Phillips: Bodymind #2 (19 March 2026)"}, {"url": "https://dev.csc.virginia.edu/news/toward-science-awakening-grant", "title": "UVA Contemplative openly. Reviewers are not named and the RFP's scoring criteria carry no published weights.", "basis": "evidence", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "Our First Grantees"}, {"url": "https://www.cofo.org/rfp", "title": "RFP"}]}, {"value": "Coordination is bought cheaply and made a condition of the money", "evidence": "Awards are capped at $100,000 over up to 24 months with 15% overhead. Awardees join a cohort with an in-person kickoff and quarterly Zoom meetings, and share data and results. My reading: a small funder is using grant conditions to gain influence over how a field organizes.", "basis": "inference", "sources": [{"url": "https://www.cofo.org/rfp", "title": "RFP"}, {"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "Our First Grantees"}]}, {"value": "Science as the route to legitimacy, with purely cultural work kept out of grants so far", "evidence": "The RFP excludes projects consisting solely of cultural or programmatic activities and research exclusively on psychedelics. The mission still ends in culture and society.", "basis": "evidence", "sources": [{"url": "https://www.cofo.org/rfp", "title": "RFP"}, {"url": "https://cofo.org/about", "title": "About"}]}, {"value": "Selective disclosure: open about the field and the work, closed about money and governance", "evidence": "Published: applicant counts, method counts, project titles and investigators. Not found: dollars per grant, funders, full board, reviewers or budget. The $1.5M plan is the only program total found.", "basis": "evidence", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "Initial Learnings"}, {"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "Our First Grantees"}, {"url": "https://cofo.org/awakening", "title": "Science of Awakening"}]}, {"value": "Grantmaking execution comes before publishing and before the secondary programs", "evidence": "The first RFP ran from November 2025 to named awardees in July 2026, close to its published timeline. The State of the Field report, promised analysis and Bodymind RFP lag behind. This pattern comes from one cycle, so it is thin.", "basis": "inference", "sources": [{"url": "https://www.cofo.org/rfp", "title": "RFP"}, {"url": "https://cofo.org/insights", "title": "Insights"}, {"url": "https://theconsciousnessfoundation.substack.com/archive", "title": "CoFo Substack archive"}]}, {"value": "Tolerance for overlapping roles among a small network", "evidence": "A job listing describes the Executive Director leading both Holon and CoFo. Percy is listed as CoFo's Fundamental Consciousness Lead and, per a January 2026 podcast page, as Director of the CoSentience Initiative, where CoFo board member Langer also sits on the board. No public policy explains how these overlaps are managed.", "basis": "inference", "sources": [{"url": "https://www.idealist.org/es/ong-empleo/c8495f83dddd44ef8f853f7e81ad3bf4-chief-of-staff-the-consciousness-foundation-london", "title": "Idealist Chief of Staff listing (search snippet)"}, {"url": "https://www.prism-global.com/podcast/chris-percy-computational-functionalism", "title": "PRISM podcast"}, {"url": "https://cofo.org/team/david-langer", "title": "David Langer bio"}]}], "money_stance": {"summary": "Capital-allocator stance: relational and unembarrassed, not scarcity-driven and not donor-flattering. The language is 'we direct philanthropic capital', not appeals for help. The donate page gives no case for giving, no impact claim and no gift levels. The only explicit ask found is a network request on a staff blog: 'please connect us!'. There is real cost discipline toward grantees, with a 15% overhead cap and a $100,000 award cap. Its own money is opaque: a reader's public question about funds distributed has no answer in the visible post, and the grantee post gives no amounts. The reading is that money comes through relationships and insiders, not public fundraising. The insider part rests on the chair's reported capital commitment and on the bio statement that Langer's two firms donate profits to consciousness research among other causes; no source says those gifts reach CoFo.", "basis": "inference", "confidence": 0.55, "sources": [{"url": "https://cofo.org/donate", "title": "Donate"}, {"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "Bodymind #2"}, {"url": "https://www.cofo.org/rfp", "title": "RFP"}, {"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "Initial Learnings"}, {"url": "https://x.com/winslow_strong/status/1948483311522709759", "title": "Chairman's announcement (search result only)"}, {"url": "https://cofo.org/team/david-langer", "title": "David Langer bio"}]}, "donor_stance": {"summary": "Donors are treated as aligned partners to be advised, a peer group rather than an audience to persuade. The site offers 'bespoke' advising, impact reports and events, and advises 'aligned donors'. No sample report, client count or named donor was found. Donors may direct a gift to a program by memo or email, which suggests flexibility on restriction, at least in form. No flattery or donor recognition language was found. Implication: a serious donor will probably get access and can probably negotiate reporting terms. That is a reasonable expectation, not an observed fact. Public materials do not yet show what donors receive.", "basis": "inference", "confidence": 0.5, "sources": [{"url": "https://cofo.org/approach", "title": "Approach"}, {"url": "https://cofo.org/about", "title": "About"}, {"url": "https://cofo.org/donate", "title": "Donate"}]}, "risk_and_growth": {"summary": "High intellectual ambition, moderate per-bet risk, broad scope. The topic carries reputational risk and the stated stakes are large ('steering the future of civilization'), yet each award is at most $100,000 and the money spans 14 projects. Risk is taken inside the portfolio: one funded project tests 5-MeO-DMT in expert meditators and another is titled 'A Mathematical Physics of Awakening'. Growth is horizontal: three programs and five pillars on a listed team of seven including the chair and a board member, with a job listing suggesting at least one part-time-by-design support role. Stated plans run beyond grants to position papers, reports, a podcast, field-wide funding coordination and a metacrisis paper. No risk register, failure criteria or reserves statement was found. The program pages fetched have no risk section. Phillips's blog is the one place where evidence risk gets frank treatment.", "basis": "inference", "confidence": 0.6, "sources": [{"url": "https://www.cofo.org/rfp", "title": "RFP"}, {"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "Our First Grantees"}, {"url": "https://cofo.org/fundamental-consciousness", "title": "Fundamental Consciousness"}, {"url": "https://cofo.org/about", "title": "About"}, {"url": "https://cofo.org/bodymind", "title": "Bodymind"}, {"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "Bodymind #2"}]}, "theory_of_change": {"in_their_words": "Mission: foster progress in consciousness science 'so that inner development becomes a primary pillar of society'. Mechanism: rigorous understanding of awakening is 'the first step in a cascade leading to powerful individual and cultural change'. Near term: 'coordination as the highest-leverage next move'. End state: 'operationalize and democratize awakening'.", "theory_of_power": "Inference. Power here comes from setting the agenda in a small, underfunded field. Whoever funds early can shape definitions, measures, shared data and the roadmap, and science then lends legitimacy that flows into culture and policy. The evidence: a working definition of awakening is set by the funder because 'a consensus scientific definition for awakening does not exist'; grants carry cohort and data-sharing terms; a 'field-consensus research roadmap' is planned; and the third program lists coordinating 'field-wide funding'. Influence moves from funders and credentialed researchers outward. Traditions and practitioners appear mainly as study populations or as sources to reach through outreach. No governing role for practitioners, participants or the public was found. The cascade's later steps, from legibility to mass access and cultural change, have no stated mechanism in the sources read. The vision paper could not be read and may supply one.", "basis": "inference", "sources": [{"url": "https://cofo.org/about", "title": "About"}, {"url": "https://cofo.org/awakening", "title": "Science of Awakening"}, {"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "Initial Learnings"}, {"url": "https://www.cofo.org/rfp", "title": "RFP"}, {"url": "https://cofo.org/fundamental-consciousness", "title": "Fundamental Consciousness"}]}, "metaphors": [{"metaphor": "Frontier and exploration", "example": "'frontier scientists', 'edges of consciousness', 'Emerging Frontier'", "reveals": "A self-image as first movers on neglected ground. It justifies small, early, high-variance bets.", "hides": "Prior occupants: contemplative traditions, earlier funders and existing institutions.", "url": "https://cofo.org"}, {"metaphor": "Catalyst", "example": "'Catalyzing breakthroughs'; 'awaiting catalytic coordination'", "reveals": "A theory of leverage: small inputs trigger large reactions, and CoFo is not itself the reaction.", "hides": "Attribution. A catalyst claims credit for outcomes others produce, and nothing is measured to show the effect.", "url": "https://cofo.org/bodymind"}, {"metaphor": "Engineering and machinery", "example": "'ARPA-inspired' 'flywheel'; 'infrastructure'; 'bootstrapping'; 'operationalize'", "reveals": "A real commitment to measures, standards and tractable problems.", "hides": "Whether awakening survives being operationalized. A published critique argues secular operationalization has little relationship to traditional Buddhist constructs. No CoFo engagement with that argument was found.", "url": "https://cofo.org/approach"}, {"metaphor": "Game or strategy", "example": "'the opening move in our broader mission'", "reveals": "Long-horizon, sequenced thinking. Grants are a first step in a larger plan.", "hides": "The rest of the plan, which is not published in a form found here, and who the opposing side is, if any.", "url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science"}, {"metaphor": "Cartography and intelligence", "example": "'field intelligence', 'shared maps', 'research map', 'landscape analysis'", "reveals": "Information advantage as a core asset and basis for donor advising.", "hides": "Who owns the map and what the mapmaker leaves off. The main map, the State of the Field report, was not found published.", "url": "https://cofo.org"}, {"metaphor": "Cascade and pillar", "example": "'first step in a cascade'; 'primary pillar of society'", "reveals": "Civilizational scale of ambition and an inevitable-seeming flow from knowledge to culture.", "hides": "The intermediate steps, the institutions that would have to change, and the people who may not want this.", "url": "https://cofo.org/awakening"}, {"metaphor": "Ecosystem and flourishing", "example": "'thriving ecosystem'; 'flourishing of life'; 'nurture and build'", "reveals": "A care orientation and a field-building self-image, softening the engineering register.", "hides": "Competition and selection. A funder also decides which parts of the ecosystem live.", "url": "https://cofo.org/approach"}, {"metaphor": "The sacred", "example": "'a deep reverence for the sacredness of consciousness'", "reveals": "A motivating commitment held by the organization and stated as a team trait.", "hides": "The fit with claims of agnosticism, and whether a staff member or reviewer could hold a deflationary view.", "url": "https://cofo.org/about"}], "figure_and_ground": {"always_in_frame": ["The field as protagonist: its earliness, gaps, needed standards and infrastructure.", "Rigor vocabulary: measures, preregistration, standards, repositories.", "Scale of stakes: 'grand challenges', 'future of civilization', 'metacrisis', 'pillar of society'.", "Coordination, with CoFo as convener and catalyst.", "The neglect thesis: too little funding for something very important.", "Technology as an ally: AI for theorizing, 'introspective technologies', tools for sensing and influencing processes."], "never_mentioned": ["Harm from intensive practice: no treatment of adverse effects, destabilization or difficult experiences in the RFP, Initial Learnings, the Bodymind post or the program pages read. 'Safe' appears only as an aim and 'ethical protocols' only in passing.", "Other funders by name: the posts read do not mention them, though search results show Templeton World Charity, Mind Science Foundation and the Faggin Foundation funding consciousness research.", "CoFo's own funding model, funders, budget and how long its money lasts.", "How CoFo itself will be judged: no organization-level success metric, failure criterion or evaluation plan.", "Commercial interests of leaders: the about and team material read does not explain Holon's current status, and no material addresses how commercial ties are handled.", "Critics or opponents: none named. The published critique of operationalizing awakening is not addressed in anything read.", "The people affected: no practitioner, participant or patient voice appears; no testimonial exists.", "Any failure, cancelled effort or reversal. Too early to expect many, but the missed dates are not acknowledged either in the material found."]}, "contradictions": [{"said": "'We direct philanthropic capital', and it asks the field for open datasets, shared repositories and shared standards.", "done": "The grantee post lists 14 projects but no amounts or total paid. A reader's public question on money distributed has no answer in the visible post. Funders, reviewers and the full board are unpublished. Six or so comments were not visible, so a reply in comments cannot be excluded.", "significance": "The transparency asked of grantees is not yet matched at the funder level. This is the main donor lever: it costs CoFo little to fix, and a donor can ask for it.", "basis": "evidence", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "Our First Grantees"}, {"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "Initial Learnings"}]}, {"said": "Awakening should be 'safe and accessible to all'.", "done": "Scoring criteria are mission alignment, feasibility, and collaboration and significance. No safety criterion or adverse-event requirement was found. The working definition identifies awakening partly by reduced suffering and greater wellbeing.", "significance": "A definition built on good outcomes risks classifying bad outcomes as something other than awakening. That would be a measurement gap in a program aiming to 'democratize' the process. Individual grantees and their ethics boards may handle safety; this was not checked. Fetch summaries could also miss a passing mention, so read the full RFP.", "basis": "inference", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/toward-a-science-of-awakening", "title": "RFP announcement"}, {"url": "https://www.cofo.org/rfp", "title": "RFP"}, {"url": "https://cofo.org/awakening", "title": "Science of Awakening"}]}, {"said": "Bodymind's team is 'highly agnostic'; the funder's vocabulary is rigorous and scientific.", "done": "The about page attributes to each core team member 'a deep reverence for the sacredness of consciousness', and the mission presupposes that inner development should be a primary pillar of society.", "significance": "Agnosticism on mechanism sits on top of strong commitment to value. That is common among mission funders and not disqualifying. The risk is confirmation bias in which questions get funded. The agnostic quote comes from one staff member's personal blog and refers to one program.", "basis": "inference", "sources": [{"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "Bodymind #2"}, {"url": "https://cofo.org/about", "title": "About"}]}, {"said": "State of the Field report 'Available Q3 2026'. On 22 July 2026, a detailed analysis of the application field was promised 'in the coming weeks'.", "done": "On 30 October 2026 the insights page still showed the Q3 label, and the Substack archive's newest post was the 22 July grantee post. Newsletter delivery was not tested, so a release to subscribers cannot be excluded.", "significance": "A modest slip, by a few weeks so far. It matters because the report is CoFo's main evidence for the 'field intelligence' it offers donors.", "basis": "evidence", "sources": [{"url": "https://cofo.org/insights", "title": "Insights"}, {"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "Our First Grantees"}, {"url": "https://theconsciousnessfoundation.substack.com/archive", "title": "CoFo Substack archive"}]}, {"said": "The organization presents an ARPA-inspired program engine, and Phillips describes an 'ARPA program' run in the open.", "done": "No budget, milestones, program-manager authority or kill criteria are published. In March 2026 a first Bodymind RFP was months away. In August 2026 the director wrote only that CoFo is 'actively seeking to support studies' in one area, and no RFP was found.", "significance": "'ARPA' here describes an aspiration and a style. Treat it as unproven until a program shows milestones and stops something.", "basis": "inference", "sources": [{"url": "https://cofo.org/approach", "title": "Approach"}, {"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "Bodymind #2"}, {"url": "https://jameswphillips.substack.com/p/bodymind-3-can-voluntary-attention", "title": "Bodymind #3"}]}, {"said": "CoFo plans to 'Award $1.5M' in Science of Awakening project grants in 2026.", "done": "14 projects at the $100,000 cap total at most $1.4M (my arithmetic), at least $100,000 short of $1.5M. The Melbourne award reported USD 100,000.", "significance": "Small and may have a plain explanation, such as supplements, meeting costs or a looser cap. Ask for the actual schedule of awards and payments.", "basis": "inference", "sources": [{"url": "https://cofo.org/awakening", "title": "Science of Awakening"}, {"url": "https://www.cofo.org/rfp", "title": "RFP"}, {"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "Our First Grantees"}, {"url": "https://psychologicalsciences.unimelb.edu.au/CSC/news/csc-secures-international-research-grant", "title": "University of Melbourne CSC (search snippet)"}]}, {"said": "Field should expand 'beyond Buddhist contemplative contexts', with intentional outreach to Abrahamic, Indigenous, Daoist, Sufi and other traditions.", "done": "Of 14 funded titles, several name Buddhist, nondual or jhana contexts, and one compares across traditions. None names an Abrahamic, Indigenous, Daoist or Sufi tradition. Titles are a crude test because project content may be wider.", "significance": "The self-critique is genuine and to CoFo's credit. It has not visibly changed the first portfolio, which is understandable given that the applicant pool came first. Watch the second call.", "basis": "inference", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "Initial Learnings"}, {"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "Our First Grantees"}]}, {"said": "CoFo's staff page lists Joshua Fields as Executive Director, and describes Holon among a career history.", "done": "A job listing, seen in search snippets, describes 'Joshua' as leading two organizations, with a chief of staff employed by Holon and split 50/50 between Holon and CoFo. Holon is described as a seed-stage healthcare startup in functional medicine, AI and frontier healing technologies. Equity at Holon is possible. CoFo's Bodymind program covers healing, chronic conditions and tools for influencing these processes.", "significance": "This is the most significant governance finding in this section. It raises three questions: how much of the Executive Director's time CoFo gets, who pays for shared staff, and how the overlap between charitable research direction and a commercial interest is managed. It does not show wrongdoing. The listing page returned 404, it may be stale, and the snippet gives only a first name for the role, though another snippet of the listing names Fields.", "basis": "inference", "sources": [{"url": "https://www.idealist.org/es/ong-empleo/c8495f83dddd44ef8f853f7e81ad3bf4-chief-of-staff-the-consciousness-foundation-london", "title": "Idealist listing (search snippets; fetch 404)"}, {"url": "https://cofo.org/team/joshua-fields", "title": "Joshua Fields bio"}, {"url": "https://cofo.org/bodymind", "title": "Bodymind"}]}], "five_whys": [{"observation": "CoFo publishes detail on who applied and what was funded, but not on what it paid or who pays it.", "chain": ["Why no dollars? [evidence] The March and July posts report counts and projects, and the visible post does not answer a reader's question on dollars distributed.", "Why are these posts shaped that way? [inference] Their audience is researchers: RFP notices, a Q&A session, field analysis. The donate page has no case for giving.", "Why researchers first? [inference] The stated first goal is to make awakening 'legible as a scientific subject', so field credibility is the immediate need.", "Why can donor reporting wait? [inference] The chair reportedly committed substantial capital, so early money may not have depended on public reporting. The size and share are unverified.", "Why has nothing forced the issue? [inference] An August 2025 exemption means no Form 990 appears yet, and no outside press has asked."], "insight": "Accountability currently runs toward the field and probably toward insiders, not outward to donors. That is ordinary for a young funder, but it is also a window. CoFo is now seeking outside philanthropists, so a new donor can set reporting norms early and cheaply."}, {"observation": "A program that wants awakening to be democratized does not, in the materials read, discuss harm.", "chain": ["Why no harm discussion? [evidence] The RFP's scoring criteria and the March analysis do not address it; 'safe' appears as an aim.", "Why not a criterion? [inference] The immediate problem it defines is measurement and shared vocabulary, not safety.", "Why does that crowd it out? [evidence] With no consensus definition, CoFo identifies awakening by outcomes, including reduced suffering and greater wellbeing.", "Why choose beneficial outcomes? [inference] They fit the mission premise and the case for societal benefit in the 'cascade' language.", "Why might no one internally press the point? [speculation] A team described as sharing reverence for the subject, in a small network, may have less internal dissent on downside questions. Phillips's caution on hype shows dissenting rigor exists, but on efficacy, not on harm."], "insight": "The gap is structural rather than careless: the working definition makes bad outcomes hard to see. A low-cost remedy would be requiring adverse-event tracking in cohort data standards. The planned roadmap is the natural place, and a donor could ask for it."}], "unmet_needs": [{"need": "Verified financial and governance credibility: 990, audit, full board, conflict policy.", "level": "common", "evidence": "The scan found no 990, audit or full board list. Only two board members are identifiable.", "donor_implication": "Make document delivery a condition of a material gift. Consider tranches tied to the first 990 and financial statements."}, {"need": "Diversified funding, if the chair is the main funder.", "level": "common", "evidence": "Reported capital commitment by the chair; a staff blog asks for philanthropist introductions; no funder is named. Concentration is unmeasured.", "donor_implication": "Ask for the funder breakdown and runway. An outside donor adds independence as well as money, which may justify asking for a board-level independent seat or observer role."}, {"need": "Leadership attention that matches scope.", "level": "context", "evidence": "Three programs and five pillars on a small team. A job listing indicates the Executive Director also leads Holon. LinkedIn and bio data leave the COO's commitment unclear.", "donor_implication": "Ask for time commitments of the Executive Director and COO in writing. Prefer funding that specifies a named owner for a deliverable."}, {"need": "Independent legitimacy in mainstream science.", "level": "context", "evidence": "The grantee list includes researchers at Oxford, UCL, Harvard-affiliated MGH and McGill, which is a real asset. No independent press or evaluation was found, and the rhetoric is large relative to the evidence.", "donor_implication": "Ask for outside scientific review of the portfolio at year one. Consider paying for it, rather than funding more grants at first."}, {"need": "Shared infrastructure: definitions, validated measures, repositories, recruitment standards.", "level": "activity", "evidence": "CoFo's own analysis calls it the highest-leverage next move and says most infrastructure proposals were beyond the scope of current awards.", "donor_implication": "This is the most fundable gap and the strongest case for a restricted gift. Tie it to public repositories and an adverse-event standard."}, {"need": "Credible grant process controls.", "level": "activity", "evidence": "Reviewers are unnamed and criteria unweighted. Selection departed from rank order by design. Advisor Chandaria has co-authored with Laukkonen, who is PI on one funded project and Co-I on another. In a small field such ties are normal, which is why a recusal policy matters.", "donor_implication": "Ask how reviewers were chosen and recused, and whether advisors or staff scored proposals."}, {"need": "A way to test its own hypothesis that coordination is high leverage.", "level": "qualifier", "evidence": "Coordination is CoFo's distinct claim, but no metric exists. Natural tests would include data actually shared, joint measures adopted, and non-grantee uptake.", "donor_implication": "Ask for 2-3 measurable coordination outcomes by the end of the two-year cohort. A refusal or inability would be informative."}, {"need": "A clear boundary between charitable science and commercial application.", "level": "qualifier", "evidence": "Stated ambition includes tools and 'introspective technologies'. Leaders have ties to Holon, Lionheart Ventures and Jhourney. No IP or commercialization policy was found. One funded project studies jhana, while the CSO advises Jhourney on jhana neuroscience; no link between these is shown.", "donor_implication": "Ask for the conflict policy, IP terms in grant agreements, and whether any grantee, portfolio company or leader-affiliated business stands to benefit."}], "leadership_dependency": {"verdict": "Moderately high dependency on a founding pair for money and direction. Some real institutional identity is emerging in the program layer.", "rationale": "Pointing to dependency: the chair framed the organization personally ('I am founding') and reportedly committed substantial capital. The chair's public profile uses nearly the same 'primary pillar of society' language as the mission. Only two board members are visible. No succession or governance description was found. Pointing away: the home page names no individuals, Substack posts are unsigned, the first program is identified with its CSO rather than the founders, and program leads bring their own expertise and public voices. Neither founding leader was found giving a CoFo-era interview, so the institution speaks more than they do. Counter-signal: the Executive Director's divided role means a single person's time may be a shared constraint across two organizations. The funding portion is unverified without a 990.", "basis": "inference", "confidence": 0.6}, "cultural_tensions": ["Rigor versus reverence. Metascience, preregistration and replication language sit beside 'sacredness' and a mission that presumes value. [inference; about page, RFP, Phillips posts]", "Researcher-skeptic voice versus civilizational rhetoric. Phillips warns of 'strong incentives to hype' and 'mechanistic clues, not definitive', while the site speaks of 'grand challenges' and 'steering the future of civilization'. [evidence for the quotes; inference for the tension]", "Mission versus market. Fields said in 2019 'if we want to get tools to people, we've got to use the markets', and also worried this is a 'win-lose' game. The current leadership mix spans a charity, a seed-stage health startup and venture investing. The tension appears unresolved in public. [inference]", "Coordinator versus gatekeeper. Consensus definitions and a roadmap help a fragmented field, but the same funder also defines the construct and selects who is funded. [inference]", "Breadth versus depth. Five pillars and three programs at the current size, versus one proven grant cycle. [inference]", "Secular science versus traditions. CoFo wants cross-traditional reach while operationalizing a concept with religious roots. At least one published critique argues this breaks the link to traditional constructs, and a reader comment on the grantee post raises a related point from within a tradition. [evidence for the critique's existence; inference for the tension]", "Openness of the blog versus caution of the institution. The most candid material comes from one staff blog disclaimed as unofficial; official posts are unsigned and do not discuss risk. [inference]"], "failure_tells": [{"pattern": "Scope running ahead of delivery", "evidence": "Five pillars, three programs and several promised publications. One grant cycle is complete to award stage. The field report and promised analysis were not found, and no Bodymind RFP or CoFlow output was found.", "basis": "evidence", "sources": [{"url": "https://cofo.org/approach", "title": "Approach"}, {"url": "https://cofo.org/insights", "title": "Insights"}, {"url": "https://cofo.org/bodymind", "title": "Bodymind"}]}, {"pattern": "Claims larger than current evidence (hype risk)", "evidence": "'Grand challenges', 'future of civilization' and 'powerful individual and cultural change' appear before any funded results. Projects were only due to start in September 2026. An insider names hype incentives as a field risk.", "basis": "inference", "sources": [{"url": "https://cofo.org", "title": "Home"}, {"url": "https://cofo.org/fundamental-consciousness", "title": "Fundamental Consciousness"}, {"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "Bodymind #2"}]}, {"pattern": "Possible funder-chair concentration and thin visible board", "evidence": "Reported chair capital commitment and only two identifiable board members. Unverified until the 990 and governing documents are seen. A public charity relying heavily on one person also faces a public-support question.", "basis": "inference", "sources": [{"url": "https://x.com/winslow_strong/status/1948483311522709759", "title": "Chairman's announcement (search result only)"}, {"url": "https://cofo.org/about", "title": "About"}]}, {"pattern": "Dense interlocks without p
