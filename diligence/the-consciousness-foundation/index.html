s": [{"value": "Portfolio judgment over pure score ranking", "evidence": "14 projects were assembled from the 24 highest-scoring applications, out of 52 full proposals, and the post says so openly. Reviewers are not named and the RFP's scoring criteria carry no published weights.", "basis": "evidence", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "Our First Grantees"}, {"url": "https://www.cofo.org/rfp", "title": "RFP"}]}, {"value": "Coordination is bought cheaply and made a condition of the money", "evidence": "Awards are capped at $100,000 over up to 24 months with 15% overhead. Awardees join a cohort with an in-person kickoff and quarterly Zoom meetings, and share data and results. My reading: a small funder is using grant conditions to gain influence over how a field organizes.", "basis": "inference", "sources": [{"url": "https://www.cofo.org/rfp", "title": "RFP"}, {"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "Our First Grantees"}]}, {"value": "Science as the route to legitimacy, with purely cultural work kept out of grants so far", "evidence": "The RFP excludes projects consisting solely of cultural or programmatic activities and research exclusively on psychedelics. The mission still ends in culture and society.", "basis": "evidence", "sources": [{"url": "https://www.cofo.org/rfp", "title": "RFP"}, {"url": "https://cofo.org/about", "title": "About"}]}, {"value": "Selective disclosure: open about the field and the work, closed about money and governance", "evidence": "Published: applicant counts, method counts, project titles and investigators. Not found: dollars per grant, funders, full board, reviewers or budget. The $1.5M plan is the only program total found.", "basis": "evidence", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "Initial Learnings"}, {"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "Our First Grantees"}, {"url": "https://cofo.org/awakening", "title": "Science of Awakening"}]}, {"value": "Grantmaking execution comes before publishing and before the secondary programs", "evidence": "The first RFP ran from November 2025 to named awardees in July 2026, close to its published timeline. The State of the Field report, promised analysis and Bodymind RFP lag behind. This pattern comes from one cycle, so it is thin.", "basis": "inference", "sources": [{"url": "https://www.cofo.org/rfp", "title": "RFP"}, {"url": "https://cofo.org/insights", "title": "Insights"}, {"url": "https://theconsciousnessfoundation.substack.com/archive", "title": "CoFo Substack archive"}]}, {"value": "Tolerance for overlapping roles among a small network", "evidence": "A job listing describes the Executive Director leading both Holon and CoFo. Percy is listed as CoFo's Fundamental Consciousness Lead and, per a January 2026 podcast page, as Director of the CoSentience Initiative, where CoFo board member Langer also sits on the board. No public policy explains how these overlaps are managed.", "basis": "inference", "sources": [{"url": "https://www.idealist.org/es/ong-empleo/c8495f83dddd44ef8f853f7e81ad3bf4-chief-of-staff-the-consciousness-foundation-london", "title": "Idealist Chief of Staff listing (search snippet)"}, {"url": "https://www.prism-global.com/podcast/chris-percy-computational-functionalism", "title": "PRISM podcast"}, {"url": "https://cofo.org/team/david-langer", "title": "David Langer bio"}]}], "money_stance": {"summary": "Capital-allocator stance: relational and unembarrassed, not scarcity-driven and not donor-flattering. The language is 'we direct philanthropic capital', not appeals for help. The donate page gives no case for giving, no impact claim and no gift levels. The only explicit ask found is a network request on a staff blog: 'please connect us!'. There is real cost discipline toward grantees, with a 15% overhead cap and a $100,000 award cap. Its own money is opaque: a reader's public question about funds distributed has no answer in the visible post, and the grantee post gives no amounts. The reading is that money comes through relationships and insiders, not public fundraising. The insider part rests on the chair's reported capital commitment and on the bio statement that Langer's two firms donate profits to consciousness research among other causes; no source says those gifts reach CoFo.", "basis": "inference", "confidence": 0.55, "sources": [{"url": "https://cofo.org/donate", "title": "Donate"}, {"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "Bodymind #2"}, {"url": "https://www.cofo.org/rfp", "title": "RFP"}, {"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "Initial Learnings"}, {"url": "https://x.com/winslow_strong/status/1948483311522709759", "title": "Chairman's announcement (search result only)"}, {"url": "https://cofo.org/team/david-langer", "title": "David Langer bio"}]}, "donor_stance": {"summary": "Donors are treated as aligned partners to be advised, a peer group rather than an audience to persuade. The site offers 'bespoke' advising, impact reports and events, and advises 'aligned donors'. No sample report, client count or named donor was found. Donors may direct a gift to a program by memo or email, which suggests flexibility on restriction, at least in form. No flattery or donor recognition language was found. Implication: a serious donor will probably get access and can probably negotiate reporting terms. That is a reasonable expectation, not an observed fact. Public materials do not yet show what donors receive.", "basis": "inference", "confidence": 0.5, "sources": [{"url": "https://cofo.org/approach", "title": "Approach"}, {"url": "https://cofo.org/about", "title": "About"}, {"url": "https://cofo.org/donate", "title": "Donate"}]}, "risk_and_growth": {"summary": "High intellectual ambition, moderate per-bet risk, broad scope. The topic carries reputational risk and the stated stakes are large ('steering the future of civilization'), yet each award is at most $100,000 and the money spans 14 projects. Risk is taken inside the portfolio: one funded project tests 5-MeO-DMT in expert meditators and another is titled 'A Mathematical Physics of Awakening'. Growth is horizontal: three programs and five pillars on a listed team of seven including the chair and a board member, with a job listing suggesting at least one part-time-by-design support role. Stated plans run beyond grants to position papers, reports, a podcast, field-wide funding coordination and a metacrisis paper. No risk register, failure criteria or reserves statement was found. The program pages fetched have no risk section. Phillips's blog is the one place where evidence risk gets frank treatment.", "basis": "inference", "confidence": 0.6, "sources": [{"url": "https://www.cofo.org/rfp", "title": "RFP"}, {"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "Our First Grantees"}, {"url": "https://cofo.org/fundamental-consciousness", "title": "Fundamental Consciousness"}, {"url": "https://cofo.org/about", "title": "About"}, {"url": "https://cofo.org/bodymind", "title": "Bodymind"}, {"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "Bodymind #2"}]}, "theory_of_change": {"in_their_words": "Mission: foster progress in consciousness science 'so that inner development becomes a primary pillar of society'. Mechanism: rigorous understanding of awakening is 'the first step in a cascade leading to powerful individual and cultural change'. Near term: 'coordination as the highest-leverage next move'. End state: 'operationalize and democratize awakening'.", "theory_of_power": "Inference. Power here comes from setting the agenda in a small, underfunded field. Whoever funds early can shape definitions, measures, shared data and the roadmap, and science then lends legitimacy that flows into culture and policy. The evidence: a working definition of awakening is set by the funder because 'a consensus scientific definition for awakening does not exist'; grants carry cohort and data-sharing terms; a 'field-consensus research roadmap' is planned; and the third program lists coordinating 'field-wide funding'. Influence moves from funders and credentialed researchers outward. Traditions and practitioners appear mainly as study populations or as sources to reach through outreach. No governing role for practitioners, participants or the public was found. The cascade's later steps, from legibility to mass access and cultural change, have no stated mechanism in the sources read. The vision paper could not be read and may supply one.", "basis": "inference", "sources": [{"url": "https://cofo.org/about", "title": "About"}, {"url": "https://cofo.org/awakening", "title": "Science of Awakening"}, {"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "Initial Learnings"}, {"url": "https://www.cofo.org/rfp", "title": "RFP"}, {"url": "https://cofo.org/fundamental-consciousness", "title": "Fundamental Consciousness"}]}, "metaphors": [{"metaphor": "Frontier and exploration", "example": "'frontier scientists', 'edges of consciousness', 'Emerging Frontier'", "reveals": "A self-image as first movers on neglected ground. It justifies small, early, high-variance bets.", "hides": "Prior occupants: contemplative traditions, earlier funders and existing institutions.", "url": "https://cofo.org"}, {"metaphor": "Catalyst", "example": "'Catalyzing breakthroughs'; 'awaiting catalytic coordination'", "reveals": "A theory of leverage: small inputs trigger large reactions, and CoFo is not itself the reaction.", "hides": "Attribution. A catalyst claims credit for outcomes others produce, and nothing is measured to show the effect.", "url": "https://cofo.org/bodymind"}, {"metaphor": "Engineering and machinery", "example": "'ARPA-inspired' 'flywheel'; 'infrastructure'; 'bootstrapping'; 'operationalize'", "reveals": "A real commitment to measures, standards and tractable problems.", "hides": "Whether awakening survives being operationalized. A published critique argues secular operationalization has little relationship to traditional Buddhist constructs. No CoFo engagement with that argument was found.", "url": "https://cofo.org/approach"}, {"metaphor": "Game or strategy", "example": "'the opening move in our broader mission'", "reveals": "Long-horizon, sequenced thinking. Grants are a first step in a larger plan.", "hides": "The rest of the plan, which is not published in a form found here, and who the opposing side is, if any.", "url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science"}, {"metaphor": "Cartography and intelligence", "example": "'field intelligence', 'shared maps', 'research map', 'landscape analysis'", "reveals": "Information advantage as a core asset and basis for donor advising.", "hides": "Who owns the map and what the mapmaker leaves off. The main map, the State of the Field report, was not found published.", "url": "https://cofo.org"}, {"metaphor": "Cascade and pillar", "example": "'first step in a cascade'; 'primary pillar of society'", "reveals": "Civilizational scale of ambition and an inevitable-seeming flow from knowledge to culture.", "hides": "The intermediate steps, the institutions that would have to change, and the people who may not want this.", "url": "https://cofo.org/awakening"}, {"metaphor": "Ecosystem and flourishing", "example": "'thriving ecosystem'; 'flourishing of life'; 'nurture and build'", "reveals": "A care orientation and a field-building self-image, softening the engineering register.", "hides": "Competition and selection. A funder also decides which parts of the ecosystem live.", "url": "https://cofo.org/approach"}, {"metaphor": "The sacred", "example": "'a deep reverence for the sacredness of consciousness'", "reveals": "A motivating commitment held by the organization and stated as a team trait.", "hides": "The fit with claims of agnosticism, and whether a staff member or reviewer could hold a deflationary view.", "url": "https://cofo.org/about"}], "figure_and_ground": {"always_in_frame": ["The field as protagonist: its earliness, gaps, needed standards and infrastructure.", "Rigor vocabulary: measures, preregistration, standards, repositories.", "Scale of stakes: 'grand challenges', 'future of civilization', 'metacrisis', 'pillar of society'.", "Coordination, with CoFo as convener and catalyst.", "The neglect thesis: too little funding for something very important.", "Technology as an ally: AI for theorizing, 'introspective technologies', tools for sensing and influencing processes."], "never_mentioned": ["Harm from intensive practice: no treatment of adverse effects, destabilization or difficult experiences in the RFP, Initial Learnings, the Bodymind post or the program pages read. 'Safe' appears only as an aim and 'ethical protocols' only in passing.", "Other funders by name: the posts read do not mention them, though search results show Templeton World Charity, Mind Science Foundation and the Faggin Foundation funding consciousness research.", "CoFo's own funding model, funders, budget and how long its money lasts.", "How CoFo itself will be judged: no organization-level success metric, failure criterion or evaluation plan.", "Commercial interests of leaders: the about and team material read does not explain Holon's current status, and no material addresses how commercial ties are handled.", "Critics or opponents: none named. The published critique of operationalizing awakening is not addressed in anything read.", "The people affected: no practitioner, participant or patient voice appears; no testimonial exists.", "Any failure, cancelled effort or reversal. Too early to expect many, but the missed dates are not acknowledged either in the material found."]}, "contradictions": [{"said": "'We direct philanthropic capital', and it asks the field for open datasets, shared repositories and shared standards.", "done": "The grantee post lists 14 projects but no amounts or total paid. A reader's public question on money distributed has no answer in the visible post. Funders, reviewers and the full board are unpublished. Six or so comments were not visible, so a reply in comments cannot be excluded.", "significance": "The transparency asked of grantees is not yet matched at the funder level. This is the main donor lever: it costs CoFo little to fix, and a donor can ask for it.", "basis": "evidence", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "Our First Grantees"}, {"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "Initial Learnings"}]}, {"said": "Awakening should be 'safe and accessible to all'.", "done": "Scoring criteria are mission alignment, feasibility, and collaboration and significance. No safety criterion or adverse-event requirement was found. The working definition identifies awakening partly by reduced suffering and greater wellbeing.", "significance": "A definition built on good outcomes risks classifying bad outcomes as something other than awakening. That would be a measurement gap in a program aiming to 'democratize' the process. Individual grantees and their ethics boards may handle safety; this was not checked. Fetch summaries could also miss a passing mention, so read the full RFP.", "basis": "inference", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/toward-a-science-of-awakening", "title": "RFP announcement"}, {"url": "https://www.cofo.org/rfp", "title": "RFP"}, {"url": "https://cofo.org/awakening", "title": "Science of Awakening"}]}, {"said": "Bodymind's team is 'highly agnostic'; the funder's vocabulary is rigorous and scientific.", "done": "The about page attributes to each core team member 'a deep reverence for the sacredness of consciousness', and the mission presupposes that inner development should be a primary pillar of society.", "significance": "Agnosticism on mechanism sits on top of strong commitment to value. That is common among mission funders and not disqualifying. The risk is confirmation bias in which questions get funded. The agnostic quote comes from one staff member's personal blog and refers to one program.", "basis": "inference", "sources": [{"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "Bodymind #2"}, {"url": "https://cofo.org/about", "title": "About"}]}, {"said": "State of the Field report 'Available Q3 2026'. On 22 July 2026, a detailed analysis of the application field was promised 'in the coming weeks'.", "done": "On 30 October 2026 the insights page still showed the Q3 label, and the Substack archive's newest post was the 22 July grantee post. Newsletter delivery was not tested, so a release to subscribers cannot be excluded.", "significance": "A modest slip, by a few weeks so far. It matters because the report is CoFo's main evidence for the 'field intelligence' it offers donors.", "basis": "evidence", "sources": [{"url": "https://cofo.org/insights", "title": "Insights"}, {"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "Our First Grantees"}, {"url": "https://theconsciousnessfoundation.substack.com/archive", "title": "CoFo Substack archive"}]}, {"said": "The organization presents an ARPA-inspired program engine, and Phillips describes an 'ARPA program' run in the open.", "done": "No budget, milestones, program-manager authority or kill criteria are published. In March 2026 a first Bodymind RFP was months away. In August 2026 the director wrote only that CoFo is 'actively seeking to support studies' in one area, and no RFP was found.", "significance": "'ARPA' here describes an aspiration and a style. Treat it as unproven until a program shows milestones and stops something.", "basis": "inference", "sources": [{"url": "https://cofo.org/approach", "title": "Approach"}, {"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "Bodymind #2"}, {"url": "https://jameswphillips.substack.com/p/bodymind-3-can-voluntary-attention", "title": "Bodymind #3"}]}, {"said": "CoFo plans to 'Award $1.5M' in Science of Awakening project grants in 2026.", "done": "14 projects at the $100,000 cap total at most $1.4M (my arithmetic), at least $100,000 short of $1.5M. The Melbourne award reported USD 100,000.", "significance": "Small and may have a plain explanation, such as supplements, meeting costs or a looser cap. Ask for the actual schedule of awards and payments.", "basis": "inference", "sources": [{"url": "https://cofo.org/awakening", "title": "Science of Awakening"}, {"url": "https://www.cofo.org/rfp", "title": "RFP"}, {"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "Our First Grantees"}, {"url": "https://psychologicalsciences.unimelb.edu.au/CSC/news/csc-secures-international-research-grant", "title": "University of Melbourne CSC (search snippet)"}]}, {"said": "Field should expand 'beyond Buddhist contemplative contexts', with intentional outreach to Abrahamic, Indigenous, Daoist, Sufi and other traditions.", "done": "Of 14 funded titles, several name Buddhist, nondual or jhana contexts, and one compares across traditions. None names an Abrahamic, Indigenous, Daoist or Sufi tradition. Titles are a crude test because project content may be wider.", "significance": "The self-critique is genuine and to CoFo's credit. It has not visibly changed the first portfolio, which is understandable given that the applicant pool came first. Watch the second call.", "basis": "inference", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "Initial Learnings"}, {"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "Our First Grantees"}]}, {"said": "CoFo's staff page lists Joshua Fields as Executive Director, and describes Holon among a career history.", "done": "A job listing, seen in search snippets, describes 'Joshua' as leading two organizations, with a chief of staff employed by Holon and split 50/50 between Holon and CoFo. Holon is described as a seed-stage healthcare startup in functional medicine, AI and frontier healing technologies. Equity at Holon is possible. CoFo's Bodymind program covers healing, chronic conditions and tools for influencing these processes.", "significance": "This is the most significant governance finding in this section. It raises three questions: how much of the Executive Director's time CoFo gets, who pays for shared staff, and how the overlap between charitable research direction and a commercial interest is managed. It does not show wrongdoing. The listing page returned 404, it may be stale, and the snippet gives only a first name for the role, though another snippet of the listing names Fields.", "basis": "inference", "sources": [{"url": "https://www.idealist.org/es/ong-empleo/c8495f83dddd44ef8f853f7e81ad3bf4-chief-of-staff-the-consciousness-foundation-london", "title": "Idealist listing (search snippets; fetch 404)"}, {"url": "https://cofo.org/team/joshua-fields", "title": "Joshua Fields bio"}, {"url": "https://cofo.org/bodymind", "title": "Bodymind"}]}], "five_whys": [{"observation": "CoFo publishes detail on who applied and what was funded, but not on what it paid or who pays it.", "chain": ["Why no dollars? [evidence] The March and July posts report counts and projects, and the visible post does not answer a reader's question on dollars distributed.", "Why are these posts shaped that way? [inference] Their audience is researchers: RFP notices, a Q&A session, field analysis. The donate page has no case for giving.", "Why researchers first? [inference] The stated first goal is to make awakening 'legible as a scientific subject', so field credibility is the immediate need.", "Why can donor reporting wait? [inference] The chair reportedly committed substantial capital, so early money may not have depended on public reporting. The size and share are unverified.", "Why has nothing forced the issue? [inference] An August 2025 exemption means no Form 990 appears yet, and no outside press has asked."], "insight": "Accountability currently runs toward the field and probably toward insiders, not outward to donors. That is ordinary for a young funder, but it is also a window. CoFo is now seeking outside philanthropists, so a new donor can set reporting norms early and cheaply."}, {"observation": "A program that wants awakening to be democratized does not, in the materials read, discuss harm.", "chain": ["Why no harm discussion? [evidence] The RFP's scoring criteria and the March analysis do not address it; 'safe' appears as an aim.", "Why not a criterion? [inference] The immediate problem it defines is measurement and shared vocabulary, not safety.", "Why does that crowd it out? [evidence] With no consensus definition, CoFo identifies awakening by outcomes, including reduced suffering and greater wellbeing.", "Why choose beneficial outcomes? [inference] They fit the mission premise and the case for societal benefit in the 'cascade' language.", "Why might no one internally press the point? [speculation] A team described as sharing reverence for the subject, in a small network, may have less internal dissent on downside questions. Phillips's caution on hype shows dissenting rigor exists, but on efficacy, not on harm."], "insight": "The gap is structural rather than careless: the working definition makes bad outcomes hard to see. A low-cost remedy would be requiring adverse-event tracking in cohort data standards. The planned roadmap is the natural place, and a donor could ask for it."}], "unmet_needs": [{"need": "Verified financial and governance credibility: 990, audit, full board, conflict policy.", "level": "common", "evidence": "The scan found no 990, audit or full board list. Only two board members are identifiable.", "donor_implication": "Make document delivery a condition of a material gift. Consider tranches tied to the first 990 and financial statements."}, {"need": "Diversified funding, if the chair is the main funder.", "level": "common", "evidence": "Reported capital commitment by the chair; a staff blog asks for philanthropist introductions; no funder is named. Concentration is unmeasured.", "donor_implication": "Ask for the funder breakdown and runway. An outside donor adds independence as well as money, which may justify asking for a board-level independent seat or observer role."}, {"need": "Leadership attention that matches scope.", "level": "context", "evidence": "Three programs and five pillars on a small team. A job listing indicates the Executive Director also leads Holon. LinkedIn and bio data leave the COO's commitment unclear.", "donor_implication": "Ask for time commitments of the Executive Director and COO in writing. Prefer funding that specifies a named owner for a deliverable."}, {"need": "Independent legitimacy in mainstream science.", "level": "context", "evidence": "The grantee list includes researchers at Oxford, UCL, Harvard-affiliated MGH and McGill, which is a real asset. No independent press or evaluation was found, and the rhetoric is large relative to the evidence.", "donor_implication": "Ask for outside scientific review of the portfolio at year one. Consider paying for it, rather than funding more grants at first."}, {"need": "Shared infrastructure: definitions, validated measures, repositories, recruitment standards.", "level": "activity", "evidence": "CoFo's own analysis calls it the highest-leverage next move and says most infrastructure proposals were beyond the scope of current awards.", "donor_implication": "This is the most fundable gap and the strongest case for a restricted gift. Tie it to public repositories and an adverse-event standard."}, {"need": "Credible grant process controls.", "level": "activity", "evidence": "Reviewers are unnamed and criteria unweighted. Selection departed from rank order by design. Advisor Chandaria has co-authored with Laukkonen, who is PI on one funded project and Co-I on another. In a small field such ties are normal, which is why a recusal policy matters.", "donor_implication": "Ask how reviewers were chosen and recused, and whether advisors or staff scored proposals."}, {"need": "A way to test its own hypothesis that coordination is high leverage.", "level": "qualifier", "evidence": "Coordination is CoFo's distinct claim, but no metric exists. Natural tests would include data actually shared, joint measures adopted, and non-grantee uptake.", "donor_implication": "Ask for 2-3 measurable coordination outcomes by the end of the two-year cohort. A refusal or inability would be informative."}, {"need": "A clear boundary between charitable science and commercial application.", "level": "qualifier", "evidence": "Stated ambition includes tools and 'introspective technologies'. Leaders have ties to Holon, Lionheart Ventures and Jhourney. No IP or commercialization policy was found. One funded project studies jhana, while the CSO advises Jhourney on jhana neuroscience; no link between these is shown.", "donor_implication": "Ask for the conflict policy, IP terms in grant agreements, and whether any grantee, portfolio company or leader-affiliated business stands to benefit."}], "leadership_dependency": {"verdict": "Moderately high dependency on a founding pair for money and direction. Some real institutional identity is emerging in the program layer.", "rationale": "Pointing to dependency: the chair framed the organization personally ('I am founding') and reportedly committed substantial capital. The chair's public profile uses nearly the same 'primary pillar of society' language as the mission. Only two board members are visible. No succession or governance description was found. Pointing away: the home page names no individuals, Substack posts are unsigned, the first program is identified with its CSO rather than the founders, and program leads bring their own expertise and public voices. Neither founding leader was found giving a CoFo-era interview, so the institution speaks more than they do. Counter-signal: the Executive Director's divided role means a single person's time may be a shared constraint across two organizations. The funding portion is unverified without a 990.", "basis": "inference", "confidence": 0.6}, "cultural_tensions": ["Rigor versus reverence. Metascience, preregistration and replication language sit beside 'sacredness' and a mission that presumes value. [inference; about page, RFP, Phillips posts]", "Researcher-skeptic voice versus civilizational rhetoric. Phillips warns of 'strong incentives to hype' and 'mechanistic clues, not definitive', while the site speaks of 'grand challenges' and 'steering the future of civilization'. [evidence for the quotes; inference for the tension]", "Mission versus market. Fields said in 2019 'if we want to get tools to people, we've got to use the markets', and also worried this is a 'win-lose' game. The current leadership mix spans a charity, a seed-stage health startup and venture investing. The tension appears unresolved in public. [inference]", "Coordinator versus gatekeeper. Consensus definitions and a roadmap help a fragmented field, but the same funder also defines the construct and selects who is funded. [inference]", "Breadth versus depth. Five pillars and three programs at the current size, versus one proven grant cycle. [inference]", "Secular science versus traditions. CoFo wants cross-traditional reach while operationalizing a concept with religious roots. At least one published critique argues this breaks the link to traditional constructs, and a reader comment on the grantee post raises a related point from within a tradition. [evidence for the critique's existence; inference for the tension]", "Openness of the blog versus caution of the institution. The most candid material comes from one staff blog disclaimed as unofficial; official posts are unsigned and do not discuss risk. [inference]"], "failure_tells": [{"pattern": "Scope running ahead of delivery", "evidence": "Five pillars, three programs and several promised publications. One grant cycle is complete to award stage. The field report and promised analysis were not found, and no Bodymind RFP or CoFlow output was found.", "basis": "evidence", "sources": [{"url": "https://cofo.org/approach", "title": "Approach"}, {"url": "https://cofo.org/insights", "title": "Insights"}, {"url": "https://cofo.org/bodymind", "title": "Bodymind"}]}, {"pattern": "Claims larger than current evidence (hype risk)", "evidence": "'Grand challenges', 'future of civilization' and 'powerful individual and cultural change' appear before any funded results. Projects were only due to start in September 2026. An insider names hype incentives as a field risk.", "basis": "inference", "sources": [{"url": "https://cofo.org", "title": "Home"}, {"url": "https://cofo.org/fundamental-consciousness", "title": "Fundamental Consciousness"}, {"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "Bodymind #2"}]}, {"pattern": "Possible funder-chair concentration and thin visible board", "evidence": "Reported chair capital commitment and only two identifiable board members. Unverified until the 990 and governing documents are seen. A public charity relying heavily on one person also faces a public-support question.", "basis": "inference", "sources": [{"url": "https://x.com/winslow_strong/status/1948483311522709759", "title": "Chairman's announcement (search result only)"}, {"url": "https://cofo.org/about", "title": "About"}]}, {"pattern": "Dense interlocks without published conflict management", "evidence": "Langer sits on the CoFo, QRI and Co-sentience boards. Percy directs CoSentience per a January 2026 podcast page and has a QRI visiting affiliation, and now leads a CoFo program. A low-reliability aggregator also places the chair on QRI's board. Fields leads Holon per a listing. CoFo's bio of Percy does not mention CoSentience. No CoFo money to these bodies was found.", "basis": "inference", "sources": [{"url": "https://cofo.org/team/david-langer", "title": "David Langer bio"}, {"url": "https://www.prism-global.com/podcast/chris-percy-computational-functionalism", "title": "PRISM podcast"}, {"url": "https://cofo.org/team/chris-percy", "title": "Chris Percy bio"}, {"url": "https://humantic.ai/public-profile/winslow-strong-7b3afb19697d51fa", "title": "Aggregator profile (low reliability; roles only)"}]}, {"pattern": "No organization-level measurement, though no hostility to measurement", "evidence": "The organization values measurement for the field. It publishes no measure for itself. This is absence at an early stage rather than resistance.", "basis": "inference", "sources": [{"url": "https://cofo.org/approach", "title": "Approach"}, {"url": "https://cofo.org", "title": "Home"}]}, {"pattern": "Patterns looked for and not found", "evidence": "No us-versus-them framing of critics, burnout language, donor flattery, public hostility to scrutiny or leader departures appeared in the material read. The sample is small and the organization is young, so this is weak comfort.", "basis": "evidence", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "Initial Learnings"}, {"url": "https://cofo.org/donate", "title": "Donate"}, {"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "Bodymind #2"}]}], "ethics_note": "This section reads the organization and leadership team as a system. It is not a psychological or personality assessment of anyone. Deliberately excluded: health histories and recovery narratives that appear in public bios and press on leaders; personal transformation narratives; references to personal spiritual practice and religious community involvement, except where an organization's own institutional language says something about culture; private-life references such as intentional-community membership; personal social accounts other than the chair's two public professional X posts about CoFo; and a 2021 change.org petition flagged by the scan, which was not read or used. A personality-profiling aggregator was consulted only for job and board titles, its personality content was ignored, and it is marked low reliability. Reader comments are cited only as public questions, without naming the commenters. Grantee and leader names appear only in their professional roles. Noted overlaps are questions about process and are not allegations of wrongdoing.", "gaps": ["The thinnest point: no CoFo-era interview, talk or long-form statement by the chair or Executive Director was found. Their views rest on two X post snippets, site copy and a 2019 podcast. This limits any reading of the founders' current thinking.", "The vision paper 'Consciousness: An Emerging Frontier', probably the fullest statement of theory of change, could not be read as text. The PDF was retrieved but no text could be extracted. Read it directly; conclusions about the missing cascade mechanism could change.", "Chief of Staff listing: all detail comes from search snippets of Spanish and Portuguese mirrors; fetches returned 404. Date, current status and full wording are unverified. Holon's description as AI-enabled and seed-stage appears only in that listing. Press on Holon's Glasgow centre was seen only in search results.", "Devaney's Metagame episode: show notes only, no transcript. Her ISCR talk that launched the RFP: no recording found. A Deconstructing Yourself conversation returned HTTP 403.", "Chair's X thread: unfetchable (HTTP 402); known only through search-result text and a summary. The 'substantial time and capital' wording is secondhand.", "Fetches returned model summaries and short excerpts of long pages, not full text. Absence claims such as 'no safety language' should be confirmed by reading the RFP, the March post and the Bodymind post in full.", "Comments: six further comments on the March post and five on the July post were not visible, so a reply on money distributed may exist.", "Employee reviews: none surfaced in searches, though review sites were not specifically queried. With a staff this small, useful reviews are unlikely. Careers page: none found.", "Internal documents: strategic plan, annual report, board minutes, grant agreements, IP terms and conflict policies: no evidence found.", "Staff and grantee views: only public, largely positive statements. No former staff, unsuccessful applicants or independent scientists were found commenting. Speak to several; rejected applicants may be the most informative.", "Dollars actually paid, per-grant amounts other than Melbourne, and how the $1.5M reconciles with 14 awards: no evidence found.", "Current status of the listed role overlaps (Percy at CoSentience, Liu at AI Alignment Foundation, Fields at Holon) is not confirmed as of October 2026.", "Chandaria-Laukkonen co-authorship is from search results on the 2025 paper. Whether advisors took part in review is unknown."]}, "leader": {"subject": {"name": "Joshua Fields", "title": "Executive Director, The Consciousness Foundation (CoFo). Called 'founding CEO' in one staff post.", "since": "Start date not published. [inference] Active by early 2025, when Fields contacted James Phillips about the work (Phillips, 19 March 2026).", "why_this_person": "The brief asks for the executive director, and Fields is the operating head and recruited at least one program director. But Fields may not be the dominant figure on money. Winslow Strong, the chair, wrote 'I am founding The Consciousness Foundation' and may be a main funder, though no gift is verified. Who holds final power is unresolved, so Strong gets a secondary profile. Main limit: I found no signed words by Fields about CoFo. Nearly all the record dates from 2019 and 2024-25, before or outside this job. This is a read of Fields's earlier professional voice plus a documented silence, not a read of Fields running CoFo."}, "corpus": [{"title": "Zero Marginal Cost / Why Technology Spells the End of Capitalism (As We Know It)", "type": "signed_post", "date": null, "url": "https://medium.com/@joshfields/why-technology-spells-the-end-of-capitalism-as-we-know-it-3face5a6b712", "pressure_moment": false, "note": "Search excerpts only; Medium returned 403. Undated. Search-index ages conflicted with other evidence, so I did not use them."}, {"title": "Neonosis with Joshua Fields (Genuinely Useful podcast)", "type": "podcast", "date": "2018-12-11", "url": "https://directory.libsyn.com/episode/index/show/genuinelyuseful/id/7848584", "pressure_moment": false, "note": "Show notes only. No direct quotes. Records three premises: change starts with the individual, systems thinking, consciousness evolution as central."}, {"title": "Consciousness Hacking with Joshua Fields (Bloom podcast)", "type": "podcast", "date": null, "url": "https://bloom-podcast.pinecast.co/episode/ec17b7a27a954532/consciousness-hacking-with-joshua-fields", "pressure_moment": false, "note": "Page only, no transcript. Promotes the May 2019 summit, so it predates that event."}, {"title": "Voices of VR #773: Consciousness Hacking's Awakened Futures Summit", "type": "podcast", "date": "2019-06-22", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit", "pressure_moment": false, "note": "Recorded 18 May 2019. The only long-form text in Fields's own words I could read. Rough transcript, read through an extraction tool, so check exact wording before re-quoting."}, {"title": "Is Civilisation on the Verge of Collapse?", "type": "signed_post", "date": null, "url": "https://medium.com/@joshfields/is-civilisation-on-the-verge-of-collapse-14ffa9cac6e4", "pressure_moment": false, "note": "Search excerpts only. [inference] Published by August 2019, because the Legendary Life page lists a near-identical title as a resource."}, {"title": "Legendary Life Podcast #363", "type": "podcast", "date": "2019-08-12", "url": "https://www.legendarylifepodcast.com/363-consciousness-hacking-how-to-train-your-brain-to-optimize-your-health-and-unlock-your-full-potential-with-joshua-fields/", "pressure_moment": false, "note": "Show notes only. Gives 'more than 20 communities and 10,000 members', which differs from the '50 cities' figure elsewhere."}, {"title": "The Wisdom Race (Emerge talk, Make School, San Francisco)", "type": "talk", "date": "2019-09-03", "url": "http://www.whatisemerging.com/videos/joshua-fields-the-wisdom-race", "pressure_moment": false, "note": "Host's description only. The video transcript could not be retrieved."}, {"title": "Consciousness Hacking London launch: Matching Wisdom with Technology", "type": "talk", "date": "2019-10-02", "url": "https://www.mindfulnesscentreofexcellence.com/consciousness-hacking-anyone-matching-wisdom-with-technology/", "pressure_moment": false, "note": "Event listing, no quotes. Shows Fields still executive director in October 2019."}, {"title": "The State of Consciousness Hacking", "type": "signed_post", "date": null, "url": "https://medium.com/@joshfields/the-state-of-consciousness-hacking-1ef6667f7cc0", "pressure_moment": true, "note": "The key document: Fields's essay on moving on as executive director after about 2.5 years. Search excerpts only; full text blocked, and a mirror link returned 404. [inference] Written after October 2019. Read this in full before relying on my reading of it."}, {"title": "Simulation #466: Joshua Fields, Consciousness Hacking", "type": "podcast", "date": null, "url": "https://smashnotes.com/p/simulation/e/466-joshua-fields-consciousness-hacking", "pressure_moment": false, "note": "No notes or quotes. Video page gave no transcript."}, {"title": "Hacking Consciousness, Joshua Fields (Rebel Wisdom)", "type": "interview", "date": null, "url": "https://rebelwisdom.co.uk/37-film-content/tech/603-hacking-consciousness-joshua-fields", "pressure_moment": false, "note": "Host's intro only. The page shows 22 November 2023, but it describes Fields as still leading the network, so that date is probably not the recording date."}, {"title": "The Elevator, Issue 21: Focus on Consciousness Hacking", "type": "other", "date": "2024-08-01", "url": "https://wearetheelevator.substack.com/p/issue-21-focus-on-consciousness-hacking", "pressure_moment": false, "note": "Third party quoting Fields's 2019 talk and overview. Also gives an outside view that the movement 'fizzled out'. That view is the newsletter's own speculation."}, {"title": "High-Tech Wellness Comes to Glasgow (What's On Glasgow)", "type": "press_quote", "date": "2024-08-22", "url": "https://www.whatsoninglasgow.com/high-tech-wellness-comes-to-glasgow/", "pressure_moment": false, "note": "Local launch coverage with direct quotes as Holon's founder. Says Fields splits time between Glasgow and the US."}, {"title": "Holon (Secret Glasgow)", "type": "press_quote", "date": "2024-09-13", "url": "https://secretglasgow.com/holon/", "pressure_moment": false, "note": "Direct quotes on the commercial focus."}, {"title": "We tried 'zen-like' new Scottish wellness centre (The Scotsman)", "type": "press_quote", "date": null, "url": "https://www.scotsman.com/lifestyle/we-tried-zen-like-new-scottish-wellness-centre-including-mind-blowing-virtual-reality-meditation-loved-by-celebrities-4772728", "pressure_moment": false, ds nor Strong is named on the archive page. Included as evidence of the silence, not as Fields's voice."}, {"title": "Idealist: Chief of Staff, The Consciousness Foundation, London", "type": "other", "date": null, "url": "https://www.idealist.org/es/ong-empleo/c8495f83dddd44ef8f853f7e81ad3bf4-chief-of-staff-the-consciousness-foundation-london", "pressure_moment": false, "note": "Not Fields's own words. Snippets came from the earlier culture read. In this pass the page returned 404 and my searches could not reproduce the text."}], "observations": {"activities": ["Convening: summits, meetups, chapter recruitment (2019).", "Framing big questions in public talks and essays (2018-2019).", "Opening and running a commercial wellness clinic, advising companies (2024-2025).", "Recruiting specialists (Phillips, 2025).", "No description found of Fields making grants, managing a budget, reporting to a board or letting anyone go."], "environments": ["San Francisco events and meetups.", "Sympathetic podcasts and movement platforms.", "Glasgow's West End clinic and local lifestyle press.", "No hostile or accountability setting found: no testimony, adversarial interview or donor report."], "interactions": ["With peers and movement audiences as a peer-host.", "With wary corporate sponsors, described from the outside in 2019.", "With customers, in Holon's launch coverage.", "With Phillips, as recruiter.", "No recorded interaction with CoFo's board, donors, grantees or critics."], "objects": ["Summits, chapters and city counts.", "Essays built on borrowed frameworks: Tainter on complexity and marginal-cost economics.", "Exponential curves as an image.", "Clinic equipment, diagnostics and memberships.", "Productivity tools and planners.", "Almost no budgets, audits or outcome data."], "present": ["Civilization, technology, wisdom, capitalism.", "Silicon Valley talent.", "Wisdom traditions and their critics.", "Entrepreneurs."], "absent": ["Staff, by name or role.", "Donors and any gratitude to them.", "Boards.", "Budgets and his organizations' own money.", "Successors.", "Mistakes at Consciousness Hacking or at CoFo, in anything I could read.", "Any grantee, in Fields's own voice."]}, "figure_and_ground": {"always_center": ["The gap between technological power and human wisdom, from 2019 to CoFo's 2026 'metacrisis' and 'future of civilization' language. The later language is organizational, not signed by Fields.", "Consciousness as the upstream cause of world problems.", "The question of how to get tools to people at scale."], "never_appears": ["In what I could read: Consciousness Hacking's budget, paid staff or reasons for decline.", "Named donors or a stated view of donors.", "A stated mistake.", "Any CoFo number attributed to Fields.", "A CoFo successor or term.", "How Fields's two organizations share time, staff or money."]}, "metaphors": [{"metaphor": "Race", "example": "Talk title 'The Wisdom Race'; host's summary says 'our level of wisdom is not keeping the pace'.", "date": "2019-09-03", "reveals": "Urgency and a contest with a clock. Justifies acting ahead of evidence.", "hides": "Who wins, how anyone would measure wisdom, and what happens if the interventions do harm.", "url": "http://www.whatisemerging.com/videos/joshua-fields-the-wisdom-race"}, {"metaphor": "Steering a train", "example": "'how do we jump on this and steer it'", "date": "2019-06-22", "reveals": "Pragmatism. Fields rejects condemning technology in favor of joining it and directing it. CoFo's Fundamental Consciousness page later uses 'steering the future of civilization'.", "hides": "That passengers rarely steer. It overstates how much a small funder can direct.", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}, {"metaphor": "The game of capitalism", "example": "'we've kind of got to play the game of capitalism, which is win-lose'", "date": "2019-06-22", "reveals": "A former banker's realism. Markets are treated as a required channel, not an enemy.", "hides": "Who bears the loss, and whether playing changes the player.", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}, {"metaphor": "Emergence and nurture (garden-like)", "example": "'true emergence cannot be planned. Instead, it has to be nurtured.'", "date": "2019", "reveals": "A preference for creating conditions over directing outcomes. This fits a convener and a cohort funder.", "hides": "Accountability. If outcomes cannot be planned, failure is hard to define. It also sits awkwardly with an ARPA-style program.", "url": "https://wearetheelevator.substack.com/p/issue-21-focus-on-consciousness-hacking"}, {"metaphor": "Precipice and collapse", "example": "'we're on the precipice of some sort of human technological integration'", "date": "2019-06-22", "reveals": "High stakes as the default setting.", "hides": "Base rates and the possibility that the feared break never comes.", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}, {"metaphor": "Myth and narrative", "example": "'what is the myth that comes next?'", "date": "2019-06-22", "reveals": "Fields sees culture as a lever, not only science. Useful to compare with CoFo's scientific vocabulary.", "hides": "Tension between myth-making and evidence, which matters at a science funder.", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}], "normative_and_charged": [{"passage": "It's not even an option to create exponentially more powerful tools if we're not exponentially increasing our capacity", "date": "2019-06-22", "kind": "normative", "reading": "[evidence] The strongest 'must' in the record. It sets a very large standard with no measure attached. [inference] This is the root of the mission.", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}, {"passage": "if we want to get tools to people, we've got to use the markets.", "date": "2019-06-22", "kind": "normative", "reading": "[evidence] Stated as necessity. [inference] This is useful for reading Holon, and for asking why Fields now leads a charity as well.", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}, {"passage": "the commodification of things is, it's a real shame.", "date": "2019-06-22", "kind": "emotionally_charged", "reading": "[evidence] Mild regret, followed by a sharper line about yoga studios as 'this Lycra Instagram party'. This is the most visible irritation in the transcript, and it is aimed at culture, not at named people.", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}, {"passage": "that actually rules us out of a hell of a lot of corporations.", "date": "2019-06-22", "kind": "emotionally_charged", "reading": "[evidence] The one place money pressure shows, in a plain and slightly rueful tone. Fields names the constraint and does not attack the sponsors.", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}, {"passage": "Can we create tools that are desirable in a capitalist economy if they're not addictive? I don't know.", "date": "2019-06-22", "kind": "emotionally_charged", "reading": "[evidence] The frame strains here, and Fields says so. It is the most candid sentence in the record.", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}], "contradictions": [{"said": "CoFo bio: 'the former Executive Director of Consciousness Hacking', a nonprofit across 50 cities that 'established the first global ecosystem around consciousness technologies'.", "did_or_showed": "Holon's team page describes the earlier work as 'running a Silicon Valley startup', and Holon's story page as a 'mental health technology ecosystem'. In 2019 Fields called it 'a company' and then 'a nonprofit', and also a 'voluntary-based organization'.", "significance": "The same job is described to suit each audience. None of it is necessarily false, but a donor cannot size the job from these accounts. Ask for budget, paid staff and legal form.", "basis": "evidence", "sources": [{"url": "https://www.cofo.org/team/joshua-fields", "title": "CoFo bio"}, {"url": "https://www.holon.co.uk/about-us/our-team", "title": "Holon team"}, {"url": "https://www.holon.co.uk/about-us/our-story", "title": "Holon story"}, {"url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit", "title": "Voices of VR #773"}]}, {"said": "The CoFo bio gives the 50-city scale as a credential, with no outcome attached.", "did_or_showed": "An August 2019 podcast page gives 'more than 20 communities and 10,000 members'. Open Collective shows the San Francisco chapter raised $50,724.26 in total and is archived, with the archiving expense paid 22 July 2020. An outside newsletter says the movement 'fizzled out rather quickly'. I found no account by Fields of what happened.", "significance": "This is a reach figure, not a result. One chapter's ledger says little about the parent, whose budget I did not find. The closest thing to a track record is unaudited, and the ending is not explained in what I could read.", "basis": "inference", "sources": [{"url": "https://www.legendarylifepodcast.com/363-consciousness-hacking-how-to-train-your-brain-to-optimize-your-health-and-unlock-your-full-potential-with-joshua-fields/", "title": "Legendary Life #363"}, {"url": "https://opencollective.com/chsf", "title": "Consciousness Hacking SF, Open Collective"}, {"url": "https://wearetheelevator.substack.com/p/issue-21-focus-on-consciousness-hacking", "title": "The Elevator, Issue 21"}]}, {"said": "2024, as Holon's a are published.", "significance": "Mild, since Fields allowed that top-down work is necessary. It may be a coherent mix. Without published milestones, 'emergence' could also excuse the lack of a success test.", "basis": "inference", "sources": [{"url": "https://wearetheelevator.substack.com/p/issue-21-focus-on-consciousness-hacking", "title": "The Elevator, Issue 21"}, {"url": "https://cofo.org/approach", "title": "Approach"}, {"url": "https://www.cofo.org/rfp", "title": "RFP"}]}, {"said": "Bio lists CoFo Executive Director, Holon founder and adviser to companies in health, media and nonprofit sectors.", "did_or_showed": "August 2024 coverage says Fields splits time between Glasgow and the US. The February 2025 Entrepreneur byline gives only Holon, in the period Fields was contacting Phillips about CoFo. A job listing, seen only in earlier snippets and now 404, describes a shared chief of staff employed by Holon.", "significance": "Time and cost allocation are unknown. A 50/50 shared role paid by a for-profit raises the question of who pays for whose work. Treat the listing as unconfirmed.", "basis": "inference", "sources": [{"url": "https://www.cofo.org/team/joshua-fields", "title": "CoFo bio"}, {"url": "https://www.whatsoninglasgow.com/high-tech-wellness-comes-to-glasgow/", "title": "What's On Glasgow"}, {"url": "https://uk.entrepreneur.com/growth-strategies/five-things-to-make-your-workday-more-productive/486912", "title": "Entrepreneur UK"}, {"url": "https://www.idealist.org/es/ong-empleo/c8495f83dddd44ef8f853f7e81ad3bf4-chief-of-staff-the-consciousness-foundation-london", "title": "Idealist listing (snippets; 404)"}]}], "eras": [{"period": "c. 2018 to mid-2019", "label": "Movement voice", "voice": "Expansive, curious, peer-to-peer. Big questions, borrowed frameworks, open about not having answers.", "specificity": "same", "candor": "same", "example_quote": "I actually haven't answered this question, how do we spread, how do we elevate consciousness globally?", "sources": [{"url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit", "title": "Voices of VR #773"}, {"url": "https://directory.libsyn.com/episode/index/show/genuinelyuseful/id/7848584", "title": "Genuinely Useful"}]}, {"period": "Late 2019 to about 2020", "label": "Civilizational stakes and exit", "voice": "Larger stakes: collapse and wisdom race. The exit essay, as excerpted, surveys the field and not the organization. Date unconfirmed.", "specificity": "less", "candor": "same", "example_quote": "Our technological landscape works antithetically to equanimity.", "sources": [{"url": "http://www.whatisemerging.com/videos/joshua-fields-the-wisdom-race", "title": "The Wisdom Race"}, {"url": "https://medium.com/@joshfields/the-state-of-consciousness-hacking-1ef6667f7cc0", "title": "The State of Consciousness Hacking (excerpts)"}]}, {"period": "2024 to February 2025", "label": "Local operator", "voice": "Concrete, commercial, customer-facing. Fewer ideas about civilization, more about services. Promotional, and it does not discuss limits of the services.", "specificity": "more", "candor": "less", "example_quote": "We're one of the first clinics in the UK to offer in-depth diagnostics for environmental toxin load.", "sources": [{"url": "https://secretglasgow.com/holon/", "title": "Secret Glasgow"}, {"url": "https://www.whatsoninglasgow.com/high-tech-wellness-comes-to-glasgow/", "title": "What's On Glasgow"}]}, {"period": "2025 to October 2026", "label": "Institutional silence", "voice": "No signed voice found. The organization speaks unsigned, the chair announces, and program staff do the candid writing.", "specificity": "less", "candor": "less", "example_quote": null, "sources": [{"url": "https://theconsciousnessfoundation.substack.com/archive", "title": "CoFo Substack archive"}, {"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "Bodymind #2"}]}], "five_whys": [{"observation": "A leader who spoke freely in 2019 has no signed public words about the organization Fields now runs.", "chain": ["Why silent? One plain reason: CoFo speaks as an institution. Every Substack post is credited to 'The Consciousness Foundation'. [evidence]", "Why might an institutional voice suit this role? Others carry the public argument. Strong wrote 'I am founding The Consciousness Foundation', and Phillips writes 'we direct philanthropic capital'. [evidence] Fields may be the operator behind them. [inference]", "Why might Fields prefer that to the 2019 stage? The 2019 voice was big and unresolved: 'I actually haven't answered this question'. A funder is expected to have answers, and open doubt costs more. [speculation]", "Why does that matter for money? CoFo appears to raise through relationships: 'If you know philanthropists who would be interested in funding us, please connect us!' Private channels need less public argument. [inference]", "Why would the silence persist? Nobody has yet forced an answer. The one public question I found on money distributed has no reply in the visible post. [evidence]"], "insight": "[inference] Donors cannot learn from public sources how Fields thinks as CoFo's head. The private meeting would be the first real evidence, so it should be structured as a test and not as a pitch."}, {"observation": "Fields's question in 2019 was market or mission, and by 2025 Fields held both: a commercial health startup and a charity.", "chain": ["Why two vehicles? In 2019 Fields said both sides out loud: 'if we want to get tools to people, we've got to use the markets.' [evidence]", "Why not markets alone? 'Can we create tools that are desirable in a capitalist economy if they're not addictive? I don't know.' [evidence]", "Why not a charity alone? Fields's stated concern was reach: tools 'super accessible for people'. A research funder alone does not deliver tools. [inference]", "Why does the overlap persist? Holon's stated focus and Bodymind's subject are close: 'chronic complex conditions that standard medicine has no answers for'. [evidence for the quote; inference for the fit]", "Why is that a governance matter? If the two are one strategy in Fields's mind, the separation has to come from the board, not from Fields's intent. I found no published rule. [inference]"], "insight": "[speculation] CoFo and Holon may be two halves of one long-held theory of change. That would explain Fields's commitment and also make the conflict structural, not incidental."}], "needs": [{"need": "Secure capital without a mass-market case", "level": "common", "explicit": false, "evidence": "Donate page offers no case for giving. Sponsors in 2019: 'They don't want to be seen to be associated.'", "from_whom": "Donors and the chair"}, {"need": "Attract top talent to a stigmatized field", "level": "common", "explicit": true, "evidence": "'there is a lack of excellent entrepreneurs.' (2019) Later recruited Phillips.", "from_whom": "Scientists and operators"}, {"need": "Legitimize the subject with scientific credibility", "level": "context", "explicit": false, "evidence": "Move from a 'psychedelics + tech' summit to a funder with 'frontier scientists' and 'metascience' language.", "from_whom": "Universities, reviewers, the public"}, {"need": "Hold two commitments without forcing a choice", "level": "context", "explicit": false, "evidence": "Bio lists CoFo and Holon in the present tense. Listing snippets describe a split chief of staff.", "from_whom": "Board and donors"}, {"need": "Delegate program voice to specialists", "level": "activity", "explicit": false, "evidence": "Phillips, Devaney and Percy hold the public science voice. Phillips: 'he asked if I would join full time.'", "from_whom": "Staff"}, {"need": "Convene rather than perform the work", "level": "activity", "explicit": true, "evidence": "2019: 'we don't actually build any immersive experiences'. Phillips 2026: 'we are conveners and funders'.", "from_whom": "Grantees and peers"}, {"need": "Show progress before results exist", "level": "qualifier", "explicit": false, "evidence": "Projects were due to start only in September 2026, while the State of the Field report slipped past its Q3 label.", "from_whom": "Donors"}, {"need": "Keep latitude to let things emerge", "level": "qualifier", "explicit": false, "evidence": "'true emergence cannot be planned.' No milestones are published.", "from_whom": "Board and donors"}], "empathy_gap": {"rating": "drifting", "rationale": "Fields mostly writes from the map: curves, collapse, 'the markets'. No named community member, grantee or specific case appeared in what I could read. The 2019 interview does touch the ground, on sponsors and on who shows up. Holon suggests real contact with customers, and its founder quotes are specific about their situation. That contact is commercial. For CoFo-era work there is too little to rate; the label reflects the older record only. Low confidence.", "basis": "inference"}, "profile": {"self_concept": {"summary": "Fields casts himself as a bridge builder and convener between head and heart, finance and contemplation, wisdom and technology. In 2024 the role shifts to founder-operator. At CoFo, the bio casts Fields as entrepreneur and nonprofit leader, and I found no self-description in Fields's own words.", "quotes": [{"quote": "not just talk the talk, but actually really walk the walk of bridging the worlds of the head and the heart", "date": "2019-06-22", "context": "What Fields sought in a community", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}, {"quote": "I was really looking for a community that wasn't so into consciousness that it was ungrounded", "date": "2019-06-22", "context": "How Fields came to Consciousness Hacking", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}, {"quote": "higher consciousness as
