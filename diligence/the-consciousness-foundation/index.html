ion] If the chair is the main funder, the capital could flow to scientists another way. If your gift does not arrive: not determinable, since CoFo publishes no gap or target. It probably would not touch the 2026 cohort. The concrete unit is $115,000 for one project; 40 of 54 invited teams went unfunded, quality unknown. Displacement of the chair's money is the main additionality risk.", "basis": "inference", "confidence": 0.55, "sources": [{"url": "https://www.cofo.org/rfp", "title": "CoFo RFP"}, {"url": "https://projects.propublica.org/nonprofits/organizations/871367830", "title": "ProPublica: ISCR"}, {"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "CoFo: Our First Grantees"}]}, {"question": "Is there room for more funding, and what happened to the last big increase?", "status": "partial", "answer": "Mechanically yes, in modest amounts: demand exceeded awards and regranting is easy. Decision: first tranche up to about $115,000; total up to about $1.5M only after documents and a dated use exist. Above $1.5M a gift exceeds the whole stated 2026 program and would probably sit in reserves. Last big increase: none observable, as there is no revenue history.", "basis": "inference", "confidence": 0.5, "sources": [{"url": "https://cofo.org/awakening", "title": "CoFo: Science of Awakening"}, {"url": "https://projects.propublica.org/nonprofits/organizations/334334115", "title": "ProPublica: Consciousness Research Foundation"}]}, {"question": "Is this the right unit to fund, or should money go to a coalition, policy effort, intermediary, or peer?", "status": "partial", "answer": "Depends on what you are buying. Awakening science specifically: CoFo, restricted and staged, because no other dedicated vehicle was found. Contemplative science broadly: Mind & Life is safer on the strength of its filings. Direct technical work: fund a lab such as the Institute for Advanced Consciousness Studies, or fund invited-but-unfunded teams directly. CoFo's intermediary layer earns its cost only if coordination produces something separate grants would not, and that output does not yet exist. Policy defense of NCCIH could protect more money but was not evaluated.", "basis": "inference", "confidence": 0.55, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/770284767", "title": "ProPublica: Mind & Life Institute"}, {"url": "https://projects.propublica.org/nonprofits/organizations/843926982", "title": "ProPublica: IACS"}, {"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "CoFo: Initial Learnings"}]}, {"question": "Does the theory of change hold, and is there outside evidence for the model?", "status": "partial", "answer": "The first link is plausible: early funders can set definitions, measures and data norms in a small field. COGITATE, funded by Templeton, shows that a funder-organized test can yield a publishable result in a contested area, though 'neither theory won'. UVA confirms the cohort condition exists. No outside evidence shows that CoFo's small-grant cohort works. The later links, from legible science to mass access and cultural change, have no stated mechanism in the sources read; the vision paper could not be read and may supply one. The culture read also notes a published critique that secular operationalization has little relationship to traditional Buddhist constructs, with no CoFo response found.", "basis": "inference", "confidence": 0.5, "sources": [{"url": "https://cofo.org/awakening", "title": "CoFo: Science of Awakening"}, {"url": "https://nautil.us/inside-the-big-bet-on-consciousness-1207750/", "title": "Nautilus: Inside the big bet on consciousness (30 Apr 2025)"}, {"url": "https://dev.csc.virginia.edu/news/toward-science-awakening-grant", "title": "UVA Contemplative Sciences Center (31 Aug 2026)"}]}, {"question": "Who else funds them and why, and has any sophisticated funder stopped?", "status": "no_evidence", "answer": "No funder is publicly named by CoFo. The chair's reported capital commitment is secondhand, and no gift or amount is verified. No institutional funder was found, though full Survival and Flourishing Fund lists and 990-PF schedules were not reviewed. No departure was found, and CoFo is too young to have much history. CoFo is thanked as a supporter of the Edge Esmeralda residency, which shows it as funder, not fundee. You cannot borrow anyone else's diligence.", "basis": "evidence", "confidence": 0.7, "sources": [{"url": "https://cofo.org/donate", "title": "CoFo: Donate"}, {"url": "https://x.com/winslow_strong/status/1948483311522709759", "title": "Strong on X (search result only)"}, {"url": "https://www.edgecity.live/blog/a-month-at-the-consciousness-residency-2026", "title": "Edge City: Consciousness Residency recap"}]}, {"question": "Is the problem growing or shrinking?", "status": "partial", "answer": "Contested, and it is a knowledge and funding gap with no baseline. No time series for awakening research funding exists. Adjacent mindfulness publications grew through 2021. Public money: FY2026 NIH was enacted at about $48.7-48.9B with institute structure kept, per search summaries of CRS; NCCIH's figure was not found. A single commercial blog reports NIH success rates fell to about 17%. Private money is expanding at the edges: Astera plans $600M+ over a decade on neuroscience of conscious experience. CoFo's neglect claim is only partly corroborated, and the 128 LOIs are self-reported and show appetite for money.", "basis": "inference", "confidence": 0.5, "sources": [{"url": "https://www.congress.gov/crs-product/R43341", "title": "CRS: NIH Funding FY1996-FY2026"}, {"url": "https://www.digitalminds.news/p/digital-minds-in-2025-a-year-in-review", "title": "Digital Minds: 2025 year in review"}, {"url": "https://thim.mijn.bsl.nl/trends-and-developments-in-mindfulness-research-over-55-years-a-/19369330", "title": "Mindfulness research trends (search result)"}, {"url": "https://grantedai.com/news/nih-grant-success-rate-17-percent-lowest-decades", "title": "GrantedAI: NIH success rate (commercial blog; verify)"}]}, {"question": "Is this a program or an organization (founder dependency, board strength, survivability)?", "status": "partial", "answer": "Today, one working program with an organization forming around it. Program leads have real expertise and public voices, and the first program is identified with its CSO, which is healthy. But only two board members are visible, no successor or wind-down plan was found, and money and direction appear to rest with the chair and Fields. Fields's departure would probably cost relationships and execution; a change in the chair's support could be far more serious, if the chair is the main funder. Survivability cannot be shown without funder and reserve data.", "basis": "inference", "confidence": 0.55, "sources": [{"url": "https://cofo.org/about", "title": "CoFo: About"}, {"url": "https://www.guidestar.org/profile/33-4334115", "title": "GuideStar profile"}]}, {"question": "Who is the executive director, in their own words: risk appetite, candor about failure, relationship to money and donors, and what a departure would do to revenue?", "status": "partial", "answer": "Joshua Fields's public words almost all predate CoFo; no signed statement as its head was found. Risk: comfortable with reputational risk and unproven fields, as with the 2019 psychedelics and technology summit: 'if you're, you know, Google, Facebook and you're sponsoring a psychedelic event, not so easy.' (22 Jun 2019). [inference] Candor: open about not knowing: 'I actually haven't answered this question' (22 Jun 2019). No organizational failure, embarrassing number or mistake was found in nine thin items, and the essay on leaving Consciousness Hacking was read only in excerpts, so this means 'not shown', not 'never does it'. Money: speaks of markets, not donors: 'if we want to get tools to people, we've  Also ask how pay works with Fields's outside roles and any shared staff, which a headline number would not show. The Escape The City listing's mention of equity is probably a template error; confirm.", "basis": "evidence", "confidence": 0.85, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/334334115", "title": "ProPublica: Consciousness Research Foundation"}, {"url": "https://projects.propublica.org/nonprofits/organizations/770284767", "title": "ProPublica: Mind & Life Institute"}, {"url": "https://www.escapethecity.org/organisation/the-consciousness-foundation", "title": "Escape The City listing"}]}, {"question": "Is the cost of raising money in line with peers and with the revenue model?", "status": "no_evidence", "answer": "No fundraising expense data exists. [inference] Visible fundraising looks minimal and relationship-based: a bare donate page and a staff blog request for introductions. Donor advising is a conflict and possibly a hidden fundraising cost, because the adviser also solicits gifts for itself. The extract has no peer fundraising ratio to compare.", "basis": "inference", "confidence": 0.5, "sources": [{"url": "https://cofo.org/donate", "title": "CoFo: Donate"}, {"url": "https://cofo.org/approach", "title": "CoFo: Approach"}, {"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "Bodymind #2"}]}, {"question": "What actually changed because of them last year, how much of it can they fairly claim, and is that improving per dollar?", "status": "partial", "answer": "Changed: up to about $1.5M committed to 14 named awakening projects, with data sharing inside the cohort as a condition. No research result or change in practice has appeared; projects were due to start in September 2026. CoFo can claim full credit for the call and the condition, and an unknown share of whether the work happens. About $100,000 is traced outside CoFo, with payment unverified. Per-dollar trend: no prior year or spending data exists.", "basis": "evidence", "confidence": 0.7, "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "CoFo: Our First Grantees (22 Jul 2026)"}, {"url": "https://cofo.org/awakening", "title": "CoFo: Science of Awakening"}, {"url": "https://psychologicalsciences.unimelb.edu.au/CSC/news/csc-secures-international-research-grant", "title": "University of Melbourne CSC (search result only)"}, {"url": "https://dev.csc.virginia.edu/news/toward-science-awakening-grant", "title": "UVA Contemplative Sciences Center (31 Aug 2026)"}]}, {"question": "Do they publish targets in advance and report against them?", "status": "partial", "answer": "Partly. They publish activity targets that can fail, not outcome targets. Scorecard: 10-15 awards, hit (14, on CoFo's count). $1.5M, unverified. Project start in September 2026, unconfirmed. State of the Field by Q3 2026, apparent miss. Application analysis 'in the coming weeks' from 22 July, apparent miss. Position paper and roadmap, pending. CoFo does not report against these targets in any material found, and the misses are not acknowledged. A five-year plan is mentioned but was not found.", "basis": "evidence", "confidence": 0.75, "sources": [{"url": "https://www.cofo.org/rfp", "title": "CoFo RFP"}, {"url": "https://cofo.org/insights", "title": "CoFo: Insights"}, {"url": "https://theconsciousnessfoundation.substack.com/archive", "title": "CoFo Substack archive"}]}], "strengths": [{"strength": "It delivered a real grant round quickly, close to its published timeline", "evidence": "RFP in November 2025, 128 LOIs by December, 14 projects named on 22 July 2026 against an estimate of 10-15. UVA and Melbourne independently confirm awards. Notice dates and payment remain unconfirmed.", "basis": "evidence"}, {"strength": "A distinctive design choice: funding is conditional on sharing", "evidence": "Awardees must share data and results within the cohort, and UVA  given a short record and no docket search.", "basis": "evidence"}], "verdict_changers": [{"direction": "up", "what": "A grant ledger showing most of the $1.5M actually paid on the RFP's schedule."}, {"direction": "up", "what": "First 990 and Schedule A showing at least one substantial non-chair funder and 12 months or more of reserves."}, {"direction": "up", "what": "A full board with an independent majority, a conflict policy and a real recusal record covering Holon."}, {"direction": "up", "what": "A clear written answer that Fields's CoFo role is the primary job, shared staff costs are allocated and Holon's service areas are off limits for Bodymind."}, {"direction": "up", "what": "State of the Field and the application analysis published, of good quality, with public cohort data and an adverse-event standard."}, {"direction": "up", "what": "A dated second round with a named institutional co-funder, or an independent review of the portfolio by a known skeptic."}, {"direction": "down", "what": "A refusal or long delay in providing the 990, funder breakdown or ledger, or no filing shortly after the mid-November 2026 extended deadline (if calendar-year)."}, {"direction": "down", "what": "The chair turns out to supply nearly all funding, with no written commitment, or also controls the board."}, {"direction": "down", "what": "Any money, referrals or undocumented shared costs between CoFo and Holon, or a Bodymind grant touching Holon's services without recusal."}, {"direction": "down", "what": "Payments materially below the stated total, or grantees reporting that awards were delayed."}, {"direction": "down", "what": "Grantee reference calls saying the projects would have run anyway and the cohort meetings are nominal."}, {"direction": "down", "what": "California registry problems, or a defensive response to the money question."}], "questions_to_ask": [{"order": 1, "question": "Please send the grant ledger for the first cohort: awardee, amount, overhead, agreement date and payment date. How much of the $1.5M has been paid?", "why": "It is the cheapest test of whether stated scale is real, and a reader asked the same question publicly in March 2026.", "good_answer_looks_like": "A complete ledger within days, reconciled to 14 awards, with payments consistent with the RFP's 60-day promise and any variances explained."}, {"order": 2, "question": "What is the 2027 budget by program, how much is already committed without me, what share of revenue comes from the chair and the top three sources, how many months of reserves do you hold, and what specifically changes if my gift arrives?", "why": "This settles concentration, runway and displacement, which drive the top failure mode and any sizing decision.", "good_answer_looks_like": "A board-approved budget, a named funder breakdown, the chair's commitment in writing, and a specific deliverable that would not otherwise happen."}, {"order": 3, "question": "Send the determination letter, your filed FY2025 return or draft, financial statements, California registry confirmation, and the full board list. Who is independent, and who can hire and remove the executive director? I will ask the chair and Fields this separately.", "why": "Only two board members are visible, and who holds final power is unresolved.", "good_answer_looks_like": "Documents delivered without fuss; at least three independent directors or a dated plan; the two answers on authority match."}, {"order": 4, "question": "Fields: what share of your working week does CoFo get, who employs and pays any shared staff, has money or referral flowed between CoFo and Holon, and can I see a board minute where you recused from something touching Holon? Who decides Bodymind's awards?", "why": "This is the main structural conflict and also the constraint on execution. A bio disclosure does not manage it.", "good_answer_looks_like": "A specific time share, written cost allocation, a board-enforced rule keeping Holon's areas away from Fields's tober 2026.", "Every.org intermediary terms for stock and crypto gifts: page returned HTTP 429.", "Comparable outcome data for Mind & Life, IONS, IACS, QRI and ISCR: not searched in depth, so peer efficiency cannot be judged.", "Discrepancy noted: the earlier scan said no awardee list existed; the 22 July 2026 post supersedes that. The culture read treats $1.5M as above the award cap, while the ledger notes overhead could bridge it; only the ledger can resolve this."]}, "assessment_before": {"bottom_line": "The Consciousness Foundation is about 15 months past its public launch. It is a small grantmaker for awakening science, probably funded mainly by its chair, and it has run one real grant round but has no published financials, research results or conflict controls. The likeliest failure is that it stays dependent on one patron while 14 grants become 14 separate studies, not the shared measures that justify paying an intermediary. A gift is good for a small or staged, restricted bet on public shared measures and data, after seeing documents; it is not yet good for large unrestricted, long-pledge or endowment money.", "health_score": {"score": 37, "grade": "D+ (provisional: this grades evidenced health today, not predicted quality; most of the shortfall is missing evidence, not known bad facts)", "components": [{"name": "Financial resilience", "score": 35, "weight": 25, "rationale": "Each component is scored 0-100, then weighted: 8.75 + 6 + 4 + 9 + 5.5 + 4 = 37.25. [evidence] No revenue, expense, asset, reserve or runway figure exists: ProPublica shows no 990 data as of 30 October 2026, and no audit or budget was found. [evidence] The only scale figure is a stated $1.5M in 2026 project grants. [evidence, search-result summary only] The chair reportedly committed substantial time and capital; amount and term are unknown. [inference] Above a floor score because 14 awards were named and two grantees confirm awards, which implies some real money. The RFP's single-payment design also limits long-tail grant liabilities. Below the midpoint because funding probably rests on few sources and no outside funder is named."}, {"name": "Governance and transparency", "score": 30, "weight": 20, "rationale": "[evidence] Only two board members can be identified (Strong, Langer), and Candid records none. No conflict, whistleblower or compensation policy is published. I re-read the RFP on 30 October 2026: conflicts of interest are not addressed, reviewers are not named, and IP is not addressed. [evidence] The executive director is also founder of Holon, per CoFo's own bio. No published rule explains how that overlap is managed. Credit: CoFo published the funnel (128, 54, 52, 24, 14), the full project list and the fact that it did not simply fund the top 14 scores. [inference] The missing 990 is probably timing and is not penalized as non-filing. The unpublished board, funders and grant dollars are choices and are penalized."}, {"name": "Change delivered and evidenced", "score": 20, "weight": 20, "rationale": "[evidence] The ledger's top outcomes are significance 2 of unknown scale: 14 projects funded and a data-sharing condition. All five are rated too early on durability. No finding, adopted measure, shared dataset or field-practice change exists, and none could yet, since projects were due to start in September 2026. [evidence] About $100,000 of the stated $1.5M traces to a grantee, and that from search text only. Payment is unverified. Most of the record is CoFo's own word; UVA and Melbourne are the exceptions. [inference] Credit for lead contribution on the call and the sharing condition, and a partial discount for unknown additionality. Trend cannot be assessed. Applicant counts earned no points."}, {"name": "Strategic position in the field", "score": 60, "weight": 15, "rationale": "[evidence] No other awakening-specific call was found, though the search was not exhaustive. The $100,000 ticket sits between Mind & Life's $25,000 and Tiny Blue struments and self-report measures. 4) 2028 results appear as separate papers. 5) By 2031 no lab outside the cohort uses a CoFo-linked measure. 6) Donors find they paid for coordination and bought ordinary meditation studies, with no one able to show otherwise because no success metric was set.", "probability": 0.6, "horizon": "Visible by 2028-29; settled by 2031", "evidence_chain": [{"fact": "CoFo's analysis of 128 LOIs found heavy reliance on self-report, 36 proposals for new instruments, and no common definitions, standards or repositories. It calls coordination the highest-leverage next move.", "source": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "basis": "evidence"}, {"fact": "The RFP requests planned repositories and preregistration or registered reports, but states no mandate for public open data. Sharing obligations run within the cohort.", "source": "https://www.cofo.org/rfp", "basis": "evidence"}, {"fact": "The State of the Field report, labelled Q3 2026, had no public link on 30 October 2026. The analysis promised 'in the coming weeks' on 22 July was absent from the archive about 14 weeks later. Newsletter delivery was not tested.", "source": "https://cofo.org/insights", "basis": "evidence"}, {"fact": "Melbourne's centre began with a $10M gift, and other grantee researchers have acknowledged European Research Council support, so CoFo's money may be marginal to some projects.", "source": "https://www.unimelb.edu.au/newsroom/news/2021/march/university-welcomes-$10-million-gift-for-contemplative-studies-centre", "basis": "inference"}, {"fact": "CoFo publishes no organization-level success measure. A five-year plan is referred to, but none was found.", "source": "https://cofo.org/approach", "basis": "evidence"}, {"fact": "The 60% matches the scenario odds for the low-science row (40% + 25%). Those odds are analyst judgment, with no statistical basis.", "source": null, "basis": "inference"}], "warning_signs": ["No public shared protocol or measurement battery by early 2028", "No coauthor from outside the cohort on any position paper or roadmap", "Reports cite meetings, papers and applicant counts rather than use by outside labs", "The first cohort's quarterly meetings are not documented", "Grant agreements turn out to lack data-sharing terms a funder could enforce"]}, {"rank": 2, "failure_mode": "The Patron's Project: one funder's decision sets the budget, then the public charity status and survival", "mechanism": "1) The chair's capital funds most of the budget. 2) Outside donors do not arrive at scale, because there is no audit, named institutional funder or results before 2028. 3) A second round is delayed or smaller than $1.5M, and Bodymind stays without an RFP. 4) Program leads, each the single owner of a program, leave for better-funded science philanthropy. 5) As the public support test nears around 2030-31, one donor's gifts count only up to 2% of total support, so CoFo must convert to a private foundation, merge or wind down. 6) Outside gifts made in the interim turn out to have displaced the chair's money rather than added to it.", "probability": 0.35, "horizon": "Early signs by end-2027; status crunch 2030-31", "evidence_chain": [{"fact": "A search-result summary of the chair's July 2025 X post says substantial time and capital are being committed. The post could not be fetched, and no amount or term is known.", "source": "https://x.com/winslow_strong/status/1948483311522709759", "basis": "evidence"}, {"fact": "CoFo names no donor. The Bodymind director asked readers in March 2026 to connect CoFo with philanthropists.", "source": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "basis": "evidence"}, {"fact": "A charity generally needs more than one-third public support over five years, and one donor's gifts count only up to 2% of total support. Practitioner sources differ on the start-up mechanics, and CoFo's classification was not seen. t AI-era philanthropy at about $30B-$40B a year. The forecasts conflict, depend on IPOs and do not name consciousness science as a recipient.", "source": "https://www.adn.com/nation-world/2026/10/22/the-biggest-wealth-giveaway-in-modern-history-aims-to-transform-the-world/", "basis": "evidence"}, {"fact": "The approach page offers bespoke donor advising and impact reports. No client count or sample report was found, and CoFo also solicits gifts.", "source": "https://cofo.org/approach", "basis": "evidence"}, {"fact": "Stated stakes include 'steering the future of civilization', before any funded result exists.", "source": "https://cofo.org/fundamental-consciousness", "basis": "evidence"}, {"fact": "124 scholars called integrated information theory pseudoscience and others contested the label, so this field has a live legitimacy dispute that Fundamental Consciousness sits inside.", "source": "https://theconversation.com/nobody-knows-how-consciousness-works-but-top-researchers-are-fighting-over-which-theories-are-really-science-214074", "basis": "evidence"}, {"fact": "No independent evaluation, kill criterion or reviewer list was found, and only two board members are visible.", "source": "https://cofo.org/about", "basis": "evidence"}], "warning_signs": ["New programs or events announced while the State of the Field report, roadmap or Bodymind RFP remains late", "Revenue jumps with no audit", "Annual reports lead with grant dollars and applicant counts", "Advising grows with no published conflict rules", "No independent portfolio review by 2028"]}, {"rank": 4, "failure_mode": "The overlap story: a first filing or a reporter links charitable research direction to leaders' commercial or affiliated interests", "mechanism": "1) The executive director founded a UK healthcare startup, and a job listing suggests leading both with a shared chief of staff. 2) Bodymind then funds healing and chronic-condition research close to that business, while other leaders hold venture, advisory or sister-nonprofit roles. 3) With no published conflict policy or IP terms, a grant, shared-cost allocation or advised-donor referral touches a connected party. 4) Schedule L, a grantee or a journalist surfaces it. 5) Even with no wrongdoing, CoFo cannot show a recusal record. 6) Donors and institutional funders pause, and the small-field trust the model depends on erodes. No such transaction was found. This story is a process risk and not an allegation.", "probability": 0.2, "horizon": "First exposure from late 2026; most likely after Bodymind grants begin", "evidence_chain": [{"fact": "CoFo's bio lists Fields as Executive Director and says Fields 'is also the founder of Holon, a holistic healthcare startup in the United Kingdom'. Current time split and role at Holon are not stated.", "source": "https://cofo.org/team/joshua-fields", "basis": "evidence"}, {"fact": "A job listing, seen only in search snippets of mirrors (the page returned 404), describes a chief of staff employed by Holon and split 50/50 between Holon and CoFo. A targeted search on 30 October 2026 did not corroborate it.", "source": "https://www.idealist.org/es/ong-empleo/c8495f83dddd44ef8f853f7e81ad3bf4-chief-of-staff-the-consciousness-foundation-london", "basis": "evidence"}, {"fact": "Bodymind's page covers healing, chronic conditions and tools for influencing these processes.", "source": "https://cofo.org/bodymind", "basis": "evidence"}, {"fact": "The RFP does not address conflicts of interest, IP or commercialization, and does not name reviewers.", "source": "https://www.cofo.org/rfp", "basis": "evidence"}, {"fact": "Show notes record the Chief Scientific Officer's outside advisory role with Jhourney, and one funded project studies jhana. No link between them is shown.", "source": "https://themetagame.substack.com/p/52-kathryn-devaney-the-neuroscience", "basis": "evidence"}, {"fact": "Langer sits on the boards of CoFo, Qualia Research Institute and Co-sentience Initiative, and is linked to ers": ["First 990 plus 2025-26 financial statements, and an audit engaged", "Board-approved 2027 budget and revenue by funder band", "Written funding floor from the chair or board for 2027-29", "Full board list with independent majority, and published conflict and recusal policies", "Revisit only after the first cohort's public outputs (about 2028)"]}, {"gift_type": "major_restricted", "risk": "elevated", "rationale": "[inference] This is the best large form, and CoFo's donate page accepts program direction by memo or email. It remains elevated because restriction does not prevent displacement, the program team is thin, and the Q3 report and analysis are late. It falls to moderate with the conditions listed. Decision: start at about $115,000 (one project at the RFP ceiling, including overhead) up to a few hundred thousand dollars for shared measures and a public repository. The landscape section's $1.5M is an outer limit that needs the budget and funder breakdown first, and it should not be the opening size.", "risk_reducers": ["Staged payments released on public outputs: protocol, battery, repository", "Data held by an independent custodian under open licensing", "Adverse-event and null-result reporting written into the standard", "Evidence that the gift adds to the budget, plus a match for new outside donors", "Clause redirecting unspent money on wind-down, merger or private-foundation status", "Paid independent evaluation around 2028", "Named owner for the deliverable with a stated time commitment"]}, {"gift_type": "multi_year_pledge", "risk": "elevated", "rationale": "[inference] An unconditional pledge is high risk: results cannot arrive before about 2028, and the charity's status and funding may change by 2030-31. A conditional pledge is better than a lump sum because it gives CoFo a visible outside commitment while keeping exits. A pledge also has signaling value, but that signal only helps if it attracts other donors.", "risk_reducers": ["Annual payments con _usd": 50, "pipeline_tier": "quality", "includes": ["Everything in Standard, researched at the highest setting", "Your supplied documents read and cited: audits, strategic plans, board decks, proposals", "An interview sheet built from the verdict's questions", "A second verdict after your conversation with the organization, showing what changed"], "turnaround": "Same day, with a second verdict after your interview"}], "disclaimer": "Dossiers are compiled from public records by research agents and arithmetic on filed numbers. Every claim is tagged evidence, inference or speculation and carries its sources. Nothing in a dossier is legal, financial, tax or investment advice, and the organization assessed has not reviewed it. Verify anything you intend to act on.", "correction_note": "Organizations and readers may request a correction to any factual claim. Corrections that check out are made and noted on the page.", "sample_note": "Sample dossier, published to show what the service produces. The organization did not commission it and has not reviewed it. All figures come from public filings and published sources linked in each section.", "not_included": ["Psychological profiles of individuals. Culture is read at the level of the organization, from public professional material only.", "Private or leaked material.", "A recommendation to give or not give. The dossier lays out the risks, the strengths and the questions; the decision stays yours."]}, "internal": false, "sample": true, "nav": {"home_href": "../../index.html#diligence-the-consciousness-foundation", "home_label": "Noah's Weblog", "landing_href": "../", "about_href": "../../about.html"}};

<script>
(function(){
const D = DATA || {};
const I = D.identity, F = D.financials, S = D.scan, RS = D.results, L = D.landscape, C = D.culture, LD = D.leader, X = D.scenarios, A = D.assessment, AB = D.assessment_before, SUP = D.supplied, M = D.manifest || {};
const PRODUCT = D.product || {name:'Dossier'}, INTERNAL = !!D.internal, SAMPLE = !!D.sample, NAV = D.nav || {};
const grade = g => (String(g||'').match(/^[A-F][+-]?/)||[String(g||'')])[0];
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => n==null ? '—' : (Math.abs(n)>=1e6 ? (n/1e6).toFixed(n>=1e8?0:1)+'M' : Math.abs(n)>=1e3 ? (n/1e3).toFixed(0)+'K' : String(n)).replace(/^(-?)/, '$1$');
const num = (n,d=1) => n==null ? '—' : (+n).toFixed(d).replace(/\.0$/,'');
const pct = n => n==null ? '—' : num(n)+'%';
const conf = c => c==null ? '' : `<span class="conf">conf ${Math.round(c*100)}%</span>`;
const badge = (t,cls) => `<span class="b ${cls||''}">${esc(t)}</span>`;
const srcs = list => (list&&list.length) ? `<div class="src">${list.map(s => { const u=String(s.url||s); return /^supplied:\/\//i.test(u) ? `<span class="b" title="${esc(u)}">supplied: ${esc(s.title||u.replace(/^supplied:\/\//i,''))}</span>` : `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(s.title||u)}</a>`; }).join(' · ')}</div>` : '';
const words = s => esc(s).replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>');
const prose = s => s ? `<div class="prose"><p>${words(s)}</p></div>` : '';
const redact = (txt, basis) => basis==='speculation' ? `<span class="redact" tabindex="0" title="Speculation. Click to read.">${esc(txt)}</span>` : esc(txt);
function claim(c, title){
  if(!c) return '';
  const basis = c.basis || 'inference';
  const text = c.statement || c.summary || c.explanation || c.rationale || c.answer || c.detail || '';
  return `<div class="claim" data-basis="${basis}"><div class="head">${title?`<b>${esc(title)}</b>`:''}${badge(basis,basis)}${conf(c.confidence)}</div><div class="body">${redact(text,basis)}</div>${srcs(c.sources)}</div>`;
}
const empty = (what) => `<div class="empty"><b>${esc(what)} was not produced.</b> Re-run the phase with <code>python3 dossier.py "…" --phases …</code> and render again.</div>`;
const list = (arr, fn) => (arr&&arr.length) ? `<ul>${arr.map(x=>`<li>${fn?fn(x):esc(x)}</li>`).join('')}</ul>` : '<p class="muted small">None recorded.</p>';

/* ---------- sections ---------- */
const sections = [];
function section(key, label, html){ sections.push({key,label,html}); }

/* cover */
(function(){
  const name = ((I&&I.common_name) || (M.org_name) || 'Unknown organization').split(/\s+\/\s+|\s+\(/)[0].trim();
  const legal = I ? String(I.legal_name||'').split(/\s+\(/)[0] : '';
  const hs = A && A.health_score;
  const pm = A && A.premortem && A.premortem.slice().sort((a,b)=>a.rank-b.rank)[0];
  const flags = F && F.primary && F.primary.ratios && F.primary.ratios.flags || [];
  const cost = Object.values(M.phases||{}).reduce((s,p)=>s+(p.cost_usd||0),0);
  let h = `<div class="cover-grid"><div>`;
  h += A ? `<div class="lede">${esc(A.bottom_line)}</div>` : empty('The assessment');
  if(pm){ h += `<div class="failure"><div class="t">Most likely way this organization fails, stalls, or embarrasses its donors</div><div class="f">${esc(pm.failure_mode)}</div><div class="m">${esc(pm.mechanism)}</div><div class="small muted" style="margin-top:10px">Probability over ${esc(pm.horizon)}: ${Math.round((pm.probability||0)*100)}% · ${A.premortem.length} failure modes ranked in the verdict</div></div>`; }
  h += `<div class="kv">
    <div>Red flags in the numbers</div><div>${flags.filter(f=>f.severity==='red').length} red, ${flags.filter(f=>f.severity==='amber').length} amber</div>
    <div>Dossier compiled</div><div>${esc(M.last_run||'')}</div>
    ${INTERNAL?`<div>Internal: agents</div><div>${esc(M.model||'')} · tier ${esc(M.tier||'quality')} · ${Object.keys(M.phases||{}).length} phases · $${cost.toFixed(2)} model spend</div>`:''}
    <div>Identity confidence</div><div>${I?Math.round((I.identity_confidence||0)*100)+'%':'—'}</div>
    ${SUP&&SUP.length?`<div>Supplied documents</div><div>${SUP.map(s=>esc(s.file)).join(', ')}</div>`:''}
  </div></div>`;
  h += `<div>${hs?`<div class="health"><div class="n">${hs.score}<small>of 100 · ${esc(grade(hs.grade))}</small></div><div class="g">Health score, weighted</div><table>${(hs.components||[]).map(c=>`<tr><td>${esc(c.name)}<div class="bar"><i style="width:${c.score}%"></i></div></td><td class="num">${c.score}</td></tr>`).join('')}</table></div>`:''}</div></div>`;
  h += `<h2>How to read this</h2><div class="prose"><p>Every claim carries a tag. <span class="b evidence">evidence</span> means an agent saw it in a fetched source. <span class="b inference">inference</span> is a reading of evidence. <span class="b speculation">speculation</span> is a hypothesis worth checking; those lines are redacted until you click them. The filter in the menu hides the weaker tiers. The ratio section is pure arithmetic on Form 990 numbers and involves no model judgment.</p></div>`;
  section('cover','Cover',h);
})();

/* brief */
(function(){
  const name = ((I&&I.common_name) || (M.org_name) || '').split(/\s+\/\s+|\s+\(/)[0].trim();
  if(!A){ section('brief','Brief',`<h1>Brief</h1>`+empty('The assessment')); return; }
  const hs=A.health_score, pm=(A.premortem||[]).slice().sort((a,b)=>a.rank-b.rank).slice(0,3);
  const flags=(F&&F.primary&&F.primary.ratios&&F.primary.ratios.flags)||[];
  let h = `<div class="row" style="justify-content:space-between"><div><h1>${esc(name)}</h1><p class="sub">Donor brief · ${esc(M.last_run||'')}${I&&I.ein?` · EIN ${esc(I.ein)}`:''}${I&&I.hq?` · ${esc([I.hq.city,I.hq.state].filter(Boolean).join(', '))}`:''}</p></div><button id="print-brief">Print or save as PDF</button></div>`;
  h += `<div class="cover-grid"><div><div class="lede">${esc(A.bottom_line)}</div></div><div>${hs?`<div class="stamp"><div class="n">${hs.score}</div><div class="g">Health ${esc(grade(hs.grade))} / 100</div></div>`:''}</div></div>`;
  if(hs) h += `<h2>Score</h2><div class="bars">${hs.components.map(c=>`<div>${esc(c.name)} <span class="muted small">×${c.weight}</span></div><div class="track"><div class="fill" style="width:${c.score}%"></div></div><div class="v">${c.score}</div>`).join('')}</div>`;
  h += `<h2>Most likely failures</h2><ol>${pm.map(p=>`<li style="max-width:84ch;margin-bottom:10px"><b>${esc(p.failure_mode)}</b> <span class="muted small">${Math.round(p.probability*100)}% over ${esc(p.horizon)}</span><br><span class="small">Watch for: ${esc((p.warning_signs||[]).slice(0,3).join('; '))}</span></li>`).join('')}</ol>`;
  h += `<h2>Gift risk</h2><table><tr><th>Gift</th><th>Risk</th><th>What lowers it</th></tr>${(A.gift_risk||[]).map(g=>`<tr><td class="wrap">${esc(g.gift_type.replace(/_/g,' '))}</td><td>${badge(g.risk,{low:'green',moderate:'amber',elevated:'amber',high:'red'}[g.risk]||'na')}</td><td class="wrap small">${esc((g.risk_reducers||[]).slice(0,3).join(' · '))}</td></tr>`).join('')}</table>`;
  if(flags.length) h += `<h2>Numbers that need an explanation</h2><ul>${flags.map(f=>`<li><span class="light ${f.severity}"></span>${esc(f.label)}: <b>${num(f.value,2).replace(/\.?0+$/,'')}${esc(f.unit)}</b> <span class="muted small">${esc(f.why)}</span></li>`).join('')}</ul>`;
  if(A.efficiency) h += `<h2>What the money produced</h2><p class="prose">${esc(A.efficiency.verdict)}</p>`;
  h += `<h2>Ask before giving</h2><ol>${(A.questions_to_ask||[]).slice().sort((a,b)=>a.order-b.order).map(q=>`<li style="max-width:84ch">${esc(q.question)}</li>`).join('')}</ol>`;
  h += `<h2>Confidence</h2><p class="prose">${esc(A.confidence_statement)}</p><p class="small muted">The full dossier has every section with sources. Claims are tagged evidence, inference or speculation; see the dossier for tags and links.</p>`;
  section('brief','Brief',h);
})();

/* identity */
(function(){
  if(!I){ section('identity','Identity',empty('The identity step')); return; }
  let h = `<h1>Identity and structure</h1><p class="sub">Which legal entity a gift reaches, and what sits around it</p>`;
  h += `<div class="kv"><div>Legal name</div><div>${esc(I.legal_name)}</div><div>EIN</div><div>${esc(I.ein||'not resolved')}</div><div>Website</div><div>${esc(I.website||'—')}</div><div>Status</div><div>${esc(I.irs_subsection||'—')}${I.ntee_code?` · NTEE ${esc(I.ntee_code)}`:''}${I.founded_year?` · founded ${I.founded_year}`:''}</div><div>Size as stated</div><div>${esc([I.size&&I.size.staff, I.size&&I.size.budget].filter(Boolean).join(' · ')||'—')}${I.size&&I.size.as_stated_by?` <span class="muted">(${esc(I.size.as_stated_by)})</span>`:''}</div></div>`;
  h += `<h2>Entity structure</h2><div class="pre">${esc(I.entity_structure)}</div>`;
  h += `<h2>Where a donor's check goes</h2><div class="pre">${esc(I.donor_check_goes_to)}</div>`;
  if(I.affiliated_entities&&I.affiliated_entities.length){ h += `<h2>Affiliated entities</h2><table><tr><th>Entity</th><th>EIN</th><th>Relationship</th><th>Money and control</th></tr>${I.affiliated_entities.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.ein||'—')}</td><td class="wrap">${esc(a.relationship)}</td><td class="wrap">${esc(a.money_and_control)}${srcs(a.sources)}</td></tr>`).join('')}</table>`; }
  h += `<div class="two"><div><h3>Mission, verbatim</h3>${prose(I.mission_statement)}</div><div><h3>What they actually do</h3>${prose(I.what_they_actually_do)}</div></div>`;
  h += `<h2>Leadership</h2><table><tr><th>Name</th><th>Role</th><th>Since</th><th>Public footprint</th></tr>${(I.leadership||[]).map(l=>`<tr><td>${esc(l.name)}</td><td class="wrap">${esc(l.title)}</td><td>${esc(l.since||'—')}</td><td class="wrap small">${(l.footprint||[]).map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.title)}</a>`).join(' · ')}</td></tr>`).join('')}</table>`;
  if(I.board) h += `<p class="small">Board: chair ${esc(I.board.chair||'unknown')}${I.board.size?`, ${I.board.size} members`:''}. ${esc(I.board.notes||'')}</p>`;
  h += `<h2>Resolution notes</h2><div class="pre">${esc(I.resolution_notes)}</div><p class="small muted">Identity confidence ${Math.round((I.identity_confidence||0)*100)}%</p>${srcs(I.sources)}`;
  section('identity','Identity',h);
})();

/* money */
(function(){
  if(!F||!F.primary){ section('money','Money',empty('The financial extract')); return; }
  const R = F.primary.ratios, E = F.primary.entity;
  let h = `<h1>Money</h1><p class="sub">${esc(E.name||'')}${E.profile_url?` · <a href="${esc(E.profile_url)}" target="_blank" rel="noopener">ProPublica record</a>`:''}</p>`;
  if(!R.available){ h += `<div class="empty"><b>No Form 990 data.</b> ${esc(R.reason||'')} For a young organization this is normal; it is also the first thing to ask for.</div>`; }
  else {
    h += `<div class="chart-wrap" id="chart"></div>`;
    h += `<h2>Filed years</h2><table><tr><th>FY</th><th class="num">Revenue</th><th class="num">Expenses</th><th class="num">Margin</th><th class="num">Net assets</th><th class="num">Months held</th><th class="num">Contrib. share</th><th>Highest paid</th><th class="num">Total pay</th><th></th></tr>`;
    h += R.series.slice().reverse().map(s=>`<tr><td>${s.year}</td><td class="num">${money(s.revenue)}</td><td class="num">${money(s.expenses)}</td><td class="num" style="color:${(s.margin_pct||0)<0?'var(--c2)':'inherit'}">${pct(s.margin_pct)}</td><td class="num">${money(s.net_assets)}</td><td class="num">${num(s.reserves_months)}</td><td class="num">${pct(s.contrib_share_pct)}</td><td class="wrap small">${esc(s.top_paid_name||'—')}${s.top_paid_title?` <span class="muted">${esc(s.top_paid_title)}</span>`:''}</td><td class="num">${money(s.top_paid_total)}</td><td class="small">${s.full_filing_url?`<a href="${esc(s.full_filing_url)}" target="_blank" rel="noopener">990</a>`:''}</td></tr>`).join('')+`</table>`;
    const pix = (F.primary.part_ix&&F.primary.part_ix.length) ? F.primary.part_ix : F.primary.ratios_from_part_ix;
    if(pix&&pix.length){
      h += `<h2>Functional expenses (Form 990 Part IX)</h2><table><tr><th>FY</th><th class="num">Total</th><th class="num">Program</th><th class="num">Management</th><th class="num">Fundraising</th><th class="num">Cost to raise $1</th><th></th></tr>${pix.map(r=>`<tr><td>${r.year}</td><td class="num">${money(r.total)}</td><td class="num">${money(r.program)} <span class="muted">${pct(r.program_pct)}</span></td><td class="num">${money(r.management)} <span class="muted">${pct(r.management_pct)}</span></td><td class="num">${money(r.fundraising)} <span class="muted">${pct(r.fundraising_pct)}</span></td><td class="num">${r.cost_to_raise_a_dollar==null?'—':'$'+r.cost_to_raise_a_dollar.toFixed(2)}</td><td class="small"><a href="${esc(r.source_url)}" target="_blank" rel="noopener">990</a></td></tr>`).join('')}</table><p class="small muted">${esc(pix[0].provenance||'Parsed directly from the e-filed return as rendered by ProPublica.')}</p>`;
    }
    const fd = F.primary.filing_detail&&F.primary.filing_detail[0];
    if(fd){ const g=fd.governance||{}; const yes=v=>v==null?'<span class="muted">not parsed</span>':v;
      const ind = fd.voting_members?Math.round(100*(fd.independent_voting_members||0)/fd.voting_members):null;
      h += `<h2>Governance answers, FY${fd.year} return</h2><div class="kv"><div>Board</div><div>${fd.voting_members??'—'} voting members, ${fd.independent_voting_members??'—'} independent${ind!=null?` (${ind}%)`:''}</div><div>Staff</div><div>${fd.employees??'—'} employees, ${fd.volunteers??'—'} volunteers</div><div>From related organizations</div><div>${money(fd.contrib_related_orgs)}</div><div>Government grants</div><div>${money(fd.contrib_government)}</div><div>Noncash gifts</div><div>${money(fd.contrib_noncash)}</div><div>Conflict of interest policy</div><div>${yes(g.conflict_of_interest_policy)}</div><div>Whistleblower policy</div><div>${yes(g.whistleblower_policy)}</div><div>Board saw the 990 before filing</div><div>${yes(g.board_reviewed_990)}</div><div>Independent review of CEO pay</div><div>${yes(g.ceo_comp_independent_review)}</div><div>Separate independent audit</div><div>${yes(g.separate_audit)}${g.consolidated_audit==='Yes'?' (consolidated audit: yes)':''}</div><div>Excess benefit transaction</div><div>${yes(g.excess_benefit_transaction)}</div><div>Loans to or from insiders</div><div>${yes(g.loans_to_or_from_insiders)}</div><div>Business with insiders</div><div>${yes(g.business_with_insiders)}</div><div>Family or business ties among officers</div><div>${yes(g.family_or_business_relationships_among_officers)}</div><div>Diversion of assets</div><div>${yes(g.material_diversion_of_assets)}</div><div>Lobbying</div><div>${yes(g.lobbying_activities)}</div><div>Schedules filed</div><div>${(fd.schedules_present||[]).join(', ')||'—'}</div></div>`;
      if(fd.schedule_o){ h += `<details><summary><span class="r">O</span><span class="fm">Schedule O narrative, as filed</span><span class="pr">excerpt</span></summary><div class="in"><p class="small" style="max-width:none;white-space:pre-wrap">${esc(fd.schedule_o.replace(/ \| /g,'\n').slice(0,12000))}</p></div></details>`; }
    }
    if(R.top_people&&R.top_people.length){ h += `<h2>Highest compensated, FY${R.pay_year}</h2><table><tr><th>Name</th><th>Title</th><th class="num">Base</th><th class="num">Related orgs</th><th class="num">Other</th><th class="num">Total</th><th class="num">% of expenses</th></tr>${R.top_people.map(p=>`<tr><td>${esc(p.name)}</td><td class="wrap">${esc(p.title)}</td><td class="num">${money(p.compensation)}</td><td class="num">${money(p.related)}</td><td class="num">${money(p.other)}</td><td class="num">${money(p.total)}</td><td class="num">${pct(100*p.total/(R.series[R.series.length-1].expenses||1))}</td></tr>`).join('')}</table>`; }
  }
  if(F.affiliates&&F.affiliates.length){
    h += `<h2>Affiliated entities, latest filed year</h2><table><tr><th>Entity</th><th>EIN</th><th>FY</th><th class="num">Revenue</th><th class="num">Expenses</th><th class="num">Net assets</th><th>Flags</th></tr>`;
    h += F.affiliates.map(a=>{const r=a.ratios, s=r.available?r.series[r.series.length-1]:{}; return `<tr><td class="wrap">${esc(a.entity.name||a.entity.ein)}</td><td>${esc(a.entity.ein)}</td><td>${s.year||'—'}</td><td class="num">${money(s.revenue)}</td><td class="num">${money(s.expenses)}</td><td class="num">${money(s.net_assets)}</td><td class="wrap small">${r.available?(r.flags||[]).map(f=>`<span class="light ${f.severity}"></span>${esc(f.label)} ${num(f.value)}${esc(f.unit)}`).join('<br>'):esc(r.reason||'no data')}</td></tr>`;}).join('')+`</table>`;
  }
  h += `<p class="small muted">${esc(R.method_note||'')}</p>`;
  section('money','Money',h);
})();

/* ratios */
(function(){
  const R = F&&F.primary&&F.primary.ratios;
  if(!R||!R.available){ section('ratios','Ratios',`<h1>Ratios</h1>`+(R?`<div class="empty"><b>No ratios.</b> ${esc(R.reason||'')}</div>`:empty('The financial extract'))); return; }
  let h = `<h1>The weird ratios</h1><p class="sub">Arithmetic on filed numbers, thresholds scaled to the ${esc(R.size_band)} band. Flags prompt questions; they do not settle them.</p>`;
  const anomalies = {}; (A&&A.ratio_anomalies||[]).forEach(a=>anomalies[a.key]=a);
  const order = Object.values(R.ratios).sort((a,b)=>({red:0,amber:1,green:2,na:3}[a.flag]-{red:0,amber:1,green:2,na:3}[b.flag]));
  h += `<div class="ratios">`+order.map(r=>{
    const an = anomalies[r.key];
    return `<div class="ratio ${r.flag}"><div class="l"><span class="light ${r.flag}"></span>${esc(r.label)}</div><div class="v">${r.value==null?'—':num(r.value,2).replace(/\.?0+$/,'')}<small>${esc(r.unit)}</small></div><div class="f">${esc(r.formula)} · ${esc(r.year)}</div>${r.note?`<div class="why muted">${esc(r.note)}</div>`:''}${(R.flags.find(f=>f.key===r.key)||{}).why?`<div class="why">${esc(R.flags.find(f=>f.key===r.key).why)}</div>`:''}${an?`<div class="why"><b>Benign:</b> ${esc(an.benign)}<br><b>Worrying:</b> ${esc(an.worrying)}<br><b>Evidence supports:</b> ${esc(an.evidence_supports)}<br><b>Ask:</b> ${esc(an.settling_question)}</div>`:''}</div>`;
  }).join('')+`</div>`;
  const P = F.peer_comparison;
  if(P&&P.rows&&P.rows.length){
    h += `<h2>Against ${P.peer_count} peers</h2><p class="small muted">Peers were named by the landscape agent; their numbers come from the same Form 990 source. The band is the peer range, the tick the peer median, the dot this organization.</p><table><tr><th>Ratio</th><th class="num">This org</th><th class="num">Peer median</th><th>Range</th><th class="num">Percentile</th></tr>`;
    h += P.rows.map(r=>{const lo=Math.min(r.peer_min,r.subject==null?r.peer_min:r.subject), hi=Math.max(r.peer_max,r.subject==null?r.peer_max:r.subject), sp=(hi-lo)||1, x=v=>((v-lo)/sp*100).toFixed(1)+'%';
      return `<tr><td class="wrap">${esc(r.label)}</td><td class="num">${num(r.subject,2)}</td><td class="num">${num(r.peer_median,2)}</td><td style="min-width:180px"><div class="range"><div class="tr"></div><div class="band" style="left:${x(r.peer_min)};width:${((r.peer_max-r.peer_min)/sp*100).toFixed(1)}%"></div><div class="med" style="left:${x(r.peer_median)}"></div>${r.subject==null?'':`<div class="me" style="left:${x(r.subject)}" title="this organization"></div>`}</div></td><td class="num">${r.percentile==null?'—':r.percentile+'th'}</td></tr>`;}).join('')+`</table>`;
    h += `<table><tr><th>Peer</th><th>Relationship</th><th>FY</th><th class="num">Expenses</th><th>Highest paid</th><th class="num">Total pay</th></tr>${(P.peers||[]).map(p=>`<tr><td class="wrap">${esc(p.name)}</td><td class="small">${esc(p.relationship||'')}</td><td>${p.latest_year||'—'}</td><td class="num">${money(p.expenses)}</td><td class="wrap small">${esc(p.top_paid_name||'—')}</td><td class="num">${money(p.top_paid_total)}</td></tr>`).join('')}</table>`;
  } else h += `<p class="small muted">No peer comparison available (peers without EINs, or the landscape step has not run).</p>`;
  h += `<p class="small muted">${esc(R.method_note)}</p>`;
  section('ratios','Ratios',h);
})();

/* record */
(function(){

  h += `<h2>Governance notes</h2>`+(S.governance_notes||[]).map(c=>claim(c)).join('');
  if(S.flag_explanations&&S.flag_explanations.length){ h += `<h2>What is behind the flagged ratios</h2>`+S.flag_explanations.map(c=>claim(c, c.flag_key)).join(''); }
  h += `<h2>Ratings</h2>`+(S.charity_ratings&&S.charity_ratings.length?`<table><tr><th>Rater</th><th>Rating</th><th>Date</th></tr>${S.charity_ratings.map(r=>`<tr><td>${esc(r.rater)}</td><td class="wrap">${esc(r.rating)}</td><td>${esc(r.date||'—')} <a class="small" href="${esc(r.url)}" target="_blank" rel="noopener">source</a></td></tr>`).join('')}</table>`:'<p class="muted small">None found.</p>');
  h += `<h2>Registration and audit</h2>`+(S.registration_and_audit||[]).map(c=>claim(c)).join('');

  h += `<h2>Legal and controversy</h2>`+(S.legal_and_controversy&&S.legal_and_controversy.length?S.legal_and_controversy.map(t=>claim({statement:`${t.detail} ${t.status?'Status: '+t.status+'.':''}`,basis:t.basis,confidence:t.confidence,sources:t.sources}, `${t.date||''} ${t.headline}`)).join(''):'<p class="muted small">None found.</p>');
  h += `<h2>Major funders</h2>`+(S.major_funders&&S.major_funders.length?`<table><tr><th>Funder</th><th>Amount</th><th>Year</th><th>Note</th></tr>${S.major_funders.map(f=>`<tr><td class="wrap">${esc(f.name)}</td><td>${esc(f.amount||'—')}</td><td>${esc(f.year||'—')}</td><td class="wrap">${esc(f.note)}${srcs(f.sources)}</td></tr>`).join('')}</table>`:'<p class="muted small">None found.</p>');
  h += `<h2>Program claims versus evidence</h2>`+(S.program_claims||[]).map(c=>`<div class="claim" data-basis="${c.evidence_status==='independently_verified'?'evidence':c.evidence_status==='self_reported_with_data'?'inference':'speculation'}"><div class="head">${badge(c.evidence_status.replace(/_/g,' '), c.evidence_status==='contradicted'?'red':c.evidence_status==='independently_verified'?'evidence':c.evidence_status==='self_reported_with_data'?'inference':'speculation')}</div><div class="body"><b>${esc(c.claim)}</b><br>${esc(c.detail)}</div>${srcs(c.sources)}</div>`).join('');
  if(S.media_footprint) h += `<h2>Media footprint</h2>`+claim({statement:`Volume: ${S.media_footprint.volume}. Tone: ${S.media_footprint.tone}. Pattern: ${S.media_footprint.pattern}`,basis:S.media_footprint.basis,sources:S.media_footprint.sources});

/* results */
(function(){
  if(!RS){ section('results','Results',empty('The results ledger')); return; }
  const spark = (series, w=160, h=36) => { const pts=(series||[]).filter(p=>p.value!=null).sort((a,b)=>a.year-b.year); if(pts.length<2) return pts.length===1?`<span class="small muted">${pts[0].year}: ${esc(pts[0].value_text||pts[0].value)}</span>`:'<span class="small muted">no series</span>';
    const xs=pts.map(p=>p.year), ys=pts.map(p=>p.value); const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys); const X=v=>6+(w-12)*((v-x0)/((x1-x0)||1)), Y=v=>h-6-(h-12)*((v-y0)/((y1-y0)||1));
    const d=pts.map((p,i)=>(i?'L':'M')+X(p.year).toFixed(1)+' '+Y(p.value).toFixed(1)).join(' ');
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${pts[0].year} to ${pts[pts.length-1].year}"><path d="${d}" fill="none" stroke="#000080" stroke-width="2" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${X(p.year).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="${p.kind==='actual'?3.5:2.5}" fill="${p.kind==='actual'?'#000080':'#ffffff'}" stroke="#000080" stroke-width="1.5"><title>${p.year} ${p.kind||''}: ${esc(p.value_text||p.value)}</title></circle>`).join('')}</svg>`; };
  const evq = q => badge((q||'unknown').replace(/_/g,' '), q==='independently_verified'?'evidence':q==='self_reported_with_data'?'inference':q==='contradicted'?'red':'speculation');
  const contrib = {lead:'green',co_lead:'green',one_of_many:'amber',claimed_contested:'amber',claimed_contradicted:'red'};
  const dur = {in_force:'green',partly_reversed:'amber',reversed:'red',too_early:'na',unknown:'na'};
  let h = `<h1>Results</h1><p class="sub">What changed in the world because of this organization, and what it cost. ${RS.mode?`Assessed ${esc(RS.mode.primary)}ly: ${esc(RS.mode.rationale)}`:''}</p>${prose(RS.verdict)}`;
  const outs=(RS.outcomes||[]).slice().sort((a,b)=>a.rank-b.rank);
  h += `<h2>Outcome harvest</h2><p class="small muted">The most significant changes over the last five years that the organization claims or can be shown to have contributed to. Significance 1 (local, minor, easily reversed) to 5 (structural, wide, durable). Contribution is the organization's fair share of the credit.</p>`;
  h += outs.map(o=>`<details${o.rank<=2?' open':''}><summary><span class="r">${o.rank}</span><span class="fm">${esc(o.what_changed)}</span><span class="pr"><span class="dots">${'●'.repeat(o.significance)}<span class="off">${'●'.repeat(Math.max(0,5-o.significance))}</span></span> ${o.year||''}</span></summary><div class="in"><div class="row" style="margin:6px 0 10px">${badge('contribution: '+o.contribution.replace(/_/g,' '), contrib[o.contribution]||'na')} ${badge('durability: '+o.durability.replace(/_/g,' '), dur[o.durability]||'na')} ${evq(o.evidence_quality)} ${badge(o.basis,o.basis)}${o.program?` <span class="small muted">${esc(o.program)}</span>`:''}</div><div class="kv"><div>For whom</div><div>${esc(o.for_whom)}${o.count?` · ${esc(o.count)}`:''}</div><div>Counterfactual</div><div>${esc(o.counterfactual)}</div><div>Others involved</div><div>${esc((o.others_involved||[]).join(', ')||'—')}</div><div>Evidence</div><div>${esc(o.evidence)}</div></div>${srcs(o.sources)}</div></details>`).join('') || '<p class="muted small">No outcomes could be established.</p>';
  h += `<h2>Failures and reversals</h2>`+((RS.failures_and_reversals&&RS.failures_and_reversals.length)?RS.failures_and_reversals.map(f=>claim({statement:`${f.consequence}${f.how_handled?'\n\nHow handled: '+f.how_handled:''}`,basis:f.basis,sources:f.sources}, `${f.year||''} ${f.what}`)).join(''):'<p class="muted small">None found in the public record. For an organization more than a few years old that is itself a finding.</p>');
  const d2=RS.dollars_to_change;
  if(d2){ const ns=d2.north_star||{}; const last=(ns.series||[]).slice().sort((a,b)=>b.year-a.year)[0];
    h += `<h2>Dollars to change</h2><div class="two"><div><h3>Latest year${d2.latest&&d2.latest.year?', FY'+d2.latest.year:''}${d2.latest&&d2.latest.spent?' · '+money(d2.latest.spent)+' spent':''}</h3>${prose(d2.latest&&d2.latest.summary)}</div><div><h3>Earliest reconstructed${d2.earliest&&d2.earliest.year?', FY'+d2.earliest.year:''}${d2.earliest&&d2.earliest.spent?' · '+money(d2.earliest.spent)+' spent':''}</h3>${prose(d2.earliest&&d2.earliest.summary)}</div></div>`;
    h += claim({statement:`${d2.qualitative_judgment}\n\nStrongest item: ${d2.strongest_item}\n\nWeakest item: ${d2.weakest_item}`,basis:d2.basis}, 'Portfolio judgment');
    if(ns.measure){ h += `<h3>North star: ${esc(ns.measure)} ${badge(ns.defensible?'defensible':'not defensible from public data', ns.defensible?'green':'amber')}</h3>${last?`<div class="row"><span class="ratio" style="padding:8px 14px"><span class="v" style="font-size:22px">${esc(last.value_text||last.value)}</span><span class="f"> ${last.year}</span></span>${spark(ns.series,320,60)}</div>`:''}<p class="small">${esc(ns.limits||'')}${ns.what_would_make_it_possible?`<br><span class="muted">What would make it possible: ${esc(ns.what_would_make_it_possible)}</span>`:''}</p>`; }
    else if(ns.what_would_make_it_possible) h += `<p class="small"><b>No defensible per-dollar measure.</b> ${esc(ns.what_would_make_it_possible)}</p>`; }
  if(RS.trend) h += `<h2>Trend</h2>`+claim({statement:RS.trend.rationale,basis:RS.trend.basis}, `Change per dollar: ${RS.trend.change_per_dollar.replace(/_/g,' ')} · reporting moving ${RS.trend.reporting_direction.replace(/_/g,' ')}`);
  if(RS.targets){ const r=RS.targets; h += `<h2>Says in advance what it will change?</h2>`+claim({statement:r.summary,basis:r.basis}, `Publishes targets: ${r.publishes_targets}`)+(r.examples&&r.examples.length?`<table><tr><th>Goal</th><th>Year</th><th>Stated</th><th>Result</th></tr>${r.examples.map(t=>`<tr><td class="wrap">${esc(t.goal)}</td><td>${esc(t.year||'—')}</td><td class="wrap">${esc(t.stated)}</td><td class="wrap">${esc(t.result)}${srcs(t.sources)}</td></tr>`).join('')}</table>`:''); }
  h += `<h2>Programs, by year</h2>`+(RS.programs||[]).map(p=>`<h3>${esc(p.program)} ${evq(p.evidence_quality)}</h3><table><tr><th>FY</th><th class="num">Expenses</th><th>Results claimed</th></tr>${(p.years||[]).slice().sort((a,b)=>b.year-a.year).map(y=>`<tr><td>${y.year}</td><td class="num">${money(y.expenses)}</td><td class="wrap">${esc(y.results_claimed)}${srcs(y.sources)}</td></tr>`).join('')}</table>${p.cost_per_unit&&p.cost_per_unit.length?`<table><tr><th>FY</th><th>Outcome unit</th><th class="num">Cost per unit</th><th>Computed as, and why it is defensible</th></tr>${p.cost_per_unit.slice().sort((a,b)=>b.year-a.year).map(c=>`<tr><td>${c.year}</td><td class="wrap">${esc(c.unit)}</td><td class="num">${money(c.cost)}</td><td class="wrap small">${esc(c.numerator)} / ${esc(c.denominator)} · ${esc(c.why_defensible)}</td></tr>`).join('')}</table>`:'<p class="small muted">No defensible outcome unit for a cost-per-unit figure.</p>'}`).join('');
  if(RS.peer_comparables&&RS.peer_comparables.length) h += `<h2>Comparable outcomes reported by peers</h2><table><tr><th>Peer</th><th>Outcome</th><th>Value</th><th>Year</th></tr>${RS.peer_comparables.map(p=>`<tr><td class="wrap">${esc(p.peer)}</td><td class="wrap">${esc(p.outcome)}</td><td class="wrap">${esc(p.value_text)}${srcs(p.sources)}</td><td>${esc(p.year||'—')}</td></tr>`).join('')}</table>`;
  h += `<details><summary><span class="r">#</span><span class="fm">Activity counts, low weight</span><span class="pr">${(RS.activity_counts||[]).length} series</span></summary><div class="in"><p class="small muted">Outputs the organization reports about itself. Useful for spotting a change in reporting, not for judging impact.</p>`+((RS.activity_counts&&RS.activity_counts.length)?`<table><tr><th>Metric</th><th>Level</th><th>Series</th><th>Trend</th><th>Note</th></tr>${RS.activity_counts.map(m=>`<tr><td class="wrap"><b>${esc(m.metric)}</b><br><span class="small muted">${esc(m.unit)}${m.program?' · '+esc(m.program):''}</span></td><td>${badge(m.level, m.level==='impact'?'evidence':m.level==='outcome'?'inference':'na')}</td><td>${spark(m.series)}<br><span class="small muted">${(m.series||[]).slice().sort((a,b)=>a.year-b.year).map(p=>`${p.year}: ${esc(p.value_text||p.value||'—')}${p.kind!=='actual'?' ('+p.kind+')':''}`).join(' · ')}</span></td><td class="small">${esc(m.trend.replace(/_/g,' '))}</td><td class="wrap small">${esc(m.note)}${m.definition_changes?`<br><span class="muted">Definition: ${esc(m.definition_changes)}</span>`:''} ${badge(m.basis,m.basis)}</td></tr>`).join('')}</table>`:'<p class="muted small">None found.</p>')+`</div></details>`;
  h += `<h2>Could not verify</h2>${list(RS.gaps)}<h3>Documents or data that would settle it</h3>${list(RS.documents_that_would_close_gaps)}`;
  section('results','Results',h);
})();

/* field */
(function(){
  if(!L){ section('field','Field',empty('The landscape step')); return; }
  let h = `<h1>The field</h1><p class="sub">Is anyone already doing this, and would it matter if they vanished</p>${prose(L.field_definition)}`;
  if(L.problem_trend) h += `<h2>Is the problem growing or shrinking</h2>`+claim({statement:L.problem_trend.rationale,basis:L.problem_trend.basis,sources:L.problem_trend.sources}, `Trend: ${L.problem_trend.direction}`);
  h += `<h2>Peers</h2><table><tr><th>Organization</th><th>Relationship</th><th>How they differ</th><th>Scale</th></tr>${(L.peers||[]).map(p=>`<tr><td class="wrap">${esc(p.name)}${p.website?` <a class="small" href="${esc(p.website)}" target="_blank" rel="noopener">site</a>`:''}<br><span class="small muted">${esc(p.ein||'no EIN found')}</span></td><td class="small">${esc((p.relationship||'').replace(/_/g,' '))}</td><td class="wrap">${esc(p.how_they_differ)}${srcs(p.sources)}</td><td class="wrap small">${esc(p.scale_note)}</td></tr>`).join('')}</table>`;
  if(L.differentiation) h += `<h2>Differentiation</h2>`+claim({statement:L.differentiation.rationale,basis:L.differentiation.basis,confidence:L.differentiation.confidence}, `Position: ${L.differentiation.position}`);
  if(L.counterfactual) h += `<h2>Counterfactual</h2>`+claim({statement:`If the organization disappeared: ${L.counterfactual.if_org_disappeared}\n\nWho absorbs the work: ${L.counterfactual.who_absorbs}\n\nIf a gift does not arrive: ${L.counterfactual.if_gift_does_not_arrive}`,basis:L.counterfactual.basis,confidence:L.counterfactual.confidence,sources:L.counterfactual.sources});
  if(L.right_unit) h += `<h2>Is this the right unit to fund</h2>`+claim({statement:L.right_unit.verdict+'\n\n'+L.right_unit.rationale,basis:L.right_unit.basis}, '')+`<p class="small">Alternatives: ${esc((L.right_unit.alternatives||[]).join('; ')||'none named')}</p>`;
  if(L.funder_landscape){ const f=L.funder_landscape; h += `<h2>Funders</h2>${f.known_funders&&f.known_funders.length?`<table><tr><th>Funder</th><th>Note</th></tr>${f.known_funders.map(k=>`<tr><td class="wrap">${esc(k.name)}</td><td class="wrap">${esc(k.note)}${srcs(k.sources)}</td></tr>`).join('')}</table>`:''}`+claim({statement:`Concentration: ${f.concentration_note}\n\nSophisticated funders present: ${f.sophisticated_funders_present||'unknown'}\n\nDepartures: ${f.departures}`,basis:f.basis}); }
  if(L.room_for_funding) h += `<h2>Room for more funding</h2>`+claim({statement:`${L.room_for_funding.verdict}\n\nLast big increase: ${L.room_for_funding.last_big_increase}\n\n${L.room_for_funding.rationale}`,basis:L.room_for_funding.basis,confidence:L.room_for_funding.confidence});
  h += `<h2>Could not establish</h2>${list(L.gaps)}${srcs(L.sources)}`;
  section('field','Field',h);
})();

/* culture */
(function(){
  if(!C){ section('culture','Culture',empty('The culture read')); return; }
  let h = `<h1>Culture and leadership</h1><p class="sub">Read at the level of the organization, from public professional material only</p>`;
  if(C.ethics_note) h += `<div class="empty" style="border-style:solid"><b>What was excluded.</b> ${esc(C.ethics_note)}</div>`;
  if(C.theory_of_change) h += `<h2>Theory of change, in their words</h2>`+claim({statement:C.theory_of_change.in_their_words,basis:C.theory_of_change.basis,sources:C.theory_of_change.sources})+`<h3>The theory of power underneath</h3>${prose(C.theory_of_change.theory_of_power)}`;
  h += `<div class="two"><div><h3>Espoused values</h3>${list(C.espoused_values)}</div><div><h3>Operating values (what the decisions show)</h3>${(C.operating_values||[]).map(v=>claim({statement:v.evidence,basis:v.basis,sources:v.sources}, v.value)).join('')}</div></div>`;
  h += `<h2>Stances</h2>`+claim(C.money_stance,'Toward money')+claim(C.donor_stance,'Toward donors')+claim(C.risk_and_growth,'Toward risk and growth');
  if(C.leadership_dependency) h += `<h2>Leadership dependency</h2>`+claim({statement:C.leadership_dependency.verdict+'\n\n'+C.leadership_dependency.rationale,basis:C.leadership_dependency.basis,confidence:C.leadership_dependency.confidence});
  h += `<h2>Contradictions</h2>`+(C.contradictions&&C.contradictions.length?C.contradictions.map(c=>claim({statement:`Said: ${c.said}\n\nDone: ${c.done}\n\nWhy it matters: ${c.significance}`,basis:c.basis,sources:c.sources})).join(''):'<p class="muted small">None found.</p>');
  h += `<h2>Failure tells</h2>`+(C.failure_tells&&C.failure_tells.length?C.failure_tells.map(c=>claim({statement:c.evidence,basis:c.basis,sources:c.sources}, c.pattern)).join(''):'<p class="muted small">None supported by the sources.</p>');
  h += `<h2>Recurring metaphors</h2>`+(C.metaphors&&C.metaphors.length?`<table><tr><th>Metaphor</th><th>Example</th><th>Reveals</th><th>Hides</th></tr>${C.metaphors.map(m=>`<tr><td class="wrap">${esc(m.metaphor)}</td><td class="wrap"><i>${esc(m.example)}</i>${m.url?` <a class="small" href="${esc(m.url)}" target="_blank" rel="noopener">src</a>`:''}</td><td class="wrap">${esc(m.reveals)}</td><td class="wrap">${esc(m.hides)}</td></tr>`).join('')}</table>`:'<p class="muted small">None recorded.</p>');

(function(){

  h += `<h2>Judgment</h2>${prose(X.judgment)}<h3>Moves robust across all four</h3>${list(X.robust_moves, m=>`<b>${esc(m.move)}</b> <span class="muted">${esc(m.why_robust)}</span>`)}`;

    const d=(x,y)=>x==null||y==null?'':(y-x>0?` <span class="b green">+${y-x}</span>`:y-x<0?` <span class="b red">${y-x}</span>`:' <span class="b na">same</span>');

  h += `<h2>Gift risk by type</h2><table><tr><th>Gift</th><th>Risk</th><th>Why</th><th>What lowers it</th></tr>${(A.gift_risk||[]).map(g=>`<tr><td class="wrap">${esc(g.gift_type.replace(/_/g,' '))}</td><td>${badge(g.risk,{low:'green',moderate:'amber',elevated:'amber',high:'red'}[g.risk]||'na')}</td><td class="wrap">${esc(g.rationale)}</td><td class="wrap small">${esc((g.risk_reducers||[]).join(' · '))}</td></tr>`).join('')}</table>`;

(function(){
  const seen = new Map();
  const add = (url,title,where) => { if(!url) return; const k=url.trim(); if(!seen.has(k)) seen.set(k,{title:title||url,where:new Set()}); seen.get(k).where.add(where); };
  const walk = (o, where) => { if(!o) return; if(Array.isArray(o)) return o.forEach(x=>walk(x,where)); if(typeof o==='object'){ if(o.url && typeof o.url==='string') add(o.url,o.title,where); if(o.source && /^https?:/.test(o.source)) add(o.source,null,where); if(o.source_url) add(o.source_url,null,where); if(o.full_filing_url) add(o.full_filing_url,'Form 990 full filing',where); Object.values(o).forEach(v=>walk(v,where)); } };
  walk(I,'identity'); walk(S,'record'); walk(RS,'results'); walk(L,'field'); walk(LD,'leader'); walk(C,'culture'); walk(X,'futures'); walk(A,'verdict'); walk(F,'money');
  const rows = [...seen.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
  let h = `<h1>Sources</h1><p class="sub">${rows.length} distinct URLs cited across the dossier. Agents may cite only URLs they searched or fetched.</p><table><tr><th>Source</th><th>Used in</th></tr>${rows.map(([u,v])=>`<tr><td class="wrap"><a href="${esc(u)}" target="_blank" rel="noopener">${esc(v.title)}</a><br><span class="small muted" style="word-break:break-all">${esc(u)}</span></td><td class="small">${[...v.where].join(', ')}</td></tr>`).join('')}</table>`;
  if(INTERNAL) h += `<h2>Run (internal)</h2><table><tr><th>Phase</th><th>Model</th><th class="num">Turns</th><th class="num">Cost</th><th class="num">Seconds</th><th>Result</th></tr>${Object.entries(M.phases||{}).map(([k,p])=>`<tr><td>${esc(k)}</td><td>${esc(p.model)}</td><td class="num">${p.turns}</td><td class="num">$${(p.cost_usd||0).toFixed(2)}</td><td class="num">${Math.round(p.wall_seconds||0)}</td><td class="small">${esc(p.subtype)}</td></tr>`).join('')}</table>`;
  h += `<h2>About this dossier</h2><p>${esc(PRODUCT.disclaimer||'')}</p><p>${esc(PRODUCT.correction_note||'')}</p>`;
  section('sources','Sources',h);
})();

/* ---------- mount ---------- */
const main = document.getElementById('main'), nav = document.getElementById('nav');
sections.forEach((s,i)=>{ const sec=document.createElement('section'); sec.className='page'; sec.id='sec-'+s.key; sec.innerHTML=s.html; main.appendChild(sec);
  const li=document.createElement('li'); li.innerHTML=`<a href="#${s.key}" data-key="${s.key}">${esc(s.label)}</a><span class="n"></span>`; li.querySelector('a').addEventListener('click',e=>{e.preventDefault(); show(s.key);}); nav.appendChild(li); });
// counts in nav
const flagsN = F&&F.primary&&F.primary.ratios&&F.primary.ratios.flags ? F.primary.ratios.flags.length : 0;
nav.querySelector('[data-key="ratios"]').parentNode.querySelector('.n').textContent = flagsN ? flagsN+' flags' : '';
if(A&&A.premortem) nav.querySelector('[data-key="verdict"]').parentNode.querySelector('.n').textContent = A.health_score ? A.health_score.score+'/100' : '';
function show(key){ sections.forEach(s=>{ document.getElementById('sec-'+s.key).classList.toggle('active', s.key===key); }); nav.querySelectorAll('a').forEach(b=>b.setAttribute('aria-current', b.dataset.key===key?'true':'false')); if(location.hash!=='#'+key) history.replaceState(null,'','#'+key); window.scrollTo({top:0}); }
show((location.hash||'#cover').slice(1).replace(/[^a-z]/g,'')||'cover');
if(!document.querySelector('.page.active')) show('cover');
window.addEventListener('hashchange',()=>{ const k=(location.hash||'#cover').slice(1).replace(/[^a-z]/g,''); if(sections.some(s=>s.key===k)&&!document.getElementById('sec-'+k).classList.contains('active')) show(k); });
document.addEventListener('keydown', e=>{ if(e.target.matches('input,textarea')) return; const i=sections.findIndex(s=>document.getElementById('sec-'+s.key).classList.contains('active'));
  if(/^[0-9]$/.test(e.key)){ const n=(+e.key===0?10:+e.key)-1; if(sections[n]) show(sections[n].key); }
  else if(e.key==='ArrowDown'||e.key==='j'){ if(sections[i+1]) show(sections[i+1].key); }
  else if(e.key==='ArrowUp'||e.key==='k'){ if(sections[i-1]) show(sections[i-1].key); } });

document.querySelectorAll('input[name=basis]').forEach(r=>r.addEventListener('change',()=>{ const lvl=+document.querySelector('input[name=basis]:checked').value; document.querySelectorAll('[data-basis]').forEach(el=>el.classList.toggle('hidden-by-filter', (rank[el.dataset.basis]||2)>lvl)); }));

  const render=q=>{ const s=byQ[q]; if(!s) return; document.querySelectorAll('.q').forEach(b=>b.setAttribute('aria-pressed', b.dataset.q===q?'true':'false'));
    det.innerHTML=`<div class="row"><span class="b speculation">scenario, speculative by design</span><span class="muted small">${esc(q.replace('_',' / '))}</span></div><h3 style="font-family:var(--serif);font-size:22px;margin:8px 0">${esc(s.name)}</h3>${prose(s.narrative)}<h3>What happens to the organization</h3><div class="kv"><div>Revenue</div><div>${esc(s.effect_on_org.revenue)}</div><div>Programs</div><div>${esc(s.effect_on_org.programs)}</div><div>Staff</div><div>${esc(s.effect_on_org.staff)}</div><div>Standing</div><div>${esc(s.effect_on_org.standing)}</div></div><h3>Early signals to watch</h3>${list(s.early_signals)}<h3>Readiness ${s.readiness.score}/5</h3><p class="small">${esc(s.readiness.rationale)}</p><h3>For a donor</h3><p class="prose">${esc(s.donor_implication)}</p>`; };
  document.querySelectorAll('.q').forEach(b=>b.addEventListener('click',()=>render(b.dataset.q)));
  render(X.most_likely_quadrant||'high_high'); }

// chart: revenue vs expenses by year
(function(){ const el=document.getElementById('chart'); if(!el) return; const R=F.primary.ratios; const ser=R.series.slice(-12);
  const W=940,H=300,padL=56,padR=16,padT=18,padB=34; const max=Math.max(...ser.flatMap(s=>[s.revenue||0,s.expenses||0]))*1.08; const n=ser.length; const gw=(W-padL-padR)/n; const bw=Math.min(22,(gw-10)/2);
  const y=v=>padT+(H-padT-padB)*(1-v/max); const ticks=4; let g='';
  for(let i=0;i<=ticks;i++){ const v=max/ticks*i; g+=`<line x1="${padL}" x2="${W-padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#e2e2e2"/><text x="${padL-8}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#2b2b2b">${money(Math.round(v))}</text>`; }
  let bars='';
  ser.forEach((s,i)=>{ const x0=padL+gw*i+(gw-(bw*2+2))/2; const rv=s.revenue||0, ex=s.expenses||0;
    const bar=(x,v,col,label)=>{ const yy=y(Math.max(v,0)), hh=Math.max(0,y(0)-yy); return `<g class="bar" data-tip="FY${s.year} ${label}: ${money(v)}"><rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw}" height="${hh.toFixed(1)}" fill="${col}" rx="0"/><rect x="${(x-4).toFixed(1)}" y="${padT}" width="${bw+8}" height="${H-padT-padB}" fill="transparent"/></g>`; };
    bars+=bar(x0,rv,'#000080','revenue')+bar(x0+bw+2,ex,'#800000','expenses');
    bars+=`<text x="${(x0+bw+1).toFixed(1)}" y="${H-padB+16}" text-anchor="middle" font-size="11" fill="#2b2b2b">${s.year}</text>`;
    if(i===n-1){ bars+=`<text x="${(x0+bw/2).toFixed(1)}" y="${(y(rv)-6).toFixed(1)}" text-anchor="middle" font-size="11" fill="#000080">${money(rv)}</text><text x="${(x0+bw*1.5+2).toFixed(1)}" y="${(y(ex)-6).toFixed(1)}" text-anchor="middle" font-size="11" fill="#800000">${money(ex)}</text>`; } });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Revenue and expenses by fiscal year">${g}<line x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}" stroke="#999999"/>${bars}</svg><div class="legend"><span><i style="background:#000080"></i>Revenue</span><span><i style="background:#800000"></i>Expenses</span><span class="muted">last ${n} filed years</span></div><div class="tip" id="tip"></div>`;
  const tip=document.getElementById('tip'); el.querySelectorAll('.bar').forEach(b=>{ b.addEventListener('mousemove',e=>{ tip.style.display='block'; tip.textContent=b.dataset.tip; const r=el.getBoundingClientRect(); tip.style.left=(e.clientX-r.left+12)+'px'; tip.style.top=(e.clientY-r.top-28)+'px'; }); b.addEventListener('mouseleave',()=>tip.style.display='none'); });
})();
