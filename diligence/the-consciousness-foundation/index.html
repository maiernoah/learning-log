t say who set the cap.", "quotes": [{"quote": "if you're, you know, Google, Facebook and you're sponsoring a psychedelic event, not so easy.", "date": "2019-06-22", "context": "The funding cost of the summit's framing", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}, {"quote": "what could happen as we make technology that's 10,000 times more potent than a psychedelic", "date": "2019-06-22", "context": "Risk discussed as a civilizational possibility, not as an operating risk", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}], "basis": "inference", "confidence": 0.45}, "absorbing_loss": {"summary": "No evidence of Fields owning or explaining a loss. The natural test is the end of Fields's Consciousness Hacking tenure. The excerpts I could read show an essay that widens from the organization to the state of the field. That is a pattern of reframing or moving on, but I could not read the full post, so a passage owning failures may exist. San Francisco's chapter was archived in July 2020. I found no words from Fields on that, or on the summit moving online in 2020.", "quotes": [{"quote": "I actually haven't answered this question", "date": "2019-06-22", "context": "Closest thing to admitting a shortfall: about the mission, before any loss", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}], "basis": "inference", "confidence": 0.3}, "criticism_and_dissent": {"summary": "Toward outside camps, Fields is even-handed and non-combative. In 2019 Fields describes objections among meditators, psychedelic users and technologists and tries to reconcile them. The Medium excerpts acknowledge the critique that tools could be shortcuts. No record of how Fields handles criticism aimed at Fields or at an organization Fields runs, or dissent from staff or board. The field critique is curious, but it is untested on Fields personally.", "quotes": [{"quote": "a lot of people in the meditation world have problems with people using plant medicines.", "date": "2019-06-22", "context": "Describes a field divide neutrally", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}, {"quote": "not a fan of the post-modern deconstructionist worldview that we just need to tear down all hierarchies.", "date": "2019-06-22", "context": "Pushes back on a position within his own milieu; timestamp approximate", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}], "basis": "inference", "confidence": 0.4}, "under_pressure": {"summary": "The record has no well-documented hard moment for Fields. Two candidates. First, sponsor resistance in 2019: Fields names it plainly and without blame. Second, leaving Consciousness Hacking: the excerpted essay stays on the field's direction. At CoFo the pressure points so far are the unanswered public question on money distributed and the late field report, and neither has a signed response. Fields at CoFo has not been publicly tested. No pressure pattern can be stated with confidence.", "quotes": [{"quote": "They don't want to be seen to be associated.", "date": "2019-06-22", "context": "Corporate sponsors and the summit", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}, {"quote": "it's very hard to compete.", "date": "2019-06-22", "context": "Competing with large technology employers for talent", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}], "basis": "inference", "confidence": 0.3}, "money_and_donors": {"summary": "Fields's fluency is about markets, not donors. A former banker, Fields talks about capitalism, marginal cost and talent competition. In 2019 the funding language treats sponsors as a practical constraint. I found no sentence by Fields addressed to a donor, no thanks and no scarcity appeal. CoFo's own money is not discussed by Fields anywhere I found. Expect a capital-allocation conversation, with fundraising shaped by relationships.", "quotes": [{"quote": "if we're going to use the markets, we've kind of got to play the game of capitalism, which is win-lose.", "date": "2019-06-22", "context": "Markets as a required channel", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}, {"quote": "businesses in pursuit of profit irreparably undermine their own margins", "date": null, "context": "Medium essay on zero marginal cost; search excerpt only", "url": "https://medium.com/@joshfields/why-technology-spells-the-end-of-capitalism-as-we-know-it-3face5a6b712"}, {"quote": "a lack of coherency or more personalised guidance about what might be best for your own body", "date": "2024-08-22", "context": "The market gap as Holon's founder sees it", "url": "https://www.whatsoninglasgow.com/high-tech-wellness-comes-to-glasgow/"}], "basis": "inference", "confidence": 0.45}, "power_and_relationships": {"summary": "Fields's language is decentralizing but not anti-hierarchy, and Fields is network-based. Fields has kept relationships across roles: Mikey Siegel of Consciousness Hacking is now a CoFo advisor. Phillips credits Fields with recruiting. Nothing is on record about Fields's relationship to Strong or the board. Credit claims come through bio copy ('established the first global ecosystem'), not first-person boasts. Who founded CoFo is told two ways: Strong says 'I am founding', and Phillips names Fields as 'the founding CEO'. Those fit together, but the balance of authority is unknown.", "quotes": [{"quote": "We are a decentralized, grassroots, voluntary-based organization on the grassroots level.", "date": "2019-06-22", "context": "Describing Consciousness Hacking", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}, {"quote": "Joshua Fields, the founding CEO, reached out to me in early 2025 having read this blog", "date": "2026-03-19", "context": "Phillips, about Fields. Not Fields's own words", "url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness"}], "basis": "inference", "confidence": 0.4}, "time_horizon_and_growth": {"summary": "Very long horizon on the problem, shorter in post. The thesis has been stable since at least 2018-19. The one prior leadership term Fields reports was about 2.5 years. Fields favors reach as the growth measure (cities, members) and asks how to scale tools. No multi-year CoFo plan, budget or exit condition in Fields's words.", "quotes": [{"quote": "how do we jump on this and steer it in the direction that is most harmonious with the rhythms of life?", "date": "2019-06-22", "context": "Long-range stance on technology", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}, {"quote": "we're on the precipice of some sort of human technological integration.", "date": "2019-06-22", "context": "Framing of the period", "url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit"}], "basis": "inference", "confidence": 0.5}}, "candor_index": {"items_read": 9, "failures_named": 0, "embarrassing_numbers_named": 0, "admitted_mistakes": 0, "note": "Nine items contain Fields's words at some level: Voices of VR, three Medium essays (excerpts only), The Elevator's quotations, What's On Glasgow, Secret Glasgow, The Scotsman (snippet) and Entrepreneur UK. Zero organizational failures, embarrassing numbers or personal mistakes. This count is weak: seven of the nine are excerpts, promotion or short pieces, and the exit essay, the likeliest place for candor, could not be read in full. Credit where due: two plain admissions of not knowing, both in 2019, plus field-level problems named: talent shortage, sponsor reluctance, commodification, and addictive technology. Zero should be read as 'not shown', not 'never does it'."}, "strengths": [{"pattern": "Says 'I don't know' on core questions", "evidence": "2019: 'I actually haven't answered this question' and 'I don't know' on non-addictive market tools. Unusual for someone promoting a movement.", "basis": "evidence", "sources": [{"url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit", "title": "Voices of VR #773"}]}, {"pattern": "Thesis stable over years; no chasing of fashion", "evidence": "The wisdom-versus-power argument runs from 2019 talks through CoFo's metacrisis framing. The later text is unsigned, so the link is an inference.", "basis": "inference", "sources": [{"url": "http://www.whatisemerging.com/videos/joshua-fields-the-wisdom-race", "title": "The Wisdom Race"}, {"url": "https://cofo.org/insights", "title": "Insights"}]}, {"pattern": "Recruits people more rigorous and specialized than the leader, then lets them speak", "evidence": "Phillips writes candidly on hype and caveats on his own blog, disclaimed as unofficial, and was recruited by Fields. Fields does not visibly compete for the stage.", "basis": "inference", "sources": [{"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "Bodymind #2"}, {"url": "https://jameswphillips.substack.com/p/bodymind-3-can-voluntary-attention", "title": "Bodymind #3"}]}, {"pattern": "Coalition instinct across camps", "evidence": "The 2019 summit deliberately joined meditators, psychedelics people and technologists who, by Fields's account, distrust each other. Fields speaks of the critics without contempt.", "basis": "evidence", "sources": [{"url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit", "title": "Voices of VR #773"}]}, {"pattern": "Openly discloses the outside venture", "evidence": "CoFo's own bio names Holon in the present tense.", "basis": "evidence", "sources": [{"url": "https://www.cofo.org/team/joshua-fields", "title": "CoFo bio"}]}], "warning_patterns": [{"pattern": "Silence where accountability would sit", "evidence": "No signed CoFo statement, no reply found to the question on funds distributed, and all five Substack posts are unsigned. The organization is young, which excuses some of this.", "basis": "evidence", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/archive", "title": "CoFo Substack archive"}, {"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "Initial Learnings"}]}, {"pattern": "Reach numbers presented as track record", "evidence": "'50 cities' and 'first global ecosystem' appear without outcomes or finances. Another page gives 20 communities and 10,000 members. The closest thing to a ledger found is one chapter's $50,724.26, archived in 2020.", "basis": "inference", "sources": [{"url": "https://www.cofo.org/team/joshua-fields", "title": "CoFo bio"}, {"url": "https://www.legendarylifepodcast.com/363-consciousness-hacking-how-to-train-your-brain-to-optimize-your-health-and-unlock-your-full-potential-with-joshua-fields/", "title": "Legendary Life #363"}, {"url": "https://opencollective.com/chsf", "title": "Consciousness Hacking SF, Open Collective"}]}, {"pattern": "Divided attention and commercial overlap", "evidence": "Executive director, startup founder and adviser at once. Holon's focus overlaps Bodymind's subject. No conflict policy published. Unproven as harm; the structure is the concern.", "basis": "inference", "sources": [{"url": "https://www.cofo.org/team/joshua-fields", "title": "CoFo bio"}, {"url": "https://cofo.org/bodymind", "title": "Bodymind"}, {"url": "https://secretglasgow.com/holon/", "title": "Secret Glasgow"}]}, {"pattern": "Claims sized to civilization, with few measures attached", "evidence": "Collapse, 'wisdom race', exponential capacity. Fields gives no test for whether wisdom rose. CoFo inherited the scale of language, and no organization-level measure was found in the earlier read.", "basis": "inference", "sources": [{"url": "http://www.whatisemerging.com/videos/joshua-fields-the-wisdom-race", "title": "The Wisdom Race"}, {"url": "https://cofo.org/fundamental-consciousness", "title": "Fundamental Consciousness"}]}, {"pattern": "Promotional certainty in commercial settings", "evidence": "The 2019 voice says 'I don't know'. The 2024 voice sells: 'one of the first clinics in the UK'. Normal for a launch, but note which voice shows up with a donor.", "basis": "inference", "sources": [{"url": "https://secretglasgow.com/holon/", "title": "Secret Glasgow"}, {"url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit", "title": "Voices of VR #773"}]}, {"pattern": "Looked for and not found", "evidence": "No attacks on critics, blame shifting at named people, or personal grandiosity in first-person speech. The sample is small.", "basis": "evidence", "sources": [{"url": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit", "title": "Voices of VR #773"}]}], "dependency_and_succession": {"identity_fusion": "low", "tenure_signals": "[evidence] Fields reports about 2.5 years in the one prior nonprofit leadership role, per search excerpts of the essay. [evidence] Present-tense roles elsewhere. [evidence, secondhand] Phillips expects to stay 'several years minimum', which is about Phillips, not Fields. No statement on Fields's own tenure, fatigue or next chapter found.", "successor_signals": "No successor, deputy designation or succession plan found. A COO and a CSO are listed, and a chief of staff listing appeared (unconfirmed). [inference] Devaney is the most visible internal scientific voice. That does not make Devaney a named successor.", "revenue_exposure": "[inference] Public identity is not fused with Fields, since the home page names no individuals. Revenue exposure more likely sits with the chair than with Fields. I could not confirm the earlier reported 'time and capital' wording in this pass, and no gift is verified. No 990 exists to size it. Fields's departure would probably cost relationships and execution, not the funding base. A change in Strong's support could be far more serious. This is untested.", "basis": "inference", "confidence": 0.4}, "in_the_room": {"likely_pitch": "[inference] A neglected frontier at a moment of civilizational risk: technology's power is outrunning wisdom. A small amount of well-placed capital can define a field. Fields will likely present as a peer capital allocator with a finance background, and will offer access to scientists and program leads. Expect program staff to carry the rigor, and the 128 letters of intent and 14 funded projects as evidence of momentum.", "will_avoid": "[inference] Volunteering three things: what ended Consciousness Hacking, how Fields's time and shared staff split between CoFo and Holon, and funder concentration. This is based on their absence from the record, not on any observed evasion. Fields may answer readily when asked.", "test_questions": ["What did you get wrong at Consciousness Hacking? Give me its peak budget, paid staff, and why chapters closed, with a number.", "What share of your working week does CoFo get, who pays any shared staff, and show me the board minute where you recused from something touching Holon?", "How much has CoFo actually paid out against the $1.5M, what share of revenue comes from Winslow Strong, and what result would make you stop a program?"]}, "reframe": "Don't read Fields as a visionary whose judgment can be assessed from the public record: the record shows a candid movement convener from 2019 and a commercial founder from 2024, and offers no evidence yet of how Fields runs a charity, so the gift should buy disclosure and test that judgment directly.", "secondary": [{"name": "Winslow Strong, Ph.D.", "title": "Chairman; describes himself as founding the organization", "self_concept": "[evidence] Founder and thesis-setter, using a neglect-and-importance framing that resembles effective philanthropy. Foresight's undated profile gives the aim of consciousness development as 'a primary pillar of society', close to CoFo's mission wording. [inference] The mission closely tracks Strong's stated aim.", "risk": "[evidence] Foresight's profile describes co-founding Palo Alto Neuroscience in 2014 for EEG neurofeedback for meditation, which wound down in 2016, followed by full-time angel investing. [inference] Comfortable with early-stage bets and failed ventures. I found no first-person account of that failure.", "money": "[evidence] The July 2025 thread cites 'woefully little funding' as the field's problem and, per a search summary, invites financial support. [inference] A person with an investor's background directing philanthropic capital. The earlier 'substantial time and capital' wording could not be confirmed in this pass. No gift amount verified.", "dependency": "[inference] Possibly the key funder and final authority; unverified without Schedule A and board documents. The most important person for a donor to meet, and possibly more decisive than Fields. No podcast, talk or signed essay was found, beyond X posts seen as search-result text.", "quotes": [{"quote": "Consciousness is the scientific frontier with the highest intersection of neglect and importance.", "date": "2025-02", "context": "X post, search-result text. Date inferred from the post ID and a search summary", "url": "https://x.com/winslow_strong/status/1889873214614159735"}, {"quote": "That is why I am founding The Consciousness Foundation", "date": "2025-02", "context": "Same X post, first-person founding claim", "url": "https://x.com/winslow_strong/status/1889873214614159735"}, {"quote": "a public charity whose purpose is to advance the scientific understanding of consciousness and foster consciousness development", "date": "2025-07-24", "context": "Pinned X announcement, search-result text", "url": "https://x.com/winslow_strong/status/1948483311522709759"}], "basis": "inference"}, {"name": "James Phillips, Ph.D.", "title": "Bodymind Program Director", "self_concept": "[evidence] Metascience-minded field builder, writing in a personal capacity and disclaiming the official view. Started as a founding advisor and then joined full time.", "risk": "[evidence] Sets out to run program thinking in public: 'ARPA program, but with exploratory thinking live blogged'. Bodymind #3 shows a replication-first style, per the earlier culture read. [inference] The clearest check on hype inside CoFo, if the role has authority.", "money": "[evidence] The only explicit fundraising request found from anyone at CoFo. It came through a network, and no funder was named.", "dependency": "[inference] Matters to Bodymind's credibility, and matters especially because Bodymind is where the Holon overlap sits. Ask Phillips directly about independence from Fields on Bodymind decisions.", "quotes": [{"quote": "If you know philanthropists who would be interested in funding us, please connect us!", "date": "2026-03-19", "context": "Personal blog", "url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness"}, {"quote": "We will not be conducting experiments ourselves - we are conveners and funders", "date": "2026-03-19", "context": "On CoFo's role", "url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness"}, {"quote": "What I write on this blog is not the official view of The Consciousness Foundation.", "date": "2026-03-19", "context": "Disclaimer", "url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness"}], "basis": "evidence"}], "ethics_note": "I read only professional nthropy/legislative-update-one-big-beautiful-bill-act/", "title": "Community Foundation for Southeast Michigan: legislative update (search result)"}], "kind": "external_trend", "evidence_it_is_real": "[evidence, search summaries] From 2026: a 0.5% of AGI floor for itemizers, a 35% cap on the deduction's value for top-bracket filers, and a $1,000/$2,000 non-itemizer cash deduction. No measured effect on high-income giving was found.", "channel_to_organization": "[inference] For donors giving appreciated stock with large gains, avoiding capital gains matters more than a small deduction change. This does not alter any scenario."}, {"name": "Federal scrutiny of tax-exempt organizations", "category": "political", "direction": "Rising, aimed mainly at politically left-coded groups and fiscal sponsorship.", "impact": 2, "uncertainty": 3, "relevance": "Low direct political exposure, but CoFo has thin visible governance if examined.", "basis": "evidence", "sources": [{"url": "https://news.bloomberglaw.com/daily-tax-report/nonprofits-fear-drop-in-charity-work-after-new-trump-policy", "title": "Bloomberg Law: Nonprofits fear drop in charity work after new Trump policy (search result)"}, {"url": "https://news.bloomberglaw.com/tax-insights-and-commentary/trump-scrutiny-of-tax-exempt-status-leaves-democrats-skittish", "title": "Bloomberg Law: Trump scrutiny of tax-exempt status (search result)"}, {"url": "https://www.commondreams.org/news/trump-irs-nonprofits", "title": "Common Dreams: Trump IRS and nonprofits (partisan; search result)"}], "kind": "external_trend", "evidence_it_is_real": "[evidence, search summaries, mostly news and advocacy] A September 2025 presidential memorandum on nonprofits, a House Ways and Means probe into funding and fiscal sponsorship, a planned IRS policy revamp, a lawsuit by Protect Democracy, and Democratic oversight letters in April 2026. No outcome on revocations was found.", "channel_to_organization": "[inference] CoFo has no visible partisan activity and no fiscal sponsorship, so it is not an obvious target. The realistic route is ordinary compliance: a possibly chair-funded public charity with no published board list faces public-support test questions regardless of who governs."}, {"name": "Federal push on psychedelic medicine", "category": "political", "direction": "Accelerating by executive action; Schedule I status and legislation unresolved.", "impact": 3, "uncertainty": 3, "relevance": "The closest high-profile neighbor to awakening research. It could lend legitimacy and funding, or absorb attention and bring scandal.", "basis": "evidence", "sources": [{"url": "https://www.pharmacytimes.com/view/fda-announces-regulatory-actions-to-accelerate-psychedelic-development-for-serious-mental-health-conditions", "title": "Pharmacy Times: FDA actions on psychedelic development (24 Apr 2026; search result)"}, {"url": "https://www.thefdalawblog.com/2026/05/sounds-great-do-you-want-fda-approval-a-regulatory-analysis-of-psychedelics/", "title": "FDA Law Blog: regulatory analysis of psychedelics (May 2026; search result)"}, {"url": "https://lasvegassun.com/news/2026/apr/24/fda-plans-ultra-fast-review-of-three-psychedelic-d/", "title": "Las Vegas Sun: FDA plans ultra-fast review (24 Apr 2026; search result)"}, {"url": "https://www.cofo.org/rfp", "title": "CoFo RFP (carried from landscape)"}], "kind": "external_trend", "evidence_it_is_real": "[evidence, trade press in search results] An executive order of 18 Apr 2026 directs agencies to speed psychedelic therapies; the FDA issued priority vouchers; Compass's psilocybin filing or decision is expected late 2026 to early 2027. A $50M figure was reported but not confirmed in a primary source. No FDA approval of a psychedelic was found in these results.", "channel_to_organization": "[evidence] CoFo's RFP excludes research solely on psychedelics, yet 23 of 128 letters of intent used psychedelic-assisted approaches. [inference] That line protects its focus but leaves it outside the money. An approval would make 'altered self-experience' a clinical category and increase demand for the measures CoFo wants. A safety scandal could spill over. This moves with the legitimacy axis."}, {"name": "Spirituality moving outside institutions, and AI entering the role", "category": "social", "direction": "Spirituality holding as institutions weaken; AI spiritual use small but real.", "impact": 2, "uncertainty": 3, "relevance": "Tests CoFo's vision that inner development becomes a primary pillar of society.", "basis": "evidence", "sources": [{"url": "https://www.pewresearch.org/religion/2025/02/26/spiritual-and-religious-self-descriptions/", "title": "Pew: Spiritual and religious self-descriptions (26 Feb 2025; search result)"}, {"url": "https://www.wunc.org/2026-09-25/a-surprising-number-of-americans-use-ai-for-spiritual-reasons-heres-what-they-told-us", "title": "NPR via WUNC: Americans use AI for spiritual reasons (25 Sep 2026; search result)"}, {"url": "https://letsdatascience.com/news/barna-finds-christians-trusting-ai-for-spiritual-guidance-eced74b0", "title": "Summary of Barna finding (2026; secondary; search result)"}, {"url": "https://time.com/7007856/jhourney-meditation-jhanas-retreat-bliss", "title": "Time: Jhourney and jhanas (2024; search result)"}], "kind": "external_trend", "evidence_it_is_real": "[evidence, search summaries] Pew 2025: Christian decline slowed; a study consultant says 'spirituality is not declining' but is becoming diffuse. NPR/Ipsos, Sept 2026, 1,011 adults: about 5 to 6% use AI for spiritual guidance. Barna 2026: 48% of practicing Christians would trust AI with spiritual growth, and 83% worry it will misread scripture. Time, 2024: Bay Area interest in Jhourney's retreats. No 2026 data on meditation prevalence was found.", "channel_to_organization": "[inference] This is a donor-motivation channel, not a beneficiary channel: CoFo runs no public service. [speculation] Commercial or AI tools could claim practical awakening results before CoFo's science can test them. That would raise demand for the standards CoFo wants to produce, and also reduce the audience's patience."}, {"name": "AI-driven labor disruption competing for donor attention", "category": "economic", "direction": "Clear for young workers in exposed jobs; not yet visible in aggregate data.", "impact": 2, "uncertainty": 4, "relevance": "If displacement grows, it could claim the new AI donors' money, or increase interest in meaning.", "basis": "evidence", "sources": [{"url": "https://intuitionlabs.ai/articles/ai-entry-level-employment-hiring-data", "title": "IntuitionLabs: AI and entry-level jobs (secondary; search result)"}, {"url": "https://www.pwc.com/gx/en/news-room/press-releases/2026/pwc-2026-ai-jobs-barometer.html", "title": "PwC: 2026 Global AI Jobs Barometer (search result)"}, {"url": "https://www.digitalapplied.com/blog/ai-and-jobs-2026-what-the-labor-data-shows-analysis", "title": "Digital Applied: AI and jobs in 2026 (secondary; search result)"}, {"url": "https://www.cnbc.com/2026/10/29/anthropic-ceo-dario-amodei-charts-new-direction-for-tech-philanthropy.html", "title": "CNBC: Amodei on supporting workers (29 Oct 2026)"}], "kind": "external_trend", "evidence_it_is_real": "[evidence, secondary summaries; originals not checked] Stanford/ADP data show 22-to-25-year-olds in highly exposed jobs about 19% below the comparison path as of June 2026; employers named AI in 120,136 announced cuts January to September, while Yale's Budget Lab sees no clear aggregate disruption. CNBC: Amodei's January essay said the wealthy should support workers left behind.", "channel_to_organization": "[inference] Competition first: worker support is a named priority for AI-derived capital, and awakening research is hard to defend beside it. [speculation] A longer-run meaning argument may help CoFo's 'inner development' frame, but I found no evidence of donors acting on it."}, {"name": "Climate as a rival cause", "category": "environmental", "direction": "Warming continues; no direct route to CoFo's work was found.", "impact": 1, "uncertainty": 2, "relevance": "Included for completeness. It is not a survival factor here.", "basis": "inference", "sources": [{"url": "https://www.spokesman.com/stories/2026/jan/15/the-earth-keeps-getting-hotter-and-americans-trust", "title": "Spokesman-Review: The Earth keeps getting hotter (15 Jan 2026; search result)"}, {"url": "https://givingusa.org/?p=35161", "title": "Giving USA: 2025 giving (search result)"}], "kind": "external_trend", "evidence_it_is_real": "[evidence, headline-level only] The January 2026 report's title describes continued warming. I did not research climate data further, because no channel to this organization justified it.", "channel_to_organization": "[inference] Only indirect: climate competes for philanthropic attention. CoFo has no field sites, no vulnerable service population and a small remote-capable team. Its 'metacrisis' publication is an intellectual link, not an exposure."}], "axes": [{"name": "Axis 1: How much AI-derived wealth has actually been paid out as philanthropy by 2031", "low_pole": "Paper wealth. A correction, lockups or inertia leave AI-derived charitable payout below roughly $5B a year in 2031. Much of what was pledged sits in DAFs or lost value. (The threshold is my judgment.)", "high_pole": "Liquid wave. AI-derived payout reaches roughly $30B a year or more by 2031, the level attributed to Forbes, and a new class of donors is actively seeking causes. (The threshold is my judgment.)", "why_critical": "Highest product in the register (5 x 5 = 25). [inference] It decides whether CoFo stays dependent on a small circle or has access to a new donor class. The range of outcomes is very wide: credible estimates run from 'all on paper' to $100B a year.", "runners_up_rejected": "AI valuation risk (16) is the mechanism behind this axis, so it is merged. Federal science funding (12) is lower, and it affects CoFo's demand more than its survival: a squeeze raises applications. Psychedelic policy (9), University contraction (9) and DAF growth (6) have less impact or less uncertainty. Nonprofit scrutiny (6) has no specific channel to CoFo beyond ordinary compliance.", "trend": "[evidence] Pledges are rising and an Anthropic IPO is expected in about November 2026. [evidence] Early giving has gone to farm animals, global health and politics, not to consciousness science in anything I found.", "external": true}, {"name": "Axis 2: Whether consciousness and contemplative science is accepted as serious science by 2031", "low_pole": "Contested fringe. Major journals, universities and federal reviewers treat awakening and much of consciousness theory as methodologically weak or ideological. Hype or a public failure reinforces that view.", "high_pole": "Serious frontier. Consciousness science has accepted tests, shared measures and mainstream funding. Contemplative change is studied as a legitimate subject in strong departments, aided by the AI-minds debate and clinical psychedelic work.", "why_critical": "Second-highest independent product (5 x 4 = 20). [inference] It governs CoFo's scientific standing and its ability to attract senior PIs. It also decides whether a donor's money buys credible knowledge. It is not resolved by money alone: Astera's large program and COGITATE have not ended the dispute.", "runners_up_rejected": "AI consciousness salience (16) feeds this axis and moves with it, so it is merged. Psychedelic policy also feeds it. Trust in science overall is folded in here and moves slowly. Labor disruption (8) is uncertain but has little direct impact. [inference] Independence: the axes are partly correlated, because an AI boom raises both money and salience. But capital can flow to global health while consciousness stays contested, and a market crash would not settle a scientific dispute, so all four quadrants are plausible.", "trend": "[evidence] Contested and improving in method: adversarial collaborations continue, and pseudoscience charges remain on record. No dataset tracks the legitimacy of awakening research specifically; that is a finding.", "external": true}], "scenarios": [{"quadrant": "high_high", "name": "The Funded Question", "narrative": "[speculation] It is late 2031. AI listings turned into real grantmaking, and several billion dollars a year now reaches frontier science. The AI-minds debate forced a practical question: what are the measurable markers of experience in any system? Consciousness science got large programs, and contemplative practitioners became useful study subjects because they report on experience with training. Universities that once hid these centers now advertise them.\n\nCoFo has done well, but it is no longer alone. Its cohort produced a shared dataset and an often-cited measure of change in the sense of self. New donors use it as a guide. Bigger actors, including neuroscience institutes and specialist AI-minds funders, now outspend it many times over. Its value lies in the niche: awakening-specific standards, a trusted review process, and advice to donors who do not know the field. Fundamental Consciousness was narrowed after overlapping with better-funded efforts. An audit, a majority-independent board and a published grants database were preconditions for the largest gifts. The chair's money is now a minority of the budget. The risk is mission drift toward whatever the largest donors find exciting.", "effect_on_org": {"revenue": "[speculation] Grows several-fold from the stated $1.5M grant program, plausibly to $5M to $20M a year, with the chair's share falling. Institutional money requires an audit.", "programs": "[speculation] Second and third awakening cohorts with larger awards; Bodymind RFP issued; Fundamental Consciousness narrowed or partnered. Donor advising grows, and its conflict of interest needs formal handling.", "staff": "[speculation] Grows beyond the seven listed people to perhaps 20 to 30, adding grants, data and compliance staff. Competition for scientific talent from bigger funders is strong.", "standing": "[speculation] A respected specialist funder, if the data holds up. A junior partner to larger institutions, not the field's leader."}, "early_signals": ["Anthropic IPO completes (expected about November 2026) and first large share gifts are reported after lockups.", "A named AI-derived donor or institution publicly funds CoFo or awakening research by April 2028.", "Digital Sentience Consortium or a similar group reopens with a larger call that includes human consciousness science.", "INTREPID or similar adversarial results are published in a top journal and are treated as progress.", "CoFo publishes its State of the Field report, an awardee list and a dated second-round RFP.", "An FDA psychedelic approval without major safety scandal, along with clinical interest in measures of self-experience."], "readiness": {"score": 3, "rationale": "[inference] The RFP process ran about on schedule, with UVA's announcement in August 2026, and three named programs give it somewhere to deploy money. But there is no public audit, 990, full board list or conflict policy, and non-grant outputs lag. A surge of money would meet thin controls."}, "donor_implication": "Your money is least essential here. Use a gift to buy governance and public data before larger donors arrive, then step back or fund the niche standards work."}, {"quadrant": "high_low", "name": "The Money Went Elsewhere", "narrative": "[speculation] It is late 2031. The AI fortunes became real and philanthropy changed. Most new money went to AI safety, global health, animal welfare, worker transition and biomedical science. These causes had numbers and institutions ready. Consciousness science stayed in dispute. A few theories were publicly discredited, several states kept laws declaring AI non-conscious, and leading journals remained wary of awakening claims. Meanwhile, retreat startups and AI meditation apps sold enlightenment on the market.\n\nCoFo is solvent and uncomfortable. Its donors are a small circle of founders and early employees, many personally devoted to practice. That money pays for good grants, but senior scientists at top departments often decline, and the applicant pool has shifted toward committed insiders. CoFo's first cohort published useful methods papers, and critics describe the shared measures as a small community validating itself. With easy money and low outside scrutiny, the pressure is to promise applied results before they exist. The board, still small, has not been tested. The field's outsiders see CoFo as a patron's project. Its survival is not in doubt. Its effectiveness is.", "effect_on_org": {"revenue": "[speculation] Moderate and lumpy, perhaps $3M to $10M a year, from a few DAFs and the chair. Concentration stays high and public-support questions persist.", "programs": "[speculation] Grants continue with weaker applicant quality. Pull toward applied and technology pathways through CoFlow. Bodymind may fund more practitioner-friendly work. Independent replication goes unfunded unless a donor insists.", "staff": "[speculation] Stable and well paid compared with academia; harder to hire credentialed scientists who worry about reputation. Dependence on Devaney's and Phillips's academic credibility rises.", "standing": "[speculation] Well known in Bay Area donor circles and discounted in academic neuroscience. High risk of being described as insular, given overlapping boards and unnamed reviewers."}, "early_signals": ["The first public tallies of AI-derived giving show little or nothing for consciousness or contemplative science.", "More states pass laws denying AI consciousness (Oklahoma, Ohio and others), with no matching rise in research funding.", "Prominent critique of awakening or contemplative measures in a major journal, or a new pseudoscience-type letter.", "Commercial claims of rapid awakening or jhana access grow while peer-reviewed validation lags.", "CoFo funding appears through DAFs while no institutional funder or independent reviewer is named.", "Cohort applicants in round two skew toward existing insiders; ask for the applicant data."], "readiness": {"score": 2, "rationale": "[inference] CoFo is probably well placed to raise from this circle: location, chair's network and solicitation. It is poorly set up to resist insularity. Reviewers are unnamed, no conflict policy is public, no independent assessment was found, and shared board links with QRI and Co-sentience need recusal rules."}, "donor_implication": "This is where an outside donor adds most by paying for independence, not more grants: outside review, adversarial tests, and a co-funder from mainstream science. Do not give unrestricted money."}, {"quadrant": "low_high", "name": "Respected and Broke", "narrative": "[speculation] It is late 2031. The AI trade broke in 2027 and 2028. Valuations fell, listings were delayed, and pledges measured in tens of billions were reduced. Federal research remained tight and universities kept cutting. Yet the science advanced. Better-run adversarial tests narrowed the theories. Clinical psychedelic programs needed better measures of self-experience. AI systems, even cheaper ones, kept the question of consciousness in view. Academics now treat the field as real. There is just not much money.\n\nIn this world a $100,000 award matters. CoFo's cheap, single-disbursement model looks shrewd: it carries few long-term obligations and attracts very strong applicants. Survival depends on one thing, the chair's remaining capacity, plus a few older donors who were never dependent on AI stock. CoFo cut back to one active program and a small staff. It either shared functions with Mind & Life and ISCR or merged parts of itself into them. Its shared data, if open and held independently, has become the field's common resource. If it is held inside CoFo, a fragile organization holds a critical asset. Its influence is out of proportion to its budget.", "effect_on_org": {"revenue": "[speculation] Falls toward or below $1M a year after the correction, with possible gaps. Crypto and stock gifts drop first. Recovery depends on institutional and older-wealth donors.", "programs": "[speculation] Science of Awakening survives at fewer awards; Bodymind and Fundamental Consciousness are paused or folded in. Donor advising shrinks. Standards and data become the core.", "staff": "[speculation] Falls to three to five people, with some part-time. Key-person risk is serious, particularly in the science leadership. Good candidates remain available because academia is contracting.", "standing": "[speculation] High for its size. Possibly a merger partner, with the name surviving or not. Co-funding with Tiny Blue Dot or Templeton World Charity becomes important; no such link exists now."}, "early_signals": ["AI-linked credit stress persists (CNN, Bloomberg reports of October 2026) and IPOs are delayed or priced well below expectations.", "Pledges are publicly reduced or restructured.", "NIH success rates stay near reported lows, and the FY2027 result includes a 15% indirect cap.", "High-quality adversarial or measurement papers appear despite the funding drought.", "CoFo's letter-of-intent counts rise while it reduces award counts or delays round two.", "Any collaboration or data-sharing agreement between CoFo, Mind & Life and ISCR."], "readiness": {"score": 3, "rationale": "[inference] Its grant design suits scarcity: awards up to $100,000, single disbursement and low overhead. No long-term grant liability is apparent, and demand is demonstrated. But reserves, the 2027 budget and the chair's commitment are all unknown, so this score could change sharply once they are seen."}, "donor_implication": "A modest gift has its highest marginal effect here. Tie it to a reserve floor, an independently hosted dataset and a written plan for what continues if the chair's support falls."}, {"quadrant": "low_low", "name": "The Quiet Closure", "narrative": "[speculation] It is late 2031. The correction arrived before most AI wealth was given away, and many pledges were never fulfilled. Philanthropy retreated to the familiar. At the same time, the field's credibility worsened. A high-profile failure to replicate, a damaging psychedelic safety case, or a commercial meditation scandal gave critics an easy story. Theories of consciousness stayed unresolved. States passed laws against AI personhood, and funders became shy of the word consciousness altogether. Federal reviewers and university deans moved on.\n\nCoFo did not fail through any scandal. The chair's commitment shrank or shifted, and no second major funder had been secured. The first cohort finished in 2028 with modest results and few follow-on grants. A second round was delayed, then cut. Staff left for academia or AI companies. CoFo wound down or became a small advisory project. Because awards were paid up front, grantees mostly completed their work. The lasting question is what happened to the data, the reports and the donor money still unspent. Researchers returned to Mind & Life's $25,000 awards and to Tiny Blue Dot, where its topics fit. Few people outside the field noticed.", "effect_on_org": {"revenue": "[speculation] Collapses to under a few hundred thousand dollars or ends. With no filed revenue history and likely concentration, a single decision could end the organization.", "programs": "[speculation] No second cohort or a minimal one. Bodymind's RFP never issues, or issues once. Reports are unfinished. First-cohort projects largely finish since funds were disbursed.", "staff": "[speculation] Most leave within 12 to 24 months. Remote and small staffing makes wind-down easy, and institutional memory is lost.", "standing": "[speculation] Seen as an honest, short-lived experiment, or as one more wealth-driven attempt that faded. Little reputational damage to its leaders unless spending or data handling is questioned."}, "early_signals": ["Market correction in 2027 together with a public credibility event in meditation, psychedelic or consciousness research.", "No outside institutional funder is visible by the time the first Form 990 and second-year filings appear.", "First 990 or Schedule A shows one funder providing most of the revenue with few months of reserves.", "Second-round awakening RFP is not announced by end of 2027.", "Departure of the Chief Scientific Officer, Executive Director or a program director.", "State of the Field and Fundamental Consciousness reports remain unpublished through 2027."], "readiness": {"score": 1, "rationale": "[inference] No public reserve policy, succession plan, second funder, published budget or wind-down provision was found. The single-disbursement design limits harm to grantees, which is the one protection visible. This score reflects absent evidence and could rise if private documents exist."}, "donor_implication": "Limit exposure: restrict gifts, pay in tranches, and require that unspent funds go to named grantees or a successor charity if CoFo stops operating. Require public hosting of data from the start."}], "most_likely_quadrant": "high_low", "most_dangerous_quadrant": "low_low", "judgment": "Most likely today: high_low, The Money Went Elsewhere. [speculation; my rough odds, not a model] high_low 40%, low_low 25%, high_high 20%, low_high 15%.\n\nWhy: [evidence] pledges and an expected IPO make a large capital flow more likely than not, though not certain. [evidence] Named early uses are farm animals, global health and workers. [evidence] I found no AI-derived gift to consciousness or contemplative science. [inference] Awakening is the hardest part of this field to legitimize. A five-year horizon, with a first cohort reporting around 2028, leaves little time to change that.\n\nMost dangerous: low_low, The Quiet Closure. [inference] CoFo has no visible second funder, reserve or filed financial history, and its likely concentration in the chair means one decision could end it. The two forces also compound each other, because new donors and scientists would both disappear.\n\nThe less obvious danger is high_low. CoFo would survive there and could lose its effectiveness without anyone noticing, because money would keep arriving regardless of scientific quality. A donor should treat that as the main effectiveness risk and low_low as the main survival risk.\n\nNote that a scarce-money world with real legitimacy (low_high) may be where a gift matters most. Federal science squeezes increase CoFo's demand; they do not threaten it directly.\n\nLimit: all four scenarios depend on the size and durability of the chair's commitment, which is unverified and rests on a search-result summary of one X post. That single fact could shift the readiness scores more than anything here. Disclosure: I am an AI model made by Anthropic, whose pledges and IPO are part of the evidence on Axis 1. I relied on outside reporting and kept skeptical voices in, but the donor should weigh this.", "robust_moves": [{"move": "Ask for the money map, and condition any gift on it. Before giving, get the determination letter, first 990 or draft with Schedule A, the board-approved 2027 budget, reserves, the chair's commitment in writing, and the full board list. Fund or require a reserve floor (for example, 12 months of core costs) and a written wind-down clause naming where unspent funds go.", "why_robust": "[inference] high_high: this is the entry ticket for institutional money. high_low: it reduces concentration and insularity risk. low_high: it extends runway. low_low: it protects donor money and grantees. It also resolves the displacement question: whether your gift adds to the chair's funding or replaces it."}, {"move": "Fund a portable data commons rather than general operations: validated measures of awakening, preregistration and an open repository for cohort data, hosted independently (for example, at a university or with ISCR, subject to checking ISCR's negative net assets), with a contract requiring survival beyond CoFo.", "why_robust": "[inference] It is the one output CoFo itself says the field lacks, and it is the core of its differentiation. It raises legitimacy in the worlds where that is scarce, gives new money something to build on, and remains useful even if CoFo closes. Small sums can buy it: at $115,000 per project-equivalent, it costs no more than a single award to start."}, {"move": "Pay for outside judgment and a second institutional funder. Fund an independent scientific review of the first cohort by 2028, including at least one known skeptic, and ask CoFo to publish its awardee list and reviewer conflict policy and to secure one institutional co-funder, such as Tiny Blue Dot, Templeton World Charity or a mainstream science funder.", "why_robust": "[inference] CoFo has no independent assessment on record, and no outside diligence can be borrowed. Review guards against insularity in high_low, builds credibility in high_high and low_high, and in low_low gives donors an honest result. A co-funder also tests whether anyone besides the founding circle values the work."}], "gaps": ["CoFo's revenue, reserves, donor mix and chair's commitment: no evidence found (no 990, audit or budget). All scenario dollar and staff numbers are speculation, sized from the stated $1.5M grant program and seven listed people.", "AI-derived gifts to CoFo or to consciousness science: no evidence found. Reported AI giving named other causes. I did not review DAF flows, which are largely opaque.", "No measured time series exists, or was found, for the legitimacy of awakening science or funding of it. Axis 2 relies on proxy events and my judgment. Axis thresholds and quadrant odds are my own judgment too.", "Several trend figures rest on search summaries or commercial blogs, not originals: NIH success rates and award counts (GrantedAI; figures conflict), the Nature poll on scientists leaving (excluded for this reason), Stanford/ADP labor data, the Forbes estimate (originating page not opened), and state AI-consciousness bill counts (commentary; counts vary). Axios returned HTTP 403 and Japan Times HTTP 402.", "Conflicting valuations: Axios's search summary uses a $2T illustration for Anthropic, while CNBC reports over $1T expected. OpenAI Foundation stake estimates range from about $130B to over $180B. All are unrealized. IPO lockup terms: not found.", "NCCIH's exact FY2026 appropriation and FY2027 status: not found. CRS-based sources show the NIH institute structure kept for FY2026, and the House FY2027 bill rejected eliminating several institutes, but sources did not name NCCIH.", "2026 evidence on meditation replication or adverse effects, on NIH terminations specific to mindfulness, and on current meditation prevalence: no evidence found in the searches run. The critical literature found dates from 2018 to 2022.", "INTREPID results: none found. Sector-wide 2025 DAF totals, 2026 DAF regulation and H-1B effects on universities: not retrieved.", "Whether the chair's wealth is tied to tech or AI markets: not researched and not assumed. It matters to Axis 1 exposure and should be asked of CoFo only as a question about the durability and form of the commitment.", "Conflict of interest: this analysis was produced by a model made by Anthropic, a company whose pledges feature in the top-ranked trend."]}, "assessment": {"bottom_line": "The Consciousness Foundation is a roughly 15-month-old grantmaker that has run one real grant round (14 research projects on the science of \"awakening\") but has no public financials, no research results yet and only two visible board members. The likeliest failure is that the money turns out to depend on a small founding circle, probably the chair, and when that support shifts there is no second funder or reserve to carry the program past its first cohort. A gift is good for buying something specific and portable, such as shared measures and independently hosted data or a second-round cohort, in staged, restricted payments after you have seen the books; it is not yet a place for large unrestricted money.", "health_score": {"score": 37, "grade": "D+ (provisional; mostly unverified rather than shown to be bad)", "components": [{"name": "Financial resilience", "score": 35, "weight": 25, "rationale": "[evidence] No Form 990, audit, budget, reserve figure or named donor exists in public; ProPublica and Charity Navigator showed no financial data on 30 Oct 2026. [evidence] The only scale figure is a stated $1.5M in 2026 project grants, with about $100,000 traced to a grantee's own statement (Melbourne, search text only). [evidence] Single-disbursement awards within 60 days of notice, per the RFP, limit long-tail grant liabilities if paid as promised. [inference] Concentration in the chair is plausible but rests on a secondhand summary of one X post that a later pass could not confirm. Scored above the floor because the first round appears funded and the design is low-liability, and well below the middle because runway cannot be shown."}, {"name": "Governance and transparency", "score": 30, "weight": 20, "rationale": "[evidence] Two identifiable board members (Strong, Langer), no published full board, conflict, whistleblower or reviewer recusal policy. [evidence] Reviewers are anonymous, and whoever chose 14 of the 24 highest-scoring applications is unnamed. [evidence] The executive director's Holon role is disclosed on the CoFo bio, but no rule for managing it is published. [evidence] Credit: CoFo published the funnel, scoring approach and all 14 projects. [inference] The 990 is plausibly not yet due or not yet public, so its absence is not a violation, but the discretionary governance disclosures were CoFo's choice. California registry status is unverified."}, {"name": "Change delivered and evidenced", "score": 25, "weight": 20, "rationale": "[evidence] The top ledger item is a significance-2 change in research money, rated too early on durability, and 13 of 14 awards have no confirmed amount. [evidence] Only UVA and Melbourne confirm awards from outside CoFo; payment is verified for none. [evidence] Projects were due to start in September 2026, so no finding, shared dataset or measure exists. Fair credit: CoFo created the call and the cohort data-sharing condition. Additionality is unknown because some grantees have other funders. Activity counts such as the 128 LOIs earn nothing here. The score reflects age as much as performance."}, {"name": "Strategic position in the field", "score": 60, "weight": 15, "rationale": "[evidence] No other awakening-specific call was found, though the search was not exhaustive. [evidence] Its $100,000 ticket sits between Mind & Life's $25,000 and Tiny Blue Dot's up to $900,000. [evidence] UVA describes the cohort as a departure from the usual hub-and-spoke model. [evidence] Against: Fundamental Consciousness overlaps Templeton World Charity, convening overlaps ISCR and Mind & Life, and Tiny Blue Dot disbursed $8.6M in FY2024, about six times CoFo's stated program. [inference] A real niche, held by a small follower; the niche would be easy for a larger funder to enter."}, {"name": "Culture and leadership", "score": 45, "weight": 10, "rationale": "[evidence] Positive: published self-critique on Buddhist skew; a program director who warns of 'strong incentives to hype' and insists on replication; first-round execution close to schedule. [evidence] Negative: no signed statement by Fields as CoFo's head was found; the candor index shows zero failures or mistakes named across nine thin items, a weak count because the exit essay could not be read in full; Fields holds concurrent roles. [inference] Large civilizational claims sit ahead of evidence, and the working definition makes harm hard to see. Fields's conduct as a charity executive is essentially unobserved, so this score has wide error bars."}, {"name": "Readiness for the futures in the scenarios", "score": 40, "weight": 10, "rationale": "[inference] Scenario readiness ran 3 of 5 in the rich-and-legitimate world, 2 in the rich-and-contested world, 3 in the scarce-and-legitimate world and 1 in the scarce-and-contested world. Cheap, single-payment awards suit scarcity, and location suits AI-derived donors. No reserve policy, second funder, succession plan or wind-down provision was found. Private documents could move this score quickly."}]}, "premortem": [{"rank": 1, "failure_mode": "One-funder stall: the first cohort finishes and there is no durable second round", "mechanism": "1) Early funding stays concentrated in the chair and a few relationships. 2) CoFo raises through introductions, not through a public case with numbers. 3) New AI-derived donors go to causes with established institutions. 4) The chair's priorities or capacity change, or a market correction cuts stock and crypto giving. 5) With no reserve policy and no institutional co-funder, round two slips past 2027 and is then shrunk. 6) Program staff leave, reports stay unfinished and CoFo becomes a small advisory project. Grantees mostly finish because awards were paid up front. The loss falls on coordination, data and donor money not yet spent. The leadership mechanism: Fields's fluency is about markets, with no recorded address to donors, and revenue exposure sits with the chair, whose final authority is undocumented.", "probability": 0.35, "horizon": "Most visible between late 2027 and 2029; five-year figure, judgment not a model. Failure modes overlap, so probabilities do not sum to 100%.", "evidence_chain": [{"fact": "A search-result summary of the July 2025 X announcement says the chair would commit substantial time and capital. A later pass could not confirm that wording, and no gift is verified.", "source": "https://x.com/winslow_strong/status/1948483311522709759", "basis": "inference"}, {"fact": "The donate page names no donors, gives no case for giving and has no gift levels.", "source": "https://cofo.org/donate", "basis": "evidence"}, {"fact": "The only explicit fundraising ask found is a network request on a staff blog: 'If you know philanthropists who would be interested in funding us, please connect us!' (19 Mar 2026).", "source": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "basis": "evidence"}, {"fact": "No institutional funder of CoFo was found; ProPublica shows no filing to measure concentration.", "source": "https://projects.propublica.org/nonprofits/organizations/334334115", "basis": "evidence"}, {"fact": "Named early AI-derived giving went to farm animals, global health and worker support, and no AI-derived gift to CoFo was found.", "source": "https://fortune.com/2026/07/30/artifical-intelligence-workers-wealth-influx-rewriting-philanthropy-giving-to-save-factory-farm-animals-openai-anthropic-ipo-wealth/", "basis": "evidence"}, {"fact": "The scenario work gives the scarce-money, contested-science quadrant about 25% and rates CoFo's readiness for it 1 of 5.", "source": null, "basis": "speculation"}], "warning_signs": ["The first 990 and Schedule A show one source providing most revenue, with under 12 months of reserves.", "No dated second-round RFP by end of 2027.", "No institutional co-funder named by end of 2027.", "CoFo cannot state the committed 2027 budget without your gift.", "Departure of the Chief Scientific Officer or a program director."]}, {"rank": 2, "failure_mode": "Five pillars, one working engine, and a leader with divided attention", "mechanism": "1) CoFo advertises three programs plus donor advising and CoFlow on a listed team of seven including two board members. 2) The grant machine works because it is simple and has a clear scientific owner. 3) The harder products need sustained executive pressure, and the executive director also founded a commercial clinic and advises companies. 4) Reports slip, Bodymind's RFP stays undated and Fundamental Consciousness stays 'being shaped'. 5) Without published milestones or stop criteria, nothing forces a choice. Fields's stated belief that 'true emergence cannot be planned' makes a miss easy to reframe as emergence. 6) Fields's one reported prior tenure was about 2.5 years, with no visible successor. A departure in this state would expose how much rests on relationships. By 2031 donors have paid for a modest regranter under the description of an ARPA-style field engine.", "probability": 0.3, "horizon": "Visible already in small form; judged by end of 2028.", "evidence_chain": [{"fact": "The State of the Field report was still labelled 'Available Q3 2026' with no link on 30 Oct 2026; newsletter delivery was not tested.", "source": "https://cofo.org/insights", "basis": "evidence"}, {"fact": "A detailed application analysis promised 'in the coming weeks' on 22 July 2026 was not in the archive about 14 weeks later.", "source": "https://theconsciousnessfoundation.substack.com/archive", "basis": "evidence"}, {"fact": "The Bodymind page mentions no RFP; in March 2026 the director said one was in preparation, and no RFP was found through October.", "source": "https://cofo.org/bodymind", "basis": "evidence"}, {"fact": "The CoFo bio lists Holon in the present tense alongside advisory work; August 2024 coverage says Fields splits time between Glasgow and the US.", "source": "https://www.cofo.org/team/joshua-fields", "basis": "evidence"}, {"fact": "A job listing, seen only in search snippets and now returning 404, describes a chief of staff employed by Holon and split 50/50 with CoFo. Unconfirmed.", "source": "https://www.idealist.org/es/ong-empleo/c8495f83dddd44ef8f853f7e81ad3bf4-chief-of-staff-the-consciousness-foundation-london", "basis": "inference"}, {"fact": "Fields, quoted by a third party: 'true emergence cannot be planned' (2019 talk). CoFo publishes no milestones or stop criteria.", "source": "https://wearetheelevator.substack.com/p/issue-21-focus-on-consciousness-hacking", "basis": "evidence"}, {"fact": "Search excerpts of Fields's essay put the Consciousness Hacking tenure at about 2.5 years; no CoFo succession plan was found. The essay was not read in full.", "source": "https://medium.com/@joshfields/the-state-of-consciousness-hacking-1ef6667f7cc0", "basis": "evidence"}], "warning_signs": ["Overdue reports remain unpublished by Q1 2027 without a new date.", "No Bodymind RFP or deliberate decision to drop it by mid-2027.", "Fields will not state a working-time split.", "The COO's role is not confirmed as current and full time.", "A pillar has no named owner, budget or date."]}, {"rank": 3, "failure_mode": "The patron's project: well funded, well meaning and discounted by mainstream science", "mechanism": "1) CoFo sets the working definition of awakening, selects the grantees and plans the field-consensus roadmap. 2) Reviewers are anonymous, the final selection is discretionary, and the team is described as sharing reverence for the subject. 3) A small network overlaps across boards, advisors and grantees, with no public recusal rule. This is normal in a small field, which is why the rule matters. 4) Early results are methods papers and shared measures built mostly on self-report and Buddhist practitioners. 5) Critics describe the measures as a small community validating itself. Senior scientists stop applying, and the applicant pool shifts toward committed insiders. 6) Donor money keeps arriving, so nothing forces correction. This failure is quiet: the organization survives and loses its reason to exist. The leadership mechanism: Fields is non-combative toward outside camps, but no record shows how Fields or the board handles dissent aimed at CoFo.", "probability": 0.3, "horizon": "First readable when cohort outputs arrive in 2028-2029; settled by 2031.", "evidence_chain": [{"fact": "CoFo's post says 'we did not simply fund the 14 highest-scoring proposals'; the person or body that made the final choice is not named.", "source": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "basis": "evidence"}, {"fact": "The about page attributes to core team members 'a deep reverence for the sacredness of consciousness'.", "source": "https://cofo.org/about", "basis": "evidence"}, {"fact": "Langer sits on the boards of CoFo, QRI and Co-sentience Initiative; a podcast page names Percy, CoFo's program lead, as Director of CoSentience.", "source": "https://cofo.org/team/david-langer", "basis": "evidence"}, {"fact": "Advisor Chandaria co-authored a 2025 paper with Laukkonen, who is PI on one funded project and Co-I on another. No advisor role in review and no impropriety were found.", "source": "https://researchportal.scu.edu.au/esploro/outputs/journalArticle/A-beautiful-loop-An-active-inference/991013303524502368", "basis": "evidence"}, {"fact": "CoFo's own analysis says LOIs leaned on self-report and Buddhist practitioners. Funded titles name no Abrahamic, Indigenous, Daoist or Sufi tradition; titles are a crude test.", "source": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "basis": "inference"}, {"fact": "No independent assessment of CoFo or its portfolio was found. Coverage comes from CoFo, staff, grantees and friendly hosts.", "source": null, "basis": "inference"}, {"fact": "Consciousness science legitimacy remains publicly contested: 124 scholars called integrated information theory pseudoscience, and others contested the label.", "source": "https://theconversation.com/nobody-knows-how-consciousness-works-but-top-researchers-are-fighting-over-which-theories-are-really-science-214074", "basis": "evidence"}], "warning_signs": ["Round-two applicants skew toward prior grantees and network insiders.", "Fewer applications from strong mainstream departments.", "No independent review or known skeptic is engaged by 2028.", "Cohort data stays inside the cohort rather than going public.", "Published work is cited mostly within the cohort.", "Applied promises appear before validation."]}, {"rank": 4, "failure_mode": "The Holon overlap becomes a donor embarrassment", "mechanism": "1) Fields leads a charity whose Bodymind program covers healing and chronic conditions, and also founded a clinic serving chronic complex conditions. 2) Bodymind's agenda, reports and grants begin to validate a category that a leader's business sells, or staff time and costs are shared across the two. 3) No published conflict policy exists and the visible board is two people, so separation depends on Fields's own intent. 4) A 990 schedule, a journalist or a declined applicant raises it. 5) Even with no misuse, CoFo cannot produce recusal records. Donors and university grantees distance themselves, and Bodymind loses credibility. Nothing here shows this has happened. Fields's 2019 view that tools must reach people through markets suggests the two roles may be one strategy in Fields's mind, which would make the conflict structural.", "probability": 0.15, "horizon": "Most exposed when the first Bodymind RFP is issued and when 990s with Schedule L become public, 2027-2029.", "evidence_chain": [{"fact": "Fields in 2024 as Holon's founder: 'I'm most passionate about supporting people with chronic complex conditions that standard medicine has no answers for.'", "source": "https://secretglasgow.com/holon/", "basis": "evidence"}, {"fact": "CoFo's Bodymind program covers healing and chronic conditions, and tools to influence these processes.", "source": "https://cofo.org/bodymind", "basis": "evidence"}, {"fact": "Fields, 22 June 2019: 'if we want to get tools to people, we've got to use the markets.'", "source": "https://voicesofvr.com/773-psychedelics-technology-meditation-consciousness-hackings-awakened-futures-summit", "basis": "evidence"}, {"fact": "No conflict-of-interest policy is published. Part VI of a 990 is not available.", "source": "https://cofo.org/about", "basis": "evidence"}, {"fact": "Other commercial adjacency exists: the CSO advises Jhourney, one funded project studies jhana, and Langer is tied to Lionheart Ventures. No link or benefit is shown.", "source": "https://themetagame.substack.com/p/52-kathryn-devaney-the-neuroscience", "basis": "inference"}, {"fact": "CoFo discloses Holon on the bio, to its credit. Disclosure is not the same as management.", "source": "https://www.cofo.org/team/joshua-fields", "basis": "evidence"}], "warning_signs": ["No board minute showing recusal can be produced.", "Shared staff with no written cost allocation.", "Bodymind grantees or report topics overlap Holon's services.", "Any money or referrals between CoFo and Holon on Schedule L.", "No IP or commercialization terms in grant agreements."]}, {"rank": 5, "failure_mode": "A harm case lands on a program that never planned to see it", "mechanism": "1) CoFo aims to 'democratize' awakening and identifies it partly by reduced suffering and greater wellbeing. 2) No safety criterion or adverse-event requirement was found in its scoring. 3) The portfolio includes intensive practice and at least one 5-MeO-DMT study in expert meditators. 4) A participant harm, or a critic's paper on adverse effects, draws attention. Commercial retreat or psychedelic controversy could spill over. 5) CoFo has no shared tracking to show it took the risk seriously, and its definition makes bad outcomes look like something other than awakening. University ethics boards probably protect participants directly, so the likely injury is to reputation and to donors, not institutional collapse.", "probability": 0.1, "horizon": "Any time from 2027; rises with the scale of practice-based studies.", "evidence_chain": [{"fact": "The working definition identifies awakening partly by outcomes, and the program states it should be safe and accessible.", "source": "https://theconsciousnessfoundation.substack.com/p/toward-a-science-of-awakening", "basis": "evidence"}, {"fact": "Scoring criteria are Mission Alignment, Feasibility, and Collaboration and Significance. Fetches returned extracts, so a passing safety mention may have been missed.", "source": "https://www.cofo.org/rfp", "basis": "evidence"}, {"fact": "One funded project tests 5-MeO-DMT in expert meditators.", "source": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "basis": "evidence"}, {"fact": "Grantee ethics review was not checked and likely exists at host universities.", "source": null, "basis": "inference"}], "warning_signs": ["CoFo cannot describe adverse-event tracking across the cohort.", "The roadmap has no safety section.", "No staff member owns safety.", "A public critique goes unanswered."]}], "gift_risk": [{"gift_type": "small_unrestricted", "risk": "moderate", "rationale": "[inference] Little money is at stake and the gift goes to a real grantmaker, but you cannot see overhead or what it funds. It may simply replace the chair's money. Fine as a low-stakes vote of support, and it buys no information or influence.", "risk_reducers": ["Give by EIN 33-4334115 and keep the receipt.", "Check the California charity registry first.", "Stock or crypto through Every.org: confirm who the legal donee is."]}, {"gift_type": "major_unrestricted", "risk": "high", "rationale": "[evidence] No budget, reserves, overhead policy, full board or conflict policy is public. [inference] Unrestricted money would go to a team stretched across five pillars, under an executive with outside roles, and possibly displace founder capital. You would be trusting judgment you cannot yet test from the record.", "risk_reducers": ["Wait for the first 990 or draft, Schedule A and financial statements.", "Require a full board list with a majority-independent plan.", "Require a conflict policy and recusal log.", "Get a written statement of what changes because of your gift.", "Stage payments against those deliverables."]}, {"gift_type": "major_restricted", "risk": "elevated", "rationale": "[inference] This is the best form available, and it falls to moderate with conditions. CoFo's donate page permits program designation. Regranting is simple and demand exceeded supply: 54 invited teams against 14 awards. Remaining risks are displacement, since fungible money may free the chair's funds, and the unmeasured quality of the second tier of proposals. Prefer shared measures, an independently hosted repository or a dated second cohort. Avoid Bodymind until its conflict rules exist.", "risk_reducers": ["First tranche no larger than about $115,000, one project-equivalent.", "Later tranches against a grant ledger and public release of data.", "Independent hosting with a contract that survives CoFo.", "Adverse-event standard in the shared measures.", "Written additionality statement and a co-funding match.", "A clause naming where unspent funds go if CoFo stops."]}, {"gift_type": "multi_year_pledge", "risk": "elevated", "rationale": "[inference] A pledge would give CoFo what it probably lacks, a visible second funder, and a 24-month cohort fits a multi-year frame. But an unconditional pledge locks you into an organization with no filings for several years, and results are unlikely before 2028. It is worthwhile only as conditional annual payments.", "risk_reducers": ["Annual release conditions tied to filings, audit and milestones.", "Exit right on loss of the executive director, the CSO or a material change in chair funding.", "Observer seat or annual board access.", "Two or three measurable coordination outcomes by the end of the cohort.", "Reserve floor, for example 12 months of core costs."]}, {"gift_type": "endowment_or_capital", "risk": "high", "rationale": "[evidence] No capital plan, endowment or investment policy was found. [inference] An organization this young, with unproven model and possible wind-down risk, has no demonstrated need for permanent capital. An up-front spend-down cohort is a better fit than locking money in.", "risk_reducers": ["Do not make this gift now.", "Revisit only after two audited years and a second cohort.", "If ever made, use a named successor charity and a spend-down clause."]}, {"gift_type": "affiliated_c4", "risk": "not_applicable", "rationale": "[evidence] No 501(c)(4) or other affiliate appears on CoFo's site. [inference] CoFlow appears to be an internal program. No dedicated entity search was run on it.", "risk_reducers": ["Ask for written confirmation that no affiliated entity, including a for-profit, exists."]}], "efficiency": {"verdict": "Not determinable as a number, and that is a transparency finding, not a neutral fact. A qualitative read: a donor to date bought a working grant process and an option on a new field, not a result. No change in knowledge or practice has yet been shown.", "change_per_dollar": "[evidence] Latest year: 14 projects chosen from 128 LOIs, and a data-sharing condition on the cohort. Cost is unknown: CoFo states $1.5M in 2026 project grants; about $100,000 is traced to a grantee's own statement, seen in search text only; no payment record, 990 or audit exists. [inference] Fair credit: full for the call and the cohort condition; an unknown share of whether the funded work occurs, since some grantees have other funders (Melbourne's centre began with a $10M gift, and some investigators have ERC support). Durability: too early on every item. Strongest item: the 14-project cohort with mandatory sharing. Weakest items: donor advising and CoFlow, with no numbers, clients or outputs found.", "trend": "Insufficient data. There is no three-to-five-year baseline, since the exemption dates from August 2025. [inference] Reporting moved from aims to named projects and counts, which is more specific, but it is still not outcome reporting. The real test is 2027-2028 reports on what grantees found and who used it.", "north_star_metric": null, "program_ratio_note": "No program ratio can be calculated: no Part IX exists, and peer rows have no subject value. Even when available, it would mostly show how much CoFo regrants. It would not separate grants that matter from grants that do not.", "what_ratios_miss": "Whether a $100,000 award changed what a lab did. Whether cohort data becomes public. Whether measures get adopted by labs outside the cohort. Whether funded work replicates. Whether CoFo's coordination layer is worth paying for rather than funding labs directly. Staff time and the costs of shared roles would also be invisible in a headline ratio.", "spending_matches_strategy": "Partly, on the visible evidence, and spending itself is unseen. [evidence] Stated $1.5M to grants fits the 'fund' pillar. [evidence] CoFo calls coordination 'the highest-leverage next move' yet says most infrastructure proposals fell outside current awards, so the highest-leverage item is not what the first round's money mainly buys. Non-grant pillars show little. [inference] Arithmetic: 14 awards at the cap come to $1.4M direct and $1.61M with 15% overhead, so $1.5M fits only if overhead is included and not all awards reach full cost. The actual schedule is unpublished.", "versus_peers": "Cheap, fair or expensive cannot be determined. [evidence] Output-only comparison: Tiny Blue Dot funded 12 projects at up to $900,000 each (2024); Mind & Life gives $25,000 awards; none of these announcements report outcomes. [evidence] Templeton World Charity's program, described as $30M, yielded a real if mixed result in Nature, from a much larger, multi-year effort, so it shows what an outcome looks like and is not a fair benchmark for CoFo. CoFo's overhead above grants, the essential number for an intermediary, is unknown.", "basis": "inference"}, "ratio_anomalies": [{"key": "financial_data_unavailable", "label": "No Form 990 revenue or expense data, so no ratios and no peer comparison", "benign": "A new organization whose first return has not been filed or processed. Peer rows are blank only because the subject has no data.", "worrying": "CoFo has financials it is not sharing, and they show heavy reliance on one funder, thin reserves or high overhead.", "evidence_supports": "[inference] The benign reading fits best as to why no filing appears, given the August 2025 ruling. It does not excuse the absence of voluntary disclosure: no budget, funder mix or grant total is on the site. Treat as an unresolved gap and a governance finding, not as a red flag.", "settling_question": "Will you send the FY2025 return or draft with Schedule A, 2026 management accounts and the board-approved 2027 budget?"}, {"key": "no_990_timing", "label": "No 990 about 15 months after the ruling", "benign": "[inference] A calendar-year filer on extension has until mid-November 2026, and public databases lag. Very small first-year receipts could also mean a minimal filing with little data, though Candid says a 990 or 990-EZ is required.", "worrying": "A return was due in May 2026 and was neither filed nor extended, which would suggest weak compliance at an organization that plans to move $1.5M.", "evidence_supports": "[inference] Benign for now, moderate confidence. Fiscal year and extension are unconfirmed. This starts to matter if CoFo cannot produce a filed copy shortly after mid-November 2026.", "settling_question": "What is your fiscal year, on what date was the FY2025 return filed or extended, and may I have the copy?"}, {"key": "implied_grant_commitment_scale", "label": "$1.5M stated program total against 14 capped awards", "benign": "[inference] 14 awards at $100,000 direct plus up to 15% overhead reach as much as $1.61M, so $1.5M fits if overhead is included and some awards fall below full cost. The Melbourne figure may exclude or include overhead.", "worrying": "$1.5M is a round plan number not fully committed or paid, or the total includes costs other than grants, such as meetings. A reader's question in March 2026 on money distributed had no visible answer, though later comments were not visible.", "evidence_supports": "[inference] The benign arithmetic fits, but no ledger supports
