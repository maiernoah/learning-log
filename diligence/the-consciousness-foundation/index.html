ublished conflict management", "evidence": "Langer sits on the CoFo, QRI and Co-sentience boards. Percy directs CoSentience per a January 2026 podcast page and has a QRI visiting affiliation, and now leads a CoFo program. A low-reliability aggregator also places the chair on QRI's board. Fields leads Holon per a listing. CoFo's bio of Percy does not mention CoSentience. No CoFo money to these bodies was found.", "basis": "inference", "sources": [{"url": "https://cofo.org/team/david-langer", "title": "David Langer bio"}, {"url": "https://www.prism-global.com/podcast/chris-percy-computational-functionalism", "title": "PRISM podcast"}, {"url": "https://cofo.org/team/chris-percy", "title": "Chris Percy bio"}, {"url": "https://humantic.ai/public-profile/winslow-strong-7b3afb19697d51fa", "title": "Aggregator profile (low reliability; roles only)"}]}, {"pattern": "No organization-level measurement, though no hostility to measurement", "evidence": "The organization values measurement for the field. It publishes no measure for itself. This is absence at an early stage rather than resistance.", "basis": "inference", "sources": [{"url": "https://cofo.org/approach", "title": "Approach"}, {"url": "https://cofo.org", "title": "Home"}]}, {"pattern": "Patterns looked for and not found", "evidence": "No us-versus-them framing of critics, burnout language, donor flattery, public hostility to scrutiny or leader departures appeared in the material read. The sample is small and the organization is young, so this is weak comfort.", "basis": "evidence", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "Initial Learnings"}, {"url": "https://cofo.org/donate", "title": "Donate"}, {"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "Bodymind #2"}]}], "ethics_note": "This section reads the organization and leadership team as a system. It is not a psychological or personality assessment of anyone. Deliberately excluded: health histories and recovery narratives that appear in public bios and press on leaders; personal transformation narratives; references to personal spiritual practice and religious community involvement, except where an organization's own institutional language says something about culture; private-life references such as intentional-community membership; personal social accounts other than the chair's two public professional X posts about CoFo; and a 2021 change.org petition flagged by the scan, which was not read or used. A personality-profiling aggregator was consulted only for job and board titles, its personality content was ignored, and it is marked low reliability. Reader comments are cited only as public questions, without naming the commenters. Grantee and leader names appear only in their professional roles. Noted overlaps are questions about process and are not allegations of wrongdoing.", "gaps": ["The thinnest point: no CoFo-era interview, talk or long-form statement by the chair or Executive Director was found. Their views rest on two X post snippets, site copy and a 2019 podcast. This limits any reading of the founders' current thinking.", "The vision paper 'Consciousness: An Emerging Frontier', probably the fullest statement of theory of change, could not be read as text. The PDF was retrieved but no text could be extracted. Read it directly; conclusions about the missing cascade mechanism could change.", "Chief of Staff listing: all detail comes from search snippets of Spanish and Portuguese mirrors; fetches returned 404. Date, current status and full wording are unverified. Holon's description as AI-enabled and seed-stage appears only in that listing. Press on Holon's Glasgow centre was seen only in search results.", "Devaney's Metagame episode: show notes only, no transcript. Her ISCR talk that launched the RFP: no recording found. A Deconstructing Yourself conversation returned HTTP 403.", "Chair's X thread: unfetchable (HTTP 402); known only through search-result text and a summary. The 'substantial time and capital' wording is secondhand.", "Fetches returned model summaries and short excerpts of long pages, not full text. Absence claims such as 'no safety language' should be confirmed by reading the RFP, the March post and the Bodymind post in full.", "Comments: six further comments on the March post and five on the July post were not visible, so a reply on money distributed may exist.", "Employee reviews: none surfaced in searches, though review sites were not specifically queried. With a staff this small, useful reviews are unlikely. Careers page: none found.", "Internal documents: strategic plan, annual report, board minutes, grant agreements, IP terms and conflict policies: no evidence found.", "Staff and grantee views: only public, largely positive statements. No former staff, unsuccessful applicants or independent scientists were found commenting. Speak to several; rejected applicants may be the most informative.", "Dollars actually paid, per-grant amounts other than Melbourne, and how the $1.5M reconciles with 14 awards: no evidence found.", "Current status of the listed role overlaps (Percy at CoSentience, Liu at AI Alignment Foundation, Fields at Holon) is not confirmed as of October 2026.", "Chandaria-Laukkonen co-authorship is from search results on the 2025 paper. Whether advisors took part in review is unknown."]}, "scenarios": {"horizon_years": 5, "horizon_rationale": "Five years, to October 2031. Three clear reasons.\n\n- [evidence] CoFo calls its first cohort \"the opening chapter of a five-year, metascience-informed plan\" (Substack, 24 March 2026).\n- [inference] The first scientific evidence cannot arrive before about 2028: the grants run up to 24 months from September 2026. Three years would end just as results appear, and before anyone outside the cohort could test them.\n- [inference] Several sources say the public support test first bites around year six. With an August 2025 ruling, that lands around 2030-31, inside this horizon. The exact start date needs checking against Schedule A instructions.\n\nTen years is too long. An organization with no filed financials and about 15 months of public life has no base from which to project a decade.", "driving_forces": [{"name": "Durability of the chair's capital commitment", "category": "economic", "direction": "Unknown. [evidence, search-result summary only] The chair's July 2025 announcement reportedly commits substantial time and capital. No amount, term or legal source was found. [inference] This is probably the largest single dependency today.", "impact": 5, "uncertainty": 5, "relevance": "[inference] CoFo names no donor and publishes no budget, so its whole revenue mix is unseen. If one person underwrites most of it, that decision sets the budget, the 2027 grant round and survival. It also determines whether an outside gift adds anything or just displaces the chair's money.", "basis": "inference", "sources": [{"url": "https://x.com/winslow_strong/status/1948483311522709759", "title": "Chair's announcement on X, July 2025 (search result only)"}, {"url": "https://cofo.org/donate", "title": "CoFo: Donate (no donors named)"}]}, {"name": "AI-era wealth entering philanthropy, and whether any reaches this niche", "category": "economic", "direction": "Rising overall, but conditional. [evidence, search summaries, 2026] Estimates include about $40B a year (Coefficient Giving's CEO, contingent on Anthropic and OpenAI listing) and about $300B over several years feeding about $30B a year (Forbes-cited). These are forecasts and they conflict. No source I found names consciousness science as a recipient.", "impact": 5, "uncertainty": 4, "relevance": "[evidence] CoFo's Bodymind director asked readers in March 2026 to connect CoFo with philanthropists. [inference] A San Francisco organization with a technology-adjacent network is well placed to ask. Fortune's July 2026 headline points to other causes, such as animal welfare, and this money could easily miss CoFo.", "basis": "evidence", "sources": [{"url": "https://fortune.com/2026/07/30/artifical-intelligence-workers-wealth-influx-rewriting-philanthropy-giving-to-save-factory-farm-animals-openai-anthropic-ipo-wealth/", "title": "Fortune, 30 July 2026 (search result)"}, {"url": "https://www.adn.com/nation-world/2026/10/22/the-biggest-wealth-giveaway-in-modern-history-aims-to-transform-the-world/", "title": "Anchorage Daily News, 22 October 2026 (search result)"}, {"url": "https://www.philanthropy.com/news/coefficient-giving-boosts-pledge-to-1-billion-banking-on-an-ai-windfall/", "title": "Chronicle of Philanthropy: Coefficient Giving pledge (search result)"}, {"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "James W. Phillips: Bodymind #2, 19 March 2026"}]}, {"name": "Whether awakening can be made a measurable construct", "category": "technological", "direction": "Open. [evidence] CoFo's own analysis of 128 letters of intent found heavy reliance on self-report, 36 proposals for new instruments, and existing tools such as NADA, MEQ and FFMQ in common use. It says the field lacks common definitions, measurement standards and data repositories.", "impact": 5, "uncertainty": 5, "relevance": "[inference] This is the program's central scientific bet. If trait-level change in the sense of self can be measured reliably across labs, CoFo's model has a product. If not, the grants become a set of disconnected meditation studies. No evidence either way exists yet, because projects started only around September 2026.", "basis": "evidence", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "CoFo: Initial Learnings, 24 March 2026"}, {"url": "https://www.cofo.org/rfp", "title": "CoFo: RFP"}]}, {"name": "Delivery of the coordination layer: cohort sharing, roadmap, field reports", "category": "social", "direction": "Promised, not yet visible. [evidence] UVA confirms the data-sharing expectation. The 2026 plan includes a position paper, a consensus roadmap and a State of the Field report. That report was listed for Q3 2026 and had no public link on 30 October 2026, though newsletter release was not tested.", "impact": 5, "uncertainty": 4, "relevance": "[inference] Coordination is what a donor pays for over funding labs directly. The sharing obligation appears to run among awardees, and the RFP states no open-data mandate. So the public good may not reach the wider field. This moves with the measurement force, so the two form one axis.", "basis": "evidence", "sources": [{"url": "https://dev.csc.virginia.edu/news/toward-science-awakening-grant", "title": "UVA CSC: grant announcement, 31 August 2026"}, {"url": "https://cofo.org/awakening", "title": "CoFo: Science of Awakening"}, {"url": "https://cofo.org/insights", "title": "CoFo: Insights"}]}, {"name": "Scientific legitimacy and safety disputes", "category": "social", "direction": "Contested. [evidence] 124 scholars called integrated information theory pseudoscience, and others disputed that label. A 2026 JMIR paper reports disagreement over whether adverse meditation experiences are real harm or mainly ordinary distress. A 2025 study links side-effect reports to recent mental health symptoms and says open-ended questions undercount them.", "impact": 4, "uncertainty": 3, "relevance": "[evidence] 23 of 128 letters proposed psychedelic-assisted approaches and 22 proposed retreats, though the RFP excludes research solely on psychedelics. CoFo's March post does not address adverse effects. I did not find a safety-reporting requirement in the material reviewed, but I did not check the RFP for this specifically. [inference] Fundamental Consciousness sits directly in the IIT dispute. One harmed participant in a funded study could affect standing at any budget level.", "basis": "evidence", "sources": [{"url": "https://theconversation.com/nobody-knows-how-consciousness-works-but-top-researchers-are-fighting-over-which-theories-are-really-science-214074", "title": "The Conversation: theory dispute (search result)"}, {"url": "https://mental.jmir.org/2026/1/e90602/PDF", "title": "JMIR Mental Health 2026 (search result)"}, {"url": "https://www.eurekalert.org/news-releases/1095263", "title": "EurekAlert, 19 August 2025: meditation side effects (search result)"}, {"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "CoFo: Initial Learnings"}]}, {"name": "Public support test around 2030-31", "category": "political", "direction": "Fixed rule, uncertain result. [evidence, secondary sources plus IRS general guidance] A charity generally needs more than one-third public support over five years, and one donor's gifts count only up to 2% of total support. Gifts from qualifying public charities are generally outside the cap. New organizations get an early grace period, though sources differ on its exact mechanics.", "impact": 4, "uncertainty": 3, "relevance": "[inference] This is legal exposure specific to a chair-funded start-up. Illustration, my arithmetic: $10M of support over five years needs about $3.33M of public support. With the 2% cap at $200,000 per donor, that takes at least 17 capped donors or an equivalent from qualifying public charities. Failure could mean reclassification as a private foundation, which would undercut the 'public charity' claim on the donate page. CoFo's exact classification was not seen.", "basis": "inference", "sources": [{"url": "https://www.irs.gov/node/2381", "title": "IRS: Requirements for publicly supported charities"}, {"url": "https://www.smith-howard.com/an-overview-of-the-501c3-public-support-test-for-nonprofits/", "title": "Smith + Howard: public support test overview (search result)"}, {"url": "https://cofo.org/donate", "title": "CoFo: Donate"}]}, {"name": "First filings and the governance they expose", "category": "political", "direction": "Disclosure is about to rise. [inference] If the fiscal year is the calendar year, an extended FY2025 return would be due in mid-November 2026. [evidence] As of 30 October 2026 no 990 shows on ProPublica, and Candid shows no recorded board members. The site names only two board members.", "impact": 4, "uncertainty": 3, "relevance": "[inference] The first 990 and Schedule A will show compensation, contributions and directors, and may narrow several open questions within weeks. A first return covering a partial year may reveal little. Institutional funders would probably want an audit and an independent board. None is visible, and California registry status remains unverified.", "basis": "inference", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/334334115", "title": "ProPublica: Consciousness Research Foundation"}, {"url": "https://www.guidestar.org/profile/33-4334115", "title": "GuideStar profile"}, {"url": "https://cofo.org/about", "title": "CoFo: About"}]}, {"name": "Key-person concentration in a seven-person team", "category": "social", "direction": "Stable for now. [evidence] Seven people are listed, including the chair and one board member. No departures or succession plan were found. The Bodymind director expects to stay 'several years minimum'. The COO's status is unclear from an undated LinkedIn result.", "impact": 4, "uncertainty": 3, "relevance": "[inference] Each program appears to rest on one named lead: Devaney on awakening, Phillips on Bodymind, Percy on Fundamental Consciousness. A single departure could stall a program. An AI-money wave could also raise the competition for operators and program staff.", "basis": "inference", "sources": [{"url": "https://cofo.org/about", "title": "CoFo: About"}, {"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "James W. Phillips: Bodymind #2"}, {"url": "https://www.linkedin.com/in/aliciasliu/", "title": "LinkedIn (search result only; undated)"}]}, {"name": "Federal research squeeze", "category": "political", "direction": "Topline held, access worse. [evidence] NIH FY2026 was enacted at about $47.49B under P.L. 119-75. CRS reports research project grant success rates fell from 19% in FY2024 to 13% in FY2025, with 1,392 awards terminated as of 10 April 2026. The 15% indirect cap is enjoined. An NIH FY2027 table seen only in a search result appears to leave NCCIH blank, against about $170.4M earlier; this is unconfirmed. AIP's tracker lists a continuing resolution signed 2 September 2026. I found no final FY2027 figure.", "impact": 3, "uncertainty": 3, "relevance": "[inference] Tighter federal access makes a $100,000 award with 15% overhead more attractive to senior PIs, so demand likely stays high. It also removes the follow-on funding that could scale cohort findings. CoFo's relative value rises while the field's total capacity falls.", "basis": "evidence", "sources": [{"url": "https://www.everycrsreport.com/reports/IF13131.html", "title": "CRS IF13131: NIH Grants Policy (April 2026)"}, {"url": "https://casrai.org/news/nih-fy2026-appropriations-enacted-what-it-means-for-grantees", "title": "CASRAI: NIH FY2026 enacted (search result)"}, {"url": "https://officeofbudget.od.nih.gov/pdfs/FY27/br/Overview%20of%20FY%202027%20Budget%20Supplementary%20Tables.pdf", "title": "NIH FY2027 supplementary tables (search result only; fetch returned HTTP 403)"}, {"url": "https://www.aip.org/fyi/fy2027-national-institutes-of-health", "title": "AIP: FY2027 NIH tracker"}]}, {"name": "AI-consciousness salience and rival funding channels", "category": "technological", "direction": "Rising. [evidence, search results] Longview runs a 2026 digital minds round, with grants of up to $2M per an aggregator and a deadline extended to 24 July 2026. It follows a consortium with Macroscopic Ventures and The Navigation Fund. The John Templeton Foundation plans over $60M on intelligence from 2026, covering humans, animals and machines. I could not read Longview's own RFP (HTTP 404).", "impact": 3, "uncertainty": 4, "relevance": "[inference] This cuts both ways. Public interest in consciousness could lift donor attention to Fundamental Consciousness. It could also pull consciousness-minded money and talent toward machines, away from human contemplative science. Grants of $2M are 20 times CoFo's $100,000 ceiling.", "basis": "evidence", "sources": [{"url": "https://forum.effectivealtruism.org/posts/ToC8jpgdwFJGtfw7C/new-round-of-digital-minds-funding-opportunities-at-longview", "title": "EA Forum: New round of digital minds funding at Longview (search result)"}, {"url": "https://grantedai.com/grants/john-templeton-foundation-2026-intelligence-grants-ai-foundational-questions-jtf-e5f7a9b1", "title": "Granted AI: JTF intelligence grants (aggregator; search result)"}, {"url": "https://cofo.org/fundamental-consciousness", "title": "CoFo: Fundamental Consciousness"}]}, {"name": "Incumbent funders moving onto the awakening niche", "category": "economic", "direction": "No move seen. [evidence] Tiny Blue Dot disbursed $8.6M in FY2024, against CoFo's stated $1.5M for 2026, and offers awards up to $900,000. UVA's center received a reported $40M lead gift for its Contemplative Commons. Templeton World Charity has funded spiritual-practice research but shows no open consciousness call.", "impact": 3, "uncertainty": 3, "relevance": "[inference] CoFo's distinctiveness rests on one thing: a call aimed at awakening as a construct. A larger funder could copy that with a single RFP. It could also fund cohort members directly once results look promising, leaving CoFo without a role.", "basis": "evidence", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/464924931", "title": "ProPublica: Tiny Blue Dot"}, {"url": "https://giving.virginia.edu/where-to-give/contemplative-sciences-center", "title": "UVA Giving: Contemplative Sciences Center (search result)"}, {"url": "https://www.templetonworldcharity.org/our-priorities", "title": "TWCF: Our Priorities"}]}, {"name": "Neurotechnology as a new tool for contemplative research", "category": "technological", "direction": "Private capital is rising, aimed at clinical uses. [evidence, search summaries] Nudge raised a $100M Series A, Sonomind $23.5M (May 2026) and Sanmai $12M (July 2025). Arizona's SEMA Lab studies ultrasound for enhancing meditation. I found no evidence that these companies target meditation as a commercial indication.", "impact": 2, "uncertainty": 4, "relevance": "[evidence] Neurostimulation and virtual reality appear among proposed interventions in CoFo's letters of intent. [inference] Better tools could help CoFlow's claimed R&D work and improve experiments. Venture funding also offers donors a for-profit route to similar goals. This is an accelerator for either science outcome, not a decider.", "basis": "evidence", "sources": [{"url": "https://finder.techleap.nl/news/note/from-lab-to-clinic-nudge-zero-enters-human-trials-following-100m-raise", "title": "Techleap: Nudge (search result)"}, {"url": "https://www.massdevice.com/tag/sonomind/", "title": "MassDevice: Sonomind (search result)"}, {"url": "https://finder.techleap.nl/news/feed/sanmai-technologies-raises-12m-for-ai-brain-scanner", "title": "Techleap: Sanmai (search result)"}, {"url": "https://news.arizona.edu/news/researchers-explore-use-ultrasound-achieve-mindfulness", "title": "University of Arizona: ultrasound and mindfulness (search result)"}]}, {"name": "Charitable deduction changes from 2026", "category": "economic", "direction": "Settled, mildly negative. [evidence, secondary sources] Itemizers face a 0.5% of AGI floor, and the deduction's value is capped at 35%. Advisers suggest bunching gifts, including through donor-advised funds. I found no independent national estimate of the effect on giving.", "impact": 2, "uncertainty": 1, "relevance": "[inference] Conviction donors at this level are unlikely to change decisions over a few cents per dollar. The practical effect is timing: lumpier gifts, more routed through donor-advised funds, which CoFo's donate page already accepts. That can make annual revenue less predictable.", "basis": "evidence", "sources": [{"url": "https://www.accountingtoday.com/news/charitable-deduction-gets-caps-floors-and-haircuts-in-obbba", "title": "Accounting Today: OBBBA charitable changes (search result)"}, {"url": "https://cofo.org/donate", "title": "CoFo: Donate"}]}, {"name": "Environmental and 'metacrisis' framing", "category": "environmental", "direction": "Weak. [evidence] CoFo lists 'Wisdom and the Metacrisis' as 'Coming Soon'. I found no direct environmental dependency: CoFo runs no sites or field operations, and no environmental force was found that bears materially on it.", "impact": 1, "uncertainty": 2, "relevance": "[speculation] If ecological or social crises intensify, some donors may either value inner-development work more or see it as a luxury. Included for completeness. It should not influence the decision.", "basis": "speculation", "sources": [{"url": "https://cofo.org/insights", "title": "CoFo: Insights"}]}], "axes": [{"name": "Axis 1: Capital base (durability and breadth of funding)", "low_pole": "Patron-dependent. Through 2031 one insider funder supplies most revenue, no institutional funder is named, and annual spending stays near or below about $1.5M-$2M in grants, continuing at that funder's discretion.", "high_pole": "Diversified at scale. At least three independent funders, none above 50%, and $5M or more a year in revenue. These thresholds are my own markers: $5M would exceed Mind & Life's FY2024 expenses of $3.25M.", "why_critical": "[inference] This merges the two top money forces: chair capital (5x5=25) and outside AI-era wealth (5x4=20). They are one axis because the question is the same: who pays, and how many. It also absorbs the public support test (4x3=12), whose outcome is largely set by revenue mix. Revenue decides the number of rounds, staff size, legal status and additionality of any gift.", "runners_up_rejected": "Decided against, with products:\n- Coordination delivery (5x4=20): moves with measurability, so it is folded into Axis 2.\n- Public support test (12): derivative of Axis 1.\n- First filings and governance (12): near-term, and largely resolved by disclosure rather than remaining uncertain for five years.\n- Key-person risk (12): an event risk within each scenario, not a defining dimension.\n- AI-consciousness salience (12): acts through donor money and attention, so it mostly feeds Axis 1.\n- Federal squeeze (9): important for the field, but it changes CoFo's context more than its fate.\n- Incumbent entry (9): plays out as an effect inside the quadrants, especially low-high."}, {"name": "Axis 2: Scientific traction (does the cohort model produce shared, usable science?)", "low_pole": "No common yardstick. By 2031 cohort labs still publish on their own instruments, results rest mainly on self-report, no CoFo-linked standard or dataset is used outside its grantees, and the roadmap has no visible uptake.", "high_pole": "Adopted public goods. By 2031 shared measures or pooled data are used by labs CoFo did not fund, at least some key findings hold up under independent re-analysis, and other funders or journals treat them as a reference.", "why_critical": "[inference] This merges measurability (5x5=25) with coordination delivery (5x4=20), which rise or fall together. It determines whether CoFo's intermediary layer creates anything direct lab grants would not. It also resolves the legitimacy question over time.\n\nIndependence from Axis 1 is good but not perfect. Scientific tractability depends largely on the phenomenon and on measurement, which money cannot simply buy. Conviction donors can fund without results: [evidence] IONS held $19.2M in assets in FY2025 despite a heterodox profile [the profile itself is a prior inference], and results will not exist until about 2028 anyway, while funding decisions start now. Good science also does not guarantee CoFo revenue, since funders can go straight to labs. Late in the horizon the coupling tightens, and I treat that as a limit on the 2x2, not a reason to merge the axes.", "runners_up_rejected": "Legitimacy and safety disputes (4x3=12) were folded in as a symptom and a trigger: a safety event is a shock that can occur in any quadrant, though it hurts most at the low pole. Neurotechnology (2x4=8) is an accelerator rather than a decider. Charitable tax changes (2x1=2) and metacrisis framing (1x2=2) are too weak to organize scenarios."}], "scenarios": [{"quadrant": "high_high", "name": "The Common Yardstick", "narrative": "[speculation] By late 2031, a researcher proposing a study of lasting change in the sense of self reaches for a standard battery that did not exist in 2026. It came out of the first cohort. Its 2028 results were mixed, but the shared instruments held up when labs outside the cohort reran them. That was the turn. Two institutional funders, neither named in 2026, joined after seeing audited statements and a public data repository. AI-era donors, who mostly went to AI safety and animal causes, gave a small slice here because CoFo could show them something checkable. The chair's share of revenue fell below half, and the public-support test passed with room to spare. CoFo now runs a third awakening round and a second Bodymind round. Fundamental Consciousness was narrowed to avoid duplicating Templeton World Charity's work. Critics remain. They say the measures still favor Buddhist-derived framing, and that a field standard cost more than it should have. CoFo is small by science-philanthropy standards, but universities now cite its instruments in federal applications.", "effect_on_org": {"revenue": "[speculation] $5M-$15M a year, with several funders and the chair below 50%. Clear of the public-support problem.", "programs": "[speculation] Multiple awakening rounds, an active Bodymind grant line, a narrowed Fundamental Consciousness, and a repository held under open terms.", "staff": "[speculation] Perhaps 15-25, with a dedicated data lead, a grants manager and finance staff. Founding leadership may have moved to a succession process.", "standing": "[speculation] A recognized field coordinator cited by peers, and a partner rather than a rival to Mind & Life and ISCR."}, "early_signals": ["A full grantee list and award total published by mid-2027.", "An audit or financial statements released, and a first 990 showing contributions beyond the chair.", "A named institutional funder by end-2027.", "A dated second-round RFP in 2027, consistent with the five-year plan.", "A cohort position paper or shared measurement protocol posted publicly by early 2028, ideally with non-cohort co-authors."], "readiness": {"score": 3, "rationale": "[inference] The design fits this scenario: cohort terms, a stated focus on standards and an on-schedule first round. The grant cycle ran close to plan. But there is no public audit, full board, data-custody plan or demonstrated capacity for growth, and the State of the Field report shows no public release."}, "donor_implication": "[inference] Early money buys the most influence here, but only if it is tied to public goods. A donor could fund standards work in tranches and could later scale up with evidence in hand. Unrestricted support becomes reasonable after audited statements and adoption data."}, {"quadrant": "high_low", "name": "Well-Funded Fog", "narrative": "[speculation] By late 2031, CoFo has never had more money or less agreement about what it has produced. The AI-wealth wave reached it in 2027 and 2028. New donors liked the ambition and the San Francisco network, and most gave through donor-advised funds. Revenue grew several times over. Three awakening rounds ran, Bodymind funded a large portfolio, and neurotechnology pilots drew headlines. But the first cohort's 2028 results did not converge. Labs kept their own instruments, most outcomes stayed self-report, and two prominent findings failed to replicate. Critics used the same pseudoscience language once aimed at integrated information theory. A published account of retreat participants harmed in a funded study made it worse. Journals and university departments grew cautious, and some senior scientists stopped listing the grants. Nothing forced a correction. Donors were often advised by the organization soliciting them, and the board stayed close to the founders. The public-support test passed easily, so the legal position is clean. The science is not. CoFo is solvent, busy and increasingly talking to itself.", "effect_on_org": {"revenue": "[speculation] $5M-$20M a year, broad enough to pass the support test, and sensitive to donor sentiment and AI-linked asset prices.", "programs": "[speculation] Many grants and events, program sprawl across all three areas, and few shared outputs. Progress is reported by activity counts.", "staff": "[speculation] Rapid hiring, with more donor-facing and communications staff than science capacity. Serious scientists may drift away.", "standing": "[speculation] Strong among donors, weak among mainstream scientists. Its reputation may spill over onto cohort members and the wider field."}, "early_signals": ["New donor money or events announced before any data-sharing output exists.", "New programs launched while the State of the Field report, roadmap or Bodymind RFP stays late.", "Reports citing applicant counts and grant dollars, not adoption or replication.", "No preregistration, negative-results or adverse-event policy for grantees.", "Named donor-advising activity growing without published conflict-of-interest rules."], "readiness": {"score": 1, "rationale": "[inference] I found no outside check that would catch this drift. There is no published conflict policy, reviewer list, independent evaluation or stated kill criterion, and only two board members are visible. Reporting so far centers on demand and activity. The human-reviewer process and preregistration prompts in the RFP are modest counterweights."}, "donor_implication": "[inference] This is the scenario where a gift does the most quiet harm. A donor should avoid unrestricted scale-up funding without outcome gates, should fund independent evaluation, and should refuse to rely on CoFo's own advice about giving to CoFo."}, {"quadrant": "low_high", "name": "The Orphaned Standard", "narrative": "[speculation] By late 2031, the instruments are in use and the organization that built them is barely there. The first cohort worked better than most people expected. A shared battery and a pooled dataset appeared in 2028 and 2029, and labs outside the cohort adopted them. Outside funders noticed, then funded the labs directly. Tiny Blue Dot, Templeton-linked programs and university donors could reach the scientists without paying for an intermediary. The better the public goods became, the less anyone needed CoFo. The AI-wealth wave largely passed by, going to AI safety, digital minds and animal causes. The chair kept funding a smaller budget and signaled in 2029 that the commitment had an end date. With one large donor above the 2% line, the public-support test became a real problem. The board chose a merger over becoming a private foundation. Stewardship of the measures moved to a professional society or university center, with Mind & Life or ISCR the obvious candidates. CoFo's name fades. Its scientific contribution outlasts it, which its mission could accept.", "effect_on_org": {"revenue": "[speculation] Flat or falling, about $1M-$2M a year and chair-dependent. Public support is below or near one-third approaching the test.", "programs": "[speculation] Awakening continues in reduced form until stewardship moves. Bodymind and Fundamental Consciousness stay small or close.", "staff": "[speculation] Shrinks to a handful. Scientific leaders move to universities or better-funded science philanthropy.", "standing": "[speculation] High among scientists and low among the public. CoFo is remembered for its output more than as an institution."}, "early_signals": ["Cohort outputs appear on schedule while no second major funder appears.", "Grantees win follow-on funding from Tiny Blue Dot, Templeton programs or universities without CoFo's involvement.", "Schedule A shows public support well short of one-third.", "A second round is delayed or smaller than $1.5M despite good cohort results.", "CoFo begins talks with ISCR, Mind & Life or a university about hosting shared assets."], "readiness": {"score": 2, "rationale": "[inference] Single-payment awards protect the science if CoFo shrinks, and the cohort design could yield transferable assets. But no public data-custody, open-licensing, succession or merger plan was found. The RFP states no open-data mandate, so assets may not transfer cleanly."}, "donor_implication": "[inference] Here a modest gift can have an outsized, lasting effect if it is used to secure public goods. A donor should fund openly licensed standards, a repository held outside CoFo, and a transfer plan rather than general operations. ISCR's negative net assets of $72,030 at end-2024 would need checking first."}, {"quadrant": "low_low", "name": "The Patron's Project", "narrative": "[speculation] By late 2031, CoFo still exists, in the sense that a small budget still moves through it. The 2026 cohort finished in 2028. Its members met as agreed and shared some data, but each lab published on its own terms, and no common measures took hold. Most reports arrived late. The second awakening round came in smaller than the first, and the Bodymind and Fundamental Consciousness programs shrank to reports and gatherings. Outside donors never arrived at scale. Federal money stayed tight, so letters of intent kept coming, but funded projects were few. Without a track record, CoFo could not win institutional funders, who kept giving to Tiny Blue Dot, Templeton programs and university centers directly. The chair remained the main source of money. As the public-support test approached, the board moved toward private-foundation status and stopped soliciting gifts. Several program staff left for better-funded science philanthropy. There was no scandal. There was also no field. Whether CoFo continues now turns on one funder's decision, and it could close quietly within a year.", "effect_on_org": {"revenue": "[speculation] Under about $2M a year, mostly from one source, and possibly zero after a decision by that source.", "programs": "[speculation] One small grant line or none. Reports and convenings replace new research funding.", "staff": "[speculation] Two to five people, possibly part-time, with some program lead posts vacant.", "standing": "[speculation] Little known outside a small circle. Grantees keep their results but no field infrastructure remains. Peers absorb small pieces."}, "early_signals": ["No dated second-round RFP by end-2027.", "The Bodymind RFP is still absent by mid-2027, more than a year after the March 2026 post.", "The first filed 990s show contributions from very few donors, or no growth year over year.", "Program lead departures with no replacement, or a move to part-time roles.", "Website milestones slip: 'Available Q3 2026' type labels remain with no output."], "readiness": {"score": 2, "rationale": "[inference] CoFo has little exposure to hold it up: single-payment grants, no sign of physical sites, and few long-term obligations visible. But no reserve policy, multi-year budget, succession plan or wind-down plan is published, and the Bodymind director was still asking for donor introductions in March 2026."}, "donor_implication": "[inference] This is the base case for donor planning. Large or unrestricted gifts risk displacing the chair's money, or sitting stranded. If a donor still wants exposure, the best forms are small project-level tranches or direct funding of unfunded finalists, with a written clause on the return or redirection of unspent money."}], "most_likely_quadrant": "low_low", "most_dangerous_quadrant": "high_low", "judgment": "Most likely today: low-low, \"The Patron's Project\". My rough, subjective odds are 40% low-low, 25% high-low, 20% low-high and 15% high-high. These are judgment calls, not calculations.\n\n[inference] Why low-low leads:\n- Capital: no outside funder is named anywhere, and staff were still seeking donor introductions in March 2026.\n- Science: creating a shared construct and getting labs outside the cohort to adopt it is hard in five years. Nothing has been tested yet.\n- Delivery: the State of the Field report shows no public release, and Bodymind has no RFP on record.\n\nThe strongest case against this call is that the first round did run close to schedule, and AI-era money could lift CoFo onto the high-capital row without any change in its science. That is why high-low is second. The 990 due around mid-November 2026, if CoFo uses a calendar year, could quickly change these odds.\n\nMost dangerous: high-low, \"Well-Funded Fog\". [inference] Closure risk is highest in low-low, but that damage is bounded. Grants are paid in a single disbursement, and other funders can absorb pieces. High-low is worse because money removes the signal that something is wrong. It could produce a large, confident program on contested measures, weak conflict controls and possibly a participant-safety problem. That could harm cohort scientists and the field's credibility as well as CoFo, and it would be hard to reverse.\n\nBottom line for the donor: on today's evidence, do not underwrite a high-capital future. Fund the part that holds value across quadrants, and make further money depend on evidence.\n\nLimits: every scenario rests on an unseen revenue mix. I have no budget, 990, audit or funder list. If the chair's commitment is in fact multi-year and contractual, low-low becomes more stable but no less scientifically uncertain. If it is small, the risk of closure is much higher than this analysis implies.", "robust_moves": [{"move": "Ask for a disclosure package before any gift, and offer to fund the first independent audit. It should contain: the determination letter, 990 and Schedule A, board-approved 2027 budget, revenue by funder band, the full board list with independence noted, conflict and reviewer-recusal policies, and counsel's public-support projection through 2031.", "why_robust": "[inference] Every scenario turns on facts now hidden. In high-high an audit unlocks institutional funders. In high-low it adds an outside check. In low-high it shows the public-support problem early. In low-low it reveals the fragility before money is committed. It costs little, and refusal is itself informative."}, {"move": "Fund shared field assets in tranches, held so they outlive CoFo: common measures, preregistered protocols, a pooled data repository with an independent custodian such as a university or professional society, open licensing, and required reporting of null results and adverse events. Release later tranches when specific outputs are public, and pay for an independent evaluation at about 2028.", "why_robust": "[inference] This directly tests Axis 2 and pays off whatever happens to Axis 1. It accelerates high-high, exposes and restrains high-low, secures the legacy in low-high, and in low-low leaves something usable after closure. It also addresses the gap that cohort sharing is not an open-data mandate."}, {"move": "Make any gift additive and continuity-protected through a written agreement. It should include the chair's or board's stated funding floor for 2027-2029, confirmation of what changes because of the gift, a match or challenge component for new outside donors, the exact legal donee, and terms for redirecting unspent restricted money in case of a wind-down, a merger or private-foundation status.", "why_robust": "[inference] It resolves the displacement risk in every quadrant. It pushes toward a broader base, which helps the public-support test, and it protects restricted money if the chair's commitment changes or leaves. In high-capital scenarios it is a low-cost discipline, and in low-capital scenarios it is what preserves the gift."}], "gaps": ["CoFo's revenue, expenses, reserves, budget, runway and funder mix: no evidence found. All scenario revenue ranges are illustrative and have no baseline.", "Size, term and legal form of the chair's commitment: no evidence found beyond a search-result summary of the July 2025 X post, which could not be fetched.", "The grantee post, 'Toward a Science of Awakening: Our First Grantees' (22 July, year not shown): it appears in the Substack archive, but its text was not retrieved. A targeted search found no awardee list. No funded total was confirmed, and no second round is announced on the pages checked. The five-year plan is named in the March 2026 post, but I found no published content or budget for it.", "Final FY2026 NCCIH figure and whether the FY2027 request eliminates the center: not confirmed. The NIH table and CRS FY2027 status page returned HTTP 403, and the snippet of the NIH table was garbled. No final FY2027 Labor-HHS outcome was found. NIH success rates vary across secondary sources, so I used CRS.", "Public-support mechanics for CoFo: its specific 509(a) classification and determination letter were not seen. The IRS page reviewed does not address the five-year new-organization rule or the 2% limit, so these rest on practitioner sources that differ on timing. Treatment of gifts via donor-advised funds should be checked with counsel.", "Share of AI-era philanthropy that could reach consciousness science: no evidence found. The headline forecasts are from search summaries, conflict with one another and depend on IPOs. Longview's own RFP returned HTTP 404, so grant size and deadline rest on aggregators and forum listings, and its total budget is unknown.", "Independent scientific assessment of awakening measures or of CoFo's selection process: no evidence found. A search for critiques of awakening or 'persistent non-symbolic' research returned general adverse-effect literature only. Measurability is therefore assessed from CoFo's own analysis.", "CoFo's safety-monitoring or adverse-event rules for grantees: not found in the March post. The RFP was not specifically checked for them, so this is a question for CoFo, not a finding of absence.", "Competing intent by Tiny Blue Dot, Templeton World Charity or John Templeton Foundation to enter awakening science: no evidence found. Faggin Foundation and Mind Science Foundation surfaced in searches and were not evaluated.", "Independence of the two axes is a judgment, not a measurement. Late in the horizon, scientific results and funding are likely to interact. The quadrant odds are analyst estimates with no statistical basis."]}, "assessment": {"bottom_line": "The Consciousness Foundation is about 15 months past its public launch. It is a small grantmaker for awakening science, probably funded mainly by its chair, and it has run one real grant round but has no published financials, research results or conflict controls. The likeliest failure is that it stays dependent on one patron while 14 grants become 14 separate studies, not the shared measures that justify paying an intermediary. A gift is good for a small or staged, restricted bet on public shared measures and data, after seeing documents; it is not yet good for large unrestricted, long-pledge or endowment money.", "health_score": {"score": 37, "grade": "D+ (provisional: this grades evidenced health today, not predicted quality; most of the shortfall is missing evidence, not known bad facts)", "components": [{"name": "Financial resilience", "score": 35, "weight": 25, "rationale": "Each component is scored 0-100, then weighted: 8.75 + 6 + 4 + 9 + 5.5 + 4 = 37.25. [evidence] No revenue, expense, asset, reserve or runway figure exists: ProPublica shows no 990 data as of 30 October 2026, and no audit or budget was found. [evidence] The only scale figure is a stated $1.5M in 2026 project grants. [evidence, search-result summary only] The chair reportedly committed substantial time and capital; amount and term are unknown. [inference] Above a floor score because 14 awards were named and two grantees confirm awards, which implies some real money. The RFP's single-payment design also limits long-tail grant liabilities. Below the midpoint because funding probably rests on few sources and no outside funder is named."}, {"name": "Governance and transparency", "score": 30, "weight": 20, "rationale": "[evidence] Only two board members can be identified (Strong, Langer), and Candid records none. No conflict, whistleblower or compensation policy is published. I re-read the RFP on 30 October 2026: conflicts of interest are not addressed, reviewers are not named, and IP is not addressed. [evidence] The executive director is also founder of Holon, per CoFo's own bio. No published rule explains how that overlap is managed. Credit: CoFo published the funnel (128, 54, 52, 24, 14), the full project list and the fact that it did not simply fund the top 14 scores. [inference] The missing 990 is probably timing and is not penalized as non-filing. The unpublished board, funders and grant dollars are choices and are penalized."}, {"name": "Change delivered and evidenced", "score": 20, "weight": 20, "rationale": "[evidence] The ledger's top outcomes are significance 2 of unknown scale: 14 projects funded and a data-sharing condition. All five are rated too early on durability. No finding, adopted measure, shared dataset or field-practice change exists, and none could yet, since projects were due to start in September 2026. [evidence] About $100,000 of the stated $1.5M traces to a grantee, and that from search text only. Payment is unverified. Most of the record is CoFo's own word; UVA and Melbourne are the exceptions. [inference] Credit for lead contribution on the call and the sharing condition, and a partial discount for unknown additionality. Trend cannot be assessed. Applicant counts earned no points."}, {"name": "Strategic position in the field", "score": 60, "weight": 15, "rationale": "[evidence] No other awakening-specific call was found, though the search was not exhaustive. The $100,000 ticket sits between Mind & Life's $25,000 and Tiny Blue Dot's $900,000. UVA describes the cohort as a departure from hub-and-spoke funding. Grantees include researchers at Oxford, UCL, McGill and MGH/Harvard. [inference] Against that, the niche is one RFP deep and a larger funder could copy it. Tiny Blue Dot disbursed $8.6M in FY2024, against CoFo's stated $1.5M. Fundamental Consciousness overlaps Templeton World Charity's work, and coordination overlaps ISCR and Mind & Life."}, {"name": "Culture and leadership", "score": 55, "weight": 10, "rationale": "[evidence] Positive signs: public self-critique on Buddhist skew, a program director warning of 'strong incentives to hype' and asking for independent replication, and no hostility to scrutiny found. [evidence] Negative signs: civilizational rhetoric ('steering the future of civilization') before any results, overdue publications left unexplained, and disclosure that is open about the field but closed about money. [inference] Dense role overlaps have no published management. The sample is small and no CoFo-era long-form statement by the chair or executive director was found."}, {"name": "Readiness for the futures in the scenarios", "score": 40, "weight": 10, "rationale": "[inference] The scenario section rates readiness 3, 1, 2 and 2 out of 5, an average of 2 (40%). Single-payment grants protect the science if CoFo shrinks. No reserve policy, data-custody plan, succession plan, public-support plan or independent check was found. The weakest fit is the most dangerous quadrant, Well-Funded Fog, where nothing visible would catch drift."}]}, "premortem": [{"rank": 1, "failure_mode": "Fourteen studies, no yardstick: the intermediary layer produces nothing direct grants would not have produced", "mechanism": "1) Grants capped at $100,000 fund add-ons to labs with other money. 2) Sharing is required only among awardees, and the RFP asks for open-data plans but mandates none. 3) With no staff owner for a standard, and the field reports already slipping, the labs keep their own instruments and self-report measures. 4) 2028 results appear as separate papers. 5) By 2031 no lab outside the cohort uses a CoFo-linked measure. 6) Donors find they paid for coordination and bought ordinary meditation studies, with no one able to show otherwise because no success metric was set.", "probability": 0.6, "horizon": "Visible by 2028-29; settled by 2031", "evidence_chain": [{"fact": "CoFo's analysis of 128 LOIs found heavy reliance on self-report, 36 proposals for new instruments, and no common definitions, standards or repositories. It calls coordination the highest-leverage next move.", "source": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "basis": "evidence"}, {"fact": "The RFP requests planned repositories and preregistration or registered reports, but states no mandate for public open data. Sharing obligations run within the cohort.", "source": "https://www.cofo.org/rfp", "basis": "evidence"}, {"fact": "The State of the Field report, labelled Q3 2026, had no public link on 30 October 2026. The analysis promised 'in the coming weeks' on 22 July was absent from the archive about 14 weeks later. Newsletter delivery was not tested.", "source": "https://cofo.org/insights", "basis": "evidence"}, {"fact": "Melbourne's centre began with a $10M gift, and other grantee researchers have acknowledged European Research Council support, so CoFo's money may be marginal to some projects.", "source": "https://www.unimelb.edu.au/newsroom/news/2021/march/university-welcomes-$10-million-gift-for-contemplative-studies-centre", "basis": "inference"}, {"fact": "CoFo publishes no organization-level success measure. A five-year plan is referred to, but none was found.", "source": "https://cofo.org/approach", "basis": "evidence"}, {"fact": "The 60% matches the scenario odds for the low-science row (40% + 25%). Those odds are analyst judgment, with no statistical basis.", "source": null, "basis": "inference"}], "warning_signs": ["No public shared protocol or measurement battery by early 2028", "No coauthor from outside the cohort on any position paper or roadmap", "Reports cite meetings, papers and applicant counts rather than use by outside labs", "The first cohort's quarterly meetings are not documented", "Grant agreements turn out to lack data-sharing terms a funder could enforce"]}, {"rank": 2, "failure_mode": "The Patron's Project: one funder's decision sets the budget, then the public charity status and survival", "mechanism": "1) The chair's capital funds most of the budget. 2) Outside donors do not arrive at scale, because there is no audit, named institutional funder or results before 2028. 3) A second round is delayed or smaller than $1.5M, and Bodymind stays without an RFP. 4) Program leads, each the single owner of a program, leave for better-funded science philanthropy. 5) As the public support test nears around 2030-31, one donor's gifts count only up to 2% of total support, so CoFo must convert to a private foundation, merge or wind down. 6) Outside gifts made in the interim turn out to have displaced the chair's money rather than added to it.", "probability": 0.35, "horizon": "Early signs by end-2027; status crunch 2030-31", "evidence_chain": [{"fact": "A search-result summary of the chair's July 2025 X post says substantial time and capital are being committed. The post could not be fetched, and no amount or term is known.", "source": "https://x.com/winslow_strong/status/1948483311522709759", "basis": "evidence"}, {"fact": "CoFo names no donor. The Bodymind director asked readers in March 2026 to connect CoFo with philanthropists.", "source": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "basis": "evidence"}, {"fact": "A charity generally needs more than one-third public support over five years, and one donor's gifts count only up to 2% of total support. Practitioner sources differ on the start-up mechanics, and CoFo's classification was not seen.", "source": "https://www.smith-howard.com/an-overview-of-the-501c3-public-support-test-for-nonprofits/", "basis": "evidence"}, {"fact": "Illustration from the scenario section: $10M of support over five years needs about $3.33M of public support, or at least 17 donors at the $200,000 cap, or the equivalent from qualifying public charities.", "source": null, "basis": "inference"}, {"fact": "Bodymind's first RFP was in preparation in March 2026. By August 2026 its director wrote only that CoFo is 'actively seeking to support studies' in one area, and no RFP was found.", "source": "https://jameswphillips.substack.com/p/bodymind-3-can-voluntary-attention", "basis": "evidence"}, {"fact": "No second awakening round is announced on the pages checked. The site lists seven people, and each program appears to rest on one named lead.", "source": "https://cofo.org/about", "basis": "evidence"}], "warning_signs": ["No dated second-round RFP by end-2027", "The chair declines to state a funding floor for 2027-29", "Schedule A shows public support far under one-third with no plan", "Bodymind RFP still absent by mid-2027", "A program lead leaves without replacement"]}, {"rank": 3, "failure_mode": "Well-Funded Fog: AI-era money arrives before evidence, and CoFo scales on activity counts", "mechanism": "1) New technology wealth reaches CoFo through its San Francisco network, mostly through donor-advised funds. 2) Because CoFo advises donors and also solicits them, there is no outside check on the claims. 3) All three programs and neurotechnology pilots expand while staff shift toward donors. 4) Cohort findings do not converge, and two prominent ones fail to replicate. 5) Critics apply the pseudoscience label already used against integrated information theory. 6) Senior scientists stop listing the grants. CoFo stays solvent, but donors are embarrassed and the field's credibility is damaged.", "probability": 0.25, "horizon": "2027-2031", "evidence_chain": [{"fact": "Forecasts in 2026 put AI-era philanthropy at about $30B-$40B a year. The forecasts conflict, depend on IPOs and do not name consciousness science as a recipient.", "source": "https://www.adn.com/nation-world/2026/10/22/the-biggest-wealth-giveaway-in-modern-history-aims-to-transform-the-world/", "basis": "evidence"}, {"fact": "The approach page offers bespoke donor advising and impact reports. No client count or sample report was found, and CoFo also solicits gifts.", "source": "https://cofo.org/approach", "basis": "evidence"}, {"fact": "Stated stakes include 'steering the future of civilization', before any funded result exists.", "source": "https://cofo.org/fundamental-consciousness", "basis": "evidence"}, {"fact": "124 scholars called integrated information theory pseudoscience and others contested the label, so this field has a live legitimacy dispute that Fundamental Consciousness sits inside.", "source": "https://theconversation.com/nobody-knows-how-consciousness-works-but-top-researchers-are-fighting-over-which-theories-are-really-science-214074", "basis": "evidence"}, {"fact": "No independent evaluation, kill criterion or reviewer list was found, and only two board members are visible.", "source": "https://cofo.org/about", "basis": "evidence"}], "warning_signs": ["New programs or events announced while the State of the Field report, roadmap or Bodymind RFP remains late", "Revenue jumps with no audit", "Annual reports lead with grant dollars and applicant counts", "Advising grows with no published conflict rules", "No independent portfolio review by 2028"]}, {"rank": 4, "failure_mode": "The overlap story: a first filing or a reporter links charitable research direction to leaders' commercial or affiliated interests", "mechanism": "1) The executive director founded a UK healthcare startup, and a job listing suggests leading both with a shared chief of staff. 2) Bodymind then funds healing and chronic-condition research close to that business, while other leaders hold venture, advisory or sister-nonprofit roles. 3) With no published conflict policy or IP terms, a grant, shared-cost allocation or advised-donor referral touches a connected party. 4) Schedule L, a grantee or a journalist surfaces it. 5) Even with no wrongdoing, CoFo cannot show a recusal record. 6) Donors and institutional funders pause, and the small-field trust the model depends on erodes. No such transaction was found. This story is a process risk and not an allegation.", "probability": 0.2, "horizon": "First exposure from late 2026; most likely after Bodymind grants begin", "evidence_chain": [{"fact": "CoFo's bio lists Fields as Executive Director and says Fields 'is also the founder of Holon, a holistic healthcare startup in the United Kingdom'. Current time split and role at Holon are not stated.", "source": "https://cofo.org/team/joshua-fields", "basis": "evidence"}, {"fact": "A job listing, seen only in search snippets of mirrors (the page returned 404), describes a chief of staff employed by Holon and split 50/50 between Holon and CoFo. A targeted search on 30 October 2026 did not corroborate it.", "source": "https://www.idealist.org/es/ong-empleo/c8495f83dddd44ef8f853f7e81ad3bf4-chief-of-staff-the-consciousness-foundation-london", "basis": "evidence"}, {"fact": "Bodymind's page covers healing, chronic conditions and tools for influencing these processes.", "source": "https://cofo.org/bodymind", "basis": "evidence"}, {"fact": "The RFP does not address conflicts of interest, IP or commercialization, and does not name reviewers.", "source": "https://www.cofo.org/rfp", "basis": "evidence"}, {"fact": "Show notes record the Chief Scientific Officer's outside advisory role with Jhourney, and one funded project studies jhana. No link between them is shown.", "source": "https://themetagame.substack.com/p/52-kathryn-devaney-the-neuroscience", "basis": "evidence"}, {"fact": "Langer sits on the boards of CoFo, Qualia Research Institute and Co-sentience Initiative, and is linked to Lionheart Ventures and Amphibian Capital. No CoFo money to these bodies was found.", "source": "https://cofo.org/team/david-langer", "basis": "evidence"}, {"fact": "The final 14 were chosen from 24 for portfolio fit, and the person or body making that choice is unnamed.", "source": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "basis": "evidence"}], "warning_signs": ["CoFo declines to share its conflict policy or recusal record", "Schedule L lists any transaction, or Holon and CoFo share costs without a written allocation", "A Bodymind RFP appears with no commercial-interest rule", "Grants or advised gifts reach Qualia Research Institute, Co-sentience or leader-linked firms", "The executive director's CoFo time commitment is not stated"]}, {"rank": 5, "failure_mode": "A harm event in a funded study meets a program with no adverse-event standard", "mechanism": "1) Funded work includes intensive practice and at least one 5-MeO-DMT study in expert meditators. 2) CoFo's working definition identifies awakening partly by reduced suffering and greater wellbeing, so bad outcomes risk being classed as something else. 3) IRBs cover local protocols, but no cohort-level tracking of adverse events exists. 4) A participant is harmed, or an analysis shows harms went unreported across the cohort. 5) Press treats a funder that wants awakening 'safely accessible to all' as having ignored the risk. 6) Universities and scientists distance themselves.", "probability": 0.1, "horizon": "2027-2031", "evidence_chain": [{"fact": "Re-read on 30 October 2026: the RFP has one safety phrase ('made safely accessible to all') and does not address adverse events, harm or participant risk. It does require IRB or ethics approvals as a compliance item.", "source": "https://www.cofo.org/rfp", "basis": "evidence"}, {"fact": "One funded project tests 5-MeO-DMT in expert meditators.", "source": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "basis": "evidence"}, {"fact": "A 2026 JMIR paper reports disagreement on whether adverse meditation experiences are real harm or mainly ordinary distress.", "source": "https://mental.jmir.org/2026/1/e90602/PDF", "basis": "evidence"}, {"fact": "A 2025 study links side-effect reports to recent mental health symptoms and says open-ended questions undercount them.", "source": "https://www.eurekalert.org/news-releases/1095263", "basis": "evidence"}, {"fact": "CoFo's definition partly identifies awakening by beneficial outcomes.", "source": "https://cofo.org/awakening", "basis": "inference"}], "warning_signs": ["Roadmap or cohort standards omit adverse-event reporting", "Grant reports omit participant harms and withdrawals", "CoFo cannot say which grantees track adverse events", "A published safety criticism gets no public response"]}], "gift_risk": [{"gift_type": "small_unrestricted", "risk": "low", "rationale": "[inference] Little is at stake. Small gifts also count fully toward public support, unlike the excess of a large donor's gift over the 2% cap, so they help slightly on CoFo's most concrete legal exposure. The real risk is that the gift changes nothing visible. Use this size if the donor wants to follow the organization, not as a bet on results.", "risk_reducers": ["Search by EIN 33-4334115 and get a receipt in the legal name", "Subscribe to the newsletter and test whether promised reports arrive", "Treat stock or crypto gifts via Every.org separately: its legal-donee terms were not read"]}, {"gift_type": "major_unrestricted", "risk": "high", "rationale": "[inference] No budget, reserves, overhead rate, funder mix, full board or conflict policy is visible, so the donor cannot see what the money would do. [speculation] It may simply displace the chair's capital. The non-grant pillars (donor advising, CoFlow) have no visible output, and a large sum is the fuel for the Well-Funded Fog scenario. Decision: do not make this gift today.", "risk_reducers": ["First 990 plus 2025-26 financial statements, and an audit engaged", "Board-approved 2027 budget and revenue by funder band", "Written funding floor from the chair or board for 2027-29", "Full board list with independent majority, and published conflict and recusal policies", "Revisit only after the first cohort's public outputs (about 2028)"]}, {"gift_type": "major_restricted", "risk": "elevated", "rationale": "[inference] This is the best large form, and CoFo's donate page accepts program direction by memo or email. It remains elevated because restriction does not prevent displacement, the program team is thin, and the Q3 report and analysis are late. It falls to moderate with the conditions listed. Decision: start at about $115,000 (one project at the RFP ceiling, including overhead) up to a few hundred thousand dollars for shared measures and a public repository. The landscape section's $1.5M is an outer limit that needs the budget and funder breakdown first, and it should not be the opening size.", "risk_reducers": ["Staged payments released on public outputs: protocol, battery, repository", "Data held by an independent custodian under open licensing", "Adverse-event and null-result reporting written into the standard", "Evidence that the gift adds to the budget, plus a match for new outside donors", "Clause redirecting unspent money on wind-down, merger or private-foundation status", "Paid independent evaluation around 2028", "Named owner for the deliverable with a stated time commitment"]}, {"gift_type": "multi_year_pledge" d against 14 awards capped at $100,000 direct cost plus up to 15% overhead", "benign": "[inference] 14 awards at the cap come to $1.4M direct and $1.61M with overhead, so $1.5M sits in the range. The culture section's reading of a $100,000 shortfall disappears once overhead is included.", "worrying": "[speculation] $1.5M is a rounded plan and not an amount committed. Less was actually paid, or the total includes non-grant costs presented as grants.", "evidence_supports": "The benign arithmetic is plausible, but no payment is verified. Only Melbourne's USD 100,000 is traced, from search text, and whether it includes overhead is unknown.", "settling_question": "Please share the grant ledger: awardee, direct amount, overhead, agreement date and payment date."}], "advisor_questions": [{"question": "Is anyone already doing this, and better?", "status": "partial", "answer": "Not this exact thing, as far as found. No other awakening-specific call was found, but the search was not exhaustive. Parts are done elsewhere at greater scale: Tiny Blue Dot funds perception and some meditation work with $8.6M disbursed in FY2024; Templeton World Charity funds consciousness and spiritual-practice research; Mind & Life has the longer record in contemplative science; ISCR has the society role. 'Better' cannot be judged because no peer outcome comparison exists and CoFo has no results.", "basis": "inference", "confidence": 0.6, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/464924931", "title": "ProPublica: Tiny Blue Dot"}, {"url": "https://www.templetonworldcharity.org/our-priorities", "title": "TWCF: Our Priorities"}, {"url": "https://www.mindandlife.org/grants/current-research-grants/", "title": "Mind & Life: Current Research Grants"}, {"url": "https://www.cofo.org/rfp", "title": "CoFo RFP"}]}, {"question": "What is the counterfactual if this organization disappeared, and if this gift does not arrive?", "status": "partial", "answer": "If CoFo disappeare <script>
(function(){
const D = DATA || {};
const I = D.identity, F = D.financials, S = D.scan, RS = D.results, L = D.landscape, C = D.culture, X = D.scenarios, A = D.assessment, AB = D.assessment_before, SUP = D.supplied, M = D.manifest || {};
const PRODUCT = D.product || {name:'Dossier'}, INTERNAL = !!D.internal, SAMPLE = !!D.sample, NAV = D.nav || {};
const grade = g => (String(g||'').match(/^[A-F][+-]?/)||[String(g||'')])[0];
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const num = (n,d=1) => n==null ? '—' : (+n).toFixed(d).replace(/\.0$/,'');
const pct = n => n==null ? '—' : num(n)+'%';
const conf = c => c==null ? '' : `<span class="conf">conf ${Math.round(c*100)}%</span>`;
const badge = (t,cls) => `<span class="b ${cls||''}">${esc(t)}</span>`;
const srcs = list => (list&&list.length) ? `<div class="src">${list.map(s => { const u=String(s.url||s); return /^supplied:\/\//i.test(u) ? `<span class="b" title="${esc(u)}">supplied: ${esc(s.title||u.replace(/^supplied:\/\//i,''))}</span>` : `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(s.title||u)}</a>`; }).join(' · ')}</div>` : '';
const words = s => esc(s).replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>');
const prose = s => s ? `<div class="prose"><p>${words(s)}</p></div>` : '';
const redact = (txt, basis) => basis==='speculation' ? `<span class="redact" tabindex="0" title="Speculation. Click to read.">${esc(txt)}</span>` : esc(txt);
function claim(c, title){

const empty = (what) => `<div class="empty"><b>${esc(what)} was not produced.</b> Re-run the phase with <code>python3 dossier.py "…" --phases …</code> and render again.</div>`;

/* cover */
(function(){

/* ratios */
(function(){
  const R = F&&F.primary&&F.primary.ratios;
  if(!R||!R.available){ section('ratios','Ratios',`<h1>Ratios</h1>`+(R?`<div class="empty"><b>No ratios.</b> ${esc(R.reason||'')}</div>`:empty('The financial extract'))); return; }
  let h = `<h1>The weird ratios</h1><p class="sub">Arithmetic on filed numbers, thresholds scaled to the ${esc(R.size_band)} band. Flags prompt questions; they do not settle them.</p>`;
  const anomalies = {}; (A&&A.ratio_anomalies||[]).forEach(a=>anomalies[a.key]=a);
  const order = Object.values(R.ratios).sort((a,b)=>({red:0,amber:1,green:2,na:3}[a.flag]-{red:0,amber:1,green:2,na:3}[b.flag]));
  h += `<div class="ratios">`+order.map(r=>{
    const an = anomalies[r.key];
    return `<div class="ratio ${r.flag}"><div class="l"><span class="light ${r.flag}"></span>${esc(r.label)}</div><div class="v">${r.value==null?'—':num(r.value,2).replace(/\.?0+$/,'')}<small>${esc(r.unit)}</small></div><div class="f">${esc(r.formula)} · ${esc(r.year)}</div>${r.note?`<div class="why muted">${esc(r.note)}</div>`:''}${(R.flags.find(f=>f.key===r.key)||{}).why?`<div class="why">${esc(R.flags.find(f=>f.key===r.key).why)}</div>`:''}${an?`<div class="why"><b>Benign:</b> ${esc(an.benign)}<br><b>Worrying:</b> ${esc(an.worrying)}<br><b>Evidence supports:</b> ${esc(an.evidence_supports)}<br><b>Ask:</b> ${esc(an.settling_question)}</div>`:''}</div>`;
  }).join('')+`</div>`;
  const P = F.peer_comparison;
  if(P&&P.rows&&P.rows.length){
    h += `<h2>Against ${P.peer_count} peers</h2><p class="small muted">Peers were named by the landscape agent; their numbers come from the same Form 990 source. The band is the peer range, the tick the peer median, the dot this organization.</p><table><tr><th>Ratio</th><th class="num">This org</th><th class="num">Peer median</th><th>Range</th><th class="num">Percentile</th></tr>`;
    h += P.rows.map(r=>{const lo=Math.min(r.peer_min,r.subject==null?r.peer_min:r.subject), hi=Math.max(r.peer_max,r.subject==null?r.peer_max:r.subject), sp=(hi-lo)||1, x=v=>((v-lo)/sp*100).toFixed(1)+'%';
      return `<tr><td class="wrap">${esc(r.label)}</td><td class="num">${num(r.subject,2)}</td><td class="num">${num(r.peer_median,2)}</td><td style="min-width:180px"><div class="range"><div class="tr"></div><div class="band" style="left:${x(r.peer_min)};width:${((r.peer_max-r.peer_min)/sp*100).toFixed(1)}%"></div><div class="med" style="left:${x(r.peer_median)}"></div>${r.subject==null?'':`<div class="me" style="left:${x(r.subject)}" title="this organization"></div>`}</div></td><td class="num">${r.percentile==null?'—':r.percentile+'th'}</td></tr>`;}).join('')+`</table>`;
    h += `<table><tr><th>Peer</th><th>Relationship</th><th>FY</th><th class="num">Expenses</th><th>Highest paid</th><th class="num">Total pay</th></tr>${(P.peers||[]).map(p=>`<tr><td class="wrap">${esc(p.name)}</td><td class="small">${esc(p.relationship||'')}</td><td>${p.latest_year||'—'}</td><td class="num">${money(p.expenses)}</td><td class="wrap small">${esc(p.top_paid_name||'—')}</td><td class="num">${money(p.top_paid_total)}</td></tr>`).join('')}</table>`;
  } else h += `<p class="small muted">No peer comparison available (peers without EINs, or the landscape step has not run).</p>`;
  h += `<p class="small muted">${esc(R.method_note)}</p>`;
  section('ratios','Ratios',h);
})();
