<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dossier</title>
<style>
/* ===== Noah's Weblog house style (exhibits) v2 =====
   Matches noahmaier.net: white page, Times for reading, Verdana for
   controls, blue underlined links, two-tone rules, gray beveled buttons. */
:root {
  --page: #ffffff;
  --ink: #000000;
  --ink-soft: #2b2b2b;
  --link: #0000ee;
  --visited: #551a8b;
  --active: #ff0000;
  --lo: #999999;          /* rule, border, axis */
  --hi: #e2e2e2;          /* rule highlight, gridline */
  --tint: #f2f2f2;        /* callout and table-header fill */
  --field: #6e6e6e;       /* input border */
  --btn: #c0c0c0;         /* button face */
  --btn-face: #dfdfdf;
  --btn-lo: #808080;
  --btn-dark: #0a0a0a;
  --new: #cc0000;
  /* data colors, in order: classic HTML named colors */
  --c1: #000080;  /* navy */
  --c2: #800000;  /* maroon */
  --c3: #008080;  /* teal */
  --c4: #808000;  /* olive (marks only; too light for text) */
  --c5: #800080;  /* purple */
  --c6: #008000;  /* green */
  --serif: "Times New Roman", Times, serif;
  --sans: Verdana, Geneva, Tahoma, sans-serif;
  --mono: "Courier New", Courier, monospace;
  --measure: 42.75rem;    /* one column width (684px): text, boxes, questions, tables, figures */
}
* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; padding: 10px 16px 32px; background: var(--page); color: var(--ink);
       font: 18px/1.45 var(--serif); -webkit-text-size-adjust: 100%; }
.page { max-width: 1020px; }
/* Text, boxes, questions, tables and figures share one column width, so their left and
   right edges line up. Add class="wide" only to something that genuinely needs more room. */
main p, main ul, main ol, main dl, main blockquote, main table, main fieldset, main figure,
main details, main .box, main h2, main h3, main .view > *, .prose { max-width: var(--measure); }
.wide { max-width: none !important; }
a { color: var(--link); } a:visited { color: var(--visited); } a:active { color: var(--active); }
:focus-visible { outline: 2px dotted var(--ink); outline-offset: 2px; }

h1 { font-size: 2.3em; line-height: 1.1; margin: 0.35em 0 0.15em; }
h2 { font-size: 1em; font-weight: bold; margin: 1.6em 0 0.7em; padding-bottom: 2px;
     border-bottom: 1px solid var(--lo); }
h3 { font-size: 1.15em; line-height: 1.25; margin: 1.2em 0 0.3em; }
p { margin: 0 0 0.8em; }
.dek { font-style: italic; margin: 0 0 0.5em; }
.nav { font: 13px/1.6 var(--sans); margin: 0; }
hr { border: 0; border-top: 1px solid var(--lo); border-bottom: 1px solid var(--hi);
     height: 0; margin: 10px 0 14px; }
code, pre, kbd { font-family: var(--mono); font-size: 0.9em; }

/* controls and small text use Verdana */
label, legend, button, input, select, textarea, table, figcaption, output, .ui, .meta {
  font-family: var(--sans); }
.ui, .meta, figcaption { font-size: 13px; line-height: 1.5; }
.meta { color: var(--ink-soft); }
p.meta { margin: 6px 0 12px; }

fieldset { border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi);
           margin: 0 0 16px; padding: 10px 12px 12px; min-width: 0; }
/* The legend sits inside the box as its first line, so long legends wrap cleanly
   instead of breaking through the border. */
legend { float: left; width: 100%; padding: 0; margin: 0 0 8px; font-size: 13px; font-weight: bold; }
legend + * { clear: both; }
label { font-size: 13px; }
.choices { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.choices label { display: inline-flex; align-items: center; gap: 5px; }
input[type=radio], input[type=checkbox], input[type=range] { accent-color: var(--c1); }

button {
  font-size: 13px; line-height: 1.2; color: #000; background: var(--btn);
  border: 0; border-radius: 0; padding: 6px 12px; cursor: pointer;
  box-shadow: inset -1px -1px var(--btn-dark), inset 1px 1px #fff,
              inset -2px -2px var(--btn-lo), inset 2px 2px var(--btn-face);
}
button:active, button[aria-pressed="true"] {
  box-shadow: inset 1px 1px var(--btn-dark), inset -1px -1px #fff,
              inset 2px 2px var(--btn-lo), inset -2px -2px var(--btn-face);
  padding: 7px 11px 5px 13px;
}
button:disabled { color: var(--btn-lo); text-shadow: 1px 1px #fff; cursor: default; }
button.primary { font-weight: bold; }

input[type=text], input[type=number], input[type=search], input[type=email],
select, textarea {
  font-size: 14px; color: var(--ink); background: #fff; border: 1px solid var(--field);
  border-radius: 0; box-shadow: inset 1px 1px 0 #b4b4b4; padding: 4px 6px;
}

table { border-collapse: collapse; font-size: 13px; line-height: 1.4; }
main table { width: 100%; }
th, td { border: 1px solid var(--lo); padding: 4px 8px; text-align: left; vertical-align: top; }
th { background: var(--tint); }

.box { background: var(--tint); box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi);
       padding: 8px 10px; margin: 0 0 1em; font: 13px/1.5 var(--sans); }
.result { font-size: 1.15em; }
.result strong { font-variant-numeric: tabular-nums; }

.meter { height: 16px; background: #fff; border: 1px solid var(--field);
         box-shadow: inset 1px 1px 0 #b4b4b4; }
.meter > div { height: 100%; width: 0; background: var(--c1); }

footer address { font-style: normal; font-size: 0.85em; }

@media (max-width: 780px) { body { font-size: 17px; padding: 8px 16px 28px; } h1 { font-size: 1.8em; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media print { .nav { display: none; } }

/* ===== Dossier: page-specific rules, house variables only ===== */
.shell { display: grid; grid-template-columns: minmax(0, 1fr) 256px; gap: 32px; align-items: start; }
.shell > main { min-width: 0; }
.menu { position: sticky; top: 10px; }
.menu fieldset { margin: 0 0 12px; }
.menu ol { margin: 0; padding-left: 22px; font: 13px/1.7 var(--sans); }
.menu ol a[aria-current="true"] { color: var(--ink); font-weight: bold; text-decoration: none; }
.menu .n { color: var(--ink-soft); font-size: 11px; margin-left: 6px; }
.menu .meta { margin: 8px 0 0; font-size: 11px; }
.filter .opts label { display: block; margin: 2px 0; }
section.page { display: none; }
section.page.active { display: block; }
.notice { font: 13px/1.5 var(--sans); background: var(--tint); box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); padding: 8px 10px; margin: 0 0 14px; max-width: none; }
.notice strong { font-weight: bold; }
h1 { font-size: 2.1em; }
.sub { font: 13px/1.5 var(--sans); color: var(--ink-soft); margin: 0 0 14px; }
.lede { font-size: 1.15em; line-height: 1.4; margin: 10px 0 14px; }
.prose p { margin: 0 0 0.8em; }
.pre { white-space: pre-wrap; }
.muted { color: var(--ink-soft); }
.small { font: 13px/1.5 var(--sans); }
.row { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; }
.empty { border: 1px dashed var(--lo); padding: 10px 12px; font: 13px/1.5 var(--sans); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: none; }
.two h3:first-child { margin-top: 0.6em; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 16px; font: 13px/1.5 var(--sans); margin: 8px 0 12px; }
.kv div:nth-child(odd) { color: var(--ink-soft); }
/* tags */
.b { display: inline-block; font: 11px/1.4 var(--sans); padding: 0 4px; border: 1px solid var(--lo); color: var(--ink-soft); vertical-align: middle; white-space: nowrap; background: #fff; }
.b.evidence { color: var(--c1); border-color: var(--c1); }
.b.inference { color: var(--c3); border-color: var(--c3); }
.b.speculation { color: var(--c2); border-color: var(--c2); }
.b.red { color: var(--c2); border-color: var(--c2); }
.b.amber { color: var(--ink); border-color: var(--c4); border-left-width: 4px; }
.b.green { color: var(--c6); border-color: var(--c6); }
.b.na { color: var(--ink-soft); }
.light { display: inline-block; width: 10px; height: 10px; vertical-align: middle; margin-right: 6px; background: var(--lo); border: 1px solid var(--field); }
.light.red { background: var(--c2); } .light.amber { background: var(--c4); } .light.green { background: var(--c6); } .light.na { background: var(--hi); }
.conf { font: 11px/1.4 var(--sans); color: var(--ink-soft); }
/* claims */
.claim { border-left: 3px solid var(--lo); padding: 4px 0 4px 12px; margin: 10px 0; }
.claim[data-basis="evidence"] { border-left-color: var(--c1); }
.claim[data-basis="inference"] { border-left-color: var(--c3); }
.claim[data-basis="speculation"] { border-left-color: var(--c2); }
.claim .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 2px; font-size: 0.95em; }
.claim .body { white-space: pre-line; }
.claim .src { font: 12px/1.5 var(--sans); color: var(--ink-soft); margin-top: 3px; }
.hidden-by-filter { display: none !important; }
.redact { background: var(--ink); color: transparent; cursor: pointer; }
.redact:hover, .redact:focus, .redact.open { background: transparent; color: inherit; }
/* tables */
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.wrap { white-space: normal; }
tr.flag-red td:first-child { color: var(--c2); }
/* cover */
.cover-grid { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 24px; align-items: start; max-width: none; }
.stamp { border: 3px double var(--ink); padding: 10px 14px; display: inline-block; min-width: 180px; }
.stamp .n { font-size: 2.6em; line-height: 1; font-weight: bold; font-variant-numeric: tabular-nums; }
.stamp .g { font: 13px/1.4 var(--sans); margin-top: 4px; }
.stamp .l { font: 11px/1.4 var(--sans); color: var(--ink-soft); margin-top: 6px; }
.failure { background: var(--tint); box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); padding: 12px 14px; margin: 14px 0; }
.failure .t { font: 12px/1.4 var(--sans); color: var(--ink-soft); margin-bottom: 6px; }
.failure .f { font-size: 1.25em; line-height: 1.3; }
.failure .m { margin-top: 8px; font-size: 0.95em; }
.boot { display: none; }
/* score bars */
.bars { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 6px 12px; align-items: center; max-width: var(--measure); font: 13px/1.5 var(--sans); }
.bars .track { height: 14px; background: #fff; border: 1px solid var(--field); box-shadow: inset 1px 1px 0 #b4b4b4; }
.bars .fill { height: 100%; background: var(--c1); }
.bars .v { font-variant-numeric: tabular-nums; }
/* chart */
.chart-wrap { margin: 8px 0; position: relative; max-width: none; }
.chart-wrap svg { width: 100%; height: auto; display: block; font-family: var(--sans); }
.legend { display: flex; gap: 16px; font: 12px/1.5 var(--sans); margin: 4px 0 0; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
.tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--field); padding: 3px 6px; font: 12px/1.4 var(--sans); display: none; white-space: nowrap; z-index: 3; }
/* ratio boxes */
.ratios { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin: 8px 0; max-width: none; }
.ratio { border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi); padding: 8px 10px; }
.ratio.red { border-left: 4px solid var(--c2); } .ratio.amber { border-left: 4px solid var(--c4); }
.ratio .l { font: 12px/1.4 var(--sans); min-height: 2.8em; }
.ratio .v { font-size: 1.6em; line-height: 1.1; font-weight: bold; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
.ratio .v small { font: 12px var(--sans); font-weight: normal; margin-left: 3px; }
.ratio .f { font: 11px/1.4 var(--sans); color: var(--ink-soft); }
.ratio .why { font: 12px/1.45 var(--sans); margin-top: 6px; }
.range { position: relative; height: 16px; margin: 2px 0; }
.range .tr { position: absolute; left: 0; right: 0; top: 7px; height: 1px; background: var(--lo); }
.range .band { position: absolute; top: 4px; height: 7px; background: var(--tint); border: 1px solid var(--lo); }
.range .med { position: absolute; top: 2px; width: 1px; height: 12px; background: var(--ink); }
.range .me { position: absolute; top: 3px; width: 9px; height: 9px; background: var(--c1); margin-left: -4px; }
/* scenarios */
.quad { display: grid; grid-template-columns: auto 1fr 1fr; grid-template-rows: auto 1fr 1fr auto; gap: 6px; max-width: none; margin: 12px 0; }
.quad .ax { font: 12px/1.4 var(--sans); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px; }
.quad .ax.y { writing-mode: vertical-rl; transform: rotate(180deg); max-height: 420px; overflow: hidden; }
.q { text-align: left; min-height: 120px; display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; font: 13px/1.4 var(--sans); }
.q .nm { font: 1.1em/1.25 var(--serif); }
.q .qd { font-size: 11px; color: var(--ink-soft); }
.q .tag { font-size: 11px; font-weight: bold; color: var(--c2); }
.q .rd { margin-top: auto; font-size: 11px; color: var(--ink-soft); }
.scen-detail { border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi); padding: 10px 12px 12px; margin: 0 0 16px; }
.dots { letter-spacing: 1px; color: var(--c1); }
.dots .off { color: var(--hi); }
/* expanders */
details { border: 1px solid var(--lo); margin: 8px 0; }
summary { cursor: pointer; padding: 8px 10px; list-style: none; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
summary::-webkit-details-marker { display: none; }
summary .r { font: bold 13px var(--sans); color: var(--c1); }
summary .fm { }
summary .pr { font: 12px/1.4 var(--sans); color: var(--ink-soft); white-space: nowrap; }
details[open] summary { border-bottom: 1px solid var(--lo); background: var(--tint); }
details .in { padding: 6px 12px 12px 48px; }
.chain li { font-size: 0.9em; }
.q-status { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--hi); }
.q-status .qq { font-weight: bold; margin-bottom: 2px; }
.q-status .aa { }
.statusline { font: 0.85em/1.5 var(--serif); margin-top: 24px; }
.statusline span + span::before { content: " · "; }
button.b { font: 12px var(--sans); padding: 5px 10px; }
@media (max-width: 780px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .menu { position: static; }
  .cover-grid, .two { grid-template-columns: 1fr; }
  .quad { grid-template-columns: 1fr; grid-template-rows: auto; }
  .quad .ax { display: none; }
  .quad .q { grid-column: auto !important; grid-row: auto !important; }
}
@media print {
  .nav, .menu, .statusline, #print-brief, .notice { display: none !important; }
  .shell { display: block; }
  section.page { display: none !important; } section.page#sec-brief { display: block !important; }
  body { font-size: 12px; } h1 { font-size: 1.7em; } .lede { font-size: 1.05em; }
  .cover-grid { grid-template-columns: 1fr 160px; }
  a { color: var(--ink); text-decoration: none; }
}

/* ===== polish pass: same palette and type, finer rhythm ===== */
body { line-height: 1.5; }
.page { max-width: 1040px; }
header h1 { font-size: 2.2em; letter-spacing: -0.01em; margin-bottom: 0.1em; }
header .dek { font-size: 0.95em; color: var(--ink-soft); }
.notice { padding: 9px 12px; line-height: 1.55; border-left: 3px solid var(--lo); box-shadow: none; }
.shell { gap: 40px; }
.shell > main > section > h1 { font-size: 1.75em; margin: 0.2em 0 0.1em; }
.sub { margin: 0 0 18px; }
h2 { font-size: 0.85em; letter-spacing: 0.02em; color: var(--ink-soft); margin: 2em 0 0.8em; padding-bottom: 3px; }
h3 { font-size: 1.05em; margin: 1.3em 0 0.35em; }
.prose, .lede, .pre, .claim .body, .failure, details .in p { max-width: var(--measure); }
.lede { font-size: 1.2em; line-height: 1.42; }
/* tables: horizontal rules only, numbers aligned, tinted head */
table { font-size: 12.5px; line-height: 1.45; margin: 6px 0 10px; }
main table { max-width: none; }
td.wrap { min-width: 9em; }
th, td { border: 0; border-bottom: 1px solid var(--hi); padding: 6px 10px 6px 0; }
th { border-bottom: 1px solid var(--lo); background: transparent; font-weight: bold; color: var(--ink-soft); }
tr:last-child td { border-bottom: 1px solid var(--lo); }
/* health panel on the cover */
.health { border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi); padding: 12px 14px 10px; font: 12.5px/1.45 var(--sans); }
.health .n { font: bold 3em/1 var(--serif); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.health .n small { font: 13px var(--sans); color: var(--ink-soft); margin-left: 6px; letter-spacing: 0; }
.health .g { margin: 4px 0 10px; color: var(--ink-soft); }
.health table { margin: 0; font-size: 12px; }
.health td { padding: 3px 0; border-bottom: 1px solid var(--hi); }
.health td.num { padding-left: 10px; }
.health tr:last-child td { border-bottom: 0; }
.health .bar { height: 5px; background: var(--hi); margin-top: 3px; }
.health .bar > i { display: block; height: 100%; background: var(--c1); }
.stamp { display: none; }
.failure { padding: 14px 16px; margin: 18px 0; border-left: 3px solid var(--c2); box-shadow: none; }
.failure .f { font-size: 1.3em; }
.kv { gap: 4px 18px; margin: 12px 0 16px; }
/* claims */
.claim { padding: 2px 0 2px 12px; margin: 12px 0; }
.claim .head { font: 12px/1.5 var(--sans); gap: 6px; }
.b { font-size: 10.5px; padding: 0 5px; }
/* ratio cards */
.ratios { gap: 12px; }
.ratio { padding: 10px 12px 10px; background: #fff; }
.ratio .l { font-size: 12px; color: var(--ink-soft); min-height: 2.6em; }
.ratio .v { font-size: 1.75em; margin: 6px 0 2px; }
.ratio .why { color: var(--ink); }
/* scenario tiles as panels, not buttons */
.quad { gap: 8px; }
button.q, button.q:active, button.q[aria-pressed="true"] { background: #fff; color: var(--ink); border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi); padding: 12px 14px; }
button.q:hover { border-color: var(--field); }
button.q[aria-pressed="true"] { border-color: var(--c1); box-shadow: inset 3px 0 0 var(--c1), inset 1px 1px 0 var(--hi); }
.q .nm { font-size: 1.15em; }
.q .qd { font-size: 10.5px; }
.scen-detail { padding: 14px 16px 16px; }
/* expanders */
details { border: 0; border-top: 1px solid var(--hi); margin: 0; }
details:last-of-type { border-bottom: 1px solid var(--hi); }
summary { padding: 10px 4px; grid-template-columns: 28px minmax(0, 1fr) auto; }
summary .r { color: var(--c1); }
summary .fm { font-size: 1.05em; }
details[open] summary { background: transparent; border-bottom: 0; }
details .in { padding: 0 4px 14px 32px; }
/* score bars */
.bars { gap: 7px 14px; }
.bars .track { height: 9px; box-shadow: none; border-color: var(--lo); }
/* contents */
.menu fieldset { padding: 10px 12px 10px; }
.menu ol { line-height: 1.8; }
.menu .n { font-size: 10.5px; }
/* footer */
.statusline { line-height: 1.55; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="brand-name">Dossier</h1>
    <p class="dek" id="brand-sub"></p>
    <p class="nav" id="topnav"></p>
    <hr>
  </header>
  <p class="notice" id="stripe"><span id="stripe-l"></span> <span id="stripe-r"></span></p>
  <div class="shell">
    <main id="main"></main>
    <aside class="menu" aria-label="Contents">
      <fieldset><legend>Contents</legend><ol id="nav"></ol></fieldset>
      <fieldset class="filter"><legend>Show claims tagged</legend>
        <div class="opts">
          <label><input type="radio" name="basis" value="3" checked> evidence, inference, speculation</label>
          <label><input type="radio" name="basis" value="2"> evidence and inference</label>
          <label><input type="radio" name="basis" value="1"> evidence only</label>
        </div>
      </fieldset>
      <p class="meta" id="meta"></p>
    </aside>
  </div>
  <footer>
    <hr>
    <address class="statusline" id="status"></address>
  </footer>
</div>
<script>

Science of Awakening", "durability": "too_early", "contribution": "lead", "counterfactual": "[inference] Partly additional, size unknown. Some grantees already have other funding: Melbourne's centre began with a $10M gift, and Slagter and Laukkonen have acknowledged European Research Council support. Funders such as Tiny Blue Dot and Templeton also fund neighbouring consciousness work. Awards capped at $100K in direct costs are small, so some projects may be add-ons to existing work. No evidence found on whether these projects would have gone ahead without CoFo. The narrow focus on awakening as the funded subject is the most plausibly additional part.", "others_involved": ["14 grantee teams and host institutions", "Five anonymous professor reviewers"], "significance": 2, "evidence_quality": "self_reported_with_data", "evidence": "[evidence] CoFo's 22 July 2026 post names 14 projects and their investigators and gives the funnel: 128 LOIs, 54 invited, 52 submitted, 24 highest-scoring considered, 14 funded. The post gives no dollars. CoFo's program page states $1.5M. UVA and Melbourne independently confirm awards, and only Melbourne gives an amount (USD 100,000 over two years, seen in search text because the page returned 403). [inference] 14 awards at the RFP cap come to $1.4M in direct costs and $1.61M with 15% overhead, so $1.5M is plausible but not confirmed. The RFP promises a single payment within 60 days of notice and compliance; no payment record was seen.", "basis": "evidence", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "CoFo Substack: Toward a Science of Awakening: Our First Grantees (22 July 2026)"}, {"url": "https://cofo.org/awakening", "title": "CoFo: Science of Awakening"}, {"url": "https://www.cofo.org/rfp", "title": "CoFo: Toward A Science of Awakening RFP"}, {"url": "https://dev.csc.virginia.edu/news/toward-science-awakening-grant", "title": "UVA Contemplative Sciences Center (31 August 2026)"}, {"url": "https://psychologicalsciences.unimelb.edu.au/CSC/news/csc-secures-international-research-grant", "title": "University of Melbourne CSC (search result only; fetch returned 403)"}, {"url": "https://www.unimelb.edu.au/newsroom/news/2021/march/university-welcomes-$10-million-gift-for-contemplative-studies-centre", "title": "University of Melbourne: $10 million gift (search result only)"}]}, {"rank": 2, "what_changed": "A shared working structure now exists on paper. Awardees must share data and results with one another as a condition of funding. They also attend an in-person kickoff and quarterly cohort calls. If it works, this could produce shared measures and definitions across labs. No shared measure, dataset or definition exists yet.", "for_whom": "The 14 teams first, and the wider contemplative-science field later if outputs become public.", "count": "14 teams; two-year period", "year": 2026, "program": "Science of Awakening", "durability": "too_early", "contribution": "lead", "counterfactual": "[inference] This is CoFo's clearest design contribution, because few small grants bind recipients to share with each other. It is too early to tell whether it changes behavior. The requirement covers sharing within the cohort. The RFP asks applicants to describe open-data and preregistration plans but mandates neither, so public open data is not guaranteed.", "others_involved": ["14 grantee teams"], "significance": 2, "evidence_quality": "self_reported_with_data", "evidence": "[evidence] CoFo's July 2026 post states the condition and the meeting schedule. UVA independently describes the same expectation. No meeting, shared dataset or joint product was found. None would be expected about two months into the projects.", "basis": "evidence", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "CoFo Substack: Our First Grantees (22 July 2026)"}, {"url": "https://dev.csc.virginia.edu/news/toward-science-awakening-grant", "title": "UVA Contemplative Sciences Center (31 August 2026)"}, {"url": "https://www.cofo.org/rfp", "title": "CoFo RFP"}]}, {"rank": 3, "what_changed": "A longitudinal study of awakening has been funded: a three-year prospective study of up to 700 early-stage meditators using questionnaires and weekly audio diaries. It is the only project with a dollar amount confirmed from outside CoFo. No participant results exist.", "for_whom": "Melbourne researchers now. Up to 700 study participants are planned, not reached.", "count": "Up to 700 participants planned; USD 100,000 over two years", "year": 2026, "program": "Science of Awakening", "durability": "too_early", "contribution": "co_lead", "counterfactual": "[inference] The centre started with a $10M private gift and reports other grant funding, so CoFo's money may not be the study's only support. The CoFo award runs two years and the study runs three, which also suggests other funding is needed. Whether CoFo tipped the decision to run the study is unknown.", "others_involved": ["University of Melbourne Contemplative Studies Centre"], "significance": 1, "evidence_quality": "self_reported_with_data", "evidence": "[evidence] CoFo's post describes the design. Melbourne's announcement, seen only as search text, gives the amount and describes hundreds of meditators in four countries. The grantee is independent of CoFo but benefits from the award, so this confirms the award and does not assess its value.", "basis": "evidence", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "CoFo Substack: Our First Grantees (22 July 2026)"}, {"url": "https://psychologicalsciences.unimelb.edu.au/CSC/news/csc-secures-international-research-grant", "title": "University of Melbourne CSC (search result only)"}]}, {"rank": 4, "what_changed": "The first public snapshot of proposed awakening research now exists. It covers methods and definitions across 128 letters of intent and reports convergence on awakening as an enduring trait-level change. The field did not necessarily change. The snapshot describes applicants chasing one call for money.", "for_whom": "Researchers and funders considering the field.", "count": "128 LOIs analyzed; for example EEG in 51, retreats in 22, psychedelic-assisted approaches in 23", "year": 2026, "program": "Science of Awakening", "durability": "too_early", "contribution": "lead", "counterfactual": "[inference] No one else would have had this applicant data, so the snapshot itself depends on CoFo. The convergence it reports may partly reflect the RFP's own framing rather than a field view. The underlying data is not public. No citation or outside use of the snapshot was found.", "others_involved": ["128 applicant teams"], "significance": 1, "evidence_quality": "self_reported_with_data", "evidence": "[evidence] CoFo's 24 March 2026 post gives the counts. No independent check of the data was found. The fuller application analysis promised on 22 July 2026 is not in the Substack archive as fetched on 30 October 2026.", "basis": "evidence", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "CoFo Substack: Initial Learnings (24 March 2026)"}, {"url": "https://theconsciousnessfoundation.substack.com/archive", "title": "CoFo Substack archive"}]}, {"rank": 5, "what_changed": "A four-week consciousness residency ran at Edge Esmeralda in June 2026. It reports on-site experiments, draft papers, tools and public events. CoFo is thanked as a supporter. No published findings from it were confirmed.", "for_whom": "19 residents and event attendees.", "count": "19 residents; 4 experiments; 4 papers drafted or in flight; 4 tools; 25+ talks and events, all as reported by the organizer", "year": 2026, "program": null, "durability": "too_early", "contribution": "one_of_many", "counterfactual": "[inference] The organizer says the residency could not have happened without support from CoFo along with other named supporters. That is a thank-you, not an attribution finding. CoFo's dollar share and role are not stated. CoFo itself does not list this work in the sources reviewed.", "others_involved": ["Edge City / Edge Esmeralda", "Mays Family Foundation", "Mares Family", "Other supporters"], "significance": 1, "evidence_quality": "self_reported_with_data", "evidence": "[evidence] Edge City's recap gives the dates (1 to 27 June 2026) and the counts. It comes from the organizer, not an independent assessor. All the counts are outputs.", "basis": "evidence", "sources": [{"url": "https://www.edgecity.live/blog/a-month-at-the-consciousness-residency-2026", "title": "Edge City: The Consciousness Residency: A Recap"}]}], "failures_and_reversals": [{"what": "State of the Field: Science of Awakening was listed as \"Available Q3 2026\". On 30 October 2026, after the quarter ended, the home and Insights pages still showed that label with no link.", "year": 2026, "consequence": "The only dated public report commitment appears missed by at least a month. It also leaves the field-intelligence claim without a 2026 product.", "how_handled": "No public explanation or new date found. The program page says it will reach newsletter subscribers when available. Newsletter delivery was not tested, but the Substack archive shows no such post.", "basis": "evidence", "sources": [{"url": "https://cofo.org/insights", "title": "CoFo: Insights"}, {"url": "https://cofo.org/awakening", "title": "CoFo: Science of Awakening"}, {"url": "https://theconsciousnessfoundation.substack.com/archive", "title": "CoFo Substack archive"}]}, {"what": "A detailed analysis of the application field was promised \"in the coming weeks\" on 22 July 2026. No such post appears in the Substack archive fetched on 30 October 2026, about 14 weeks later.", "year": 2026, "consequence": "A small slip. It is the second overdue promise about published analysis.", "how_handled": "No explanation found. It may have been published elsewhere, but no evidence of that was found.", "basis": "evidence", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "CoFo Substack: Our First Grantees"}, {"url": "https://theconsciousnessfoundation.substack.com/archive", "title": "CoFo Substack archive"}]}, {"what": "Bodymind's first RFP, and its State of Bodymind Science report, podcast and convening, were described in March 2026 and on the program page as coming work. No RFP or delivered output was found. The current program page does not mention an RFP.", "year": 2026, "consequence": "Not yet a miss, because the 2026 window remains open for the listed outputs. The program had no visible external output about seven months after its director's post, and no grant money was found going through it.", "how_handled": null, "basis": "evidence", "sources": [{"url": "https://cofo.org/bodymind", "title": "CoFo: Bodymind"}, {"url": "https://jameswphillips.substack.com/p/bodymind-2-joining-the-consciousness", "title": "James W. Phillips: Bodymind #2 (19 March 2026)"}]}, {"what": "Donor advising claims \"impact reports\" and \"regular events\", and CoFlow claims roadmaps and white papers. No client count, dollars advised, sample report, event or CoFlow output was found.", "year": 2026, "consequence": "Two of the five stated pillars have no visible results. The claim that CoFo moves other people's money cannot be credited.", "how_handled": null, "basis": "evidence", "sources": [{"url": "https://cofo.org/approach", "title": "CoFo: Approach"}, {"url": "https://cofo.org/insights", "title": "CoFo: Insights"}]}, {"what": "Basic grant disclosure is uneven. The first-cohort post gives no dollars, cofo.org's program page names no grantees, and reviewers are anonymous at one professor's request. A reader's March 2026 public question about money distributed had no visible answer in the portion read.", "year": 2026, "consequence": "Outsiders cannot verify amounts paid or test review independence. The final 14 were chosen from 24 for methodological diversity rather than strictly by score, so a discretionary step sits after anonymous scoring. The person or body making that choice is not named.", "how_handled": "CoFo did publish the funnel, the scoring approach and the full project list, which is more than the earlier scan found.", "basis": "evidence", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/p/the-science-of-awakening-our-first", "title": "CoFo Substack: Our First Grantees"}, {"url": "https://cofo.org/awakening", "title": "CoFo: Science of Awakening"}, {"url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science", "title": "CoFo Substack: Initial Learnings"}]}, {"what": "No lost cases, reversed results, ended programs or failed grants were found. This reflects the org's age and sparse disclosure. It is not evidence of a clean record, and no funded project has had time to fail.", "year": null, "consequence": "The failure column will remain thin until grant reports begin to arrive, likely from 2027 onward.", "how_handled": null, "basis": "inference", "sources": [{"url": "https://theconsciousnessfoundation.substack.com/archive", "title": "CoFo Substack archive"}]}], "activity_counts": [{"metric": "Letters of intent received, first call", "unit": "LOIs", "level": "output", "program": "Science of Awakening", "series": [{"year": 2025, "value": 128, "value_text": "128", "kind": "actual", "source_url": "https://theconsciousnessfoundation.substack.com/p/initial-learnings-from-our-science"}], "definition_changes": null, "trend": "insufficient_data", "note": "Self-reported. Measures demand for money. It is a single point.", "basis": "evidence"}, {"metric": "Teams invited to full proposals", "unit": "teams", "level": "output", "program": "Science of Awakening", "series": [{"year": 2026, "value": 54, "value_text": "54", "kin
