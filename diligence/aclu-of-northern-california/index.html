eWatch); foundation grants $471,614 in the 2023 report", "year": "Through 2025", "note": "No single-funder concentration is visible. The real exposure is unnamed individuals, bequests and DAF conduits. Government contracts: none found; a 2015 report says no government funding, and nothing current confirms it. National ACLU Foundation is also listed as a 2025 grant source (Impala), amount not shown.", "sources": [{"url": "https://www.influencewatch.org/non-profit/aclu-foundation-of-northern-california2/", "title": "InfluenceWatch, citing Candid"}, {"url": "https://impala.digital/public/profiles/94-0279770/overview", "title": "Impala profile"}, {"url": "https://www.aclunorcal.org/sites/default/files/2015_annual_report.pdf", "title": "2015 annual report (search snippet)"}]}], "program_claims": [{"claim": "ACLU NorCal and partners stopped ICE courthouse arrests in Northern California (organization: 'ordered DHS to cease all arrests at immigration courts in Northern California').", "evidence_status": "independently_verified", "detail": "Multiple news reports and the case record describe Judge Pitts's Dec 24, 2025 stay and a June 2026 summary-judgment ruling vacating three ICE policies. Reports disagree on the June scope (Hoodline: nationwide; Local News Matters per search summary: limited to the SF Area of Responsibility). An ACLU of New York release dated Oct 1, 2026 describes a later nationwide ruling, not confirmed elsewhere in this research. Appeal status: no evidence found. The ruling is verified. Actual reduction in arrests was not measured. Multiple organizations share credit.", "sources": [{"url": "https://missionlocal.org/2025/12/sf-ice-courthouse-arrests-lawsuit-aclu/", "title": "Mission Local, Dec 2025"}, {"url": "https://ktvu.com/news/judge-orders-halt-ice-arrests-san-francisco-courthouse", "title": "KTVU"}, {"url": "https://hoodline.com/2026/06/sf-judge-slaps-nationwide-freeze-on-ice-courthouse-arrests/", "title": "Hoodline, June 2026"}, {"url": "https://aclu.org/press-releases/federal-court-strikes-down-ices-courthouse-arrest-policy-nationwide", "title": "ACLU press release, Oct 2026"}]}, {"claim": "Siskiyou County case won policy change for Asian American residents.", "evidence_status": "independently_verified", "detail": "January 2026 report of a partial settlement: new traffic-stop policy prohibiting race-based stops, a paid compliance auditor and biannual community meetings, plus lifted property liens. Water-access claims were not resolved at that time. An earlier related case led the county to repeal water ordinances (NBC, 2023). Compliance outcomes are not yet known.", "sources": [{"url": "https://nextshark.com/siskiyou-county-settlement-asian-discrimination-lawsuit", "title": "NextShark, Jan 23, 2026"}, {"url": "https://www.nbcnews.com/news/asian-america/california-county-repeals-water-regulations-asian-americans-say-target-rcna98621", "title": "NBC News"}]}, {"claim": "'Grew to over 120,000 ACLU members in Northern California, 20% more than last year' (2025 annual report).", "evidence_status": "self_reported_with_data", "detail": "From a search snippet; the PDF was unreadable. Partial corroboration: Union program revenue, apparently membership, rose from $3.49M (FY24) to $5.66M (FY25). The periods do not match exactly and the count is not independently audited.", "sources": [{"url": "https://www.aclunorcal.org/app/uploads/2026/06/2025-ACLU-NorCal-annual-report.pdf", "title": "2025 annual report (search snippet)"}, {"url": "https://projects.propublica.org/nonprofits/organizations/942151925", "title": "ProPublica: ACLU of Northern California"}]}, {"claim": "'Filed new legal actions while continuing to advance 40 ongoing cases' (2025 annual report).", "evidence_status": "self_reported_with_data", "detail": "The number of new actions was garbled in the snippet. A public case docket exists, and specific matters checked exist (for example SmartRent, filed Dec 4, 2025; San Jose Flock suit, April 2026). The totals were not tallied against the docket. Case counts are outputs, not outcomes.", "sources": [{"url": "https://www.aclunorcal.org/app/uploads/2026/06/2025-ACLU-NorCal-annual-report-2.pdf", "title": "2025 annual report (search snippet)"}, {"url": "https://www.aclunorcal.org/cases/san-francisco-tenants-union-v-smart-rent/", "title": "SmartRent case page"}, {"url": "https://www.404media.co/aclu-and-eff-sue-a-city-blanketed-with-flock-surveillance-cameras/", "title": "404 Media"}]}, {"claim": "'The first year of Trump 2.0 was perhaps the busiest in our 90-plus year history.'", "evidence_status": "self_reported_no_data", "detail": "Rhetorical claim on the annual report page. No comparison data was seen. News volume since September 2025 fits the direction, but cannot test the claim.", "sources": [{"url": "https://www.aclunorcal.org/annualreport/", "title": "2025 Annual Report page"}]}], "media_footprint": {"volume": "Moderate to high for a regional affiliate in 2025-2026, mainly tied to immigration, surveillance and local government suits. Lower and thinner on the institution itself: one article about internal affairs found in three years.", "tone": "Mostly neutral case reporting, with organization statements quoted. Partisan outlets and profiles (for example InfluenceWatch) are critical of its positions. The only institutional criticism found is the anonymously sourced Above the Law piece.", "pattern": "Coverage follows filings and rulings: ICE courthouse arrests (Sept 2025 onward), re-detention, the DHS records suit (June 2026), San Jose Flock cameras (April 2026), the Siskiyou settlement (January 2026). The organization is covered as a litigant rather than as an institution, so the press offers little check on its management. Several hits are low-quality aggregators (Hoodline), and no Chronicle, CalMatters or KQED article on the organization's management surfaced. This pattern is drawn from the search results reviewed, not a full media audit.", "basis": "inference", "sources": [{"url": "https://www.axios.com/local/san-francisco/2025/09/19/ice-courthouse-arrests-civil-rights-lawsuit", "title": "Axios, Sept 2025"}, {"url": "https://missionlocal.org/2025/12/sf-ice-courthouse-arrests-lawsuit-aclu/", "title": "Mission Local, Dec 2025"}, {"url": "https://www.404media.co/aclu-and-eff-sue-a-city-blanketed-with-flock-surveillance-cameras/", "title": "404 Media"}, {"url": "https://hoodline.com/2026/06/aclu-drags-dhs-into-san-francisco-court-over-records-on-filming-feds/", "title": "Hoodline, June 2026"}, {"url": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "title": "Above the Law, Oct 2024"}, {"url": "https://www.influencewatch.org/non-profit/aclu-of-northern-california/", "title": "InfluenceWatch"}]}, "gaps": ["Part IX program, management and fundraising split for FY23, FY24 and FY25: not obtained. ProPublica's filing pages returned only 'Loading...', its XML returned 403, and GuideStar and organization PDFs were unreadable compressed data. Saved copies of several PDFs sit in the session tool-results folder and need a text extractor. Program totals shown are Part III snippet or aggregator data; FY24 program is blank.", "FY22 functional row is on the annual-report basis, including about $6.84M of donated legal services, and is not comparable to the 990 totals in other rows. The annual-report page also had placeholder text, and the search summary's stated period (July-June) conflicts with the March 31 year-end.", "FY25 audit contents: not read at all. FY23-FY24 opinion paragraphs, going-concern conclusion, material weaknesses, restatements and auditor name for FY24-FY25: not confirmed.", "Current national gift-sharing formula and FY25 dollars sent to national: no evidence found. Whether restricted or major gifts are exempt from sharing: no evidence found.", "Schedule L (related-party transactions), Part VI (independent directors, family relationships, whistleblower and conflict policies), Schedule O for FY24-FY25, Schedule I and Schedule R for FY25: not read. Charity Navigator's secondary checks on diversion, loans and audit committee are the only coverage.", "Personnel figures conflict: the extract shows personnel at 59.79% of FY25 Foundation expenses; Intellispect shows compensation and benefits at $15,389,632, or 77.7%. Unresolved. FY25 'service-provider' expenses of $1,337,263 against $22,612 in FY24 and the fall in 'other expenses' may be reclassification; not checked.", "Explanation for the FY25 contribution jump of $9.17M, including bequest amount and any single large gift: no evidence found. The $1,000,000 contribution receivable due 2028 has no named source.", "October 2024 restructuring: board vote result, number laid off, programs ended, severance cost, union response and any organization statement: no evidence found. No Local 20 statement or contract was found. NLRB docket not searched.", "Soltani succession plan or departure: no evidence found. Announcements for Steinbach, Tapken, Le, Burlingame or the Bailey-to-Stuart chair change: no evidence found. Current CFO-level officer: not established.", "BBB Wise Giving Alliance and CharityWatch ratings: no evidence found for this entity in search; their own databases were not queried directly.", "California AG Registry and IRS TEOS: not checked directly. No AG delinquency notice found in search. No direct search of court dockets for suits against the organization.", "Annual reports for 2024 and 2025: PDFs unreadable, so only snippets were seen. Named donor lists, if any, not reviewed. Strategic plan text not read; date range is reported inconsistently (2025-2028 vs 2025-2029).", "Government grants or contracts: no evidence found; the most recent statement of no government funding is from 2015. Schedule of attorney-fee revenue by case: no evidence found.", "Independent evaluation of program outcomes: no evidence found. Evidence covers rulings and settlements, not effects on people.", "Year conflicts in aggregators on the $3M national grants: InfluenceWatch lists $3M to ACLU Foundation Inc in 2021 and $3M from the Union to ACLU Inc in 2023; the FY22 annual report says the affiliate allocated $3M to national. These may be one or two grants. Not resolved. Their role in the FY21 and Union FY23 deficits is inference.", "ACLU California Action: the $2.1M-$2.6M annual grants rest on InfluenceWatch citing Candid. The Union's FY24 Part III grants figure of $2,548,286 fits this, but no Schedule I was read."], "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/940279770", "title": "ProPublica: ACLU Foundation of Northern California"}, {"url": "https://projects.propublica.org/nonprofits/organizations/942151925", "title": "ProPublica: ACLU of Northern California"}, {"url": "https://projects.propublica.org/nonprofits/organizations/940279770/202620339349300347/full", "title": "Foundation filing FYE 3/2025 (page did not load filing content)"}, {"url": "https://pdf.guidestar.org/PDF_Images/2023/940/279/2023-940279770-202420329349300647-9.pdf", "title": "Foundation Form 990 FYE 3/2023, GuideStar (search snippet)"}, {"url": "https://pdf.guidestar.org/PDF_Images/2024/942/151/2024-942151925-202530369349301138-.pdf", "title": "Union Form 990 FYE 3/2024, GuideStar (search snippet)"}, {"url": "https://www.aclunorcal.org/sites/default/files/ACLU_2022_990.pdf", "title": "ACLU NorCal Form 990 (search snippet)"}, {"url": "https://www.aclunorcal.org/app/uploads/2026/03/ACLU-Foundation-and-Union-of-Northern-California-Audit-FY24-1.pdf", "title": "FY24 consolidated audit (search snippets)"}, {"url": "https://www.aclunc.org/sites/default/files/ACLU%20Foundation%20and%20Union%20of%20Northern%20California%20Audit%20FY23.pdf", "title": "FY23 consolidated audit (search snippet)"}, {"url": "https://www.aclunc.org/sites/default/files/ACLU%20of%20Northern%20California%20Audit%20FY21.pdf", "title": "FY21 audit (search snippet)"}, {"url": "https://www.aclunorcal.org/about/financial-info-reports", "title": "ACLU NorCal: Financial Info & Reports"}, {"url": "https://www.aclunorcal.org/annualreport/", "title": "ACLU NorCal: 2025 Annual Report page"}, {"url": "https://www.aclunorcal.org/app/uploads/2026/06/2025-ACLU-NorCal-annual-report.pdf", "title": "2025 annual report PDF (search snippet)"}, {"url": "https://www.aclunorcal.org/app/uploads/2026/06/2025-ACLU-NorCal-annual-report-2.pdf", "title": "2025 annual report PDF, second copy (search snippet)"}, {"url": "https://annualreport.aclunc.org/2022-report/", "title": "2022 annual report (search snippet; fetch failed on certificate error)"}, {"url": "https://annualreport.aclunc.org/wp-content/uploads/2024/06/ACLU_NorCal_2023_Development_Highlights.pdf", "title": "2023 Development Highlights (search snippet; fetch failed)"}, {"url": "https://www.aclunorcal.org/sites/default/files/ACLU_of_Northern_California_2021_Annual_Report.pdf", "title": "2021 annual report (search snippet)"}, {"url": "https://www.aclunorcal.org/sites/default/files/2015_annual_report.pdf", "title": "2015 annual report (search snippet)"}, {"url": "https://www.aclunorcal.org/2025-in-review/", "title": "Defending Democracy in 2025"}, {"url": "https://www.charitynavigator.org/ein/940279770", "title": "Charity Navigator"}, {"url": "https://www.guidestar.org/profile/94-0279770", "title": "Candid/GuideStar profile"}, {"url": "https://causeiq.com/organizations/american-civil-liberties-union-foundation-of-north,940279770", "title": "CauseIQ: Foundation"}, {"url": "https://www.intellispect.co/organizations/940279770-american-civil-liberties-unio", "title": "Intellispect: Foundation"}, {"url": "https://impala.digital/public/profiles/94-0279770/overview", "title": "Impala: Foundation"}, {"url": "https://grantedai.com/org/american-civil-liberties-union-foundation-of-northern-california-940279770", "title": "GrantedAI: Foundation"}, {"url": "https://www.influencewatch.org/non-profit/aclu-foundation-of-northern-california2/", "title": "InfluenceWatch: Foundation"}, {"url": "https://www.influencewatch.org/non-profit/aclu-of-northern-california/", "title": "InfluenceWatch: Union"}, {"url": "https://www.haasjr.org/node/1149", "title": "Haas Jr. Fund grantee page"}, {"url": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "title": "Above the Law, Oct 29, 2024"}, {"url": "https://www.ifpte.org/news/staff-at-aclu-of-northern-california-file-for-union-recognition-with-nlrb", "title": "IFPTE release, May 13, 2020"}, {"url": "https://news.bloomberglaw.com/litigation/former-aclu-official-alleges-discriminatory-firing-over-politics", "title": "Bloomberg Law, July 8, 2024 (Southern California affiliate)"}, {"url": "https://missionlocal.org/2025/12/sf-ice-courthouse-arrests-lawsuit-aclu/", "title": "Mission Local, Dec 2025"}, {"url": "https://nextshark.com/siskiyou-county-settlement-asian-discrimination-lawsuit", "title": "NextShark, Jan 23, 2026"}, {"url": "https://www.404media.co/aclu-and-eff-sue-a-city-blanketed-with-flock-surveillance-cameras/", "title": "404 Media"}]}, "results": {"mode": {"primary": "qualitative", "rationale": "The work is impact litigation, legislation, ballot positions and organizing. A cost per outcome would be false precision. The organization publishes no outcome data that could feed one, and no affected-person counts exist for its largest rulings. Case outcomes can be checked independently; effects on people mostly cannot."}, "outcomes": [{"rank": 1, "what_changed": "Pablo Sequen v. Albarran (N.D. Cal., Judge Pitts). A Dec 24, 2025 stay halted ICE and EOIR immigration-courthouse arrest policies in ICE's San Francisco area of responsibility. Partial summary judgment on June 23, 2026 and final judgment on June 30, 2026 vacated ICE Policies 11072.3 and 11072.4, EOIR memo 25-06 and the June 2025 nationwide hold-room waiver. Stay pending appeal denied July 10, 2026.", "for_whom": "People attending immigration court nationwide, and people held in ICE short-term hold rooms.", "count": "Not counted. Co-counsel say the policies enabled 'thousands' of arrests since May 2025, with no figure given. A secondhand report says ICE detained no one at San Francisco immigration court after the stay, as of March 2026.", "year": 2026, "program": "Immigrants' rights litigation (Foundation)", "durability": "too_early", "contribution": "co_lead", "counterfactual": "The nationwide result would probably have come anyway, somewhat later. A separate NYCLU and ACLU suit in S.D.N.Y., filed Aug 1, 2025, before this one (Sept 18, 2025), reached a nationwide ruling on Oct 1, 2026. The ACLU's release says that ruling builds on Sequen. The strongest unique claim is about nine months of relief in Northern California before S.D.N.Y. ruled, plus the hold-room relief, which the S.D.N.Y. release does not list (inference).", "others_involved": ["Lawyers' Committee for Civil Rights of the SF Bay Area", "CARECEN SF", "Coblentz Patch Duffy & Bass", "NYCLU and national ACLU (parallel S.D.N.Y. case)"], "significance": 4, "evidence_quality": "independently_verified", "evidence": "The orders are on the public record. The effect on arrests is not measured, apart from one secondhand press report. The ruling leaves arrests outside courthouses, and arrests inside under the prior policies' limits, available. No Ninth Circuit merits ruling found as of today. The Daily Signal argues the ruling conflicts with Supreme Court precedent, so reversal risk is live. Arrests at state courthouses are a separate matter; a Central Valley report describes them rising in summer 2026.", "basis": "evidence", "sources": [{"url": "https://lccrsf.org/pressroom_posts/federal-court-delivers-crushing-blow-to-trumps-mass-deportation-agenda-striking-down-courthouse-arrests-nationwide-and-restoring-protections-against-inhumane-detention/", "title": "LCCRSF release, June 24, 2026"}, {"url": "https://111things.com/national/judge-leaves-courthouse-arrest-policies-vacated-during-appeal/", "title": "Judge leaves courthouse arrest policies vacated during appeal"}, {"url": "https://caselaw.findlaw.com/court/us-dis-crt-n-d-cal/118075512.html", "title": "Pablo Sequen v. Albarran (2025), FindLaw"}, {"url": "https://www.aclunorcal.org/cases/pablo-sequen-v-albarran/", "title": "ACLU NorCal case page"}, {"url": "https://aclu.org/press-releases/federal-court-strikes-down-ices-courthouse-arrest-policy-nationwide", "title": "ACLU release on S.D.N.Y. ruling, Oct 1, 2026"}, {"url": "https://www.keker.com/news/news-items/bay-area-legal-coalition-pushes-back-ice-detentions", "title": "Keker summary of SF Standard, Mar 2026"}, {"url": "https://www.dailysignal.com/2026/06/30/one-judge-has-told-ice-to-stop-the-supreme-court-already-said-no/", "title": "Daily Signal, June 30, 2026"}, {"url": "https://www.turlockjournal.com/news/crime/federal-court-temporarily-lifts-injunction-protecting-valley-from-sweeps-as-immigration-arrests-rise-in-stanislaus/", "title": "Turlock Journal, 2026"}]}, {"rank": 2, "what_changed": "Garro Pinchi v. Noem (N.D. Cal., Judge Pitts). The court provisionally certified a class and blocked ICE's May 2025 policy of re-arresting people it had already found neither dangerous nor a flight risk. Coverage is ICE's San Francisco area: Northern and Central California, Hawai'i, Guam and Saipan.", "for_whom": "Previously released immigrants in that region.", "count": "No class size or number of arrests avoided found.", "year": 2025, "program": "Immigrants' rights litigation (Foundation)", "durability": "too_early", "contribution": "co_lead", "counterfactual": "Individual habeas petitions would have continued; a class-wide regional stop would likely have been slower or absent. Other groups were pursuing similar claims, so the marginal value is speed and class coverage (inference).", "others_involved": ["National ACLU Foundation", "Centro Legal de la Raza", "Keker, Van Nest & Peters"], "significance": 3, "evidence_quality": "independently_verified", "evidence": "A 67-page order per the ACLU release of Dec 22, 2025. A January 2026 order on the stay and class motions is posted by Courthouse News, and the sequence between the two was not resolved. No final judgment or Ninth Circuit ruling found. No evidence on compliance or on arrests avoided.", "basis": "evidence", "sources": [{"url": "https://www.aclunorcal.org/press-releases/federal-court-blocks-ice-rearrest-policy/", "title": "ACLU NorCal release, Dec 22, 2025"}, {"url": "https://www.courthousenews.com/wp-content/uploads/2026/01/order-stay-agency.pdf", "title": "Order on stay of agency action (search result)"}, {"url": "https://clearinghouse.net/doc/165793", "title": "Order granting preliminary injunction, July 24, 2025"}]}, {"rank": 3, "what_changed": "Zepeda Rivas v. Jennings. Class settlement, finally approved in mid-June 2022, required ICE and GEO Group to adopt COVID measures at Mesa Verde and Yuba County Jail, including population caps, intake procedures, testing and vaccine access. It also limited re-detention of hundreds of people released during the suit.", "for_whom": "People detained at the two facilities and people released during the case.", "count": "About 523 detained in March 2020 per Cooley. 'Hundreds' protected from re-detention. Population fell from over 400 to 'well under 100' per the organization's undated page. Exact class size not found.", "year": 2022, "program": "Immigrants' rights litigation (Foundation)", "durability": "partly_reversed", "contribution": "co_lead", "counterfactual": "Some population decline would have occurred anyway during the pandemic. The court-supervised bail process and re-detention limit are harder to imagine without a suit, which had several institutional plaintiffs' counsel. Who did what share is not documented.", "others_involved": ["ACLU of Southern California", "Lawyers' Committee for Civil Rights of the SF Bay Area", "San Francisco Public Defender", "Cooley LLP", "Lakin & Wille"], "significance": 3, "evidence_quality": "independently_verified", "evidence": "Court-approved settlement. It expired on June 9, 2025 by its own terms, just as ICE's new re-detention policy was under way. Whether the re-detention protection survived expiry was not established. The 'partly_reversed' tag reflects expiry, not a court loss.", "basis": "evidence", "sources": [{"url": "https://www.cooley.com/news/coverage/2022/2022-06-22-cooley-secures-civil-rights-win-for-california-ice-detainees", "title": "Cooley release, June 22, 2022"}, {"url": "https://www.aclunorcal.org/our-work/legal-docket/zepeda-rivas-v-jennings-immigration-detention", "title": "ACLU NorCal docket page"}, {"url": "https://sfpublicdefender.org/2022/01/27/groundbreaking-covid-19-settlement-to-yield-protections-for-immigrants-detained-by-ice-limit-re-detention-for-people-released/", "title": "SF Public Defender release, Jan 27, 2022"}]}, {"rank": 4, "what_changed": "United Farm Workers v. Noem (E.D. Cal., Judge Thurston). An April 2025 preliminary injunction barred Border Patrol stops without reasonable suspicion and warrantless arrests without flight-risk findings across the Eastern District. In April 2026 the court found a July 2025 Sacramento Home Depot operation violated it. The Ninth Circuit lifted the injunction on Aug 24, 2026 on standing and sent the question back.", "for_whom": "Farmworkers and Latino residents of the Central Valley and the Eastern District.", "count": "78 arrested in the January 2025 Kern operation, the event that prompted the suit. No stop or arrest figures found for the injunction period.", "year": 2025, "program": "Immigrants' rights litigation (Foundation)", "durability": "partly_reversed", "contribution": "co_lead", "counterfactual": "No comparable suit for the Eastern District appeared in the research. State attorneys general joined only as amici. The Central Valley would likely have had no court-ordered limit for about 16 months (inference). An attorney quoted locally doubts mass sweeps will return, but the injunction's own causal effect is unmeasured.", "others_involved": ["ACLU of Southern California", "ACLU of San Diego & Imperial Counties", "Keker, Van Nest & Peters", "17 attorneys general as amici"], "significance": 3, "evidence_quality": "independently_verified", "evidence": "Multiple reports of the Ninth Circuit order agree. It does not reach the merits. The panel kept jurisdiction, and a local report says the district court has 120 days. The Supreme Court's September 2025 stay in the parallel Los Angeles case shows how exposed this kind of relief is.", "basis": "evidence", "sources": [{"url": "https://www.aclunorcal.org/press-releases/aclu-defends-court-order-barring-border-patrols-unlawful-stop-and-arrest-practices/", "title": "ACLU NorCal release, Apr 22, 2026"}, {"url": "https://www.newsmax.com/us/border-patrol-united-farm-workers-california/2026/08/24/id/1267199/", "title": "9th Circuit lifts block, Aug 24, 2026"}, {"url": "https://ashtalks.substack.com/p/the-ninth-circuit-just-sent-a-border", "title": "Ninth Circuit sends the case back"}, {"url": "https://www.turlockjournal.com/news/crime/federal-court-temporarily-lifts-injunction-protecting-valley-from-sweeps-as-immigration-arrests-rise-in-stanislaus/", "title": "Turlock Journal, 2026"}, {"url": "https://oag.ca.gov/news/press-releases/attorney-general-bonta-leads-coalition-opposing-unlawful-immigration-stops", "title": "California AG amicus release"}]}, {"rank": 5, "what_changed": "Mathis v. County of Siskiyou. A partial settlement finalized in late December 2025 bars race-based traffic stops and intimidation stops. It requires suspicion before search requests, notice of the right to refuse, body cameras and interpreters. It lifts cannabis-fine property liens and adds a paid auditor and twice-yearly community forums. The county separately repealed a 2023 water restriction after pressure.", "for_whom": "Asian American, largely Hmong, residents of a rural county.", "count": "No headcount. 2021 data cited: over 28% of Sheriff's Office stops involved Asian drivers, against about 2.4% of voting-age residents.", "year": 2025, "program": "Racial justice and police practices (Foundation)", "durability": "too_early", "contribution": "co_lead", "counterfactual": "Local residents were pushing, but independent oversight of a rural sheriff was unlikely without a federal class suit (inference). Credit is shared with the Asian Law Caucus and Covington.", "others_involved": ["Asian Law Caucus", "Covington & Burling"], "significance": 2, "evidence_quality": "independently_verified", "evidence": "Settlement reported by outlets outside the organization. No auditor findings or post-settlement stop data exist yet. Water-access claims remain unresolved; a judge refused dismissal in November 2025.", "basis": "evidence", "sources": [{"url": "https://nextshark.com/siskiyou-county-settlement-asian-discrimination-lawsuit", "title": "NextShark, Jan 23, 2026"}, {"url": "https://www.nbcnews.com/news/asian-america/california-county-repeals-water-regulations-asian-americans-say-target-rcna98621", "title": "NBC News, 2023"}]}, {"rank": 6, "what_changed": "Coalition on Homelessness v. San Francisco. A five-year settlement signed Sept 19, 2025 is meant to bind the city to its existing Bag and Tag property policy, with extra photo documentation, records access, a dispute process and minimum notice of policy changes. The city paid $2,828,000 in fees and costs, plus $11,000 each to two individual plaintiffs.", "for_whom": "Unhoused San Franciscans whose property is taken in encampment operations.", "count": "No headcount.", "year": 2025, "program": "Economic justice and unhoused rights (Foundation)", "durability": "in_force", "contribution": "co_lead", "counterfactual": "The policy existed before the settlement. What the case added is outside monitoring and an enforcement route. The broader goal, limiting sweeps, was lost after Grants Pass.", "others_involved": ["Lawyers' Committee for Civil Rights of the SF Bay Area", "Coalition on Homelessness"], "significance": 2, "evidence_quality": "independently_verified", "evidence": "The sides describe the deal differently. Plaintiffs call it significant protection. The City Attorney says it preserves 'all the tools in our toolbox', and the city was released from all claims. Settlement terms are verified from the city's own release. No compliance data was found.", "basis": "evidence", "sources": [{"url": "https://www.sf.gov/news-san-francisco-finalizes-settlement-in-homeless-encampment-lawsuit", "title": "City of San Francisco, Sept 2025"}, {"url": "https://www.kqed.org/news/12049434/sf-agrees-to-2-8-million-settlement-plans-reform-of-homeless-encampment-sweeps", "title": "KQED"}, {"url": "https://www.aclunc.org/news/san-francisco-supervisors-unanimously-approve-settlement-requiring-city-protect-unhoused", "title": "ACLU NorCal release"}, {"url": "https://growsf.org/news/2025-07-25-homelessness-settlement/", "title": "GrowSF"}]}, {"rank": 7, "what_changed": "Lagleva v. Marin County Sheriff. A May 2022 settlement required the sheriff to stop sharing license-plate data outside California, comply with SB 34 and SB 54, and pay $49,000 in fees. It binds successors. Collection itself continued.", "for_whom": "Drivers in Marin County, and immigrants in particular.", "count": "Not counted.", "year": 2022, "program": "Technology and civil liberties (Foundation)", "durability": "partly_reversed", "contribution": "co_lead", "counterfactual": "SB 34 already banned this sharing. The suit's contribution was enforcement against one agency.", "others_involved": ["Electronic Frontier Foundation", "Asian Americans Advancing Justice-related counsel not confirmed"], "significance": 2, "evidence_quality": "independently_verified", "evidence": "Settlement widely reported. On Oct 1, 2026, EFF and the ACLU of Northern California sent a demand letter citing audit logs showing 254,131 sharing events in November 2024 alone, including out-of-state and federal agencies. This is an allegation; the sheriff says it took steps to disable nationwide access. If accurate, the change did not hold in practice.", "basis": "evidence", "sources": [{"url": "https://www.eff.org/deeplinks/2026/10/we-demand-more-information-how-marin-cops-illegally-shared-flock-alpr-data", "title": "EFF, Oct 2026"}, {"url": "https://kpbs.org/news/local/2022/06/03/california-police-cannot-share-drivers-location-data-out-of-state", "title": "KPBS, June 3, 2022"}, {"url": "https://www.aclunc.org/our-work/legal-docket/lagleva-v-doyle-license-plate-surveillance", "title": "ACLU NorCal docket page"}]}, {"rank": 8, "what_changed": "SB 852 clarified that ICE and CBP officers are not California peace officers who can conduct probation checks, closing the 'probation ruse'. The 2023 annual report lists it among sponsored bills signed into law.", "for_whom": "People on probation or parole in California who face immigration enforcement through home checks.", "count": "Not counted.", "year": 2023, "program": "State legislation (Union and ACLU California Action)", "durability": "in_force", "contribution": "one_of_many", "counterfactual": "Author and coalition partners were essential. The sponsoring vehicle was ACLU California Action, which is shared across California affiliates (inference), so NorCal's own share cannot be isolated.", "others_involved": ["Sen. Susan Rubio", "ACLU California Action", "Other California ACLU affiliates"], "significance": 2, "evidence_quality": "self_reported_with_data", "evidence": "Sponsorship and the law's substance appear in advocacy materials and press. The signing date comes from one secondary snippet. In-force status is inferred from no evidence of repeal. Whether the ruse actually stopped: no evidence found. This is not 501(c)(3) work in the main.", "basis": "inference", "sources": [{"url": "https://californiainsider.com/news/new-california-law-prohibits-ice-agents-from-posing-as-probation-officers-5504045", "title": "California Insider"}, {"url": "https://aclucalaction.org/wp-content/uploads/2023/04/SB-852-PARTICIPANT-MATERIALS.pdf", "title": "SB 852 materials, ACLU California Action"}, {"url": "https://annualreport.aclunc.org", "title": "2023 annual report (search snippet)"}]}, {"rank": 9, "what_changed": "Fresno police K-9 records. A trial court ruled for the ACLU on May 19, 2025, and the Fifth District Court of Appeal affirmed on March 23, 2026. Fresno must produce canine use-of-force records with limited redaction.", "for_whom": "Fresno residents and anyone tracking police canine use.", "count": "Not applicable. $1,413 in costs awarded; fee award pending as of April 2026.", "year": 2026, "program": "Police practices (Foundation)", "durability": "too_early", "contribution": "lead", "counterfactual": "Without the suit, the city would likely have kept withholding records; it fought through appeal.", "others_involved": [], "significance": 1, "evidence_quality": "independently_verified", "evidence": "Local press report. Whether records were released, whether the city sought review, and whether the opinion is published were not established. If published, significance could rise to 2.", "basis": "evidence", "sources": [{"url": "https://gvwire.com/2026/04/07/aclu-wants-fresno-police-k-9-records-city-fights-and-loses-twice/", "title": "GV Wire, Apr 7, 2026"}]}], "failures_and_reversals": [{"what": "National TPS Alliance v. Noem. Judge Chen's March 2025 postponement and Sept 2025 summary judgment, affirmed by the Ninth Circuit in January 2026, were stayed by the Supreme Court in May and October 2025. Mullin v. Doe (June 25, 2026) held that the TPS statute bars review of non-constitutional claims. On Oct 5, 2026 the justices vacated a Ninth Circuit ruling on Venezuelan TPS.", "year": 2026, "consequence": "About 600,000 Venezuelans were covered by the challenged actions. Protection did not hold. The precedent is adverse beyond this case. MLex's excerpt does not name the case; matching it to this one is inference from SCOTUSblog's docket description.", "how_handled": "ACLU California affiliates remained among counsel per Wikipedia's account. NorCal's exact role was not established. No post-mortem found.", "basis": "evidence", "sources": [{"url": "https://en.wikipedia.org/wiki/National_TPS_Alliance_v._Noem", "title": "Wikipedia: National TPS Alliance v. Noem"}, {"url": "https://www.scotusblog.com/2026/07/trump-administration-asks-justices-to-have-lower-court-reconsider-protected-status-for-venezuela/", "title": "SCOTUSblog, July 2026"}, {"url": "https://www.mlex.com/pulse/articles/2529322", "title": "MLex, Oct 5, 2026"}, {"url": "https://www.morganlewis.com/pubs/2026/06/after-mullin-a-practical-guide-for-employers-with-tps-workers", "title": "Morgan Lewis on Mullin"}]}, {"what": "United Farm Workers v. Noem injunction lifted by the Ninth Circuit on Aug 24, 2026 because the district court had not properly assessed standing.", "year": 2026, "consequence": "Central Valley residents have no injunction in force pending remand. The defect was procedural, and a standing analysis was within the plaintiffs' side to press, though fault is not established. The merits are undecided.", "how_handled": "ACLU attorney says the law is unchanged and the group will return to court. Remand is under way.", "basis": "evidence", "sources": [{"url": "https://www.turlockjournal.com/news/crime/federal-court-temporarily-lifts-injunction-protecting-valley-from-sweeps-as-immigration-arrests-rise-in-stanislaus/", "title": "Turlock Journal"}, {"url": "https://www.newsmax.com/us/border-patrol-united-farm-workers-california/2026/08/24/id/1267199/", "title": "9th Circuit lifts block"}]}, {"what": "Coalition on Homelessness v. San Francisco: the Eighth Amendment part of the injunction was vacated on July 8, 2024 after Grants Pass. The settlement left sweeps intact and kept existing property policy.", "year": 2024, "consequence": "The main limit on encampment enforcement ended. The Fourth Amendment property portion survived, and that is what the 2025 settlement covers.", "how_handled": "The organization stressed that Grants Pass touched one of 13 claims, then settled. The December 2024 framework says it will 'explore' new protections.", "basis": "evidence", "sources": [{"url": "https://www.sf.gov/news-ninth-circuit-vacates-part-of-injunction-in-homeless-encampment-lawsuit", "title": "City of San Francisco, July 2024"}, {"url": "https://sfist.com/2024/07/08/ninth-circuit-clears-way-for-san-francisco-to-resume-encampment-sweeps", "title": "SFist, July 8, 2024"}, {"url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "title": "Forging Ahead, Dec 13, 2024"}]}, {"what": "Williams v. San Francisco: challenge to SFPD monitoring of 300+ Union Square cameras during 2020 protests. Judge Ulmer ruled for the city. A third-party summary says the Court of Appeal dismissed the appeal as moot after the Board of Supervisors adopted an ordinance approving the use. Supervisors also expanded police access to live feeds in 2022.", "year": 2023, "consequence": "Loss on the merits at trial level, no precedent on appeal, and the disputed practice was legislatively authorized. Opinion itself not read.", "how_handled": "Appealed with EFF. No later action found.", "basis": "evidence", "sources": [{"url": "https://sfstandard.com/politics/city-hall/judge-sides-with-sfpd-in-lawsuit-alleging-cops-spied-on-george-floyd-protesters/", "title": "SF Standard"}, {"url": "https://www.studicata.com/summaries/court-of-appeal-of-california/williams-v-city-of-san-francisco-2023-m0m7x3", "title": "Studicata summary"}, {"url": "https://kqed.org/news/11926357/despite-privacy-concerns-san-francisco-supervisors-expand-police-access-to-live-camera-feeds", "title": "KQED"}]}, {"what": "San Francisco Proposition E (March 2024), which the organization publicly campaigned against, was approved. Early returns showed about 60%. Proposition F, which the entity map records it opposing, passed with about 63% in early returns.", "year": 2024, "consequence": "SFPD gained easier use of drones and cameras without prior oversight approval, and reduced use-of-force reporting per the organization's account. Prior surveillance-oversight gains in San Francisco were cut back.", "how_handled": "Opponents said they would monitor implementation. No published campaign review found.", "basis": "evidence", "sources": [{"url": "https://aclunc.org/no-on-e", "title": "Vote No on Proposition E"}, {"url": "https://ballotpedia.org/San_Francisco,_California,_Proposition_E,_Limit_Police_Department_Administrative_Task_Time_and_Increase_Use_of_Camera_and_Drone_Technology_Initiative_(March_2024)", "title": "Ballotpedia"}, {"url": "https://www.kqed.org/news/11978236/propositions-e-and-f-in-san-francisco-appear-headed-for-victory", "title": "KQED, Mar 2024"}]}, {"what": "California Proposition 36 passed in November 2024. The executive director's post treats it as a setback calling for doubled-down criminal justice advocacy.", "year": 2024, "consequence": "A statewide criminal justice reform rollback in the affiliate's core area. Vote margin and the affiliate's campaign spending were not gathered; the opposition stance is inferred from the post.", "how_handled": "Named as a priority in the 2025-2028 framework, without measures.", "basis": "inference", "sources": [{"url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "title": "Forging Ahead, Dec 13, 2024"}]}, {"what": "Marin license-plate settlement apparently not honored: audit logs reported 254,131 sharing events in November 2024. Allegation by EFF and the affiliate, based on local reporting.", "year": 2026, "consequence": "If accurate, a 2022 'win' failed in practice within about two and a half years, and no one noticed for nearly two years after the logged sharing.", "how_handled": "Demand letter and records request on Oct 1, 2026. Outcome ata", "note": "Output.", "basis": "evidence"}, {"metric": "Opposed bills defeated or concerns resolved", "unit": "bills", "level": "outcome", "program": "Legislation", "series": [{"year": 2024, "value": 78, "value_text": "78 of 99, 'defeating or resolving our concerns'", "kind": "actual", "source_url": "https://www.aclunc.org/sites/default/files/2024-ACLUNorCal-annual-report-web-final-6-23-25.pdf"}], "definition_changes": null, "trend": "insufficient_data", "note": "The only outcome-level figure seen. Self-reported, and it merges defeat with amendment. Most bills die anyway, so attribution is weak. Bill list not seen.", "basis": "evidence"}, {"metric": "Bills sponsored", "unit": "bills", "level": "output", "program": "Legislation", "series": [{"year": 2023, "value": 16, "value_text": "16 sponsored", "kind": "actual", "source_url": "https://annualreport.aclunc.org"}], "definition_changes": null, "trend": "insufficient_data", "note": "The number signed in 2023 was not seen. Most ACLU bills are co-sponsored, per the organization's own statement.", "basis": "evidence"}, {"metric": "Members in Northern California", "unit": "people", "level": "output", "program": "Membership", "series": [{"year": 2025, "value": 120000, "value_text": "'over 120,000', '20% more than last year'", "kind": "actual", "source_url": "https://www.aclunorcal.org/app/uploads/2026/06/2025-ACLU-NorCal-annual-report.pdf"}], "definition_changes": "An undated page says 'more than 100,000', which fits the claim but cannot date it.", "trend": "insufficient_data", "note": "Unaudited. Members are not an outcome.", "basis": "evidence"}, {"metric": "Union program revenue, which the 2023 report labels memberships", "unit": "USD", "level": "output", "program": "Membership (501(c)(4))", "series": [{"year": 2020, "value": 6523601, "value_text": "$6,523,601", "kind": "actual", "source_url": "https://projects.propublica.org/nonprofits/organizations/942151925"}, {"year": 2021, "value": 7295996, "value_text": "$7,295,
