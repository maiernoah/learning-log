<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dossier</title>
<style>
/* ===== Noah's Weblog house style (exhibits) v2 =====
   Matches noahmaier.net: white page, Times for reading, Verdana for
   controls, blue underlined links, two-tone rules, gray beveled buttons. */
:root {
  --page: #ffffff;
  --ink: #000000;
  --ink-soft: #2b2b2b;
  --link: #0000ee;
  --visited: #551a8b;
  --active: #ff0000;
  --lo: #999999;          /* rule, border, axis */
  --hi: #e2e2e2;          /* rule highlight, gridline */
  --tint: #f2f2f2;        /* callout and table-header fill */
  --field: #6e6e6e;       /* input border */
  --btn: #c0c0c0;         /* button face */
  --btn-face: #dfdfdf;
  --btn-lo: #808080;
  --btn-dark: #0a0a0a;
  --new: #cc0000;
  /* data colors, in order: classic HTML named colors */
  --c1: #000080;  /* navy */
  --c2: #800000;  /* maroon */
  --c3: #008080;  /* teal */
  --c4: #808000;  /* olive (marks only; too light for text) */
  --c5: #800080;  /* purple */
  --c6: #008000;  /* green */
  --serif: "Times New Roman", Times, serif;
  --sans: Verdana, Geneva, Tahoma, sans-serif;
  --mono: "Courier New", Courier, monospace;
  --measure: 42.75rem;    /* one column width (684px): text, boxes, questions, tables, figures */
}
* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; padding: 10px 16px 32px; background: var(--page); color: var(--ink);
       font: 18px/1.45 var(--serif); -webkit-text-size-adjust: 100%; }
.page { max-width: 1020px; }
/* Text, boxes, questions, tables and figures share one column width, so their left and
   right edges line up. Add class="wide" only to something that genuinely needs more room. */
main p, main ul, main ol, main dl, main blockquote, main table, main fieldset, main figure,
main details, main .box, main h2, main h3, main .view > *, .prose { max-width: var(--measure); }
.wide { max-width: none !important; }
a { color: var(--link); } a:visited { color: var(--visited); } a:active { color: var(--active); }
:focus-visible { outline: 2px dotted var(--ink); outline-offset: 2px; }

h1 { font-size: 2.3em; line-height: 1.1; margin: 0.35em 0 0.15em; }
h2 { font-size: 1em; font-weight: bold; margin: 1.6em 0 0.7em; padding-bottom: 2px;
     border-bottom: 1px solid var(--lo); }
h3 { font-size: 1.15em; line-height: 1.25; margin: 1.2em 0 0.3em; }
p { margin: 0 0 0.8em; }
.dek { font-style: italic; margin: 0 0 0.5em; }
.nav { font: 13px/1.6 var(--sans); margin: 0; }
hr { border: 0; border-top: 1px solid var(--lo); border-bottom: 1px solid var(--hi);
     height: 0; margin: 10px 0 14px; }
code, pre, kbd { font-family: var(--mono); font-size: 0.9em; }

/* controls and small text use Verdana */
label, legend, button, input, select, textarea, table, figcaption, output, .ui, .meta {
  font-family: var(--sans); }
.ui, .meta, figcaption { font-size: 13px; line-height: 1.5; }
.meta { color: var(--ink-soft); }
p.meta { margin: 6px 0 12px; }

fieldset { border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi);
           margin: 0 0 16px; padding: 10px 12px 12px; min-width: 0; }
/* The legend sits inside the box as its first line, so long legends wrap cleanly
   instead of breaking through the border. */
legend { float: left; width: 100%; padding: 0; margin: 0 0 8px; font-size: 13px; font-weight: bold; }
legend + * { clear: both; }
label { font-size: 13px; }
.choices { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.choices label { display: inline-flex; align-items: center; gap: 5px; }
input[type=radio], input[type=checkbox], input[type=range] { accent-color: var(--c1); }

button {
  font-size: 13px; line-height: 1.2; color: #000; background: var(--btn);
  border: 0; border-radius: 0; padding: 6px 12px; cursor: pointer;
  box-shadow: inset -1px -1px var(--btn-dark), inset 1px 1px #fff,
              inset -2px -2px var(--btn-lo), inset 2px 2px var(--btn-face);
}
button:active, button[aria-pressed="true"] {
  box-shadow: inset 1px 1px var(--btn-dark), inset -1px -1px #fff,
              inset 2px 2px var(--btn-lo), inset -2px -2px var(--btn-face);
  padding: 7px 11px 5px 13px;
}
button:disabled { color: var(--btn-lo); text-shadow: 1px 1px #fff; cursor: default; }
button.primary { font-weight: bold; }

input[type=text], input[type=number], input[type=search], input[type=email],
select, textarea {
  font-size: 14px; color: var(--ink); background: #fff; border: 1px solid var(--field);
  border-radius: 0; box-shadow: inset 1px 1px 0 #b4b4b4; padding: 4px 6px;
}

table { border-collapse: collapse; font-size: 13px; line-height: 1.4; }
main table { width: 100%; }
th, td { border: 1px solid var(--lo); padding: 4px 8px; text-align: left; vertical-align: top; }
th { background: var(--tint); }

.box { background: var(--tint); box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi);
       padding: 8px 10px; margin: 0 0 1em; font: 13px/1.5 var(--sans); }
.result { font-size: 1.15em; }
.result strong { font-variant-numeric: tabular-nums; }

.meter { height: 16px; background: #fff; border: 1px solid var(--field);
         box-shadow: inset 1px 1px 0 #b4b4b4; }
.meter > div { height: 100%; width: 0; background: var(--c1); }

footer address { font-style: normal; font-size: 0.85em; }

@media (max-width: 780px) { body { font-size: 17px; padding: 8px 16px 28px; } h1 { font-size: 1.8em; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media print { .nav { display: none; } }

/* ===== Dossier: page-specific rules, house variables only ===== */
.shell { display: grid; grid-template-columns: minmax(0, 1fr) 256px; gap: 32px; align-items: start; }
.shell > main { min-width: 0; }
.menu { position: sticky; top: 10px; }
.menu fieldset { margin: 0 0 12px; }
.menu ol { margin: 0; padding-left: 22px; font: 13px/1.7 var(--sans); }
.menu ol a[aria-current="true"] { color: var(--ink); font-weight: bold; text-decoration: none; }
.menu .n { color: var(--ink-soft); font-size: 11px; margin-left: 6px; }
.menu .meta { margin: 8px 0 0; font-size: 11px; }
.filter .opts label { display: block; margin: 2px 0; }
section.page { display: none; }
section.page.active { display: block; }
.notice { font: 13px/1.5 var(--sans); background: var(--tint); box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); padding: 8px 10px; margin: 0 0 14px; max-width: none; }
.notice strong { font-weight: bold; }
h1 { font-size: 2.1em; }
.sub { font: 13px/1.5 var(--sans); color: var(--ink-soft); margin: 0 0 14px; }
.lede { font-size: 1.15em; line-height: 1.4; margin: 10px 0 14px; }
.prose p { margin: 0 0 0.8em; }
.pre { white-space: pre-wrap; }
.muted { color: var(--ink-soft); }
.small { font: 13px/1.5 var(--sans); }
.row { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; }
.empty { border: 1px dashed var(--lo); padding: 10px 12px; font: 13px/1.5 var(--sans); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: none; }
.two h3:first-child { margin-top: 0.6em; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 16px; font: 13px/1.5 var(--sans); margin: 8px 0 12px; }
.kv div:nth-child(odd) { color: var(--ink-soft); }
/* tags */
.b { display: inline-block; font: 11px/1.4 var(--sans); padding: 0 4px; border: 1px solid var(--lo); color: var(--ink-soft); vertical-align: middle; white-space: nowrap; background: #fff; }
.b.evidence { color: var(--c1); border-color: var(--c1); }
.b.inference { color: var(--c3); border-color: var(--c3); }
.b.speculation { color: var(--c2); border-color: var(--c2); }
.b.red { color: var(--c2); border-color: var(--c2); }
.b.amber { color: var(--ink); border-color: var(--c4); border-left-width: 4px; }
.b.green { color: var(--c6); border-color: var(--c6); }
.b.na { color: var(--ink-soft); }
.light { display: inline-block; width: 10px; height: 10px; vertical-align: middle; margin-right: 6px; background: var(--lo); border: 1px solid var(--field); }
.light.red { background: var(--c2); } .light.amber { background: var(--c4); } .light.green { background: var(--c6); } .light.na { background: var(--hi); }
.conf { font: 11px/1.4 var(--sans); color: var(--ink-soft); }
/* claims */
.claim { border-left: 3px solid var(--lo); padding: 4px 0 4px 12px; margin: 10px 0; }
.claim[data-basis="evidence"] { border-left-color: var(--c1); }
.claim[data-basis="inference"] { border-left-color: var(--c3); }
.claim[data-basis="speculation"] { border-left-color: var(--c2); }
.claim .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 2px; font-size: 0.95em; }
.claim .body { white-space: pre-line; }
.claim .src { font: 12px/1.5 var(--sans); color: var(--ink-soft); margin-top: 3px; }
.hidden-by-filter { display: none !important; }
.redact { background: var(--ink); color: transparent; cursor: pointer; }
.redact:hover, .redact:focus, .redact.open { background: transparent; color: inherit; }
/* tables */
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.wrap { white-space: normal; }
tr.flag-red td:first-child { color: var(--c2); }
/* cover */
.cover-grid { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 24px; align-items: start; max-width: none; }
.stamp { border: 3px double var(--ink); padding: 10px 14px; display: inline-block; min-width: 180px; }
.stamp .n { font-size: 2.6em; line-height: 1; font-weight: bold; font-variant-numeric: tabular-nums; }
.stamp .g { font: 13px/1.4 var(--sans); margin-top: 4px; }
.stamp .l { font: 11px/1.4 var(--sans); color: var(--ink-soft); margin-top: 6px; }
.failure { background: var(--tint); box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); padding: 12px 14px; margin: 14px 0; }
.failure .t { font: 12px/1.4 var(--sans); color: var(--ink-soft); margin-bottom: 6px; }
.failure .f { font-size: 1.25em; line-height: 1.3; }
.failure .m { margin-top: 8px; font-size: 0.95em; }
.boot { display: none; }
/* score bars */
.bars { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 6px 12px; align-items: center; max-width: var(--measure); font: 13px/1.5 var(--sans); }
.bars .track { height: 14px; background: #fff; border: 1px solid var(--field); box-shadow: inset 1px 1px 0 #b4b4b4; }
.bars .fill { height: 100%; background: var(--c1); }
.bars .v { font-variant-numeric: tabular-nums; }
/* chart */
.chart-wrap { margin: 8px 0; position: relative; max-width: none; }
.chart-wrap svg { width: 100%; height: auto; display: block; font-family: var(--sans); }
.legend { display: flex; gap: 16px; font: 12px/1.5 var(--sans); margin: 4px 0 0; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
.tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--field); padding: 3px 6px; font: 12px/1.4 var(--sans); display: none; white-space: nowrap; z-index: 3; }
/* ratio boxes */
.ratios { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin: 8px 0; max-width: none; }
.ratio { border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi); padding: 8px 10px; }
.ratio.red { border-left: 4px solid var(--c2); } .ratio.amber { border-left: 4px solid var(--c4); }
.ratio .l { font: 12px/1.4 var(--sans); min-height: 2.8em; }
.ratio .v { font-size: 1.6em; line-height: 1.1; font-weight: bold; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
.ratio .v small { font: 12px var(--sans); font-weight: normal; margin-left: 3px; }
.ratio .f { font: 11px/1.4 var(--sans); color: var(--ink-soft); }
.ratio .why { font: 12px/1.45 var(--sans); margin-top: 6px; }
.range { position: relative; height: 16px; margin: 2px 0; }
.range .tr { position: absolute; left: 0; right: 0; top: 7px; height: 1px; background: var(--lo); }
.range .band { position: absolute; top: 4px; height: 7px; background: var(--tint); border: 1px solid var(--lo); }
.range .med { position: absolute; top: 2px; width: 1px; height: 12px; background: var(--ink); }
.range .me { position: absolute; top: 3px; width: 9px; height: 9px; background: var(--c1); margin-left: -4px; }
/* scenarios */
.quad { display: grid; grid-template-columns: auto 1fr 1fr; grid-template-rows: auto 1fr 1fr auto; gap: 6px; max-width: none; margin: 12px 0; }
.quad .ax { font: 12px/1.4 var(--sans); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px; }
.quad .ax.y { writing-mode: vertical-rl; transform: rotate(180deg); max-height: 420px; overflow: hidden; }
.q { text-align: left; min-height: 120px; display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; font: 13px/1.4 var(--sans); }
.q .nm { font: 1.1em/1.25 var(--serif); }
.q .qd { font-size: 11px; color: var(--ink-soft); }
.q .tag { font-size: 11px; font-weight: bold; color: var(--c2); }
.q .rd { margin-top: auto; font-size: 11px; color: var(--ink-soft); }
.scen-detail { border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi); padding: 10px 12px 12px; margin: 0 0 16px; }
.dots { letter-spacing: 1px; color: var(--c1); }
.dots .off { color: var(--hi); }
/* expanders */
details { border: 1px solid var(--lo); margin: 8px 0; }
summary { cursor: pointer; padding: 8px 10px; list-style: none; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
summary::-webkit-details-marker { display: none; }
summary .r { font: bold 13px var(--sans); color: var(--c1); }
summary .fm { }
summary .pr { font: 12px/1.4 var(--sans); color: var(--ink-soft); white-space: nowrap; }
details[open] summary { border-bottom: 1px solid var(--lo); background: var(--tint); }
details .in { padding: 6px 12px 12px 48px; }
.chain li { font-size: 0.9em; }
.q-status { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--hi); }
.q-status .qq { font-weight: bold; margin-bottom: 2px; }
.q-status .aa { }
.statusline { font: 0.85em/1.5 var(--serif); margin-top: 24px; }
.statusline span + span::before { content: " · "; }
button.b { font: 12px var(--sans); padding: 5px 10px; }
@media (max-width: 780px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .menu { position: static; }
  .cover-grid, .two { grid-template-columns: 1fr; }
  .quad { grid-template-columns: 1fr; grid-template-rows: auto; }
  .quad .ax { display: none; }
  .quad .q { grid-column: auto !important; grid-row: auto !important; }
}
@media print {
  .nav, .menu, .statusline, #print-brief, .notice { display: none !important; }
  .shell { display: block; }
  section.page { display: none !important; } section.page#sec-brief { display: block !important; }
  body { font-size: 12px; } h1 { font-size: 1.7em; } .lede { font-size: 1.05em; }
  .cover-grid { grid-template-columns: 1fr 160px; }
  a { color: var(--ink); text-decoration: none; }
}

/* ===== polish pass: same palette and type, finer rhythm ===== */
body { line-height: 1.5; }
.page { max-width: 1040px; }
header h1 { font-size: 2.2em; letter-spacing: -0.01em; margin-bottom: 0.1em; }
header .dek { font-size: 0.95em; color: var(--ink-soft); }
.notice { padding: 9px 12px; line-height: 1.55; border-left: 3px solid var(--lo); box-shadow: none; }
.shell { gap: 40px; }
.shell > main > section > h1 { font-size: 1.75em; margin: 0.2em 0 0.1em; }
.sub { margin: 0 0 18px; }
h2 { font-size: 0.85em; letter-spacing: 0.02em; color: var(--ink-soft); margin: 2em 0 0.8em; padding-bottom: 3px; }
h3 { font-size: 1.05em; margin: 1.3em 0 0.35em; }
.prose, .lede, .pre, .claim .body, .failure, details .in p { max-width: var(--measure); }
.lede { font-size: 1.2em; line-height: 1.42; }
/* tables: horizontal rules only, numbers aligned, tinted head */
table { font-size: 12.5px; line-height: 1.45; margin: 6px 0 10px; }
main table { max-width: none; }
td.wrap { min-width: 9em; }
th, td { border: 0; border-bottom: 1px solid var(--hi); padding: 6px 10px 6px 0; }
th { border-bottom: 1px solid var(--lo); background: transparent; font-weight: bold; color: var(--ink-soft); }
tr:last-child td { border-bottom: 1px solid var(--lo); }
/* health panel on the cover */
.health { border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi); padding: 12px 14px 10px; font: 12.5px/1.45 var(--sans); }
.health .n { font: bold 3em/1 var(--serif); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.health .n small { font: 13px var(--sans); color: var(--ink-soft); margin-left: 6px; letter-spacing: 0; }
.health .g { margin: 4px 0 10px; color: var(--ink-soft); }
.health table { margin: 0; font-size: 12px; }
.health td { padding: 3px 0; border-bottom: 1px solid var(--hi); }
.health td.num { padding-left: 10px; }
.health tr:last-child td { border-bottom: 0; }
.health .bar { height: 5px; background: var(--hi); margin-top: 3px; }
.health .bar > i { display: block; height: 100%; background: var(--c1); }
.stamp { display: none; }
.failure { padding: 14px 16px; margin: 18px 0; border-left: 3px solid var(--c2); box-shadow: none; }
.failure .f { font-size: 1.3em; }
.kv { gap: 4px 18px; margin: 12px 0 16px; }
/* claims */
.claim { padding: 2px 0 2px 12px; margin: 12px 0; }
.claim .head { font: 12px/1.5 var(--sans); gap: 6px; }
.b { font-size: 10.5px; padding: 0 5px; }
/* ratio cards */
.ratios { gap: 12px; }
.ratio { padding: 10px 12px 10px; background: #fff; }
.ratio .l { font-size: 12px; color: var(--ink-soft); min-height: 2.6em; }
.ratio .v { font-size: 1.75em; margin: 6px 0 2px; }
.ratio .why { color: var(--ink); }
/* scenario tiles as panels, not buttons */
.quad { gap: 8px; }
button.q, button.q:active, button.q[aria-pressed="true"] { background: #fff; color: var(--ink); border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi); padding: 12px 14px; }
button.q:hover { border-color: var(--field); }
button.q[aria-pressed="true"] { border-color: var(--c1); box-shadow: inset 3px 0 0 var(--c1), inset 1px 1px 0 var(--hi); }
.q .nm { font-size: 1.15em; }
.q .qd { font-size: 10.5px; }
.scen-detail { padding: 14px 16px 16px; }
/* expanders */
details { border: 0; border-top: 1px solid var(--hi); margin: 0; }
details:last-of-type { border-bottom: 1px solid var(--hi); }
summary { padding: 10px 4px; grid-template-columns: 28px minmax(0, 1fr) auto; }
summary .r { color: var(--c1); }
summary .fm { font-size: 1.05em; }
details[open] summary { background: transparent; border-bottom: 0; }
details .in { padding: 0 4px 14px 32px; }
/* score bars */
.bars { gap: 7px 14px; }
.bars .track { height: 9px; box-shadow: none; border-color: var(--lo); }
/* contents */
.menu fieldset { padding: 10px 12px 10px; }
.menu ol { line-height: 1.8; }
.menu .n { font-size: 10.5px; }
/* footer */
.statusline { line-height: 1.55; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="brand-name">Dossier</h1>
    <p class="dek" id="brand-sub"></p>
    <p class="nav" id="topnav"></p>
    <hr>
  </header>
  <p class="notice" id="stripe"><span id="stripe-l"></span> <span id="stripe-r"></span></p>
  <div class="shell">
    <main id="main"></main>
    <aside class="menu" aria-label="Contents">
      <fieldset><legend>Contents</legend><ol id="nav"></ol></fieldset>
      <fieldset class="filter"><legend>Show claims tagged</legend>
        <div class="opts">
          <label><input type="radio" name="basis" value="3" checked> evidence, inference, speculation</label>
          <label><input type="radio" name="basis" value="2"> evidence and inference</label>
          <label><input type="radio" name="basis" value="1"> evidence only</label>
        </div>
      </fieldset>
      <p class="meta" id="meta"></p>
    </aside>
  </div>
  <footer>
    <hr>
    <address class="statusline" id="status"></address>
  </footer>
</div>
<script>

rn California\" is a brand covering two separately incorporated California nonprofits, inside the national ACLU federation.\n\n1. ACLU Foundation of Northern California, EIN 94-0279770, 501(c)(3). FYE 3/2025: revenue $21,840,462, expenses $19,816,451, assets $49,296,244 (evidence: ProPublica). Gifts are deductible. The organization says deductible gifts fund litigation and public education (evidence: FAQ).\n2. American Civil Liberties Union of Northern California, EIN 94-2151925, 501(c)(4). FYE 3/2025: revenue $9,584,433, expenses $6,148,837, assets $18,051,936 (evidence: ProPublica). Not deductible. The organization says membership gifts fund political advocacy and lobbying (evidence: FAQ).\n\nControl: there is no evidence of a parent-subsidiary relationship between the two. They have separate boards with the same chair and 9 shared directors, out of 16 (Foundation) and 24 (501(c)(4)) listed (count is inference from the board page). They share staff: the same executives appear on both 990s with pay split between them, and the Foundation carries most of it (evidence: ProPublica). The audits are issued on a combined basis as \"ACLU Foundation and Union of Northern California\" (evidence: financial reports page). Treating the pair as one operating organization is an inference from those facts.\n\nNational layer: the organization says gifts are shared between a donor's home office and the national ACLU (evidence: FAQ). Historic charts show a national share of $4,808,577 and $3,566,178 in the 2013 and 2014 reports (evidence: search snippets, not opened). No evidence found of the current split formula or the FY25 dollar amount.\n\nLimit on this map: the FY24 and FY25 audits and the 990 PDFs were fetched but returned as unreadable compressed data. The audit notes, Schedule R and Schedule I were therefore not read. Inter-entity transfers and the exact national flow are unverified.", "affiliated_entities": [{"name": "American Civil Liberties Union of Northern California", " 70"}, {"url": "https://projects.propublica.org/nonprofits/organizations/136213516", "title": "ProPublica: EIN 13-6213516"}, {"url": "https://www.aclunc.org/sites/default/files/financial_charts_from_2014_annual_report.pdf", "title": "Financial charts, 2014 annual report"}, {"url": "https://www.aclunc.org/sites/default/files/financial_charts_from_2013_annual_report.pdf", "title": "Financial charts, 2013 annual report"}, {"url": "https://en.wikipedia.org/wiki/American_Civil_Liberties_Union", "title": "Wikipedia: American Civil Liberties Union"}]}, {"name": "American Civil Liberties Union, Inc. (national 501(c)(4))", "ein": null, "relationship": "National membership and lobbying body (inference from the federation's structure). EIN not confirmed in this research.", "money_and_control": "NorCal's 2022-23 report says membership acquisition and renewal costs for national and NorCal appear on the national ACLU's statements (evidence: search snippet, not opened). That implies national runs or books shared membership fundraising (inference).", "sources": [{"url": "https://annualreport.aclunc.org/wp-content/uploads/2023/07/Financial-spread-2022-ACLU-NorCal-An-Rpt-financials-7-19-23.pdf", "title": "Financial spread, 2022 ACLU NorCal annual report (snippet only; fetch failed on a certificate error)"}, {"url": "https://grantable.co/funders/american-civil-liberties-union-inc-morg_6e566c8bd7294f53a624405e6951c753", "title": "Grantable: American Civil Liberties Union Inc"}]}, {"name": "ACLU California Action", "ein": null, "relationship": "Statewide ACLU advocacy organization with its own executive director (evidence). Its role as a joint vehicle of California affiliates, including NorCal, is speculation; no document confirming it was read. Reported revenue is $3,824,959, year unconfirmed (evidence: search snippet).", "money_and_control": "Payments from NorCal and governance links: no evidence found. Check Schedule R on the 501(c)(4) 990.", "sources": [{"url": "https://aclucalaction.org/2024/04/aclu-california-welcomes-david-trujillo-as-executive-director/", "title": "ACLU California Welcomes David Trujillo as Executive Director"}]}], "donor_check_goes_to": "ACLU Foundation of Northern California, EIN 94-0279770, 39 Drumm Street, San Francisco, CA 94111, Attn: Development Department (evidence: corporate giving page for the address; donor FAQ snippet and other listings for the tax ID). This is the deductible route and the right payee for most donors.\n\nThree traps:\n1. A check or \"membership\" payment to \"ACLU of Northern California\" goes to the 501(c)(4) and is not deductible (evidence).\n2. Some online forms sit on action.aclu.org, the national platform. The FAQ snippet says tribute gifts processed on the national form are not deductible (evidence: snippet; the fetched FAQ text was truncated and did not show this line). Confirm the receiving entity before giving online.\n3. Even a gift to the right entity may be shared with national, because the FAQ says gifts are shared (evidence). A major donor should ask in writing whether a restricted or major gift is exempt from sharing. No evidence found either way.", "mission_statement": "\"The ACLU of Northern California is an enduring guardian of justice, fairness, equality, and freedom, working to protect and advance civil rights and civil liberties for all Californians.\" (aclunorcal.org/about, undated; reassembled from two consecutive quoted fragments returned by the fetch tool.) A job posting states it differently: \"Our mission is to ensure that Constitutional rights don't just exist on paper, but are protected in practice.\"", "what_they_actually_do": "A civil-liberties law and advocacy shop covering Northern California, focused on government conduct. The organization says it \"focuses primarily on government action and inaction\" and acts against private entities less often (evidence: about page).\n\nOutputs (evidence: site navigation and staff page):\n- Litigation and amicus briefs\n- Appellate advocacy\n- State and local legislation and ballot positions, such as opposing San Francisco's Proposition F\n- Know-your-rights materials and reports\n- Community organizing through chapters\n\nNamed projects include Criminal Law & Immigration and Democracy, Speech & Technology. Listed issues include immigrants' rights, police practices, privacy and technology, reproductive justice, voting rights and rights of unhoused people.\n\nIt serves people in Northern California through impact cases and policy work, plus a \"Need Legal Help?\" intake channel. It is not primarily a direct legal-services provider (inference from the site structure). The volume of cases and outcomes was not assessed here; that belongs to the deep scan.", "size": {"staff": "117 employees at the Foundation, 2025 (evidence, secondary: CauseIQ). No organization-stated headcount found on the about, staff, financial or job pages read.", "budget": "No organization-stated budget found. From filings, FYE 3/2025: Foundation expenses $19,816,451; 501(c)(4) expenses $6,148,837. Simple sum about $26.0M expenses and $31.4M revenue (inference: my arithmetic, does not eliminate transfers between the entities, so it may overstate the true combined figure).", "as_stated_by": "Form 990 data via ProPublica for dollars; CauseIQ for staff. Neither figure is stated by the organization in material read. The combined audit could not be read."}, "leadership": [{"name": "Abdi Soltani", "title": "Executive Director", "since": "2009", "footprint": [{"url": "https://www.aclunorcal.org/bios/abdi-soltani/", "title": "ACLU NorCal bio"}, {"url": "https://pastforward.org/blogs/public-podcasting/abdi-soltani", "title": "PastForward podcast interview (undated in results)"}]}, {"name": "Shilpi Agarwal", "title": "Legal Director", "since": null, "footprint": [{"url": "https://www.aclunorcal.org/bios/shilpi-agarwal/", "title": "ACLU NorCal bio"}, {"url": "https://aclu.org/bio/shilpi-agarwal", "title": "ACLU News & Commentary a ucker, von Emster, Wan (inference from the two lists). Officers: Magan Ray, Vice Chair; Anthony Wan, Treasurer and Finance & Investment Committee Chair; Marina Hsieh, National Delegate; Zainab Ramahi, Affiliate Equity Officer.\n\nConflict: the FY25 990s (FYE 3/2025) name Adam Bailey as chair, and a search snippet of the older aclunc.org board page also shows Bailey. The current page shows Stuart. This reads as a recent handover (inference); the start date was not found. No independent source was found confirming Stuart as chair.\n\nExecutive roster change: the FY25 990s list Duc Le as COO. The current staff page lists no COO, and the Director of Administration role appears new as of 2025. Whether the role was replaced was not confirmed."}, "identity_confidence": 0.97, "resolution_notes": "Identity is settled. The website hint redirects to the organization's current domain. The Foundation EIN 94-0279770 matches across the donor FAQ snippet, ProPublica, Charity Navigator and CauseIQ. The 501(c)(4) EIN 94-2151925 matches ProPublica and CauseIQ. The name search supplied no candidate records, but both ProPublica organization pages exist and were read.\n\nThe main risk is not picking the wrong organization. It is that the donor's label covers two entities, and the check's payee decides which one gets the money. I resolved the assessed entity to the 501(c)(3) because that is the standard deductible giving route; the 501(c)(4) should be read alongside it.\n\nFounding date: 1934 is the affiliate's own stated date. The legal entities have later IRS exemption dates: October 1962 (Foundation) and April 1972 (501(c)(4)), both per ProPublica. CauseIQ's \"formed 1972\" for the Foundation conflicts with this, and I treat it as unreliable. Incorporation dates were not found.\n\nOffices: 39 Drumm St, San Francisco is confirmed. CauseIQ also lists Fresno and Sacramento, and a recruiting page mentions Fresno. Nothing primary was read confirming Sacramento.\n\nNot done or not read:\n- C tors for review before filing. | Form 990, Part VI, Section B, Line 12c | Each board member (and certain non-director members of board advisory committees) is required to complete a conflict of interest disclosure form annually, to update the form if circumstances change during the year, and to disclose in real time any conflict of interest that arises in a given meeting.At the beginning of every meeting, the Chair reminds directors of the conflict of interest policy and to disclose or recuse themselves in instances of any conflicts. In addition, the General Counsel maintains the director conflict of interest disclosure forms, reviews them with the Audit and Compliance Committee Chair, and identifies potential conflicts that require either director disclosure or recusal. The General Counsel and the Audit and Compliance Committee Chair advise and consult with the Chair and directors in these situations. | Form 990, Part VI, Section B, Line 15a | Employees are compensated by the ACLU NC Foundation under the terms of the Resource Sharing Agreement. The ACLU NC Foundation Board of Directors works through its Personnel Committee to set the salary and bonus for the Executive Director based on a review process, consultation of a salary survey, and sometimes consulting with independent experts. In addition, the compensation of the Executive Director and Key Employees are subject to the terms of the budget set each year by the ACLU NC Foundation Board of Directors. | Form 990, Part VI, Section B, Line 15b | Employees are compensated by the ACLU NC Foundation under the terms of the Resource Sharing Agreement. The ACLU NC Foundation Board of Directors works through its Personnel Committee to set the salary and bonus for the Executive Director based on a review process, consultation of a salary survey, and sometimes consulting with independent experts. In addition, the compensation of the Executive Director and Key Employees are subject to the terms of the budget set each year by the ACLU NC Foundation Board of Directors. | Form 990, Part VI, Section C, Line 19 | Financial Statements are posted to ACLU NC Union website and are available upon request. | For Paperwork Reduction Act Notice, see the Instructions for Form 990 or 990-EZ. | Cat. No. 51056K | Schedule O (Form 990) (Rev. 1-2025) | Additional Data | Software ID: | 24020490 | Software Version: | 2024v5.2 | ", "schedules_present": ["ScheduleO", "ScheduleJ", "ScheduleR"]}]}, {"entity": {"ein": "13-6213516", "name": "American Civil Liberties Union Foundation Inc", "city": "New York", "state": "NY", "ntee_code": "R600", "subsection": 3, "ruling_date": "1967-03-01", "address": "125 BROAD STREET", "profile_url": "https://projects.propublica.org/nonprofits/organizations/136213516", "years": [{"year": 2025, "source": "propublica_page", "revenue": 306750536, "expenses": 245542362, "assets": 961853261, "liabilities": 182163108, "full_filing_url": "https://projects.propublica.org/nonprofits/organizations/136213516/202533449349300343/full", "fiscal_year_end": "March", "exec_comp": 4245540, "people": [{"name": "Mark V Wier", "title": "Chief Development Officer", "compensation": 520123, "related": 0, "other": 68959, "total": 589082}, {"name": "Kary Moss", "title": "National Director Of Affiliates Support & Nationwide Initiatives", "compensation": 498809, "related": 0, "other": 148185, "total": 646994}, {"name": "Kriston Mcintosh", "title": "Chief Communications & Marketing Officer", "compensation": 435187, "related": 0, "other": 24263, "total": 459450}, {"name": "Louise Melling", "title": "Deputy Legal Director, Center For Liberty", "compensation": 363528, "related": 0, "other": 91398, "total": 454926}, {"name": "Elizabeth Fitzgerald", "title": "Director Of Development", "compensation": 353947, "related": 0, "other": 99151, "total": 453098}, {"name": "Miriam Cader", "title": "Deputy Legal Director", "compensation": 329085, "related": 0, "other": 72600, "total": 401685}, {"name": "Mohammad Zaidi", IN PUBLIC EDUCATION CAMPAIGNS. IN ADDITION, THE ACLU DEVELOPS POLICY RELATING TO POSITIONS ON CIVIL LIBERTIES ISSUES. EXPENSES $9,381,047. INCLUDING GRANTS OF $4,710,919. REVENUE $0. CIVIL LIBERTIES POLICY FORMULATION - THE BOARD OF DIRECTORS OF THE ACLU WORKS THROUGH ITS STANDING AND SPECIAL COMMITTEES TO ANALYZE CIVIL LIBERTIES ISSUES AND, WHERE APPROPRIATE, TO DEVELOP POLICIES THAT WILL SERVE AS THE FRAME OF REFERENCE FOR LEGISLATIVE, EDUCATIONAL AND CASE-SPECIFIC WORK AT THE NATIONAL LEVEL, AND THE ORGANIZATION IMPLEMENTS AND ASSISTS IN THE DEVELOPMENT OF POLICY GOALS THROUGH ITS AFFILIATES. EXPENSES $1,923,302. INCLUDING GRANTS OF $3,750. REVENUE $0. | Form 990, Part VI, Line 7a Members or stockholders electing members of governing body | ACLU FOUNDATION'S MEMBERS ELECT THE BOARD DIRECTORS OF ACLU FOUNDATION. | Form 990, Part VI, Line 7b Decisions requiring approval by members or stockholders | ACLU HAS THE AUTHORITY TO AMEND ITS BYLAWS, AND UNDER NEW YORK LAW, ACLU HAS THE RIGHT TO APPROVE A DECISION BY THE BOARD TO DISSOLVE, MERGE/CONSOLIDATE WITH ANOTHER ORGANIZATION OR DISPOSE OF ALL OR SUBSTANTIALLY ALL OF THE ORGANIZATION'S ASSETS. | Form 990, Part VI, Line 11b Review of form 990 by governing body | THE FORM 990 WAS PREPARED BY MANAGEMENT IN CONSULTATION WITH THE ORGANIZATION'S OUTSIDE ACCOUNTANTS. THE ORGANIZATION'S AUDIT COMMITTEE REVIEWED A DRAFT OF THE 990 AND PROVIDED COMMENTS. A COMPLETE COPY OF THE FORM 990 WAS PROVIDED TO THE ORGANIZATION'S GOVERNING BODY BEFORE IT WAS FILED. | Form 990, Part VI, Line 12c Conflict of interest policy | THE ORGANIZATION DISTRIBUTES ITS CONFLICT OF INTEREST POLICY ON AN ANNUAL BASIS TO EVERY KEY EMPLOYEE, OFFICER, BOARD DIRECTOR AND STANDING COMMITTEE MEMBER AND REQUESTS DISCLOSURE OF ANY POTENTIAL CONFLICTS OF INTEREST. THE DEPUTY EXECUTIVE DIRECTOR/GENERAL COUNSEL OF THE ORGANIZATION REVIEWS ANY DISCLOSURES MADE DURING THIS ANNUAL REVIEW. IF A MATTER IS RAISED THAT MAY BE A CONFLICT OF INTEREST INVOLVING A BOARD MEMBER, AN OFFICER OR A STANDING COMMITTEE MEMBER, DEPUTY EXECUTIVE DIRECTOR/GENERAL COUNSEL REFERS THE MATTER TO THE BOARD PRESIDENT AND APPROPRIATE FOLLOW UP IS UNDERTAKEN AS SET FORTH IN THE POLICY. IF A MATTER IS RAISED THAT MAY BE A CONFLICT OF INTEREST INVOLVING A KEY EMPLOYEE, DEPUTY EXECUTIVE DIRECTOR/GENERAL COUNSEL REFERS THE MATTER TO THE EXECUTIVE DIRECTOR OR THEIR DESIGNEE AND APPROPRIATE FOLLOW UP IS UNDERTAKEN AS SET FORTH IN THE POLICY. BOARD DIRECTORS, OFFICERS, STANDING COMMITTEE MEMBERS AND KEY EMPLOYEES ALSO MAY REPORT TO THE BOARD ANY POTENTIAL CONFLICTS OF INTEREST THAT ARISE DURING THE YEAR. THE ORGANIZATION'S CONFLICT OF INTEREST POLICY REQUIRES, AMONG OTHER THINGS, THAT INDIVIDUALS WITH CONFLICTS OF INTEREST WITH RESPECT TO A TRANSACTION OR ACTION MAY NOT PARTICIPATE IN THE DECISION-MAKING WITH RESPECT TO THAT TRANSACTION OR ACTION AND IN SOME CIRCUMSTANCES MAY NOT PARTICIPATE IN THE DISCUSSION. | Form 990, Part VI, Line 15a Process to establish compensation of top management official | THE EXECUTIVE DIRECTOR/CEO, OFFICERS AND VARIOUS KEY EMPLOYEES ARE NOT PAID BY AMERICAN CIVIL LIBERTIES UNION FOUNDATION, INC. COMPENSATION IS PAID DIRECTLY BY AMERICAN CIVIL LIBERTIES UNION, INC., A RELATED 501(C)(3) ORGANIZATION, AND SALARY EXPENSE IS ALLOCATED TO THE FILING ORGANIZATION. ACLU AND AMERICAN CIVIL LIBERTIES UNION FOUNDATION HAVE ESTABLISHED THE FOLLOWING PROCEDURES TO DETERMINE THE COMPENSATION OF THESE INDIVIDUALS: THE BOARD OF THE ORGANIZATION AND THE EXECUTIVE COMMITTEE OF THE ACLU BOARD ESTABLISH THE EXECUTIVE DIRECTOR/CEO'S COMPENSATION. THE ORGANIZATION'S AUDIT COMMITTEE APPROVES THE COMPENSATION OF ITS KEY EMPLOYEES AND OFFICERS AS RECOMMENDED BY THE EXECUTIVE DIRECTOR/CEO. NO MEMBER OF THE BOARD OF THE ORGANIZATION, THE EXECUTIVE COMMITTEE OF THE ACLU OR EITHER ORGANIZATION'S AUDIT COMMITTEE (EACH A \"LAY LEADER BODY\") HAS A CONFLICT OF INTEREST WITH RESPECT TO THE COMPENSATION ARRANGEMENT. EACH LAY LEADER BODY REVIEWS COMPENSATION STUDIES AND COMPARABLE COMPENSATION DATA FOR FUNCTIONALLY COMPARABLE POSITIONS AT SIMILARLY SITUATED ORGANIZATIONS. EACH LAY LEADER BODY CONTEMPORANEOUSLY DOCUMENTS AND RECORDS, IN ITS MINUTES, ITS DELIBERATIONS AND DECISIONS. NO ACLU OFFICER RECEIVES COMPENSATION IN THEIR CAPACITY AS A DIRECTOR. | Form 990, Part VI, Line 19 Required documents available to the public | UPON REQUEST, THE ORGANIZATION WILL MAKE AVAILABLE THE 990S AND FINANCIAL STATEMENTS FOR SEVERAL YEARS, BYLAWS, CONFLICT OF INTEREST POLICY AND APPLICATION FOR TAX EXEMPT STATUS WHICH ARE REQUIRED TO BE DISCLOSED UNDER THE PUBLIC INSPECTION LAWS. THESE DOCUMENTS ARE ALSO AVAILABLE ON THE ACLU'S WEBSITE. | Form 990, Part VII, Section A, Line 1a, Column (B) | THE NUMBER OF HOURS REPORTED FOR THOSE INDIVIDUALS RECEIVING COMPENSATION IS BASED ON WEEKLY HOURS FOR PAYROLL PURPOSES. THE ACTUAL NUMBER OF HOURS WORKED IS CONSIDERABLY HIGHER. | Form 990, Part VIII, Line 11d Other Miscellaneous Revenue | TUITION & FEES - Total Revenue: 441245, Related or Exempt Function Revenue: 0, Unrelated Business Revenue: 0, Revenue Excluded from Tax Under Sections 512, 513, or 514: 441245; | Form 990, Part XI, Line 9 Other changes in net assets or fund balances | CHANGES IN VALUE OF SPLIT-INTEREST AGREEMENTS - -624503; LOSS ON UNCOLLECTIBLE PLEDGES - -2999277; CHANGES IN BENEFIT OBLIGATION OTHER THAN NET PERIODIC COST - -1325404; NET PERIODIC COST OTHER THAN SERVICE COSTS - 1192746; Total - -3756438; | For Paperwork Reduction Act Notice, see the Instructions for Form 990 or 990-EZ. | Cat. No. 51056K | Schedule O (Form 990) (Rev. 1-2025) | Additional Data | Software ID: | 24020961 | Software Version: | 2024v5.1 | ", "ScheduleJ": 12817, "ScheduleR": 9426}, "tax_year": 2024, "part_ix": {"total": 245542362, "program": 205120823, "management": 19597573, "fundraising": 20823966}, "voting_members": 12, "independent_voting_members": 12, "employees": 464, "volunteers": 13, "contrib_related_orgs": null, "contrib_government": null, "cont ATIVE ADVOCACY - THE ACLU SEEKS TO IMPACT CIVIL LIBERTIES THROUGH WORK ON LEGISLATION AT THE FEDERAL AND STATE LEVEL, AS APPROPRIATE. THE ORGANIZATION'S LEGISLATIVE ADVOCATES ARE A CONSTANT PRESENCE ON FEDERAL AND STATE CIVIL LIBERTIES LEGISLATIVE ISSUES. UPDATES ON KEY LEGISLATIVE ISSUES IMPACTING CIVIL LIBERTIES ARE INCLUDED IN MAIL, EMAIL, AND OTHER COMMUNICATIONS TO ACLU MEMBERS NATIONWIDE, AS WELL AS IN PUBLIC EDUCATION CAMPAIGNS. IN ADDITION, THE ACLU DEVELOPS POLICY RELATING TO POSITIONS ON CIVIL LIBERTIES ISSUES. EXPENSES $9,381,047. INCLUDING GRANTS OF $4,710,919. REVENUE $0. CIVIL LIBERTIES POLICY FORMULATION - THE BOARD OF DIRECTORS OF THE ACLU WORKS THROUGH ITS STANDING AND SPECIAL COMMITTEES TO ANALYZE CIVIL LIBERTIES ISSUES AND, WHERE APPROPRIATE, TO DEVELOP POLICIES THAT WILL SERVE AS THE FRAME OF REFERENCE FOR LEGISLATIVE, EDUCATIONAL AND CASE-SPECIFIC WORK AT THE NATIONAL LEVEL, AND THE ORGANIZATION IMPLEMENTS AND ASSISTS IN THE DEVELOPMENT OF POLICY GOALS THROUGH ITS AFFILIATES. EXPENSES $1,923,302. INCLUDING GRANTS OF $3,750. REVENUE $0. | Form 990, Part VI, Line 7a Members or stockholders electing members of governing body | ACLU FOUNDATION'S MEMBERS ELECT THE BOARD DIRECTORS OF ACLU FOUNDATION. | Form 990, Part VI, Line 7b Decisions requiring approval by members or stockholders | ACLU HAS THE AUTHORITY TO AMEND ITS BYLAWS, AND UNDER NEW YORK LAW, ACLU HAS THE RIGHT TO APPROVE A DECISION BY THE BOARD TO DISSOLVE, MERGE/CONSOLIDATE WITH ANOTHER ORGANIZATION OR DISPOSE OF ALL OR SUBSTANTIALLY ALL OF THE ORGANIZATION'S ASSETS. | Form 990, Part VI, Line 11b Review of form 990 by governing body | THE FORM 990 WAS PREPARED BY MANAGEMENT IN CONSULTATION WITH THE ORGANIZATION'S OUTSIDE ACCOUNTANTS. THE ORGANIZATION'S AUDIT COMMITTEE REVIEWED A DRAFT OF THE 990 AND PROVIDED COMMENTS. A COMPLETE COPY OF THE FORM 990 WAS PROVIDED TO THE ORGANIZATION'S GOVERNING BODY BEFORE IT WAS FILED. | Form 990, Part VI, Line 12c Conflict of interest policy | THE ORGANIZATION DISTRIBUTES ITS CONFLICT OF INTEREST POLICY ON AN ANNUAL BASIS TO EVERY KEY EMPLOYEE, OFFICER, BOARD DIRECTOR AND STANDING COMMITTEE MEMBER AND REQUESTS DISCLOSURE OF ANY POTENTIAL CONFLICTS OF INTEREST. THE DEPUTY EXECUTIVE DIRECTOR/GENERAL COUNSEL OF THE ORGANIZATION REVIEWS ANY DISCLOSURES MADE DURING THIS ANNUAL REVIEW. IF A MATTER IS RAISED THAT MAY BE A CONFLICT OF INTEREST INVOLVING A BOARD MEMBER, AN OFFICER OR A STANDING COMMITTEE MEMBER, DEPUTY EXECUTIVE DIRECTOR/GENERAL COUNSEL REFERS THE MATTER TO THE BOARD PRESIDENT AND APPROPRIATE FOLLOW UP IS UNDERTAKEN AS SET FORTH IN THE POLICY. IF A MATTER IS RAISED THAT MAY BE A CONFLICT OF INTEREST INVOLVING A KEY EMPLOYEE, DEPUTY EXECUTIVE DIRECTOR/GENERAL COUNSEL REFERS THE MATTER TO THE EXECUTIVE DIRECTOR OR THEIR DESIGNEE AND APPROPRIATE FOLLOW UP IS UNDERTAKEN AS SET FORTH IN THE POLICY. BOARD DIRECTORS, OFFICERS, STANDING COMMITTEE MEMBERS AND KEY EMPLOYEES ALSO MAY REPORT TO THE BOARD ANY POTENTIAL CONFLICTS OF INTEREST THAT ARISE DURING THE YEAR. THE ORGANIZATION'S CONFLICT OF INTEREST POLICY REQUIRES, AMONG OTHER THINGS, THAT INDIVIDUALS WITH CONFLICTS OF INTEREST WITH RESPECT TO A TRANSACTION OR ACTION MAY NOT PARTICIPATE IN THE DECISION-MAKING WITH RESPECT TO THAT TRANSACTION OR ACTION AND IN SOME CIRCUMSTANCES MAY NOT PARTICIPATE IN THE DISCUSSION. | Form 990, Part VI, Line 15a Process to establish compensation of top management official | THE EXECUTIVE DIRECTOR/CEO, OFFICERS AND VARIOUS KEY EMPLOYEES ARE NOT PAID BY AMERICAN CIVIL LIBERTIES UNION FOUNDATION, INC. COMPENSATION IS PAID DIRECTLY BY AMERICAN CIVIL LIBERTIES UNION, INC., A RELATED 501(C)(3) ORGANIZATION, AND SALARY EXPENSE IS ALLOCATED TO THE FILING ORGANIZATION. ACLU AND AMERICAN CIVIL LIBERTIES UNION FOUNDATION HAVE ESTABLISHED THE FOLLOWING PROCEDURES TO DETERMINE THE COMPENSATION OF THESE INDIVIDUALS: THE BOARD OF THE ORGANIZATION AND THE EXECUTIVE COMMITTEE OF THE ACLU BOARD ESTABLISH THE EXECUTIVE DIRECTOR/CEO'S COMPENSATION. illermo Mayer", "top_paid_total": 265352, "ratios": {"top_paid_pct": 3.58, "officer_comp_pct": 15.64, "personnel_pct": 40.97, "program_pct": 71.23, "fundraising_pct": 8.0, "cost_to_raise_a_dollar": 0.064, "reserves_months": 29.2, "margin_3y": 12.08, "contrib_share": 93.61, "revenue_cagr": 9.35, "liabilities_to_assets": 0.112}}]}, "method_note": "No Form 990 data with revenue and expenses found for this EIN."}, "scan": {"summary": "Public-record scan of the ACLU Foundation of Northern California (EIN 94-0279770) and its 501(c)(4) sister, the \"Union\" (EIN 94-2151925). FY = fiscal year ending March 31.\n\nBOTTOM LINE: No red flag for integrity or solvency was found. The real issues are a restructuring in late 2024 that remains poorly documented, a 17-year executive tenure with no succession evidence found, and opaque money flows to the national ACLU. The core primary documents could not be read: Part IX and Schedules O, L, R and I for FY24-FY25, and the FY25 audit. Those PDFs and ProPublica's filing viewer did not render through the fetch tool. Everything from those documents below comes from search snippets or aggregators and is labeled that way. The opinion paragraphs of the audits were not read.\n\nCORRECTION TO THE ENTITY MAP: The map found no evidence of a parent-subsidiary relationship. Schedule O and Schedule R snippets say the Union appoints the Foundation's board as \"Designator\", and Foundation bylaw amendments need the Union's consent. Union directors are elected by members. Separately, the Foundation's board sets executive pay through its Personnel Committee and budget. So the deductible entity's board is appointed by the non-deductible one. That is a governance fact to understand, not an impropriety finding.\n\nTHE RED FLAG IS MOSTLY ONE YEAR PLUS AN ACCOUNTING BASIS: The -10.32% three-year margin is driven by FY24 (-57.13%). That year, 990 revenue excludes unrealized investment gains: the Foundation's 990 deficit was $6.95M, but net assets fell only $3.51M. The combined audit shows -$3,299,086 for FY24. Still, the operating gap was real. Compensation rose about $2.3M (aggregator) while contributions and program revenue fell about $4.3M. Restructuring was reported in October 2024, about seven months after that year closed. FY25 rebounded to +9.27% on $20.2M of contributions. No source explains that jump directly.\n\nEFFICIENCY: FY23 program share was about 76.9% and FY25 about 78.0% of 990 total expenses (my arithmetic on Part III snippet or aggregator data, not Part IX). The combined audit shows program services of $23,928,698 in FY24 and $25,269,805 in FY23, or about 82% of about $29.2M in FY24 (snippet). These bases differ because audits and annual reports include donated legal services ($3,897,778 in FY24; $6,843,418 in FY22), and 990 totals appear not to. The FY22 annual-report total of $22,076,736 exceeds the 990 total of $15,233,319 by $6,843,417, almost exactly the in-kind figure. Note that the FY2022 row in functional_expenses is on this annual-report basis, not the 990 basis.\n\nMONEY LEAVING THE FOUNDATION OR UNION: The Foundation granted $725,000 to the Union for legislative work in FY25, up from $300,000 in 2020 (aggregators). The Union reported $2,548,286 of grants in FY24, and InfluenceWatch (citing Candid) shows about $2.1M-$2.6M a year to ACLU California Action in 2022-2024. A $3M one-off grant to national for voting-rights work is documented by the FY22 annual report, and aggregators list $3M grants to national entities with conflicting years. The ongoing national gift-sharing formula remains unknown. Audit balances show $422,114 due from the National Union and $620,989 due to the National Foundation at 3/31/2024.\n\nRATINGS: Charity Navigator 97%, four stars, FY25 data; the only metric missed in the Accountability section is posting tax forms on the website (the site's 990 list stops at FY22). Candid Platinum 2025. No BBB or CharityWatch rating found. California AG status comes only from a secondary source: \"Current - Awaiting Reporting\".\n\nCONTROVERSY: One relevant negative item: Above the Law (Oct 29, 2024) reported, from anonymous insiders, layoffs and program cuts, plus an allegation that leadership was pushing out long-time legal staff. The organization did not respond to the outlet. Final numbers and the board outcome were not found. In 2020, management declined voluntary union recognition before staff petitioned the NLRB. No regulatory action, finding against the organization, or employee suit was found. Beware misattribution: the Broccolo suit (2024) and the 2013 loyalty-letter dispute involve the Southern California affiliate and national ACLU respectively, not this organization.\n\nPROGRAM EVIDENCE: Litigation wins are independently checkable, notably the courthouse-arrest rulings of Dec 2025 and June 2026 in Northern California, and the partial Siskiyou County settlement. Impact claims beyond case outcomes and membership counts are self-reported. No independent outcome evaluation was found.", "functional_expenses": [{"year": 2025, "program": 15449667, "management": null, "fundraising": null, "total": 19816451, "source_url": "https://www.intellispect.co/organizations/940279770-american-civil-liberties-unio"}, {"year": 2024, "program": null, "management": null, "fundraising": null, "total": 19118675, "source_url": "https://projects.propublica.org/nonprofits/organizations/940279770/202500369349301225/full"}, {"year": 2023, "program": 12716090, "management": null, "fundraising": null, "total": 16542137, "source_url": "https://pdf.guidestar.org/PDF_Images/2023/940/279/2023-940279770-202420329349300647-9.pdf"}, {"year": 2022, "program": 17985790, "management": 2530963, "fundraising": 1559983, "total": 22076736, "source_url": "https://annualreport.aclunc.org/2022-report/"}], "program_service_accomplishments": [{"year": 2025, "program": "Foundation: six legal and policy programs (criminal justice reform including policing; democracy and voting rights ts), the NLRB case database and the AG's enforcement records were not searched directly, so this is limited to web-indexed sources. InfluenceWatch's profiles are critical in framing, but they list program litigation, not misconduct.", "status": "No evidence found, within those limits.", "basis": "inference", "confidence": 0.55, "sources": [{"url": "https://www.influencewatch.org/non-profit/aclu-foundation-of-northern-california2/", "title": "InfluenceWatch: ACLU Foundation of Northern California"}]}], "major_funders": [{"name": "DAFgiving360 / Donor Advised Charitable Giving, Inc. (Schwab)", "amount": "$1,501,687; $556,857; $732,903; $558,766", "year": "2025; 2024; 2021; 2020", "note": "Largest single named grant in FY25. A donor-advised conduit, so the underlying donors are hidden. Aggregator data. The Schwab tie is my inference from the DAFgiving360 name.", "sources": [{"url": "https://causeiq.com/organizations/american-civil-liberties-union-foundation-of-north,940279770", "title": "CauseIQ: Foundation"}, {"url": "https://www.influencewatch.org/non-profit/aclu-foundation-of-northern-california2/", "title": "InfluenceWatch, citing Candid"}]}, {"name": "San Francisco Foundation", "amount": "$803,800; $410,000", "year": "2025; 2024", "note": "General and project support, advised grants. Impala shows inconsistent cumulative figures ($3.7M and $2.9M).", "sources": [{"url": "https://causeiq.com/organizations/american-civil-liberties-union-foundation-of-north,940279770", "title": "CauseIQ: Foundation"}, {"url": "https://impala.digital/public/profiles/94-0279770/overview", "title": "Impala profile"}]}, {"name": "Fidelity Charitable; Vanguard Charitable", "amount": "$663,297 (Fidelity); $537,000 and $530,500 (Vanguard)", "year": "2025; 2025 and 2023", "note": "More donor-advised conduits.", "sources": [{"url": "https://causeiq.com/organizations/american-civil-liberties-union-foundation-of-north,940279770", "title": "CauseIQ: Foundation"}, {"url": "https://www.influencewatc
