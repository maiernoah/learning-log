after headlines fade. The pledge length exposes the donor to leadership change, program consolidation and any federal action on deductibility. It is low risk only if staged. Unstaged, it would be elevated.", "risk_reducers": ["Annual staged payments weighted to FY29-FY31", "Release conditions: audit delivered, positions filled, outcome report received", "Exit clause on loss or suspension of exemption, or on program closure", "Tax advice before each payment if federal action emerges", "Check payee and deductibility before each payment"]}, {"gift_type": "endowment_or_capital", "risk": "elevated", "rationale": "No capital need or endowment plan was found. Combined net assets are about $63.65M, and national holds $779.7M. Money locked up here does not answer the actual problem, which is revenue swings and capacity. Control runs through a Foundation board appointed by the Union, and no investment or reserve policy was read. A permanent gift would also outlast any leverage the donor has, and would sit through the transition and federal risks above.", "risk_reducers": ["Give only against a written capital plan and spending policy", "Term-limited, quasi-endowment structure with defined draws for attorney positions", "Independent investment oversight and annual reporting", "Reversion or redirect clause on exemption loss, if counsel can draft one"]}, {"gift_type": "affiliated_c4", "risk": "moderate", "rationale": "The Union (EIN 94-2151925) is a legitimate route if legislation and ballot work are the goal and no deduction is needed. It held $17.85M of net assets and ran a $3.44M surplus in FY25, so need is not evident. Much of its money appears to go on to ACLU California Action, about $2.1M-$2.6M a year (secondary source), where NorCal's own contribution cannot be isolated. Recent results are mixed: SB 852 was signed, but Prop 36, SF Props E and F were lost and SB 1013 died in 2026. It offers members a formal vote that deductible donors lack.", "risk_reducers": ["Ask for grants to ACLU California Action and bills sponsored and signed, by year", "Get the campaign budget and post-election review", "Earmark for a specific bill or campaign, with lawyer review of the rules", "Confirm non-deductibility with your adviser"]}], "efficiency": {"verdict": "Fair at best, and not provable. Roughly $25M a year buys a standing legal team that wins real rulings in coalition, but only a few of them have lasted, and no one measures what they do for people. The absence of that evidence is a transparency finding, not a neutral fact.", "change_per_dollar": "FYE 3/2025 spending was about $25.2M after removing the $725,000 grant between the two entities. Other flows and in-kind legal help are excluded. Changes that landed in that year were poor: Prop 36 passed, the Grants Pass fallout continued, and the March 2025 TPS order later failed. Work funded then paid off afterward. Strongest: Pablo Sequen v. Albarran, a December 2025 regional stay and June 2026 vacatur of courthouse-arrest policies, co-lead with three co-counsel, on appeal, significance 4. A separate New York case reached a nationwide ruling on Oct 1, 2026, so the fair unique claim is about nine months of regional relief, earlier nationwide relief and hold-room relief. One secondhand report says no one was detained at San Francisco immigration court after the stay. Also real: Garro Pinchi (too early), UFW (lifted on standing after about 16 months), Siskiyou and the San Francisco property settlement (significance 2). Weakest: National TPS Alliance, the largest population and no durable result, with NorCal's role unclear; among local items, Coalition on Homelessness, which ended with the city's existing policy plus monitoring.", "trend": "Mixed. Raw combined spending was flat from FY23 ($26.5M, possibly including a one-off $3M national grant) to FY25 ($25.2M net). Reach widened from two facilities and one county to regional and nationwide orders, partly because federal policy created bigger targets. Durability did not improve. No true per-dollar comparison exists, because 2025-26 spending is unfiled.", "north_star_metric": null, "program_ratio_note": "Program share is 78.0% on the FY25 990, against a peer median of 75.3%; three-year range 76.9%-78.0%. The audit basis shows about 82% in FY24 because it includes $3.9M of donated legal services. That is acceptable but says nothing about results. The filings also classify a large shared-staff arrangement, so the split depends on an allocation no one outside has tested.", "what_ratios_miss": "Ratios miss whether a ruling lasted, who else earned it, and whether it changed conduct. They also miss the in-kind subsidy: $3.9M-$6.8M a year of donated legal work means the true cost of results is above the cash figure, and pro bono supply is reportedly weakening. They miss that 38.4% of contributions came from national, which flatters cost to raise. They also miss about $63.65M of combined net assets, and they cannot show what was given up in the 2024 restructuring.", "spending_matches_strategy": "Partly. The money does match a law-led model: five of the seven best-paid people hold legal titles, and deductible money carries the docket. It matches the stated plural theory less clearly: the Executive Director says courts cannot be the final bulwark, while the Legal Director speaks of funneling resources to legal advocacy, seen only in excerpt. The Foundation-to-Union grant was $725,000. The Union's own grants, reportedly mostly to ACLU California Action, carry the state work. No budget by program was found, so the 'firewall' strategy cannot be tested in dollars. The FY25 surge went mostly to rebuilding reserves, with expenses up only $0.70M.", "versus_peers": "No per-dollar ranking is defensible. LCCRSF co-counseled Sequen, Zepeda Rivas and Coalition on Homelessness on $4.44M of expenses, about 17% of this pair's spending, and claims the same results. That is a caution against assuming scale produces proportional credit, though workloads are unknown and this organization has a far wider docket. On overhead it is ordinary: program share at the 62nd percentile and cost to raise a dollar near the median.", "basis": "inference"}, "ratio_anomalies": [{"key": "margin_3y", "label": "Average operating margin, FY23-FY25: -10.32% (red)", "benign": "One bad year on a basis that excludes unrealized gains. FY24's -57.13% drives the average; net assets fell only $3.51M against a $6.95M 990 deficit, and FY25 returned to +9.27%.", "worrying": "Costs reset above sustainable revenue. Three-year average revenue of $16.8M is below $19.8M of expenses, combined audits show two straight losses of about $3.3M, and FY25 may be a one-off.", "evidence_supports": "Benign on solvency, worrying on structure. The flag overstates distress but points at the real issue. The label 'sustained' is wrong, since the 990 series shows no consecutive deficits at FY25, though the audit does show consecutive losses before FY25.", "settling_question": "What are FY26 actual revenue and expenses, excluding bequests and national money?"}, {"key": "contrib_share", "label": "Contributions as share of revenue: 92.59% (amber)", "benign": "Normal for this model: the peer median is 91.9%, dues sit in the Union, and no single named funder dominates.", "worrying": "All revenue depends on public mood and on unnamed individuals, bequests and DAFs, and fee income is lumpy.", "evidence_supports": "Benign as a ratio, because it is typical of peers. The real exposure is captured by volatility and the national share.", "settling_question": "What share of FY25 contributions came from the top ten gifts and from bequests?"}, {"key": "related_org_contrib_pct", "label": "Contributions from related organizations: 38.4% (amber)", "benign": "This is largely NorCal-attributable money passing through federation gift-sharing, so it is really local support booked via national.", "worrying": "It is a discretionary or formula-driven subsidy that the affiliate does not control, and without it FY25 revenue would have covered about 71% of expenses.", "evidence_supports": "Undetermined. Schedule R confirms the amount and that it came from ACLU Foundation Inc. The FAQ confirms sharing exists. Nothing read splits local-origin money from national support. This is the largest unresolved financial fact.", "settling_question": "Of the $7,765,506, how much was raised from Northern California donors, and what agreement sets the amount?"}, {"key": "revenue_volatility", "label": "Foundation revenue volatility: 34.4 points (amber)", "benign": "Bequests, large one-off gifts and court fee timing cause lumpiness, which reserves are built to absorb.", "worrying": "Revenue follows the political threat cycle, so swings will recur and capacity will follow them.", "evidence_supports": "Both, with more support for the cycle reading than can be proven. Bequests were $4.66M in FY22, and program revenue fell from $2.80M to $0.48M in FY24. The FY25 jump is unexplained; national's 65.7% rise in the same year points to a shared cause, but that is inference.", "settling_question": "Can you break FY22-FY26 revenue into bequests, large gifts, recurring individual gifts, national and fees?"}, {"key": "affiliate_94-2151925:top_paid_pct", "label": "Union: highest-paid person as share of expenses, 6.72% (red)", "benign": "A false positive. The ratio divides total pay across both entities by Union-only expenses. The Union's own column for that person is $37,835, about 0.6%.", "worrying": "The $413,453 total exceeds the Executive Director's pay and may include transition or retirement items that were not disclosed in what was read.", "evidence_supports": "Benign as a ratio. The separate question of why that one total is so high stays open.", "settling_question": "Did the FY25 total for the Legal-Policy Director include any one-time, retirement or transition payments?"}, {"key": "affiliate_94-2151925:revenue_volatility", "label": "Union revenue volatility: 26.7 points (amber)", "benign": "Remittance timing from national: the balance due from the National Union fell from $2.88M to $422,114 during FY24.", "worrying": "Membership income is weakening beneath a growth story: FY25's $5.66M remains below FY20-FY22 levels ($6.2M-$7.3M), despite a claim of over 120,000 members, up 20%.", "evidence_supports": "Undetermined; the membership accounting note was not read. The gap between member claims and revenue is worth a direct question.", "settling_question": "What are member counts and dues received for each year FY20-FY26, on the same definitions?"}, {"key": "affiliate_13-6213516:officer_comp_pct,reserves_months,contrib_share,revenue_volatility", "label": "National ACLU Foundation flags: officer pay 1.73%, reserves 38.1 months, contributions 93.86%, volatility 29.0", "benign": "A large endowed national charity, with ratios that follow from its scale and restricted funds.", "worrying": "It matters here only if national's volatility or reserve choices pass through to NorCal's $7.77M flow.", "evidence_supports": "Not researched; national is outside this assessment. National's capacity is not the issue. Its allocation rules are.", "settling_question": "Does national have any right to change NorCal's share unilaterally, and on what notice?"}], "advisor_questions": [{"question": "Is anyone already doing this, and better?", "status": "partial", "answer": "On each issue, yes, someone is doing it; across all issues, no one in the peer set reviewed. LCCRSF co-counsels the key immigration cases at $4.4M. EFF is stronger in surveillance. Public Advocates and Asian Law Caucus overlap on racial and economic justice and AAPI communities. 'Better' cannot be judged, because no outcome comparison exists. The S.D.N.Y. case shows the marquee win was not unique.", "basis": "inference", "confidence": 0.6, "sources": [{"url": "https://lccrsf.org/cases/pablo-sequen-v-albarran-ice-courthouse-arrests-unlawful-detention-conditions/", "title": "LCCRSF case page"}, {"url": "https://aclu.org/press-releases/federal-court-strikes-down-ices-courthouse-arrest-policy-nationwide", "title": "ACLU release, Oct 1, 2026"}, {"url": "https://www.kqed.org/news/12102922/south-bay-judge-rules-san-joses-flock-cameras-dont-invade-privacy", "title": "KQED: San Jose Flock ruling"}]}, {"question": "What is the counterfactual if this organization disappeared, and if this gift does not arrive?", "status": "partial", "answer": "If it disappeared: active class actions would need new counsel, issue work would scatter to stretched peers, and multi-issue state and local advocacy with a member base would be hardest to replace. The Central Valley gap may be real but was not specifically searched. National would probably rebuild the territory (speculation). If a gift of $25,000-$250,000 does not arrive: nothing identifiable fails. Sustained shortfalls do cost capacity, as the 2024 reports and the staff fall from 130 to 117 suggest.", "basis": "inference", "confidence": 0.55, "sources": [{"url": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990", "title": "Foundation FY25 Form 990"}, {"url": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "title": "Above the Law, Oct 29, 2024"}, {"url": "https://legalalphabet.com/job/staff-attorney-senior-staff-attorney-job-at-aclu-of-northern-california-in-fresno", "title": "Fresno staff attorney listing"}]}, {"question": "Is there room for more funding, and what happened to the last big increase?", "status": "answered", "answer": "Room exists for up to about $1M a year in defined attorney or regional capacity (my judgment), and money does not appear to be the binding constraint as of FYE 3/2025. The last increase: FY25 revenue rose $9.67M, while expenses rose $0.70M, about 7% of the increase. Net assets rose $2.82M, and most of the rest filled the swing from a $6.95M deficit. Employees fell by 13. FY25 covers only about ten weeks of the current administration, so FY26 may show deployment.", "basis": "inference", "confidence": 0.65, "sources": [{"url": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990", "title": "Foundation FY25 Form 990"}, {"url": "https://projects.propublica.org/nonprofits/organizations/940279770", "title": "ProPublica: Foundation"}]}, {"question": "Is this the right unit to fund, or should money go to a coalition, policy effort, intermediary, or peer?", "status": "answered", "answer": "It is the right unit only for rule change across Northern and Central California by litigation and policy, and then for a named capacity. For people facing detention now, fund direct representation or family aid instead (for example Centro Legal de la Raza or county defense programs). For an unrestricted dollar, a thinner peer such as LCCRSF ($5.66M assets) is likely more cash-constrained. For legislation, the 501(c)(4) is the vehicle. Effectiveness per dollar was not compared.", "basis": "inference", "confidence": 0.6, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/942581415", "title": "ProPublica: LCCRSF"}, {"url": "https://localnewsmatters.org/2025/09/23/bay-area-cities-counties-launch-regional-fund-to-aid-families-after-ice-raids-and-detentions", "title": "Local News Matters: Stand Together Bay Area Fund"}, {"url": "https://www.calbar.ca.gov/news/state-bar-report-finds-funding-cuts-would-severely-weaken-legal-aid-lifeline-millions-californians", "title": "State Bar: legal aid funding"}]}, {"question": "Does the theory of change hold, and is there outside evidence for the model?", "status": "partial", "answer": "The first link holds: suits produce binding orders, and those are publicly checkable. The later links are weak. Orders are often stayed or expire; Marin suggests paper wins can fail unobserved; and ballot and legislative defenses lost visibly in 2024 and 2026. The organization's own leader says courts cannot be the final bulwark. No outside evaluation of this organization was found. Literature on impact litigation in general was not reviewed.", "basis": "inference", "confidence": 0.55, "sources": [{"url": "https://pastforward.org/blogs/public-podcasting/abdi-soltani", "title": "Past Forward podcast, July 2023"}, {"url": "https://www.eff.org/deeplinks/2026/10/we-demand-more-information-how-marin-cops-illegally-shared-flock-alpr-data", "title": "EFF, Oct 2026"}, {"url": "https://calmatters.org/economy/technology/2026/09/california-kills-flock-camera-regulation-again/", "title": "CalMatters: Flock regulation"}]}, {"question": "Who else funds them and why, and has any sophisticated funder stopped?", "status": "partial", "answer": "The largest identified source is national: $7.77M in FY25. Then come DAF conduits (DAFgiving360 $1.50M, Fidelity Charitable $663,297, Vanguard Charitable $537,000 in 2025) and community foundations (San Francisco Foundation $803,800). Named foundations such as Libra, Haas Jr. and California Endowment appear at low-to-mid six figures. The 'why' is not documented. DAF money reflects individuals' choices, not institutional diligence (inference). No departure was established; Libra's absence from top-grant lists after 2021 is only a question. Ford, MacArthur and Open Society were not searched.", "basis": "evidence", "confidence": 0.55, "sources": [{"url": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990ScheduleR", "title": "Foundation FY25 Schedule R"}, {"url": "https://www.influencewatch.org/non-profit/aclu-foundation-of-northern-california2/", "title": "InfluenceWatch, citing Candid"}, {"url": "https://causeiq.com/organizations/american-civil-liberties-union-foundation-of-north,940279770", "title": "CauseIQ: Foundation"}]}, {"question": "Is the problem growing or shrinking?", "status": "partial", "answer": "Growing on immigration enforcement, the one front with counts: San Francisco area of responsibility arrests were 2,928 in Jan-Jul 2025 and 4,970 in Jan-Jul 2026. DHS calls one analysis cherry-picked. Surveillance exposure is growing while law is contested. No trend measure was found for police practices, voting or reproductive rights locally. Post-2028 enforcement is unknown.", "basis": "evidence", "confidence": 0.7, "sources": [{"url": "https://abc7news.com/post/ice-arrests-san-francisco-bay-area-70-uc-berkeley-data-project-finds/19754574/", "title": "ABC7: Bay Area ICE arrests"}, {"url": "https://www.kqed.org/news/12097313/northern-california-ice-arrests-surged-this-summer", "title": "KQED, Aug 31, 2026"}]}, {"question": "Is this a program or an organization (founder dependency, board strength, survivability)?", "status": "answered", "answer": "An organization, 92 years old, with no founder dependency, member-elected Union directors and a national federation behind it. Survival is not the issue. The dependency is moderate and concentrated in the Executive Director's public role, after about 17 years, with no succession evidence found. Board strength is hard to judge: no public statement by any director was found, and board sizes differ between filings and the site.", "basis": "inference", "confidence": 0.65, "sources": [{"url": "https://www.aclunorcal.org/bios/abdi-soltani/", "title": "Executive Director bio"}, {"url": "https://www.aclunorcal.org/about/board-of-directors", "title": "Board of Directors"}, {"url": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990ScheduleR", "title": "Foundation FY25 Schedule R"}]}, {"question": "What do they say they are versus what the money says they are?", "status": "partial", "answer": "They say: a non-partisan guardian using courts, politics and community power. The money says: a law firm first, on a Foundation payroll that carries both entities, with five of the seven best-paid in legal roles. It is also a federation node, with $7.77M arriving from national and reportedly $2.1M-$2.6M a year passed by the Union to ACLU California Action. It also says: a reserve-builder, with about $63.65M of combined net assets. No budget by program exists in what was read, so the split cannot be stated.", "basis": "inference", "confidence": 0.6, "sources": [{"url": "https://www.aclunorcal.org/about", "title": "About page"}, {"url": "https://projects.propublica.org/nonprofits/organizations/940279770", "title": "ProPublica: Foundation"}, {"url": "https://www.influencewatch.org/non-profit/aclu-of-northern-california/", "title": "InfluenceWatch: Union"}]}, {"question": "Is executive pay in line with scale and peers?", "status": "answered", "answer": "Broadly yes. The Executive Director's FY25 total of $369,484 compares with $376,166 at EFF ($25.8M expenses) and $281,155 at Asian Law Caucus ($14.6M), on combined spending of about $25M. Since FY18 it has grown about 73%, nearly the same as Foundation expenses (74%, my arithmetic). Top-paid share of 2.09% matches the peer median of 2.08%. One item to ask about: a Legal-Policy Director's total of $413,453 is the highest among regional peers and above the Executive Director's; a one-off is possible. The 1.33% officer ratio understates senior pay, since the seven best-paid total about $2.19M.", "basis": "evidence", "confidence": 0.8, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/940279770", "title": "ProPublica: Foundation"}, {"url": "https://projects.propublica.org/nonprofits/organizations/43091431", "title": "ProPublica: EFF"}, {"url": "https://projects.propublica.org/nonprofits/organizations/942176139", "title": "ProPublica: Asian Law Caucus"}]}, {"question": "Is the cost of raising money in line with peers and with the revenue model?", "status": "answered", "answer": "On the headline, yes: $0.10 against a peer median of $0.09, and fundraising at 10.2% of expenses. Across FY23-FY25 it averaged about $0.126 (my arithmetic). But national's $7.77M lowers the figure. Against non-national contributions, FY25 is about $0.16 and FY24 about $0.36. Those are upper bounds, since some national money may be locally earned, and membership acquisition costs are reported on national's statements. Reasonable for an individual-donor model, but not as cheap as it appears. No paid fundraisers are reported.", "basis": "inference", "confidence": 0.7, "sources": [{"url": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990", "title": "Foundation FY25 Form 990"}, {"url": "https://projects.propublica.org/nonprofits/full_text/202500369349301225/IRS990", "title": "Foundation FY24 Form 990"}, {"url": "https://annualreport.aclunc.org/wp-content/uploads/2023/07/Financial-spread-2022-ACLU-NorCal-An-Rpt-financials-7-19-23.pdf", "title": "Financial spread, 2022 annual report (snippet)"}]}, {"question": "What actually changed because of them last year, how much of it can they fairly claim, and is that improving per dollar?", "status": "partial", "answer": "Over the past year: immigration-court arrest policies were vacated (co-lead; on appeal; the stay held in the Ninth Circuit's first step), ICE re-arrests were blocked regionally (co-lead; early), and Siskiyou settled in part (co-lead; no compliance data). Against that: the UFW injunction was lifted, TPS failed, and the San Jose Flock suit was dismissed, though San Jose cut retention from one year to 30 days. They can fairly claim a co-lead share and earlier relief, not sole credit. People protected: not counted. Per-dollar trend: not computable, as spending for those years is unfiled; reach is up and durability is not.", "basis": "inference", "confidence": 0.65, "sources": [{"url": "https://lccrsf.org/pressroom_posts/federal-court-delivers-crushing-blow-to-trumps-mass-deportation-agenda-striking-down-courthouse-arrests-nationwide-and-restoring-protections-against-inhumane-detention/", "title": "LCCRSF release, June 24, 2026"}, {"url": "https://www.aclunorcal.org/press-releases/federal-court-blocks-ice-rearrest-policy/", "title": "ACLU NorCal: re-arrest policy"}, {"url": "https://nextshark.com/siskiyou-county-settlement-asian-discrimination-lawsuit", "title": "NextShark: Siskiyou"}, {"url": "https://www.newsmax.com/us/border-patrol-united-farm-workers-california/2026/08/24/id/1267199/", "title": "9th Circuit lifts block"}, {"url": "https://www.kqed.org/news/12102922/south-bay-judge-rules-san-joses-flock-cameras-dont-invade-privacy", "title": "KQED: San Jose Flock ruling"}]}, {"question": "Do they publish targets in advance and report against them?", "status": "partial", "answer": "No published target specific enough to fail was found. The framework post uses 'explore', 'advance', 'monitor' and 'expand'. The last clear hit-and-miss report found dates from 2015: 16 sponsored bills, seven signed, statewide. The full framework and 2024-2025 annual report PDFs were not read, so a private dashboard cannot be ruled out.", "basis": "evidence", "confidence": 0.65, "sources": [{"url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "title": "Forging Ahead, Dec 13, 2024"}, {"url": "https://www.aclunorcal.org/blog/aclu-california-center-advocacy-policy-lobbying-machine", "title": "ACLU Center for Advocacy & Policy, Oct 13, 2015"}]}], "strengths": [{"strength": "Solvent, with room to absorb shocks.", "evidence": "FYE 3/2025 Foundation: $37.45M unrestricted net assets, liabilities 7.1% of assets. The 501(c)(4) adds $17.85M. Even a hypothetical $9M annual gap would take about four years to exhaust unrestricted funds.", "basis": "evidence"}, {"strength": "No integrity red flag found.", "evidence": "The FY25 filing reports no excess-benefit transactions, insider loans, insider business or diversion. Policies are in place; audits are posted through FY25. No regulatory action or staff suit against this organization was found in web-indexed sources. Dockets and the AG registry were not searched directly.", "basis": "evidence"}, {"strength": "Results you can check without trusting them.", "evidence": "Sequen, Garro Pinchi, UFW and the San Francisco settlement are on court or government records. In Sequen, a stay pending appeal was denied July 10, 2026.", "basis": "evidence"}, {"strength": "Takes on hard defendants and its own political neighbors.", "evidence": "It sues DHS, cities, counties and a surveillance vendor; promoted a challenge to the Biden-Harris asylum ban; and opposed San Francisco's Prop E and F, both of which passed.", "basis": "evidence"}, {"strength": "Reach beyond the Bay Area.", "evidence": "The UFW suit gave the Eastern District a court-ordered limit for about 16 months, no comparable suit appeared, and it is recruiting attorneys for Fresno. The unique-value claim is inferred.", "basis": "inference"}, {"strength": "Pay is proportionate and overhead is ordinary.", "evidence": "Executive pay grew about in step with expenses since FY18. Program share is 78.0% against a 75.3% peer median, and no professional fundraisers are reported.", "basis": "evidence"}, {"strength": "Leadership appears to act on deficits rather than ride them.", "evidence": "After FY24's $6.95M 990 deficit, employees fell from 130 to 117, and FY25 returned to surplus. That is financially responsible, even though the same behavior is the top risk to capacity. The link between deficit and cuts is inferred.", "basis": "inference"}, {"strength": "A real membership base with formal power.", "evidence": "Over 120,000 members claimed (self-reported), and members elect Union directors by ballot, which then appoint the Foundation's board. Few peers have this accountability route.", "basis": "inference"}], "verdict_changers": [{"direction": "up", "what": "FY26 actuals show the surge was deployed into filled legal positions, with a stated reserve policy explaining why the rest is held."}, {"direction": "up", "what": "A written breakdown shows most of the $7.77M national flow is Northern California-origin money under a stable agreement, and restricted gifts are exempt from sharing."}, {"direction": "up", "what": "Before-and-after data shows Sequen or Garro Pinchi reduced arrests, or the organization offers a case-level ledger of staff time, role and result."}, {"direction": "up", "what": "A board-approved succession plan, a named finance lead and a candid account of what the 2024 restructuring ended."}, {"direction": "up", "what": "Ninth Circuit affirms the courthouse-arrest relief and class relief survives."}, {"direction": "down", "what": "A qualified audit opinion, material weakness, restatement or real going-concern language in the unread FY23-FY25 audits."}, {"direction": "down", "what": "The Resource Sharing Agreement allocation is shown to leave the Foundation bearing the Union's costs, or the organization will not provide it."}, {"direction": "down", "what": "Refusal to answer the national-share or restructuring questions in writing to a serious prospective donor."}, {"direction": "down", "what": "The national flow proves to be a discretionary subsidy, or falls by a third or more."}, {"direction": "down", "what": "FY26 shows revenue under $18M with costs rising, or a large share of FY25 proves to be a single bequest."}, {"direction": "down", "what": "An IRS examination, subpoena or DAF sponsor restriction touching the ACLU federation."}, {"direction": "down", "what": "Verification of the anonymous 2024 allegations, for example a finding that the layoffs were unlawful or targeted legal staff."}], "questions_to_ask": [{"order": 1, "question": "Please send the FY26 actuals, FY27 budget and a budget by program, plus the FY24 and FY25 audits with any management letters.", "why": "Everything filed ends in March 2025, about ten weeks into the current administration. This is a routine request, and how it is handled tests candor at low cost.", "good_answer_looks_like": "Documents delivered in days, showing where the surge went, with a named finance lead who can walk through them."}, {"order": 2, "question": "Of the $7,765,506 from ACLU Foundation Inc in FY25, how much originated with Northern California donors, what agreement sets it, and would my gift be shared?", "why": "This is 35.6% of revenue and the largest unknown. It also decides how much of your gift stays local.", "good_answer_looks_like": "The formula in writing, a split of the FY25 figure, notice terms for changes, and written confirmation that a restricted gift is exempt or how much is shared."}, {"order": 3, "question": "How much of the $37.45M unrestricted is board-designated, what is your reserve policy, and what would you do if Foundation revenue fell to $16M?", "why": "This shows whether reserves protect capacity or only the institution. In 2024 cuts appear to have come with a large cushion still in place.", "good_answer_looks_like": "A board-adopted policy with a target range, a stated use of the excess, and a pre-agreed sequence of steps before layoffs."}, {"order": 4, "question": "What did the 2024 restructuring end? Please give programs closed, positions lost, severance cost, the board's reasoning, and where that work went.", "why": "The only public account is anonymous and single-source. It is also the likeliest place for quietly ended work, and it previews the next downturn.", "good_answer_looks_like": "A specific list, including what was lost, with attrition data since, and an honest view of what they would do differently. Respect for confidentiality on individuals is fine."}, {"order": 5, "question": "Pick your two biggest wins since 2022. What happened afterward to arrests, stops or compliance, who monitors them, and what share of the work was yours? Please also explain how Marin went unnoticed.", "why": "The ledger shows rulings, not effects. This separates the claim from the result and tests willingness to discuss failure.", "good_answer_looks_like": "Data or a clear admission that none exists, hours and role by case, a monitoring owner, and a direct account of Marin."}, {"order": 6, "question": "What targets for 2025-2028 could you miss, and can I see the framework and how you would report against it?", "why": "No failable public target was found. A gift agreement needs something to report against.", "good_answer_looks_like": "The framework document and a few measurable commitments, or an openness to agree some for the funded work."}, {"order": 7, "question": "To the chair: is there a board-approved succession plan for the Executive Director and finance roles, and who holds CFO-level responsibility now?", "why": "Tenure is about 17 years, with several senior changes unannounced. The chair owns this question, and hearing from the board is itself a test, since no director's public voice was found.", "good_answer_looks_like": "A dated plan reviewed by the board, emergency cover named, and no reluctance to discuss it. Individual timing need not be disclosed."}, {"order": 8, "question": "Can I see the Resource Sharing Agreement, and has counsel reviewed it and the Designator structure against possible IRS action? What is your contingency plan?", "why": "Deductible money carries the payroll under a shared-staff arrangement of $2.77M, and the Union appoints the Foundation's board. Clean allocation protects your deduction and is the obvious exam target.", "good_answer_looks_like": "The agreement or a clear summary, a recent outside review, a written contingency plan and a donor-communication plan for any deductibility change."}], "confidence_statement": "Medium confidence in the overall judgment; high on headline 990 facts; low on culture and effects on people. The financial figures come from filed 990 data, and I confirmed the Schedule R flows and director-appointment statement, plus the FY25 balance-sheet totals, through a fetch summarizer today. That settles the entity map's open point: the Union appoints the Foundation's directors, and the $7.77M did come from national. Rulings and settlements rest on independent or public records. The judgments on efficiency, durability, right unit and room for funding are inference. Pre-mortem probabilities, scores and grade bands are my judgment, are not exclusive of one another and are not calculated. Nothing here shows a problem of integrity or solvency, but several core documents were not read, so that is absence of evidence, not a clean check.", "blind_spots": ["Audit contents for FY23-FY25: opinions, material weaknesses, reserve notes and combined eliminations were not read, only snippets.", "FY26 and FY27: spending, hiring and revenue are unknown. Every money conclusion could shift when FY26 is available.", "The origin of the $7.77M national flow, which changes the reading of revenue dependence and fundraising cost.", "Effects on people from any major ruling: no arrest, stop or compliance data was tied to the cases.", "Internal reality: no donor, former staff, board or current union voice was found, and the only account of the 2024 restructuring is anonymous.", "The 'never mentioned' findings rest on readable text; the 2024 and 2025 annual report PDFs and full framework may address some of them.", "Peer comparison is at entity level and excludes peers' 501(c)(4) arms, and the peer set was selected rather than exhaustive."], "gaps": ["FY24 and FY25 audits, 2024 and 2025 annual reports and the full 2025-2028 framework: not read as text.", "Current gift-sharing formula and whether restricted gifts are exempt: no evidence found.", "Board-designated share of $37.45M and any reserve policy: not found.", "2024 restructuring: final vote, layoff count, programs ended, severance and union position: no evidence found.", "Explanation of the FY25 $9.17M contribution jump, including bequests and large gifts: no evidence found.", "Personnel share conflict unresolved: 59.79% in the extract against 77.7% from Intellispect. The $2.77M shared-employee line on Schedule R may be part of the difference; not tested.", "Schedule R's $2,773,540 shared-employee figure versus Union personnel of about $2.02M (32.86% of expenses, , "turnaround": "About an hour"}, {"id": "deep", "name": "Deep", "price_usd": 50, "pipeline_tier": "quality", "includes": ["Everything in Standard, researched at the highest setting", "Your supplied documents read and cited: audits, strategic plans, board decks, proposals", "An interview sheet built from the verdict's questions", "A second verdict after your conversation with the organization, showing what changed"], "turnaround": "Same day, with a second verdict after your interview"}], "disclaimer": "Dossiers are compiled from public records by research agents and arithmetic on filed numbers. Every claim is tagged evidence, inference or speculation and carries its sources. Nothing in a dossier is legal, financial, tax or investment advice, and the organization assessed has not reviewed it. Verify anything you intend to act on.", "correction_note": "Organizations and readers may request a correction to any factual claim. Corrections that check out are made and noted on the page.", "sample_note": "Sample dossier, published to show what the service produces. The organization did not commission it and has not reviewed it. All figures come from public filings and published sources linked in each section.", "not_included": ["Psychological profiles of individuals. Culture is read at the level of the organization, from public professional material only.", "Private or leaked material.", "A recommendation to give or not give. The dossier lays out the risks, the strengths and the questions; the decision stays yours."]}, "internal": false, "sample": true, "nav": {"home_href": "../../index.html#diligence-aclu-of-northern-california", "home_label": "Noah's Weblog", "landing_href": "../", "about_href": "../../about.html"}};

<script>
(function(){

const grade = g => (String(g||'').match(/^[A-F][+-]?/)||[String(g||'')])[0];

const badge = (t,cls) => `<span class="b ${cls||''}">${esc(t)}</span>`;
const srcs = list => (list&&list.length) ? `<div class="src">${list.map(s => { const u=String(s.url||s); return /^supplied:\/\//i.test(u) ? `<span class="b" title="${esc(u)}">supplied: ${esc(s.title||u.replace(/^supplied:\/\//i,''))}</span>` : `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(s.title||u)}</a>`; }).join(' · ')}</div>` : '';
const words = s => esc(s).replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>');

      if(fd.schedule_o){ h += `<details><summary><span class="r">O</span><span class="fm">Schedule O narrative, as filed</span><span class="pr">excerpt</span></summary><div class="in"><p class="small" style="max-width:none;white-space:pre-wrap">${esc(fd.schedule_o.replace(/ \| /g,'\n').slice(0,12000))}</p></div></details>`; }

    if(R.top_people&&R.top_people.length){ h += `<h2>Highest compensated, FY${R.pay_year}</h2><table><tr><th>Name</th><th>Title</th><th class="num">Base</th><th class="num">Related orgs</th><th class="num">Other</th><th class="num">Total</th><th class="num">% of expenses</th></tr>${R.top_people.map(p=>`<tr><td>${esc(p.name)}</td><td class="wrap">${esc(p.title)}</td><td class="num">${money(p.compensation)}</td><td class="num">${money(p.related)}</td><td class="num">${money(p.other)}</td><td class="num">${money(p.total)}</td><td class="num">${pct(100*p.total/(R.series[R.series.length-1].expenses||1))}</td></tr>`).join('')}</table>`; }
  }
  if(F.affiliates&&F.affiliates.length){
    h += `<h2>Affiliated entities, latest filed year</h2><table><tr><th>Entity</th><th>EIN</th><th>FY</th><th class="num">Revenue</th><th class="num">Expenses</th><th class="num">Net assets</th><th>Flags</th></tr>`;
    h += F.affiliates.map(a=>{const r=a.ratios, s=r.available?r.series[r.series.length-1]:{}; return `<tr><td class="wrap">${esc(a.entity.name||a.entity.ein)}</td><td>${esc(a.entity.ein)}</td><td>${s.year||'—'}</td><td class="num">${money(s.revenue)}</td><td class="num">${money(s.expenses)}</td><td class="num">${money(s.net_assets)}</td><td class="wrap small">${r.available?(r.flags||[]).map(f=>`<span class="light ${f.severity}"></span>${esc(f.label)} ${num(f.value)}${esc(f.unit)}`).join('<br>'):esc(r.reason||'no data')}</td></tr>`;}).join('')+`</table>`;
  }
  h += `<p class="small muted">${esc(R.method_note||'')}</p>`;
  section('money','Money',h);
})();

/* ratios */
(function(){
  const R = F&&F.primary&&F.primary.ratios;
  if(!R||!R.available){ section('ratios','Ratios',`<h1>Ratios</h1>`+(R?`<div class="empty"><b>No ratios.</b> ${esc(R.reason||'')}</div>`:empty('The financial extract'))); return; }
  let h = `<h1>The weird ratios</h1><p class="sub">Arithmetic on filed numbers, thresholds scaled to the ${esc(R.size_band)} band. Flags prompt questions; they do not settle them.</p>`;
  const anomalies = {}; (A&&A.ratio_anomalies||[]).forEach(a=>anomalies[a.key]=a);
  const order = Object.values(R.ratios).sort((a,b)=>({red:0,amber:1,green:2,na:3}[a.flag]-{red:0,amber:1,green:2,na:3}[b.flag]));
  h += `<div class="ratios">`+order.map(r=>{
    const an = anomalies[r.key];
    return `<div class="ratio ${r.flag}"><div class="l"><span class="light ${r.flag}"></span>${esc(r.label)}</div><div class="v">${r.value==null?'—':num(r.value,2).replace(/\.?0+$/,'')}<small>${esc(r.unit)}</small></div><div class="f">${esc(r.formula)} · ${esc(r.year)}</div>${r.note?`<div class="why muted">${esc(r.note)}</div>`:''}${(R.flags.find(f=>f.key===r.key)||{}).why?`<div class="why">${esc(R.flags.find(f=>f.key===r.key).why)}</div>`:''}${an?`<div class="why"><b>Benign:</b> ${esc(an.benign)}<br><b>Worrying:</b> ${esc(an.worrying)}<br><b>Evidence supports:</b> ${esc(an.evidence_supports)}<br><b>Ask:</b> ${esc(an.settling_question)}</div>`:''}</div>`;
  }).join('')+`</div>`;
  const P = F.peer_comparison;
  if(P&&P.rows&&P.rows.length){
    h += `<h2>Against ${P.peer_count} peers</h2><p class="small muted">Peers were named by the landscape agent; their numbers come from the same Form 990 source. The band is the peer range, the tick the peer median, the dot this organization.</p><table><tr><th>Ratio</th><th class="num">This org</th><th class="num">Peer median</th><th>Range</th><th class="num">Percentile</th></tr>`;
    h += P.rows.map(r=>{const lo=Math.min(r.peer_min,r.subject==null?r.peer_min:r.subject), hi=Math.max(r.peer_max,r.subject==null?r.peer_max:r.subject), sp=(hi-lo)||1, x=v=>((v-lo)/sp*100).toFixed(1)+'%';
      return `<tr><td class="wrap">${esc(r.label)}</td><td class="num">${num(r.subject,2)}</td><td class="num">${num(r.peer_median,2)}</td><td style="min-width:180px"><div class="range"><div class="tr"></div><div class="band" style="left:${x(r.peer_min)};width:${((r.peer_max-r.peer_min)/sp*100).toFixed(1)}%"></div><div class="med" style="left:${x(r.peer_median)}"></div>${r.subject==null?'':`<div class="me" style="left:${x(r.subject)}" title="this organization"></div>`}</div></td><td class="num">${r.percentile==null?'—':r.percentile+'th'}</td></tr>`;}).join('')+`</table>`;
    h += `<table><tr><th>Peer</th><th>Relationship</th><th>FY</th><th class="num">Expenses</th><th>Highest paid</th><th class="num">Total pay</th></tr>${(P.peers||[]).map(p=>`<tr><td class="wrap">${esc(p.name)}</td><td class="small">${esc(p.relationship||'')}</td><td>${p.latest_year||'—'}</td><td class="num">${money(p.expenses)}</td><td class="wrap small">${esc(p.top_paid_name||'—')}</td><td class="num">${money(p.top_paid_total)}</td></tr>`).join('')}</table>`;
  } else h += `<p class="small muted">No peer comparison available (peers without EINs, or the landscape step has not run).</p>`;
  h += `<p class="small muted">${esc(R.method_note)}</p>`;
  section('ratios','Ratios',h);
})();

  h += `<h2>Major funders</h2>`+(S.major_funders&&S.major_funders.length?`<table><tr><th>Funder</th><th>Amount</th><th>Year</th><th>Note</th></tr>${S.major_funders.map(f=>`<tr><td class="wrap">${esc(f.name)}</td><td>${esc(f.amount||'—')}</td><td>${esc(f.year||'—')}</td><td class="wrap">${esc(f.note)}${srcs(f.sources)}</td></tr>`).join('')}</table>`:'<p class="muted small">None found.</p>');

/* results */
(function(){
  if(!RS){ section('results','Results',empty('The results ledger')); return; }
  const spark = (series, w=160, h=36) => { const pts=(series||[]).filter(p=>p.value!=null).sort((a,b)=>a.year-b.year); if(pts.length<2) return pts.length===1?`<span class="small muted">${pts[0].year}: ${esc(pts[0].value_text||pts[0].value)}</span>`:'<span class="small muted">no series</span>';
    const xs=pts.map(p=>p.year), ys=pts.map(p=>p.value); const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys); const X=v=>6+(w-12)*((v-x0)/((x1-x0)||1)), Y=v=>h-6-(h-12)*((v-y0)/((y1-y0)||1));
    const d=pts.map((p,i)=>(i?'L':'M')+X(p.year).toFixed(1)+' '+Y(p.value).toFixed(1)).join(' ');
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${pts[0].year} to ${pts[pts.length-1].year}"><path d="${d}" fill="none" stroke="#000080" stroke-width="2" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${X(p.year).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="${p.kind==='actual'?3.5:2.5}" fill="${p.kind==='actual'?'#000080':'#ffffff'}" stroke="#000080" stroke-width="1.5"><title>${p.year} ${p.kind||''}: ${esc(p.value_text||p.value)}</title></circle>`).join('')}</svg>`; };
  const evq = q => badge((q||'unknown').replace(/_/g,' '), q==='independently_verified'?'evidence':q==='self_reported_with_data'?'inference':q==='contradicted'?'red':'speculation');
  const contrib = {lead:'green',co_lead:'green',one_of_many:'amber',claimed_contested:'amber',claimed_contradicted:'red'};
  const dur = {in_force:'green',partly_reversed:'amber',reversed:'red',too_early:'na',unknown:'na'};
  let h = `<h1>Results</h1><p class="sub">What changed in the world because of this organization, and what it cost. ${RS.mode?`Assessed ${esc(RS.mode.primary)}ly: ${esc(RS.mode.rationale)}`:''}</p>${prose(RS.verdict)}`;
  const outs=(RS.outcomes||[]).slice().sort((a,b)=>a.rank-b.rank);
  h += `<h2>Outcome harvest</h2><p class="small muted">The most significant changes over the last five years that the organization claims or can be shown to have contributed to. Significance 1 (local, minor, easily reversed) to 5 (structural, wide, durable). Contribution is the organization's fair share of the credit.</p>`;
  h += outs.map(o=>`<details${o.rank<=2?' open':''}><summary><span class="r">${o.rank}</span><span class="fm">${esc(o.what_changed)}</span><span class="pr"><span class="dots">${'●'.repeat(o.significance)}<span class="off">${'●'.repeat(Math.max(0,5-o.significance))}</span></span> ${o.year||''}</span></summary><div class="in"><div class="row" style="margin:6px 0 10px">${badge('contribution: '+o.contribution.replace(/_/g,' '), contrib[o.contribution]||'na')} ${badge('durability: '+o.durability.replace(/_/g,' '), dur[o.durability]||'na')} ${evq(o.evidence_quality)} ${badge(o.basis,o.basis)}${o.program?` <span class="small muted">${esc(o.program)}</span>`:''}</div><div class="kv"><div>For whom</div><div>${esc(o.for_whom)}${o.count?` · ${esc(o.count)}`:''}</div><div>Counterfactual</div><div>${esc(o.counterfactual)}</div><div>Others involved</div><div>${esc((o.others_involved||[]).join(', ')||'—')}</div><div>Evidence</div><div>${esc(o.evidence)}</div></div>${srcs(o.sources)}</div></details>`).join('') || '<p class="muted small">No outcomes could be established.</p>';
  h += `<h2>Failures and reversals</h2>`+((RS.failures_and_reversals&&RS.failures_and_reversals.length)?RS.failures_and_reversals.map(f=>claim({statement:`${f.consequence}${f.how_handled?'\n\nHow handled: '+f.how_handled:''}`,basis:f.basis,sources:f.sources}, `${f.year||''} ${f.what}`)).join(''):'<p class="muted small">None found in the public record. For an organization more than a few years old that is itself a finding.</p>');
  const d2=RS.dollars_to_change;
  if(d2){ const ns=d2.north_star||{}; const last=(ns.series||[]).slice().sort((a,b)=>b.year-a.year)[0];
    h += `<h2>Dollars to change</h2><div class="two"><div><h3>Latest year${d2.latest&&d2.latest.year?', FY'+d2.latest.year:''}${d2.latest&&d2.latest.spent?' · '+money(d2.latest.spent)+' spent':''}</h3>${prose(d2.latest&&d2.latest.summary)}</div><div><h3>Earliest reconstructed${d2.earliest&&d2.earliest.year?', FY'+d2.earliest.year:''}${d2.earliest&&d2.earliest.spent?' · '+money(d2.earliest.spent)+' spent':''}</h3>${prose(d2.earliest&&d2.earliest.summary)}</div></div>`;
    h += claim({statement:`${d2.qualitative_judgment}\n\nStrongest item: ${d2.strongest_item}\n\nWeakest item: ${d2.weakest_item}`,basis:d2.basis}, 'Portfolio judgment');
    if(ns.measure){ h += `<h3>North star: ${esc(ns.measure)} ${badge(ns.defensible?'defensible':'not defensible from public data', ns.defensible?'green':'amber')}</h3>${last?`<div class="row"><span class="ratio" style="padding:8px 14px"><span class="v" style="font-size:22px">${esc(last.value_text||last.value)}</span><span class="f"> ${last.year}</span></span>${spark(ns.series,320,60)}</div>`:''}<p class="small">${esc(ns.limits||'')}${ns.what_would_make_it_possible?`<br><span class="muted">What would make it possible: ${esc(ns.what_would_make_it_possible)}</span>`:''}</p>`; }
    else if(ns.what_would_make_it_possible) h += `<p class="small"><b>No defensible per-dollar measure.</b> ${esc(ns.what_would_make_it_possible)}</p>`; }
  if(RS.trend) h += `<h2>Trend</h2>`+claim({statement:RS.trend.rationale,basis:RS.trend.basis}, `Change per dollar: ${RS.trend.change_per_dollar.replace(/_/g,' ')} · reporting moving ${RS.trend.reporting_direction.replace(/_/g,' ')}`);
  if(RS.targets){ const r=RS.targets; h += `<h2>Says in advance what it will change?</h2>`+claim({statement:r.summary,basis:r.basis}, `Publishes targets: ${r.publishes_targets}`)+(r.examples&&r.examples.length?`<table><tr><th>Goal</th><th>Year</th><th>Stated</th><th>Result</th></tr>${r.examples.map(t=>`<tr><td class="wrap">${esc(t.goal)}</td><td>${esc(t.year||'—')}</td><td class="wrap">${esc(t.stated)}</td><td class="wrap">${esc(t.result)}${srcs(t.sources)}</td></tr>`).join('')}</table>`:''); }
  h += `<h2>Programs, by year</h2>`+(RS.programs||[]).map(p=>`<h3>${esc(p.program)} ${evq(p.evidence_quality)}</h3><table><tr><th>FY</th><th class="num">Expenses</th><th>Results claimed</th></tr>${(p.years||[]).slice().sort((a,b)=>b.year-a.year).map(y=>`<tr><td>${y.year}</td><td class="num">${money(y.expenses)}</td><td class="wrap">${esc(y.results_claimed)}${srcs(y.sources)}</td></tr>`).join('')}</table>${p.cost_per_unit&&p.cost_per_unit.length?`<table><tr><th>FY</th><th>Outcome unit</th><th class="num">Cost per unit</th><th>Computed as, and why it is defensible</th></tr>${p.cost_per_unit.slice().sort((a,b)=>b.year-a.year).map(c=>`<tr><td>${c.year}</td><td class="wrap">${esc(c.unit)}</td><td class="num">${money(c.cost)}</td><td class="wrap small">${esc(c.numerator)} / ${esc(c.denominator)} · ${esc(c.why_defensible)}</td></tr>`).join('')}</table>`:'<p class="small muted">No defensible outcome unit for a cost-per-unit figure.</p>'}`).join('');
  if(RS.peer_comparables&&RS.peer_comparables.length) h += `<h2>Comparable outcomes reported by peers</h2><table><tr><th>Peer</th><th>Outcome</th><th>Value</th><th>Year</th></tr>${RS.peer_comparables.map(p=>`<tr><td class="wrap">${esc(p.peer)}</td><td class="wrap">${esc(p.outcome)}</td><td class="wrap">${esc(p.value_text)}${srcs(p.sources)}</td><td>${esc(p.year||'—')}</td></tr>`).join('')}</table>`;
  h += `<details><summary><span class="r">#</span><span class="fm">Activity counts, low weight</span><span class="pr">${(RS.activity_counts||[]).length} series</span></summary><div class="in"><p class="small muted">Outputs the organization reports about itself. Useful for spotting a change in reporting, not for judging impact.</p>`+((RS.activity_counts&&RS.activity_counts.length)?`<table><tr><th>Metric</th><th>Level</th><th>Series</th><th>Trend</th><th>Note</th></tr>${RS.activity_counts.map(m=>`<tr><td class="wrap"><b>${esc(m.metric)}</b><br><span class="small muted">${esc(m.unit)}${m.program?' · '+esc(m.program):''}</span></td><td>${badge(m.level, m.level==='impact'?'evidence':m.level==='outcome'?'inference':'na')}</td><td>${spark(m.series)}<br><span class="small muted">${(m.series||[]).slice().sort((a,b)=>a.year-b.year).map(p=>`${p.year}: ${esc(p.value_text||p.value||'—')}${p.kind!=='actual'?' ('+p.kind+')':''}`).join(' · ')}</span></td><td class="small">${esc(m.trend.replace(/_/g,' '))}</td><td class="wrap small">${esc(m.note)}${m.definition_changes?`<br><span class="muted">Definition: ${esc(m.definition_changes)}</span>`:''} ${badge(m.basis,m.basis)}</td></tr>`).join('')}</table>`:'<p class="muted small">None found.</p>')+`</div></details>`;
  h += `<h2>Could not verify</h2>${list(RS.gaps)}<h3>Documents or data that would settle it</h3>${list(RS.documents_that_would_close_gaps)}`;
  section('results','Results',h);
})();

/* field */
(function(){
  if(!L){ section('field','Field',empty('The landscape step')); return; }
  let h = `<h1>The field</h1><p class="sub">Is anyone already doing this, and would it matter if they vanished</p>${prose(L.field_definition)}`;
  if(L.problem_trend) h += `<h2>Is the problem growing or shrinking</h2>`+claim({statement:L.problem_trend.rationale,basis:L.problem_trend.basis,sources:L.problem_trend.sources}, `Trend: ${L.problem_trend.direction}`);
  h += `<h2>Peers</h2><table><tr><th>Organization</th><th>Relationship</th><th>How they differ</th><th>Scale</th></tr>${(L.peers||[]).map(p=>`<tr><td class="wrap">${esc(p.name)}${p.website?` <a class="small" href="${esc(p.website)}" target="_blank" rel="noopener">site</a>`:''}<br><span class="small muted">${esc(p.ein||'no EIN found')}</span></td><td class="small">${esc((p.relationship||'').replace(/_/g,' '))}</td><td class="wrap">${esc(p.how_they_differ)}${srcs(p.sources)}</td><td class="wrap small">${esc(p.scale_note)}</td></tr>`).join('')}</table>`;

/* sources */
(function(){
  const seen = new Map();
  const add = (url,title,where) => { if(!url) return; const k=url.trim(); if(!seen.has(k)) seen.set(k,{title:title||url,where:new Set()}); seen.get(k).where.add(where); };
  const walk = (o, where) => { if(!o) return; if(Array.isArray(o)) return o.forEach(x=>walk(x,where)); if(typeof o==='object'){ if(o.url && typeof o.url==='string') add(o.url,o.title,where); if(o.source && /^https?:/.test(o.source)) add(o.source,null,where); if(o.source_url) add(o.source_url,null,where); if(o.full_filing_url) add(o.full_filing_url,'Form 990 full filing',where); Object.values(o).forEach(v=>walk(v,where)); } };
  walk(I,'identity'); walk(S,'record'); walk(RS,'results'); walk(L,'field'); walk(C,'culture'); walk(X,'futures'); walk(A,'verdict'); walk(F,'money');
  const rows = [...seen.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
  let h = `<h1>Sources</h1><p class="sub">${rows.length} distinct URLs cited across the dossier. Agents may cite only URLs they searched or fetched.</p><table><tr><th>Source</th><th>Used in</th></tr>${rows.map(([u,v])=>`<tr><td class="wrap"><a href="${esc(u)}" target="_blank" rel="noopener">${esc(v.title)}</a><br><span class="small muted" style="word-break:break-all">${esc(u)}</span></td><td class="small">${[...v.where].join(', ')}</td></tr>`).join('')}</table>`;
  if(INTERNAL) h += `<h2>Run (internal)</h2><table><tr><th>Phase</th><th>Model</th><th class="num">Turns</th><th class="num">Cost</th><th class="num">Seconds</th><th>Result</th></tr>${Object.entries(M.phases||{}).map(([k,p])=>`<tr><td>${esc(k)}</td><td>${esc(p.model)}</td><td class="num">${p.turns}</td><td class="num">$${(p.cost_usd||0).toFixed(2)}</td><td class="num">${Math.round(p.wall_seconds||0)}</td><td class="small">${esc(p.subtype)}</td></tr>`).join('')}</table>`;
  h += `<h2>About this dossier</h2><p>${esc(PRODUCT.disclaimer||'')}</p><p>${esc(PRODUCT.correction_note||'')}</p>`;
  section('sources','Sources',h);
})();

    det.innerHTML=`<div class="row"><span class="b speculation">scenario, speculative by design</span><span class="muted small">${esc(q.replace('_',' / '))}</span></div><h3 style="font-family:var(--serif);font-size:22px;margin:8px 0">${esc(s.name)}</h3>${prose(s.narrative)}<h3>What happens to the organization</h3><div class="kv"><div>Revenue</div><div>${esc(s.effect_on_org.revenue)}</div><div>Programs</div><div>${esc(s.effect_on_org.programs)}</div><div>Staff</div><div>${esc(s.effect_on_org.staff)}</div><div>Standing</div><div>${esc(s.effect_on_org.standing)}</div></div><h3>Early signals to watch</h3>${list(s.early_signals)}<h3>Readiness ${s.readiness.score}/5</h3><p class="small">${esc(s.readiness.rationale)}</p><h3>For a donor</h3><p class="prose">${esc(s.donor_implication)}</p>`; };
  document.querySelectorAll('.q').forEach(b=>b.addEventListener('click',()=>render(b.dataset.q)));
  render(X.most_likely_quadrant||'high_high'); }

// chart: revenue vs expenses by year
(function(){ const el=document.getElementById('chart'); if(!el) return; const R=F.primary.ratios; const ser=R.series.slice(-12);
  const W=940,H=300,padL=56,padR=16,padT=18,padB=34; const max=Math.max(...ser.flatMap(s=>[s.revenue||0,s.expenses||0]))*1.08; const n=ser.length; const gw=(W-padL-padR)/n; const bw=Math.min(22,(gw-10)/2);
  const y=v=>padT+(H-padT-padB)*(1-v/max); const ticks=4; let g='';
  for(let i=0;i<=ticks;i++){ const v=max/ticks*i; g+=`<line x1="${padL}" x2="${W-padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#e2e2e2"/><text x="${padL-8}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#2b2b2b">${money(Math.round(v))}</text>`; }
  let bars='';
  ser.forEach((s,i)=>{ const x0=padL+gw*i+(gw-(bw*2+2))/2; const rv=s.revenue||0, ex=s.expenses||0;
    const bar=(x,v,col,label)=>{ const yy=y(Math.max(v,0)), hh=Math.max(0,y(0)-yy); return `<g class="bar" data-tip="FY${s.year} ${label}: ${money(v)}"><rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw}" height="${hh.toFixed(1)}" fill="${col}" rx="0"/><rect x="${(x-4).toFixed(1)}" y="${padT}" width="${bw+8}" height="${H-padT-padB}" fill="transparent"/></g>`; };
    bars+=bar(x0,rv,'#000080','revenue')+bar(x0+bw+2,ex,'#800000','expenses');
    bars+=`<text x="${(x0+bw+1).toFixed(1)}" y="${H-padB+16}" text-anchor="middle" font-size="11" fill="#2b2b2b">${s.year}</text>`;
    if(i===n-1){ bars+=`<text x="${(x0+bw/2).toFixed(1)}" y="${(y(rv)-6).toFixed(1)}" text-anchor="middle" font-size="11" fill="#000080">${money(rv)}</text><text x="${(x0+bw*1.5+2).toFixed(1)}" y="${(y(ex)-6).toFixed(1)}" text-anchor="middle" font-size="11" fill="#800000">${money(ex)}</text>`; } });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Revenue and expenses by fiscal year">${g}<line x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}" stroke="#999999"/>${bars}</svg><div class="legend"><span><i style="background:#000080"></i>Revenue</span><span><i style="background:#800000"></i>Expenses</span><span class="muted">last ${n} filed years</span></div><div class="tip" id="tip"></div>`;
  const tip=document.getElementById('tip'); el.querySelectorAll('.bar').forEach(b=>{ b.addEventListener('mousemove',e=>{ tip.style.display='block'; tip.textContent=b.dataset.tip; const r=el.getBoundingClientRect(); tip.style.left=(e.clientX-r.left+12)+'px'; tip.style.top=(e.clientY-r.top-28)+'px'; }); b.addEventListener('mouseleave',()=>tip.style.display='none'); });
})();
