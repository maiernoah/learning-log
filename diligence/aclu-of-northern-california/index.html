: "Gearing up for November"}]}, {"said": "Executive Director, 2020 and 2023: do not rely on the courts alone; 'everything we do is political'.", "done": "Legal Director, 2025: 'legal advocacy is where we have decided to funnel all of our resources' and the role is 'primarily legal'. The payroll also leans to law. Yet Union grants to ACLU California Action, about $2.1M-$2.6M a year, and an organizing department show that non-court work exists.", "significance": "Two senior leaders describe the institution differently. This may partly reflect audience and context, since the second quote came in a student interview about legal strategy and was seen only in excerpt. It matters because a deductible gift funds the litigation and education side only.", "basis": "inference", "sources": [{"url": "https://pastforward.org/blogs/public-podcasting/abdi-soltani", "title": "Past Forward"}, {"url": "https://www.montereycountynow.com/people/face_to_face/abdi-soltani/article_79c7304a-3d70-11ea-871b-9ba6ec18fc01.html", "title": "Monterey County Weekly"}, {"url": "https://brownpoliticalreview.org/defending-civil-liberties/", "title": "Brown Political Review interview"}, {"url": "https://www.influencewatch.org/non-profit/aclu-of-northern-california/", "title": "InfluenceWatch"}]}, {"said": "The organization demands transparency from government: open-government and Brown Act work, and a 2026 DHS records suit.", "done": "Its own 990 list stops at FY22, per Charity Navigator's flag and the entity map. It gave no comment on layoffs. No public statement of restructuring outcomes, the national split or senior transitions was found. It is a private nonprofit with no legal duty matching a public agency's, and audits are posted.", "significance": "Not hypocrisy in law. But the organization's standard for others is higher than its practice with its own supporters. It is cheap to fix, and a donor can ask for it.", "basis": "inference", "sources": [{"url": "https://www.charitynavigator.org/ein/940279770", "title": "Charity Navigator"}, {"url": "https://www.aclunorcal.org/about/financial-info-reports", "title": "Financial Info & Reports"}, {"url": "https://hoodline.com/2026/06/aclu-drags-dhs-into-san-francisco-court-over-records-on-filming-feds/", "title": "Hoodline, June 2026"}, {"url": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "title": "Above the Law"}]}, {"said": "The ACLU 'stands up for these rights even when the cause is unpopular.'", "done": "In 2017 it issued a release stating it was not representing the Berkeley Patriot, and that the event spread hate rather than defending free speech, while affirming that the law protects the speakers' expression. No recent NorCal case for an unpopular right-wing speaker was found, but this was not systematically searched.", "significance": "Case selection is a legitimate choice, and declining a client is not a retreat from the principle. Still, the claim was not verified with a recent example here. Treat as an open question to put to the Legal Director. National ACLU disputes on this point were excluded as out of scope.", "basis": "speculation", "sources": [{"url": "https://www.aclunorcal.org/about", "title": "About"}, {"url": "https://www.aclunorcal.org/news/aclu-northern-ca-corrects-record-berkeley-patriot-statement-reported-kqed-s-california-report", "title": "Berkeley Patriot correction"}]}], "five_whys": [{"observation": "The December 2024 strategy post, the organization's fullest public account of its direction, does not mention the restructuring reported that autumn.", "chain": ["Why is it absent? The post addresses supporters about threats ahead, written weeks after the election (evidence: the post).", "Why is external threat the whole story? The framework is explicitly refreshed 'with each presidential term', so its planning calendar follows federal politics (evidence: the post; Legal Director interview).", "Why would that be comfortable? Attention and money rise with the threat: FY25 contributions were $20.2M after a weak FY24, and members rose 20% (evidence for the numbers; the causal link is inference, since no source explains the jump).", "Why does no one force the internal story out? The press covers it as a litigant, and one anonymous-source article is the only coverage of its management found (scan, inference).", "Why does that persist? Governance runs through members, boards and a union, none of which publish to donors. No source shows them publishing a restructuring account (inference from absence)."], "insight": "Accountability is aimed outward. The organization has a developed language for government's conduct and little public language for its own. A donor must supply that demand directly. This is a reading of silence, and private reporting to major donors may exist."}, {"observation": "The Executive Director says courts cannot be relied on; the Legal Director says resources go to legal advocacy.", "chain": ["Why two descriptions? The leaders have different vantage points: an organizer's background versus the head of the legal department (evidence: bios).", "Why does the legal view have material weight? Five of the seven top-paid staff hold legal titles, and attorneys have wide autonomy over cases (evidence; weighting is inference).", "Why does the structure favor law? Deductible gifts fund 'litigation and public education', and lobbying money runs through the c(4), including grants to ACLU California Action (evidence: FAQ, scan).", "Why does this hold in a crisis? Court wins are checkable and fast to report, for example the courthouse-arrest rulings (evidence: scan; the preference is inference).", "Why is the gap not resolved in public? No statement was found that says how resources are split between legal, organizing and policy work, and the framework text was not found (no evidence found)."], "insight": "The organization's stated theory is plural, and its machinery leans legal. A deductible gift buys the legal side by design. The real question for a donor is the current split, and whether the 2024 restructuring moved it. That is unanswered here."}], "unmet_needs": [{"need": "Revenue that does not swing with the federal threat cycle.", "level": "common", "evidence": "FY24 margin of -57.13% (990 basis) then FY25 of +9.27%; a framework tied to presidential terms; bequests and DAFs are significant and unpredictable (scan).", "donor_implication": "Multi-year or endowment-type commitments have more value here than crisis-timed gifts. Ask how the 2025 surge is being held in reserve, and what happens if membership revenue drops."}, {"need": "Trust between staff and management after the restructuring.", "level": "common", "evidence": "A 2020 recognition dispute, and an alleged 'horrible' process in 2024 (anonymous, unverified). No later account was found.", "donor_implication": "Ask for attrition data, the final layoff count and the current state of labor relations. Do not treat silence as resolution."}, {"need": "Continuity of leadership at senior and board level.", "level": "context", "evidence": "A tenure dating from 2009, no succession evidence, and apparent changes in chief program, finance and operations, and legal roles, and in the chair (scan).", "donor_implication": "Ask the chair, not only the Executive Director, about the succession plan. A capacity gift for transition planning could be a real contribution if a plan is lacking."}, {"need": "Absorbing a surge with a recently cut and consolidated structure.", "level": "context", "evidence": "'perhaps the busiest in our 90-plus year history', 40 ongoing cases, and a restructuring in the prior 12-15 months.", "donor_implication": "General operating support fits better than a new project. Ask about attorney caseloads and vacancies."}, {"need": "Evidence of what happens after a ruling.", "level": "activity", "evidence": "The screening standard is 'a ruling with a positive impact'; annual report counts are outputs; no evaluation was found. Siskiyou's auditor and the courthouse-arrest results are the natural test cases.", "donor_implication": "A restricted gift could fund compliance monitoring on one or two major wins. Expect possible resistance if the culture sees evaluation as a distraction, though I found no direct evidence of hostility."}, {"need": "Clarity on how legal, organizing and policy work divide resources under the firewall strategy.", "level": "activity", "evidence": "The conflicting leadership descriptions, the framework text not being public in what was found, and c(3)/c(4) cost allocation.", "donor_implication": "Request the framework and a budget by program. Decide whether a deductible or non-deductible gift better matches your own theory of change."}, {"need": "Credibility as non-partisan while speaking as 'the resistance'.", "level": "qualifier", "evidence": "Recruiting language, Prop 50 neutrality, and the record of challenging Democrats.", "donor_implication": "If bipartisan standing matters to you, ask for examples since 2024 of cases that went against allies. A gift cannot fix this; it is a fit question."}, {"need": "Transparency matching its own public standard.", "level": "qualifier", "evidence": "990 list stops at FY22, the only metric missed on Charity Navigator; no published national split.", "donor_implication": "Make current 990 posting and disclosure of the national share a simple request. Refusal to answer would itself be informative."}], "leadership_dependency": {"verdict": "Institutional identity: not dependent. Public voice and continuity: moderately dependent on the Executive Director.", "rationale": "Identity predates any current leader: the 1934 founding, the national brand, member-elected boards and a four-year framework. Attorneys hold wide case autonomy, and the Legal Director speaks independently. Against that, the Executive Director signs the main letters, presents the year in review, hosts every 2026 tour stop and was first guest on the new podcast. Tenure is about 17 years, with no succession evidence found, while several other senior posts appear to have changed. So the public face and institutional memory concentrate in one role. It is an organization that could survive a transition, but one that has not publicly shown it is ready for one. The board's private planning was not visible.", "basis": "inference", "confidence": 0.6}, "cultural_tensions": ["Plural theory of change versus legal center of gravity (inference from leadership statements and pay).", "Non-partisan institution versus 'We are the resistance' voice (evidence for both phrases; tension is inference).", "Civil-liberties neutrality versus moral commitment: the Legal Director says the line 'is not always clear' and causes 'difficult internal conversations' (evidence).", "Crisis growth versus post-restructuring capacity: the busiest year followed reported cuts (inference; final cuts unconfirmed).", "Attorney autonomy versus top-down framework and possible consolidation; the anonymous allegation about pushing out legal staff suggests friction, which is unverified (speculation).", "Management authority versus a unionized staff that invokes the organization's own values (evidence for 2020; current state not found).", "Federation solidarity versus local mission: money goes to national and statewide vehicles while local programs were reportedly cut (inference; the two were not shown to be linked).", "Firewall framing of California versus suing California cities and counties (inference)."], "failure_tells": [{"pattern": "Long-tenured executive with no visible succession.", "evidence": "In post since 2009; no plan or search found. This is a question, not a finding. There is no founder dynamic, because the organization is 92 years old.", "basis": "evidence", "sources": [{"url": "https://www.aclunorcal.org/bios/abdi-soltani/", "title": "Bio"}]}, {"pattern": "Silence on internal trouble.", "evidence": "No comment to the press, and no public account of the restructuring in over two years. One anonymous-source report is the only record.", "basis": "inference", "sources": [{"url": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "title": "Above the Law"}, {"url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "title": "Forging Ahead"}]}, {"pattern": "Senior turnover without announcement.", "evidence": "Chief program, CFO/COO, legal director and chair changes are inferred from filings and bios, with no announcements found. Ordinary churn is possible.", "basis": "inference", "sources": [{"url": "https://www.aclunorcal.org/about-staff/", "title": "Staff page"}, {"url": "https://www.aclunorcal.org/about/board-of-directors", "title": "Board of Directors"}]}, {"pattern": "Outputs presented as success.", "evidence": "Member counts, case counts and rulings dominate. No outcome evaluation was found. This is common among legal nonprofits and is not specific hostility to measurement, of which I found no direct evidence.", "basis": "inference", "sources": [{"url": "https://www.aclunorcal.org/annualreport/", "title": "2025 Annual Report page"}, {"url": "https://brownpoliticalreview.org/defending-civil-liberties/", "title": "Brown Political Review interview"}]}, {"pattern": "Threat-dependent identity and rhetoric.", "evidence": "A planning cycle tied to presidential terms, 'We are the resistance', and 'democracy is on the line'. The threat may be real, and several courts ruled against federal policy. The risk is what happens to revenue and identity when the moment changes. The prior 2017 surge is suggested by 2017 materials but was not measured here.", "basis": "inference", "sources": [{"url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "title": "Forging Ahead"}, {"url": "https://job-boards.greenhouse.io/aclunc/jobs/8463191002", "title": "Recruiting page"}]}, {"pattern": "Us-versus-them framing, directed at government and not at critics.", "evidence": "Direct language about Trump in 2025, paired with 'stay peaceful'. Prop 36 messaging is called 'hyperbolic, fear-inducing'. I found no hostility toward internal critics or donors. The only outside-account response found is a narrow 2017 correction.", "basis": "evidence", "sources": [{"url": "https://www.aclunorcal.org/press-releases/aclu-norcal-condemns-escalating-federal-force-bay-area-cities-advises-residents-know-their/", "title": "Press release, Oct 2025"}, {"url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "title": "Forging Ahead"}]}, {"pattern": "Not supported by sources: donor flattery, mission creep, founder entrenchment, or explicit burnout language.", "evidence": "No evidence found in readable material. 'An enormous job' and 'busiest' describe load but are not burnout language. Burnout was not assessable without staff sources.", "basis": "inference", "sources": [{"url": "https://www.aclunorcal.org/annualreport/", "title": "2025 Annual Report page"}]}], "ethics_note": "I assessed the organization and its leadership team as a system and made no psychological or personality judgments. Individuals appear only in public professional roles and statements. I deliberately excluded personal identity, family and background material that surfaced in the Executive Director's interviews and profiles, including the KQED segment, even though it was public. I also excluded individuals' later careers and any public controversies at other institutions. Above the Law's anonymous claims are reported as allegations from a single outlet. Union claims are labeled union-side. National ACLU and Southern California disputes, and partisan commentary on national ACLU, were not attributed to this organization. Pay figures are public 990 data, used only to read institutional weight. Employee reviews for national ACLU were not used as evidence about this affiliate.", "gaps": ["The most important limit: the 2024 and 2025 annual report PDFs, the spring 2025 ACLU News, the 2023 development highlights, the union contract and a 2020 job posting were unreadable or failed to load. 'Never mentioned' findings cover only the text I could read and could be overturned by those documents.", "Quotes passed through a fetch summarizer, which sometimes paraphrased. The January 2025 post's quotes were flagged as near-paraphrases. Check any wording against the original before print.", "The Brown Political Review interview was seen in excerpts. The 'funnel all of our resources' line in particular needs full context before weight is placed on it.", "Strategic Framework 2025-2028 text: not found; only the December 2024 summary post. CauseIQ's '2025-2029' date remains unreconciled.", "Restructuring outcome, layoff count, programs ended and any staff or Local 20 statement: no evidence found after targeted search.", "MAKE the CASE episode audio, the 2025 year-in-review video and the Harvard event with the Democracy, Speech & Technology director: no transcripts, not reviewed. The May 2025 Past Forward page returned rate-limit errors, and whether it repeats the 2023 episode is unknown.", "Davis Vanguard's April 2026 piece returned 403; the search summary was the only access, and the author is unknown. It was not relied on.", "Individual Giving Officer and Deputy Director of Development postings returned 403, so the development culture is seen through search snippets only. The Organizing Director posting returned 404, 410 or 403 at each mirror tried.", "Direct donor-communications evidence, such as solicitation emails with matches or stewardship reports: one undated Executive Director email only. No donor or former-staff voices were found.", "Glassdoor page specific to the affiliate: not found. Employee review evidence is effectively absent.", "Client and affected-community voices: case pages were not sampled for this purpose, so the 'beneficiary voice' reading is tentative.", "Board voices: no public statement by the chair or any director was found, so this read reflects staff leadership only.", "Recent NorCal cases on behalf of unpopular or right-leaning speakers: not systematically searched."]}, "scenarios": {"horizon_years": 5, "horizon_rationale": "Five years, to October 2031. Three years would end around the January 2029 federal transition and miss the test that matters most. This organization's revenue has fallen quickly after spikes: Foundation revenue went from $20.2M in FY22 to $12.2M in FY24, then to $21.8M in FY25 (evidence: 990 data). Whether the current surge survives a change in political salience can only be seen in about FY29-FY31 (inference). Five years also covers the end of the 2025-2028 Strategic Framework, appeals in the current immigration cases, any AI-liquidity giving, and an executive director tenure that would reach 22 years if unchanged (inference from a 2009 start). Ten years would mostly be guesswork for an organization whose latest filed data is 19 months old (FYE 3/2025).", "driving_forces": [{"name": "Individual donor salience and large unnamed gifts", "category": "economic", "direction": "High through at least the last filed year; 2026 direction unknown. Foundation contributions rose from $11.05M (FY24) to $20.22M (FY25). Non-national contributions added $6.67M, reaching $12.46M.", "impact": 5, "uncertainty": 4, "relevance": "Contributions are 92.6% of Foundation revenue. The cause of the FY25 jump is unexplained, including any bequest or single gift. Three-year average revenue was about $16.8M against a current expense level of $19.8M, so FY25 is not yet a proven base (inference: my arithmetic). A December 2025 survey found 25% of US donors expected to cut 2026 giving, but it is general and not specific to civil liberties. No evidence found of 2026 giving data for this organization or for civil-rights groups.", "basis": "evidence", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/940279770", "title": "ProPublica: ACLU Foundation of Northern California"}, {"url": "https://www.nonprofitpro.com/article/1-in-4-americans-plan-to-cut-donations-in-2026-survey-finds", "title": "NonProfit PRO: 1 in 4 Americans plan to cut donations in 2026"}]}, {"name": "National ACLU pass-through and gift-sharing formula", "category": "economic", "direction": "Rising in the last two filings: $5.26M (FY24) to $7.77M (FY25). Future direction depends on a formula not found.", "impact": 5, "uncertainty": 4, "relevance": "National supplied 35.6% of FY25 Foundation revenue. Without it, FY25 revenue would have covered about 71% of expenses (inference: arithmetic). Some of this may be NorCal-raised money under gift-sharing, not independent support (speculation). National's own revenue rose 65.7% to $306.8M in FY25, with $779.7M in net assets, so capacity is not the question. Allocation rules are. Wikipedia reports that national subsidies to smaller affiliates are discretionary and that Wyoming lost support in 2015 after national layoffs. Whether that discretion applies to a large affiliate is unknown.", "basis": "evidence", "sources": [{"url": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990ScheduleR", "title": "NorCal Foundation FY25 Schedule R"}, {"url": "https://projects.propublica.org/nonprofits/organizations/136213516", "title": "ProPublica: ACLU Foundation Inc"}, {"url": "https://en.wikipedia.org/wiki/American_Civil_Liberties_Union", "title": "Wikipedia: American Civil Liberties Union"}]}, {"name": "Federal targeting of tax-exempt advocacy groups", "category": "political", "direction": "Escalating in rhetoric and reported planning. No completed revocation found. NSPM-7 was signed in September 2025. A reported Treasury review, described in an August 27, 2026 New York Post story, prompted a Wyden-Warnock inquiry dated September 3, 2026.", "impact": 5, "uncertainty": 4, "relevance": "The ACLU was not named in the material read; the names reported were Open Society Foundations, SPLC and CAIR. No evidence found of action against this organization. Exposure here has specific features: deductible money carries the payroll for both entities under a Resource Sharing Agreement, the 501(c)(4) appoints the Foundation's board, and the organization sues DHS repeatedly. An audit would likely focus on the cost allocation and the $725,000 grant for legislative purposes (inference; this is not a finding of impropriety). DAF sponsors and foundations could pull back before any legal action (speculation).", "basis": "evidence", "sources": [{"url": "https://www.warnock.senate.gov/newsroom/press-releases/warnock-wyden-open-inquiry-into-trump-administrations-political-targeting-of-non-profits/", "title": "Warnock, Wyden open inquiry (search result; fetch blocked)"}, {"url": "https://www.finance.senate.gov/imo/media/doc/09032026lettertobessentandbisignanoontargetingnonprofits.pdf", "title": "Sept. 3, 2026 Senate letter (search snippet; fetch blocked)"}, {"url": "https://www.democracydocket.com/analysis/law-firms-alert-trump-domestic-terrorism-order/", "title": "Democracy Docket: law firms on NSPM-7"}, {"url": "https://www.foxnews.com/politics/feds-launch-probe-unravel-alleged-nonprofit-funding-behind-antifa-linked-violence", "title": "Fox News: DOJ investigates nonprofits"}, {"url": "https://thenonprofittimes.com/npt_articles/threats-and-bluster-the-irss-black-cloud-over-the-nonprofit-sector/", "title": "NonProfit Times: skeptical view of an IRS crackdown"}]}, {"name": "Scope of court remedies against government", "category": "political", "direction": "Mixed. Narrowing: Trump v. CASA limits universal injunctions, and Louisiana v. Callais (April 29, 2026) narrowed Section 2. Still working: Trump v. Barbara (June 30, 2026, 6-3 against the order) and APA vacatur in the courthouse-arrests case (June 2026).", "impact": 5, "uncertainty": 4, "relevance": "Litigation is the core product. The organization's highest-value verified results are court rulings on courthouse arrests, and class or APA relief carries much of the current docket. Commentators expect Rule 23 fights over class relief. A CRS report found appellate stays in only two of the nationwide-injunction cases it identified as of June 27, 2026. Appeal status of the courthouse ruling: no evidence found. Program revenue, read as mostly fee income, swung between $0.48M and $2.88M in FY22-FY25, so court results may also affect revenue (inference). No evidence found on EAJA fee or injunction-bond changes affecting this organization.", "basis": "evidence", "sources": [{"url": "https://www.everycrsreport.com/reports/R49022.html", "title": "CRS: Nationwide injunctions one year after Trump v. CASA"}, {"url": "https://news.bgov.com/ip-law/analysis-post-casa-class-injunctions-face-heavy-burdens", "title": "Bloomberg: Post-CASA class injunctions face heavy burdens"}, {"url": "https://www.faegredrinker.com/en/insights/publications/2026/6/supreme-court-decides-trump-v-barbara", "title": "Faegre Drinker: Trump v. Barbara"}, {"url": "https://sfist.com/2026/06/25/san-jose-federal-judge-blocks-ice-courthouse-arrests-nationwide-in-case-led-by-bay-area-immigrants/", "title": "SFist: June 2026 courthouse-arrests ruling"}, {"url": "https://hoodline.com/2026/06/sf-judge-slaps-nationwide-freeze-on-ice-courthouse-arrests/", "title": "Hoodline: June 2026 ruling"}]}, {"name": "Federal immigration enforcement in Northern and Central California", "category": "political", "direction": "Rising regionally. San Francisco area of responsibility arrests rose from 2,928 (Jan-Jul 2025) to 4,970 (Jan-Jul 2026). DHS disputes one analysis as cherry-picked. The California City facility has a stated capacity of 2,560.", "impact": 5, "uncertainty": 3, "relevance": "This is the largest demand driver for the Criminal Law & Immigration Project and the main public case for giving. Enforcement is fairly predictable through January 2029 and much less so afterward (inference). Enforcement also drives donor salience, so it does not move independently of money. The California City conditions suit was filed in the Northern District, and the government sought transfer to the Eastern District. NorCal's own role in that case was not checked.", "basis": "evidence", "sources": [{"url": "https://www.kqed.org/news/12097313/northern-california-ice-arrests-surged-this-summer", "title": "KQED: Northern California ICE arrests"}, {"url": "https://abc7news.com/post/ice-arrests-san-francisco-bay-area-70-uc-berkeley-data-project-finds/19754574/", "title": "ABC7: Bay Area ICE arrests"}, {"url": "https://www.aclu.org/cases/gomez-ruiz-et-al-v-ice", "title": "ACLU: Gomez Ruiz v. ICE"}, {"url": "https://hoodline.com/2026/02/sf-court-weighs-immigrant-lawsuit-over-conditions-at-california-city-ice-jail/", "title": "Hoodline: California City suit"}]}, {"name": "Federal election cycle: 2026 midterms and 2028 presidency", "category": "political", "direction": "Democrats are favored to win the House on November 3, 2026 (DDHQ 82% as of Oct. 30; other models higher). The 2028 result is open.", "impact": 4, "uncertainty": 4, "relevance": "The 2028 result would change the enforcement load and donor urgency together. A House flip adds oversight but does not end executive enforcement (inference). The Foundation's revenue fell from FY22 to FY24 under a Democratic administration and jumped in the year of the 2024 election, which is suggestive but only one cycle (inference).", "basis": "evidence", "sources": [{"url": "https://votes.decisiondeskhq.com/forecast/2026", "title": "Decision Desk HQ forecast"}, {"url": "https://www.cnbc.com/2026/10/30/2026-midterm-election-wall-street-prepares-for-democratic-gains.html", "title": "CNBC: Wall Street braces for Democratic gains"}]}, {"name": "Executive and board continuity", "category": "social", "direction": "In transition. The executive director has served since 2009. The chair appears to have changed. The COO listed on the FY25 990 does not appear on the staff page, and the current CFO-level officer is not established.", "impact": 4, "uncertainty": 4, "relevance": "No succession plan or announced departure was found. A transition is likely to fall inside the horizon (inference, not a statement about any individual's plans). It would coincide with renewal of the strategic framework, and possibly a donor downturn. Staff are unionized with ESC/IFPTE Local 20. Anonymous sources told Above the Law in October 2024 that restructuring was badly handled, and the organization did not respond. Those are allegations. Reported employees fell from 130 to 117.", "basis": "evidence", "sources": [{"url": "https://www.aclunorcal.org/bios/abdi-soltani/", "title": "ACLU NorCal: Executive Director bio"}, {"url": "https://www.aclunorcal.org/about/board-of-directors", "title": "ACLU NorCal: Board"}, {"url": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "title": "Above the Law, Oct. 29, 2024"}, {"url": "https://www.ifpte.org/news/staff-at-aclu-of-northern-california-file-for-union-recognition-with-nlrb", "title": "IFPTE release, May 2020"}]}, {"name": "AI liquidity among Bay Area households", "category": "economic", "direction": "Potentially very large, timing unconfirmed. Published estimates vary, including $12-32B into DAFs. Forecasts place Anthropic's IPO around December 2026 and OpenAI's in 2027, but these are projections.", "impact": 3, "uncertainty": 5, "relevance": "The organization already receives money through DAF conduits ($1.50M from DAFgiving360 in 2025) and from local community foundations ($803,800 from San Francisco Foundation in 2025). Bay Area wealth could lift it. But much of the commentary points to effective-altruist and AI-safety causes, and DAF money can sit undistributed. No evidence found of flows to civil-liberties groups or Bay Area nonprofits specifically. The upside for this organization is speculation.", "basis": "inference", "sources": [{"url": "https://thenextweb.com/news/effective-altruism-ai-ipo-windfall-philanthropy-third-wave", "title": "The Next Web: AI IPOs and EA philanthropy"}, {"url": "https://axios.com/2026/10/19/silicon-valley-ai-philanthropy-anthropic-fund", "title": "Axios: AI giants and philanthropy (search result; fetch blocked)"}, {"url": "https://www.techbrew.com/issues/75-new-openai-millionaires", "title": "Tech Brew: OpenAI millionaires"}, {"url": "https://www.influencewatch.org/non-profit/aclu-foundation-of-northern-california2/", "title": "InfluenceWatch, citing Candid"}]}, {"name": "Pro bono chill and donated legal capacity", "category": "social", "direction": "Weakening nationally since 2025. Fourteen civil-rights groups reported hesitant or declining firms. Some California firms still appear on immigration cases.", "impact": 3, "uncertainty": 3, "relevance": "This dependency does not show in 990 revenue. Audits and annual reports show donated legal services of $6.84M in FY22 and $3.90M in FY24, about 31% and 13% of total expenses on that basis (inference: arithmetic). Losing outside firms would mean paying for that capacity or dropping cases. No evidence found of whether the FY22-FY24 fall reflects case mix or firm retreat, and it predates the 2025 executive orders.", "basis": "evidence", "sources": [{"url": "https://reason.com/2025/07/31/law-firms-take-fewer-pro-bono-clients-after-trumps-unconstitutional-orders", "title": "Reason: Law firms take fewer pro bono clients"}, {"url": "https://www.keker.com/news/news-items/immigrants-ice-detention-conditions-san-francisco", "title": "Keker: California City detention case"}, {"url": "https://www.aclunorcal.org/about/financial-info-reports", "title": "ACLU NorCal: Financial Info & Reports"}]}, {"name": "California as a firewall: state law, state courts and politics", "category": "political", "direction": "Politically favorable but unreliable. PollCheck's average shows Becerra at 56.5% and Hilton at 35.7% (unverified). The state legislature failed for a fifth year to regulate license-plate readers. Callais raises questions about the California Voting Rights Act, and DOJ has invoked it against the Prop 50 map.", "impact": 4, "uncertainty": 2, "relevance": "The strategic framework names state reform as a 'firewall for freedom' and commits to more California Supreme Court advocacy. The record is mixed: SB 1013 died in 2026 after a 2025 veto, and a Santa Clara County judge dismissed the San Jose Flock suit. A new California Voting Rights Act bill and the Huntington Beach remand are live tests. If federal courts narrow, this is the fallback, and it is less firm than the framing suggests (inference).", "basis": "evidence", "sources": [{"url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "title": "ACLU NorCal: Forging Ahead (Dec. 13, 2024)"}, {"url": "https://calmatters.org/economy/technology/2026/09/california-kills-flock-camera-regulation-again/", "title": "CalMatters: California kills Flock regulation"}, {"url": "https://www.kqed.org/news/12102922/south-bay-judge-rules-san-joses-flock-cameras-dont-invade-privacy", "title": "KQED: San Jose Flock ruling"}, {"url": "https://bbklaw.com/resources/la-060926-louisiana-v-callais-the-california-voting-rights-act-and-sb-1164-the-state-of-the-law", "title": "BBK: Callais and the California Voting Rights Act"}, {"url": "https://www.awattorneys.com/blog/aw-in-the-newskey-california-voting-rights-act-case/", "title": "A&W: Key CVRA case"}, {"url": "https://www.pollcheck.co.uk/us-midterms-2026/governor/california", "title": "PollCheck: California governor"}]}, {"name": "Surveillance technology and public backlash", "category": "technological", "direction": "Tools are expanding, and local resistance is rising. Secure Justice counted more than 200 cities or agencies ending plate-reader contracts in August 2026. FOIA suits and congressional letters target Palantir tools at DHS.", "impact": 3, "uncertainty": 3, "relevance": "This feeds the Democracy, Speech & Technology Project and gives local wins even when courts refuse relief. San Jose cut retention to 30 days after the suit, though the suit was later dismissed. The field is crowded: EFF is both partner and competitor, and Just Futures Law and American Oversight bring the federal records suits. Evidence for California-specific federal tool use was not found.", "basis": "evidence", "sources": [{"url": "https://calmatters.org/economy/technology/2026/09/california-kills-flock-camera-regulation-again/", "title": "CalMatters: Flock regulation"}, {"url": "https://www.404media.co/immigrant-rights-lawyers-file-lawsuit-over-palantirs-elite/", "title": "404 Media: Palantir ELITE suit"}, {"url": "https://www.biometricupdate.com/202604/lawmakers-press-dhs-ice-over-palantir-surveillance-tools", "title": "Biometric Update: Lawmakers press DHS"}]}, {"name": "Partner and public-funding stress in the regional legal ecosystem", "category": "economic", "direction": "Worsening. The State Bar says $187M in federal legal-aid funding is at risk, and San Jose cut immigrant-defense funding. Asian Law Caucus, ILRC and EFF all ran deficits in their latest filings.", "impact": 3, "uncertainty": 3, "relevance": "The organization relies on partners for co-counsel and intake, and weaker partners could push matters and expectations onto it (inference). Tax rules matter less here. The 0.5% AGI floor and 35% cap apply from 2026, and I found no aggregate estimate of their effect. California's Prop 40 billionaire tax trails 46-52 in PPIC's October poll, and any effect on this organization is speculation.", "basis": "evidence", "sources": [{"url": "https://www.calbar.ca.gov/news/state-bar-report-finds-funding-cuts-would-severely-weaken-legal-aid-lifeline-millions-californians", "title": "State Bar: legal aid funding"}, {"url": "https://hoodline.com/2026/05/san-jose-slashes-immigrant-defense-cash-as-budget-crunch-bites/", "title": "Hoodline: San Jose immigrant defense funding"}, {"url": "https://www.accountingtoday.com/news/charitable-deduction-gets-caps-floors-and-haircuts-in-obbba", "title": "Accounting Today: OBBBA charitable deduction"}, {"url": "https://www.pressdemocrat.com/2026/10/27/california-billionaires-tax-prop-40-poll/", "title": "Press Democrat: Prop 40 poll"}]}, {"name": "Water scarcity and land enforcement as a civil-rights front", "category": "environmental", "direction": "Possibly growing, with thin evidence. The Siskiyou County cases tie water ordinances and traffic stops to Asian American residents. Water-access claims were unresolved at the January 2026 settlement.", "impact": 1, "uncertainty": 3, "relevance": "This is the only concrete environmental link I found in the docket. Climate-driven displacement and post-Grants Pass enforcement could add rural and unhoused-rights work, and the framework commits to exploring protections for unhoused residents. No evidence found linking wildfire or climate displacement to this organization's work. Environmental factors are not a material driver on current evidence.", "basis": "inference", "sources": [{"url": "https://nextshark.com/siskiyou-county-settlement-asian-discrimination-lawsuit", "title": "NextShark: Siskiyou settlement"}, {"url": "https://www.nbcnews.com/news/asian-america/california-county-repeals-water-regulations-asian-americans-say-target-rcna98621", "title": "NBC News: Siskiyou water regulations"}, {"url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "title": "ACLU NorCal: Forging Ahead"}]}], "axes": [{"name": "Axis 1: The legal channel. Can this organization still use courts to bind government, without being disabled for trying?", "low_pole": "Closing. Class and APA relief are routinely narrowed or stayed, fee recovery shrinks, outside firms stay away, and federal action burdens the organization or its federation (audit, revocation attempt, or subpoenas).", "high_pole": "Open. Class and APA relief survive appeal, federal targeting does not reach the ACLU or fails in court, and co-counsel stays available. Doctrine may be narrower, but wins still bind.", "why_critical": "Two forces each score 20 (impact 5 x uncertainty 4): court remedies and federal targeting. They are one axis because both decide whether litigation stays usable, and any revocation or subpoena fight would itself be decided by the courts. The record truly points both ways: CASA and Callais against Barbara and the courthouse vacatur. It is largely independent of Axis 2 because it depends on judges and federal agencies, not donors. The link is imperfect. Retaliation could scare off DAFs and lower money, while adverse rulings could raise anger giving. Because those effects run in opposite directions, the axes do not reduce to one.", "runners_up_rejected": "Immigration enforcement (15) and the 2028 election (16) both shape donor urgency, so they would largely duplicate Axis 2. They are used as causes inside scenarios. Executive and board continuity (16) is independent but scored lower, and it is partly in the board's control, so it is treated as a robust move and not an external uncertainty. The California firewall (8) has low uncertainty in political direction. AI liquidity (15) is a sub-cause of Axis 2."}, {"name": "Axis 2: Money reaching the Foundation. Does the FY25 level hold after urgency fades?", "low_pole": "Reversion. Foundation revenue sits at about $16M or less in filed years, at or below the FY23-FY25 average of $16.8M and well under the $19.8M expense level. National pass-through is flat or down.", "high_pole": "New base. Foundation revenue holds at about $22M or more through FY31, at or above FY25's $21.8M, with non-national contributions above $12.5M.", "why_critical": "Individual giving and the national pass-through each score 20, and they share one outcome: revenue into an entity that is 92.6% contribution-funded and got 35.6% of FY25 revenue from national. The thresholds come from the organization's own filings. The red three-year margin is driven by FY24, but the structural question is real: the average revenue of the last three years does not cover the current cost base. FY26 is unfiled, so the post-2025 trend is unknown. This beats other economic forces because it directly sets payroll, the largest fixed cost.", "runners_up_rejected": "Tax-law changes score low (no aggregate estimate found; the effect looks marginal on the mechanics). Prop 40 has only a speculative link. Pro bono capacity (9) matters but is smaller and folded into Axis 1. Partner stress (9) shifts workload but does not determine survival."}], "scenarios": [{"quadrant": "high_high", "name": "The Long Docket", "narrative": "Speculation, written from October 2031. The surge turned out to be a new base. Foundation revenue never fell back to the FY24 level. Member growth held after 2025, national kept sending high-single-digit millions, and Bay Area equity gifts began reaching the Foundation through DAFs around 2028. The courts stayed usable. The Ninth Circuit left most of the courthouse-arrests relief in place, and class practice survived tougher Rule 23 scrutiny. Treasury's review of exempt groups produced headlines and hearings, but no action against the ACLU federation. The organization built Fresno and Sacramento into real legal offices and handled more cases through the 2028 election. A leadership transition happened on a planned timetable. The harder question was discipline. Reserves passed 30 months twice, and donors began asking why a group with that cushion still ran urgent appeals. Peers such as the Lawyers' Committee and Asian Law Caucus remained thinner. The organization's main failure mode was no longer scarcity. It was size without proof, since outcomes beyond rulings were still mostly self-reported.", "effect_on_org": {"revenue": "Speculation: Foundation $24M-$30M a year by FY31; national $8M-$12M, still about a third of revenue; fee income recovers above $2M in good years.", "programs": "Speculation: Central Valley litigation becomes a durable capacity. Immigration remains the largest program. California Supreme Court work grows. Technology work continues mostly in partnership with EFF.", "staff": "Speculation: 140-150, against 117 in the FY25 filing. Union bargaining stays orderly because the money supports it.", "standing": "Speculation: clear regional leader by scale, with growing scrutiny of reserves and of the evidence of effect."}, "early_signals": ["FY26 990 shows Foundation revenue of $22M or more and expenses above $21M, indicating the money is being deployed. Recent filing timing suggests availability in 2027 (inference).", "Related-organization contributions on the FY26 Part VIII remain at $7M or more.", "Ninth Circuit denies a stay or affirms the courthouse-arrests relief.", "Membership above the reported 120,000 in the next annual report.", "Sustained attorney postings for Fresno and Sacramento on the organization's Greenhouse board.", "Anthropic or OpenAI listings occur and DAF-routed gifts to the organization rise on CauseIQ or Candid in 2027 and later."], "readiness": {"score": 4, "rationale": "Money is not the barrier. Net assets were $45.8M at the Foundation and $17.85M at the 501(c)(4) at FYE 3/2025, and it is hiring. The missing point is absorption: only about 7% of the FY25 revenue increase reached expenses that year (inference), and the 2024 restructuring shows recent trouble with cost growth. No expansion plan was read."}, "donor_implication": "Unrestricted money adds little. Give only for a named multi-year capacity or an evaluation of outcomes, or fund a thinner peer."}, {"quadrant": "high_low", "name": "Winning on a Smaller Payroll", "narrative": "Speculation, written from October 2031. The courts held, but the money did not. The most important wins came in 2026-2028, and a federal transition in January 2029 lowered the temperature. Donor urgency faded quickly, as it had after FY22. National, under pressure from falling revenue of its own, kept its pass-through near FY24 levels. Foundation revenue returned to about $14M, while costs were still near $22M. The board first drew on reserves, as it had in FY24, then restructured. This time the union bargained hard, with memories of 2024 still in place. Staff fell by about a fifth, and regional legal positions were the first argued over. Yet this was not a defeat. A less hostile federal government meant fewer emergency filings, and rulings won earlier still needed enforcement. Monitoring those wins fell to fewer lawyers. San Francisco held on, while Fresno shrank to a small presence. A new executive director inherited the cuts. Reserves stayed above a year of expenses, so the institution was never in danger. Its reach was.", "effect_on_org": {"revenue": "Speculation: Foundation $13M-$16M, with national at $4M-$6M; fee income may rise as earlier wins pay out, but unevenly.", "programs": "Speculation: consolidation around immigration enforcement and policing, with narrower technology and reproductive work. Central Valley litigation is the vulnerable item. Compliance monitoring in Siskiyou and similar matters is under-resourced.", "staff": "Speculation: 95-105. A second restructuring within seven years would strain labor relations and senior legal retention.", "standing": "Speculation: respected, but less present. Peers take the lead on individual fronts."}, "early_signals": ["FY26 or FY27 Foundation revenue falls below $18M while expenses keep rising.", "National's own revenue drops from $306.8M in its next filings, and related-organization contributions to NorCal fall.", "Membership growth stalls below 120,000, or 501(c)(4) program revenue drops from $5.66M.", "Democrats win the House and donors' stated urgency drops in the organization's own appeals or event results.", "Postings for Fresno stop or remain unfilled.", "Successor to the 2025-2028 Strategic Framework mentions consolidation."], "readiness": {"score": 3, "rationale": "It has been through this before: FY24 ran a $6.95M 990 deficit, and reserves absorbed it before reported restructuring. Unrestricted net assets of about 22.7 months give time, though the board-designated share is unknown. Weak points: no reserve policy was read, no succession plan was found, and the 2024 process drew anonymous allegations of poor handling."}, "donor_implication": "This is where a donor's marginal dollar counts most. Pledge now for FY29-FY31 attorney positions, because the money is scarcest after the headlines end."}, {"quadrant": "low_high", "name": "Rich and Blocked", "narrative": "Speculation, written from October 2031. Anger kept the money coming while the courts narrowed what it could buy. A successor administration kept enforcement high. Appellate rulings tightened class certification, and doctrine after Callais weakened race-based voting claims, including part of the California Voting Rights Act. District-court wins were more often stayed. Fee income shrank to almost nothing, and fewer large firms took co-counsel roles, so the organization paid for work previously donated. Federal pressure came as burden, not a knockout: an IRS examination of cost allocation between the Foundation and the 501(c)(4), and document demands. Both consumed senior legal time, and neither ended in revocation. Meanwhile donations held, and reserves grew. The strategy moved to California: state constitutional claims, local policy, legislation through the 501(c)(4), and public records. Results were real but limited. Sacramento still would not reliably pass surveillance limits, and state judges did not always agree. Federal detainees outside state reach gained little. Donors began noticing the gap between what they were asked to fund and what could be won.", "effect_on_org": {"revenue": "Speculation: Foundation $22M-$28M; fee income below $0.5M; 501(c)(4) gifts rise as lobbying gains weight. Reserves above 30 months.", "programs": "Speculation: shift from federal class actions to state-court claims, local ordinances, records work, and know-your-rights work. Individual habeas partnerships grow if capacity is available.", "staff": "Speculation: 120-130. Mix moves toward policy, organizing and compliance. More paid litigation support replaces donated hours.", "standing": "Speculation: loud and well funded, with a weaker record of binding outcomes. Value-for-money questions increase."}, "early_signals": ["Ninth Circuit or Supreme Court stays or narrows the courthouse-arrests relief or a Rule 23 class.", "San Jose plaintiffs lose on appeal, or do not appeal.", "A California appellate court limits the California Voting Rights Act in the Huntington Beach line, or the 2026 replacement bill fails.", "Public disclosure of IRS or subpoena activity touching any ACLU entity, while FY26 giving stays strong.", "Donated legal services in the audit fall below the FY24 level of $3.90M.", "Foundation-to-501(c)(4) grants rise above $725,000."], "readiness": {"score": 3, "rationale": "The framework already names state reform as a firewall and promises more California Supreme Court work, and the sister 501(c)(4) held $17.85M in net assets. But SB 1013 died and the San Jose suit was dismissed, so the fallback is untested at scale. Resource Sharing Agreement allocation was not independently tested in anything read."}, "donor_implication": "Ask how it is measuring results outside federal court. Tie money to state-law and local outcomes. Consider direct removal defense, where individual cases can still help when class relief cannot."}, {"quadrant": "low_low", "name": "The Squeeze", "narrative": "Speculation, written from October 2031. Both supports weakened at once. Federal action moved from memos to enforcement: an examination of ACLU entities, a revocation attempt in the federation, and pressure on DAF sponsors. Even before any court ruled, some sponsors and foundations paused grants. Those conduits had provided the largest named gifts. National, spending on its own defense and revenue falling, cut its pass-through hard. Courts narrowed remedies, and firms stayed away, which raised costs just as income fell. Foundation revenue dropped to about $11M against about $20M of costs. Reserves bought roughly four years on paper, but legal defense and severance shortened that. The board structure became a live issue: the 501(c)(4) appoints the Foundation's board, and the Foundation employs everyone. Separating them under audit was slow and expensive. An executive transition landed mid-crisis. The organization closed regional offices and kept a small core of lawyers. It survived. What it lost was breadth: multi-issue state and local advocacy, which peers were too stretched to absorb.", "effect_on_org": {"revenue": "Speculation: Foundation $9M-$12M; national below $3M. If deductibility is suspended for even a period, large gifts drop further. Burn of about $9M a year on $37.45M of unrestricted net assets gives about four years before designations and defense costs (arithmetic on assumed inputs).", "programs": "Speculation: immigration and core government-conduct cases continue. Central Valley litigation, technology and reproductive work shrink or move to partners. Lobbying is constrained by the Foundation's ability to fund the 501(c)(4).", "staff": "Speculation: 70-85. Legal staff departures to firms or government. Union conflict over cuts. Payroll may have to be restructured between entities.", "standing": "Speculation: a symbol of resistance to supporters, and a compliance risk to some institutional funders. Reduced capacity on the ground."}, "early_signals": ["Any revocation notice, IRS examination, grand jury subpoena or formal designation against an ACLU entity or close peer, and how courts respond.", "Treasury's reply to the Wyden-Warnock request, or a published 'blueprint'.", "A major DAF sponsor restricts grants to named advocacy groups.", "Named grants from DAFgiving360, Fidelity Charitable or Vanguard Charitable fall sharply in 2026-2027 data.", "Related-organization contributions drop below $5M at the same time as non-national contributions fall.", "Sudden departure of a senior finance or legal officer; WARN filing or 45-day notices at NorCal."], "readiness": {"score": 2, "rationale": "Balance-sheet resilience is the main strength: liabilities are 7.1% of assets, and reserves are large. No evidence found of a federal-action contingency plan, legal defense budget, succession plan, or current CFO-level officer. All staff sit on the Foundation payroll, and the 501(c)(4)-appointed board structure would complicate any separation."}, "donor_implication": "Keep gifts staged and check payee and deductibility before each payment. Ask for contingency plans now. If revocation is threatened, get tax advice before giving."}], "most_likely_quadrant": "high_low", "most_dangerous_quadrant": "low_low", "judgment": "Most likely by 2031: high_low, Winning on a Smaller Payroll. My rough judgment, which is not a calculation: high_low 35%, high_high 25%, low_high 25%, low_low 15%. The organization probably passes through high_high first. Enforcement is rising, the last filed revenue was $21.8M, and courts are still granting relief. The call for 2031 rests on the organization's own record: revenue fell from $20.2M to $12.2M in two years after FY22 (evidence), and the three-year average of $16.8M does not cover $19.8M of costs (inference). Barbara and the courthouse rulings suggest the legal channel narrows without closing, though Callais and CASA show the risk (inference). Three things would change this view: a 2028 Republican win with continued enforcement, AI money actually reaching this group, or a court ruling that blocks class relief.\n\nMost dangerous: low_low, The Squeeze. It is dangerous because the shocks come together: DAF conduits, national pass-through and deductibility could all come under pressure from one federal campaign, while the legal response costs more (speculation). Solvency is still not the near-term issue. On the FY25 balance sheet, this organization probably outlasts a four-year squeeze. The danger is loss of capacity and breadth. A donor should not read the red margin flag as a survival warning, or the large reserves as proof of safety. Reserve figures are unaudited in what I read, and the FY25 audit was not read.\n\nPractical read: a gift now mainly adds to a cushion. The same gift committed for the post-2028 years is more likely to protect capacity. There is no evidence of an integrity or solvency problem. The largest unknowns are FY26 results and how much of the national flow is NorCal's own money. Results of the November 3, 2026 election arrive four days after this writing, and should be checked against these scenarios.", "robust_moves": [{"move": "Before giving, get the money map in writing: the FY26 actuals and FY27 budget; the current gift-sharing formula and whether a restricted gift is exempt; the split of the $7.77M between NorCal-raised money and national support; the board-designated share of the $37.45M; the reserve policy; and the planned response if Foundation revenue falls to $16M.", "why_robust": "Each scenario turns on these unknowns. In high_high they show whether money is being deployed. In the low-money quadrants they show how long capacity lasts and who decides what is cut. They cost the donor nothing and test management's candor."}, {"move": "Fund one named capacity through a staged, multi-year pledge that extends past January 2029, such as Central Valley attorney positions at about $200,000-$350,000 a year each (loaded cost is my assumption). Weight payments toward FY29-FY31, with written reporting on outcomes and not just filings.", "why_robust": "It matches the organization's cycle of banking spikes and cutting in troughs. It protects the likeliest thing to be cut in high_low and low_low, supports the fallback strategy in low_high, and in high_high it remains a bounded expansion with evidence attached. Staging lets the donor stop or redirect if conditions change. Whether the Central Valley gap is real still needs testing."}, {"move": "Ask for, and offer one-time funding toward, an institutional-resilience package: a board-approved succession plan for executive and finance roles; independent review of the Resource Sharing Agreement allocation and Foundation-to-501(c)(4) grants; outside counsel's contingency plan for IRS action, covering the Designator structure and payroll; and a donor-communications plan for any deductibility change.", "why_robust": "A leadership transition is likely in every scenario. Clean cost allocation is good practice even if no federal action happens, and essential if it does. The cost is small relative to a $26M combined expense base, and it reduces the chance that a shock in any quadrant becomes an institutional failure."}], "gaps": ["Scenario narratives, numeric ranges, probabilities and readiness scores are my judgment. The revenue and staffing ranges are anchored to filed history, but they are not forecasts from any organizational plan.", "FY26 financials and current budget: no evidence found. The newest filed data ends March 2025, about ten weeks into the current federal administration. Current position on both axes is partly unknown.", "Conflict between earlier research sections: the scan could not read FY25 Schedule R or Schedule I, while the landscape section reports figures from them through a fetch summarizer. I used the $7,765,506 and $725,000 figures, but they should be checked against the raw filing. Direction of the national flow is inferred from line codes.", "Personnel share is unresolved (59.79% from the extract versus 77.7% from Intellispect). Payroll exposure in the scenarios may be understated.", "FY24-FY25 audit contents remain unread, so reserve composition, opinions and any reserve policy are unconfirmed. Donated-legal-services percentages use FY22 and FY24 figures from snippets and annual-report-basis totals.", "Federal targeting: the New York Post report was seen only as described in a Senate letter snippet. The Senate letter, the Warnock release and the Axios article returned 403 on fetch, so these rest on search snippets. No evidence found that the ACLU or this organization has been named or examined. No IRS, court or NLRB docket was searched directly.", "Courthouse-arrest case: reports conflict on the scope of the June 2026 relief, and appeal status was not found. NorCal's role in Gomez Ruiz v. ICE was not checked. San Jose appeal status was not found.", "No evidence found on EAJA fee changes, Rule 65(c) bonds in this organization's cases, or the composition of program revenue by case. Reading Foundation program revenue as fee income is inherited from the landscape section.", "National ACLU: no 2026 fundraising, layoff or allocation information found. The historical subsidy precedent comes from Wikipedia and concerns a small affiliate.", "AI wealth: estimates come from forecasters, blogs and advocacy-adjacent commentary, and IPO dates are projections. No evidence found of giving to civil-liberties groups or Bay Area nonprofits from this source.", "California governor polling comes from an aggregator I could not verify against pollster releases. Status of the 2026 California Voting Rights Act bill was not checked. SB 1013's precise procedural end was not confirmed.", "Environmental force: searches found no link between wildfire or climate displacement and this organization. The Siskiyou link is one case line, and its trend is unmeasured.", "AI as a cost-changing tool inside legal work was not assessed. A search-free guess would be speculation, so it was left out of the forces."]}, "assessment": {"bottom_line": "ACLU of Northern California is a solvent, well-governed regional civil-liberties law shop, spending about $25M a year, whose court wins are real but shared and often provisional. The thing most likely to go wrong is not collapse: the 2025 donor surge fades, as the FY22 spike did, and the organization quietly cuts capacity again even with large reserves. A gift is best used for a named, staged, multi-year capacity that reaches past January 2029, because an unrestricted gift today mostly adds to a cushion of about 23 months.", "health_score": {"score": 67, "grade": "C+", "components": [{"name": "Financial resilience", "score": 74, "weight": 25, "rationale": "Scored 0-100; the total is the weighted average. Grade bands used here: A 85+, B 70-84, C 55-69, D 40-54. Strong balance sheet: FYE 3/2025 Foundation net assets of $45.8M, of which $37.45M has no donor restriction (about 22.7 months of expenses, my arithmetic); liabilities are 7.1% of assets; the 501(c)(4) adds $17.85M. Weak revenue base: 92.6% contributions, and the three-year average revenue of $16.8M is below the $19.8M cost level. Revenue moved -25% in FY24 and +79.5% in FY25. National supplied $7.77M, or 35.6% of revenue. The combined audits show losses of about $3.3M in both FY23 and FY24. Points withheld because the board-designated share is unknown ($6.38M attorney-fee fund at 3/2024 is the only known piece), no reserve policy was read and FY26 is unfiled."}, {"name": "Governance and transparency", "score": 68, "weight": 20, "rationale": "Process looks sound on the filing: 20 voting directors, all reported independent; conflict, whistleblower and retention policies; independent pay review; no excess-benefit transactions, insider loans or diversion reported; combined audits posted through FY25; Charity Navigator 97%; Candid Platinum. Deductions: the site's 990 list stops at FY22; no public account of the 2024 restructuring; no published national split; senior and chair changes unannounced in what was found. Structure needs understanding, though it is not an impropriety: Schedule R says the 501(c)(4) appoints the Foundation's directors, so deductible donors have no formal voice. Filings show 20 and 38 voting directors while the current site lists 16 and 24, which is unexplained. AG registry and audit opinions were not read directly."}, {"name": "Change delivered and evidenced", "score": 60, "weight": 20, "rationale": "From the ledger's nine ranked outcomes: one at significance 4 (Sequen), none at 5. Seven are co-lead, one is one of many, and the only sole lead (Fresno K-9 records) is significance 1. Durability: four too early, three partly reversed (Zepeda Rivas expired, UFW injunction lifted, Marin allegedly breached) and two in force, both significance 2. Failures include TPS, Prop 36, SF Prop E and the San Jose Flock dismissal in about October 2026. Rulings do not rest on the organization's word, which earns real credit. Effects on people are almost entirely unmeasured. No points for members, bills monitored or case counts."}, {"name": "Strategic position in the field", "score": 75, "weight": 15, "rationale": "Largest multi-issue organization in the reviewed regional peer set, with six programs, a paired 501(c)(4), the ACLU brand and active Central Valley recruiting. Demand is rising on the one front with counts: San Francisco-area ICE arrests rose from 2,928 to 4,970 between Jan-Jul 2025 and Jan-Jul 2026. Not unique on any issue: LCCRSF co-counsels the same cases, EFF leads on surveillance, and a separate S.D.N.Y. suit reached a nationwide ruling too. Peers are financially thinner, which argues against this organization being the most cash-constrained option. Leadership here means scale, not proven effectiveness."}, {"name": "Culture and leadership", "score": 58, "weight": 10, "rationale": "Clear legal discipline ('Is this worth our resources?'), attorney autonomy, a record of challenging a Democratic administration, and no visible donor flattery. Offsetting that: accountability language points outward; silence on the restructuring for over two years; anonymous allegations of poor handling, unverified; the 2020 recognition dispute, though a bargaining agreement was executed May 15, 2024; 'We are the resistance' beside 'non-partisan'; no authored account of failure found; no succession evidence in a 17-year tenure. Staff and donor voices are largely absent, so this score is low-confidence."}, {"name": "Readiness for the scenarios", "score": 60, "weight": 10, "rationale": "Scenario readiness scores were 4, 3, 3 and 2 out of 5, averaging 3. Reserves buy time in every quadrant, and FY24 shows the board acts on deficits. Nothing was found on a federal-action contingency plan, a succession plan, a current CFO-level officer or an expansion plan. Payroll sits wholly in the Foundation, and the Union appoints its board, which would complicate any forced separation."}]}, "premortem": [{"rank": 1, "failure_mode": "The second squeeze: revenue reverts after urgency fades and the organization cuts capacity while still holding large reserves.", "mechanism": "1) FY25's $20.2M of contributions proves partly one-off or tied to the threat cycle. 2) After the 2026 and 2028 elections, urgency drops; Foundation revenue returns to about $14M-$16M against costs near $20M-$22M. 3) The board does what it appears to have done in 2024: it acts on a deficit rather than draw reserves down. 4) A second restructuring within about seven years hits a unionized staff under a contract. 5) Costly, hard-to-fund positions go first, likely Fresno and Central Valley litigation and compliance monitoring. 6) The donor who funded the 'surge' finds a smaller organization with a big balance sheet. Probability is defined as: Foundation revenue under $16M in a filed year by FY31 and a staff cut of 15% or more.", "probability": 0.45, "horizon": "FY28-FY31", "evidence_chain": [{"fact": "Foundation revenue fell from $20.2M (FY22) to $12.2M (FY24), then rose to $21.8M (FY25).", "source": "https://projects.propublica.org/nonprofits/organizations/940279770", "basis": "evidence"}, {"fact": "Three-year average revenue of about $16.8M sits below the $19.8M cost level.", "source": "https://projects.propublica.org/nonprofits/organizations/940279770", "basis": "inference"}, {"fact": "The FY25 jump is unexplained. Non-national contributions added $6.67M, and any bequest share is unknown.", "source": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990", "basis": "evidence"}, {"fact": "Reported restructuring in October 2024 came with about 27 months of net assets on hand at FYE 3/2024, so a large cushion did not prevent cuts. Motive is my inference, and the reporting is anonymous and single-source.", "source": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "basis": "inference"}, {"fact": "Reported employees fell from 130 to 117 between the FY24 and FY25 filings.", "source": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990", "basis": "evidence"}, {"fact": "The strategic framework is refreshed with each presidential term, tying planning to the federal cycle.", "source": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "basis": "evidence"}, {"fact": "Fresno recruiting is recent, so that capacity would be among the newest to defend. Which posts would be cut first is speculation.", "source": "https://legalalphabet.com/job/staff-attorney-senior-staff-attorney-job-at-aclu-of-northern-california-in-fresno", "basis": "speculation"}], "warning_signs": ["FY26 or FY27 Foundation revenue under $18M with expenses still rising", "501(c)(4) program revenue falling from $5.66M", "Member count stalling at or below 120,000", "Fresno or Sacramento postings stop or stay unfilled", "The framework successor to 2025-2028 mentions consolidation", "WARN filing or 45-day notices"]}, {"rank": 2, "failure_mode": "Rulings without residue: the marquee wins are stayed, reversed, expired or unenforced, and the organization still cannot show what changed for people.", "mechanism": "1) Donors give on the courthouse-arrest and re-arrest rulings. 2) Appellate courts narrow class or APA relief, or the policies are reissued in new form. 3) Settlements expire or go unmonitored. 4) Attorney time moves to the next emergency, because the stated screen is a ruling, not a measured effect. 5) By 2031 a donor asks what lasted and gets a list of filings and orders, with no arrest, stop or compliance data. The organization is not disgraced; the donor simply bought headlines more than durable change. Probability is defined as: at least two of Sequen, Garro Pinchi, UFW and Siskiyou reversed, lapsed or unenforced by 2031, and still no published effect data.", "probability": 0.4, "horizon": "2027-2031", "evidence_chain": [{"fact": "TPS wins at district and circuit level were stayed, and Mullin v. Doe held review of non-constitutional claims barred. NorCal's exact role is not established.", "source": "https://en.wikipedia.org/wiki/National_TPS_Alliance_v._Noem", "basis": "evidence"}, {"fact": "The Ninth Circuit lifted the UFW injunction on standing on Aug 24, 2026.", "source": "https://www.turlockjournal.com/news/crime/federal-court-temporarily-lifts-injunction-protecting-valley-from-sweeps-as-immigration-arrests-rise-in-stanislaus/", "basis": "evidence"}, {"fact": "The Zepeda Rivas settlement expired on June 9, 2025 by its terms.", "source": "https://www.aclunorcal.org/our-work/legal-docket/zepeda-rivas-v-jennings-immigration-detention", "basis": "evidence"}, {"fact": "EFF and the affiliate allege 254,131 Marin sharing events in November 2024, after a 2022 settlement barred out-of-state sharing, and sent the demand letter almost two years later. This is an allegation.", "source": "https://www.eff.org/deeplinks/2026/10/we-demand-more-information-how-marin-cops-illegally-shared-flock-alpr-data", "basis": "evidence"}, {"fact": "The Legal Director's screen asks 'Can we get a ruling with a positive impact?'; no outcome evaluation was found.", "source": "https://brownpoliticalreview.org/defending-civil-liberties/", "basis": "evidence"}, {"fact": "No target specific enough to fail was found in the framework post. The full framework was not read.", "source": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "basis": "evidence"}], "warning_signs": ["Ninth Circuit stay or reversal in Sequen or Garro Pinchi", "UFW remand ends without a restored injunction", "No Siskiyou auditor report or SF property report made available on request", "Annual reports keep counting cases and members with no after-ruling data", "Further evidence that Marin-style breaches were found late"]}, {"rank": 3, "failure_mode": "The hidden hinge: the national flow changes, and a third of revenue moves on a formula no donor can see.", "mechanism": "1) National changes its sharing rules, or its own revenue falls from the $306.8M FY25 peak. 2) The $7.77M flow falls toward the FY24 level of $5.26M or lower. 3) The Foundation loses $2.5M or more with no local cause and no local control. 4) Because the flow is reported as contributions, the headline fundraising looks better than the affiliate's own fundraising, so the board may discover the gap late. 5) A secondary embarrassment: a major donor learns afterward that a 'local' gift was shared, or that the affiliate's local fundraising is costlier than the ratios implied.", "probability": 0.3, "horizon": "2027-2031", "evidence_chain": [{"fact": "Schedule R shows $7,765,506 from ACLU Foundation Inc on line 1c (from related organizations) and $501,219 of reimbursement paid to it.", "source": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990ScheduleR", "basis": "evidence"}, {"fact": "That is 35.6% of FY25 revenue, up from $5.26M in FY24.", "source": "https://projects.propublica.org/nonprofits/full_text/202500369349301225/IRS990", "basis": "inference"}, {"fact": "The donor FAQ confirms gifts are shared with national and gives no formula in the text read.", "source": "https://www.aclunorcal.org/donate/frequently-asked-questions", "basis": "evidence"}, {"fact": "Excluding national money, FY25 cost to raise a dollar is about $0.16 rather than $0.10 (my arithmetic: $2.02M over $12.46M). This overstates it if membership costs sit elsewhere or if national money is partly earned locally.", "source": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990", "basis": "inference"}, {"fact": "National subsidies to smaller affiliates are reported as discretionary, and Wyoming lost support in 2015. Whether this applies to a large affiliate is unknown.", "source": "https://en.wikipedia.org/wiki/American_Civil_Liberties_Union", "basis": "speculation"}], "warning_signs": ["Related-organization contributions under $6M on Part VIII or Schedule R", "National's revenue falling in its next filings", "Refusal to give the formula in writing", "Line 1c shrinking while affiliate appeals stay urgent"]}, {"rank": 4, "failure_mode": "An unprepared handover: the top job and finance function change during a downturn, and internal conflict surfaces in public.", "mechanism": "1) A long executive tenure ends at some point inside the horizon; this says nothing about any individual's plans. 2) It lands near the 2028 framework renewal and possibly a revenue fall. 3) The public voice and institutional memory sit in one role, while the chair and other senior posts have recently changed. 4) Without a practiced transition, the new leader inherits cuts, a union contract and legal staff with wide autonomy. 5) Attorney departures reduce docket capacity, and accounts of the 2024 restructuring re-emerge because they were never publicly settled.", "probability": 0.25, "horizon": "2027-2031", "evidence_chain": [{"fact": "Executive Director in post since 2009, and a search today found no announced departure or successor.", "source": "https://www.aclunorcal.org/bios/abdi-soltani/", "basis": "evidence"}, {"fact": "The Executive Director presents the year in review, hosts every 2026 tour stop and was first guest on the new podcast.", "source": "https://www.aclunorcal.org/tour/", "basis": "evidence"}, {"fact": "FY25 990s list a COO and chair not matching the current staff and board pages. The current CFO-level officer is not established.", "source": "https://www.aclunorcal.org/about/board-of-directors", "basis": "inference"}, {"fact": "An anonymous tipster alleged leadership was pushing out long-time legal staff in 2024. Unverified; the organization did not respond.", "source": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "basis": "evidence"}, {"fact": "The Legal Director describes 'a lot of autonomy' for attorneys and 'difficult internal conversations'.", "source": "https://brownpoliticalreview.org/defending-civil-liberties/", "basis": "evidence"}], "warning_signs": ["The chair cannot describe a board-approved succession plan", "Finance lead unnamed or changing again", "Unannounced exits among legal directors or senior attorneys", "Public statements from Local 20 about bargaining or layoffs", "Executive departure announced with an interim and no search timetable"]}, {"rank": 5, "failure_mode": "Federal action turns the c(3)/c(4) structure into the battlefield.", "mechanism": "1) Federal review of advocacy nonprofits reaches an ACLU entity or a close peer. 2) Examiners focus on shared payroll, cost allocation and grants for legislative purposes. 3) DAF sponsors, which supply the largest named gifts, pause before any finding. 4) Legal costs and senior time rise; deductibility doubts hit major gifts. 5) Separating a Foundation that employs everyone from a Union that appoints its board proves slow. The organization likely survives, with reduced breadth. No evidence of any such action against this organization was found.", "probability": 0.15, "horizon": "2026-2029 for the trigger; effects through 2031", "evidence_chain": [{"fact": "Schedule R shows $2,773,540 of shared paid employees, $85,555 of shared assets, $345,581 of reimbursements and a $725,000 grant between the Foundation and the Union.", "source": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990ScheduleR", "basis": "evidence"}, {"fact": "Schedule R states that Foundation directors are appointed by the Union. It also marks the Union as not a 512(b)(13) controlled entity.", "source": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990ScheduleR", "basis": "evidence"}, {"fact": "Senators opened an inquiry on Sept 3, 2026 after a reported Treasury review. The ACLU was not named in the material read.", "source": "https://www.finance.senate.gov/imo/media/doc/09032026lettertobessentandbisignanoontargetingnonprofits.pdf", "basis": "evidence"}, {"fact": "NonProfit Times offers a skeptical view of an IRS crackdown, so the threat may stay rhetorical.", "source": "https://thenonprofittimes.com/npt_articles/threats-and-bluster-the-irss-black-cloud-over-the-nonprofit-sector/", "basis": "evidence"}, {"fact": "DAF conduits top the named 2025 grants: $1.50M from DAFgiving360 and $663,297 from Fidelity Charitable.", "source": "https://causeiq.com/organizations/american-civil-liberties-union-foundation-of-north,940279770", "basis": "evidence"}, {"fact": "DAF sponsors pulling back before a finding is a hypothesis.", "source": null, "basis": "speculation"}], "warning_signs": ["Any IRS examination, subpoena or designation touching an ACLU entity or close peer", "A major DAF sponsor restricting grants to named advocacy groups", "Treasury's reply to the Senate letter", "Foundation-to-Union grants rising above $725,000 without independent allocation review", "Sudden departure of finance or general counsel staff"]}], "gift_risk": [{"gift_type": "small_unrestricted", "risk": "low", "rationale": "The organization is solvent and audited, and the amount at stake is small. The real risks are clerical: a 'membership' payment or a check to 'ACLU of Northern California' goes to the 501(c)(4) and is not deductible; some forms sit on the national platform; and part of a gift may be shared with national. The gift changes nothing measurable.", "risk_reducers": ["Pay 'ACLU Foundation of Northern California', EIN 94-0279770", "Confirm the receiving entity on any action.aclu.org form", "Keep the receipt showing the 501(c)(3) name"]}, {"gift_type": "major_unrestricted", "risk": "moderate", "rationale": "Loss risk is low; waste-of-leverage risk is real. Foundation unrestricted net assets are about 22.7 months of expenses, and only about 7% of the FY25 revenue rise reached FY25 expenses. FY26 may look different, but it is unfiled. The gift may be shared under an unpublished formula, and the donor gets no formal voice. Nothing specific fails if it does not arrive.", "risk_reducers": ["Get FY26 actuals and the FY27 budget first", "Written confirmation of the share, if any, going to national", "Ask for the board-designated breakdown and reserve policy", "Annual meeting with the chair and finance lead", "Consider timing the gift for a down year"]}, {"gift_type": "major_restricted", "risk": "moderate", "rationale": "This is the better form, with three cautions. Money is fungible when reserves are this large, so restriction may displace rather than add. A restructuring could end a program, and the 2024 reports show that public notice should not be expected. Whether restricted gifts escape national sharing is unknown. The organization holds $8.35M of donor-restricted net assets, which shows it can handle restricted funds.", "risk_reducers": ["Gift agreement naming positions and geography, for example Central Valley attorneys", "A written additionality statement against the prior-year baseline", "Written sharing exemption", "Notice and a right to redirect if the program is cut", "Reporting on outcomes and compliance, not filings", "Budget line for monitoring one or two major wins"]}, {"gift_type": "multi_year_pledge", "risk": "moderate", "rationale": "This form best matches the risk, because revenue is most likely to be scarce
