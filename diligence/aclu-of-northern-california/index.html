k could cost a sum on the order of the $3.9M donated in FY24. Defense and compliance costs may run into seven figures a year. Loss of 501(c)(3) status, even temporarily, would threaten deductible gifts, which is the main survival threat.", "programs": "Shifts from region-wide relief to many individual and small-group cases, an expensive model it is not built for. Greater dependence on state-court and California-law theories, where its Flock case just lost. Know-your-rights work grows.", "staff": "Attorneys handle more cases with less leverage. Morale falls as wins cover fewer people. Security and legal-exposure concerns for staff. Possible loss of senior litigators.", "standing": "High among supporters and contested elsewhere. Possible doubts about effectiveness as outcomes shrink. Dependence on national's balance sheet and legal support rises, which reduces autonomy."}, "early_signals": ["SPLC conviction in 2027, or a second indictment of a national civil-rights group.", "An IRS revocation or referral under NSPM-7 for any large 501(c)(3); none is reported to date.", "Supreme Court limits Rule 23(b)(2) or APA vacatur, or reverses the courthouse rulings on remedy.", "A major DAF sponsor or community foundation declines grants to immigrant-rights groups.", "Pro bono co-counsel firms disappear from new NorCal filings; in-kind legal services fall in the FY26-FY27 audits.", "Any subpoena or congressional letter that names an ACLU affiliate."], "readiness": {"score": 2, "rationale": "Cash is a strength: unrestricted net assets of $37.45M. But no evidence found of a contingency plan for federal action, an independent test of the Resource Sharing Agreement allocation, or a plan for operating if fees and donated counsel fall. The site's 990 list stops at FY22, a small but needless opening. National may step in, though no document on its rights or obligations was found. The model is built for leverage, and this scenario removes it."}, "donor_implication": "Do not assume a reserve-rich organization is safe here. Ask about entity risk first. Keep gifts deductible and structured so they survive an adverse action, for example staged multi-year pledges with a clause covering loss of status. Also fund direct representation, because individual relief becomes the main way to help, and this organization is not the best unit for that."}, {"quadrant": "low_high", "name": "The Quiet Dividend", "narrative": "Speculation, written from late 2031. A new administration took office in 2029, the ICE supplement ran out that September, and Congress did not fully renew it. At-large arrests fell, and detention contracts were cut back. The anti-nonprofit memo was rescinded. Courts remain open to broad relief, and settlement talks replace emergency motions. The crisis faded from the news, and so did donors' sense of urgency. For ACLU NorCal this is winning, and it hurts. Membership gained in the surge lapses. Giving falls toward its pre-surge pattern, and national's transfers shrink with it. Consent decrees and final fee awards bring in good money for a few years, and the board debates how to spend down reserves. Attention turns to harder and quieter issues: AI surveillance by police departments, conditions in county jails, voting rules after Callais, reproductive rights. These do not raise money as immigration raids did. The organization has seen this film before. In FY24 revenue fell to $12.2M and a layoff followed. The question is whether it trims early or waits, and who leads the decision.", "effect_on_org": {"revenue": "Speculation: Foundation revenue falls to about $13-17M, close to FY23-24 levels ($16.3M and $12.2M). Fee income temporarily higher, perhaps $2-4M from settlements. A market correction would deepen it. Unrestricted reserves could fund a $5M annual gap for about seven years, in arithmetic; the board-designated share is unknown.", "programs": "Immigration shrinks to monitoring and enforcement of decrees. Rebalancing to surveillance, policing, voting and reproductive rights. Central Valley presence is first in line for cuts unless endowed or restricted.", "staff": "Likely a reduction from whatever peak it reaches, repeating 2024. A union contract makes this slow and public. A leadership transition is likely within this period (inference from tenure since 2009; no announcement found).", "standing": "Solid, with less visibility. More credible as a critic of a friendly government only if it sues that government too. Peers compete harder for shrinking attention."}, "early_signals": ["Democrats win the House by a wide margin on Nov. 3, 2026, followed by appropriations riders or oversight limits on ICE.", "Arrests in the San Francisco area fall for six months or more, as in Los Angeles after 2025.", "Administration settles or stops appealing major immigration cases.", "National ACLU revenue falls from its $306.8M in FY25 and its flow to NorCal drops below $5M.", "Union program revenue falls from $5.66M, or the 120,000 member figure stops being reported.", "Pew's 56% unfavorable on ICE persists, while immigration falls as a top concern."], "readiness": {"score": 3, "rationale": "Reserves make this survivable. But the history is mixed: expenses climbed to $19.1M in FY24 as revenue fell, and the fix was an abrupt restructuring reported by anonymous sources as badly handled, with no response from the organization. No published reserve policy or succession plan was found."}, "donor_implication": "This is when a donor's money matters most, because others leave. A pledge made now that starts or steps up when the surge fades could be worth more than a gift today. Ask the board what it would cut first, and protect Central Valley capacity with restricted funding."}, {"quadrant": "low_low", "name": "Sacramento First", "narrative": "Speculation, written from late 2031. Washington has cooled. Arrest numbers are down and nobody is prosecuting civil-rights groups. But the federal courthouse door has narrowed for good. The Supreme Court limited nationwide classes and vacatur in cases brought against the prior administration, and those rules now bind everybody. Voting Rights Act claims are harder after Callais. Fee awards are thin after Lackey. Civil-liberties law has moved to state capitols, state constitutions, city councils and county boards. California is a good place to be, and a tight one: structural deficits limit new programs, and governors still veto bills police oppose. ACLU NorCal becomes more of a policy and state-court organization. Its dual entities turn out to be its best asset: the member-elected Union, the ballot work, the chapters, and a role in ACLU California Action. Surveillance fights over Flock-type systems run city by city, and its wins come as retention limits and not as precedent. Lawyers with federal class-action resumes retrain or leave. Non-deductible money becomes more valuable than deductible money, and the donor mix has to change with it.", "effect_on_org": {"revenue": "Speculation: Foundation revenue of about $14-19M, with less urgency and few fees (under $1M). Union money matters more: its $5.66M of member-linked revenue and $17.85M of net assets at FYE 3/2025 fund lobbying that deductible money is limited in paying for. National flow falls.", "programs": "Heavier on California-law litigation, legislation, ballot measures and local oversight of police tech. Federal impact docket smaller. Geographic spread across many county seats, which favors chapters and Central Valley offices.", "staff": "Mix shifts from federal litigators to policy, organizers and state-court lawyers. Some program consolidation like that reported in 2024. The Organizing Director role and chapters gain weight.", "standing": "Strong in Sacramento and city halls. Weaker nationally. It competes more directly with single-issue state advocates and with partners for credit."}, "early_signals": ["Supreme Court restricts APA vacatur or nationwide classes while arrests are falling.", "San Jose Flock plaintiffs appeal, and how the California appellate courts treat the 2024 precedent relied on by the trial judge.", "SB 1004 or a similar mask-ban fix passes and survives federal challenge.", "New governor's first bill actions on police tech, after Newsom's SB 274 veto.", "The Foundation's grant to the Union rises above $725,000, or new hires skew to policy.", "Local ballot wins or losses, such as the kind of fight it had on San Francisco's Proposition F."], "readiness": {"score": 3, "rationale": "It has the structure: 501(c)(4), elected board, chapters, a statewide advocacy vehicle (its role in California Action partly rests on aggregators), and 185 volunteers at the Union. Against that: SB 274 and the Flock dismissal show state routes are not reliably winning, and the deductible side carries nearly all staff. No evidence was found of a strategic plan for this shift; the plan's text was not read."}, "donor_implication": "Consider non-deductible giving to the Union for legislative work, if the donor's goal is state policy and they can give up the deduction. On the deductible side, fund California-constitution litigation and local policy research, and ask for measures of implementation and not only bills passed."}], "most_likely_quadrant": "high_high", "most_dangerous_quadrant": "high_low", "judgment": "All probabilities here are speculation, my reading of the trends, not a model.\n\nMost likely today: Full Docket (high_high), about 35%. Paper Rights about 25%, Sacramento First about 25%, The Quiet Dividend about 15%. Full Docket leads narrowly because enforcement money is committed through September 2029 and Pew's ICE numbers have not yet produced a policy change, while class and APA remedies are holding in lower courts and Trump v. Barbara shows the Supreme Court will still rule against this executive. It is close. Combined, the low-remedy quadrants are 50%, so the donor should not assume the legal model keeps its current leverage. A 2029 change in president could move the left-right position fast; doctrine moves slowly and would outlast it. That is why Sacramento First beats The Quiet Dividend.\n\nMost dangerous: Paper Rights (high_low). It is the only one where the threat goes beyond money. Direct federal action could target the entity that carries all payroll and receives deductible gifts, while the same world cuts the region-wide reach that justifies its budget. The likely trap is that revenue may look good while effectiveness falls, so revenue will not warn the donor. The Quiet Dividend looks worse on the income line but is manageable with reserves.\n\nImportant: on FYE 3/2025 data, no scenario is a near-term solvency story without an adverse legal action against the entity. These results depend on FY26 numbers not yet seen. A market fall is a stress in all four, and it is worst in The Quiet Dividend, where it stacks on fading urgency.", "robust_moves": [{"move": "Fund forum-portable attorney capacity outside the Bay Area on a multi-year restricted basis (for example Central Valley or Sacramento), within the room-for-funding limit of up to about $1M a year. Require the work to use state-law and local-policy routes as well as federal class actions.", "why_robust": "Federal class litigation pays off in Full Docket. Individual and state-court work matters in Paper Rights. Local government and policing work drives Sacramento First. Restricted funding protects this capacity from the first round of cuts in The Quiet Dividend. Caveat: the claim that the Central Valley has the thinnest coverage is an untested hypothesis, so ask for the organization's evidence."}, {"move": "Before a large gift, ask for a written entity-risk plan, and offer to fund what it lacks: outside tax and criminal defense counsel on retainer, an independent test of the Resource Sharing Agreement allocation, donor-data handling rules, contingency if pro bono counsel withdraw, and a written statement of national's support and gift-sharing terms.", "why_robust": "It is decisive in Paper Rights, useful in Full Docket, and low-cost good governance in the other two. It also closes diligence gaps that exist today: the gift-sharing formula, and how a restricted gift is treated."}, {"move": "Ask the board for a succession plan for the Executive Director role (held since 2009), a named CFO-level officer, a written reserve policy with triggers for spending and for cuts, and the FY26 990, audit and FY27 budget. Tie later tranches of a multi-year gift to receiving them.", "why_robust": "Every scenario runs through a likely leadership transition (inference from tenure; no departure is announced) and a revenue swing, in a direction that differs by scenario. A reserve rule prevents both of its historic errors: banking surges, then cutting abruptly, as in FY22-FY24. It costs the organization little, and any answer it gives tells the donor something."}], "gaps": ["The audit notes, reserve policy, investment mix and board-designated share were not read. All reserve arithmetic rests on 990 inputs from FYE 3/2025.", "FY26 (FYE 3/2026) is unfiled or not found. It would show what actually happened in the first full year of the current administration. All scenario revenue ranges are my speculation, anchored on FY22-FY25 figures.", "Fee income: the landscape section treats Foundation program revenue as legal fees. I did not confirm that it is entirely fee awards.", "The gift-sharing formula and how much of national's $7.77M is NorCal-raised money are unknown. National's behavior in each scenario is therefore speculative, as are its rights to step in.", "No evidence found of a federal, state or congressional action against ACLU NorCal or the national ACLU. This search was web-indexed only, and dockets were not checked. Immigrant-rights peers were found to be targets.", "SPLC status is as of the latest report found: trial reset to Feb. 1, 2027. The article's date was not shown. The case involves fraud allegations, and SPLC has pleaded not guilty; it is used only as a signal of federal posture.", "Nov. 3, 2026 election results are not available. Forecast sources are uneven. Prop. 40's trend and Props. 41 and 42 details come through secondary reporting.", "Gallup's 2026 institution figures were not found. The Gallup figure cited is from 2025.", "Enacted California budget: no primary LAO post-enactment report was found. Deficit figures vary across secondary sources, and the former LAO estimates predate enactment.", "The FY2025 courthouse-arrest rulings' current appeal status and final scope are unresolved. An ACLU release dated around Oct. 2026 describes a nationwide ruling not otherwise confirmed in this research.", "No data found on how AI wealth is reaching civil-liberties groups, on ACLU small-donor trends in 2026, on effects of the 2026 tax rules on giving, on 2026 facial-recognition bills, or on ICE access to California plate data.", "The MacArthur and Ford figures come from a promotional blog, and the 1,345 fabricated-citation count comes from a search summary. Both need primary confirmation before print.", "Board count conflict: the FY25 990s report 20 Foundation and 38 Union voting members, while the current board page shows 16 and 24. Timing or definitions may explain this; not resolved.", "Scope limits: this section uses trend and organizational data only. It makes no comparison of effectiveness per dollar, and outcomes for people were not measured."]}, "assessment": {"bottom_line": "ACLU NorCal is a financially strong regional civil-liberties law firm with a lobbying arm, and it wins real court orders, usually shared with co-counsel and often provisional. The likeliest failure is a repeat of its surge, overspend and abrupt cut, while court wins protect fewer people and nothing it publishes would show that. A gift is good for named, multi-year attorney capacity outside the Bay Area, paid in stages; it is not needed as unrestricted money, because money does not look like the binding constraint as of FYE 3/2025.", "health_score": {"score": 67, "grade": "C+ (my scale: A 85+, B 70-84, C 55-69, D 40-54)", "components": [{"name": "Financial resilience", "score": 75, "weight": 25, "rationale": "Scored 0-100; overall is the weighted average. Strong: Foundation net assets $45.8M, liabilities 7% of assets, Union net assets $17.85M, FY25 surplus $2.02M (evidence: 990 extract). Weaker than the headline: the 22.7 months of unrestricted net assets includes $6.39M of fixed assets and a $7,765,506 receivable from national (evidence: FY25 Schedule D). Removing both leaves about 14 months; also removing the $6.38M attorney-fee fund (3/2024, combined basis) leaves about 10 months (inference, mixed dates and bases). Revenue swung -25% then +79.5%. National supplied 38.4% of contributions. FY24 ran a $6.95M 990 deficit, and the combined audit shows about -$3.3M in each of FY23 and FY24. FY26 is unseen."}, {"name": "Governance and transparency", "score": 66, "weight": 20, "rationale": "For: conflict, whistleblower and retention policies, no reported insider transactions, combined audits posted through FY25, Charity Navigator 97%, Candid Platinum (evidence). Against: no public gift-sharing formula; the site's 990 list stops at FY22; no public account of the 2024 restructuring; no announcements found for chair or senior changes; no CFO-level officer established. The Union appoints the Foundation's board (FY25 Schedule O), yet Schedule R shows no controlling entity, a point for a tax adviser to check (inference). FY25 audit opinion not read, which limits this score."}, {"name": "Change delivered and evidenced", "score": 60, "weight": 20, "rationale": "Pablo Sequen v. Albarran is significant and independently verifiable, but co-led, on appeal and partly duplicated by a S.D.N.Y. ruling. Garro Pinchi is a provisional regional win. UFW v. Noem's injunction was lifted in August 2026. Zepeda Rivas expired, Marin is allegedly breached, San Jose Flock was dismissed, and Props 36, E and F went against it. TPS was reversed, though NorCal's role there is unestablished. Only Fresno K-9 records is a clear solo lead, at low significance. Effects on people are unmeasured, and there are no advance targets. Activity counts earned no points."}, {"name": "Strategic position in the field", "score": 75, "weight": 15, "rationale": "Largest multi-issue group in the peer set, with a paired c3 and c4, the national brand and a mass membership claim of 120,000 (self-reported). It is active on the region's fastest-growing front: ICE San Francisco-area arrests rose from 2,928 to 4,970, January-July 2025 to 2026 (evidence: ABC7). Not unique on any issue: EFF and the Lawyers' Committee can lead or co-lead. Leadership here means scale and reach; outcomes were not compared with peers."}, {"name": "Culture and leadership", "score": 60, "weight": 10, "rationale": "Soltani shows long-horizon follow-through, breaks with allies on the merits and made one specific apology in 2022. His public record names zero embarrassing figures about his own institution and no post-mortem on a lost campaign. It is silent on the deficit, restructuring and union drive. Tenure runs since 2009 with no successor signal. An anonymous, unverified 2024 report alleges poor handling of cuts; a 2020 union dispute ended in a contract in May 2024. Internal communications were not visible, so private candor may be better."}, {"name": "Readiness for scenario futures", "score": 60, "weight": 10, "rationale": "Scenario readiness scores were Full Docket 4/5, Paper Rights 2/5, The Quiet Dividend 3/5 and Sacramento First 3/5. Weighted by my speculative scenario odds (35/25/15/25), that is about 3.1 of 5. Cash and the c3/c4 structure help. No contingency plan for federal action, reserve policy or succession plan was found, and the personnel-heavy model has already needed one abrupt cut."}]}, "premortem": [{"rank": 1, "failure_mode": "Surge money hardens into payroll, the threat cycle fades, and a second abrupt layoff damages the legal team and donor trust.", "mechanism": "1) FY25 and likely FY26 revenue rises on federal alarm. 2) It is banked, then spent into over several years, as after FY22. 3) Hiring adds cost to a unionized base with compensation of about $15.4M. 4) Urgency, DAF gifts, members or national's share falls around 2029. 5) Revenue drops toward $13-17M. 6) With no public reserve rule, the board cuts late. 7) Leadership is steady about outside threats and quiet about its own house, so donors and staff learn through leaks. 8) Senior litigators leave.", "probability": 0.45, "horizon": "2028-2031", "evidence_chain": [{"fact": "FY22 revenue was $20.2M against $15.2M of expenses. By FY24, revenue was $12.2M against $19.1M.", "source": "https://projects.propublica.org/nonprofits/organizations/940279770", "basis": "evidence"}, {"fact": "Restructuring and layoffs were reported in October 2024 from anonymous insiders. The organization did not comment.", "source": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "basis": "evidence"}, {"fact": "Filed employee counts fell from 130 to 117 between FY24 and FY25. Linking this to the restructuring is inference.", "source": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990", "basis": "evidence"}, {"fact": "Total salaries and related compensation were about $15.4M of $19.8M in FY25, per a summary of the filing. This conflicts with the extract's 59.79% personnel ratio.", "source": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990", "basis": "evidence"}, {"fact": "Soltani's December 2024 strategy post, written weeks after the reported vote date, promises to 'double down' and, in the text read, does not mention cuts.", "source": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "basis": "inference"}, {"fact": "The 2025 law funds the ICE supplement through September 2029, which sets a plausible date for urgency to change.", "source": "https://laist.com/news/politics/how-ice-grew-to-be-the-highest-funded-us-law-enforcement-agency", "basis": "inference"}], "warning_signs": ["FY26 or FY27 expenses grow faster than non-national contributions", "No written reserve policy or spending trigger", "Union program revenue falls from $5.66M or the 120,000 member figure stops appearing", "New WARN notices or Local 20 statements", "Unbudgeted severance appears in a top-paid line"]}, {"rank": 2, "failure_mode": "The organization stays busy and well funded while its wins protect fewer people, and donors cannot tell.", "mechanism": "1) Courts narrow class relief and vacatur, or agencies route around them. 2) Rulings are still announced as victories. 3) No targets or outcome measures exist to reveal the decline. 4) The implicit success test, holding the line, gives no signal to stop or redirect work. 5) Attorney autonomy keeps cases flowing. 6) Compliance failures surface years later, as alleged in Marin. 7) An outside critic or funder eventually asks what $25M a year protects, and the organization has only case counts to offer.", "probability": 0.4, "horizon": "2027-2031", "evidence_chain": [{"fact": "The Ninth Circuit lifted the UFW injunction on standing on Aug 24, 2026.", "source": "https://www.newsmax.com/us/border-patrol-united-farm-workers-california/2026/08/24/id/1267199/", "basis": "evidence"}, {"fact": "Whether CASA's limit reaches class injunctions and APA relief remains open. Sequen rests on the APA route (legal link is inference).", "source": "https://www.everycrsreport.com/reports/R49022.html", "basis": "evidence"}, {"fact": "Judges found violations of orders in at least 31 suits, and higher courts allowed the policy or limited remedies in 15 of them.", "source": "https://wtop.com/national/2026/05/in-court-fights-over-policy-trump-officials-rack-up-an-extraordinary-record-of-defiance/", "basis": "evidence"}, {"fact": "EFF and the affiliate allege 254,131 Marin plate-data sharing events in November 2024, after a 2022 settlement. The demand letter came in October 2026.", "source": "https://www.eff.org/deeplinks/2026/10/we-demand-more-information-how-marin-cops-illegally-shared-flock-alpr-data", "basis": "evidence"}, {"fact": "The Legal Director's case screen asks, 'Can we get a ruling with a positive impact?' (Dec 2025). The ruling is the stated unit.", "source": "https://brownpoliticalreview.org/defending-civil-liberties/", "basis": "evidence"}, {"fact": "Prop 36 and SB 10 statements restate the position, and no post-mortem was found. Annual letters were largely unreadable, so this is a floor.", "source": "https://www.aclunorcal.org/press-releases/aclu-northern-california-statement-proposition-36/", "basis": "inference"}], "warning_signs": ["Sequen reversed or narrowed on remedy", "New class wins covering named plaintiffs only", "Annual reports keep counting cases and members with no compliance data", "Siskiyou auditor and San Francisco property reports are not shared when asked", "Organization cannot name a line of work it stopped on evidence"]}, {"rank": 3, "failure_mode": "An unprepared executive transition coincides with a thin senior bench and costs 18-24 months of direction.", "mechanism": "1) Soltani, in post since 2009, leaves in the horizon, though no departure is announced. 2) A chair who appears recent and a treasurer run a search with no public plan. 3) Finance, program and legal roles have recently changed. 4) Legal staff with wide case autonomy and an organizing and membership side differ on priorities, since the two senior leaders already describe the model differently. 5) Unresolved 2024 grievances resurface during the search. 6) Personally held donor relationships, size unknown, need transferring. The likely result is a stall, not collapse, because identity and brand predate him.", "probability": 0.3, "horizon": "2027-2031", "evidence_chain": [{"fact": "Soltani has been Executive Director since 2009. He hosts every 2026 tour stop and was the first guest on the new podcast.", "source": "https://www.aclunorcal.org/tour/", "basis": "evidence"}, {"fact": "No succession plan or successor signal was found in the scan, the leader read or a further search on Oct 30, 2026.", "source": "https://www.aclunorcal.org/bios/abdi-soltani/", "basis": "inference"}, {"fact": "The FY25 990s name Adam Bailey as chair and Duc Le as COO. The current site shows Nancy Stuart as chair and lists no COO.", "source": "https://www.aclunorcal.org/about/board-of-directors", "basis": "evidence"}, {"fact": "The Legal Director says 'legal advocacy is where we have decided to funnel all of our resources' (Dec 2025; excerpt only). Soltani says courts cannot be 'the final bulwark' (July 2023).", "source": "https://brownpoliticalreview.org/defending-civil-liberties/", "basis": "inference"}, {"fact": "No public words by the current chair were found, so the only formal check on the Executive Director cannot be read from outside.", "source": "https://www.aclunorcal.org/about/board-of-directors", "basis": "inference"}], "warning_signs": ["Chair cannot describe a plan and timeline directly", "No named CFO-level officer", "Further unannounced senior departures", "Major-gift portfolio held mostly by the Executive Director", "Departure announced without an interim and search process"]}, {"rank": 4, "failure_mode": "National changes the money, and the affiliate discovers how much of its independence was on loan.", "mechanism": "1) National supplies 38.4% of contributions under terms donors cannot see. 2) Federation priorities, national revenue or the sharing formula shift. 3) A return only to FY24's national level removes $2.5M, more than the whole FY25 surplus. 4) The affiliate cuts or draws reserves, and more strategy moves toward national's terms. 5) A donor who believed the gift funded regional work learns late how much was shared or offset. This becomes embarrassing if major donors were never told the terms.", "probability": 0.2, "horizon": "2027-2031", "evidence_chain": [{"fact": "FY25 Schedule R shows $7,765,506 from national and $501,219 reimbursed to it. FY24 was $5,262,757.", "source": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990ScheduleR", "basis": "evidence"}, {"fact": "Schedule D lists exactly $7,765,506 as 'Due from ACLU National Foundation'. So the full year's amount appears to be unpaid at year-end (inference).", "source": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990ScheduleD", "basis": "evidence"}, {"fact": "Schedule D says endowment funds are held by related organizations. A residual of $7,145,205 in 'other assets' equals the endowment balance (my arithmetic). About 30% of assets may therefore be claims on or held with related organizations (inference).", "source": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990ScheduleD", "basis": "inference"}, {"fact": "The FAQ says gifts 'are shared between a donor's home office and the national ACLU' and gives no formula in the text read.", "source": "https://www.aclunorcal.org/donate/frequently-asked-questions", "basis": "evidence"}, {"fact": "National's revenue swung from $185.1M to $306.8M in one year, so its own flow is unlikely to be stable.", "source": "https://projects.propublica.org/nonprofits/organizations/136213516", "basis": "inference"}], "warning_signs": ["National flow falls below $5M", "Receivable balance or timing changes in the audit", "Refusal to state the sharing terms in writing", "Revised federation agreement", "Soltani's public words on national stay limited to history"]}, {"rank": 5, "failure_mode": "Federal or congressional action reaches the c3/c4 seam, draining money and attention and frightening donors, even if nothing improper is found.", "mechanism": "1) NSPM-style tools widen from other advocacy groups to an ACLU affiliate. 2) An examiner or committee looks at the Foundation paying all staff, a c4 appointing its board, $2.77M of shared employees and a $725,000 grant for legislative work. 3) Donor-data demands chill major gifts and DAF sponsors grow cautious. 4) Defense costs may reach seven figures a year (speculation). 5) Leadership, used to attacking outside power and keeping institutional matters private, must now explain internal cost allocation in public without a tested record. No such action has been found, and no evidence of misallocation exists.", "probability": 0.15, "horizon": "2027-2029", "evidence_chain": [{"fact": "The Foundation's board is 'appointed by the ACLU NC Union as Designator', and bylaw amendments need the Union's consent (FY25 Schedule O).", "source": "https://projects.propublica.org/nonprofits/organizations/940279770/202620339349300347/full", "basis": "evidence"}, {"fact": "Employees are paid by the Foundation under a Resource Sharing Agreement. The Union reports 0 employees, and FY25 shows $2,773,540 of shared employees and a $725,000 grant.", "source": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990ScheduleR", "basis": "evidence"}, {"fact": "No independent test of the cost allocation was found. The agreement text was not read.", "source": null, "basis": "inference"}, {"fact": "DOJ indicted SPLC in April 2026, and trial is set for Feb. 1, 2027. SPLC pleaded not guilty. It is used here only as a signal of federal posture.", "source": "https://1819news.com/news/item/federal-judge-delays-splc-trial-on-doj-charges-until-february", "basis": "evidence"}, {"fact": "NSPM-7 includes an IRS directive on tax-exempt funders.", "source": "https://www.dlapiper.com/insights/publications/2025/12/new-federal-strategy-for-countering-domestic-terrorism-and-political-violence-adds-enforcement-risks", "basis": "evidence"}], "warning_signs": ["SPLC conviction in 2027", "Any subpoena or letter naming an ACLU affiliate", "An IRS revocation of a large 501(c)(3) under NSPM-7", "A DAF sponsor declining grants to immigrant-rights groups", "No written entity-risk plan when asked"]}], "gift_risk": [{"gift_type": "small_unrestricted", "risk": "low", "rationale": "Little can go wrong beyond the payee. A check to 'ACLU of Northern California' goes to the non-deductible c4, and some national-platform forms may not be deductible. The gift may also be shared with national. Marginal effect is small against a $19.8M budget.", "risk_reducers": ["Pay ACLU Foundation of Northern California, EIN 94-0279770", "Confirm the receiving entity on action.aclu.org forms", "Do not expect program reporting at this size"]}, {"gift_type": "major_unrestricted", "risk": "moderate", "rationale": "Integrity and solvency risk look low. The risk is low marginal effect. Even on my adjusted figures the Foundation holds about 10-14 months of available unrestricted net assets, and only about 7% of the FY25 revenue rise reached spending. Part of the gift may go to national. The organization rarely reports budget choices publicly.", "risk_reducers": ["Written statement of the share going to national", "See FY26 990, audit and FY27 budget first", "Pay in tranches", "Ask for a written reserve policy", "Meet the chair and treasurer"]}, {"gift_type": "major_restricted", "risk": "moderate", "rationale": "This is the best form, up to about $1M a year. It could protect capacity that may otherwise be first to go in a downturn. Risks are fungibility, since the organization could simply fund less of the same work itself; attorney autonomy over case choice; and the unknown treatment of restricted gifts under sharing. Over-tight restriction could also hinder a shop that must move quickly.", "risk_reducers": ["Fund named positions, such as Central Valley attorneys", "Non-supplantation clause and a baseline staffing figure", "Written exemption from sharing, or stated share", "Annual report on matters, hours, co-counsel role and compliance results", "Permit forum changes across federal, state and local routes"]}, {"gift_type": "multi_year_pledge", "risk": "moderate", "rationale": "Multi-year money fits the revenue cycle better than crisis gifts and is most valuable when urgency fades. Risks are events during the term: leadership transition, adverse federal action and strategy drift. A donor who pledges without conditions carries all of those. FY26 numbers are also unseen.", "risk_reducers": ["Stage payments, tied to FY26 filings, succession plan and reserve policy", "Clause covering loss of 501(c)(3) status", "Step-up in later years, when others withdraw", "Annual meeting with the chair and Legal Director", "Right to redirect if the funded role goes unfilled"]}, {"gift_type": "endowment_or_capital", "risk": "elevated", "rationale": "Schedule D shows a $7.15M permanent endowment already, generating about $258K of program spending in FY25, about 1.3% of expenses. It also says endowment funds are held by related organizations, and which one is not established. No capital plan or reserve policy was found. Permanent money is hard to retrieve if entity risk materializes, and it does not address any constraint visible today. New contributions to the endowment have been minimal: $1,000 in four of the last five years.", "risk_reducers": ["Prefer a term endowment or spend-down fund for counter-cyclical attorney capacity", "Read the audit's endowment note and identify the holder", "Gift instrument with a successor-charity clause", "Written spending rule", "Named purpose with reporting"]}, {"gift_type": "affiliated_c4", "risk": "moderate", "rationale": "It is the only route that freely funds lobbying, and its value rises in the Sacramento First scenario. It is not deductible. The Union held $17.85M of net assets and ran a $3.44M surplus in FY25, so it is not short of money either. Reportedly about $2.1-2.6M a year goes on to ACLU California Action (aggregators), where NorCal's control was not established. Prop 36, Prop E and Prop F were all lost in 2024. Member-elected directors give the Union a real governance voice, and it appoints the Foundation's board.", "risk_reducers": ["Give for a named legislative or local-oversight purpose", "Ask for the share going to California Action and national", "Ask for bill-level start-versus-finish reporting", "Ask for a post-mortem on one lost measure", "Take tax advice on non-deductibility"]}], "efficiency": {"verdict": "Fair, not cheap, and not provable. Public data supports a qualitative judgment only. The absence of any published outcome measure, case-level spending or advance target is itself a transparency finding.", "change_per_dollar": "FYE 3/2025 cost about $25.2M across both entities, after removing the $725,000 grant only. The results that landed in that year were poor: Prop 36 passed, the first TPS order was later reversed, and Grants Pass fallout continued. The work it funded paid off afterward. The strongest item is Pablo Sequen v. Albarran: a December 2025 regional stay and a June 2026 vacatur, co-led with Lawyers' Committee, CARECEN and Coblentz, and on appeal. A separate S.D.N.Y. ruling would likely have delivered the nationwide result anyway, so the fair unique claim is about nine months of Northern California relief plus hold-room relief (inference). Also co-led: Garro Pinchi (regional, provisional), UFW (about 16 months, then lifted on standing), Siskiyou (partial settlement, compliance unknown) and the San Francisco settlement (monitoring added; sweeps continue; both sides claim the result). The weakest items are TPS, if NorCal's role is confirmed, with reversal and adverse precedent; and Marin, a win allegedly not honored.", "trend": "Mixed. Raw spending was flat, $26.5M in FY23 and $26.0M in FY25, while the reach of rulings rose from two facilities and one county to regional and nationwide orders. Durability did not improve. Part of the rise reflects bigger federal targets, not better performance (inference). The 2025-26 results sit in unfiled years, so no per-dollar comparison holds.", "north_star_metric": null, "program_ratio_note": "Program spending was 77.96% in FY25 against a peer median of 75.33%, and about 82% on the audit basis in FY24, which includes donated legal services and combines both entities. Bases differ, so do not compare them. Nothing here is alarming. The ratio says how costs were labeled. It says nothing about what changed.", "what_ratios_miss": "They miss shared credit; lag of one to three years; reversal risk; compliance after a ruling; $3.9M-$6.8M a year of donated legal work; costs booked at national, such as membership acquisition; and the fact that nearly every dollar is lawyers and staff whose value depends on court doctrine.", "spending_matches_strategy": "Mostly on litigation: five of the seven best-paid people hold legal titles, and deductible money funds that side by design. Partly on the stated plural theory: Soltani says courts cannot be relied on alone, but no program-level budget is public to show how much goes to organizing and policy. Spending by project or by case: no evidence found. The Central Valley priority is stated since about 2009, but its results and spending were not measured.", "versus_peers": "No effectiveness-per-dollar ranking is possible. The Lawyers' Committee, at $4.44M of expenses, reports several of the same results, which is a caution on attribution and not proof it is cheaper, because workloads are unknown. EFF, at $25.8M, has a similarly mixed surveillance record alongside this organization. Cost ratios sit close to peer medians. The organization buys breadth and readiness to file fast across many issues, and that is a fair thing to pay for if the donor wants it.", "basis": "inference"}, "ratio_anomalies": [{"key": "margin_3y", "label": "Three-year margin -10.32% (red)", "benign": "One year on a basis that excludes unrealized gains. FY24 was -57%, FY25 was +9%, and FY24 net assets fell only $3.51M against a $6.95M 990 deficit.", "worrying": "A real structural gap: the combined audit shows about -$3.3M in both FY23 and FY24, cost grew while revenue fell, and FY25 was rescued by alarm-driven giving that may not last.", "evidence_supports": "In between. 'Sustained' overstates it and FY25 was positive, but two audited losses, followed by reported layoffs, show the gap was real. It is a cost-discipline signal, not a solvency one.", "settling_question": "What is the FY26 operating result excluding bequests, investment gains and any accrued national share?"}, {"key": "contrib_share", "label": "Contributions 92.59% of revenue (amber)", "benign": "Normal for this model: the peer median is 91.87%. Dues sit in the Union, and no single named funder dominates apart from national.", "worrying": "A cost base largely in people rests on gifts tied to the political moment, with few contractual revenues.", "evidence_supports": "Mostly benign as a ratio. The real issue is the composition inside it: national, bequests and DAFs.", "settling_question": "What were the top ten gifts and total bequests in each of the last five years, as shares of contributions?"}, {"key": "related_org_contrib_pct", "label": "38.4% of contributions from related organizations (amber)", "benign": "This is mostly NorCal-raised money coming back through federation sharing, so it behaves like the affiliate's own donor income (speculation). National has $779.7M of net assets, so credit risk is minimal.", "worrying": "A large revenue line depends on a formula the affiliate may not control. The whole $7,765,506 was still a receivable at year-end, so FY25's surplus was not all cash.", "evidence_supports": "Dependency and the receivable are documented in Schedules R and D. Which reading of the source of the money applies cannot be determined from public documents.", "settling_question": "Please show the FY24-FY26 calculation of the national amount: what generated it, under what agreement, when was it paid, and can the terms change?"}, {"key": "revenue_volatility", "label": "Revenue volatility 34.4 points (amber)", "benign": "Lumpy bequests, fee awards and national timing create noise around a stable base. Reserves absorb it.", "worrying": "Non-national contributions were about $5.79M in FY24 and $12.46M in FY25. A swing that large suggests the base itself follows the political cycle.", "evidence_supports": "Both, with the worrying reading stronger than a bequest story alone. The source of the FY25 jump is unexplained, and an election link is inference.", "settling_question": "Break the $6.67M FY25 rise in non-national gifts into bequests, the top ten gifts, DAF grants and all other donors."}, {"key": "affiliate_94-2151925:top_paid_pct", "label": "Union top-paid person 6.72% of expenses (red)", "benign": "An artifact. The ratio divides a cross-entity total of $413,453 by Union expenses. The Union's own column is $37,835, about 0.6%.", "worrying": "The real question is different: why a Legal-Policy Director's total exceeded the Executive Director's in FY25, in a year of apparent legal leadership handover.", "evidence_supports": "False positive on the ratio. The higher pay is unexplained. Other top-paid exits are possible in earlier years, but nothing shows separation pay (speculation).", "settling_question": "Did the FY25 total for the Legal-Policy Director include transition, retirement or accrued-leave payments?"}, {"key": "affiliate_94-2151925:revenue_volatility", "label": "Union revenue volatility 26.7 points (amber)", "benign": "Program revenue, labeled memberships in FY23, moved with remittance timing from national. The balance due from the National Union fell from $2.88M to $0.42M during FY24 (speculation on cause).", "worrying": "Membership income is weakening. FY25's $5.66M is below FY20-22 levels, despite a claim of 20% more members.", "evidence_supports": "Unresolved. The membership note was not read, and sharing rules could explain both patterns.", "settling_question": "What were member counts and dollars received per member, by fiscal year since FY20, on one consistent definition?"}, {"key": "affiliate_13-6213516:officer_comp_pct,reserves_months,contrib_share,revenue_volatility", "label": "National ACLU Foundation flags (amber)", "benign": "Normal for a large national charity with large net assets, and outside this assessment's scope.", "worrying": "Its volatility and balance sheet matter here only because it supplies 38.4% of the affiliate's contributions, so its swings transmit to NorCal.", "evidence_supports": "No assessment was done of national. Only the transmission channel is relevant.", "settling_question": "How did national's flow to NorCal move when national's revenue fell in FY23 and FY24?"}, {"key": "officer_comp_pct", "label": "Officer compensation 1.33%, green, lowest against peers: misleading", "benign": "A classification effect: the line fell from $1.30M in FY20 to $263,130 in FY25 as fewer people were classed as officers.", "worrying": "A reader might take this as lean leadership. The seven best-paid people total about $2.19M across entities, about 8.4% of the raw $26.0M combined expenses (my arithmetic).", "evidence_supports": "Classification, not a pay cut (inference). Do not credit this as a strength. Pay itself looks reasonable.", "settling_question": "Who was reclassified after FY21, and what are total pay costs for the senior team on a combined basis?"}, {"key": "personnel_pct", "label": "Personnel 59.79%, green but conflicting", "benign": "The extract's figure may count less than the full compensation lines. Shared employees reimbursed by the Union, $2.77M, might explain part of the gap (inference).", "worrying": "A summary of the filing shows about $15.4M, or about 78%, of Foundation expenses. Fixed labor cost is then much higher than the ratio suggests, and that makes downturns harder to absorb.", "evidence_supports": "The higher figure is more likely on a gross basis. Part IX line items were not read directly. The net figure is about 64% if the $2.77M is treated as an offset (my arithmetic).", "settling_question": "What is combined compensation for both entities on the audit's functional-expense schedule?"}, {"key": "reserves_months", "label": "Reserves 27.7 months, green: overstated as liquidity", "benign": "Strong either way, and the Union holds a further $17.85M.", "worrying": "Net assets include $7.15M permanent endowment, $6.39M fixed assets, and the $7.77M national receivable. The available figure is about 10-14 months on my adjustments.", "evidence_supports": "Still strong, but about half the headline. The inputs mix dates and bases; the audit's liquidity note was not read.", "settling_question": "What does the audit's liquidity note show as financial assets available within one year, and what share is board-designated?"}], "advisor_questions": [{"question": "Is anyone already doing this, and better?", "status": "partial", "answer": "On each single issue, others are present: the Lawyers' Committee on immigration, EFF on surveillance, Public Advocates on economic justice, and national or NYCLU on the courthouse-arrest policy, where S.D.N.Y. also ruled. No peer in the set has the same mix of issues, c4 and brand (inference). 'Better' cannot be established because case outcomes were not compared across peers.", "basis": "inference", "confidence": 0.55, "sources": [{"url": "https://aclu.org/press-releases/federal-court-strikes-down-ices-courthouse-arrest-policy-nationwide", "title": "ACLU release, Oct 1, 2026"}, {"url": "https://lccrsf.org/cases/pablo-sequen-v-albarran-ice-courthouse-arrests-unlawful-detention-conditions/", "title": "LCCRSF case page"}, {"url": "https://www.kqed.org/news/12102922/south-bay-judge-rules-san-joses-flock-cameras-dont-invade-privacy", "title": "KQED: San Jose Flock ruling"}]}, {"question": "What is the counterfactual if this organization disappeared, and if this gift does not arrive?", "status": "partial", "answer": "If it disappeared: active classes would need new counsel, and multi-issue state and local advocacy plus the member base would be hardest to replace. National would likely rebuild or staff the territory (speculation). Peers are stretched: ALC, ILRC and EFF ran deficits. The Central Valley may suffer most, but that is untested. If a $25,000-$250,000 gift does not arrive: I can identify nothing specific that fails. About $200,000-$350,000 a year loaded would cover one attorney (assumption on loading).", "basis": "inference", "confidence": 0.55, "sources": [{"url": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990", "title": "FY25 Form 990"}, {"url": "https://legalalphabet.com/job/staff-attorney-senior-staff-attorney-job-at-aclu-of-northern-california-in-fresno", "title": "Staff attorney listing, Fresno"}]}, {"question": "Is there room for more funding, and what happened to the last big increase?", "status": "partial", "answer": "It can likely absorb up to about $1M a year in defined attorney or regional capacity. Above $5M would need a written plan I have not seen. Last increase: FY25 revenue rose $9.67M; expenses rose $0.70M and filed employees fell from 130 to 117. It refilled a hole and funded no visible expansion in that year. Much of it was also non-cash at year-end: the $7.77M national amount was a receivable. FYE 3/2025 captures only about ten weeks of this administration, so FY26 could change this.", "basis": "inference", "confidence": 0.6, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/940279770", "title": "ProPublica: Foundation"}, {"url": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990ScheduleD", "title": "FY25 Schedule D"}]}, {"question": "Is this the right unit to fund, or should money go to a coalition, policy effort, intermediary, or peer?", "status": "answered", "answer": "Right unit only if the goal is changing rules across Northern and Central California. For people facing detention now, fund direct representation or family aid: California Collaborative for Immigrant Justice, Centro Legal de la Raza, or the Stand Together Bay Area Fund. For an unrestricted dollar, the Lawyers' Committee ($4.44M expenses) is likely more cash-constrained, though its own need was not tested. For state policy without a deduction, the c4. National adds least for regional impact. Effectiveness per dollar was not compared.", "basis": "inference", "confidence": 0.65, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/942581415", "title": "ProPublica: Lawyers' Committee"}, {"url": "https://sff.org/?p=50316", "title": "SFF: Stand Together Bay Area"}, {"url": "https://www.calbar.ca.gov/news/state-bar-report-finds-funding-cuts-would-severely-weaken-legal-aid-lifeline-millions-californians", "title": "State Bar on legal aid funding"}]}, {"question": "Does the theory of change hold, and is there outside evidence for the model?", "status": "partial", "answer": "The theory is that rights hold only when government is constrained by courts, state law, ballots and public pressure. Outside evidence shows rulings bind on paper and are strained in practice: AP counted violations in at least 31 suits, and CRS says the reach of class and APA relief is unsettled. Its record supports the plural logic because courts alone did not hold, yet 2024 ballots also went against it. One secondhand report says ICE detained no one at San Francisco immigration court after the stay, as of March 2026. No independent evaluation of the model at this organization was found, and academic literature on impact litigation was not reviewed.", "basis": "inference", "confidence": 0.5, "sources": [{"url": "https://www.everycrsreport.com/reports/R49022.html", "title": "CRS R49022"}, {"url": "https://wtop.com/national/2026/05/in-court-fights-over-policy-trump-officials-rack-up-an-extraordinary-record-of-defiance/", "title": "AP via WTOP"}, {"url": "https://www.keker.com/news/news-items/bay-area-legal-coalition-pushes-back-ice-detentions", "title": "Keker summary of SF Standard"}, {"url": "https://pastforward.org/blogs/public-podcasting/abdi-soltani", "title": "Past Forward podcast"}]}, {"question": "Who else funds them and why, and has any sophisticated funder stopped?", "status": "partial", "answer": "National is the largest identified source at $7.77M in FY25. Named 2025 grants are largely DAF conduits: DACG $1.50M, Fidelity $663K and Vanguard $537K, plus San Francisco Foundation $804K (aggregators). Foundations such as Haas Jr., Libra and Schmidt appear at modest amounts. No large multi-year anchor grant was found. Why they fund: no statements found. No evidence of a funder stopping, but partial aggregator lists and the non-public donor list cannot exclude it. Libra's absence from top-grant lists after 2021 merits a question only.", "basis": "evidence", "confidence": 0.55, "sources": [{"url": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990ScheduleR", "title": "FY25 Schedule R"}, {"url": "https://www.influencewatch.org/non-profit/aclu-foundation-of-northern-california2/", "title": "InfluenceWatch, citing Candid"}, {"url": "https://causeiq.com/organizations/american-civil-liberties-union-foundation-of-north,940279770", "title": "CauseIQ"}]}, {"question": "Is the problem growing or shrinking?", "status": "partial", "answer": "Immigration enforcement in its territory is growing: ICE San Francisco-area arrests were 2,928 in January-July 2025 and 4,970 in January-July 2026, per an ABC7 analysis. Funding is committed through September 2029. DHS disputes one analysis as 'cherry-picked', and Los Angeles arrests fell from their peak, so surges can move. Surveillance exposure is rising, with law contested. No trend measure was found for police practices, voting or reproductive rights in Northern California.", "basis": "evidence", "confidence": 0.7, "sources": [{"url": "https://abc7news.com/post/ice-arrests-san-francisco-bay-area-70-uc-berkeley-data-project-finds/19754574/", "title": "ABC7"}, {"url": "https://www.kqed.org/news/12097313/northern-california-ice-arrests-surged-this-summer", "title": "KQED, Aug 31, 2026"}, {"url": "https://laist.com/news/politics/how-ice-grew-to-be-the-highest-funded-us-law-enforcement-agency", "title": "LAist"}]}, {"question": "Is this a program or an organization (founder dependency, board strength, survivability)?", "status": "partial", "answer": "An organization, with a 92-year history and no living founder. Identity, brand and member-elected governance would survive a departure. Survivability looks high with net assets and the national backstop, though national's obligations are undocumented. Board strength is unread: no public words from the chair, overlapping boards, and conflicting counts of 20 and 38 voting members on the 990s against 16 and 24 on the site. Public voice and continuity are moderately dependent on Soltani.", "basis": "inference", "confidence": 0.6, "sources": [{"url": "https://www.aclunorcal.org/about/board-of-directors", "title": "Board of Directors"}, {"url": "https://projects.propublica.org/nonprofits/organizations/940279770/202620339349300347/full", "title": "FY25 Form 990, Schedule O"}, {"url": "https://www.aclunorcal.org/tour/", "title": "2026 tour"}]}, {"question": "Who is the executive director, in their own words: risk appetite, candor about failure, relationship to money and donors, and what a departure would do to revenue?", "status": "partial", "answer": "Abdi Soltani, in post since 2009. Risk: high for legal and political risk: 'We will still go to court regardless of who or which party appointed which judge' (July 2023). Candor: one clear admission, 'for the confusion we have caused' (April 2022 apology), and zero figures on his own institution's trouble across 27 items read, which is a floor because annual letters were unreadable. Money: brief and grateful; supporters as partners, with no budget talk. Pressure from outside sharpens his public voice; on the 2024 internal pressure it was quiet. Departure effect on revenue: unknown. No evidence ties major gifts to him personally.", "basis": "inference", "confidence": 0.55, "sources": [{"url": "https://pastforward.org/blogs/public-podcasting/abdi-soltani", "title": "Past Forward podcast"}, {"url": "https://sfstandard.com/2022/04/15/aclu-of-northern-california-apologizes-for-redistricting-letter-sent-on-its-behalf/", "title": "SF Standard, Apr 15, 2022"}, {"url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "title": "Forging Ahead, Dec 13, 2024"}]}, {"question": "What do they say they are versus what the money says they are?", "status": "partial", "answer": "They say: a non-partisan guardian using courts, politics and organizing. The money says: mainly a legal employer with compensation around $15.4M at the Foundation, a federation member receiving 38.4% of contributions via national, and an affiliate sending funds on to statewide advocacy through the c4 (aggregators). 'We are the resistance' (recruiting page, undated, 2026 inference) sits next to 'non-partisan', though it has opposed Democratic administrations and local measures. Money by program is not public, so the legal-versus-organizing split is unanswered.", "basis": "inference", "confidence": 0.6, "sources": [{"url": "https://job-boards.greenhouse.io/aclunc/jobs/8463191002", "title": "Recruiting page"}, {"url": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990", "title": "FY25 Form 990"}, {"url": "https://www.influencewatch.org/non-profit/aclu-of-northern-california/", "title": "InfluenceWatch"}]}, {"question": "Is executive pay in line with scale and peers?", "status": "answered", "answer": "Yes for the Executive Director: $369,484 total in FY25, against EFF's $376,166 on $25.8M of expenses and ILRC's $322,487 on $21.9M. Foundation top-paid share of 2.09% matches the peer median of 2.08%. The Foundation board's Personnel Committee sets pay with salary surveys. The open question is the Legal-Policy Director's $413,453, above the Executive Director, unexplained and possibly one-off. Compensation is split across entities, and the low officer-comp ratio is a classification effect.", "basis": "evidence", "confidence": 0.8, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/940279770", "title": "ProPublica: Foundation"}, {"url": "https://projects.propublica.org/nonprofits/organizations/43091431", "title": "ProPublica: EFF"}, {"url": "https://projects.propublica.org/nonprofits/organizations/942939540", "title": "ProPublica: ILRC"}]}, {"question": "Is the cost of raising money in line with peers and with the revenue model?", "status": "partial", "answer": "On the headline, yes: $0.10 against a peer median of $0.09, fundraising 10.19% of expenses. Real cost is likely higher. Excluding national's $7.77M, $2.02M raised $12.46M, about $0.16 (my arithmetic; attributing no fundraising cost to national's share is an assumption). The FY24 figure was $0.186. National also books membership acquisition costs for national and NorCal per the 2022-23 report (snippet). So the true combined cost is not visible.", "basis": "inference", "confidence": 0.6, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/940279770/202620339349300347/full", "title": "FY25 Form 990"}, {"url": "https://annualreport.aclunc.org/wp-content/uploads/2023/07/Financial-spread-2022-ACLU-NorCal-An-Rpt-financials-7-19-23.pdf", "title": "2022 report financial spread (snippet)"}]}, {"question": "What actually changed because of them last year, how much of it can they fairly claim, and is that improving per dollar?", "status": "partial", "answer": "Over the last 12-18 months: courthouse-arrest policies were stayed and vacated (co-led; on appeal), ICE re-arrest policy was blocked regionally (co-led; provisional), Siskiyou stop rules were settled (co-led; compliance unknown), a San Francisco property settlement was reached (co-led), and Fresno K-9 records were won (lead; low significance). Against that: the UFW injunction was lifted and the San Jose Flock suit dismissed. Shared credit throughout. Effect on people is mostly unmeasured. Per-dollar trend cannot be computed because those years' spending is unfiled. Direction: wider reach, no better durability.", "basis": "inference", "confidence": 0.65, "sources": [{"url": "https://lccrsf.org/pressroom_posts/federal-court-delivers-crushing-blow-to-trumps-mass-deportation-agenda-striking-down-courthouse-arrests-nationwide-and-restoring-protections-against-inhumane-detention/", "title": "LCCRSF release, June 24, 2026"}, {"url": "https://www.aclunorcal.org/press-releases/federal-court-blocks-ice-rearrest-policy/", "title": "ACLU NorCal release, Dec 22, 2025"}, {"url": "https://nextshark.com/siskiyou-county-settlement-asian-discrimination-lawsuit", "title": "NextShark, Jan 23, 2026"}, {"url": "https://gvwire.com/2026/04/07/aclu-wants-fresno-police-k-9-records-city-fights-and-loses-twice/", "title": "GV Wire"}, {"url": "https://www.newsmax.com/us/border-patrol-united-farm-workers-california/2026/08/24/id/1267199/", "title": "9th Circuit lifts block"}, {"url": "https://www.kqed.org/news/12102922/south-bay-judge-rules-san-joses-flock-cameras-dont-invade-privacy", "title": "KQED: San Jose Flock ruling"}]}, {"question": "Do they publish targets in advance and report against them?", "status": "answered", "answer": "No target specific enough to fail was found. The 2025-2028 framework, as described publicly on Dec 13, 2024, uses words like 'explore' and 'advance'. The last clear start-versus-finish report found is from 2015: 16 sponsored bills, seven signed, statewide. The full framework was not read, so a private version may have measures.", "basis": "evidence", "confidence": 0.7, "sources": [{"url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "title": "Forging Ahead"}, {"url": "https://www.aclunorcal.org/blog/aclu-california-center-advocacy-policy-lobbying-machine", "title": "ACLU Center for Advocacy & Policy, 2015"}]}], "strengths": [{"strength": "Strong balance sheet, even after haircuts", "evidence": "Foundation net assets $45.8M and liabilities 7% of assets at FYE 3/2025; about 10-14 months of available unrestricted net assets on my adjustments; Union net assets $17.85M. No near-term solvency concern absent adverse legal action.", "basis": "inference"}, {"strength": "Real, checkable legal results against powerful defendants", "evidence": "Sequen, Garro Pinchi, UFW's 16-month injunction, Siskiyou and Fresno K-9 are matters of court record or independent reporting, not just the organization's word.", "basis": "evidence"}, {"strength": "Positioned where the need is rising", "evidence": "It covers ICE's San Francisco area of responsibility, with arrests up from 2,928 to 4,970 January-July 2025 to 2026, and is recruiting attorneys in Fresno, Sacramento and San Francisco.", "basis": "evidence"}, {"strength": "Willingness to oppose allies", "evidence": "SB 10 reversal in 2018, the suit promoted against the Biden-Harris asylum ban in 2024, and opposition to San Francisco measures in 2022 and 2026.", "basis": "evidence"}, {"strength": "Structure that can change forums", "evidence": "Paired c3 and c4, member-elected Union directors, chapters and a statewide vehicle give it a state and local route when federal remedies narrow. State wins are not assured: the Flock suit was dismissed.", "basis": "inference"}, {"strength": "Basic controls and pay are in order", "evidence": "All listed governance policies are present and no insider transactions or diversion are reported on the FY25 990; combined audits are posted through FY25; Executive Director pay is near peers; Charity Navigator 97%. No regulatory action or finding against it was found in web-indexed sources.", "basis": "evidence"}, {"strength": "Long-horizon leadership with one owned mistake", "evidence": "A Central Valley priority named around 2009 and still named in 2026. In April 2022 Soltani said a letter 'went further than findings or positions' and apologized for the organization, blaming no individual.", "basis": "evidence"}, {"strength": "Leverage from donated counsel", "evidence": "Donated legal services were $3.9M in FY24 and $6.8M in FY22. Firms including Keker and Coblentz appear on its immigration cases.", "basis": "evidence"}], "verdict_changers": [{"direction": "up", "what": "A written, stable national-sharing agreement with an exemption or clear share for major restricted gifts, and audited liquidity above 12 months."}, {"direction": "up", "what": "A full account of the 2024 restructuring: programs ended, positions lost, costs and what was learned."}, {"direction": "up", "what": "A board-owned succession plan, a named CFO-level officer and a reserve policy with triggers."}, {"direction": "up", "what": "Outcome data after rulings, such as arrest records around Sequen or Siskiyou auditor reports, or any advance targets with reported results."}, {"direction": "up", "what": "Sequen and Garro Pinchi affirmed on appeal, with documented compliance."}, {"direction": "up", "what": "A written FY27 hiring plan showing capacity that a gift would add and that the organization would not fund anyway."}, {"direction": "down", "what": "An adverse audit item: a material weakness, a restatement or a problem in the Resource Sharing Agreement allocation."}, {"direction": "down", "what": "Refusal to give sharing terms, the restructuring account or FY26 figures to a serious donor under reasonable confidentiality."}, {"direction": "down", "what": "FY26 showing fast cost growth without a matching rise in non-national gifts, or a sharp drop in the national amount."}, {"direction": "down", "what": "Confirmed retaliation or pushing out of staff in the 2024 restructuring, or a new labor dispute. The current claims are anonymous and unverified."}, {"direction": "down", "what": "Marin allegations confirmed with evidence that the organization had no monitoring at all, and the same pattern in other settlements."}, {"direction": "down", "what": "Federal action naming an ACLU affiliate, or Executive Director departure with no plan."}], "questions_to_ask": [{"order": 1, "question": "If I give $X, how much reaches NorCal's work, how much goes to national, and can a restricted gift be exempted? Please show how the $7,765,506 from national in FY25 was calculated and when it was paid.", "why": "It determines what the gift buys and tests the largest opaque dependency. It is simple to answer, so the response is informative.", "good_answer_looks_like": "A written formula or the agreement terms, a percentage for this gift, three years of amounts, and the date cash arrived."}, {"order": 2, "question": "Please send the FY26 audit or draft, FY26 990, FY27 budget, reserve policy, and liquidity note, including board-designated funds and who holds the $7.15M endowment.", "why": "All key numbers here stop at March 2025. Adjusted liquidity is my estimate.", "good_answer_looks_like": "Documents within days, a stated reserve floor and triggers, and a named person who can walk through them."}, {"order": 3, "question": "In the 2024 restructuring, what did you stop doing, how many positions were affected, what did it cost, and what would you do differently?", "why": "It tests the silence pattern and shows what a donor would be trading away. The only public account is anonymous.", "good_answer_looks_like": "A named list of programs and numbers, honest costs, and limits only where employment law truly applies. Soltani or the chair answers directly."}, {"order": 4, "question": "For the chair: what is the succession plan and timeline for the Executive Director, who holds CFO responsibility, and which top donors depend on one relationship?", "why": "The board owns this, and no public evidence exists. A long tenure plus recent senior changes makes this a live risk.", "good_answer_looks_like": "The chair speaks to a written emergency and planned succession process, names the finance lead, and gives a rough count of relationships by holder."}, {"order": 5, "question": "How do you know your last three big wins changed anything for people? How did Marin's alleged sharing go undetected until 2026?", "why": "It moves the conversation from rulings to effects and tests whether loss produces learning.", "good_answer_looks_like": "Specific compliance data or a monitoring plan, an honest account of Marin, and a change made as a result."}, {"order": 6, "question": "What was the last program or case line you changed or stopped because evidence said it was not working, and who raised it?", "why": "It tests whether dissent reaches leadership and whether the 'hold the line' test ever gives way.", "good_answer_looks_like": "A real example, a named role that raised it, and what changed. A list of external obstacles is a weak answer."}, {"order": 7, "question": "Has the Resource Sharing Agreement allocation been independently tested, and what is your plan for a subpoena, IRS examination, loss of pro bono counsel or a demand for donor data?", "why": "The c3/c4 seam is the most exposed point in the worst scenario. Preparing is cheap.", "good_answer_looks_like": "A tested allocation method, outside counsel identified, donor-data rules, a contingency budget, and clarity on national's support. Details may reasonably be limited."}, {"order": 8, "question": "For the Central Valley: what would a restricted gift add that you would not fund anyway? Can you share case-level staff time, co-counsel role, fees and results for your top matters since 2021?", "why": "It tests additionality and whether the Central Valley gap claim is real, and it builds the record public data lacks.", "good_answer_looks_like": "A hiring plan with baseline headcount, evidence on regional coverage, a named supervisor, and willingness to report case-level data annually."}], "confidence_statement": "Overall confidence is moderate. High on identity, headline 990 figures, pay and the existence of court rulings. Moderate on finances beneath the headline: the FY25 audit, opinion paragraphs and liquidity note were never read, and adjusted liquidity is my arithmetic across mixed dates and bases. Moderate-to-low on effects on people, on NorCal's share of shared wins and on internal culture, which rests on inference from public silence plus one anonymous article. Pre-mortem probabilities and scenario odds are speculation, overlap and do not sum to 100%. No donor documents or interview file were supplied, so nothing here reflects the organization's own answers. In this section I read the FY25 Foundation Form 990 and Schedules D and R through a fetch summarizer. That confirmed the Union appoints the Foundation's board, which supersedes the entity map's finding of no parent-subsidiary evidence. It also surfaced the $7,765,506 national receivable and $7.15M endowment, which lower my reading of liquidity. Figures should be checked against the filed forms before print. Facts stop at March 2025 for finance. The Nov 3, 2026 election results, including local measures, are four days out and not reflected.", "blind_spots": ["FY26 financials: the first full year under this administration. Spending and hiring may already have changed room-for-funding.", "Audit opinions, notes, material weaknesses, inter-entity eliminations and the auditor for FY24-FY25.", "The gift-sharing agreement and what share of national's money is NorCal-raised. This could turn the 38.4% from dependency into a timing matter.", "Internal reality of the restructuring: no staff, Local 20, board or management account beyond one anonymous article.", "Private candor. Soltani's public silence on internal matters may not match what major donors or the board hear. Annual letters were unreadable.", "Effects on people: no arrest, stop, compliance or class-size data.", "NorCal's actual hours and roles in shared cases. Counsel roles largely come from press and releases, not dockets.", "Board quality: no public chair statements and unresolved director counts.", "Peer effectiveness: no outcome comparison. Peer selection is itself a judgment.", "Court dockets, the NLRB database, the California AG registry and IRS TEOS were not checked directly."], "gaps": ["FY25 combined audit and 2024-2025 annual report PDFs remain unread as text.", "Part IX line items were not read directly. The personnel figure conflict (59.79% against about 78%) is narrowed, not closed.", "Schedule D residual of $7,145,205 is matched to the endowment by my arithmetic. The summarizer listed only four 'other assets' lines, and the related holder is not identified.", "Schedule R shows N/A for controlling entity although the Union appoints the Foundation's board. Whether this is a reporting issue needs a tax adviser; I make no finding.", "Current national sharing formula and treatment of restricted gifts: no evidence found.", "Restructuring outcome, layoff count, programs ended, and severance: no evidence found.", "Current CFO-level officer, chair start date and succession plan: no evidence found. A further search on Oct 30, 2026 found no report of a departure, successor or 2026 layoffs, but did not reach the organization's newsroom or major press directly.", "Composition of Foundation program revenue: treated as mainly fee income, unconfirmed.", "Spending by program or case: no evidence found.", "Appeal status of Sequen and Garro Pinchi, and NorCal's role in National TPS Alliance: not established.", "No independent outcome evaluation or advance targets found; the full 2025-2028 framework was not read.", "Bequest amounts and the explanation for FY25's $6.67M rise in non-national contributions: no evidence found.", "Academic or outside evaluation literature on impact litigation was not reviewed."]}, "assessment_before": {"bottom_line": "ACLU of Northern California is a solvent, well-governed regional civil-liberties law shop, spending about $25M a year, whose court wins are real but shared and often provisional. The thing most likely to go wrong is not collapse: the 2025 donor surge fades, as the FY22 spike did, and the organization quietly cuts capacity again even with large reserves. A gift is best used for a named, staged, multi-year capacity that reaches past January 2029, because an unrestricted gift today mostly adds to a cushion of about 23 months.", "health_score": {"score": 67, "grade": "C+", "components": [{"name": "Financial resilience", "score": 74, "weight": 25, "rationale": "Scored 0-100; the total is the weighted average. Grade bands used here: A 85+, B 70-84, C 55-69, D 40-54. Strong balance sheet: FYE 3/2025 Foundation net assets of $45.8M, of which $37.45M has no donor restriction (about 22.7 months of expenses, my arithmetic); liabilities are 7.1% of assets; the 501(c)(4) adds $17.85M. Weak revenue base: 92.6% contributions, and the three-year average revenue of $16.8M is below the $19.8M cost level. Revenue moved -25% in FY24 and +79.5% in FY25. National supplied $7.77M, or 35.6% of revenue. The combined audits show losses of about $3.3M in both FY23 and FY24. Points withheld because the board-designated share is unknown ($6.38M attorney-fee fund at 3/2024 is the only known piece), no reserve policy was read and FY26 is unfiled."}, {"name": "Governance and transparency", "score": 68, "weight": 20, "rationale": "Process looks sound on the filing: 20 voting directors, all reported independent; conflict, whistleblower and retention policies; independent pay review; no excess-benefit transactions, insider loans or diversion reported; combined audits posted through FY25; Charity Navigator 97%; Candid Platinum. Deductions: the site's 990 list stops at FY22; no public account of the 2024 restructuring; no published national split; senior and chair changes unannounced in what was found. Structure needs understanding, though it is not an impropriety: Schedule R says the 501(c)(4) appoints the Foundation's directors, so deductible donors have no formal voice. Filings show 20 and 38 voting directors while the current site lists 16 and 24, which is unexplained. AG registry and audit opinions were not read directly."}, {"name": "Change delivered and evidenced", "score": 60, "weight": 20, "rationale": "From the ledger's nine ranked outcomes: one at significance 4 (Sequen), none at 5. Seven are co-lead, one is one of many, and the only sole lead (Fresno K-9 records) is significance 1. Durability: four too early, three partly reversed (Zepeda Rivas expired, UFW injunction lifted, Marin allegedly breached) and two in force, both significance 2. Failures include TPS, Prop 36, SF Prop E and the San Jose Flock dismissal in about October 2026. Rulings do not rest on the organization's word, which earns real credit. Effects on people are almost entirely unmeasured. No points for members, bills monitored or case counts."}, {"name": "Strategic position in the field", "score": 75, "weight": 15, "rationale": "Largest multi-issue organization in the reviewed regional peer set, with six programs, a paired 501(c)(4), the ACLU brand and active Central Valley recruiting. Demand is rising on the one front with counts: San Francisco-area ICE arrests rose from 2,928 to 4,970 between Jan-Jul 2025 and Jan-Jul 2026. Not unique on any issue: LCCRSF co-counsels the same cases, EFF leads on surveillance, and a separate S.D.N.Y. suit reached a nationwide ruling too. Peers are financially thinner, which argues against this organization being the most cash-constrained option. Leadership here means scale, not proven effectiveness."}, {"name": "Culture and leadership", "score": 58, "weight": 10, "rationale": "Clear legal discipline ('Is this worth our resources?'), attorney autonomy, a record of challenging a Democratic administration, and no visible donor flattery. Offsetting that: accountability language points outward; silence on the restructuring for over two years; anonymous allegations of poor handling, unverified; the 2020 recognition dispute, though a bargaining agreement was executed May 15, 2024; 'We are the resistance' beside 'non-partisan'; no authored account of failure found; no succession evidence in a 17-year tenure. Staff and donor voices are largely absent, so this score is low-confidence."}, {"name": "Readiness for the scenarios", "score": 60, "weight": 10, "rationale": "Scenario readiness scores were 4, 3, 3 and 2 out of 5, averaging 3. Reserves buy time in every quadrant, and FY24 shows the board acts on deficits. Nothing was found on a federal-action contingency plan, a succession plan, a current CFO-level officer or an expansion plan. Payroll sits wholly in the Foundation, and the Union appoints its board, which would complicate any forced separation."}]}, "premortem": [{"rank": 1, "failure_mode": "The second squeeze: revenue reverts after urgency fades and the organization cuts capacity while still holding large reserves.", "mechanism": "1) FY25's $20.2M of contributions proves partly one-off or tied to the threat cycle. 2) After the 2026 and 2028 elections, urgency drops; Foundation revenue returns to about $14M-$16M against costs near $20M-$22M. 3) The board does what it appears to have done in 2024: it acts on a deficit rather than draw reserves down. 4) A second restructuring within about seven years hits a unionized staff under a contract. 5) Costly, hard-to-fund positions go first, likely Fresno and Central Valley litigation and compliance monitoring. 6) The donor who funded the 'surge' finds a smaller organization with a big balance sheet. Probability is defined as: Foundation revenue under $16M in a filed year by FY31 and a staff cut of 15% or more.", "probability": 0.45, "horizon": "FY28-FY31", "evidence_chain": [{"fact": "Foundation revenue fell from $20.2M (FY22) to $12.2M (FY24), then rose to $21.8M (FY25).", "source": "https://projects.propublica.org/nonprofits/organizations/940279770", "basis": "evidence"}, {"fact": "Three-year average revenue of
