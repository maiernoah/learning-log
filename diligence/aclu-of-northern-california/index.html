70"}, {"year": 2025, "value": 1012106, "value_text": "$1,012,106", "kind": "actual", "source_url": "https://projects.propublica.org/nonprofits/organizations/940279770"}], "definition_changes": "Composition not read.", "trend": "mixed", "note": "If this is mostly court-awarded fees, it would be a rough, lagging signal of prevailing cases. It is not established and must not be used as an outcome measure until the 990 line is read.", "basis": "speculation"}, {"metric": "Ongoing legal cases", "unit": "cases", "level": "output", "program": "Litigation", "series": [{"year": 2025, "value": 40, "value_text": "'40 ongoing cases'; number of new actions garbled in the snippet", "kind": "actual", "source_url": "https://www.aclunorcal.org/app/uploads/2026/06/2025-ACLU-NorCal-annual-report-2.pdf"}], "definition_changes": null, "trend": "insufficient_data", "note": "No earlier-year count found. Not tallied against the docket.", "basis": "evidence"}], "programs": [{"program": "Foundation: litigation, policy research and education (six issue programs per secondary descriptions)", "years": [{"year": 2023, "expenses": 12716090, "results_claimed": "Filing snippet: litigation, policy research and education. Expenses include $660,008 in grants; revenue $2,796,575. Narrative of results not read.", "sources": [{"url": "https://pdf.guidestar.org/PDF_Images/2023/940/279/2023-940279770-202420329349300647-9.pdf", "title": "Foundation Form 990, FYE 3/2023 (snippet)"}]}, {"year": 2024, "expenses": 14748459, "results_claimed": "Part IX program total from the extract. Part III narrative not available.", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/940279770/202500369349301225/full", "title": "Foundation filing, FYE 3/2024"}]}, {"year": 2025, "expenses": 15449667, "results_claimed": "Aggregator rendering, truncated; includes $725,000 in grants and $1,012,106 in revenue. The filed narrative did not render.", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/940279770/202620339349300347/full", "title": "Foundation filing, FYE 3/2025"}, {"url": "https://www.intellispect.co/organizations/940279770-american-civil-liberties-unio", "title": "Intellispect"}]}], "cost_per_unit": [], "evidence_quality": "unknown"}, {"program": "Union (501(c)(4)): advocacy and legislative program", "years": [{"year": 2024, "expenses": 5883064, "results_claimed": "Filing snippet: expenses include $2,548,286 in grants; revenue $3,490,713. Narrative not read.", "sources": [{"url": "https://pdf.guidestar.org/PDF_Images/2024/942/151/2024-942151925-202530369349301138-.pdf", "title": "Union Form 990, FYE 3/2024 (snippet)"}]}, {"year": 2025, "expenses": 5332158, "results_claimed": "Part IX program total from the extract. Narrative not available.", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/942151925/202610339349301511/full", "title": "Union filing, FYE 3/2025"}]}], "cost_per_unit": [], "evidence_quality": "unknown"}], "targets": {"publishes_targets": "no", "summary": "No target specific enough to fail was found. The 2025-2028 Strategic Framework, as described by the executive director, uses words like 'explore', 'advance', 'monitor' and 'expand', with no numbers, benchmarks or deadlines. The full framework was not read, so a private version with measures cannot be ruled out. Sponsored-bill packages are the nearest thing to advance commitments, but no recent start-versus-finish report was seen. The last clear example found dates from 2015.", "examples": [{"goal": "Respond to Trump administration policies, including monitoring and challenge", "year": "2025-2028", "stated": "Directional commitment in a Dec 13, 2024 post.", "result": "Activity clearly followed, with several suits and rulings in 2025-26. The goal could not have failed as worded.", "sources": [{"url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "title": "Forging Ahead, Dec 13, 2024"}]}, {"goal": "'Explore and advance new ways' to protect unhoused residents after Grants Pass", "year": "2025-2028", "stated": "Same post.", "result": "The 2025 San Francisco settlement covers property handling. No later report against this goal found.", "sources": [{"url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "title": "Forging Ahead, Dec 13, 2024"}]}, {"goal": "Sponsored bills for the 2015 legislative year", "year": "2015", "stated": "Began the year with 16 sponsored bills.", "result": "Seven signed. A rare hit-and-miss report, but 11 years old and statewide, not this affiliate alone.", "sources": [{"url": "https://www.aclunorcal.org/blog/aclu-california-center-advocacy-policy-lobbying-machine", "title": "ACLU of California Center for Advocacy & Policy, Oct 13, 2015"}]}], "basis": "evidence"}, "dollars_to_change": {"latest": {"year": 2025, "spent": 25240288, "summary": "FYE 3/2025. Foundation $19,816,451 plus Union $6,148,837, less the $725,000 Foundation-to-Union grant (my arithmetic). Other inter-entity flows are not removed, and donated legal services are excluded. Changes that landed in the year were poor: Prop 36 passed and the Grants Pass fallout continued. The first TPS order, of March 2025, was later reversed. Suits funded in this period (UFW, February 2025) and the capacity behind them paid off in FY26-27: UFW injunction (April 2025), San Francisco settlement (Sept 2025), Sequen and Garro Pinchi (Dec 2025 to June 2026). Those were mostly co-lead results, at significance 2 to 4. Spending for those later years is not yet filed, so this pairing is approximate."}, "earliest": {"year": 2023, "spent": 26522992, "summary": "FYE 3/2023. Foundation $16,542,137 plus Union $9,980,855, a raw sum with no eliminations. Aggregators suggest the Union's total may include a one-off $3M grant to national, unresolved. Changes landed: Zepeda Rivas final approval (significance 3, co-lead, since expired) and the Marin settlement (significance 2, co-lead, now allegedly breached). These came from suits filed in 2020-21, so lag applies here too. Ballot and bill results for that year were not reviewed."}, "north_star": {"defensible": false, "measure": null, "series": [], "limits": "Litigation effects are shared, lagged by one to three years, often temporary, and rarely counted. Case-level spending is not published. No figure exists for arrests avoided or people protected. A cost-per-person number would rest on invented denominators.", "what_would_make_it_possible": "Case-level staff time and fee recovery, plus outcome data: EOIR or ICE arrest records by court before and after the Sequen orders, Border Patrol stop data for the Eastern District, Siskiyou auditor reports, and the San Francisco quarterly property reports."}, "qualitative_judgment": "The donor is mainly buying a standing regional legal team, about 117 employees across a two-entity structure, that can file fast and lead coalitions in federal court. Results are real and checkable as court orders. They are also shared, usually provisional and exposed to a hostile appellate path. Local settlements are smaller and more durable on paper, but Marin shows that paper wins may not hold without monitoring. Ballot and legislative defense had visible losses in 2024. The lived effect is mostly unmeasured.", "strongest_item": "Pablo Sequen v. Albarran: earliest nationwide vacatur of courthouse-arrest policies, plus regional relief months ahead, with a report of no detentions afterward at San Francisco immigration court. Shared credit, and on appeal.", "weakest_item": "National TPS Alliance: largest population, repeated district and circuit wins, nothing durable, and an adverse Supreme Court holding. Among local items, Coalition on Homelessness: years of litigation that ended with the city keeping its existing policy and sweep program, though with monitoring.", "basis": "inference"}, "trend": {"change_per_dollar": "mixed", "reporting_direction": "insufficient_data", "rationale": "Combined spending was roughly flat from FY23 ($26.5M raw) to FY25 ($26.0M raw). The Foundation's rose and the Union's fell. The reach of rulings rose in 2025-26, from two facilities and one county to regional and nationwide orders. Durability got worse: TPS was reversed, the UFW injunction was lifted, and Zepeda expired. Part of the rise reflects federal policy creating big targets, not better performance (inference). Attribution stays at co-lead throughout. The 2025-26 results fall in fiscal years with no filed spending, so a true per-dollar comparison is not possible. On reporting, the snippets seen for 2023, 2024 and 2025 are heavy on counts (bills, members, cases), which suggests an output tilt. But the report PDFs could not be read, so no direction is claimed.", "basis": "inference"}, "peer_comparables": [{"peer": "ACLU of Southern California", "outcome": "Roving-patrol injunction in Vasquez Perdomo, the closest parallel to UFW v. Noem, was stayed by the Supreme Court 6-3 on Sept 8, 2025.", "value_text": "Injunction stayed after about two months' life at most (inference on duration). NorCal's UFW injunction lasted about 16 months before a procedural lift. FY25 expenses $13.9M.", "year": "2025", "sources": [{"url": "https://litigationtracker.justiceactioncenter.org/cases/noem-v-vasquez-perdomo-southern-ca-raids-supreme-court", "title": "Litigation tracker: Noem v. Vasquez Perdomo"}, {"url": "https://clearinghouse.net/case/46758/", "title": "Clearinghouse: Vasquez Perdomo"}]}, {"peer": "Lawyers' Committee for Civil Rights of the SF Bay Area", "outcome": "Co-counsel on Sequen, Coalition on Homelessness and Zepeda Rivas: the same results, reported by each as its own.", "value_text": "FY25 expenses $4.44M, about 17% of the ACLU pair's raw $26.0M. This is a caution on attribution, not a per-dollar ranking, because workloads are unknown.", "year": "2022-2026", "sources": [{"url": "https://lccrsf.org/cases/pablo-sequen-v-albarran-ice-courthouse-arrests-unlawful-detention-conditions/", "title": "LCCRSF case page"}, {"url": "https://lccrsf.org/cases/zepeda-rivas-v-jennings-immigration-detention/", "title": "LCCRSF Zepeda Rivas page"}]}, {"peer": "NYCLU and national ACLU", "outcome": "S.D.N.Y. nationwide ruling against the same courthouse-arrest policy, filed before Sequen and decided after it.", "value_text": "Oct 1, 2026 decision. Shows the Sequen result was not unique, though Sequen came first.", "year": "2026", "sources": [{"url": "https://aclu.org/press-releases/federal-court-strikes-down-ices-courthouse-arrest-policy-nationwide", "title": "ACLU release, Oct 1, 2026"}]}, {"peer": "Asian Law Caucus", "outcome": "Co-counsel on the Siskiyou partial settlement.", "value_text": "Same settlement; expenses $14.6M. No comparable independent outcome metric found.", "year": "2025-2026", "sources": [{"url": "https://nextshark.com/siskiyou-county-settlement-asian-discrimination-lawsuit", "title": "NextShark"}]}, {"peer": "Electronic Frontier Foundation", "outcome": "Co-counsel on Marin and Williams, and on the San Jose Flock suit.", "value_text": "Same mixed record on surveillance: one settlement now contested, one loss. Expenses $25.8M.", "year": "2022-2026", "sources": [{"url": "https://www.eff.org/deeplinks/2026/10/we-demand-more-information-how-marin-cops-illegally-shared-flock-alpr-data", "title": "EFF, Oct 2026"}, {"url": "https://www.404media.co/aclu-and-eff-sue-a-city-blanketed-with-flock-surveillance-cameras/", "title": "404 Media"}]}], "verdict": "In its latest filed year (FYE 3/2025) the ACLU of Northern California pair spent about $25.2M, and the results of that year arrived mostly afterward. Its best demonstrable result is Pablo Sequen v. Albarran: a December 2025 regional stop and a June 2026 nationwide vacatur of ICE courthouse-arrest policies, shared with three co-counsel, on appeal, and matched by a separate New York ruling that would likely have come anyway. It also won a regional block on ICE re-arrests, a Central Valley Border Patrol injunction that the Ninth Circuit lifted in August 2026, and smaller settlements in Siskiyou and San Francisco. The largest case by people affected, Venezuelan TPS, ended in reversal, and 2024's ballot fights were lost. Compared with FY23, when about $26.5M came with one settlement since expired and one now allegedly breached, reach is wider on flat filed spending, while durability is no better. No per-dollar comparison holds because 2025-26 spending is unfiled. The rulings are public record and do not rest on the organization's word. Claims about who was actually protected, how many, and whether members or bills matter rest on its word or on nothing, because no outcome measures, advance targets or independent evaluation were found.", "gaps": ["Effect on people: arrests avoided under Sequen and Garro Pinchi, stops changed under UFW, and compliance in San Francisco and Siskiyou. No data found.", "Ninth Circuit status of Sequen (a CourtListener entry shows No. 25-7868 and a stay denial, undated in the snippet) and of Garro Pinchi: not established after August 2026.", "NorCal's actual role and hours in National TPS Alliance and Mullin v. Doe: not established. Attribution to 'California branches of the ACLU' is from Wikipedia.", "Gomez Ruiz v. ICE (California City, February 2026 injunction with outside monitor; over 1,000 detained) was left out of the harvest. Named counsel are the Prison Law Office, the national ACLU National Prison Project, California Collaborative for Immigrant Justice and Keker. No source names NorCal.", "Annual report PDFs for 2021, 2024 and 2025, and the San Francisco milestones PDF, returned compressed data. Copies are saved in the session folder, but no text extraction tool was available. Figures from them are search snippets only. The 2023 report site failed a certificate check.", "Part III narratives are not available: the extract's Part III field is empty, and ProPublica's viewer shows 'Loading'. Program lines above come from snippets, aggregators and Part IX. The specific results claimed could not be compared with outcomes.", "Spending by program, issue or case: no evidence found. FY26 spending: not yet filed. The combined audit was not read, so inter-entity eliminations are partial.", "Restructuring: programs ended, staff laid off, and any drop in case capacity. No evidence found beyond an anonymous, single-source report.", "Outcomes for 2021 and calendar-2023 to 2024 are thin. The Racial Justice Act capital habeas petition (Oct 4, 2024) has no ruling found. The harvest likely undercounts state-court, amicus and California Supreme Court work, and legislative wins other than SB 852.", "Whether 'Foundation program revenue' is attorney fees, and NorCal's share of the $2,828,000 San Francisco fee award: not found.", "Williams appeal outcome rests on a third-party summary; the opinion was not read. Prop E and F percentages are early returns."], "documents_that_would_close_gaps": ["2024 and 2025 annual reports, 2021 report and full 2023 report, as extracted text.", "2025-2028 Strategic Framework and any internal dashboard or board outcome memo.", "Part III and Schedule O of Foundation and Union Forms 990 for FY22-FY25 (IRS XML), plus Schedule R and I.", "FY24-FY25 combined audits, including notes on attorney fees and inter-entity transfers.", "A case-level ledger from the organization: staff time, co-counsel role, fees recovered and result, for the top 15 matters since 2021.", "Dockets on CourtListener or PACER: Sequen (5:25-cv-06487, Ninth Circuit), Garro Pinchi (25-cv-05632), UFW (1:25-cv-00246, No. 25-4047), and National TPS Alliance (3:25-cv-01766), including counsel of record.", "EOIR, ICE or Deportation Data Project arrest records by courthouse, and TRAC reports, for before-and-after comparison.", "Siskiyou auditor reports, San Francisco quarterly property reports under the settlement, and Marin's response to the Oct 1, 2026 letter.", "Layoff notices and Local 20 communications on the 2024 restructuring, or a written account from the organization.", "ACLU California Action reports showing bills sponsored and signed by year, with NorCal's financial share."], "sources": [{"url": "https://www.aclunorcal.org/cases/pablo-sequen-v-albarran/", "title": "ACLU NorCal: Pablo Sequen v. Albarran"}, {"url": "https://lccrsf.org/pressroom_posts/federal-court-delivers-crushing-blow-to-trumps-mass-deportation-agenda-striking-down-courthouse-arrests-nationwide-and-restoring-protections-against-inhumane-detention/", "title": "LCCRSF release, June 24, 2026"}, {"url": "https://111things.com/national/judge-leaves-courthouse-arrest-policies-vacated-during-appeal/", "title": "Stay denial report"}, {"url": "https://aclu.org/press-releases/federal-court-strikes-down-ices-courthouse-arrest-policy-nationwide", "title": "ACLU release, Oct 1, 2026"}, {"url": "https://www.aclunorcal.org/press-releases/federal-court-blocks-ice-rearrest-policy/", "title": "ACLU NorCal: re-arrest policy blocked"}, {"url": "https://www.keker.com/news/news-items/bay-area-legal-coalition-pushes-back-ice-detentions", "title": "Keker summary of SF Standard"}, {"url": "https://www.kqed.org/news/12073215/judge-orders-ice-to-provide-medical-care-in-largest-immigration-jail-in-california", "title": "KQED: California City order"}, {"url": "https://www.aclunorcal.org/press-releases/aclu-defends-court-order-barring-border-patrols-unlawful-stop-and-arrest-practices/", "title": "ACLU NorCal: UFW appeal"}, {"url": "https://www.turlockjournal.com/news/crime/federal-court-temporarily-lifts-injunction-protecting-valley-from-sweeps-as-immigration-arrests-rise-in-stanislaus/", "title": "Turlock Journal"}, {"url": "https://www.newsmax.com/us/border-patrol-united-farm-workers-california/2026/08/24/id/1267199/", "title": "9th Circuit lifts block"}, {"url": "https://en.wikipedia.org/wiki/National_TPS_Alliance_v._Noem", "title": "Wikipedia: National TPS Alliance v. Noem"}, {"url": "https://www.mlex.com/pulse/articles/2529322", "title": "MLex, Oct 5, 2026"}, {"url": "https://www.scotusblog.com/2026/07/trump-administration-asks-justices-to-have-lower-court-reconsider-protected-status-for-venezuela/", "title": "SCOTUSblog, July 2026"}, {"url": "https://www.cooley.com/news/coverage/2022/2022-06-22-cooley-secures-civil-rights-win-for-california-ice-detainees", "title": "Cooley on Zepeda Rivas"}, {"url": "https://www.aclunorcal.org/our-work/legal-docket/zepeda-rivas-v-jennings-immigration-detention", "title": "ACLU NorCal: Zepeda Rivas"}, {"url": "https://nextshark.com/siskiyou-county-settlement-asian-discrimination-lawsuit", "title": "NextShark: Siskiyou"}, {"url": "https://www.sf.gov/news-san-francisco-finalizes-settlement-in-homeless-encampment-lawsuit", "title": "City of San Francisco settlement"}, {"url": "https://www.kqed.org/news/12049434/sf-agrees-to-2-8-million-settlement-plans-reform-of-homeless-encampment-sweeps", "title": "KQED: San Francisco settlement"}, {"url": "https://www.eff.org/deeplinks/2026/10/we-demand-more-information-how-marin-cops-illegally-shared-flock-alpr-data", "title": "EFF on Marin, Oct 2026"}, {"url": "https://kpbs.org/news/local/2022/06/03/california-police-cannot-share-drivers-location-data-out-of-state", "title": "KPBS on Marin, 2022"}, {"url": "https://gvwire.com/2026/04/07/aclu-wants-fresno-police-k-9-records-city-fights-and-loses-twice/", "title": "GV Wire: Fresno K-9"}, {"url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "title": "Forging Ahead, Dec 13, 2024"}, {"url": "https://www.aclunorcal.org/blog/aclu-california-center-advocacy-policy-lobbying-machine", "title": "ACLU Center for Advocacy & Policy, 2015"}, {"url": "https://ballotpedia.org/San_Francisco,_California,_Proposition_E,_Limit_Police_Department_Administrative_Task_Time_and_Increase_Use_of_Camera_and_Drone_Technology_Initiative_(March_2024)", "title": "Ballotpedia: SF Prop E"}, {"url": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "title": "Above the Law, Oct 2024"}, {"url": "https://annualreport.aclunc.org", "title": "2023 Annual Report (snippets)"}, {"url": "https://www.aclunc.org/sites/default/files/2024-ACLUNorCal-annual-report-web-final-6-23-25.pdf", "title": "2024 Annual Report (snippets)"}, {"url": "https://projects.propublica.org/nonprofits/organizations/940279770", "title": "ProPublica: Foundation"}, {"url": "https://projects.propublica.org/nonprofits/organizations/942151925", "title": "ProPublica: Union"}]}, "landscape": {"field_definition": "Impact litigation, state and local policy advocacy, and organizing against unconstitutional or unlawful government conduct, mainly federal, state and local executive action, affecting residents of Northern and Central California. Current visible priorities are immigration detention and arrests, police surveillance, voting, and racial and economic justice. The FY25 990 lists six programs: criminal justice reform, democracy and civic engagement, gender and reproductive justice, immigrants' rights, racial and economic justice, and technology and civil liberties (evidence: https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990). Current legal projects appear consolidated into Criminal Law & Immigration, Democracy, Speech & Technology, and Special Litigation & Appeals (evidence: https://job-boards.greenhouse.io/aclunc/jobs/8657569002). This is a law-and-policy shop aimed at rules and systems. It is not primarily an individual legal-services provider (inference from the entity map's site review and the program list).", "problem_trend": {"direction": "growing", "rationale": "The direction applies to immigration enforcement, the one front with hard counts. The rest of the docket has no comparable trend measure in what I read.\n\nEvidence:\n- ICE's San Francisco area of responsibility logged 2,928 arrests in January-July 2025 and 4,970 in January-July 2026, per an ABC7 analysis of Deportation Data Project records (search snippet).\n- That same area, which covers California north of Bakersfield, logged 890 arrests in July 2026, up more than 60% from February. KQED published this on Aug. 31, 2026. A DHS spokesperson called the analysis \"cherry-picked\".\n- A USC analysis reports California arrests rising from 5,600 in 2024 to 27,207 in 2025 (search snippet; the original study was not opened).\n- The trend is not uniform: Los Angeles-area arrests fell sharply from their 2025 peak (ABC7).\n\nSurveillance is growing in exposure and contested in law:\n- San Jose police searched their license-plate database 261,711 times between June 2024 and June 2025, per a verified complaint. That is an allegation in a pleading.\n- A Santa Clara County judge dismissed the ACLU NorCal and EFF challenge in about October 2026, relying on a 2024 appellate ruling (KQED). The plaintiffs are weighing options, including appeal. San Jose nonetheless cut data retention from one year to 30 days.\n\nThe broader claim that civil-liberties threats overall are growing is inference from these two fronts. No evidence found of trend measures for police practices, voting or reproductive rights in Northern California.", "basis": "evidence", "sources": [{"url": "https://abc7news.com/post/ice-arrests-san-francisco-bay-area-70-uc-berkeley-data-project-finds/19754574/", "title": "ABC7: ICE arrests in Bay Area up nearly 70%"}, {"url": "https://www.kqed.org/news/12097313/northern-california-ice-arrests-surged-this-summer", "title": "KQED: Northern California ICE arrests surged this summer (Aug. 31, 2026)"}, {"url": "https://www.immigrantdataca.org/sites/cidp/files/2026-06/AAPI_Force_ICE_Arrest_data_factsheet_V4.pdf", "title": "AAPI FORCE ICE arrest data factsheet (result listed; not opened)"}, {"url": "https://abc7.com/post/ice-arrests-plummet-los-angeles-after-2025-surge/18824323/", "title": "ABC7: ICE arrests across LA fall sharply after 2025 surge"}, {"url": "https://www.kqed.org/news/12102922/south-bay-judge-rules-san-joses-flock-cameras-dont-invade-privacy", "title": "KQED: Judge rules San Jose Flock cameras don't invade privacy (Oct. 2026)"}, {"url": "https://www.404media.co/aclu-and-eff-sue-a-city-blanketed-with-flock-surveillance-cameras/", "title": "404 Media: ACLU and EFF sue San Jose"}]}, "peers": [{"name": "American Civil Liberties Union Foundation Inc (national)", "ein": "13-6213516", "website": "https://www.aclu.org", "relationship": "national_parent", "how_they_differ": "National docket and Supreme Court capacity, with no regional focus. It is also a funder of the subject: its FY25 Schedule R shows $7,765,506 flowing from national to the NorCal Foundation (evidence, direction inferred from the form's line codes).", "scale_note": "FYE 3/2025 per the financial extract: revenue $306.8M, expenses $245.5M, net assets $779.7M (evidence, 990 data).", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/136213516", "title": "ProPublica: ACLU Foundation Inc"}, {"url": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990ScheduleR", "title": "NorCal Foundation FY25 Schedule R"}]}, {"name": "ACLU Foundation of Southern California", "ein": "95-2673361", "website": "https://www.aclusocal.org", "relationship": "coalition_partner", "how_they_differ": "Same federation and model, different territory, so it is not a true alternative for a donor focused on Northern California. NorCal's 2025 annual report says NorCal is co-counsel with it in Vasquez Perdomo v. Noem (evidence: search-result summary of the report; the PDF was unreadable). A Dec. 30, 2024 WARN filing shows 8 layoffs there (evidence: snippet).", "scale_note": "FYE 3/2025: revenue $15.34M, expenses $13.94M, assets $43.54M (evidence: ProPublica). Foundation entity only.", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/952673361", "title": "ProPublica: ACLU Foundation of Southern California"}, {"url": "https://www.warntracker.com/company/aclu-of-southern-california", "title": "WARN Tracker: ACLU of Southern California"}]}, {"name": "ACLU Foundation of San Diego and Imperial Counties", "ein": "33-0325791", "website": null, "relationship": "coalition_partner", "how_they_differ": "Same federation, border-region territory. It filed its own Flock suit against San Diego in September 2026 (evidence: KPBS snippet). It does not compete in Northern California (inference from the federation's territorial structure).", "scale_note": "FYE 3/2025: revenue $3.86M, expenses $4.74M, assets $8.82M (evidence: ProPublica). About a quarter of the NorCal Foundation's spending.", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/330325791", "title": "ProPublica: ACLU Foundation of San Diego and Imperial Counties"}, {"url": "https://www.kpbs.org/news/public-safety/2026/09/30/local-aclu-foundation-sues-city-of-san-diego-police-department-over-use-of-flock-cameras", "title": "KPBS: Local ACLU foundation sues San Diego over Flock cameras"}]}, {"name": "Lawyers' Committee for Civil Rights of the San Francisco Bay Area", "ein": "94-2581415", "website": null, "relationship": "direct_competitor", "how_they_differ": "Closest direct competitor for Bay Area donors and immigration-enforcement outcomes. Much smaller. It combines impact work with direct help, including a walk-in legal clinic (evidence: Give Lively page title). It is reported as the lead voice on the September 2025 courthouse-arrests class action, with ACLU NorCal also named in that coverage (evidence: Hoodline, search snippets). Exact party and counsel roles were not checked on the docket.", "scale_note": "FYE 6/2025: revenue $5.20M, expenses $4.44M, assets $5.66M (evidence: ProPublica).", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/942581415", "title": "ProPublica: Lawyers' Committee for Civil Rights of the SF Bay Area"}, {"url": "https://hoodline.com/2025/12/bay-area-civil-rights-groups-file-lawsuits-challenging-trump-administration-s-immigration-enforcement-policies/", "title": "Hoodline: Bay Area civil rights groups file lawsuits"}, {"url": "https://www.axios.com/local/san-francisco/2025/09/19/ice-courthouse-arrests-civil-rights-lawsuit", "title": "Axios: Civil rights groups sue over ICE courthouse arrests"}, {"url": "https://secure.givelively.org/donate/lawyers-committee-for-civil-rights-of-the-san-francisco-bay-area/lccrsf-walk-in-legal-clinic", "title": "LCCRSF walk-in legal clinic donation page"}]}, {"name": "Asian Law Caucus", "ein": "94-2176139", "website": "https://www.asianlawcaucus.org", "relationship": "direct_competitor", "how_they_differ": "Founded in 1972 and defined by community: low-income Asian American and Pacific Islander communities (evidence: own site, via search summary). It works in the same San Francisco legal market and was part of the birthright-citizenship coalition alongside the ACLU (evidence: LAist snippet). It also has workers' rights attorneys, which is outside the subject's core government-conduct focus (evidence: job posting title; inference on the contrast).", "scale_note": "FYE 6/2025: revenue $12.57M, expenses $14.56M, assets $35.22M (evidence: ProPublica). Running a deficit of about $2.0M that year (inference: arithmetic).", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/942176139", "title": "ProPublica: Asian Law Caucus"}, {"url": "https://www.asianlawcaucus.org/about", "title": "Asian Law Caucus: Our Vision"}, {"url": "https://laist.com/news/politics/california-civil-rights-group-joins-fight-against-trumps-birthright-citizenship-changes", "title": "LAist: California civil rights group joins birthright citizenship fight"}]}, {"name": "Electronic Frontier Foundation", "ein": "04-3091431", "website": "https://www.eff.org", "relationship": "direct_competitor", "how_they_differ": "Single-domain digital rights organization with national scope and a surveillance litigation director. It was a co-counsel-level partner on the San Jose Flock suit (evidence: KQED). It overlaps only with the subject's technology work, and does not cover immigration detention or voting (inference from the mission). It both competes with and complements the subject.", "scale_note": "FYE 6/2025: revenue $21.59M, expenses $25.77M, assets $56.35M (evidence: ProPublica). Expenses exceed the NorCal Foundation's.", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/43091431", "title": "ProPublica: Electronic Frontier Foundation"}, {"url": "https://www.kqed.org/news/12102922/south-bay-judge-rules-san-joses-flock-cameras-dont-invade-privacy", "title": "KQED: San Jose Flock ruling"}]}, {"name": "Immigrant Legal Resource Center", "ein": "94-2939540", "website": null, "relationship": "complement", "how_they_differ": "San Francisco-based and immigration-only. The method difference (training and technical support for immigration practitioners, versus government-conduct litigation) is my understanding of its model and was not verified in a source I read, so treat it as inference.", "scale_note": "CY2024: revenue $17.59M, expenses $21.88M, assets $48.59M (evidence: ProPublica). Deficit about $4.3M (inference: arithmetic).", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/942939540", "title": "ProPublica: Immigrant Legal Resource Center"}, {"url": "https://causeiq.com/organizations/immigrant-legal-resource-center,942939540", "title": "CauseIQ: EIN 94-2939540"}]}, {"name": "Public Advocates Inc", "ein": "23-7103042", "website": null, "relationship": "direct_competitor", "how_they_differ": "San Francisco nonprofit law firm and advocacy group challenging the systemic causes of poverty and racial discrimination (evidence: Benevity listing). It overlaps with the subject's racial and economic justice work, not with its speech, surveillance or immigration-arrest work (inference).", "scale_note": "FYE 6/2025: revenue $9.88M, expenses $7.42M, assets $20.32M (evidence: ProPublica).", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/237103042", "title": "ProPublica: Public Advocates Inc"}, {"url": "https://causes.benevity.org/causes/840-237103042", "title": "Benevity: Public Advocates"}]}], "differentiation": {"position": "leader", "rationale": "A regional leader by breadth and structure, not a demonstrated leader on outcomes, and not unique on any single issue.\n\nFor leadership:\n- At $19.8M in Foundation expenses plus a $6.1M 501(c)(4), it is the largest multi-issue organization in this peer set operating in the region. EFF ($25.8M) and ILRC ($21.9M) spend more at the entity level, but each works one domain (evidence: 990 data; ranking is inference, and the peer set is my selection, not a census).\n- It combines six programs, a sister lobbying entity, and the ACLU brand and national network. Schedule I shows a $725,000 Foundation grant to the 501(c)(4) for legislative purposes in FY25 (evidence). None of the peers reviewed shows this mix (inference; peers' 501(c)(4) arms were not checked).\n- It is active in the region's current fights: the ICE re-detention suit, the courthouse-arrests litigation and the Flock suit (evidence: press).\n\nAgainst overstating it:\n- On each issue others are present, and sometimes visibly in front. Press attributes the courthouse case to the Lawyers' Committee, and EFF has a dedicated surveillance litigation director.\n- Large wins are not automatic: the San Jose Flock suit was dismissed in about October 2026.\n- I did not compare case outcomes across peers, so leadership here means scale and reach, not effectiveness.", "basis": "inference", "confidence": 0.65}, "counterfactual": {"if_org_disappeared": "Short term, active class actions and pending cases would need replacement counsel, and some advocacy on city and county policy would stop. The people affected are mostly class members and residents covered by rules, not a client caseload, so the first-order harm is lost enforcement and lost policy pressure, not hundreds of abandoned individual clients (inference from the impact model; case and client counts were not established).\n\nThe worst-hit area is likely outside the Bay Area. In 2026 the organization has been recruiting attorneys for Fresno, Sacramento and San Francisco (evidence: job listing snippets). The Bay Area peers I reviewed are San Francisco-based, and I found no evidence of a comparable multi-issue litigator in the Central Valley. I did not search for one specifically, so this is a hypothesis.\n\nThe literal scenario is also unlikely. A national body with $779.7M in net assets, already sending $7.8M a year to this affiliate, would probably rebuild an affiliate or staff the territory directly (speculation; no document on national's step-in rights was found).", "who_absorbs": "By issue (inference):\n- Immigration enforcement: Lawyers' Committee SF, Asian Law Caucus, CARECEN of Northern California, private co-counsel such as Keker, Van Nest & Peters and Coblentz Patch Duffy & Bass (evidence that those firms appear in coverage of these cases), plus public defenders. The national ACLU would likely take the highest-profile matters.\n- Surveillance: EFF.\n- Racial and economic justice: Public Advocates.\n- Southern California matters are held by the sister affiliates.\n\nLeast clearly absorbed: multi-issue state and local lobbying through a sister 501(c)(4), and the membership and organizing base. Peers are stretched. Asian Law Caucus, ILRC and EFF all reported deficits in their latest filing (evidence: ProPublica; arithmetic). The State Bar says $187M in federal legal aid funding is at risk (snippet), and the state's own release says immigration legal capacity cannot meet demand (snippet).", "if_gift_does_not_arrive": "For a gift of $25,000-$250,000, I can identify nothing specific that fails. FY25 Foundation surplus was $2.02M, and net assets without donor restrictions were $37.45M, about 22.7 months of expenses (evidence for inputs; arithmetic is inference; the board-designated share is unknown). The sister 501(c)(4) added a $3.44M surplus.\n\nThe real marginal effect shows at the level of a position over multiple years. A staff attorney's posted salary range is $130,110-$230,404, so about $200,000-$350,000 a year would cover one attorney once benefits and overhead are loaded (the range is a snippet; the loading is my assumption). FY26 figures could change this picture, and they are not filed.\n\nHistory cuts the other way too. After a $6.95M FY24 deficit, staff count fell from 130 to 117 on the filings, and anonymous sources told Above the Law in October 2024 of layoffs and eliminated program areas. The organization did not comment. So the leadership has shown it will cut rather than run reserves down indefinitely, which means a sustained revenue shortfall does end in lost capacity. A single gift's absence does not (inference).", "basis": "inference", "confidence": 0.55, "sources": [{"url": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990", "title": "NorCal Foundation FY25 Form 990"}, {"url": "https://projects.propublica.org/nonprofits/full_text/202500369349301225/IRS990", "title": "NorCal Foundation FY24 Form 990"}, {"url": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california", "title": "Above the Law: Layoffs headed for public interest attorneys in Northern California (Oct. 29, 2024)"}, {"url": "https://legalalphabet.com/job/staff-attorney-senior-staff-attorney-job-at-aclu-of-northern-california-in-fresno", "title": "Staff Attorney / Senior Staff Attorney listing, Fresno"}, {"url": "https://www.calbar.ca.gov/news/state-bar-report-finds-funding-cuts-would-severely-weaken-legal-aid-lifeline-millions-californians", "title": "State Bar of California: Funding cuts would severely weaken legal aid"}, {"url": "https://davisvanguard.org/2026/02/california-immigrant-aid-partnership/", "title": "Davis Vanguard: Newsom administration expands legal aid"}, {"url": "https://hoodline.com/2025/12/bay-area-civil-rights-groups-file-lawsuits-challenging-trump-administration-s-immigration-enforcement-policies/", "title": "Hoodline: Bay Area civil rights groups file lawsuits"}, {"url": "https://davisvanguard.org/2025/09/immigrant-detention-lawsuit-norcal/", "title": "Davis Vanguard: Class action on courthouse arrests"}]}, "right_unit": {"verdict": "Fund this organization only if the donor's goal is changing rules across Northern and Central California through litigation and state and local policy. Even then, give restricted or multi-year money tied to a named capacity, such as Fresno or Central Valley attorney work, and not unrestricted general support. If the goal is helping people now facing detention or deportation, this is the wrong unit: fund direct representation or family aid instead. For an unrestricted dollar, smaller peers are likely more cash-constrained.", "alternatives": ["Lawyers' Committee for Civil Rights of the SF Bay Area (EIN 94-2581415): similar immigration impact work plus direct help, on $4.4M of expenses and $5.66M of assets. A given gift is a far larger share of its budget.", "Direct removal defense: California Collaborative for Immigrant Justice (detained immigrants; EIN not found), Centro Legal de la Raza (Oakland; EIN not confirmed: a ProPublica page under EIN 23-7181456 appeared but was not verified as the Oakland group) and county or bar programs such as the SF Bar's Immigrant Legal Defense Program.", "Stand Together Bay Area Fund, led by the San Francisco Foundation: launched September 2025 with a $10M goal, gives families $1,000-$3,000. It is cash aid, not systems change.", "EFF (EIN 04-3091431), if the donor's concern is surveillance only. Note it reported a $4.2M deficit in FY25.", "Asian Law Caucus (EIN 94-2176139) or Public Advocates (EIN 23-7103042), for those specific communities or issue areas.", "The ACLU NorCal 501(c)(4) (EIN 94-2151925), if the priority is state and local legislation and deductibility is not needed. It already held $17.85M in net assets at FYE 3/2025.", "National ACLU Foundation: not recommended for regional impact, because it has $779.7M in net assets and a gift there adds least."], "rationale": "The subject's comparative advantage is scale, the paired 501(c)(3) and 501(c)(4), and the ability to take on government defendants across many issues. That does not extend to individual representation, where the State Bar and the state itself report that capacity falls short of demand (snippets). The San Francisco Foundation's fund and county immigrant-defense funds show that philanthropy and local government are building that layer separately (evidence), while local budgets tighten (San Jose gap of about $50M, San Francisco proposed nonprofit cuts; snippets). The subject also held about 22.7 months of unrestricted net assets at FYE 3/2025 (inference from 990 inputs), so unrestricted gifts have a weaker claim than gifts to a thinly funded peer. I did not compare effectiveness per dollar. That comparison, and each peer's own reserves and funding constraints, should be tested in the side-by-side.", "basis": "inference"}, "funder_landscape": {"known_funders": [{"name": "American Civil Liberties Union Foundation Inc (national)", "note": "By far the largest identified source. $7,765,506 in FY25 and $5,262,757 in FY24, reported as contributions from related organizations (evidence: Schedule R and Part VIII). That is 35.6% of FY25 revenue and 43.3% of FY24 revenue (inference: arithmetic). The Foundation reimbursed national $501,219 in FY25. Some of this flow may be NorCal-raised money under gift-sharing, not independent national support (speculation). Candid's $251,646 in 2023 is far lower and is inconsistent with these figures, showing aggregator lists are incomplete.", "sources": [{"url": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990ScheduleR", "title": "NorCal Foundation FY25 Schedule R"}, {"url": "https://projects.propublica.org/nonprofits/full_text/202500369349301225/IRS990", "title": "NorCal Foundation FY24 Form 990"}]}, {"name": "Donor-advised funds: Donor Advised Charitable Giving Inc, Fidelity Charitable, Vanguard Charitable, American Online Giving Foundation", "note": "Dominate the Candid list via InfluenceWatch. In 2025: DACG $1,501,687; Fidelity $663,297; Vanguard $537,000; American Online Giving $319,300. They reflect individual donors' decisions, not institutional diligence (inference). Secondary source and a selection of the highest grants only.", "sources": [{"url": "https://www.influencewatch.org/non-profit/aclu-foundation-of-northern-california2/", "title": "InfluenceWatch: ACLU Foundation of Northern California"}]}, {"name": "San Francisco Foundation", "note": "Recurring on the list: $339,000 (2020), $270,000 (2022), $410,000 (2023), $270,500 (2024), $803,800 (2025) (evidence, secondary). A community foundation, so some of this may be donor-advised (inference).", "sources": [{"url": "https://www.influencewatch.org/non-profit/aclu-foundation-of-northern-california2/", "title": "InfluenceWatch: ACLU Foundation of Northern California"}]}, {"name": "The Libra Foundation", "note": "$500,000 in 2021 (secondary). Not on the listed top grants after 2021. The list shows only the highest-value grants, so this is not evidence of a departure. An Impala AI summary's $1.9M for 2019 is unverified.", "sources": [{"url": "https://www.influencewatch.org/non-profit/aclu-foundation-of-northern-california2/", "title": "InfluenceWatch: ACLU Foundation of Northern California"}, {"url": "https://impala.digital/public/profiles/94-0279770/overview", "title": "Impala: EIN 94-0279770"}]}, {"name": "Horizons Foundation, Amalgamated Charitable Foundation, Silicon Valley Community Foundation", "note": "2021 grants of $227,750, $305,000 and $275,989 (secondary). Impala's top-funder panel shows SVCF at $7M cumulative, and an AI summary shows Horizons at $1.6M for 2025. Neither was verified.", "sources": [{"url": "https://www.influencewatch.org/non-profit/aclu-foundation-of-northern-california2/", "title": "InfluenceWatch: ACLU Foundation of Northern California"}, {"url": "https://impala.digital/public/profiles/94-0279770/overview", "title": "Impala: EIN 94-0279770"}]}, {"name": "Evelyn and Walter Haas Jr. Fund; The California Endowment", "note": "$111,884 in 2023 from Haas Jr. (California Voting Rights Act work) and $86,884 in 2024 from the Endowment (education equity; subgrant), both credited to NorCal, per a table on InfluenceWatch's Southern California page (search summary). Could be mislabeled. Verify with the funders.", "sources": [{"url": "https://www.influencewatch.org/non-profit/aclu-foundation-of-southern-california/", "title": "InfluenceWatch: ACLU Foundation of Southern California"}]}, {"name": "van Loben Sels/RembeRock Foundation", "note": "General support grant to the subject; year and amount not stated on the page.", "sources": [{"url": "https://vlsrr.org/grant/american-civil-liberties-union-aclu-foundation-of-northern-california-4/", "title": "vLS/RembeRock grant page"}]}, {"name": "Peer funders: Hewlett Foundation, Haas Jr. Fund, California Endowment", "note": "Hewlett lists grants to ACLU Southern California (including Williams settlement work, older) and to Asian Law Caucus. Haas Jr. lists ACLU SoCal. InfluenceWatch's table shows a $900,000 California Endowment award to SoCal in 2023 (summary; unverified). No Hewlett grant to NorCal appeared in my search.", "sources": [{"url": "https://hewlett.org/grants/aclu-foundation-of-southern-california-for-monitoring-and-implementation-of-the-williams-settlement", "title": "Hewlett: ACLU SoCal, Williams settlement grant"}, {"url": "https://hewlett.org/?p=29920578", "title": "Hewlett: Asian Law Caucus grant"}, {"url": "https://haasjr.org/node/1148", "title": "Haas Jr.: ACLU Foundation of Southern California"}]}], "concentration_note": "Concentration is in the federation and in individual-driven giving. National supplied 35.6% of FY25 revenue, and non-related contributions were $12.46M, mostly unattributed in what I read (evidence on inputs; arithmetic is inference). Candid reports $58.5M all-time from 191 funders across 1,073 grants (secondary). The Foundation depends on contributions for 92.6% of revenue. Legal fee income is lumpy: program revenue was $2.80M in FY23, $0.48M in FY24 and $1.01M in FY25 (evidence, financial extract). Warning: Instrumentl's \"$725,000, 1 award\" for 2025 is the subject's grants paid out, to its own 501(c)(4), and not funding received.", "sophisticated_funders_present": "Present but not dominant. Named institutional foundations (Libra, Haas Jr., California Endowment, Horizons) appear with grants in the low-to-mid six figures, and most identified dollars come from DAFs and national. No evidence found of a large multi-year institutional anchor grant. My foundation search was targeted at Hewlett, Heising-Simons, Haas Jr., California Endowment and Weingart; it did not cover Ford, MacArthur or Open Society, and the absence of those is not established.", "departures": "No evidence found of a funder quietly stopping. I cannot exclude one: aggregator lists show only top grants and are not continuous by funder, and the Schedule B donor list is not public. Libra's absence from the list after 2021 merits a direct question, nothing more.", "basis": "evidence"}, "room_for_funding": {"verdict": "It could absorb a gift of up to about $1M a year in defined multi-year attorney or regional capacity. An unrestricted gift of any size is unlikely to change what it does in the near term. A gift of $5M or more would probably sit in reserves or fund an expansion whose plan I have not seen, unless it is tied to a specific written plan. Money does not appear to be the binding constraint as of the last filed year, FYE 3/2025.", "last_big_increase": "FY25 (FYE 3/2025). Foundation revenue rose $9.67M, or 79.5%, from $12.17M to $21.84M. All other contributions added $6.67M, reaching $12.46M; national added $2.50M, reaching $7.77M; program revenue added $0.53M. Expenses rose only $0.70M, to $19.82M, or about 7% of the revenue increase. Program spending rose $0.70M to $15.45M. Employees fell from 130 to 117 between the two filings. Net assets rose $2.82M, $1.53M unrestricted and $1.29M restricted. The sister 501(c)(4) separately ran a $3.44M surplus. So most of the FY25 increase filled an earlier hole: FY24 had run a $6.95M deficit, and FY25 still left a surplus. It did not fund visible expansion during that year (evidence for figures; reading is inference).\n\nThe earlier spike shows the same pattern: FY22 revenue of $20.2M against $15.2M of expenses, a $4.97M surplus, then expenses climbing to $19.1M by FY24 as revenue fell, followed by the reported 2024 restructuring (evidence for figures; causal link is inference). The organization appears to bank revenue spikes and then spend into them over several years.", "rationale": "For absorption:\n- It has 117 staff and an active docket on rising immigration enforcement.\n- It is recruiting in 2026, including at least one attorney in Fresno (evidence: job listing snippets).\n- It has shown it can use a higher cost base: expenses grew from $11.4M in FY18 to $19.8M in FY25 (evidence).\n- It holds $8.35M in donor-restricted net assets, which shows it accepts restricted money (evidence).\n\nAgainst:\n- Foundation unrestricted net assets of $37.45M are about 22.7 months of expenses (inference from 990 inputs; the board-designated share is unknown). The 501(c)(4) adds $17.85M in net assets.\n- The FY25 surplus was not deployed during that year.\n- National has $779.7M in net assets and already supports the affiliate.\n- A 2024 restructuring, reported by anonymous sources in Above the Law with no comment from the organization, is partly corroborated by the 13-person drop in reported employees. It suggests management is cautious about permanent cost growth, or was recently stung by it (inference). Note it was not visibly reversed by March 2025.\n\nThe main caveat is timing. FYE 3/2025 captures only about ten weeks of the current federal administration. FY26 is not filed, and spending may have risen a lot since. That should be requested before any large gift, along with the FY26 and FY27 budgets, reserve policy and hiring plan.\n\nThe red 3-year margin flag (-10.3%) is misleading if read alone. It is driven by FY24 and is set against large reserves and the FY25 surplus.", "basis": "inference", "confidence": 0.6}, "gaps": ["Audits and annual reports remain unread. The FY23-FY25 combined audits, national's FY25 statements and the 2024 and 2025 NorCal annual reports all returned as compressed PDFs. Copies are saved in the session tool-results folder but no text extractor was available here. Combined consolidated figures, board-designated reserves and any audited reserve policy are therefore not established.", "Conflict with the entity map: the FY25 Schedule R, as read through a fetch summarizer, says the Foundation's directors are appointed by the ACLU NC Union. The entity map found no evidence of a parent-subsidiary relationship. If the summary is right, the 501(c)(4) controls the donor-facing 501(c)(3)'s board. Check this against the raw filing and bylaws before it goes in print.", "Gift-sharing formula and direction: no evidence found of the current split. FY25 shows a net Foundation inflow from national of about $7.26M ($7,765,506 less a $501,219 reimbursement), but I could not establish how much of that is NorCal-raised money coming back. Whether a restricted major gift escapes sharing is unknown.", "FY26 (FYE 3/2026) financials and any post-surge spending or hiring: not filed or not found. The surge's actual use cannot be judged yet.", "Layoff scale and final program changes in 2024: only anonymous sourcing in Above the Law, with no organizational confirmation. No union statement found. The 130-to-117 change is from Part V of the filings; its cause is inferred.", "Outcomes and comparative effectiveness: no case counts, win rates or per-dollar comparison with peers were established. The leader verdict rests on scale, breadth and presence in current cases.", "Case roles: party and counsel roles in the courthouse-arrests, re-detention and Vasquez Perdomo cases come from press and search summaries, not dockets. Whether the San Jose plaintiffs have appealed the dismissal was not found. The KQED ruling date (likely Oct. 2, 2026) is inferred from its article.", "Peer data: websites for the Lawyers' Committee, ILRC, Public Advocates and ACLU San Diego are left null because no verified homepage URL surfaced. CARECEN of Northern California, California Collaborative for Immigrant Justice, Pangea Legal Services, Prison Law Office and Centro Legal de la Raza were not fully sized; EINs for CARECEN, CCIJ, Pangea and Prison Law Office were not found. Peers' 501(c)(4) arms, where they exist, are not included, so entity-level comparisons understate some peers. ILRC's method description is from general knowledge.", "Regional gap: I did not specifically search for civil-liberties litigators based in the Central Valley or Sacramento. The claim that the subject's absence would hurt most there is untested.", "Funders: grant data is aggregator-derived and partial, with inconsistent totals across Impala, InfluenceWatch and Instrumentl. Foundations beyond the five I targeted were not searched individually. No evidence either way on quiet departures.", "SB 54 and state data-sharing developments: a search returned nothing usable, and I did not pursue it."], "sources": [{"url": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990", "title": "NorCal Foundation FY25 Form 990 (FYE 3/2025)"}, {"url": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990ScheduleR", "title": "NorCal Foundation FY25 S n California (Above the Law)", "type": "other", "date": "2024-10-29", "url": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "why_it_matters": "The only public account of the restructuring. Single outlet, anonymous allegations, and the organization did not comment."}, {"author_role": "Organization, press statement", "title": "ACLU of Northern CA Corrects the Record on Berkeley Patriot Statement", "type": "other", "date": "2017-09-19", "url": "https://www.aclunorcal.org/news/aclu-northern-ca-corrects-record-berkeley-patriot-statement-reported-kqed-s-california-report", "why_it_matters": "A test of the 'unpopular cause' claim, and the one instance found of the organization publicly correcting an outside account."}, {"author_role": "Weak secondary: student or employee review platform", "title": "Handshake employer reviews, ACLU of Northern California (search result only)", "type": "employee_reviews", "date": "2019", "url": "https://app.joinhandshake.com/employers/american-civil-liberties-union-aclu-of-northern-california-203530/reviews", "why_it_matters": "One favorable 2019 intake counselor review. Too thin to bear weight. Other review sites found cover national ACLU, not this affiliate."}], "verbatim_phrases": [{"phrase": "At the heart of it, everything we do is political.", "context": "Executive Director, podcast, July 2023.", "url": "https://pastforward.org/blogs/public-podcasting/abdi-soltani"}, {"phrase": "we cannot rely on the courts to be the final bulwark of defending people's rights", "context": "Executive Director, podcast, July 2023. A similar line appears in a January 2020 interview.", "url": "https://pastforward.org/blogs/public-podcasting/abdi-soltani"}, {"phrase": "we need to use that access to advance our cause", "context": "Executive Director on advocacy access to officials, July 2023.", "url": "https://pastforward.org/blogs/public-podcasting/abdi-soltani"}, {"phrase": "legal advocacy is where we have decided to funnel all of our resources", "context": "Legal Director, December 2025. The surrounding context was only partly visible through the fetch tool.", "url": "https://brownpoliticalreview.org/defending-civil-liberties/"}, {"phrase": "Is this worth our resources?", "context": "Legal Director, one of the case-screening questions.", "url": "https://brownpoliticalreview.org/defending-civil-liberties/"}, {"phrase": "Can we get a ruling with a positive impact?", "context": "Legal Director, a second screening question. The ruling is the stated unit of success.", "url": "https://brownpoliticalreview.org/defending-civil-liberties/"}, {"phrase": "Our attorneys have a lot of autonomy to identify the big issues and specific cases we need to focus on.", "context": "Legal Director on bottom-up case selection.", "url": "https://brownpoliticalreview.org/defending-civil-liberties/"}, {"phrase": "it sometimes leads to difficult internal conversations", "context": "Legal Director on the unclear line between legal and moral questions.", "url": "https://brownpoliticalreview.org/defending-civil-liberties/"}, {"phrase": "the reward for speaking up is getting more responsibility", "context": "Legal Director on how internal leadership is earned.", "url": "https://brownpoliticalreview.org/defending-civil-liberties/"}, {"phrase": "I want to start by emphasizing that the ACLU remained neutral on Prop 50.", "context": "Legal Director, December 2025.", "url": "https://brownpoliticalreview.org/defending-civil-liberties/"}, {"phrase": "firewall for freedom", "context": "Framework post, December 2024: state reforms as protection against federal policy. ACLU California Action uses the same phrase in November 2024.", "url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve"}, {"phrase": "be nimble in response to policies of the Trump Administration", "context": "Framework post, December 2024.", "url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve"}, {"phrase": "We have our work cut out for us.", "context": "Closing line of the framework post.", "url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve"}, {"phrase": "The first year of Trump 2.0 was perhaps the busiest in our 90-plus year history.", "context": "2025 annual report page. Comparison data not seen.", "url": "https://www.aclunorcal.org/annualreport/"}, {"phrase": "Thank you for being our partner in the fight for justice!", "context": "2025 annual report page, addressed to supporters.", "url": "https://www.aclunorcal.org/annualreport/"}, {"phrase": "knowing democracy is on the line", "context": "2025 annual report page.", "url": "https://www.aclunorcal.org/annualreport/"}, {"phrase": "takes you through a year on the front lines of the fight to defend America's democracy", "context": "Introduction to the 2025 year-in-review video.", "url": "https://www.aclunorcal.org/2025-in-review/"}, {"phrase": "We are the resistance. Join us.", "context": "Recruiting page, undated, listing 2027 internships.", "url": "https://job-boards.greenhouse.io/aclunc/jobs/8463191002"}, {"phrase": "Our mission is to ensure that Constitutional rights don't just exist on paper, but are protected in practice.", "context": "Same recruiting page.", "url": "https://job-boards.greenhouse.io/aclunc/jobs/8463191002"}, {"phrase": "Yes, gifts to the ACLU are shared between a donor's home office and the national ACLU!", "context": "Donor FAQ. No formula given in the text read.", "url": "https://www.aclunorcal.org/donate/frequently-asked-questions"}, {"phrase": "Don't give Trump any excuse to escalate the use of force against civilians.", "context": "Press release, October 2025.", "url": "https://www.aclunorcal.org/press-releases/aclu-norcal-condemns-escalating-federal-force-bay-area-cities-advises-residents-know-their/"}, {"phrase": "voting rights was not high on our agenda", "context": "Executive Director, 2022, on the organization as of 2009.", "url": "https://news.berkeley.edu/2022/07/01/berkeley-talks-transcript-voter-suppression/"}, {"phrase": "by filing with the NLRB, we are holding them accountable to the ACLU's values", "context": "Staff attorney in a union release, May 2020, referring to management.", "url": "https://ifpte20.org/aclu-filed-union-recognition/"}, {"phrase": "they are actively working to push out long time staff in the legal department", "context": "Anonymous tipster in Above the Law, October 2024. An unverified allegation.", "url": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/"}], "espoused_values": ["Rights in practice, not on paper (recruiting page).", "Freedom, equality and justice as stated in the Constitution, with a recognition that they are unequally applied because of 'historic and systemic racism' (about page).", "Non-partisanship: 'Democrats and Republicans, people of every party and no party' (2020 interview); 'non-partisan' (about page).", "Defending rights 'even when the cause is unpopular' (about page).", "Due process and dignity for every person (2023 podcast).", "Community power: 'a united and determined community' (2025 annual report page).", "Staying the course: 'enduring guardian' (about page); 'stands ready, as it has throughout its history' (January 2025)."], "operating_values": [{"value": "Law is the senior function.", "evidence": "Five of the seven best-paid people on the FY25 990s hold legal titles: two Legal-Policy Directors, the General Counsel and two Senior Staff Attorneys. A Legal-Policy Director ($413,453) out-earns the Executive Director ($369,484). The Legal Director says the institution operates 'in a legal capacity'. The pay reading is my inference; one year's total may contain one-off items, which were not read.", "basis": "inference", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/940279770", "title": "ProPublica: ACLU Foundation of Northern California"}, {"url": "https://brownpoliticalreview.org/defending-civil-liberties/", "title": "Brown Political Review interview"}]}, {"value": "Lawyer autonomy inside a board-set frame.", "evidence": "The Legal Director describes two axes: a four-year framework set with the board, and attorney proposals with 'a lot of autonomy'. This is one leader's description. It was not tested against any case-selection record.", "basis": "evidence", "sources": [{"url": "https://brownpoliticalreview.org/defending-civil-liberties/", "title": "Brown Political Review interview"}]}, {"value": "Institutional matters stay private.", "evidence": "The organization did not comment to Above the Law in 2024. No statement on restructuring was found on its site. The December 2024 strategy post omits it. Senior departures and the chair change have no announcements that were found. The site's own 990 list stops at FY22, though the FY25 audit is posted.", "basis": "inference", "sources": [{"url": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "title": "Above the Law"}, {"url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "title": "Forging Ahead"}, {"url": "https://www.charitynavigator.org/ein/940279770", "title": "Charity Navigator"}]}, {"value": "Management keeps its prerogatives first, then bargains.", "evidence": "In 2020 management declined the union's one-week demand for voluntary recognition, and staff filed with the NLRB (union-side account). A collective bargaining agreement with Local 20 was fully executed May 15, 2024 (search result). Its text was unreadable, and whether it is the first contract is not established.", "basis": "evidence", "sources": [{"url": "https://ifpte20.org/aclu-filed-union-recognition/", "title": "Local 20 release"}, {"url": "https://ifpte20.org/wp-content/uploads/2024/07/FINAL-ACLU-NorCal-IFPTE-Collective-Bargaining-Agreement-FULLY-EXECUTED-05.15.24-1.pdf", "title": "Collective Bargaining Agreement"}]}, {"value": "Federation solidarity with real money.", "evidence": "The FAQ confirms sharing with national. The FY22 annual report documents a $3M allocation to national for voting-rights work. Candid data via InfluenceWatch shows about $2.1M-$2.6M a year to ACLU California Action (scan; Schedule I not read).", "basis": "evidence", "sources": [{"url": "https://www.aclunorcal.org/donate/frequently-asked-questions", "title": "Donor FAQ"}, {"url": "https://www.influencewatch.org/non-profit/aclu-of-northern-california/", "title": "InfluenceWatch"}]}, {"value": "Willingness to oppose its own political neighbors, with limits.", "evidence": "The July 2024 letter promotes challenging the Biden-Harris administration in court over the asylum ban, a national ACLU suit. The organization also opposed Prop 36 and San Francisco's Prop F. Yet it stayed neutral on Prop 50 despite generally opposing partisan gerrymandering. The pattern of limits is my reading.", "basis": "inference", "sources": [{"url": "https://www.aclunorcal.org/blog/gearing-november-letter-executive-director-abdi-soltani", "title": "Gearing up for November"}, {"url": "https://brownpoliticalreview.org/defending-civil-liberties/", "title": "Brown Political Review interview"}]}, {"value": "Mass membership as an asset to build.", "evidence": "The annual report claims over 120,000 members, up 20%. The Executive Director hosts a 2026 member tour with free tickets, and a new podcast launched in October 2026. Union program revenue rose from $3.49M to $5.66M (scan). The membership count is self-reported.", "basis": "evidence", "sources": [{"url": "https://www.aclunorcal.org/tour/", "title": "2026 tour"}, {"url": "https://www.aclunorcal.org/podcast/make-the-case-episode-1-voting-rights-the-myth-of-voter-fraud/", "title": "MAKE the CASE"}, {"url": "https://www.aclunorcal.org/app/uploads/2026/06/2025-ACLU-NorCal-annual-report.pdf", "title": "2025 annual report (snippet)"}, {"url": "https://projects.propublica.org/nonprofits/organizations/942151925", "title": "ProPublica: ACLU of Northern California"}]}], "money_stance": {"summary": "Relational in tone and quiet on specifics. Supporters are 'partners', 'members' and 'friends', and the fundraising is institutional and professional. Readable material shows neither embarrassment nor entitlement, and no crisis-of-scarcity language about the organization's own finances. Scarcity appears only as a legal case screen: 'Is this worth our resources?' The national split is announced cheerfully, with no formula. The corporate page offers 'immediate impact' and states no acceptance policy. A mid-2024 Executive Director email (date inferred) pitches membership as the way to get a print newsletter, not with urgency or a match. I found no public discussion of budget, deficit, reserves or the FY24 shortfall in readable leadership statements. The annual reports' financial pages were mostly unreadable, so this is limited to the text I could read.", "basis": "inference", "confidence": 0.55, "sources": [{"url": "https://www.aclunorcal.org/annualreport/", "title": "2025 Annual Report page"}, {"url": "https://www.aclunorcal.org/donate/frequently-asked-questions", "title": "Donor FAQ"}, {"url": "https://www.aclunorcal.org/?p=29969", "title": "Corporate Giving"}, {"url": "https://politicalemails.org/messages/1500879/html_body", "title": "Executive Director email (undated)"}, {"url": "https://brownpoliticalreview.org/defending-civil-liberties/", "title": "Brown Political Review interview"}]}, "donor_stance": {"summary": "Donors are treated as participants in a collective fight, not as advisers or investors. The material read makes no offer of metrics, donor reporting or a say in strategy. Strategy is described as set by staff and boards. Members hold actual governance power, since they elect Union directors, and the Union designates the Foundation board (scan). A deductible-only donor has no comparable formal voice (inference). A search result for a giving-officer posting shows $10K+ and $100K+ portfolios and planned-gift work, so high-touch cultivation exists. The posting itself could not be opened. Expect access to leaders, including free tour events, rather than conditions. Expect to ask for financial specifics in writing.", "basis": "inference", "confidence": 0.5, "sources": [{"url": "https://www.aclunorcal.org/tour/", "title": "2026 tour"}, {"url": "https://www.theladders.com/job/individual-giving-officer-aclunc-san-francisco-ca_86194601", "title": "Individual Giving Officer (search result only)"}, {"url": "https://pdf.guidestar.org/PDF_Images/2024/942/151/2024-942151925-202530369349301138-.pdf", "title": "Union Form 990, FYE 3/2024 (snippet, from the scan)"}, {"url": "https://brownpoliticalreview.org/defending-civil-liberties/", "title": "Brown Political Review interview"}]}, "risk_and_growth": {"summary": "High appetite for legal and political risk; low appetite for institutional exposure. It sues the federal government, local governments and private surveillance vendors, and frames this as confrontation. On institutional matters it is cautious: no comment on layoffs, no public account of them, and neutrality on Prop 50. Growth is opportunistic and tied to the threat cycle. FY24 ended with a -57% margin on the 990 basis, and a restructuring was reported in October 2024. FY25 then showed +9.27%, with contributions of $20.2M and members up 20%. The leadership team appears to have cut costs after a deficit rather than ride it out on its $49.3M of assets, but the liquidity behind that figure was not read. Whether a cut was the right call cannot be judged from outside. Recent expansion is in voice, through a podcast and a tour. I found no statement of headcount or budget growth targets.", "basis": "inference", "confidence": 0.6, "sources": [{"url": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "title": "Above the Law"}, {"url": "https://projects.propublica.org/nonprofits/organizations/940279770", "title": "ProPublica: ACLU Foundation of Northern California"}, {"url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "title": "Forging Ahead"}, {"url": "https://www.aclunorcal.org/tour/", "title": "2026 tour"}]}, "theory_of_change": {"in_their_words": "\"Our mission is to ensure that Constitutional rights don't just exist on paper, but are protected in practice.\" \"We have to engage in the political process to protect and to advance civil liberties and civil rights.\" \"we cannot rely on the courts to be the final bulwark.\" \"It took a lot of work to bend the Constitution, essentially, back to its purpose as we understand it.\" Current applied form: challenge federal policy and advance state reforms as a \"firewall for freedom.\"", "theory_of_power": "My reading: government is the main source of threat, and it yields only when constrained from several directions. These are court orders, state and local law as a counterweight to federal power, ballots, and visible public pressure. The organization's own leverage is legal standing, professional legal skill, access to officials ('use that access') and a mass membership. As federal courts narrow, it shifts toward state constitutions and state legislatures. This is an institutional, expert-led model with a public base; people affected appear mainly as plaintiffs and as 'ordinary people' whose courage 'fueled' the work. Readable material does not show affected communities deciding priorities, though boards are member-elected and there is an organizing department. Whether power shifts durably after a ruling is not measured in anything I read.", "basis": "inference", "sources": [{"url": "https://pastforward.org/blogs/public-podcasting/abdi-soltani", "title": "Past Forward"}, {"url": "https://job-boards.greenhouse.io/aclunc/jobs/8463191002", "title": "Recruiting page"}, {"url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "title": "Forging Ahead"}, {"url": "https://news.berkeley.edu/2022/07/01/berkeley-talks-transcript-voter-suppression/", "title": "Berkeley Talks"}, {"url": "https://www.aclunorcal.org/2025-in-review/", "title": "2025 in Review"}]}, "metaphors": [{"metaphor": "War and the front line", "example": "'a year on the front lines of the fight'; 'an onslaught of attacks'; 'partner in the fight'.", "reveals": "Urgency, solidarity and a clear opponent. It motivates members and donors.", "hides": "Trade-offs, cost, long-term effects on people and what a win leaves unresolved. It also makes questions about internal management seem off-topic.", "url": "https://www.aclunorcal.org/2025-in-review/"}, {"metaphor": "Firewall", "example": "'firewall for freedom'.", "reveals": "A distinct California strategy: containment of a federal threat through state law.", "hides": "California's own conduct as a rights problem, which the organization also litigates. The firewall image casts the state as protector, and it overlaps with a local record of suits against counties and cities.", "url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve"}, {"metaphor": "Guardian and bulwark", "example": "'enduring guardian of justice'; courts as not the 'final bulwark'.", "reveals": "Continuity since 1934 and a defensive self-image.", "hides": "The active, chosen nature of priorities, and that a guardian is not chosen by those it guards. Also the affirmative policy work the organization does.", "url": "https://www.aclunorcal.org/about"}, {"metaphor": "Resistance", "example": "'We are the resistance. Join us.'", "reveals": "The recruiting appeal and the identification of the organization with a political moment.", "hides": "The non-partisan claim on the same page, and the question of who the ACLU would be under a different president.", "url": "https://job-boards.greenhouse.io/aclunc/jobs/8463191002"}, {"metaphor": "Resources as a stream", "example": "'funnel all of our resources'; 'Is this worth our resources?'", "reveals": "A lawyer's triage discipline.", "hides": "What gets cut when triage happens. The only public hint of that comes from anonymous sources.", "url": "https://brownpoliticalreview.org/defending-civil-liberties/"}, {"metaphor": "Bending the Constitution", "example": "'bend the Constitution, essentially, back to its purpose as we understand it'.", "reveals": "A candid view that constitutional meaning is contested and made through work and struggle.", "hides": "Little; it openly concedes 'as we understand it'. It sits awkwardly beside a guardian image that implies merely protecting a fixed thing.", "url": "https://pastforward.org/blogs/public-podcasting/abdi-soltani"}], "figure_and_ground": {"always_in_frame": ["The federal government and, since 2024, Trump by name.", "The Constitution and rights, framed as due process and equal protection.", "Courts, rulings and filings as proof of action.", "The 1934 founding and a 90-plus-year lineage.", "'Ordinary people', members and a collective 'we' stepping up.", "The present moment as exceptional ('hour of need', 'democracy is on the line')."], "never_mentioned": ["The October 2024 restructuring, the layoffs or any program ended: no mention in any readable organization statement. This is the most notable absence.", "The FY24 deficit, or any budget, reserve or payroll information, in leadership statements read.", "The union and the collective bargaining agreement, including on the recruiting page read.", "The national sharing formula. Sharing is mentioned, the amount is not.", "Measured effects on people after a ruling. No outcome evaluation was found.", "Failures of the organization's own making. The closest is the 2022 admission that voting rights was 'not high on our agenda' in 2009.", "Succession or any leadership transition.", "In-kind legal services of $3.9M-$6.8M a year as part of the model, in readable leadership statements. The annual report financial pages do report them.", "Competing or overlapping groups. Partners are mentioned generally, and no one is named as a rival.", "Limit: 2024 and 2025 annual report PDFs and the spring 2025 newsletter were unreadable, so some of these may appear there."]}, "contradictions": [{"said": "December 13, 2024: the Executive Director announces the 2025-2028 framework after a 'year-long process', says it will 'mobilize the talents of our staff', and promises to 'double down' and expand. It lists no cuts.", "done": "Above the Law reported in October 2024, from anonymous insiders, that a restructuring would eliminate long-held program areas and lay off attorneys, with a board vote expected November 14. The post does not mention any of this. The final decision is unconfirmed.", "significance": "The main public account of where the organization is going leaves out what it stopped. A donor cannot tell from public material what was traded away. Ask for the list.", "basis": "inference", "sources": [{"url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "title": "Forging Ahead"}, {"url": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "title": "Above the Law"}]}, {"said": "The Executive Director dates the organization's founding to San Francisco in 1934, amid violence against striking dockworkers. The institution's identity is built on protecting people who organize.", "done": "In 2020 management declined voluntary recognition of its own staff's union, and staff went to the NLRB. A staff attorney said this held management 'accountable to the ACLU's values'. The account is union-side, and declining voluntary recognition is lawful. A contract followed, executed May 2024.", "significance": "This is a real gap between story and first response to a workplace claim, though it was later resolved through the legal process. It is six years old, and the leader in question is still in the post.", "basis": "inference", "sources": [{"url": "https://news.berkeley.edu/2022/07/01/berkeley-talks-transcript-voter-suppression/", "title": "Berkeley Talks"}, {"url": "https://ifpte20.org/aclu-filed-union-recognition/", "title": "Local 20 release"}, {"url": "https://ifpte20.org/wp-content/uploads/2024/07/FINAL-ACLU-NorCal-IFPTE-Collective-Bargaining-Agreement-FULLY-EXECUTED-05.15.24-1.pdf", "title": "Collective Bargaining Agreement"}]}, {"said": "'non-partisan' (about page and recruiting page). 'We will go to court in blue or red states' (2020). It will 'fight both Democratic or Republican efforts' harming voting rights (2022).", "done": "The same recruiting page says 'We are the resistance.' The report language is 'Trump 2.0'. On Prop 50, a Democratic-backed redistricting measure, the ACLU stayed neutral despite generally opposing partisan gerrymandering. Counter-evidence is real: the July 2024 letter promotes suing the Biden-Harris administration, and the organization has opposed Democratic-leaning local measures. An unnamed-speaker reading: 'ACLU' in the Prop 50 quote may include entities beyond NorCal.", "significance": "The non-partisanship is legally accurate and has some behavioral backing, but the public voice has moved. Donors valuing the older ACLU identity should test this directly. Neutrality is not support, so this is a tension, not a breach.", "basis": "inference", "sources": [{"url": "https://job-boards.greenhouse.io/aclunc/jobs/8463191002", "title": "Recruiting page"}, {"url": "https://brownpoliticalreview.org/defending-civil-liberties/", "title": "Brown Political Review interview"}, {"url": "https://news.berkeley.edu/2022/07/01/berkeley-talks-transcript-voter-suppression/", "title": "Berkeley Talks"}, {"url": "https://www.montereycountynow.com/people/face_to_face/abdi-soltani/article_79c7304a-3d70-11ea-871b-9ba6ec18fc01.html", "title": "Monterey County Weekly"}, {"url": "https://www.aclunorcal.org/blog/gearing-november-letter-executive-director-abdi-soltani", "title"
