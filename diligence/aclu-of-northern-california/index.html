proposal-att-and-verizon"}, {"passage": "So here I am, an ACLU director, and here I am, an Iranian-American, and those two merged right into one thing.", "date": "2017-11-04", "kind": "emotionally_charged", "reading": "Evidence: a rare first-person moment where the job and his own stake meet. He raised it publicly while describing the role. I read nothing further into it.", "url": "https://www.truthdig.com/?p=138870"}, {"passage": "we cannot get distracted by the mayhem", "date": "2017-11-04", "kind": "normative", "reading": "Inference: a preference for discipline over reaction. His later Prop F post shows the same focus on mechanics.", "url": "https://www.truthdig.com/?p=138870"}, {"passage": "How many more George Floyds can we watch die before us?", "date": "2020-06-08", "kind": "emotionally_charged", "reading": "Evidence: the one place his signed writing turns to open anguish. It is co-authored, so the voice is shared.", "url": "https://www.thenation.com/article/society/protest-california-aclu/"}, {"passage": "We will never support any effort to keep the predatory bail industry in business", "date": "2018-11-20", "kind": "normative", "reading": "Inference: he uses an absolute statement to defend a nuanced position under attack.", "url": "https://www.aclunorcal.org/news/aclu-northern-california-statement-referendum-repeal-bail-reform-legislation"}, {"passage": "flagrant abuse of power", "date": "2025-10-22", "kind": "emotionally_charged", "reading": "Evidence: his sharpest recent language is aimed at the President, not at critics of the organization.", "url": "https://www.aclunorcal.org/press-releases/aclu-norcal-condemns-escalating-federal-force-bay-area-cities-advises-residents-know-their/"}, {"passage": "No reason given. No vote by the board. Just removal.", "date": "2026-10-26", "kind": "normative", "reading": "Inference: he cares about process and reasons when power removes people from posts. A local measure gets the same intensity as federal action.", "url": "https://www.aclunorcal.org/news/why-aclu-norcal-opposes-proposition-f-on-the-san-francisco-ballot/"}], "contradictions": [{"said": "2013: 'It's time for AT&T and Verizon to tell the public what is happening.' His post argues that transparency rebuilds trust.", "did_or_showed": "2024: the organization gave Above the Law no comment on reported layoffs and program cuts. No public account by him of what was cut was found in the two years since.", "significance": "The standard differs because a nonprofit's staffing is not customer data, and employment matters limit what can be said. But donors entrust money based on direction, and they cannot see what changed. Ask for it.", "basis": "inference", "sources": [{"url": "https://www.aclu.org/news/national-security/aclu-northern-california-files-shareholder-proposal-att-and-verizon", "title": "Shareholder proposal post"}, {"url": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "title": "Above the Law"}]}, {"said": "July 26, 2024: 'there is nothing about this year that is business as usual.' December 13, 2024: 'mobilize the talents of our staff, boards, and volunteers' and 'double down.'", "did_or_showed": "FY24, closed March 2024, showed a -57% margin on the 990 basis. Soltani announced a 'major change' on Oct 18, 2024, according to Above the Law. Neither letter read mentions the deficit, and the December post does not mention restructuring in the excerpts read.", "significance": "The letters were written in the weeks around the hardest internal decision on record, and they speak only of expansion in priority. Full text of the December post was not available to me, so verify its silence on the live page.", "basis": "inference", "sources": [{"url": "https://www.aclunorcal.org/news/gearing-november-letter-executive-director-abdi-soltani/", "title": "Gearing up for November"}, {"url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "title": "Forging Ahead"}, {"url": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "title": "Above the Law"}, {"url": "https://projects.propublica.org/nonprofits/organizations/940279770", "title": "ProPublica"}]}, {"said": "2017, on why he joined the ACLU as an organizer: 'I liked the idea that they should have access to legal power.' He dates the affiliate's founding to a 1934 longshoremen's strike.", "did_or_showed": "May 2020: union release says he told staff management would not grant recognition. No reason or management statement found. Other parts of the ACLU, including Southern California and national, recognized unions voluntarily, per search results. A contract was executed in May 2024.", "significance": "He made a lawful but visible choice, and peers chose otherwise. His reason is unknown, and only the union side is on record. It is six years old. Worth a direct question: what he would do differently.", "basis": "inference", "sources": [{"url": "https://www.truthdig.com/?p=138870", "title": "Truthdig"}, {"url": "https://www.ifpte.org/news/staff-at-aclu-of-northern-california-file-for-union-recognition-with-nlrb", "title": "IFPTE release"}, {"url": "https://portside.org/2021-05-12/aclu-staff-union-wins-voluntary-recognition", "title": "ACLU Staff Union Wins Voluntary Recognition (search result)"}, {"url": "https://ifpte20.org/wp-content/uploads/2024/07/FINAL-ACLU-NorCal-IFPTE-Collective-Bargaining-Agreement-FULLY-EXECUTED-05.15.24-1.pdf", "title": "Collective Bargaining Agreement"}]}, {"said": "He uses money as an argument against governments: 287(g) is 'fiscally irresponsible' (2012), and he opposed 'additional millions of dollars to the police department' (2022).", "did_or_showed": "No figure on his own organization's budget, deficit, reserves or national share appears in any item of his read. Numbers do appear in 990s and audits.", "significance": "He is numerate when judging others and silent on his own institution in public. This may partly reflect the medium, since his annual-report letters could not be read in full.", "basis": "inference", "sources": [{"url": "https://www.aclu.org/news/immigrants-rights/petitions-sign-letter-sent-administration", "title": "Petitions post"}, {"url": "https://www.aclu.org/news/criminal-law-reform/our-vision-to-achieve-true-public-safety", "title": "Our Vision"}]}, {"said": "November 2018: the organization opposed the bail-industry referendum: 'We will never support any effort to keep the predatory bail industry in business.'", "did_or_showed": "In 2020 the ACLU was reported neutral on Prop 25, that same referendum. Voters rejected the measure, which kept cash bail in place.", "significance": "Neutral was a defensible middle, since it opposed SB 10's detention presumption. But the result left in place the system he condemned, and I found no account from him of that result. The neutrality line comes from a search snippet.", "basis": "inference", "sources": [{"url": "https://www.aclunorcal.org/news/aclu-northern-california-statement-referendum-repeal-bail-reform-legislation", "title": "Referendum statement"}, {"url": "https://ivn.us/california-elections-2020-proposition-25-replacing-money-bail/", "title": "IVN on Prop 25 (search result)"}, {"url": "https://abc7news.com/politics/prop-25-bail-reform-measure-is-trailing-/7587637/", "title": "ABC7 on Prop 25 result"}]}], "eras": [{"period": "2009-2016", "label": "Organizer building out", "voice": "Practical and personal. Explains mechanisms, reports counts, tells stories of named people, and tries new tactics like shareholder proposals. Thin sample.", "specificity": "same", "candor": "same", "example_quote": "We couldn't leave Brandon's call for help unanswered.", "sources": [{"url": "https://www.aclu.org/news/immigrants-rights/fighting-anti-immigrant-lawsfor-children-and", "title": "Fighting Anti-Immigrant Laws"}, {"url": "https://www.aclu.org/news/immigrants-rights/petitions-sign-letter-sent-administration", "title": "Petitions post"}]}, {"period": "2017-2019", "label": "First Trump term and the bail break", "voice": "More institutional and more values language at the federal level, yet willing to break with allies in Sacramento on the merits. Joint signatures on the hardest calls.", "specificity": "same", "candor": "same", "example_quote": "We are better than this state-sanctioned discrimination.", "sources": [{"url": "https://www.aclunorcal.org/press-releases/executive-director-abdi-soltani-condemns-trump-s-discriminatory-immigration-ban/", "title": "Immigration ban statement"}, {"url": "https://www.aclusocal.org/press-releases/aclu-california-changes-position-oppose-bail-reform-legislation/", "title": "SB 10 reversal"}]}, {"period": "2020-2023", "label": "Reckoning and teaching", "voice": "Most reflective period. Long-form talks and history, open anguish in 2020, and the only admissions on record. Also the union refusal, with no public word from him.", "specificity": "same", "candor": "more", "example_quote": "voting rights was not high on our agenda", "sources": [{"url": "https://news.berkeley.edu/2022/07/01/berkeley-talks-transcript-voter-suppression/", "title": "Berkeley Talks"}, {"url": "https://sfstandard.com/2022/04/15/aclu-of-northern-california-apologizes-for-redistricting-letter-sent-on-its-behalf/", "title": "SF Standard"}]}, {"period": "2024-2026", "label": "Crisis voice, quiet institution", "voice": "More combative and more frequent, led by threat framing. Still specific on law, as in Prop F. No account of the institution itself. In-person presence is high.", "specificity": "same", "candor": "less", "example_quote": "We are in unprecedented times.", "sources": [{"url": "https://www.aclunorcal.org/news/gearing-november-letter-executive-director-abdi-soltani/", "title": "Gearing up for November"}, {"url": "https://www.aclunorcal.org/press-releases/aclu-norcal-condemns-escalating-federal-force-bay-area-cities-advises-residents-know-their/", "title": "Press release, Oct 2025"}, {"url": "https://www.aclunorcal.org/news/why-aclu-norcal-opposes-proposition-f-on-the-san-francisco-ballot/", "title": "Prop F"}]}], "five_whys": [{"observation": "His signed letters around the 2024 restructuring speak of priorities and resolve and do not mention cuts.", "chain": ["Why no cuts? His public letters are about the external moment: 'We are in unprecedented times.' (2024)", "Why external? His theory is that rights need constant public defense: 'not rely on the courts alone.' (2020)", "Why does that leave out the institution? Readers are cast as allies with a job: 'Organize, speak out, and stand with us.' (2025)", "Why not tell allies the cost? Staff appear as a resource to deploy: 'mobilize the talents of our staff.' (2024). Inference: in this frame, internal cost has no natural place. Employment-law caution may also apply (speculation).", "Why does he account publicly at all? The one clear case was to a public body that had been told something wrong: 'on behalf of the organization.' (2022)"], "insight": "Inference: he accepts public accountability when the organization's words mislead an outside body. He has not shown it for internal decisions. A donor must ask, and should expect to ask in writing."}, {"observation": "He proves the organization by its history and resolve, rather than by measured results.", "chain": ["Why history? It supplies authority: 'Continuously since 1934.' (2022)", "Why a hero's story? It defines the standard: 'he would not back down.' (2023)", "Why resolve and not outcome? He does not think courts can guarantee rights: 'cannot rely on the courts to be the final bulwark.' (2023)", "Why not then measure wider change? No such measures appear in what I read. Win messages report the vote: 'Prop. 20 tried to erode criminal justice reforms—and failed.' (2020)", "Why might that persist? In a threat moment, steadfastness is what supporters reward: 'We will never back down.' (2026, unsigned organizational text; speculation about the reward)"], "insight": "Inference: the implicit success test is holding the line. That is honest for civil-liberties work, where outcomes are slow and shared. It also makes it hard to know when a line of work should stop."}], "needs": [{"need": "Trust the institution across political cycles", "level": "common", "explicit": false, "evidence": "Repeated use of 1934 and 'Continuously since 1934'.", "from_whom": "Donors and the public"}, {"need": "Stand alongside the organization publicly", "level": "common", "explicit": true, "evidence": "'Organize, speak out, and stand with us' (2025).", "from_whom": "Members and the public"}, {"need": "Fund flexibly, without a say in tactics", "level": "context", "explicit": false, "evidence": "Thanks for support, plus no offer of metrics or donor input: 'Your support—financial, moral, and civic' (2019 report snippet).", "from_whom": "Donors"}, {"need": "Ratify a multi-year framework", "level": "context", "explicit": true, "evidence": "'the boards of the ACLU of Northern California approved our 2025-2028 Strategic Framework' (2024).", "from_whom": "Board"}, {"need": "Back hard, unpopular turns against allies", "level": "activity", "explicit": false, "evidence": "SB 10 reversal and rebuttal (2018); dissent from San Francisco's public-safety shift (2022).", "from_whom": "Board and donors"}, {"need": "Exercise authority on case and legal judgment", "level": "activity", "explicit": false, "evidence": "He calls himself 'a generalist' (2022). The Legal Director describes attorney autonomy (2025).", "from_whom": "Legal staff"}, {"need": "Act on rights where courts will not", "level": "activity", "explicit": true, "evidence": "'to be the guardians of our constitutional rights' (2022).", "from_whom": "Voters, officials, artists"}, {"need": "Refrain from pressing publicly on internal decisions", "level": "qualifier", "explicit": false, "evidence": "Inference from no comment in 2024 and no public account since.", "from_whom": "Staff, union, press, donors"}, {"need": "Accept a shared-credit story", "level": "qualifier", "explicit": false, "evidence": "Credit goes to clients, partners and 'ordinary people'; results are rarely isolated to the affiliate.", "from_whom": "Donors"}], "empathy_gap": {"rating": "drifting", "rationale": "Toward affected communities, he shows up: a named teen and town in 2012, in person at Humboldt in 2024, every tour stop in 2026. In writing, named people have thinned, and recent items lean on categories such as 'immigrants, people of color, protesters, and other targeted groups.' Sample limits apply: the videos, tour remarks and 2025-26 newsletters could not be read. Toward his own staff, the record has no territory at all. Not disconnected, since Prop F and Humboldt show real grip on specifics.", "basis": "inference"}, "profile": {"self_concept": {"summary": "He casts himself as an organizer who became a steward, and as a teacher of constitutional history. He calls himself a generalist and leaves legal depth to attorneys. The shift over time is from organizer with a work plan toward institutional voice of a long fight. He does not cast himself as the hero: Besig holds that place.", "quotes": [{"quote": "I'm a generalist at the ACLU.", "date": "2022-07-01", "context": "Berkeley talk on voting rights", "url": "https://news.berkeley.edu/2022/07/01/berkeley-talks-transcript-voter-suppression/"}, {"quote": "My cover letter when I applied for the executive director position was kind of like a work plan of some priorities.", "date": "2017-11-04", "context": "Truthdig interview", "url": "https://www.truthdig.com/?p=138870"}, {"quote": "He was resolute. He was a hard-headed man, and he would not back down.", "date": "2023-07-06", "context": "On Ernest Besig, the affiliate's founder", "url": "https://pastforward.org/blogs/public-podcasting/abdi-soltani"}], "basis": "inference", "confidence": 0.65}, "decision_style": {"summary": "He gives no first-person account of a hard internal call in what I read. Public evidence shows long-cycle priorities, formal board approval and joint action with peers. On a live bill he moved quickly and publicly once the text changed (SB 10, Aug 2018). He admits limits in public. Whom he consults on staffing and budget choices: no evidence found.", "quotes": [{"quote": "Following a year-long process", "date": "2024-12-13", "context": "Framework announcement", "url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve"}, {"quote": "SB 10 cannot promise a system with a substantial reduction in pretrial detention.", "date": "2018-08-20", "context": "Three directors reverse position after amendments", "url": "https://www.aclusocal.org/press-releases/aclu-california-changes-position-oppose-bail-reform-legislation/"}, {"quote": "I'm not on the firmest ground because I want to double-check", "date": "2022-07-01", "context": "Answering on the ACLU's online voting position", "url": "https://news.berkeley.edu/2022/07/01/berkeley-talks-transcript-voter-suppression/"}], "basis": "inference", "confidence": 0.5}, "risk_appetite": {"summary": "High for legal and political risk, including breaking with allies and suing presidents of either party. Inventive in tactics, as with the 2013 shareholder proposals. Financial and institutional risk is not discussed; his public words show no bet on the balance sheet. A search summary says the affiliate gave $250,000 to the voter ID opposition; that page was not opened and the giving entity is unknown. Avoids institutional exposure.", "quotes": [{"quote": "The ACLU holds presidents of any party accountable to the standards of our Constitution", "date": "2024-07-26", "context": "Letter promoting suit against the Biden-Harris asylum ban", "url": "https://www.aclunorcal.org/news/gearing-november-letter-executive-director-abdi-soltani/"}, {"quote": "We will still go to court regardless of who or which party appointed which judge.", "date": "2023-07-06", "context": "Podcast on litigation", "url": "https://pastforward.org/blogs/public-podcasting/abdi-soltani"}, {"quote": "Secret, unchecked surveillance is antithetical to democracy, and the government is going too far.", "date": "2013-11-20", "context": "Shareholder proposals to AT&T and Verizon", "url": "https://www.aclu.org/news/national-security/aclu-northern-california-files-shareholder-proposal-att-and-verizon"}], "basis": "inference", "confidence": 0.65}, "absorbing_loss": {"summary": "Pattern: states regret briefly, restates that the position was correct, turns to the next front. Neither margin nor self-review appears in the Prop 36 or SB 10 statements. This is not blame-shifting toward staff or partners. It is forward motion, with the lesson left unstated. Exception: the 2022 apology. Live test: the November 3, 2026 voter ID vote, which the spring 2026 newsletter calls the top election priority, per a snippet.", "quotes": [{"quote": "We are disappointed to see Senate Bill 10 signed into law.", "date": "2018-08-28", "context": "Joint statement after a legislative loss", "url": "https://www.aclusocal.org/press-releases/aclu-california-statement-governor-brown-signs-bail-reform-legislation-opposed-aclu/"}, {"quote": "will continue to advocate for smart and effective criminal justice reform", "date": "2024-11-06", "context": "Morning after Prop 36 passed", "url": "https://www.aclunorcal.org/press-releases/aclu-northern-california-statement-proposition-36/"}, {"quote": "even though the measure takes funding away from treatment", "date": "2024-12-13", "context": "Prop 36 five weeks later; still argued on the merits", "url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve"}], "basis": "evidence", "confidence": 0.7}, "criticism_and_dissent": {"summary": "Outside critics: answers when the claim is factual and the audience is official, directly in 2018 and with an apology in 2022. Inside dissent: no words of his found on the union drive or the alleged treatment of long-time legal staff. Absent rather than hostile in the record. The harshest language goes to government and industry, not to critics. Whether he is curious in private cannot be read from outside.", "quotes": [{"quote": "for the confusion we have caused, which I do here on behalf of the organization", "date": "2022-04-15", "context": "Apology to SF Elections Commission for a letter on chapter letterhead", "url": "https://sfstandard.com/2022/04/15/aclu-of-northern-california-apologizes-for-redistricting-letter-sent-on-its-behalf/"}, {"quote": "went further than findings or positions", "date": "2022-04-15", "context": "Same letter, on what went wrong", "url": "https://sfstandard.com/2022/04/15/aclu-of-northern-california-apologizes-for-redistricting-letter-sent-on-its-behalf/"}, {"quote": "will not tolerate the indefensible harm it creates", "date": "2018-11-20", "context": "Rebutting the claim that the ACLU sided with the bail industry", "url": "https://www.aclunorcal.org/news/aclu-northern-california-statement-referendum-repeal-bail-reform-legislation"}], "basis": "inference", "confidence": 0.6}, "under_pressure": {"summary": "Hardest period: Oct 18 to Dec 13, 2024, combining a reported restructuring, Trump's election and the Prop 36 loss. His public words were steady and forward-looking, and left the internal matter unaddressed. Comparison: August 2018, when he took a stand against allies quickly and on the merits, and defended it in November. Pressure from outside sharpens him. Pressure from inside quiets him, in public at least. Internal communications were not visible, so the private record may differ.", "quotes": [{"quote": "the boards of the ACLU of Northern California approved our 2025-2028 Strategic Framework", "date": "2024-12-13", "context": "Weeks after the reported Nov 14 board vote date", "url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve"}, {"quote": "We will challenge discriminatory policies and block efforts to dismantle constitutional protections.", "date": "2025-01-17", "context": "Before the second inauguration", "url": "https://www.aclunorcal.org/news/challenge-resist-and-defend/"}, {"quote": "The events at Humboldt are of greater concern", "date": "2024-04-29", "context": "Live protest statement distinguishing between campuses", "url": "https://www.aclunorcal.org/news/campus-protests-statement-executive-director-aclu-northern-california-abdi-soltani/"}], "basis": "inference", "confidence": 0.6}, "money_and_donors": {"summary": "Grateful, brief and non-specific. Donors appear as supporters and partners, not as decision-makers. Asks are low-pressure: a Donate Now link, or membership to get the print newsletter. No urgency language in the emails read, though only a few were read. No words found on the deficit, bequests, the national split, DAFs or the 20% member growth. Older report language calls the organization dependent on donations, grants, fees, bequests and dues, unattributed. Annual-letter text was largely unreadable, which limits this reading.", "quotes": [{"quote": "Your support—financial, moral, and civic—is what makes this work possible.", "date": "2019 report; exact date not established", "context": "Letter with board chair; search snippet", "url": "https://www.aclunorcal.org/app/uploads/2026/01/2019-Annual-Report.pdf"}, {"quote": "We are grateful to our members, donors, volunteers, and community partners", "date": "2024-07-26", "context": "Election letter; no figures", "url": "https://www.aclunorcal.org/news/gearing-november-letter-executive-director-abdi-soltani/"}], "basis": "inference", "confidence": 0.5}, "power_and_relationships": {"summary": "Board: appears as co-signer and approver. Staff: a general category, with colleagues credited as co-authors. National: joint bylines in practice; his only story of conflict with national is historic, and it favors the affiliate's founder. Coalition: signs jointly and shares credit. Government: comfortable working with officials and opposing them. His bio notes he co-chaired a marijuana commission with then-Lt. Gov. Newsom, and in 2025 the affiliate pressed Newsom on death-row commutations. His own power as an employer does not appear. Union side calls him the decision-maker in 2020.", "quotes": [{"quote": "felt that they could be more effective by lobbying behind the scenes", "date": "2023-07-06", "context": "On national board members in the 1940s, against Besig's stance", "url": "https://pastforward.org/blogs/public-podcasting/abdi-soltani"}, {"quote": "We call on our governor, attorney general, mayors, and other state and local officials", "date": "2025-01-17", "context": "Asks allies in office to act", "url": "https://www.aclunorcal.org/news/challenge-resist-and-defend/"}, {"quote": "the ACLU works with Democrats and Republicans", "date": "2020-01-23", "context": "Interview on voting rights", "url": "https://www.montereycountynow.com/people/face_to_face/abdi-soltani/article_79c7304a-3d70-11ea-871b-9ba6ec18fc01.html"}], "basis": "inference", "confidence": 0.55}, "time_horizon_and_growth": {"summary": "Genuinely long. He named a Central Valley priority on applying around 2009, and a Stanford page in 2026 still describes those 'long-term priorities.' Growth is geographic and in voice, not stated in dollars or staff. Four-year framework cycles line up with presidential terms. No headcount or budget goal found. Whether Central Valley work produced results was not measured here.", "quotes": [{"quote": "One was the importance of building a stronger presence for the ACLU in California's Central Valley.", "date": "2017-11-04", "context": "On his application work plan", "url": "https://www.truthdig.com/?p=138870"}, {"quote": "huge civil rights problems and very few legal resources", "date": "2017-11-04", "context": "Why the Central Valley", "url": "https://www.truthdig.com/?p=138870"}, {"quote": "please take action this year and every year", "date": "2022-07-01", "context": "Close of Berkeley talk", "url": "https://news.berkeley.edu/2022/07/01/berkeley-talks-transcript-voter-suppression/"}], "basis": "evidence", "confidence": 0.65}}, "candor_index": {"items_read": 27, "failures_named": 2, "embarrassing_numbers_named": 0, "admitted_mistakes": 1, "note": "Items with his own words, mostly excerpts; three are snippets only, and full letters were rarely available. So this is a floor, not a rate. Counted failures: the 2022 apology, and 'voting rights was not high on our agenda' (2022), which is mild. Admitted mistake: the 2022 apology only. Not counted: 'We had allowed our voting and election systems to atrophy,' because 'we' means Californians, and the 1940s national board history. Zero figures about his own institution's trouble."}, "strengths": [{"pattern": "Long-horizon follow-through", "evidence": "A Central Valley priority stated at application, a Fresno office per Truthdig's description, and the same priority still named in 2026.", "basis": "evidence", "sources": [{"url": "https://www.truthdig.com/?p=138870", "title": "Truthdig"}, {"url": "https://law.stanford.edu/?p=586508", "title": "Stanford event page"}]}, {"pattern": "Willing to break with allies on the merits", "evidence": "SB 10 reversal in 2018 and the suit promoted against the Biden-Harris asylum ban in 2024. He pressed Obama on 287(g) in 2012 and opposed San Francisco measures in 2022 and 2026.", "basis": "evidence", "sources": [{"url": "https://www.aclusocal.org/press-releases/aclu-california-changes-position-oppose-bail-reform-legislation/", "title": "SB 10 reversal"}, {"url": "https://www.aclunorcal.org/news/gearing-november-letter-executive-director-abdi-soltani/", "title": "Gearing up"}, {"url": "https://www.aclunorcal.org/news/why-aclu-norcal-opposes-proposition-f-on-the-san-francisco-ballot/", "title": "Prop F"}]}, {"pattern": "Owned an error quickly and specifically once", "evidence": "Seven days after the commission vote, he said the letter overreached, apologized for the organization, and named no one as at fault.", "basis": "evidence", "sources": [{"url": "https://sfstandard.com/2022/04/15/aclu-of-northern-california-apologizes-for-redistricting-letter-sent-on-its-behalf/", "title": "SF Standard"}]}, {"pattern": "Coalition and shared bylines", "evidence": "Joint work with fellow directors, national staff and his communications director. 'Ordinary people' are credited on the 2025 page, though that page is organizational.", "basis": "evidence", "sources": [{"url": "https://www.thenation.com/article/society/protest-california-aclu/", "title": "The Nation"}, {"url": "https://www.aclunorcal.org/2025-in-review/", "title": "2025 in Review"}]}, {"pattern": "Precise on mechanics when explaining law", "evidence": "Prop F post on who removes whom. Humboldt statement distinguishes facts by campus.", "basis": "evidence", "sources": [{"url": "https://www.aclunorcal.org/news/why-aclu-norcal-opposes-proposition-f-on-the-san-francisco-ballot/", "title": "Prop F"}, {"url": "https://www.aclunorcal.org/news/campus-protests-statement-executive-director-aclu-northern-california-abdi-soltani/", "title": "Campus protests"}]}], "warning_patterns": [{"pattern": "Silence on internal trouble", "evidence": "No words from him found on the FY24 deficit, restructuring, union drive or senior departures. One outlet's anonymous report is the only account of the restructuring.", "basis": "inference", "sources": [{"url": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "title": "Above the Law"}, {"url": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "title": "Forging Ahead"}]}, {"pattern": "Loss without visible learning", "evidence": "The Prop 36 and SB 10 statements restate the position. No post-mortem found on any lost measure. Searches were limited; annual letters were not readable.", "basis": "inference", "sources": [{"url": "https://www.aclunorcal.org/press-releases/aclu-northern-california-statement-proposition-36/", "title": "Prop 36 statement"}, {"url": "https://www.aclusocal.org/press-releases/aclu-california-statement-governor-brown-signs-bail-reform-legislation-opposed-aclu/", "title": "SB 10 signing statement"}]}, {"pattern": "Rising threat register", "evidence": "'unprecedented times' in 2024, 'flagrant abuse of power' in 2025. The language tracks real events, some confirmed by courts. Risk: funding and voice depend on the moment. His 2017 'mayhem' line shows he knows this risk, and is a useful comparison.", "basis": "inference", "sources": [{"url": "https://www.aclunorcal.org/news/gearing-november-letter-executive-director-abdi-soltani/", "title": "Gearing up"}, {"url": "https://www.aclunorcal.org/press-releases/aclu-norcal-condemns-escalating-federal-force-bay-area-cities-advises-residents-know-their/", "title": "Press release"}, {"url": "https://www.truthdig.com/?p=138870", "title": "Truthdig"}]}, {"pattern": "Public face concentrated in one long-tenured role", "evidence": "He hosts each 2026 briefing and was the first podcast guest, in year 17, with no successor signal found. This is a question, not a finding.", "basis": "inference", "sources": [{"url": "https://www.aclunorcal.org/tour/", "title": "Tour"}, {"url": "https://www.aclunorcal.org/press-releases/aclu-of-northern-california-takes-listeners-behind-the-scenes-in-fight-for-civil-rights-and-civil-liberties-with-new-podcast-make-the-case/", "title": "Podcast release"}]}, {"pattern": "Not supported: blame shifting, grandiosity, us-versus-them aimed at critics", "evidence": "No instance found. The 2022 apology blamed no individual. He casts Besig, not himself, as the hero. Sharp language goes to government and industry, though he did accuse the Prop F campaign of false statements, in a policy dispute.", "basis": "inference", "sources": [{"url": "https://sfstandard.com/2022/04/15/aclu-of-northern-california-apologizes-for-redistricting-letter-sent-on-its-behalf/", "title": "SF Standard"}, {"url": "https://pastforward.org/blogs/public-podcasting/abdi-soltani", "title": "Past Forward"}]}], "dependency_and_succession": {"identity_fusion": "moderate", "tenure_signals": "Executive Director for about 17 years. Active in the last week of the record: signed posts on Oct 26 and 28, 2026. No announced departure, and no statement about how long he will stay.", "successor_signals": "No evidence found. The Legal Director describes doing institutional management, but nothing suggests this is succession planning; treating it so would be speculation. Several senior posts have changed, per the scan.", "revenue_exposure": "Unknown. No evidence ties major gifts to him personally. The inference is that member and small-donor revenue follow brand and threat cycle, since FY25 growth came during the federal fight. Major-gift relationships may be more personal after 17 years, but this is speculation. Ask development how many top donors he personally manages, and whether bequests and DAF advisers have other contacts.", "basis": "inference", "confidence": 0.5}, "in_the_room": {"likely_pitch": "Expect history first: 1934, then the present threat, then a specific case or ballot fight, then a request to stand with the organization. Likely warm and explanatory, comfortable saying what he does not know. Credit will go to clients, attorneys and partners. Inference from the corpus.", "will_avoid": "Likely to avoid volunteering the restructuring detail, the FY24 gap, the national split, staff tension or a departure timeline. He has not been shown refusing such questions directly. He has simply not raised them in public.", "test_questions": ["In the 2024 restructuring, what did you stop doing, how many positions were affected, and what has the loss cost you? (Tests the silence pattern. A named list means the pattern is about public channels, not about candor.)", "What was the last campaign or program where you changed course because the evidence said it was not working, and who told you? (Tests whether loss produces learning, and whether dissent reaches him.)", "If you left in 24 months, who would run this, which donors would need new relationships, and what has the board done about it? Please also send the current share of my gift that would go to national. (Tests succession and money transparency together.)"]}, "reframe": "See Soltani as a patient steward who is forthright against outside power and quiet about his own house: trust his direction on principle, and get the institution's facts in writing.", "secondary": [{"name": "Shilpi Agarwal", "title": "Legal Director", "self_concept": "Describes a manager who still litigates: evaluates claims, oversees legal work, runs institutional matters. More direct than Soltani about how decisions and internal debate work.", "risk": "Describes top-down subject areas and bottom-up cases, with a screen on whether claims make sense and resources justify them. Willing to mention disagreement in public.", "money": "Treats resources as a constraint on case selection. No words on budget or fundraising found. The 'all of our resources' line should be set against Soltani's 'not courts alone' view; it was given to a student outlet.", "dependency": "Important to the deductible money, since the Foundation funds litigation. Tenure start not established. The scan suggests a possible recent handover in the legal leadership.", "quotes": [{"quote": "legal advocacy is where we have decided to funnel all of our resources", "date": "2025-12-13", "context": "Brown Political Review", "url": "https://brownpoliticalreview.org/defending-civil-liberties/"}, {"quote": "Our attorneys have a lot of autonomy to identify the big issues and specific cases we need to focus on.", "date": "2025-12-13", "context": "Brown Political Review", "url": "https://brownpoliticalreview.org/defending-civil-liberties/"}, {"quote": "it sometimes leads to difficult internal conversations", "date": "2025-12-13", "context": "On defining the organization's legal role", "url": "https://brownpoliticalreview.org/defending-civil-liberties/"}], "basis": "evidence"}, {"name": "Nancy Stuart", "title": "Board Chair, per the current board page; FY25 990s show Adam Bailey", "self_concept": "No evidence found. A search found no public words in this role.", "risk": "No evidence found.", "money": "No evidence found. The Foundation's board sets executive pay through its Personnel Committee, per an older Schedule O.", "dependency": "The board is the only formal check on the Executive Director and owns succession. A silent chair means the donor has no public read of that check. Ask to meet the chair and the treasurer, Anthony Wan. Cori Stell, Director of Development: also no public words found.", "quotes": [], "basis": "inference"}], "ethics_note": "Sources are public professional statements only. I excluded a family reference in the 2012 post, and anything on his health, family, relationships, finances or religion. The one personal element kept is a heritage statement he made in public while describing his role, in 2017, and nothing is inferred from it. The Above the Law claims are anonymous allegations from a single outlet and are labeled as such. Union claims are one-sided. Staff reviews and private social media were not used. No clinical or typological language is used. These readings describe patterns in a public record that is incomplete, not who he is. I gave no pronouns for others beyond neutral wording, because theirs were not stated in sources read.", "gaps": ["Annual-report letters and ACLU News letters from 2010 to 2026: PDFs came back unreadable, and I saw only snippets. Here most of any budget talk would live. The candor count is a floor. Saved copies need text extraction.", "Oct 18, 2024 announcement: not found. Vote outcome, layoff numbers and programs cut: no evidence found.", "Forging Ahead was read through excerpts and a summary. Its silence on restructuring should be confirmed on the live page.", "Video and audio not transcribed: 2025 review, 2026 tour remarks, podcast episode, Stanford talk, SPUR award video, Prop 39 video. The recent spoken voice is therefore under-read.", "His reason for declining voluntary recognition in 2020: no evidence found.", "Op-eds in the Chronicle, Sacramento Bee or CalMatters: searched, none found. This is not proof that none exist.", "Testimony: none found. Not searched in legislative records.", "Statements on the Marshall Krause death, Prop 50 and 2010 ballot losses: no evidence found.", "One aggregator lists Nicole Ozer, long-time technology director, as leaving to lead EFF from June 2026. This is unconfirmed, and no link to the restructuring is claimed.", "Prop 25 neutrality and the $250,000 voter ID gift rest on search summaries. Paying entity is unknown.", "November 3, 2026 vote on the voter ID measure comes four days after this writing. It is the next natural test of how he absorbs a result."], "probe_in_conversation": ["What did the restructuring end, and what would you tell a donor who funded one of those areas?", "Why did you decline voluntary recognition in 2020, and would you decide the same way today?", "How did you review the Prop 36 result? Can I see what changed afterward?", "What share of a major gift goes to national, and can it be exempted? Who holds CFO responsibility now?", "How do FY25 gains hold if the threat cycle fades? What would you cut first?", "What does success in the Central Valley look like after 17 years, and how do you know?", "What is the board's succession plan and timeline? Can the chair speak to it directly?", "Soltani and the Legal Director describe resources differently. How much does the deductible gift fund beyond the courtroom?"], "sources": [{"url": "https://www.aclunorcal.org/bios/abdi-soltani/", "title": "ACLU NorCal bio"}, {"url": "https://www.aclu.org/bios/abdi-soltani", "title": "ACLU author page"}, {"url": "https://www.aclu.org/news/civil-libe ttps://www.aclunorcal.org/news/challenge-resist-and-defend/", "title": "Challenge, Resist, and Defend"}, {"url": "https://www.aclunorcal.org/press-releases/aclu-norcal-condemns-escalating-federal-force-bay-area-cities-advises-residents-know-their/", "title": "Oct 2025 press release"}, {"url": "https://www.aclunorcal.org/app/uploads/2025/12/ACLU-News-Fall-2025-final-11-3-25-2-1.pdf", "title": "ACLU News Fall 2025 (snippet)"}, {"url": "https://www.aclunorcal.org/app/uploads/2026/04/ACLU-News-Spring-2026-FINAL-11-page-issue-website.pdf", "title": "ACLU News Spring 2026 (snippet)"}, {"url": "https://www.aclunorcal.org/news/one-down-three-to-go/", "title": "One Down, Three to Go"}, {"url": "https://www.aclunorcal.org/2025-in-review/", "title": "2025 in Review"}, {"url": "https://www.aclunorcal.org/annualreport/", "title": "2025 Annual Report page"}, {"url": "https://www.aclunorcal.org/tour/", "title": "Tour"}, {"url": "https://law.stanford.edu/?p=586508", "title": "Stanford event page"}, {"url": "https://www.aclunorcal.org/press-releases/aclu-of-northern-california-takes-listeners-behind-the-scenes-in-fight-for-civil-rights-and-civil-liberties-with-new-podcast-make-the-case/", "title": "Podcast release"}, {"url": "https://www.aclunorcal.org/news/why-aclu-norcal-opposes-proposition-f-on-the-san-francisco-ballot/", "title": "Prop F"}, {"url": "https://www.aclunorcal.org/news/aclu-norcal-remembers-civil-rights-icon-dolores-huerta/", "title": "Dolores Huerta tribute"}, {"url": "https://brownpoliticalreview.org/defending-civil-liberties/", "title": "Brown Political Review"}, {"url": "https://projects.propublica.org/nonprofits/organizations/940279770", "title": "ProPublica"}]}, "scenarios": {"horizon_years": 5, "horizon_rationale": "Five years, to late 2031. Three years is too short: it stops at about the January 2029 inauguration and before the $75B ICE supplement runs out in September 2029 (evidence: LAist). Those two events are the largest scheduled unknowns for this organization. Ten years is beyond what the evidence supports. Court composition, AI and a post-2029 enforcement regime cannot be read that far out (inference). Five years also runs past the organization's 2025-2028/29 strategic plan (evidence: scan; the end date is reported inconsistently).", "driving_forces": [{"name": "Federal coercion aimed at advocacy nonprofits and their funders", "category": "political", "kind": "external_trend", "direction": "Rising since September 2025. It has moved from memo to prosecution and subpoena. Outcomes are untested.", "impact": 5, "uncertainty": 4, "relevance": "This is the only trend reviewed that could threaten the institution directly and not just its docket. It also tests whether its strong finances can be reached.", "basis": "evidence", "evidence_it_is_real": "NSPM-7 (Sept. 25, 2025) directs federal action on domestic terrorism and political violence, and includes an IRS directive on tax-exempt funders (law-firm alerts). DOJ indicted the Southern Poverty Law Center in April 2026 on fraud-related charges. A judge denied the vindictive-prosecution motion. Trial moved to Feb. 1, 2027 (1819 News; Bloomberg Law). SPLC pleaded not guilty and there is no verdict. House Republicans opened a probe of more than 200 immigrant charities (Common Dreams). A House subpoena dated July 21, 2026 seeks donor and grantee information from People's Forum (Gothamist). No evidence found of any such action against ACLU NorCal or the national ACLU. Most IRS revocation commentary is warning, not a reported revocation.", "channel_to_organization": "Four channels. (1) Structure: the Foundation carries all payroll under a Resource Sharing Agreement with the 501(c)(4), and the 501(c)(4) appoints the Foundation's board. That allocation is the obvious audit target (inference from 990 Schedule O and the audit snippet). (2) Donors: 92.6% of Foundation revenue is contributions, and a subpoena for donor data would chill major givers (inference). (3) Conduits: DAF sponsors and community foundations might screen grants more cautiously under legal pressure (speculation; no case found). (4) Immigration clients and members: fear reduces their willingness to act as named plaintiffs or be organized (speculation).", "sources": [{"url": "https://www.dlapiper.com/insights/publications/2025/12/new-federal-strategy-for-countering-domestic-terrorism-and-political-violence-adds-enforcement-risks", "title": "DLA Piper: New federal strategy adds enforcement risks (Dec. 2025)"}, {"url": "https://www.pbwt.com/publications/administration-actions-targeting-domestic-terrorism-and-their-implications-for-nonprofits", "title": "Patterson Belknap: Implications for nonprofits"}, {"url": "https://1819news.com/news/item/federal-judge-delays-splc-trial-on-doj-charges-until-february", "title": "1819 News: SPLC trial delayed to February"}, {"url": "https://news.bloomberglaw.com/us-law-week/judge-rejects-effort-to-toss-southern-poverty-law-center-charges", "title": "Bloomberg Law: Judge rejects effort to toss SPLC charges"}, {"url": "https://www.commondreams.org/news/republicans-investigate-immigrant-charity-groups", "title": "Common Dreams: Republicans investigate immigrant charities"}, {"url": "https://tollbit.gothamist.com/news/the-peoples-forum-nyc-based-activist-group-hit-with-house-subpoena", "title": "Gothamist: People's Forum subpoena"}]}, {"name": "Shrinking and contested reach of judicial remedies", "category": "political", "kind": "external_trend", "direction": "Narrowing in doctrine and strained in compliance, but not one-way. Class actions and APA vacatur are still open. The Supreme Court still rules against the administration on some large questions.", "impact": 5, "uncertainty": 4, "relevance": "Litigation is the organization's core product. Its value depends on how many people one order protects and whether the order is obeyed.", "basis": "evidence", "evidence_it_is_real": "Trump v. CASA ended universal injunctions in June 2025. CRS (July 7, 2026): 14 of 34 pre-CASA nationwide injunctions were still in effect a year later, and whether the CASA limit reaches class injunctions and APA relief remains open. AP (May 2026): judges found violations of orders in at least 31 lawsuits, about one in eight, and over 250 noncompliance findings in individual immigration petitions. Officials eventually backed down in about a third of the 31. Higher courts allowed the policy or limited remedies in 15 of the 31. Lawfare counted 300 defied habeas cases by April 3, 2026, mostly procedural per one tracker. Against the trend: Trump v. Barbara (June 30, 2026, 6-3) struck down the birthright order. Toward it: the Vasquez Perdomo stay (Sept. 2025, 6-3) and Louisiana v. Callais (April 29, 2026). Lackey v. Stinnie (Feb. 2025) denies Section 1988 fees to plaintiffs who win only a preliminary injunction before mootness.", "channel_to_organization": "Directly into the program model. The signature win, the courthouse-arrests stay and vacatur, rests on the APA route the Court has not settled (evidence: scan on the Dec. 2025 and June 2026 rulings; the legal link is inference). NorCal is reported as co-counsel in Vasquez Perdomo, the case stayed by the Supreme Court. Fee income also depends on this: Foundation program revenue swung from $2.80M in FY23 to $0.48M in FY24 and $1.01M in FY25, described as legal fee income in the landscape section. Lackey makes fees less likely when a government moots a case after losing early (inference).", "sources": [{"url": "https://www.everycrsreport.com/reports/R49022.html", "title": "CRS R49022: Nationwide injunctions one year after CASA (July 2026)"}, {"url": "https://wtop.com/national/2026/05/in-court-fights-over-policy-trump-officials-rack-up-an-extraordinary-record-of-defiance/", "title": "AP via WTOP: Record of defiance (May 2026)"}, {"url": "https://www.lawfaremedia.org/article/three-hundred-habeas-cases-in-which-the-government-has-defied-court-orders", "title": "Lawfare: Three hundred habeas cases"}, {"url": "https://www.faegredrinker.com/en/insights/publications/2026/6/supreme-court-decides-trump-v-barbara", "title": "Faegre Drinker: Trump v. Barbara"}, {"url": "https://www.pbs.org/newshour/amp/nation/supreme-court-ends-restrictions-on-la-immigration-stops-set-after-agents-swept-up-u-s-citizens", "title": "PBS: Vasquez Perdomo stay"}, {"url": "https://news.ballotpedia.org/2026/04/29/u-s-supreme-court-decides-prominent-redistricting-case-with-implications-for-future-map-changes/", "title": "Ballotpedia: Callais"}, {"url": "https://www.huschblackwell.com/newsandinsights/supreme-court-sets-the-bar-for-recovering-attorneys-fees-in-civil-rights-cases", "title": "Husch Blackwell: Lackey v. Stinnie"}]}, {"name": "Funded federal immigration-enforcement build-out", "category": "political", "kind": "external_trend", "direction": "Up, and pre-funded through September 2029. Geography is uneven.", "impact": 5, "uncertainty": 3, "relevance": "Largest current source of demand for the organization's work and of its beneficiaries' harm.", "basis": "evidence", "evidence_it_is_real": "The 2025 reconciliation law gave ICE a $75B supplement spendable through September 2029, about $45B of it for detention (LAist; CBS). A Reuters-based report shows a plan to spend $38.3B on detention centers. KQED reports national detention rising from about 40,000 to about 73,000 (undated). ICE's San Francisco area logged 2,928 arrests in January-July 2025 and 4,970 in January-July 2026 (ABC7). July 2026 had 890 arrests, up over 60% from February (KQED, Aug. 31, 2026). DHS called that analysis \"cherry-picked\". Los Angeles-area arrests fell from their 2025 peak, so surges can move on.", "channel_to_organization": "Beneficiaries and docket. The San Francisco area of responsibility covers California north of Bakersfield, which is the organization's territory and includes the Central Valley, where it has been recruiting a Fresno attorney. California City and McFarland are named as detention expansion sites in ACLU-obtained records. Donor salience also tracks this trend (inference).", "sources": [{"url": "https://laist.com/news/politics/how-ice-grew-to-be-the-highest-funded-us-law-enforcement-agency", "title": "LAist: How ICE became the highest-funded US law enforcement agency"}, {"url": "https://www.internazionale.it/ultime-notizie-reuters/2026/02/13/ice-to-spend-38-3-billion-on-detention-centers-across-us-document-shows", "title": "Reuters via Internazionale: ICE $38.3B on detention (Feb. 2026)"}, {"url": "https://www.kqed.org/forum/2010101913163/ice-looks-to-expand-detention-centers-including-in-california", "title": "KQED Forum: ICE detention expansion"}, {"url": "https://www.kqed.org/news/12097313/northern-california-ice-arrests-surged-this-summer", "title": "KQED: Northern California ICE arrests surged (Aug. 31, 2026)"}, {"url": "https://abc7news.com/post/ice-arrests-san-francisco-bay-area-70-uc-berkeley-data-project-finds/19754574/", "title": "ABC7: Bay Area ICE arrests"}, {"url": "https://www.aclu-wa.org/press-releases/aclu-foia-litigation-reveals-information-about-plans-expand-ice-detention-facilities-nationwide/", "title": "ACLU of Washington: FOIA on detention expansion"}]}, {"name": "Federal electoral control: 2026 midterms and 2028", "category": "political", "kind": "external_trend", "direction": "Democrats favored for the House on Nov. 3, 2026. 2028 is open.", "impact": 4, "uncertainty": 4, "relevance": "This decides oversight in 2027-28 and the executive's direction after January 2029. It is the main driver of the federal-coercion axis, not a separate axis.", "basis": "evidence", "evidence_it_is_real": "Kalshi traders gave Democrats about 90% for the House as of Oct. 16, 2026. Silver Bulletin's average was D+6.6 on Sept. 8, and other aggregators are higher (search summaries of uneven quality). Six states have new maps for 2026 (Ballotpedia). The election is days away, so these readings are perishable.", "channel_to_organization": "A hostile Congress can subpoena; a split one mostly cannot pass new law or easily sustain probes (inference). A 2029 change of president would alter enforcement and DOJ posture. Fundraising is also cycle-sensitive: Foundation contributions were $11.05M in FY24 and $20.22M in FY25, which ended about ten weeks into the new administration, and national's revenue rose 65.7% in the same year (evidence for figures; election link is inference, since no source explains the jump).", "sources": [{"url": "https://news.kalshi.com/p/2026-midterm-predictions", "title": "Kalshi: 2026 midterm predictions"}, {"url": "https://www.natesilver.net/p/generic-ballot-average-2026-nate-silver-bulletin-congress-polls", "title": "Silver Bulletin: Generic ballot"}, {"url": "https://news.ballotpedia.org/2026/04/29/u-s-supreme-court-decides-prominent-redistricting-case-with-implications-for-future-map-changes/", "title": "Ballotpedia: Redistricting after Callais"}]}, {"name": "AI wealth concentration in the Bay Area, and its market risk", "category": "economic", "kind": "external_trend", "direction": "Sharply up, with real doubt about durability and with possible tax changes.", "impact": 4, "uncertainty": 4, "relevance": "The organization's donor geography sits on the largest new pool of liquid wealth in the country. Whether that wealth lasts, stays in California and cares about civil liberties are all open.", "basis": "evidence", "evidence_it_is_real": "Reporting links Bay Area capital flows to employee tender offers at AI firms. Redfin estimated that OpenAI and Anthropic listings could create enough employee wealth to buy nearly a third of San Francisco's homes (Guardian via inkl). The Boston Globe describes the wealth as concentrated, with Bay Area tech jobs still below pre-pandemic levels. LAO assumed AI-linked capital gains receipts would decline in 2026-27 (summary). Prop. 40, a one-time 5% billionaire tax, polled at 46% among likely voters in October 2026, down from 52% (PPIC; GV Wire). No evidence found of AI-wealth giving to civil-liberties groups specifically.", "channel_to_organization": "Donors, and the cost of staff. Unnamed individuals, bequests and DAFs carry the Foundation's $12.46M of non-national contributions in FY25. New wealth may arrive via DAFs and stock (inference). A correction would hit these sources and unrealized gains on its reserves at once (inference; investment mix not read). Rising Bay Area housing costs press on pay for a staff that is 59.8% of expenses and unionized (inference). Conflict: AI and surveillance firms' employees or investors may be donors while the organization litigates surveillance technology (speculation).", "sources": [{"url": "https://www.inkl.com/news/ai-wealth-boom-sending-san-francisco-home-prices-surging-its-ridiculous", "title": "Guardian via inkl: AI wealth and SF home prices"}, {"url": "https://www.bostonglobe.com/2026/06/13/nation/ipo-boom-divides-silicon-valley-into-rich-richer/", "title": "Boston Globe: IPO boom divides Silicon Valley"}, {"url": "https://gvwire.com/2026/10/28/runaway-victory-for-becerra-as-dems-show-more-voting-enthusiasm-poll/", "title": "GV Wire: PPIC poll (Oct. 28, 2026)"}, {"url": "https://en.wikipedia.org/wiki/2026_California_billionaire_tax", "title": "Wikipedia: 2026 California billionaire tax"}, {"url": "https://www.bondbuyer.com/news/california-has-an-18-billion-budget-problem-lao-says", "title": "Bond Buyer: LAO budget outlook"}]}, {"name": "Pressure on the private bar and pro bono litigators", "category": "political", "kind": "external_trend", "direction": "Pressure rose in 2025. Courts have mostly resisted it, and appeals are pending.", "impact": 4, "uncertainty": 3, "relevance": "The organization relies on donated legal work at a scale that rivals its largest cash funder.", "basis": "evidence", "evidence_it_is_real": "A March 2025 presidential memo directed DOJ to seek sanctions against lawyers in immigration and other suits against the government (KJZZ; Jurist). Paul, Weiss reached a deal for pro bono work for the administration. A search summary of low-quality coverage says four firms won orders nullifying most directives, with DOJ appealing, and a Guam judge rejected sanctions on an immigration lawyer in April 2026. No survey of pro bono withdrawal found.", "channel_to_organization": "Audits and annual reports show donated legal services of $3,897,778 in FY24 and $6,843,418 in FY22 (evidence: scan). Compare national's $7.77M cash in FY25. Keker, Van Nest & Peters and Coblentz Patch Duffy & Bass appear in coverage of its immigration cases. If firms retreat, the organization pays for that capacity or drops cases (inference).", "sources": [{"url": "https://www.kjzz.org/fronteras-desk/2025-03-25/latest-white-house-memo-directs-doj-to-target-lawyers-and-law-firms-filing-immigration-suits", "title": "KJZZ: White House memo targets lawyers (Mar. 2025)"}, {"url": "https://www.jurist.org/news/?p=276895", "title": "Jurist: Administration targets law firms"}, {"url": "https://politicalnewsz1.blogspot.com/2026/04/judge-blocks-doj-effort-to-sanction.html", "title": "Blog repost: Judge blocks sanction effort (Apr. 2026; low-quality source)"}]}, {"name": "Giving concentrates: more dollars, fewer donors, larger DAF share, weaker tax incentive at the top", "category": "economic", "kind": "external_trend", "direction": "Total giving up, donor counts down, DAF grants up. Tax rule changes took effect in 2026.", "impact": 4, "uncertainty": 2, "relevance": "Foundation revenue is 92.6% contributions. Its mass-member base and its DAF channel respond differently to this trend.", "basis": "evidence", "evidence_it_is_real": "Giving USA: $617.2B in 2025, up 3.0% after inflation. Fundraising Effectiveness Project: 2025 dollars up 5.0%, donors down 3.6%, with sub-$1,000 donors flat or down (secondary). National Philanthropic Trust granted $6.61B in FY2025, up 20% (sponsor's own release). From 2026 the 2025 law adds a 0.5%-of-AGI floor and a 35% benefit cap for itemizers, and a $1,000/$2,000 deduction for non-itemizers. No quantified estimate of the effect on giving was found. Bunching is what advisers are recommending.", "channel_to_organization": "Top listed 2025 grants to the Foundation include Schwab-linked DACG $1,501,687, Fidelity Charitable $663,297, Vanguard Charitable $537,000 and American Online Giving $319,300, about $3.0M together (evidence, secondary; my sum). San Francisco Foundation gave $803,800. Bunching and DAFs make gifts lumpier, worsening its 34-point revenue volatility (inference). The trend runs against the organization's claimed gain to 120,000 members, up 20% (self-reported). Union program revenue of $5.66M in FY25 depends on that base.", "sources": [{"url": "https://givingusa.org/?p=35161", "title": "Giving USA: $617.20B in 2025"}, {"url": "https://afpglobal.org/news/giving-usa-2026-what-fundraisers-need-know-year-end", "title": "AFP: Giving USA 2026"}, {"url": "https://www.truesense.com/blog/what-you-need-to-know-about-giving-usa-the-annual-report-on-philanthropy-2026", "title": "TrueSense: Giving USA 2026"}, {"url": "https://thenonprofittimes.com/?p=215695", "title": "NonProfit Times: NPT grants grew 20% to $6.6B"}, {"url": "https://www.accountingtoday.com/news/charitable-deduction-gets-caps-floors-and-haircuts-in-obbba", "title": "Accounting Today: Charitable deduction changes"}, {"url": "https://www.influencewatch.org/non-profit/aclu-foundation-of-northern-california2/", "title": "InfluenceWatch: Foundation grant list, citing Candid"}]}, {"name": "Institutional philanthropy mobilizes for targeted civil-society groups", "category": "economic", "kind": "external_trend", "direction": "Up in 2026, with reports of sector strain. Durability unknown.", "impact": 3, "uncertainty": 3, "relevance": "Creates a possible new funder base and legal-defense backstop for a field under attack. It may mostly bypass an organization seen as well-funded.", "basis": "evidence", "evidence_it_is_real": "Open Society pledged $300M in legal and financial support for targeted nonprofits on May 20, 2026 (The Conversation via inkl). MacArthur $100M and Ford $60M for democracy work are reported on a promotional blog, so treat the details with care. A May 2026 Center for Effective Philanthropy report describes burnout, financial distress and targeted pressure (summary).", "channel_to_organization": "Named institutions are only modest funders of the Foundation (scan: mostly low-to-mid six figures), and no large multi-year anchor grant was found. With 22.7 months of unrestricted net assets (inference from 990) and a $779.7M national body, it may rank low for emergency money (inference). In a coercion scenario, a shared legal-defense pool helps smaller partners it depends on as co-counsel.", "sources": [{"url": "https://www.inkl.com/news/americas-nonprofit-sector-is-pushing-back-against-an-authoritarian-playbook", "title": "inkl: Nonprofit sector pushes back"}, {"url": "https://grantedai.com/blog/macarthur-100-million-democracy-grants-philanthropy-mobilization-nonprofits-2026", "title": "GrantedAI blog: MacArthur $100M"}, {"url": "https://grantedai.com/blog/ford-foundation-60-million-democracy-grants-civic-engagement-voting-rights-strategy-2026", "title": "GrantedAI blog: Ford $60M"}]}, {"name": "California as protective but fiscally constrained and preemption-limited state", "category": "political", "kind": "external_trend", "direction": "Politically stable and Democratic. Fiscal room narrowing. State protections being tested in federal court.", "impact": 4, "uncertainty": 3, "relevance": "State and local law is the fallback venue when federal remedies fail, and it is the 501(c)(4)'s domain.", "basis": "evidence", "evidence_it_is_real": "PPIC (Oct. 2026): Becerra 61%, Hilton 37% among likely voters. LAO projected an $18B problem for 2026-27 and a recurring structural gap of $20-35B a year from 2027-28 (secondary summaries; Newsom described the enacted budget as balanced). A federal judge blocked SB 627's mask ban on Feb. 9, 2026 while upholding ID requirements. Newsom vetoed license-plate reader bill SB 274 in 2025. So a Democratic state does not mean automatic civil-liberties votes.", "channel_to_organization": "Foundation gave $725,000 to the Union for legislative work in FY25, and the Union reportedly passes about $2.1-2.6M a year to ACLU California Action (aggregators). Government funding of the organization: none found (latest statement 2015), so state cuts hit partners and beneficiaries and not its own revenue (inference). San Jose's immigrant-defense cuts show that squeeze (Hoodline). The governor is a former state attorney general and federal HHS secretary, a record not assessed here for its civil-liberties implications.", "sources": [{"url": "https://gvwire.com/2026/10/28/runaway-victory-for-becerra-as-dems-show-more-voting-enthusiasm-poll/", "title": "GV Wire: PPIC governor poll"}, {"url": "https://caltax.org/2025/11/21/state-facing-18-billion-deficit-despite-8-6-billion-in-unexpected-revenue-legislative-analyst-projects/", "title": "CalTax: LAO projection"}, {"url": "https://lamag.com/lawsuits/california-blocked-from-enforcing-ice-mask-ban/", "title": "LA Mag: California blocked from enforcing ICE mask ban"}, {"url": "https://sbcsentinel.com/?p=35837", "title": "SBC Sentinel: Governor vetoes SB 274"}, {"url": "https://hoodline.com/2026/05/san-jose-slashes-immigrant-defense-cash-as-budget-crunch-bites/", "title": "Hoodline: San Jose immigrant defense cuts"}]}, {"name": "AI-enabled and networked police surveillance", "category": "technological", "kind": "external_trend", "direction": "Exposure growing. Law contested and recently unfavorable in California state court.", "impact": 4, "uncertainty": 3, "relevance": "A named project of the organization, and increasingly linked to immigration enforcement through data sharing.", "basis": "evidence", "evidence_it_is_real": "San Jose police searched their plate database 261,711 times from June 2024 to June 2025, per a verified complaint (an allegation). A Santa Clara County judge dismissed the ACLU NorCal and EFF challenge in about October 2026; San Jose still cut retention from one year to 30 days. The San Diego affiliate sued in September 2026. A search summary reports a state audit finding noncompliance, and that 71 agencies shared data out of state per rights groups' 2023 records requests. No evidence found on 2026 facial-recognition bills or on ICE's direct access to California plate data.", "channel_to_organization": "Program and beneficiaries. EFF is at once partner and rival for surveillance dollars. The field moves faster than case timelines, so policy pressure at city level may matter more than doctrine: San Jose changed retention despite winning (inference). AI-firm donors could create a conflict question (speculation).", "sources": [{"url": "https://www.kqed.org/news/12102922/south-bay-judge-rules-san-joses-flock-cameras-dont-invade-privacy", "title": "KQED: San Jose Flock ruling"}, {"url": "https://www.404media.co/aclu-and-eff-sue-a-city-blanketed-with-flock-surveillance-cameras/", "title": "404 Media: ACLU and EFF sue San Jose"}, {"url": "https://www.kpbs.org/news/public-safety/2026/09/30/local-aclu-foundation-sues-city-of-san-diego-police-department-over-use-of-flock-cameras", "title": "KPBS: San Diego Flock suit"}, {"url": "https://valleywidenewspaper.com/newsom-vetoes-bill-to-regulate-license-plate-readers-as-misuse-evidence-mounts/", "title": "Valley Wide: Newsom vetoes plate reader bill"}]}, {"name": "Generative AI in legal work", "category": "technological", "kind": "external_trend", "direction": "Adoption rising under necessity; court discipline and privilege limits rising with it.", "impact": 3, "uncertainty": 3, "relevance": "Could raise output per attorney in a personnel-heavy shop, or flood courts and create privilege risks.", "basis": "evidence", "evidence_it_is_real": "A tracker reported 1,345 court-identified fabricated-citation incidents as of April 2026 (search summary; the original tracker not opened). Public defenders report using AI out of workload necessity (arXiv study). A district court in USA v. Heppner held that documents from a public AI tool were not privileged (summary). ABA Formal Opinion 512 requires verification and supervision. No evidence found of this organization's own AI policy.", "channel_to_organization": "Personnel is 59.8% of Foundation expenses, top of its peer set by the extract. Document review and FOIA work are the likely efficiency gain (inference). Pro se and habeas volume assisted by AI may increase court load and competition for judicial attention (speculation). Any labor-saving changes would meet a unionized staff with a recent layoff dispute (inference). Immigrant client data in public AI tools is a real privilege risk (inference).", "sources": [{"url": "https://aventine.org/AI-law-courtroom-hallucination-justice-gap-drone-warfare-alpha-fold", "title": "Aventine: AI in law and the justice gap"}, {"url": "https://arxiv.org/pdf/2510.22933", "title": "arXiv: Public defenders' perspectives on AI"}, {"url": "https://www.cliffordlaw.com/wp-content/uploads/2026/04/cautionary-tales-cliffords-notes-feb-march-2026.pdf", "title": "Clifford Law: Cautionary tales (2026)"}]}, {"name": "Polarized trust and fragmented, AI-mediated information", "category": "social", "kind": "external_trend", "direction": "Partisan gaps wide. Opinion on ICE turning negative. Referral traffic from AI answers low.", "impact": 3, "uncertainty": 3, "relevance": "Affects who gives, who believes the organization, and how its public education reaches people.", "basis": "evidence", "evidence_it_is_real": "Pew (published Oct. 26, 2026): ICE 35% favorable, 56% unfavorable, versus 40/49 in 2025, and least favored of 12 agencies. Gallup 2025: record partisan gap of 64 points on Supreme Court approval. No Gallup 2026 number was found. Reuters Institute 2026: 10% weekly use of AI chatbots for news globally, 17% among ages 18-24, only 4% regularly clicking through; news creators gaining ground.", "channel_to_organization": "Public opinion on ICE lets the organization argue from a majority position, which matters for local ballots and juries (inference). Its media footprint is mostly case reporting (scan), so what AI tools and creators repeat about it will matter more over time (inference). Know-your-rights materials need distribution beyond its website. Member recruitment is partly run through national's platform (evidence on books; inference on method).", "sources": [{"url": "https://www.pewresearch.org/short-reads/2026/10/26/americans-views-of-ice-grow-more-negative/", "title": "Pew: Views of ICE grow more negative (Oct. 26, 2026)"}, {"url": "https://m.washingtontimes.com/news/2025/aug/7/gallup-poll-finds-record-partisan-gulf-approval-ratings-congress/", "title": "Washington Times: Gallup partisan gulf (Aug. 2025)"}, {"url": "https://the-decoder.com/more-people-get-news-from-ai-chatbots-but-trust-remains-low/", "title": "The Decoder: Reuters Institute AI chatbot findings"}, {"url": "https://www.newscaststudio.com/2026/06/18/reuters-https-reutersinstitute-politics-ox-ac-uk-digital-news-report-2026-how-news-creators-are-impacting-politics-and-media-around-world-2026/", "title": "NewscastStudio: Digital News Report 2026"}]}, {"name": "Falling immigration and a shifting immigrant population", "category": "social", "kind": "external_trend", "direction": "Immigration falling sharply. Foreign-born population nationally declining for the first time since the 1960s.", "impact": 3, "uncertainty": 3, "relevance": "Changes the people the immigrants' rights docket serves, and the fear level in those communities.", "basis": "evidence", "evidence_it_is_real": "Pew: the US immigrant population fell 2.6% to 51.9M as of June 2025 (via CalMatters). California's budget summary: foreign immigration fell to 126,000 in 2024-25. PPIC: 28% of Californians foreign-born in 2024. Chronicle: San Francisco net immigration fell from 6,300 to 3,800, with larger drops in the Central Valley. No Northern California farmworker data found.", "channel_to_organization": "Fewer new arrivals does not mean less work in the medium term: enforcement against long-settled residents is what the docket addresses (inference). A declining and frightened population gives fewer willing plaintiffs (speculation) and gives the Central Valley, where its Fresno recruiting is located, a larger stake in its work (inference).", "sources": [{"url": "https://www.pleasantonweekly.com/calmatters/2025/08/21/u-s-immigrant-population-declines-for-first-time-in-half-a-century-research-shows/", "title": "CalMatters: Immigrant population declines"}, {"url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/DemographicInformation.pdf", "title": "California budget summary 2026-27: Demographic information"}, {"url": "https://www.ppic.org/publication/immigrants-in-california/", "title": "PPIC: Immigrants in California"}, {"url": "https://preview-prod.w.sfchronicle.com/california/article/immigration-map-trump-21257275.php", "title": "SF Chronicle: Immigration map"}]}, {"name": "Climate risk and California's insurance stress", "category": "environmental", "kind": "external_trend", "direction": "Up, steadily. The link to this organization is weak.", "impact": 1, "uncertainty": 2, "relevance": "Included because it was checked. It is not a material driver within five years, on the evidence found.", "basis": "evidence", "evidence_it_is_real": "The FAIR Plan raises rates 29.1% from Oct. 15, 2026 (KQED), and covers about 5% of single-family homes, up from 1.5% in December 2020 (Stanford release). No evidence found of climate displacement in Northern California driving civil-liberties demand.", "channel_to_organization": "Indirect only: homeowner donors' costs, state fiscal pressure and possible growth in rights issues for unhoused people after disasters (speculation). Unhoused people's rights is a listed issue.", "sources": [{"url": "https://www.kqed.org/news/12094860/california-fair-plan-announces-29-1-rate-hike-for-homeowners-this-fall", "title": "KQED: FAIR Plan rate hike"}, {"url": "https://www.eurekalert.org/news-releases/1132642", "title": "EurekAlert: Stanford release on FAIR Plan"}]}], "axes": [{"name": "Axis 1: Federal coercion of immigrants, dissent and civil society", "low_pole": "In 2031, federal enforcement is targeted and at lower volume, and NSPM-style tools against advocacy groups are revoked or dormant. Nonprofits face ordinary oversight.", "high_pole": "In 2031, a large enforcement machine is permanent, and criminal, tax and subpoena tools are regularly used against advocacy groups and their funders.", "why_critical": "Impact 5, uncertainty 4, product 20. It sets both the demand for the organization's work and the direct risk to the institution. It is folded together with the enforcement build-out (5x3) and electoral control (4x4), which move with it and are therefore one axis. The SPLC trial on Feb. 1, 2027 and the 2028 election will start to resolve it.", "runners_up_rejected": "Federal electoral control (16): a cause of this axis, not independent. Enforcement build-out (15): same axis. AI wealth and market risk (16): large, and nearly independent, but it changes the size of the organization and not whether its model works. With about 22.7 months of unrestricted net assets at FYE 3/2025, a market fall is a stress and not a survival question, so it is applied as a stress inside each scenario. Surveillance (12), California state politics (12) and the bar (12) score lower. Giving concentration (8) has low uncertainty and is treated as background.", "trend": "Moving toward the high pole today (evidence: NSPM-7, SPLC indictment, House probes). No direct action on the ACLU found.", "external": true}, {"name": "Axis 2: Reach and enforceability of judicial remedies", "low_pole": "In 2031, classwide and APA relief are sharply limited, fee awards are rarer, and orders against the government are often slow-walked without consequence. Wins mostly help named parties.", "high_pole": "In 2031, class actions and APA vacatur survive as broad remedies, and government generally complies, so one order can protect a whole region.", "why_critical": "Impact 5, uncertainty 4, product 20. It sets what a donated litigation dollar buys. It is defined mainly by doctrine and appellate behavior, which do not reset with an election: a conservative Supreme Court majority can last under any president (inference). The current record shows the independence: the same Court issued the Vasquez Perdomo stay and Barbara, and the same executive has lost and also won. Honest limit: the compliance part of this axis correlates with Axis 1, since a hostile executive evades more. The doctrine part does not, which is why the two can vary apart.", "runners_up_rejected": "The same list as Axis 1. The closest rival for this slot is AI wealth and market risk at 16. It loses on score and because it describes money available, which is close to the revenue consequence the method excludes as an axis.", "trend": "Mixed. Narrowing on universal injunctions, fee-shifting and emergency stays. Open on class and APA relief (evidence: CRS R49022, July 2026).", "external": true}], "scenarios": [{"quadrant": "high_high", "name": "Full Docket", "narrative": "Speculation, written from late 2031. The enforcement state never went away. The 2029 budget renewed most of what the 2025 law started, and detention became a fixture of Central Valley towns. DOJ and the IRS kept pressing advocacy groups, though juries and judges threw out the weakest cases. Yet the courts held. The Supreme Court left class actions and APA vacatur standing, with limits, and after several contempt rounds agencies mostly obeyed final orders. Law became the main brake on federal power, and everyone knew it. ACLU NorCal grew into that role. Its Fresno and Sacramento attorneys carry region-wide classes on courthouse arrests, re-detention and detention conditions, usually with the Lawyers' Committee and private co-counsel. Members and DAF donors renewed through each new outrage. Periodic congressional letters and an IRS examination cost money and attention but found nothing that stopped the work. Staff are exhausted. Burnout, not funding, is the management problem. The board has a new executive director or is searching for one, and the transition is the hardest decision the organization faced this decade.", "effect_on_org": {"revenue": "Speculation: Foundation revenue of about $24-32M versus $21.8M in FY25. National flow stays large (it was $7.77M). Fee income grows but stays lumpy, perhaps $1-4M against $0.48-2.80M in FY23-25, because final judgments are more common than mooted injunctions. An AI-market correction cuts one or two years, and reserves cover it.", "programs": "Immigration and detention take a larger share. Surveillance work focuses on data flowing to ICE. Reproductive and criminal-justice work risk being crowded out.", "staff": "Attorney headcount above the FY25 level of 117 total staff. Burnout and pay pressures from Bay Area housing costs. Union bargaining over workload.", "standing": "High. The regional name on class relief, shared with national and peers. Attacks raise its profile among supporters."}, "early_signals": ["SPLC acquitted or charges dismissed after the Feb. 1, 2027 trial date.", "The courthouse-arrest vacatur survives at the Ninth Circuit. Search the docket; appeal status was not found.", "Supreme Court declines to extend CASA to Rule 23 classes or APA vacatur in its 2026-27 or 2027-28 terms.", "Monthly arrests in ICE's San Francisco area stay at or above 890 (Deportation Data Project).", "Lawfare and AP noncompliance counts level off.", "FY26 990: Foundation expenses above $22M, with attorney hires."], "readiness": {"score": 4, "rationale": "Evidence: $45.8M Foundation net assets and $17.85M at the Union at FYE 3/2025, about 40 ongoing cases (self-reported), verified courthouse-arrest rulings, recruiting in Fresno, Sacramento and San Francisco. Not a 5 because FY26 is unseen, no CFO-level officer or succession plan was established, staff fell from 130 to 117 after a contested restructuring, and it banks surges and spends slowly."}, "donor_implication": "Money is unlikely to be the constraint. Fund named attorneys and regional capacity on multi-year terms, and ask how fee recoveries are used. An unrestricted gift adds little, as in the room-for-funding section."}, {"quadrant": "high_low", "name": "Paper Rights", "narrative": "Speculation, written from late 2031. Enforcement is permanent and the courts have stepped back. The Supreme Court extended CASA's logic to most nationwide classes and limited vacatur. Injunctions now cover named plaintiffs. Agencies respond to losses with a new memo. Habeas petitions are the main remedy for the detained, one person at a time, and transfers out of state beat many of them. Prosecutors won at least one conviction of a national advocacy group, and the IRS opened examinations of groups in the immigrant-rights field. Law firms cut back on pro bono work against the federal government. Foundations ask lawyers before they write checks. ACLU NorCal survives, and for a while it raises more than ever. But what it sells has changed. A class win that once covered every immigration court north of Bakersfield now covers a few dozen plaintiffs. It responds with state-court cases, records fights, and work inside California law. Its deductible entity pays the salaries, and its member-elected sister picks the Foundation's board, so a federal examiner looks there first. Legal bills rise. Some donors leave quietly.", "effect_on_org": {"revenue": "Speculation: gross contributions may rise at first ($22-30M) because anger sells. Then large-donor and DAF money gets more cautious, and donor-data subpoenas are the main risk. Fee income falls below $0.5M a year. Replacing lost pro bono wor
