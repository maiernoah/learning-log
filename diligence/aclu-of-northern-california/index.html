  h += `<h2>Corpus read</h2><table><tr><th>Item</th><th>Type</th><th>Date</th><th>Note</th></tr>${(LD.corpus||[]).slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))).map(c=>`<tr><td class="wrap"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>${c.pressure_moment?' <span class="b red">pressure moment</span>':''}</td><td class="small">${esc(c.type.replace(/_/g,' '))}</td><td class="small">${esc(c.date||'—')}</td><td class="wrap small">${esc(c.note)}</td></tr>`).join('')}</table>`;
  h += `<h2>Gaps and what to probe in conversation</h2>${list(LD.gaps)}<h3>Probe</h3>${list(LD.probe_in_conversation)}`;
  section('leader','Leader',h);
})();

/* futures */
(function(){
  if(!X){ section('futures','Futures',empty('The scenario step')); return; }
  let h = `<h1>Four futures</h1><p class="sub">${X.horizon_years}-year horizon. ${esc(X.horizon_rationale)}</p>`;
  const ax = (X.axes||[]).map(a=>({...a, name:(a.name||'').replace(/^Axis \d+:\s*/i,'').split(/[.?]/)[0].trim()})); const a0=ax[0]||{}, a1=ax[1]||{};
  const byQ = {}; (X.scenarios||[]).forEach(s=>byQ[s.quadrant]=s);
  const cell = {high_high:'grid-column:2;grid-row:2', high_low:'grid-column:3;grid-row:2', low_high:'grid-column:2;grid-row:3', low_low:'grid-column:3;grid-row:3'};
  const tile = q => { const s=byQ[q]; if(!s) return `<div class="q muted" style="${cell[q]}">no scenario</div>`; const ml=X.most_likely_quadrant===q, md=X.most_dangerous_quadrant===q;
    return `<button class="q" data-q="${q}" aria-pressed="false" style="${cell[q]}"><div class="qd">${esc(a0.name)}: ${q.startsWith('high')?'high':'low'} · ${esc(a1.name)}: ${q.endsWith('high')?'high':'low'}</div><div class="nm">${esc(s.name)}</div>${ml?`<div class="tag" style="color:var(--c1)">most likely today</div>`:''}${md?`<div class="tag">most dangerous</div>`:''}${ml?``:``}<div class="rd">readiness <span class="dots">${'●'.repeat(s.readiness.score)}<span class="off">${'●'.repeat(5-s.readiness.score)}</span></span></div></button>`; };
  h += `<div class="quad"><div class="ax top" style="grid-column:2/4;grid-row:1">${esc(a1.name)}: high on the left, low on the right</div><div class="ax y" style="grid-column:1;grid-row:2/4">${esc(a0.name)}: high above, low below</div>${tile('high_high')}${tile('high_low')}${tile('low_high')}${tile('low_low')}<div class="ax x" style="grid-column:2/4;grid-row:4">Click a quadrant. The poles are defined under "Why these two axes".</div></div>`;
  h += `<div id="scen-detail" class="scen-detail"><p class="muted">Select a scenario.</p></div>`;
  h += `<h2>The two trends on the axes</h2>`+ax.map(a=>`<div class="claim" data-basis="inference"><div class="head"><b>${esc(a.name)}</b>${a.trend?` <span class="small muted">built from: ${esc(String(a.trend).replace(/\[(evidence|inference|speculation)\]\s*/gi,'').split(/(?<=\.)\s/)[0])}</span>`:''} ${a.external===false?badge('not external','red'):''}</div><div class="body">Low: ${esc(a.low_pole)}\n\nHigh: ${esc(a.high_pole)}\n\n${esc(a.why_critical)}</div><div class="src">Runners-up: ${esc(a.runners_up_rejected)}</div></div>`).join('');
  h += `<h2>Trend register</h2><p class="small muted">Strong currents already in motion in the world, and the channel through which each reaches this organization. Impact and uncertainty are for this organization.</p><table><tr><th>Trend</th><th>Category</th><th>Evidence it is real</th><th>Channel to this organization</th><th>Impact</th><th>Uncertainty</th></tr>${(X.driving_forces||[]).slice().sort((a,b)=>b.impact*b.uncertainty-a.impact*a.uncertainty).map(f=>`<tr><td class="wrap"><b>${esc(f.name)}</b><br><span class="small muted">${esc(f.direction)}</span> ${badge(f.basis,f.basis)}${f.kind==='organization_specific'?' '+badge('organization-specific','na'):''}</td><td class="small">${esc(f.category)}</td><td class="wrap small">${esc(f.evidence_it_is_real||'')}${srcs(f.sources)}</td><td class="wrap small">${esc(f.channel_to_organization||f.relevance||'')}</td><td><span class="dots">${'●'.repeat(f.impact)}<span class="off">${'●'.repeat(5-f.impact)}</span></span></td><td><span class="dots">${'●'.repeat(f.uncertainty)}<span class="off">${'●'.repeat(5-f.uncertainty)}</span></span></td></tr>`).join('')}</table>`;
  h += `<h2>Judgment</h2>${prose(X.judgment)}<h3>Moves robust across all four</h3>${list(X.robust_moves, m=>`<b>${esc(m.move)}</b> <span class="muted">${esc(m.why_robust)}</span>`)}`;
  h += `<h2>Gaps</h2>${list(X.gaps)}`;
  section('futures','Futures',h);
})();

/* verdict */
(function(){
  if(!A){ section('verdict','Verdict',empty('The assessment')); return; }
  let h = `<h1>Assessment</h1><p class="sub">Conclusions and their defense</p><div class="lede">${esc(A.bottom_line)}</div>`;
  if(AB){ const b=AB.health_score||{}, n=A.health_score||{}; const bp={}; (AB.premortem||[]).forEach(p=>bp[p.failure_mode]=p); const bg={}; (AB.gift_risk||[]).forEach(g=>bg[g.gift_type]=g.risk);
    const d=(x,y)=>x==null||y==null?'':(y-x>0?` <span class="b green">+${y-x}</span>`:y-x<0?` <span class="b red">${y-x}</span>`:' <span class="b na">same</span>');
    h += `<details open style="border-color:var(--c4)"><summary><span class="r">Δ</span><span class="fm">What changed since the previous verdict</span><span class="pr">${SUP&&SUP.length?SUP.length+' supplied documents':'re-run'}</span></summary><div class="in">
      <div class="kv"><div>Health score</div><div>${b.score??'—'} → <b>${n.score??'—'}</b>${d(b.score,n.score)} (${esc(b.grade||'')} → ${esc(n.grade||'')})</div>${(n.components||[]).map(c=>{const o=(b.components||[]).find(x=>x.name===c.name); return `<div class="small muted">${esc(c.name)}</div><div class="small">${o?o.score:'—'} → ${c.score}${o?d(o.score,c.score):''}</div>`;}).join('')}</div>
      <h3>Bottom line, before</h3><p class="prose muted">${esc(AB.bottom_line||'')}</p>
      <h3>Failure modes</h3><table><tr><th>Failure mode</th><th class="num">Before</th><th class="num">After</th></tr>${(A.premortem||[]).slice().sort((a,b)=>a.rank-b.rank).map(p=>{const o=bp[p.failure_mode]; return `<tr><td class="wrap">${esc(p.failure_mode)}</td><td class="num">${o?Math.round(o.probability*100)+'%':'<span class="muted">new</span>'}</td><td class="num">${Math.round(p.probability*100)}%</td></tr>`;}).join('')}${(AB.premortem||[]).filter(p=>!(A.premortem||[]).some(q=>q.failure_mode===p.failure_mode)).map(p=>`<tr><td class="wrap muted">${esc(p.failure_mode)}</td><td class="num">${Math.round(p.probability*100)}%</td><td class="num muted">dropped</td></tr>`).join('')}</table>
      <h3>Gift risk</h3><div class="row">${(A.gift_risk||[]).map(g=>`<span class="b ${bg[g.gift_type]&&bg[g.gift_type]!==g.risk?'amber':'na'}">${esc(g.gift_type.replace(/_/g,' '))}: ${esc(bg[g.gift_type]||'—')} → ${esc(g.risk)}</span>`).join(' ')}</div>
      <h3>Advisor questions</h3><div class="row">${(A.advisor_questions||[]).map(q=>{const o=(AB.advisor_questions||[]).find(x=>x.question===q.question); const ch=o&&o.status!==q.status; return `<span class="b ${ch?'green':'na'}" title="${esc(q.question)}">${esc(q.question.slice(0,38))}…: ${esc(o?o.status.replace('_',' '):'—')} → ${esc(q.status.replace('_',' '))}</span>`;}).join(' ')}</div></div></details>`; }
  const hs=A.health_score; if(hs){ h += `<h2>Health score ${hs.score} / 100, grade ${esc(grade(hs.grade))}</h2>${String(hs.grade||'').length>3?`<p class="small muted">${esc(hs.grade)}</p>`:''}<div class="bars">${hs.components.map(c=>`<div>${esc(c.name)} <span class="muted small">×${c.weight}</span></div><div class="track"><div class="fill" style="width:${c.score}%"></div></div><div class="v">${c.score}</div>`).join('')}</div>`+hs.components.map(c=>`<p class="small" style="max-width:84ch"><b>${esc(c.name)}:</b> ${esc(c.rationale)}</p>`).join(''); }
  h += `<h2>Pre-mortem</h2><p class="small muted">It is five years on and the organization has failed, stalled, or embarrassed its donors. The most likely stories, ranked.</p>`+(A.premortem||[]).slice().sort((a,b)=>a.rank-b.rank).map(p=>`<details${p.rank===1?' open':''}><summary><span class="r">${p.rank}</span><span class="fm">${esc(p.failure_mode)}</span><span class="pr">${Math.round(p.probability*100)}% · ${esc(p.horizon)}</span></summary><div class="in"><p class="prose">${esc(p.mechanism)}</p><h3>Chain of evidence</h3><ul class="chain">${(p.evidence_chain||[]).map(e=>`<li>${badge(e.basis,e.basis)} ${esc(e.fact)}${e.source?` <a class="small" href="${esc(e.source)}" target="_blank" rel="noopener">src</a>`:''}</li>`).join('')}</ul><h3>Warning signs</h3>${list(p.warning_signs)}</div></details>`).join('');
  h += `<h2>Gift risk by type</h2><table><tr><th>Gift</th><th>Risk</th><th>Why</th><th>What lowers it</th></tr>${(A.gift_risk||[]).map(g=>`<tr><td class="wrap">${esc(g.gift_type.replace(/_/g,' '))}</td><td>${badge(g.risk,{low:'green',moderate:'amber',elevated:'amber',high:'red'}[g.risk]||'na')}</td><td class="wrap">${esc(g.rationale)}</td><td class="wrap small">${esc((g.risk_reducers||[]).join(' · '))}</td></tr>`).join('')}</table>`;
  if(A.efficiency){ const e=A.efficiency; h += `<h2>Efficiency, honestly</h2>`+claim({statement:`${e.verdict}`+(e.change_per_dollar?`\n\nChange per dollar: ${e.change_per_dollar}`:'')+(e.trend?`\n\nTrend: ${e.trend}`:'')+(e.north_star_metric?`\n\nNorth star: ${e.north_star_metric}`:'')+`\n\nProgram ratio: ${e.program_ratio_note}\n\nWhat the ratios miss: ${e.what_ratios_miss}\n\nSpending versus strategy: ${e.spending_matches_strategy}\n\nVersus peers: ${e.versus_peers}`,basis:e.basis}); }
  h += `<h2>The advisor question bank</h2>`+(A.advisor_questions||[]).map(q=>`<div class="q-status" data-basis="${q.basis}"><span class="light ${{answered:'green',partial:'amber',no_evidence:'red'}[q.status]}" title="${esc(q.status)}" style="margin-top:6px"></span><div><div class="qq">${esc(q.question)} <span class="muted small">${esc(q.status.replace('_',' '))}</span> ${badge(q.basis,q.basis)} ${conf(q.confidence)}</div><div class="aa">${esc(q.answer)}</div>${srcs(q.sources)}</div></div>`).join('');
  h += `<div class="two"><div><h3>Strengths</h3>${(A.strengths||[]).map(s=>claim({statement:s.evidence,basis:s.basis}, s.strength)).join('')}</div><div><h3>What would change the verdict</h3>${list(A.verdict_changers, v=>`<span class="b ${v.direction==='up'?'green':'red'}">${esc(v.direction)}</span> ${esc(v.what)}`)}</div></div>`;
  h += `<h2>Ask the organization, in this order</h2><ol>${(A.questions_to_ask||[]).slice().sort((a,b)=>a.order-b.order).map(q=>`<li style="max-width:84ch"><b>${esc(q.question)}</b><br><span class="muted small">Why: ${esc(q.why)}</span><br><span class="small">A good answer looks like: ${esc(q.good_answer_looks_like)}</span></li>`).join('')}</ol>`;
  h += `<h2>Confidence</h2>${prose(A.confidence_statement)}<h3>Blind spots</h3>${list(A.blind_spots)}<h3>Gaps</h3>${list(A.gaps)}`;
  section('verdict','Verdict',h);
})();

/* sources */
(function(){
  const seen = new Map();
  const add = (url,title,where) => { if(!url) return; const k=url.trim(); if(!seen.has(k)) seen.set(k,{title:title||url,where:new Set()}); seen.get(k).where.add(where); };
  const walk = (o, where) => { if(!o) return; if(Array.isArray(o)) return o.forEach(x=>walk(x,where)); if(typeof o==='object'){ if(o.url && typeof o.url==='string') add(o.url,o.title,where); if(o.source && /^https?:/.test(o.source)) add(o.source,null,where); if(o.source_url) add(o.source_url,null,where); if(o.full_filing_url) add(o.full_filing_url,'Form 990 full filing',where); Object.values(o).forEach(v=>walk(v,where)); } };
  walk(I,'identity'); walk(S,'record'); walk(RS,'results'); walk(L,'field'); walk(LD,'leader'); walk(C,'culture'); walk(X,'futures'); walk(A,'verdict'); walk(F,'money');
  const rows = [...seen.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
  let h = `<h1>Sources</h1><p class="sub">${rows.length} distinct URLs cited across the dossier. Agents may cite only URLs they searched or fetched.</p><table><tr><th>Source</th><th>Used in</th></tr>${rows.map(([u,v])=>`<tr><td class="wrap"><a href="${esc(u)}" target="_blank" rel="noopener">${esc(v.title)}</a><br><span class="small muted" style="word-break:break-all">${esc(u)}</span></td><td class="small">${[...v.where].join(', ')}</td></tr>`).join('')}</table>`;
  if(INTERNAL) h += `<h2>Run (internal)</h2><table><tr><th>Phase</th><th>Model</th><th class="num">Turns</th><th class="num">Cost</th><th class="num">Seconds</th><th>Result</th></tr>${Object.entries(M.phases||{}).map(([k,p])=>`<tr><td>${esc(k)}</td><td>${esc(p.model)}</td><td class="num">${p.turns}</td><td class="num">$${(p.cost_usd||0).toFixed(2)}</td><td class="num">${Math.round(p.wall_seconds||0)}</td><td class="small">${esc(p.subtype)}</td></tr>`).join('')}</table>`;
  h += `<h2>About this dossier</h2><p>${esc(PRODUCT.disclaimer||'')}</p><p>${esc(PRODUCT.correction_note||'')}</p>`;
  section('sources','Sources',h);
})();

/* ---------- mount ---------- */
const main = document.getElementById('main'), nav = document.getElementById('nav');
sections.forEach((s,i)=>{ const sec=document.createElement('section'); sec.className='page'; sec.id='sec-'+s.key; sec.innerHTML=s.html; main.appendChild(sec);
  const li=document.createElement('li'); li.innerHTML=`<a href="#${s.key}" data-key="${s.key}">${esc(s.label)}</a><span class="n"></span>`; li.querySelector('a').addEventListener('click',e=>{e.preventDefault(); show(s.key);}); nav.appendChild(li); });
// counts in nav
const flagsN = F&&F.primary&&F.primary.ratios&&F.primary.ratios.flags ? F.primary.ratios.flags.length : 0;
nav.querySelector('[data-key="ratios"]').parentNode.querySelector('.n').textContent = flagsN ? flagsN+' flags' : '';
if(A&&A.premortem) nav.querySelector('[data-key="verdict"]').parentNode.querySelector('.n').textContent = A.health_score ? A.health_score.score+'/100' : '';
function show(key){ sections.forEach(s=>{ document.getElementById('sec-'+s.key).classList.toggle('active', s.key===key); }); nav.querySelectorAll('a').forEach(b=>b.setAttribute('aria-current', b.dataset.key===key?'true':'false')); if(location.hash!=='#'+key) history.replaceState(null,'','#'+key); window.scrollTo({top:0}); }
show((location.hash||'#cover').slice(1).replace(/[^a-z]/g,'')||'cover');
if(!document.querySelector('.page.active')) show('cover');
window.addEventListener('hashchange',()=>{ const k=(location.hash||'#cover').slice(1).replace(/[^a-z]/g,''); if(sections.some(s=>s.key===k)&&!document.getElementById('sec-'+k).classList.contains('active')) show(k); });
document.addEventListener('keydown', e=>{ if(e.target.matches('input,textarea')) return; const i=sections.findIndex(s=>document.getElementById('sec-'+s.key).classList.contains('active'));
  if(/^[0-9]$/.test(e.key)){ const n=(+e.key===0?10:+e.key)-1; if(sections[n]) show(sections[n].key); }
  else if(e.key==='ArrowDown'||e.key==='j'){ if(sections[i+1]) show(sections[i+1].key); }
  else if(e.key==='ArrowUp'||e.key==='k'){ if(sections[i-1]) show(sections[i-1].key); } });

// evidence filter
const rank={evidence:1,inference:2,speculation:3};
document.querySelectorAll('input[name=basis]').forEach(r=>r.addEventListener('change',()=>{ const lvl=+document.querySelector('input[name=basis]:checked').value; document.querySelectorAll('[data-basis]').forEach(el=>el.classList.toggle('hidden-by-filter', (rank[el.dataset.basis]||2)>lvl)); }));
document.addEventListener('click', e=>{ const r=e.target.closest('.redact'); if(r) r.classList.toggle('open'); });
document.addEventListener('keydown', e=>{ if(e.key==='Enter'&&e.target.classList.contains('redact')) e.target.classList.toggle('open'); });

// scenario tiles
const det=document.getElementById('scen-detail');
if(det&&X){ const byQ={}; (X.scenarios||[]).forEach(s=>byQ[s.quadrant]=s);
  const render=q=>{ const s=byQ[q]; if(!s) return; document.querySelectorAll('.q').forEach(b=>b.setAttribute('aria-pressed', b.dataset.q===q?'true':'false'));
    det.innerHTML=`<div class="row"><span class="b speculation">scenario, speculative by design</span><span class="muted small">${esc(q.replace('_',' / '))}</span></div><h3 style="font-family:var(--serif);font-size:22px;margin:8px 0">${esc(s.name)}</h3>${prose(s.narrative)}<h3>What happens to the organization</h3><div class="kv"><div>Revenue</div><div>${esc(s.effect_on_org.revenue)}</div><div>Programs</div><div>${esc(s.effect_on_org.programs)}</div><div>Staff</div><div>${esc(s.effect_on_org.staff)}</div><div>Standing</div><div>${esc(s.effect_on_org.standing)}</div></div><h3>Early signals to watch</h3>${list(s.early_signals)}<h3>Readiness ${s.readiness.score}/5</h3><p class="small">${esc(s.readiness.rationale)}</p><h3>For a donor</h3><p class="prose">${esc(s.donor_implication)}</p>`; };
  document.querySelectorAll('.q').forEach(b=>b.addEventListener('click',()=>render(b.dataset.q)));
  render(X.most_likely_quadrant||'high_high'); }

// chart: revenue vs expenses by year
(function(){ const el=document.getElementById('chart'); if(!el) return; const R=F.primary.ratios; const ser=R.series.slice(-12);
  const W=940,H=300,padL=56,padR=16,padT=18,padB=34; const max=Math.max(...ser.flatMap(s=>[s.revenue||0,s.expenses||0]))*1.08; const n=ser.length; const gw=(W-padL-padR)/n; const bw=Math.min(22,(gw-10)/2);
  const y=v=>padT+(H-padT-padB)*(1-v/max); const ticks=4; let g='';
  for(let i=0;i<=ticks;i++){ const v=max/ticks*i; g+=`<line x1="${padL}" x2="${W-padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#e2e2e2"/><text x="${padL-8}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#2b2b2b">${money(Math.round(v))}</text>`; }
  let bars='';
  ser.forEach((s,i)=>{ const x0=padL+gw*i+(gw-(bw*2+2))/2; const rv=s.revenue||0, ex=s.expenses||0;
    const bar=(x,v,col,label)=>{ const yy=y(Math.max(v,0)), hh=Math.max(0,y(0)-yy); return `<g class="bar" data-tip="FY${s.year} ${label}: ${money(v)}"><rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw}" height="${hh.toFixed(1)}" fill="${col}" rx="0"/><rect x="${(x-4).toFixed(1)}" y="${padT}" width="${bw+8}" height="${H-padT-padB}" fill="transparent"/></g>`; };
    bars+=bar(x0,rv,'#000080','revenue')+bar(x0+bw+2,ex,'#800000','expenses');
    bars+=`<text x="${(x0+bw+1).toFixed(1)}" y="${H-padB+16}" text-anchor="middle" font-size="11" fill="#2b2b2b">${s.year}</text>`;
    if(i===n-1){ bars+=`<text x="${(x0+bw/2).toFixed(1)}" y="${(y(rv)-6).toFixed(1)}" text-anchor="middle" font-size="11" fill="#000080">${money(rv)}</text><text x="${(x0+bw*1.5+2).toFixed(1)}" y="${(y(ex)-6).toFixed(1)}" text-anchor="middle" font-size="11" fill="#800000">${money(ex)}</text>`; } });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Revenue and expenses by fiscal year">${g}<line x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}" stroke="#999999"/>${bars}</svg><div class="legend"><span><i style="background:#000080"></i>Revenue</span><span><i style="background:#800000"></i>Expenses</span><span class="muted">last ${n} filed years</span></div><div class="tip" id="tip"></div>`;
  const tip=document.getElementById('tip'); el.querySelectorAll('.bar').forEach(b=>{ b.addEventListener('mousemove',e=>{ tip.style.display='block'; tip.textContent=b.dataset.tip; const r=el.getBoundingClientRect(); tip.style.left=(e.clientX-r.left+12)+'px'; tip.style.top=(e.clientY-r.top-28)+'px'; }); b.addEventListener('mouseleave',()=>tip.style.display='none'); });
})();

// print the brief
document.addEventListener('click', e=>{ if(e.target.id==='print-brief'){ document.body.classList.add('print-brief'); show('brief'); setTimeout(()=>{ window.print(); document.body.classList.remove('print-brief'); }, 50); } });
// chrome
const orgName=((I&&I.common_name)||M.org_name||'').split(/\s+\/\s+|\s+\(/)[0].trim();
document.title=(orgName?orgName+' · ':'')+(PRODUCT.name||'Dossier');
document.getElementById('brand-name').textContent=orgName||PRODUCT.name||'Dossier';
document.getElementById('brand-sub').textContent=[I&&I.legal_name?String(I.legal_name).split(/\s+\(/)[0]:'', I&&I.ein?'EIN '+I.ein:'', I&&I.hq?[I.hq.city,I.hq.state].filter(Boolean).join(', '):''].filter(Boolean).join(' · ');
document.getElementById('topnav').innerHTML=`[ <a href="${esc(NAV.home_href||'../index.html')}">&#9668; ${esc(NAV.home_label||'All dossiers')}</a>${NAV.landing_href?` | <a href="${esc(NAV.landing_href)}">About ${esc(PRODUCT.name||'Dossier')}</a>`:''}${NAV.about_href?` | <a href="${esc(NAV.about_href)}">About</a>`:''} ]`;
document.getElementById('stripe-l').innerHTML=`<strong>${esc(PRODUCT.name||'Dossier')}.</strong> For donor deliberation. Compiled ${esc(M.last_run||'')} from public records.${SAMPLE?' <strong>Sample.</strong> '+esc(PRODUCT.sample_note||''):''}`;
document.getElementById('stripe-r').textContent='';
document.getElementById('meta').innerHTML=`Keys 1–9 and 0 jump to sections; j and k move. Click a blacked-out line to read it.`;
const srcCount=(()=>{ try{ return document.querySelectorAll('#sec-sources table a').length; }catch(e){ return 0; } })();
document.getElementById('status').innerHTML=`<span>${esc(PRODUCT.name||'Dossier')} is a service of ${PRODUCT.owner?esc(PRODUCT.owner):'Noah Maier'}.</span><span>Compiled ${esc(M.last_run||'')}.</span><span>${srcCount} sources cited.</span>${INTERNAL?`<span>Internal: ${Object.keys(M.phases||{}).length} agent phases, $${Object.values(M.phases||{}).reduce((s,p)=>s+(p.cost_usd||0),0).toFixed(2)} model spend, ${esc(M.model||'')} / ${esc(M.tier||'quality')}.</span>`:''}<br><span class="small muted">${esc(PRODUCT.disclaimer||'')}</span>`;

})();
