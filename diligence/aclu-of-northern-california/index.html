 about $16.8M sits below the $19.8M cost level.", "source": "https://projects.propublica.org/nonprofits/organizations/940279770", "basis": "inference"}, {"fact": "The FY25 jump is unexplained. Non-national contributions added $6.67M, and any bequest share is unknown.", "source": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990", "basis": "evidence"}, {"fact": "Reported restructuring in October 2024 came with about 27 months of net assets on hand at FYE 3/2024, so a large cushion did not prevent cuts. Motive is my inference, and the reporting is anonymous and single-source.", "source": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "basis": "inference"}, {"fact": "Reported employees fell from 130 to 117 between the FY24 and FY25 filings.", "source": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990", "basis": "evidence"}, {"fact": "The strategic framework is refreshed with each presidential term, tying planning to the federal cycle.", "source": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "basis": "evidence"}, {"fact": "Fresno recruiting is recent, so that capacity would be among the newest to defend. Which posts would be cut first is speculation.", "source": "https://legalalphabet.com/job/staff-attorney-senior-staff-attorney-job-at-aclu-of-northern-california-in-fresno", "basis": "speculation"}], "warning_signs": ["FY26 or FY27 Foundation revenue under $18M with expenses still rising", "501(c)(4) program revenue falling from $5.66M", "Member count stalling at or below 120,000", "Fresno or Sacramento postings stop or stay unfilled", "The framework successor to 2025-2028 mentions consolidation", "WARN filing or 45-day notices"]}, {"rank": 2, "failure_mode": "Rulings without residue: the marquee wins are stayed, reversed, expired or unenforced, and the organization still cannot show what changed for people.", "mechanism": "1) Donors give on the courthouse-arrest and re-arrest rulings. 2) Appellate courts narrow class or APA relief, or the policies are reissued in new form. 3) Settlements expire or go unmonitored. 4) Attorney time moves to the next emergency, because the stated screen is a ruling, not a measured effect. 5) By 2031 a donor asks what lasted and gets a list of filings and orders, with no arrest, stop or compliance data. The organization is not disgraced; the donor simply bought headlines more than durable change. Probability is defined as: at least two of Sequen, Garro Pinchi, UFW and Siskiyou reversed, lapsed or unenforced by 2031, and still no published effect data.", "probability": 0.4, "horizon": "2027-2031", "evidence_chain": [{"fact": "TPS wins at district and circuit level were stayed, and Mullin v. Doe held review of non-constitutional claims barred. NorCal's exact role is not established.", "source": "https://en.wikipedia.org/wiki/National_TPS_Alliance_v._Noem", "basis": "evidence"}, {"fact": "The Ninth Circuit lifted the UFW injunction on standing on Aug 24, 2026.", "source": "https://www.turlockjournal.com/news/crime/federal-court-temporarily-lifts-injunction-protecting-valley-from-sweeps-as-immigration-arrests-rise-in-stanislaus/", "basis": "evidence"}, {"fact": "The Zepeda Rivas settlement expired on June 9, 2025 by its terms.", "source": "https://www.aclunorcal.org/our-work/legal-docket/zepeda-rivas-v-jennings-immigration-detention", "basis": "evidence"}, {"fact": "EFF and the affiliate allege 254,131 Marin sharing events in November 2024, after a 2022 settlement barred out-of-state sharing, and sent the demand letter almost two years later. This is an allegation.", "source": "https://www.eff.org/deeplinks/2026/10/we-demand-more-information-how-marin-cops-illegally-shared-flock-alpr-data", "basis": "evidence"}, {"fact": "The Legal Director's screen asks 'Can we get a ruling with a positive impact?'; no outcome evaluation was found.", "source": "https://brownpoliticalreview.org/defending-civil-liberties/", "basis": "evidence"}, {"fact": "No target specific enough to fail was found in the framework post. The full framework was not read.", "source": "https://www.aclunorcal.org/blog/forging-ahead-clear-eyes-and-strong-resolve", "basis": "evidence"}], "warning_signs": ["Ninth Circuit stay or reversal in Sequen or Garro Pinchi", "UFW remand ends without a restored injunction", "No Siskiyou auditor report or SF property report made available on request", "Annual reports keep counting cases and members with no after-ruling data", "Further evidence that Marin-style breaches were found late"]}, {"rank": 3, "failure_mode": "The hidden hinge: the national flow changes, and a third of revenue moves on a formula no donor can see.", "mechanism": "1) National changes its sharing rules, or its own revenue falls from the $306.8M FY25 peak. 2) The $7.77M flow falls toward the FY24 level of $5.26M or lower. 3) The Foundation loses $2.5M or more with no local cause and no local control. 4) Because the flow is reported as contributions, the headline fundraising looks better than the affiliate's own fundraising, so the board may discover the gap late. 5) A secondary embarrassment: a major donor learns afterward that a 'local' gift was shared, or that the affiliate's local fundraising is costlier than the ratios implied.", "probability": 0.3, "horizon": "2027-2031", "evidence_chain": [{"fact": "Schedule R shows $7,765,506 from ACLU Foundation Inc on line 1c (from related organizations) and $501,219 of reimbursement paid to it.", "source": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990ScheduleR", "basis": "evidence"}, {"fact": "That is 35.6% of FY25 revenue, up from $5.26M in FY24.", "source": "https://projects.propublica.org/nonprofits/full_text/202500369349301225/IRS990", "basis": "inference"}, {"fact": "The donor FAQ confirms gifts are shared with national and gives no formula in the text read.", "source": "https://www.aclunorcal.org/donate/frequently-asked-questions", "basis": "evidence"}, {"fact": "Excluding national money, FY25 cost to raise a dollar is about $0.16 rather than $0.10 (my arithmetic: $2.02M over $12.46M). This overstates it if membership costs sit elsewhere or if national money is partly earned locally.", "source": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990", "basis": "inference"}, {"fact": "National subsidies to smaller affiliates are reported as discretionary, and Wyoming lost support in 2015. Whether this applies to a large affiliate is unknown.", "source": "https://en.wikipedia.org/wiki/American_Civil_Liberties_Union", "basis": "speculation"}], "warning_signs": ["Related-organization contributions under $6M on Part VIII or Schedule R", "National's revenue falling in its next filings", "Refusal to give the formula in writing", "Line 1c shrinking while affiliate appeals stay urgent"]}, {"rank": 4, "failure_mode": "An unprepared handover: the top job and finance function change during a downturn, and internal conflict surfaces in public.", "mechanism": "1) A long executive tenure ends at some point inside the horizon; this says nothing about any individual's plans. 2) It lands near the 2028 framework renewal and possibly a revenue fall. 3) The public voice and institutional memory sit in one role, while the chair and other senior posts have recently changed. 4) Without a practiced transition, the new leader inherits cuts, a union contract and legal staff with wide autonomy. 5) Attorney departures reduce docket capacity, and accounts of the 2024 restructuring re-emerge because they were never publicly settled.", "probability": 0.25, "horizon": "2027-2031", "evidence_chain": [{"fact": "Executive Director in post since 2009, and a search today found no announced departure or successor.", "source": "https://www.aclunorcal.org/bios/abdi-soltani/", "basis": "evidence"}, {"fact": "The Executive Director presents the year in review, hosts every 2026 tour stop and was first guest on the new podcast.", "source": "https://www.aclunorcal.org/tour/", "basis": "evidence"}, {"fact": "FY25 990s list a COO and chair not matching the current staff and board pages. The current CFO-level officer is not established.", "source": "https://www.aclunorcal.org/about/board-of-directors", "basis": "inference"}, {"fact": "An anonymous tipster alleged leadership was pushing out long-time legal staff in 2024. Unverified; the organization did not respond.", "source": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "basis": "evidence"}, {"fact": "The Legal Director describes 'a lot of autonomy' for attorneys and 'difficult internal conversations'.", "source": "https://brownpoliticalreview.org/defending-civil-liberties/", "basis": "evidence"}], "warning_signs": ["The chair cannot describe a board-approved succession plan", "Finance lead unnamed or changing again", "Unannounced exits among legal directors or senior attorneys", "Public statements from Local 20 about bargaining or layoffs", "Executive departure announced with an interim and no search timetable"]}, {"rank": 5, "failure_mode": "Federal action turns the c(3)/c(4) structure into the battlefield.", "mechanism": "1) Federal review of advocacy nonprofits reaches an ACLU entity or a close peer. 2) Examiners focus on shared payroll, cost allocation and grants for legislative purposes. 3) DAF sponsors, which supply the largest named gifts, pause before any finding. 4) Legal costs and senior time rise; deductibility doubts hit major gifts. 5) Separating a Foundation that employs everyone from a Union that appoints its board proves slow. The organization likely survives, with reduced breadth. No evidence of any such action against this organization was found.", "probability": 0.15, "horizon": "2026-2029 for the trigger; effects through 2031", "evidence_chain": [{"fact": "Schedule R shows $2,773,540 of shared paid employees, $85,555 of shared assets, $345,581 of reimbursements and a $725,000 grant between the Foundation and the Union.", "source": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990ScheduleR", "basis": "evidence"}, {"fact": "Schedule R states that Foundation directors are appointed by the Union. It also marks the Union as not a 512(b)(13) controlled entity.", "source": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990ScheduleR", "basis": "evidence"}, {"fact": "Senators opened an inquiry on Sept 3, 2026 after a reported Treasury review. The ACLU was not named in the material read.", "source": "https://www.finance.senate.gov/imo/media/doc/09032026lettertobessentandbisignanoontargetingnonprofits.pdf", "basis": "evidence"}, {"fact": "NonProfit Times offers a skeptical view of an IRS crackdown, so the threat may stay rhetorical.", "source": "https://thenonprofittimes.com/npt_articles/threats-and-bluster-the-irss-black-cloud-over-the-nonprofit-sector/", "basis": "evidence"}, {"fact": "DAF conduits top the named 2025 grants: $1.50M from DAFgiving360 and $663,297 from Fidelity Charitable.", "source": "https://causeiq.com/organizations/american-civil-liberties-union-foundation-of-north,940279770", "basis": "evidence"}, {"fact": "DAF sponsors pulling back before a finding is a hypothesis.", "source": null, "basis": "speculation"}], "warning_signs": ["Any IRS examination, subpoena or designation touching an ACLU entity or close peer", "A major DAF sponsor restricting grants to named advocacy groups", "Treasury's reply to the Senate letter", "Foundation-to-Union grants rising above $725,000 without independent allocation review", "Sudden departure of finance or general counsel staff"]}], "gift_risk": [{"gift_type": "small_unrestricted", "risk": "low", "rationale": "The organization is solvent and audited, and the amount at stake is small. The real risks are clerical: a 'membership' payment or a check to 'ACLU of Northern California' goes to the 501(c)(4) and is not deductible; some forms sit on the national platform; and part of a gift may be shared with national. The gift changes nothing measurable.", "risk_reducers": ["Pay 'ACLU Foundation of Northern California', EIN 94-0279770", "Confirm the receiving entity on any action.aclu.org form", "Keep the receipt showing the 501(c)(3) name"]}, {"gift_type": "major_unrestricted", "risk": "moderate", "rationale": "Loss risk is low; waste-of-leverage risk is real. Foundation unrestricted net assets are about 22.7 months of expenses, and only about 7% of the FY25 revenue rise reached FY25 expenses. FY26 may look different, but it is unfiled. The gift may be shared under an unpublished formula, and the donor gets no formal voice. Nothing specific fails if it does not arrive.", "risk_reducers": ["Get FY26 actuals and the FY27 budget first", "Written confirmation of the share, if any, going to national", "Ask for the board-designated breakdown and reserve policy", "Annual meeting with the chair and finance lead", "Consider timing the gift for a down year"]}, {"gift_type": "major_restricted", "risk": "moderate", "rationale": "This is the better form, with three cautions. Money is fungible when reserves are this large, so restriction may displace rather than add. A restructuring could end a program, and the 2024 reports show that public notice should not be expected. Whether restricted gifts escape national sharing is unknown. The organization holds $8.35M of donor-restricted net assets, which shows it can handle restricted funds.", "risk_reducers": ["Gift agreement naming positions and geography, for example Central Valley attorneys", "A written additionality statement against the prior-year baseline", "Written sharing exemption", "Notice and a right to redirect if the program is cut", "Reporting on outcomes and compliance, not filings", "Budget line for monitoring one or two major wins"]}, {"gift_type": "multi_year_pledge", "risk": "moderate", "rationale": "This form best matches the risk, because revenue is most likely to be scarce after headlines fade. The pledge length exposes the donor to leadership change, program consolidation and any federal action on deductibility. It is low risk only if staged. Unstaged, it would be elevated.", "risk_reducers": ["Annual staged payments weighted to FY29-FY31", "Release conditions: audit delivered, positions filled, outcome report received", "Exit clause on loss or suspension of exemption, or on program closure", "Tax advice before each payment if federal action emerges", "Check payee and deductibility before each payment"]}, {"gift_type": "endowment_or_capital", "risk": "elevated", "rationale": "No capital need or endowment plan was found. Combined net assets are about $63.65M, and national holds $779.7M. Money locked up here does not answer the actual problem, which is revenue swings and capacity. Control runs through a Foundation board appointed by the Union, and no investment or reserve policy was read. A permanent gift would also outlast any leverage the donor has, and would sit through the transition and federal risks above.", "risk_reducers": ["Give only against a written capital plan and spending policy", "Term-limited, quasi-endowment structure with defined draws for attorney positions", "Independent investment oversight and annual reporting", "Reversion or redirect clause on exemption loss, if counsel can draft one"]}, {"gift_type": "affiliated_c4", "risk": "moderate", "rationale": "The Union (EIN 94-2151925) is a legitimate route if legislation and ballot work are the goal and no deduction is needed. It held $17.85M of net assets and ran a $3.44M surplus in FY25, so need is not evident. Much of its money appears to go on to ACLU California Action, about $2.1M-$2.6M a year (secondary source), where NorCal's own contribution cannot be isolated. Recent results are mixed: SB 852 was signed, but Prop 36, SF Props E and F were lost and SB 1013 died in 2026. It offers members a formal vote that deductible donors lack.", "risk_reducers": ["Ask for grants to ACLU California Action and bills sponsored and signed, by year", "Get the campaign budget and post-election review", "Earmark for a specific bill or campaign, with lawyer review of the rules", "Confirm non-deductibility with your adviser"]}], "efficiency": {"verdict": "Fair at best, and not provable. Roughly $25M a year buys a standing legal team that wins real rulings in coalition, but only a few of them have lasted, and no one measures what they do for people. The absence of that evidence is a transparency finding, not a neutral fact.", "change_per_dollar": "FYE 3/2025 spending was about $25.2M after removing the $725,000 grant between the two entities. Other flows and in-kind legal help are excluded. Changes that landed in that year were poor: Prop 36 passed, the Grants Pass fallout continued, and the March 2025 TPS order later failed. Work funded then paid off afterward. Strongest: Pablo Sequen v. Albarran, a December 2025 regional stay and June 2026 vacatur of courthouse-arrest policies, co-lead with three co-counsel, on appeal, significance 4. A separate New York case reached a nationwide ruling on Oct 1, 2026, so the fair unique claim is about nine months of regional relief, earlier nationwide relief and hold-room relief. One secondhand report says no one was detained at San Francisco immigration court after the stay. Also real: Garro Pinchi (too early), UFW (lifted on standing after about 16 months), Siskiyou and the San Francisco property settlement (significance 2). Weakest: National TPS Alliance, the largest population and no durable result, with NorCal's role unclear; among local items, Coalition on Homelessness, which ended with the city's existing policy plus monitoring.", "trend": "Mixed. Raw combined spending was flat from FY23 ($26.5M, possibly including a one-off $3M national grant) to FY25 ($25.2M net). Reach widened from two facilities and one county to regional and nationwide orders, partly because federal policy created bigger targets. Durability did not improve. No true per-dollar comparison exists, because 2025-26 spending is unfiled.", "north_star_metric": null, "program_ratio_note": "Program share is 78.0% on the FY25 990, against a peer median of 75.3%; three-year range 76.9%-78.0%. The audit basis shows about 82% in FY24 because it includes $3.9M of donated legal services. That is acceptable but says nothing about results. The filings also classify a large shared-staff arrangement, so the split depends on an allocation no one outside has tested.", "what_ratios_miss": "Ratios miss whether a ruling lasted, who else earned it, and whether it changed conduct. They also miss the in-kind subsidy: $3.9M-$6.8M a year of donated legal work means the true cost of results is above the cash figure, and pro bono supply is reportedly weakening. They miss that 38.4% of contributions came from national, which flatters cost to raise. They also miss about $63.65M of combined net assets, and they cannot show what was given up in the 2024 restructuring.", "spending_matches_strategy": "Partly. The money does match a law-led model: five of the seven best-paid people hold legal titles, and deductible money carries the docket. It matches the stated plural theory less clearly: the Executive Director says courts cannot be the final bulwark, while the Legal Director speaks of funneling resources to legal advocacy, seen only in excerpt. The Foundation-to-Union grant was $725,000. The Union's own grants, reportedly mostly to ACLU California Action, carry the state work. No budget by program was found, so the 'firewall' strategy cannot be tested in dollars. The FY25 surge went mostly to rebuilding reserves, with expenses up only $0.70M.", "versus_peers": "No per-dollar ranking is defensible. LCCRSF co-counseled Sequen, Zepeda Rivas and Coalition on Homelessness on $4.44M of expenses, about 17% of this pair's spending, and claims the same results. That is a caution against assuming scale produces proportional credit, though workloads are unknown and this organization has a far wider docket. On overhead it is ordinary: program share at the 62nd percentile and cost to raise a dollar near the median.", "basis": "inference"}, "ratio_anomalies": [{"key": "margin_3y", "label": "Average operating margin, FY23-FY25: -10.32% (red)", "benign": "One bad year on a basis that excludes unrealized gains. FY24's -57.13% drives the average; net assets fell only $3.51M against a $6.95M 990 deficit, and FY25 returned to +9.27%.", "worrying": "Costs reset above sustainable revenue. Three-year average revenue of $16.8M is below $19.8M of expenses, combined audits show two straight losses of about $3.3M, and FY25 may be a one-off.", "evidence_supports": "Benign on solvency, worrying on structure. The flag overstates distress but points at the real issue. The label 'sustained' is wrong, since the 990 series shows no consecutive deficits at FY25, though the audit does show consecutive losses before FY25.", "settling_question": "What are FY26 actual revenue and expenses, excluding bequests and national money?"}, {"key": "contrib_share", "label": "Contributions as share of revenue: 92.59% (amber)", "benign": "Normal for this model: the peer median is 91.9%, dues sit in the Union, and no single named funder dominates.", "worrying": "All revenue depends on public mood and on unnamed individuals, bequests and DAFs, and fee income is lumpy.", "evidence_supports": "Benign as a ratio, because it is typical of peers. The real exposure is captured by volatility and the national share.", "settling_question": "What share of FY25 contributions came from the top ten gifts and from bequests?"}, {"key": "related_org_contrib_pct", "label": "Contributions from related organizations: 38.4% (amber)", "benign": "This is largely NorCal-attributable money passing through federation gift-sharing, so it is really local support booked via national.", "worrying": "It is a discretionary or formula-driven subsidy that the affiliate does not control, and without it FY25 revenue would have covered about 71% of expenses.", "evidence_supports": "Undetermined. Schedule R confirms the amount and that it came from ACLU Foundation Inc. The FAQ confirms sharing exists. Nothing read splits local-origin money from national support. This is the largest unresolved financial fact.", "settling_question": "Of the $7,765,506, how much was raised from Northern California donors, and what agreement sets the amount?"}, {"key": "revenue_volatility", "label": "Foundation revenue volatility: 34.4 points (amber)", "benign": "Bequests, large one-off gifts and court fee timing cause lumpiness, which reserves are built to absorb.", "worrying": "Revenue follows the political threat cycle, so swings will recur and capacity will follow them.", "evidence_supports": "Both, with more support for the cycle reading than can be proven. Bequests were $4.66M in FY22, and program revenue fell from $2.80M to $0.48M in FY24. The FY25 jump is unexplained; national's 65.7% rise in the same year points to a shared cause, but that is inference.", "settling_question": "Can you break FY22-FY26 revenue into bequests, large gifts, recurring individual gifts, national and fees?"}, {"key": "affiliate_94-2151925:top_paid_pct", "label": "Union: highest-paid person as share of expenses, 6.72% (red)", "benign": "A false positive. The ratio divides total pay across both entities by Union-only expenses. The Union's own column for that person is $37,835, about 0.6%.", "worrying": "The $413,453 total exceeds the Executive Director's pay and may include transition or retirement items that were not disclosed in what was read.", "evidence_supports": "Benign as a ratio. The separate question of why that one total is so high stays open.", "settling_question": "Did the FY25 total for the Legal-Policy Director include any one-time, retirement or transition payments?"}, {"key": "affiliate_94-2151925:revenue_volatility", "label": "Union revenue volatility: 26.7 points (amber)", "benign": "Remittance timing from national: the balance due from the National Union fell from $2.88M to $422,114 during FY24.", "worrying": "Membership income is weakening beneath a growth story: FY25's $5.66M remains below FY20-FY22 levels ($6.2M-$7.3M), despite a claim of over 120,000 members, up 20%.", "evidence_supports": "Undetermined; the membership accounting note was not read. The gap between member claims and revenue is worth a direct question.", "settling_question": "What are member counts and dues received for each year FY20-FY26, on the same definitions?"}, {"key": "affiliate_13-6213516:officer_comp_pct,reserves_months,contrib_share,revenue_volatility", "label": "National ACLU Foundation flags: officer pay 1.73%, reserves 38.1 months, contributions 93.86%, volatility 29.0", "benign": "A large endowed national charity, with ratios that follow from its scale and restricted funds.", "worrying": "It matters here only if national's volatility or reserve choices pass through to NorCal's $7.77M flow.", "evidence_supports": "Not researched; national is outside this assessment. National's capacity is not the issue. Its allocation rules are.", "settling_question": "Does national have any right to change NorCal's share unilaterally, and on what notice?"}], "advisor_questions": [{"question": "Is anyone already doing this, and better?", "status": "partial", "answer": "On each issue, yes, someone is doing it; across all issues, no one in the peer set reviewed. LCCRSF co-counsels the key immigration cases at $4.4M. EFF is stronger in surveillance. Public Advocates and Asian Law Caucus overlap on racial and economic justice and AAPI communities. 'Better' cannot be judged, because no outcome comparison exists. The S.D.N.Y. case shows the marquee win was not unique.", "basis": "inference", "confidence": 0.6, "sources": [{"url": "https://lccrsf.org/cases/pablo-sequen-v-albarran-ice-courthouse-arrests-unlawful-detention-conditions/", "title": "LCCRSF case page"}, {"url": "https://aclu.org/press-releases/federal-court-strikes-down-ices-courthouse-arrest-policy-nationwide", "title": "ACLU release, Oct 1, 2026"}, {"url": "https://www.kqed.org/news/12102922/south-bay-judge-rules-san-joses-flock-cameras-dont-invade-privacy", "title": "KQED: San Jose Flock ruling"}]}, {"question": "What is the counterfactual if this organization disappeared, and if this gift does not arrive?", "status": "partial", "answer": "If it disappeared: active class actions would need new counsel, issue work would scatter to stretched peers, and multi-issue state and local advocacy with a member base would be hardest to replace. The Central Valley gap may be real but was not specifically searched. National would probably rebuild the territory (speculation). If a gift of $25,000-$250,000 does not arrive: nothing identifiable fails. Sustained shortfalls do cost capacity, as the 2024 reports and the staff fall from 130 to 117 suggest.", "basis": "inference", "confidence": 0.55, "sources": [{"url": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990", "title": "Foundation FY25 Form 990"}, {"url": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "title": "Above the Law, Oct 29, 2024"}, {"url": "https://legalalphabet.com/job/staff-attorney-senior-staff-attorney-job-at-aclu-of-northern-california-in-fresno", "title": "Fresno staff attorney listing"}]}, {"question": "Is there room for more funding, and what happened to the last big increase?", "status": "answered", "answer": "Room exists for up to about $1M a year in defined attorney or regional capacity (my judgment), and money does not appear to be the binding constraint as of FYE 3/2025. The last increase: FY25 revenue rose $9.67M, while expenses rose $0.70M, about 7% of the increase. Net assets rose Growing on immigration enforcement, the one front with counts: San Francisco area of responsibility arrests were 2,928 in Jan-Jul 2025 and 4,970 in Jan-Jul 2026. DHS calls one analysis cherry-picked. Surveillance exposure is growing while law is contested. No trend measure was found for police practices, voting or reproductive rights locally. Post-2028 enforcement is unknown.", "basis": "evidence", "confidence": 0.7, "sources": [{"url": "https://abc7news.com/post/ice-arrests-san-francisco-bay-area-70-uc-berkeley-data-project-finds/19754574/", "title": "ABC7: Bay Area ICE arrests"}, {"url": "https://www.kqed.org/news/12097313/northern-california-ice-arrests-surged-this-summer", "title": "KQED, Aug 31, 2026"}]}, {"question": "Is this a program or an organization (founder dependency, board strength, survivability)?", "status": "answered", "answer": "An organization, 92 years old, with no founder dependency, member-elected Union directors and a national federation behind it. Survival is not the issue. The dependency is moderate and concentrated in the Executive Director's public role, after about 17 years, with no succession evidence found. Board strength is hard to judge: no public statement by any director was found, and board sizes differ between filings and the site.", "basis": "inference", "confidence": 0.65, "sources": [{"url": "https://www.aclunorcal.org/bios/abdi-soltani/", "title": "Executive Director bio"}, {"url": "https://www.aclunorcal.org/about/board-of-directors", "title": "Board of Directors"}, {"url": "https://projects.propublica.org/nonprofits/full_text/202620339349300347/IRS990ScheduleR", "title": "Foundation FY25 Schedule R"}]}, {"question": "What do they say they are versus what the money says they are?", "status": "partial", "answer": "They say: a non-partisan guardian using courts, politics and community power. The money says: a law firm first, on a Foundation payroll that carries both entities, with five of the seven best-paid in legal roles. It ainties", "The verdict: health score, pre-mortem, gift risk by gift type, the questions to ask"], "turnaround": "About an hour"}, {"id": "deep", "name": "Deep", "price_usd": 50, "pipeline_tier": "quality", "includes": ["Everything in Standard, researched at the highest setting", "Your supplied documents read and cited: audits, strategic plans, board decks, proposals", "An interview sheet built from the verdict's questions", "A second verdict after your conversation with the organization, showing what changed"], "turnaround": "Same day, with a second verdict after your interview"}], "disclaimer": "Dossiers are compiled from public records by research agents and arithmetic on filed numbers. Every claim is tagged evidence, inference or speculation and carries its sources. Nothing in a dossier is legal, financial, tax or investment advice, and the organization assessed has not reviewed it. Verify anything you intend to act on.", "correction_note": "Organizations and readers may request a correction to any factual claim. Corrections that check out are made and noted on the page.", "sample_note": "Sample dossier, published to show what the service produces. The organization did not commission it and has not reviewed it. All figures come from public filings and published sources linked in each section.", "not_included": ["Psychological profiles of individuals. Culture is read at the level of the organization, from public professional material only.", "Private or leaked material.", "A recommendation to give or not give. The dossier lays out the risks, the strengths and the questions; the decision stays yours."]}, "internal": false, "sample": true, "nav": {"home_href": "../../index.html#diligence-aclu-of-northern-california", "home_label": "Noah's Weblog", "landing_href": "../", "about_href": "../../about.html"}};

    const pix = (F.primary.part_ix&&F.primary.part_ix.length) ? F.primary.part_ix : F.primary.ratios_from_part_ix;
    if(pix&&pix.length){
      h += `<h2>Functional expenses (Form 990 Part IX)</h2><table><tr><th>FY</th><th class="num">Total</th><th class="num">Program</th><th class="num">Management</th><th class="num">Fundraising</th><th class="num">Cost to raise $1</th><th></th></tr>${pix.map(r=>`<tr><td>${r.year}</td><td class="num">${money(r.total)}</td><td class="num">${money(r.program)} <span class="muted">${pct(r.program_pct)}</span></td><td class="num">${money(r.management)} <span class="muted">${pct(r.management_pct)}</span></td><td class="num">${money(r.fundraising)} <span class="muted">${pct(r.fundraising_pct)}</span></td><td class="num">${r.cost_to_raise_a_dollar==null?'—':'$'+r.cost_to_raise_a_dollar.toFixed(2)}</td><td class="small"><a href="${esc(r.source_url)}" target="_blank" rel="noopener">990</a></td></tr>`).join('')}</table><p class="small muted">${esc(pix[0].provenance||'Parsed directly from the e-filed return as rendered by ProPublica.')}</p>`;
    }
    const fd = F.primary.filing_detail&&F.primary.filing_detail[0];

      h += `<h2>Governance answers, FY${fd.year} return</h2><div class="kv"><div>Board</div><div>${fd.voting_members??'—'} voting members, ${fd.independent_voting_members??'—'} independent${ind!=null?` (${ind}%)`:''}</div><div>Staff</div><div>${fd.employees??'—'} employees, ${fd.volunteers??'—'} volunteers</div><div>From related organizations</div><div>${money(fd.contrib_related_orgs)}</div><div>Government grants</div><div>${money(fd.contrib_government)}</div><div>Noncash gifts</div><div>${money(fd.contrib_noncash)}</div><div>Conflict of interest policy</div><div>${yes(g.conflict_of_interest_policy)}</div><div>Whistleblower policy</div><div>${yes(g.whistleblower_policy)}</div><div>Board saw the 990 before filing</div><div>${yes(g.board_reviewed_990)}</div><div>Independent review of CEO pay</div><div>${yes(g.ceo_comp_independent_review)}</div><div>Separate independent audit</div><div>${yes(g.separate_audit)}${g.consolidated_audit==='Yes'?' (consolidated audit: yes)':''}</div><div>Excess benefit transaction</div><div>${yes(g.excess_benefit_transaction)}</div><div>Loans to or from insiders</div><div>${yes(g.loans_to_or_from_insiders)}</div><div>Business with insiders</div><div>${yes(g.business_with_insiders)}</div><div>Family or business ties among officers</div><div>${yes(g.family_or_business_relationships_among_officers)}</div><div>Diversion of assets</div><div>${yes(g.material_diversion_of_assets)}</div><div>Lobbying</div><div>${yes(g.lobbying_activities)}</div><div>Schedules filed</div><div>${(fd.schedules_present||[]).join(', ')||'—'}</div></div>`;
      if(fd.schedule_o){ h += `<details><summary><span class="r">O</span><span class="fm">Schedule O narrative, as filed</span><span class="pr">excerpt</span></summary><div class="in"><p class="small" style="max-width:none;white-space:pre-wrap">${esc(fd.schedule_o.replace(/ \| /g,'\n').slice(0,12000))}</p></div></details>`; }
    }

  if(F.affiliates&&F.affiliates.length){

    h += F.affiliates.map(a=>{const r=a.ratios, s=r.available?r.series[r.series.length-1]:{}; return `<tr><td class="wrap">${esc(a.entity.name||a.entity.ein)}</td><td>${esc(a.entity.ein)}</td><td>${s.year||'—'}</td><td class="num">${money(s.revenue)}</td><td class="num">${money(s.expenses)}</td><td class="num">${money(s.net_assets)}</td><td class="wrap small">${r.available?(r.flags||[]).map(f=>`<span class="light ${f.severity}"></span>${esc(f.label)} ${num(f.value)}${esc(f.unit)}`).join('<br>'):esc(r.reason||'no data')}</td></tr>`;}).join('')+`</table>`;
  }
  h += `<p class="small muted">${esc(R.method_note||'')}</p>`;

})();

/* ratios */
(function(){
  const R = F&&F.primary&&F.primary.ratios;
  if(!R||!R.available){ section('ratios','Ratios',`<h1>Ratios</h1>`+(R?`<div class="empty"><b>No ratios.</b> ${esc(R.reason||'')}</div>`:empty('The financial extract'))); return; }
  let h = `<h1>The weird ratios</h1><p class="sub">Arithmetic on filed numbers, thresholds scaled to the ${esc(R.size_band)} band. Flags prompt questions; they do not settle them.</p>`;
  const anomalies = {}; (A&&A.ratio_anomalies||[]).forEach(a=>anomalies[a.key]=a);
  const order = Object.values(R.ratios).sort((a,b)=>({red:0,amber:1,green:2,na:3}[a.flag]-{red:0,amber:1,green:2,na:3}[b.flag]));
  h += `<div class="ratios">`+order.map(r=>{
    const an = anomalies[r.key];
    return `<div class="ratio ${r.flag}"><div class="l"><span class="light ${r.flag}"></span>${esc(r.label)}</div><div class="v">${r.value==null?'—':num(r.value,2).replace(/\.?0+$/,'')}<small>${esc(r.unit)}</small></div><div class="f">${esc(r.formula)} · ${esc(r.year)}</div>${r.note?`<div class="why muted">${esc(r.note)}</div>`:''}${(R.flags.find(f=>f.key===r.key)||{}).why?`<div class="why">${esc(R.flags.find(f=>f.key===r.key).why)}</div>`:''}${an?`<div class="why"><b>Benign:</b> ${esc(an.benign)}<br><b>Worrying:</b> ${esc(an.worrying)}<br><b>Evidence supports:</b> ${esc(an.evidence_supports)}<br><b>Ask:</b> ${esc(an.settling_question)}</div>`:''}</div>`;
  }).join('')+`</div>`;
  const P = F.peer_comparison;
  if(P&&P.rows&&P.rows.length){
    h += `<h2>Against ${P.peer_count} peers</h2><p class="small muted">Peers were named by the landscape agent; their numbers come from the same Form 990 source. The band is the peer range, the tick the peer median, the dot this organization.</p><table><tr><th>Ratio</th><th class="num">This org</th><th class="num">Peer median</th><th>Range</th><th class="num">Percentile</th></tr>`;
    h += P.rows.map(r=>{const lo=Math.min(r.peer_min,r.subject==null?r.peer_min:r.subject), hi=Math.max(r.peer_max,r.subject==null?r.peer_max:r.subject), sp=(hi-lo)||1, x=v=>((v-lo)/sp*100).toFixed(1)+'%';
      return `<tr><td class="wrap">${esc(r.label)}</td><td class="num">${num(r.subject,2)}</td><td class="num">${num(r.peer_median,2)}</td><td style="min-width:180px"><div class="range"><div class="tr"></div><div class="band" style="left:${x(r.peer_min)};width:${((r.peer_max-r.peer_min)/sp*100).toFixed(1)}%"></div><div class="med" style="left:${x(r.peer_median)}"></div>${r.subject==null?'':`<div class="me" style="left:${x(r.subject)}" title="this organization"></div>`}</div></td><td class="num">${r.percentile==null?'—':r.percentile+'th'}</td></tr>`;}).join('')+`</table>`;
    h += `<table><tr><th>Peer</th><th>Relationship</th><th>FY</th><th class="num">Expenses</th><th>Highest paid</th><th class="num">Total pay</th></tr>${(P.peers||[]).map(p=>`<tr><td class="wrap">${esc(p.name)}</td><td class="small">${esc(p.relationship||'')}</td><td>${p.latest_year||'—'}</td><td class="num">${money(p.expenses)}</td><td class="wrap small">${esc(p.top_paid_name||'—')}</td><td class="num">${money(p.top_paid_total)}</td></tr>`).join('')}</table>`;
  } else h += `<p class="small muted">No peer comparison available (peers without EINs, or the landscape step has not run).</p>`;
  h += `<p class="small muted">${esc(R.method_note)}</p>`;
  section('ratios','Ratios',h);
})();

/* record */
(function(){

  if(S.program_service_accomplishments&&S.program_service_accomplishments.length){ h += `<h2>Program service accomplishments (Form 990 Part III)</h2><table><tr><th>FY</th><th>Program</th><th class="num">Expenses</th><th>Description</th></tr>${S.program_service_accomplishments.map(p=>`<tr><td>${p.year}</td><td class="wrap">${esc(p.program)}</td><td class="num">${money(p.expenses)}</td><td class="wrap">${esc(p.description)} <a class="small" href="${esc(p.source_url)}" target="_blank" rel="noopener">source</a></td></tr>`).join('')}</table>`; }

/* results */
(function(){
  if(!RS){ section('results','Results',empty('The results ledger')); return; }
  const spark = (series, w=160, h=36) => { const pts=(series||[]).filter(p=>p.value!=null).sort((a,b)=>a.year-b.year); if(pts.length<2) return pts.length===1?`<span class="small muted">${pts[0].year}: ${esc(pts[0].value_text||pts[0].value)}</span>`:'<span class="small muted">no series</span>';
    const xs=pts.map(p=>p.year), ys=pts.map(p=>p.value); const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys); const X=v=>6+(w-12)*((v-x0)/((x1-x0)||1)), Y=v=>h-6-(h-12)*((v-y0)/((y1-y0)||1));
    const d=pts.map((p,i)=>(i?'L':'M')+X(p.year).toFixed(1)+' '+Y(p.value).toFixed(1)).join(' ');
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${pts[0].year} to ${pts[pts.length-1].year}"><path d="${d}" fill="none" stroke="#000080" stroke-width="2" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${X(p.year).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="${p.kind==='actual'?3.5:2.5}" fill="${p.kind==='actual'?'#000080':'#ffffff'}" stroke="#000080" stroke-width="1.5"><title>${p.year} ${p.kind||''}: ${esc(p.value_text||p.value)}</title></circle>`).join('')}</svg>`; };
  const evq = q => badge((q||'unknown').replace(/_/g,' '), q==='independently_verified'?'evidence':q==='self_reported_with_data'?'inference':q==='contradicted'?'red':'speculation');
  const contrib = {lead:'green',co_lead:'green',one_of_many:'amber',claimed_contested:'amber',claimed_contradicted:'red'};
  const dur = {in_force:'green',partly_reversed:'amber',reversed:'red',too_early:'na',unknown:'na'};
  let h = `<h1>Results</h1><p class="sub">What changed in the world because of this organization, and what it cost. ${RS.mode?`Assessed ${esc(RS.mode.primary)}ly: ${esc(RS.mode.rationale)}`:''}</p>${prose(RS.verdict)}`;
  const outs=(RS.outcomes||[]).slice().sort((a,b)=>a.rank-b.rank);
  h += `<h2>Outcome harvest</h2><p class="small muted">The most significant changes over the last five years that the organization claims or can be shown to have contributed to. Significance 1 (local, minor, easily reversed) to 5 (structural, wide, durable). Contribution is the organization's fair share of the credit.</p>`;
  h += outs.map(o=>`<details${o.rank<=2?' open':''}><summary><span class="r">${o.rank}</span><span class="fm">${esc(o.what_changed)}</span><span class="pr"><span class="dots">${'●'.repeat(o.significance)}<span class="off">${'●'.repeat(Math.max(0,5-o.significance))}</span></span> ${o.year||''}</span></summary><div class="in"><div class="row" style="margin:6px 0 10px">${badge('contribution: '+o.contribution.replace(/_/g,' '), contrib[o.contribution]||'na')} ${badge('durability: '+o.durability.replace(/_/g,' '), dur[o.durability]||'na')} ${evq(o.evidence_quality)} ${badge(o.basis,o.basis)}${o.program?` <span class="small muted">${esc(o.program)}</span>`:''}</div><div class="kv"><div>For whom</div><div>${esc(o.for_whom)}${o.count?` · ${esc(o.count)}`:''}</div><div>Counterfactual</div><div>${esc(o.counterfactual)}</div><div>Others involved</div><div>${esc((o.others_involved||[]).join(', ')||'—')}</div><div>Evidence</div><div>${esc(o.evidence)}</div></div>${srcs(o.sources)}</div></details>`).join('') || '<p class="muted small">No outcomes could be established.</p>';
  h += `<h2>Failures and reversals</h2>`+((RS.failures_and_reversals&&RS.failures_and_reversals.length)?RS.failures_and_reversals.map(f=>claim({statement:`${f.consequence}${f.how_handled?'\n\nHow handled: '+f.how_handled:''}`,basis:f.basis,sources:f.sources}, `${f.year||''} ${f.what}`)).join(''):'<p class="muted small">None found in the public record. For an organization more than a few years old that is itself a finding.</p>');
  const d2=RS.dollars_to_change;
  if(d2){ const ns=d2.north_star||{}; const last=(ns.series||[]).slice().sort((a,b)=>b.year-a.year)[0];
    h += `<h2>Dollars to change</h2><div class="two"><div><h3>Latest year${d2.latest&&d2.latest.year?', FY'+d2.latest.year:''}${d2.latest&&d2.latest.spent?' · '+money(d2.latest.spent)+' spent':''}</h3>${prose(d2.latest&&d2.latest.summary)}</div><div><h3>Earliest reconstructed${d2.earliest&&d2.earliest.year?', FY'+d2.earliest.year:''}${d2.earliest&&d2.earliest.spent?' · '+money(d2.earliest.spent)+' spent':''}</h3>${prose(d2.earliest&&d2.earliest.summary)}</div></div>`;
    h += claim({statement:`${d2.qualitative_judgment}\n\nStrongest item: ${d2.strongest_item}\n\nWeakest item: ${d2.weakest_item}`,basis:d2.basis}, 'Portfolio judgment');
    if(ns.measure){ h += `<h3>North star: ${esc(ns.measure)} ${badge(ns.defensible?'defensible':'not defensible from public data', ns.defensible?'green':'amber')}</h3>${last?`<div class="row"><span class="ratio" style="padding:8px 14px"><span class="v" style="font-size:22px">${esc(last.value_text||last.value)}</span><span class="f"> ${last.year}</span></span>${spark(ns.series,320,60)}</div>`:''}<p class="small">${esc(ns.limits||'')}${ns.what_would_make_it_possible?`<br><span class="muted">What would make it possible: ${esc(ns.what_would_make_it_possible)}</span>`:''}</p>`; }
    else if(ns.what_would_make_it_possible) h += `<p class="small"><b>No defensible per-dollar measure.</b> ${esc(ns.what_would_make_it_possible)}</p>`; }
  if(RS.trend) h += `<h2>Trend</h2>`+claim({statement:RS.trend.rationale,basis:RS.trend.basis}, `Change per dollar: ${RS.trend.change_per_dollar.replace(/_/g,' ')} · reporting moving ${RS.trend.reporting_direction.replace(/_/g,' ')}`);
  if(RS.targets){ const r=RS.targets; h += `<h2>Says in advance what it will change?</h2>`+claim({statement:r.summary,basis:r.basis}, `Publishes targets: ${r.publishes_targets}`)+(r.examples&&r.examples.length?`<table><tr><th>Goal</th><th>Year</th><th>Stated</th><th>Result</th></tr>${r.examples.map(t=>`<tr><td class="wrap">${esc(t.goal)}</td><td>${esc(t.year||'—')}</td><td class="wrap">${esc(t.stated)}</td><td class="wrap">${esc(t.result)}${srcs(t.sources)}</td></tr>`).join('')}</table>`:''); }
  h += `<h2>Programs, by year</h2>`+(RS.programs||[]).map(p=>`<h3>${esc(p.program)} ${evq(p.evidence_quality)}</h3><table><tr><th>FY</th><th class="num">Expenses</th><th>Results claimed</th></tr>${(p.years||[]).slice().sort((a,b)=>b.year-a.year).map(y=>`<tr><td>${y.year}</td><td class="num">${money(y.expenses)}</td><td class="wrap">${esc(y.results_claimed)}${srcs(y.sources)}</td></tr>`).join('')}</table>${p.cost_per_unit&&p.cost_per_unit.length?`<table><tr><th>FY</th><th>Outcome unit</th><th class="num">Cost per unit</th><th>Computed as, and why it is defensible</th></tr>${p.cost_per_unit.slice().sort((a,b)=>b.year-a.year).map(c=>`<tr><td>${c.year}</td><td class="wrap">${esc(c.unit)}</td><td class="num">${money(c.cost)}</td><td class="wrap small">${esc(c.numerator)} / ${esc(c.denominator)} · ${esc(c.why_defensible)}</td></tr>`).join('')}</table>`:'<p class="small muted">No defensible outcome unit for a cost-per-unit figure.</p>'}`).join('');
  if(RS.peer_comparables&&RS.peer_comparables.length) h += `<h2>Comparable outcomes reported by peers</h2><table><tr><th>Peer</th><th>Outcome</th><th>Value</th><th>Year</th></tr>${RS.peer_comparables.map(p=>`<tr><td class="wrap">${esc(p.peer)}</td><td class="wrap">${esc(p.outcome)}</td><td class="wrap">${esc(p.value_text)}${srcs(p.sources)}</td><td>${esc(p.year||'—')}</td></tr>`).join('')}</table>`;
  h += `<details><summary><span class="r">#</span><span class="fm">Activity counts, low weight</span><span class="pr">${(RS.activity_counts||[]).length} series</span></summary><div class="in"><p class="small muted">Outputs the organization reports about itself. Useful for spotting a change in reporting, not for judging impact.</p>`+((RS.activity_counts&&RS.activity_counts.length)?`<table><tr><th>Metric</th><th>Level</th><th>Series</th><th>Trend</th><th>Note</th></tr>${RS.activity_counts.map(m=>`<tr><td class="wrap"><b>${esc(m.metric)}</b><br><span class="small muted">${esc(m.unit)}${m.program?' · '+esc(m.program):''}</span></td><td>${badge(m.level, m.level==='impact'?'evidence':m.level==='outcome'?'inference':'na')}</td><td>${spark(m.series)}<br><span class="small muted">${(m.series||[]).slice().sort((a,b)=>a.year-b.year).map(p=>`${p.year}: ${esc(p.value_text||p.value||'—')}${p.kind!=='actual'?' ('+p.kind+')':''}`).join(' · ')}</span></td><td class="small">${esc(m.trend.replace(/_/g,' '))}</td><td class="wrap small">${esc(m.note)}${m.definition_changes?`<br><span class="muted">Definition: ${esc(m.definition_changes)}</span>`:''} ${badge(m.basis,m.basis)}</td></tr>`).join('')}</table>`:'<p class="muted small">None found.</p>')+`</div></details>`;
  h += `<h2>Could not verify</h2>${list(RS.gaps)}<h3>Documents or data that would settle it</h3>${list(RS.documents_that_would_close_gaps)}`;
  section('results','Results',h);
})();

/* field */
(function(){

  if(L.problem_trend) h += `<h2>Is the problem growing or shrinking</h2>`+claim({statement:L.problem_trend.rationale,basis:L.problem_trend.basis,sources:L.problem_trend.sources}, `Trend: ${L.problem_trend.direction}`);
  h += `<h2>Peers</h2><table><tr><th>Organization</th><th>Relationship</th><th>How they differ</th><th>Scale</th></tr>${(L.peers||[]).map(p=>`<tr><td class="wrap">${esc(p.name)}${p.website?` <a class="small" href="${esc(p.website)}" target="_blank" rel="noopener">site</a>`:''}<br><span class="small muted">${esc(p.ein||'no EIN found')}</span></td><td class="small">${esc((p.relationship||'').replace(/_/g,' '))}</td><td class="wrap">${esc(p.how_they_differ)}${srcs(p.sources)}</td><td class="wrap small">${esc(p.scale_note)}</td></tr>`).join('')}</table>`;
  if(L.differentiation) h += `<h2>Differentiation</h2>`+claim({statement:L.differentiation.rationale,basis:L.differentiation.basis,confidence:L.differentiation.confidence}, `Position: ${L.differentiation.position}`);
  if(L.counterfactual) h += `<h2>Counterfactual</h2>`+claim({statement:`If the organization disappeared: ${L.counterfactual.if_org_disappeared}\n\nWho absorbs the work: ${L.counterfactual.who_absorbs}\n\nIf a gift does not arrive: ${L.counterfactual.if_gift_does_not_arrive}`,basis:L.counterfactual.basis,confidence:L.counterfactual.confidence,sources:L.counterfactual.sources});
  if(L.right_unit) h += `<h2>Is this the right unit to fund</h2>`+claim({statement:L.right_unit.verdict+'\n\n'+L.right_unit.rationale,basis:L.right_unit.basis}, '')+`<p class="small">Alternatives: ${esc((L.right_unit.alternatives||[]).join('; ')||'none named')}</p>`;
  if(L.funder_landscape){ const f=L.funder_landscape; h += `<h2>Funders</h2>${f.known_funders&&f.known_funders.length?`<table><tr><th>Funder</th><th>Note</th></tr>${f.known_funders.map(k=>`<tr><td class="wrap">${esc(k.name)}</td><td class="wrap">${esc(k.note)}${srcs(k.sources)}</td></tr>`).join('')}</table>`:''}`+claim({statement:`Concentration: ${f.concentration_note}\n\nSophisticated funders present: ${f.sophisticated_funders_present||'unknown'}\n\nDepartures: ${f.departures}`,basis:f.basis}); }
  if(L.room_for_funding) h += `<h2>Room for more funding</h2>`+claim({statement:`${L.room_for_funding.verdict}\n\nLast big increase: ${L.room_for_funding.last_big_increase}\n\n${L.room_for_funding.rationale}`,basis:L.room_for_funding.basis,confidence:L.room_for_funding.confidence});
  h += `<h2>Could not establish</h2>${list(L.gaps)}${srcs(L.sources)}`;
  section('field','Field',h);
})();

/* culture */
(function(){

  if(C.theory_of_change) h += `<h2>Theory of change, in their words</h2>`+claim({statement:C.theory_of_change.in_their_words,basis:C.theory_of_change.basis,sources:C.theory_of_change.sources})+`<h3>The theory of power underneath</h3>${prose(C.theory_of_change.theory_of_power)}`;
  h += `<div class="two"><div><h3>Espoused values</h3>${list(C.espoused_values)}</div><div><h3>Operating values (what the decisions show)</h3>${(C.operating_values||[]).map(v=>claim({statement:v.evidence,basis:v.basis,sources:v.sources}, v.value)).join('')}</div></div>`;

  h += `<h2>Five whys</h2>`+(C.five_whys||[]).map(w=>`<div class="claim" data-basis="inference"><div class="head"><b>${esc(w.observation)}</b></div><ol class="small">${(w.chain||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="body">${esc(w.insight)}</div></div>`).join('');
  h += `<h2>Unmet needs</h2>`+(C.unmet_needs&&C.unmet_needs.length?`<table><tr><th>Need</th><th>Level</th><th>Evidence</th><th>For a donor</th></tr>${C.unmet_needs.map(n=>`<tr><td class="wrap">${esc(n.need)}</td><td>${esc(n.level)}</td><td class="wrap">${esc(n.evidence)}</td><td class="wrap">${esc(n.donor_implication)}</td></tr>`).join('')}</table>`:'<p class="muted small">None recorded.</p>');
  h += `<h2>Unresolved tensions</h2>${list(C.cultural_tensions)}`;
  h += `<h2>Verbatim phrases</h2>`+(C.verbatim_phrases&&C.verbatim_phrases.length?`<ul>${C.verbatim_phrases.map(v=>`<li><i>“${esc(v.phrase)}”</i> <span class="muted small">${esc(v.context)}</span> <a class="small" href="${esc(v.url)}" target="_blank" rel="noopener">src</a></li>`).join('')}</ul>`:'<p class="muted small">None recorded.</p>');
  h += `<h2>Corpus read</h2><table><tr><th>Source</th><th>Type</th><th>Date</th><th>Why it matters</th></tr>${(C.corpus||[]).map(c=>`<tr><td class="wrap"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a><br><span class="small muted">${esc(c.author_role)}</span></td><td class="small">${esc(c.type)}</td><td class="small">${esc(c.date||'—')}</td><td class="wrap small">${esc(c.why_it_matters)}</td></tr>`).join('')}</table>`;

/* leader */
(function(){
  if(!LD){ section('leader','Leader',`<h1>The leader</h1>`+empty('The leader read')); return; }
  const q = qs => (qs&&qs.length) ? `<ul class="quotes">${qs.map(x=>`<li>“${esc(x.quote)}” <span class="small muted">${esc([x.date,x.context].filter(Boolean).join(' · '))}</span>${x.url?` <a class="small" href="${esc(x.url)}" target="_blank" rel="noopener">src</a>`:''}</li>`).join('')}</ul>` : '';
  const read = (title, r) => r ? `<div class="claim" data-basis="${r.basis}"><div class="head"><b>${esc(title)}</b> ${badge(r.basis,r.basis)} ${conf(r.confidence)}</div><div class="body">${redact(r.summary, r.basis)}</div>${q(r.quotes)}</div>` : '';
  const sub = LD.subject||{};
  let h = `<h1>${esc(sub.name||'The leader')}</h1><p class="sub">${esc(sub.title||'')}${sub.since?` since ${esc(sub.since)}`:''} · read from ${(LD.corpus||[]).length} pieces of their own public professional writing and speech</p>`;
  if(LD.ethics_note) h += `<div class="empty" style="border-style:solid"><b>Boundary.</b> ${esc(LD.ethics_note)}</div>`;
  if(LD.reframe) h += `<div class="lede">${esc(LD.reframe)}</div>`;
  if(sub.why_this_person) h += `<p class="small muted">${esc(sub.why_this_person)}</p>`;
  const P = LD.profile||{};
  h += `<h2>Profile, in their own words</h2>`+read('How they cast themselves',P.self_concept)+read('How they decide',P.decision_style)+read('Appetite for risk',P.risk_appetite)+read('How they absorb a loss',P.absorbing_loss)+read('Criticism and dissent',P.criticism_and_dissent)+read('Under pressure',P.under_pressure)+read('Money and donors',P.money_and_donors)+read('Power and relationships',P.power_and_relationships)+read('Time horizon and growth',P.time_horizon_and_growth);
  if(LD.candor_index){ const c=LD.candor_index; h += `<h2>Candor index</h2><div class="kv"><div>Items read</div><div>${c.items_read}</div><div>Failures named</div><div>${c.failures_named}</div><div>Embarrassing numbers named</div><div>${c.embarrassing_numbers_named}</div><div>Mistakes admitted</div><div>${c.admitted_mistakes}</div></div><p class="small">${esc(c.note)}</p>`; }
  h += `<div class="two"><div><h3>Strengths a donor should weigh</h3>${(LD.strengths||[]).map(x=>claim({statement:x.evidence,basis:x.basis,sources:x.sources}, x.pattern)).join('')||'<p class="muted small">None supported.</p>'}</div><div><h3>Warning patterns</h3>${(LD.warning_patterns||[]).map(x=>claim({statement:x.evidence,basis:x.basis,sources:x.sources}, x.pattern)).join('')||'<p class="muted small">None supported by the sources.</p>'}</div></div>`;
  if(LD.dependency_and_succession){ const d=LD.dependency_and_succession; h += `<h2>Dependency and succession</h2>`+claim({statement:`Identity fusion: ${d.identity_fusion}.\n\nTenure signals: ${d.tenure_signals}\n\nSuccessor signals: ${d.successor_signals}\n\nRevenue exposure if they leave: ${d.revenue_exposure}`,basis:d.basis,confidence:d.confidence}); }
  if(LD.in_the_room){ const r=LD.in_the_room; h += `<h2>In the room</h2><div class="kv"><div>Likely pitch</div><div>${esc(r.likely_pitch)}</div><div>Will avoid</div><div>${esc(r.will_avoid)}</div></div><h3>Questions that test the pattern</h3>${list(r.test_questions)}`; }
  if(LD.eras&&LD.eras.length) h += `<h2>How the voice changed</h2><table><tr><th>Period</th><th>Label</th><th>Voice</th><th>Specificity</th><th>Candor</th><th>Example</th></tr>${LD.eras.map(e=>`<tr><td>${esc(e.period)}</td><td class="wrap">${esc(e.label)}</td><td class="wrap">${esc(e.voice)}</td><td>${esc(e.specificity)}</td><td>${esc(e.candor)}</td><td class="wrap small">${e.example_quote?`“${esc(e.example_quote)}”`:''}${srcs(e.sources)}</td></tr>`).join('')}</table>`;
  if(LD.under_pressure_moments) h += '';
  h += `<h2>Metaphors they live by</h2>`+(LD.metaphors&&LD.metaphors.length?`<table><tr><th>Metaphor</th><th>Example</th><th>Reveals</th><th>Hides</th></tr>${LD.metaphors.map(m=>`<tr><td class="wrap">${esc(m.metaphor)}</td><td class="wrap"><i>${esc(m.example)}</i>${m.date?` <span class="small muted">${esc(m.date)}</span>`:''}${m.url?` <a class="small" href="${esc(m.url)}" target="_blank" rel="noopener">src</a>`:''}</td><td class="wrap">${esc(m.reveals)}</td><td class="wrap">${esc(m.hides)}</td></tr>`).join('')}</table>`:'<p class="muted small">None recorded.</p>');
  if(LD.normative_and_charged&&LD.normative_and_charged.length) h += `<h2>Where the frame shows</h2>`+LD.normative_and_charged.map(x=>`<div class="claim" data-basis="inference"><div class="head">${badge(x.kind.replace('_',' '),'na')} <span class="small muted">${esc(x.date||'')}</span></div><div class="body">“${esc(x.passage)}”<br><span class="small">${esc(x.reading)}</span></div><div class="src"><a href="${esc(x.url)}" target="_blank" rel="noopener">source</a></div></div>`).join('');
  h += `<h2>Contradictions</h2>`+((LD.contradictions&&LD.contradictions.length)?LD.contradictions.map(c=>claim({statement:`Said: ${c.said}\n\nDid or showed: ${c.did_or_showed}\n\nWhy it matters: ${c.significance}`,basis:c.basis,sources:c.sources})).join(''):'<p class="muted small">None found.</p>');
  if(LD.figure_and_ground) h += `<div class="two"><div><h3>Always at the center</h3>${list(LD.figure_and_ground.always_center)}</div><div><h3>Never appears</h3>${list(LD.figure_and_ground.never_appears)}</div></div>`;
  h += `<h2>Five whys</h2>`+(LD.five_whys||[]).map(w=>`<div class="claim" data-basis="inference"><div class="head"><b>${esc(w.observation)}</b></div><ol class="small">${(w.chain||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="body">${esc(w.insight)}</div></div>`).join('');
  h += `<h2>What this leader needs</h2>`+(LD.needs&&LD.needs.length?`<table><tr><th>Need</th><th>Level</th><th>From</th><th>Stated?</th><th>Evidence</th></tr>${LD.needs.map(n=>`<tr><td class="wrap">${esc(n.need)}</td><td>${esc(n.level)}</td><td class="wrap">${esc(n.from_whom)}</td><td>${n.explicit?'explicit':'implicit'}</td><td class="wrap">${esc(n.evidence)}</td></tr>`).join('')}</table>`:'<p class="muted small">None recorded.</p>');
  if(LD.empathy_gap) h += `<h2>Map or territory</h2>`+claim({statement:LD.empathy_gap.rationale,basis:LD.empathy_gap.basis}, `Empathy gap: ${LD.empathy_gap.rating.replace(/_/g,' ')}`);
  if(LD.observations){ const o=LD.observations; h += `<h2>Observations (A.E.I.O.U.)</h2><div class="two"><div><h3>Activities</h3>${list(o.activities)}<h3>Environments</h3>${list(o.environments)}<h3>Interactions</h3>${list(o.interactions)}</div><div><h3>Objects</h3>${list(o.objects)}<h3>Present</h3>${list(o.present)}<h3>Absent</h3>${list(o.absent)}</div></div>`; }
