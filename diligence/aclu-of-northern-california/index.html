<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dossier</title>
<style>
/* ===== Noah's Weblog house style (exhibits) v2 =====
   Matches noahmaier.net: white page, Times for reading, Verdana for
   controls, blue underlined links, two-tone rules, gray beveled buttons. */
:root {
  --page: #ffffff;
  --ink: #000000;
  --ink-soft: #2b2b2b;
  --link: #0000ee;
  --visited: #551a8b;
  --active: #ff0000;
  --lo: #999999;          /* rule, border, axis */
  --hi: #e2e2e2;          /* rule highlight, gridline */
  --tint: #f2f2f2;        /* callout and table-header fill */
  --field: #6e6e6e;       /* input border */
  --btn: #c0c0c0;         /* button face */
  --btn-face: #dfdfdf;
  --btn-lo: #808080;
  --btn-dark: #0a0a0a;
  --new: #cc0000;
  /* data colors, in order: classic HTML named colors */
  --c1: #000080;  /* navy */
  --c2: #800000;  /* maroon */
  --c3: #008080;  /* teal */
  --c4: #808000;  /* olive (marks only; too light for text) */
  --c5: #800080;  /* purple */
  --c6: #008000;  /* green */
  --serif: "Times New Roman", Times, serif;
  --sans: Verdana, Geneva, Tahoma, sans-serif;
  --mono: "Courier New", Courier, monospace;
  --measure: 42.75rem;    /* one column width (684px): text, boxes, questions, tables, figures */
}
* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; padding: 10px 16px 32px; background: var(--page); color: var(--ink);
       font: 18px/1.45 var(--serif); -webkit-text-size-adjust: 100%; }
.page { max-width: 1020px; }
/* Text, boxes, questions, tables and figures share one column width, so their left and
   right edges line up. Add class="wide" only to something that genuinely needs more room. */
main p, main ul, main ol, main dl, main blockquote, main table, main fieldset, main figure,
main details, main .box, main h2, main h3, main .view > *, .prose { max-width: var(--measure); }
.wide { max-width: none !important; }
a { color: var(--link); } a:visited { color: var(--visited); } a:active { color: var(--active); }
:focus-visible { outline: 2px dotted var(--ink); outline-offset: 2px; }

h1 { font-size: 2.3em; line-height: 1.1; margin: 0.35em 0 0.15em; }
h2 { font-size: 1em; font-weight: bold; margin: 1.6em 0 0.7em; padding-bottom: 2px;
     border-bottom: 1px solid var(--lo); }
h3 { font-size: 1.15em; line-height: 1.25; margin: 1.2em 0 0.3em; }
p { margin: 0 0 0.8em; }
.dek { font-style: italic; margin: 0 0 0.5em; }
.nav { font: 13px/1.6 var(--sans); margin: 0; }
hr { border: 0; border-top: 1px solid var(--lo); border-bottom: 1px solid var(--hi);
     height: 0; margin: 10px 0 14px; }
code, pre, kbd { font-family: var(--mono); font-size: 0.9em; }

/* controls and small text use Verdana */
label, legend, button, input, select, textarea, table, figcaption, output, .ui, .meta {
  font-family: var(--sans); }
.ui, .meta, figcaption { font-size: 13px; line-height: 1.5; }
.meta { color: var(--ink-soft); }
p.meta { margin: 6px 0 12px; }

fieldset { border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi);
           margin: 0 0 16px; padding: 10px 12px 12px; min-width: 0; }
/* The legend sits inside the box as its first line, so long legends wrap cleanly
   instead of breaking through the border. */
legend { float: left; width: 100%; padding: 0; margin: 0 0 8px; font-size: 13px; font-weight: bold; }
legend + * { clear: both; }
label { font-size: 13px; }
.choices { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.choices label { display: inline-flex; align-items: center; gap: 5px; }
input[type=radio], input[type=checkbox], input[type=range] { accent-color: var(--c1); }

button {
  font-size: 13px; line-height: 1.2; color: #000; background: var(--btn);
  border: 0; border-radius: 0; padding: 6px 12px; cursor: pointer;
  box-shadow: inset -1px -1px var(--btn-dark), inset 1px 1px #fff,
              inset -2px -2px var(--btn-lo), inset 2px 2px var(--btn-face);
}
button:active, button[aria-pressed="true"] {
  box-shadow: inset 1px 1px var(--btn-dark), inset -1px -1px #fff,
              inset 2px 2px var(--btn-lo), inset -2px -2px var(--btn-face);
  padding: 7px 11px 5px 13px;
}
button:disabled { color: var(--btn-lo); text-shadow: 1px 1px #fff; cursor: default; }
button.primary { font-weight: bold; }

input[type=text], input[type=number], input[type=search], input[type=email],
select, textarea {
  font-size: 14px; color: var(--ink); background: #fff; border: 1px solid var(--field);
  border-radius: 0; box-shadow: inset 1px 1px 0 #b4b4b4; padding: 4px 6px;
}

table { border-collapse: collapse; font-size: 13px; line-height: 1.4; }
main table { width: 100%; }
th, td { border: 1px solid var(--lo); padding: 4px 8px; text-align: left; vertical-align: top; }
th { background: var(--tint); }

.box { background: var(--tint); box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi);
       padding: 8px 10px; margin: 0 0 1em; font: 13px/1.5 var(--sans); }
.result { font-size: 1.15em; }
.result strong { font-variant-numeric: tabular-nums; }

.meter { height: 16px; background: #fff; border: 1px solid var(--field);
         box-shadow: inset 1px 1px 0 #b4b4b4; }
.meter > div { height: 100%; width: 0; background: var(--c1); }

footer address { font-style: normal; font-size: 0.85em; }

@media (max-width: 780px) { body { font-size: 17px; padding: 8px 16px 28px; } h1 { font-size: 1.8em; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media print { .nav { display: none; } }

/* ===== Dossier: page-specific rules, house variables only ===== */
.shell { display: grid; grid-template-columns: minmax(0, 1fr) 256px; gap: 32px; align-items: start; }
.shell > main { min-width: 0; }
.menu { position: sticky; top: 10px; }
.menu fieldset { margin: 0 0 12px; }
.menu ol { margin: 0; padding-left: 22px; font: 13px/1.7 var(--sans); }
.menu ol a[aria-current="true"] { color: var(--ink); font-weight: bold; text-decoration: none; }
.menu .n { color: var(--ink-soft); font-size: 11px; margin-left: 6px; }
.menu .meta { margin: 8px 0 0; font-size: 11px; }
.filter .opts label { display: block; margin: 2px 0; }
section.page { display: none; }
section.page.active { display: block; }
.notice { font: 13px/1.5 var(--sans); background: var(--tint); box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); padding: 8px 10px; margin: 0 0 14px; max-width: none; }
.notice strong { font-weight: bold; }
h1 { font-size: 2.1em; }
.sub { font: 13px/1.5 var(--sans); color: var(--ink-soft); margin: 0 0 14px; }
.lede { font-size: 1.15em; line-height: 1.4; margin: 10px 0 14px; }
.prose p { margin: 0 0 0.8em; }
.pre { white-space: pre-wrap; }
.muted { color: var(--ink-soft); }
.small { font: 13px/1.5 var(--sans); }
.row { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; }
.empty { border: 1px dashed var(--lo); padding: 10px 12px; font: 13px/1.5 var(--sans); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: none; }
.two h3:first-child { margin-top: 0.6em; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 16px; font: 13px/1.5 var(--sans); margin: 8px 0 12px; }
.kv div:nth-child(odd) { color: var(--ink-soft); }
/* tags */
.b { display: inline-block; font: 11px/1.4 var(--sans); padding: 0 4px; border: 1px solid var(--lo); color: var(--ink-soft); vertical-align: middle; white-space: nowrap; background: #fff; }
.b.evidence { color: var(--c1); border-color: var(--c1); }
.b.inference { color: var(--c3); border-color: var(--c3); }
.b.speculation { color: var(--c2); border-color: var(--c2); }
.b.red { color: var(--c2); border-color: var(--c2); }
.b.amber { color: var(--ink); border-color: var(--c4); border-left-width: 4px; }
.b.green { color: var(--c6); border-color: var(--c6); }
.b.na { color: var(--ink-soft); }
.light { display: inline-block; width: 10px; height: 10px; vertical-align: middle; margin-right: 6px; background: var(--lo); border: 1px solid var(--field); }
.light.red { background: var(--c2); } .light.amber { background: var(--c4); } .light.green { background: var(--c6); } .light.na { background: var(--hi); }
.conf { font: 11px/1.4 var(--sans); color: var(--ink-soft); }
/* claims */
.claim { border-left: 3px solid var(--lo); padding: 4px 0 4px 12px; margin: 10px 0; }
.claim[data-basis="evidence"] { border-left-color: var(--c1); }
.claim[data-basis="inference"] { border-left-color: var(--c3); }
.claim[data-basis="speculation"] { border-left-color: var(--c2); }
.claim .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 2px; font-size: 0.95em; }
.claim .body { white-space: pre-line; }
.claim .src { font: 12px/1.5 var(--sans); color: var(--ink-soft); margin-top: 3px; }
.hidden-by-filter { display: none !important; }
.redact { background: var(--ink); color: transparent; cursor: pointer; }
.redact:hover, .redact:focus, .redact.open { background: transparent; color: inherit; }
/* tables */
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.wrap { white-space: normal; }
tr.flag-red td:first-child { color: var(--c2); }
/* cover */
.cover-grid { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 24px; align-items: start; max-width: none; }
.stamp { border: 3px double var(--ink); padding: 10px 14px; display: inline-block; min-width: 180px; }
.stamp .n { font-size: 2.6em; line-height: 1; font-weight: bold; font-variant-numeric: tabular-nums; }
.stamp .g { font: 13px/1.4 var(--sans); margin-top: 4px; }
.stamp .l { font: 11px/1.4 var(--sans); color: var(--ink-soft); margin-top: 6px; }
.failure { background: var(--tint); box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); padding: 12px 14px; margin: 14px 0; }
.failure .t { font: 12px/1.4 var(--sans); color: var(--ink-soft); margin-bottom: 6px; }
.failure .f { font-size: 1.25em; line-height: 1.3; }
.failure .m { margin-top: 8px; font-size: 0.95em; }
.boot { display: none; }
/* score bars */
.bars { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 6px 12px; align-items: center; max-width: var(--measure); font: 13px/1.5 var(--sans); }
.bars .track { height: 14px; background: #fff; border: 1px solid var(--field); box-shadow: inset 1px 1px 0 #b4b4b4; }
.bars .fill { height: 100%; background: var(--c1); }
.bars .v { font-variant-numeric: tabular-nums; }
/* chart */
.chart-wrap { margin: 8px 0; position: relative; max-width: none; }
.chart-wrap svg { width: 100%; height: auto; display: block; font-family: var(--sans); }
.legend { display: flex; gap: 16px; font: 12px/1.5 var(--sans); margin: 4px 0 0; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
.tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--field); padding: 3px 6px; font: 12px/1.4 var(--sans); display: none; white-space: nowrap; z-index: 3; }
/* ratio boxes */
.ratios { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin: 8px 0; max-width: none; }
.ratio { border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi); padding: 8px 10px; }
.ratio.red { border-left: 4px solid var(--c2); } .ratio.amber { border-left: 4px solid var(--c4); }
.ratio .l { font: 12px/1.4 var(--sans); min-height: 2.8em; }
.ratio .v { font-size: 1.6em; line-height: 1.1; font-weight: bold; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
.ratio .v small { font: 12px var(--sans); font-weight: normal; margin-left: 3px; }
.ratio .f { font: 11px/1.4 var(--sans); color: var(--ink-soft); }
.ratio .why { font: 12px/1.45 var(--sans); margin-top: 6px; }
.range { position: relative; height: 16px; margin: 2px 0; }
.range .tr { position: absolute; left: 0; right: 0; top: 7px; height: 1px; background: var(--lo); }
.range .band { position: absolute; top: 4px; height: 7px; background: var(--tint); border: 1px solid var(--lo); }
.range .med { position: absolute; top: 2px; width: 1px; height: 12px; background: var(--ink); }
.range .me { position: absolute; top: 3px; width: 9px; height: 9px; background: var(--c1); margin-left: -4px; }
/* scenarios */
.quad { display: grid; grid-template-columns: auto 1fr 1fr; grid-template-rows: auto 1fr 1fr auto; gap: 6px; max-width: none; margin: 12px 0; }
.quad .ax { font: 12px/1.4 var(--sans); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px; }
.quad .ax.y { writing-mode: vertical-rl; transform: rotate(180deg); max-height: 420px; overflow: hidden; }
.q { text-align: left; min-height: 120px; display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; font: 13px/1.4 var(--sans); }
.q .nm { font: 1.1em/1.25 var(--serif); }
.q .qd { font-size: 11px; color: var(--ink-soft); }
.q .tag { font-size: 11px; font-weight: bold; color: var(--c2); }
.q .rd { margin-top: auto; font-size: 11px; color: var(--ink-soft); }
.scen-detail { border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi); padding: 10px 12px 12px; margin: 0 0 16px; }
.dots { letter-spacing: 1px; color: var(--c1); }
.dots .off { color: var(--hi); }
/* expanders */
details { border: 1px solid var(--lo); margin: 8px 0; }
summary { cursor: pointer; padding: 8px 10px; list-style: none; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
summary::-webkit-details-marker { display: none; }
summary .r { font: bold 13px var(--sans); color: var(--c1); }
summary .fm { }
summary .pr { font: 12px/1.4 var(--sans); color: var(--ink-soft); white-space: nowrap; }
details[open] summary { border-bottom: 1px solid var(--lo); background: var(--tint); }
details .in { padding: 6px 12px 12px 48px; }
.chain li { font-size: 0.9em; }
.q-status { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--hi); }
.q-status .qq { font-weight: bold; margin-bottom: 2px; }
.q-status .aa { }
.statusline { font: 0.85em/1.5 var(--serif); margin-top: 24px; }
.statusline span + span::before { content: " · "; }
button.b { font: 12px var(--sans); padding: 5px 10px; }
@media (max-width: 780px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .menu { position: static; }
  .cover-grid, .two { grid-template-columns: 1fr; }
  .quad { grid-template-columns: 1fr; grid-template-rows: auto; }
  .quad .ax { display: none; }
  .quad .q { grid-column: auto !important; grid-row: auto !important; }
}
@media print {
  .nav, .menu, .statusline, #print-brief, .notice { display: none !important; }
  .shell { display: block; }
  section.page { display: none !important; } section.page#sec-brief { display: block !important; }
  body { font-size: 12px; } h1 { font-size: 1.7em; } .lede { font-size: 1.05em; }
  .cover-grid { grid-template-columns: 1fr 160px; }
  a { color: var(--ink); text-decoration: none; }
}

/* ===== polish pass: same palette and type, finer rhythm ===== */
.quotes { margin: 6px 0 0; padding-left: 18px; font-size: 0.92em; }
.quotes li { margin: 0 0 4px; }
body { line-height: 1.5; }
.page { max-width: 1040px; }
header h1 { font-size: 2.2em; letter-spacing: -0.01em; margin-bottom: 0.1em; }
header .dek { font-size: 0.95em; color: var(--ink-soft); }
.notice { padding: 9px 12px; line-height: 1.55; border-left: 3px solid var(--lo); box-shadow: none; }
.shell { gap: 40px; }
.shell > main > section > h1 { font-size: 1.75em; margin: 0.2em 0 0.1em; }
.sub { margin: 0 0 18px; }
h2 { font-size: 0.85em; letter-spacing: 0.02em; color: var(--ink-soft); margin: 2em 0 0.8em; padding-bottom: 3px; }
h3 { font-size: 1.05em; margin: 1.3em 0 0.35em; }
.prose, .lede, .pre, .claim .body, .failure, details .in p { max-width: var(--measure); }
.lede { font-size: 1.2em; line-height: 1.42; }
/* tables: horizontal rules only, numbers aligned, tinted head */
table { font-size: 12.5px; line-height: 1.45; margin: 6px 0 10px; }
main table { max-width: none; }
td.wrap { min-width: 9em; }
th, td { border: 0; border-bottom: 1px solid var(--hi); padding: 6px 10px 6px 0; }
th { border-bottom: 1px solid var(--lo); background: transparent; font-weight: bold; color: var(--ink-soft); }
tr:last-child td { border-bottom: 1px solid var(--lo); }
/* health panel on the cover */
.health { border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi); padding: 12px 14px 10px; font: 12.5px/1.45 var(--sans); }
.health .n { font: bold 3em/1 var(--serif); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.health .n small { font: 13px var(--sans); color: var(--ink-soft); margin-left: 6px; letter-spacing: 0; }
.health .g { margin: 4px 0 10px; color: var(--ink-soft); }
.health table { margin: 0; font-size: 12px; }
.health td { padding: 3px 0; border-bottom: 1px solid var(--hi); }
.health td.num { padding-left: 10px; }
.health tr:last-child td { border-bottom: 0; }
.health .bar { height: 5px; background: var(--hi); margin-top: 3px; }
.health .bar > i { display: block; height: 100%; background: var(--c1); }
.stamp { display: none; }
.failure { padding: 14px 16px; margin: 18px 0; border-left: 3px solid var(--c2); box-shadow: none; }
.failure .f { font-size: 1.3em; }
.kv { gap: 4px 18px; margin: 12px 0 16px; }
/* claims */
.claim { padding: 2px 0 2px 12px; margin: 12px 0; }
.claim .head { font: 12px/1.5 var(--sans); gap: 6px; }
.b { font-size: 10.5px; padding: 0 5px; }
/* ratio cards */
.ratios { gap: 12px; }
.ratio { padding: 10px 12px 10px; background: #fff; }
.ratio .l { font-size: 12px; color: var(--ink-soft); min-height: 2.6em; }
.ratio .v { font-size: 1.75em; margin: 6px 0 2px; }
.ratio .why { color: var(--ink); }
/* scenario tiles as panels, not buttons */
.quad { gap: 8px; }
button.q, button.q:active, button.q[aria-pressed="true"] { background: #fff; color: var(--ink); border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi); padding: 12px 14px; }
button.q:hover { border-color: var(--field); }
button.q[aria-pressed="true"] { border-color: var(--c1); box-shadow: inset 3px 0 0 var(--c1), inset 1px 1px 0 var(--hi); }
.q .nm { font-size: 1.15em; }
.q .qd { font-size: 10.5px; }
.scen-detail { padding: 14px 16px 16px; }
/* expanders */
details { border: 0; border-top: 1px solid var(--hi); margin: 0; }
details:last-of-type { border-bottom: 1px solid var(--hi); }
summary { padding: 10px 4px; grid-template-columns: 28px minmax(0, 1fr) auto; }
summary .r { color: var(--c1); }
summary .fm { font-size: 1.05em; }
details[open] summary { background: transparent; border-bottom: 0; }
details .in { padding: 0 4px 14px 32px; }
/* score bars */
.bars { gap: 7px 14px; }
.bars .track { height: 9px; box-shadow: none; border-color: var(--lo); }
/* contents */
.menu fieldset { padding: 10px 12px 10px; }
.menu ol { line-height: 1.8; }
.menu .n { font-size: 10.5px; }
/* footer */
.statusline { line-height: 1.55; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="brand-name">Dossier</h1>
    <p class="dek" id="brand-sub"></p>
    <p class="nav" id="topnav"></p>
    <hr>
  </header>
  <p class="notice" id="stripe"><span id="stripe-l"></span> <span id="stripe-r"></span></p>
  <div class="shell">
    <main id="main"></main>
    <aside class="menu" aria-label="Contents">
      <fieldset><legend>Contents</legend><ol id="nav"></ol></fieldset>
      <fieldset class="filter"><legend>Show claims tagged</legend>
        <div class="opts">
          <label><input type="radio" name="basis" value="3" checked> evidence, inference, speculation</label>
          <label><input type="radio" name="basis" value="2"> evidence and inference</label>
          <label><input type="radio" name="basis" value="1"> evidence only</label>
        </div>
      </fieldset>
      <p class="meta" id="meta"></p>
    </aside>
  </div>
  <footer>
    <hr>
    <address class="statusline" id="status"></address>
  </footer>

<script>

}, "founded_year": 1934, "irs_subsection": "501(c)(3)", "ntee_code": "R60 (evidence, secondary source only: CauseIQ; ProPublica's page showed no code)", "entity_structure": "\"ACLU of Northern California\" is a brand covering two separately incorporated California nonprofits, inside the national ACLU federation.\n\n1. ACLU Foundation of Northern California, EIN 94-0279770, 501(c)(3). FYE 3/2025: revenue $21,840,462, expenses $19,816,451, assets $49,296,244 (evidence: ProPublica). Gifts are deductible. The organization says deductible gifts fund litigation and public education (evidence: FAQ).\n2. American Civil Liberties Union of Northern California, EIN 94-2151925, 501(c)(4). FYE 3/2025: revenue $9,584,433, expenses $6,148,837, assets $18,051,936 (evidence: ProPublica). Not deductible. The organization says membership gifts fund political advocacy and lobbying (evidence: FAQ).\n\nControl: there is no evidence of a parent-subsidiary relationship between the two. They have separate boards with the same chair and 9 shared directors, out of 16 (Foundation) and 24 (501(c)(4)) listed (count is inference from the board page). They share staff: the same executives appear on both 990s with pay split between them, and the Foundation carries most of it (evidence: ProPublica). The audits are issued on a combined basis as \"ACLU Foundation and Union of Northern California\" (evidence: financial reports page). Treating the pair as one operating organization is an inference from those facts.\n\nNational layer: the organization says gifts are shared between a donor's home office and the national ACLU (evidence: FAQ). Historic charts show a national share of $4,808,577 and $3,566,178 in the 2013 and 2014 reports (evidence: search snippets, not opened). No evidence found of the current split formula or the FY25 dollar amount.\n\nLimit on this map: the FY24 and FY25 audits and the 990 PDFs were fetched but returned as unreadable compressed data. The audit notes, Schedule R and Schedu ts over affiliates: no evidence found.", "sources": [{"url": "https://causeiq.com/organizations/american-civil-liberties-union-foundation-of-north,940279770", "title": "CauseIQ: EIN 94-0279770"}, {"url": "https://projects.propublica.org/nonprofits/organizations/136213516", "title": "ProPublica: EIN 13-6213516"}, {"url": "https://www.aclunc.org/sites/default/files/financial_charts_from_2014_annual_report.pdf", "title": "Financial charts, 2014 annual report"}, {"url": "https://www.aclunc.org/sites/default/files/financial_charts_from_2013_annual_report.pdf", "title": "Financial charts, 2013 annual report"}, {"url": "https://en.wikipedia.org/wiki/American_Civil_Liberties_Union", "title": "Wikipedia: American Civil Liberties Union"}]}, {"name": "American Civil Liberties Union, Inc. (national 501(c)(4))", "ein": null, "relationship": "National membership and lobbying body (inference from the federation's structure). EIN not confirmed in this research.", "money_and_control": "NorCal's 2022-23 report says membership acquisition and renewal costs for national and NorCal appear on the national ACLU's statements (evidence: search snippet, not opened). That implies national runs or books shared membership fundraising (inference).", "sources": [{"url": "https://annualreport.aclunc.org/wp-content/uploads/2023/07/Financial-spread-2022-ACLU-NorCal-An-Rpt-financials-7-19-23.pdf", "title": "Financial spread, 2022 ACLU NorCal annual report (snippet only; fetch failed on a certificate error)"}, {"url": "https://grantable.co/funders/american-civil-liberties-union-inc-morg_6e566c8bd7294f53a624405e6951c753", "title": "Grantable: American Civil Liberties Union Inc"}]}, {"name": "ACLU California Action", "ein": null, "relationship": "Statewide ACLU advocacy organization with its own executive director (evidence). Its role as a joint vehicle of California affiliates, including NorCal, is speculation; no document confirming it was read. Reported revenue is $3,824,959, year unconfirmed (evidence: search snippet).", "money_and_control": "Payments from NorCal and governance links: no evidence found. Check Schedule R on the 501(c)(4) 990.", "sources": [{"url": "https://aclucalaction.org/2024/04/aclu-california-welcomes-david-trujillo-as-executive-director/", "title": "ACLU California Welcomes David Trujillo as Executive Director"}]}], "donor_check_goes_to": "ACLU Foundation of Northern California, EIN 94-0279770, 39 Drumm Street, San Francisco, CA 94111, Attn: Development Department (evidence: corporate giving page for the address; donor FAQ snippet and other listings for the tax ID). This is the deductible route and the right payee for most donors.\n\nThree traps:\n1. A check or \"membership\" payment to \"ACLU of Northern California\" goes to the 501(c)(4) and is not deductible (evidence).\n2. Some online forms sit on action.aclu.org, the national platform. The FAQ snippet says tribute gifts processed on the national form are not deductible (evidence: snippet; the fetched FAQ text was truncated and did not show this line). Confirm the receiving entity before giving online.\n3. Even a gift to the right entity may be shared with national, because the FAQ says gifts are shared (evidence). A major donor should ask in writing whether a restricted or major gift is exempt from sharing. No evidence found either way.", "mission_statement": "\"The ACLU of Northern California is an enduring guardian of justice, fairness, equality, and freedom, working to protect and advance civil rights and civil liberties for all Californians.\" (aclunorcal.org/about, undated; reassembled from two consecutive quoted fragments returned by the fetch tool.) A job posting states it differently: \"Our mission is to ensure that Constitutional rights don't just exist on paper, but are protected in practice.\"", "what_they_actually_do": "A civil-liberties law and advocacy shop covering Northern California, focused on government conduct. The organization says it \"focuses primarily on government action and inaction\" and acts against private entities less often (evidence: about page).\n\nOutputs (evidence: site navigation and staff page):\n- Litigation and amicus briefs\n- Appellate advocacy\n- State and local legislation and ballot positions, such as opposing San Francisco's Proposition F\n- Know-your-rights materials and reports\n- Community organizing through chapters\n\nNamed projects include Criminal Law & Immigration and Democracy, Speech & Technology. Listed issues include immigrants' rights, police practices, privacy and technology, reproductive justice, voting rights and rights of unhoused people.\n\nIt serves people in Northern California through impact cases and policy work, plus a \"Need Legal Help?\" intake channel. It is not primarily a direct legal-services provider (inference from the site structure). The volume of cases and outcomes was not assessed here; that belongs to the deep scan.", "size": {"staff": "117 employees at the Foundation, 2025 (evidence, secondary: CauseIQ). No organization-stated headcount found on the about, staff, financial or job pages read.", "budget": "No organization-stated budget found. From filings, FYE 3/2025: Foundation expenses $19,816,451; 501(c)(4) expenses $6,148,837. Simple sum about $26.0M expenses and $31.4M revenue (inference: my arithmetic, does not eliminate transfers between the entities, so it may overstate the true combined figure).", "as_stated_by": "Form 990 data via ProPublica for dollars; CauseIQ for staff. Neither figure is stated by the organization in material read. The combined audit could not be read."}, "leadership": [{"name": "Abdi Soltani", "title": "Executive Director", "since": "2009", "footprint": [{"url": "https://www.aclunorcal.org/bios/abdi-soltani/", "title": "ACLU NorCal bio"}, {"url": "https://pastforward.org/blogs/public-podcasting/abdi-soltani", "title": "PastForward podcast interview (undated in results)"}]}, {"name": "Shilpi Agarwal", "title": "Legal Director", "since": , "employees": 0, "volunteers": 185, "contrib_related_orgs": 725000, "contrib_government": null, "contrib_other": 2967888, "contrib_noncash": null, "contrib_membership_dues": null, "contrib_fundraising_events": null, "governance": {"family_or_business_relationships_among_officers": "No", "conflict_of_interest_policy": "Yes", "whistleblower_policy": "Yes", "document_retention_policy": "Yes", "board_reviewed_990": "Yes", "ceo_comp_independent_review": "Yes", "separate_audit": "No", "consolidated_audit": "Yes", "excess_benefit_transaction": "No", "loans_to_or_from_insiders": "No", "grants_to_insiders": "No", "business_with_insiders": "No", "material_diversion_of_assets": "No", "significant_change_to_documents": "No", "local_chapters_or_affiliates": "Yes", "lobbying_activities": null, "political_campaign_activities": "No", "related_organizations": null}, "schedule_o": "Return Reference | Explanation | Form 990, Part VI, Section A, Line 1a | The Board of Directors of the ACLU NC Union has an executive committee composed entirely of members of the Board of Directors (Executive Committee). The Executive Committee has the authority to act on behalf of the Board of Directors of the ACLU NC Union except for certain actions which are reserved to the Board of Directors in the Bylaws of the ACLU NC Union. | Form 990, Part VI, Section A, Line 6 | The ACLU NC Union has one class of Members. | Form 990, Part VI, Section A, Line 7a | ACLU NC Union Directors are elected by vote of the general membership submitted by action by written ballot printed in the ACLU News or other documents mailed to this corporations membership. The method of nomination will appear in the issue of the ACLU News or other document in which the ballot appears. | Form 990, Part VI, Section A, Line 7b | As required by the California Corporations Code, a few governing decisions (such as approval of amendments to the Bylaws which substantially affect the rights of Members) are reserved to Members under the Bylaws of the ACLU NC Union. | Form 990, Part VI, Section B, Line 11b | The Form 990 is provided to each member of the Finance Committee, the Audit and Compliance Committee, and the Board of Directors for review before filing. | Form 990, Part VI, Section B, Line 12c | Each board member (and certain non-director members of board advisory committees) is required to complete a conflict of interest disclosure form annually, to update the form if circumstances change during the year, and to disclose in real time any conflict of interest that arises in a given meeting.At the beginning of every meeting, the Chair reminds directors of the conflict of interest policy and to disclose or recuse themselves in instances of any conflicts. In addition, the General Counsel maintains the director conflict of interest disclosure forms, reviews them with the Audit and Compliance Committee Chair, and identifies potential conflicts that require either director disclosure or recusal. The General Counsel and the Audit and Compliance Committee Chair advise and consult with the Chair and directors in these situations. | Form 990, Part VI, Section B, Line 15a | Employees are compensated by the ACLU NC Foundation under the terms of the Resource Sharing Agreement. The ACLU NC Foundation Board of Directors works through its Personnel Committee to set the salary and bonus for the Executive Director based on a review process, consultation of a salary survey, and sometimes consulting with independent experts. In addition, the compensation of the Executive Director and Key Employees are subject to the terms of the budget set each year by the ACLU NC Foundation Board of Directors. | Form 990, Part VI, Section B, Line 15b | Employees are compensated by the ACLU NC Foundation under the terms of the Resource Sharing Agreement. The ACLU NC Foundation Board of Directors works through its Personnel Committee to set the salary and bonus for the Executive Director based on a review process, consultation of a salary survey, and sometimes consulting with independent experts. In addition, the compensation of the Executive Director and Key Employees are subject to the terms of the budget set each year by the ACLU NC Foundation Board of Directors. | Form 990, Part VI, Section C, Line 19 | Financial Statements are posted to ACLU NC Union website and are available upon request. | For Paperwork Reduction Act Notice, see the Instructions for Form 990 or 990-EZ. | Cat. No. 51056K | Schedule O (Form 990) (Rev. 1-2025) | Additional Data | Software ID: | 24020490 | Software Version: | 2024v5.2 | ", "schedules_present": ["ScheduleO", "ScheduleJ", "ScheduleR"]}]}, {"entity": {"ein": "13-6213516", "name": "American Civil Liberties Union Foundation Inc", "city": "New York", "state": "NY", "ntee_code": "R600", "subsection": 3, "ruling_date": "1967-03-01", "address": "125 BROAD STREET", "profile_url": "https://projects.propublica.org/nonprofits/organizations/136213516", "years": [{"year": 2025, "source": "propublica_page", "revenue": 306750536, "expenses": 245542362, "assets": 961853261, "liabilities": 182163108, "full_filing_url": "https://projects.propublica.org/nonprofits/organizations/136213516/202533449349300343/full", "fiscal_year_end": "March", "exec_comp": 4245540, "people": [{"name": "Mark V Wier", "title": "Chief Development Officer", "compensation": 520123, "related": 0, "other": 68959, "total": 589082}, {"name": "Kary Moss", "title": "National Director Of Affiliates Support & Nationwide Initiatives", "compensation": 498809, "related": 0, "other": 148185, "total": 646994}, {"name": "Kriston Mcintosh", "title": "Chief Communications & Marketing Officer", "compensation": 435187, "related": 0, "other": 24263, "total": 459450}, {"name": "Louise Melling", "title": "Deputy Legal Director, Center For Liberty", "compensation": 363528, "related": 0, "other": 91398, "total": 454926}, {"name": "Elizabeth Fitzgerald", "title": "Director Of Development", "compensation": 353947, "related": 0, "other": 99151, "total": 453098}, {"name": "Miriam Cader", "title": "Deputy Legal Director", "compensation": 329085, "related": 0, "other": 72600, "total": 401685}, {"name": "Mohammad Zaidi", "title": "Senior Director Of Nationwide Leadership And Planned Gifts", "compensation": 286006, "related": 0, "other": 88192, "total": 374198}, {"name": "Charu Verma", "title": "Director/vice President", "compensation": 0, "related": 0, "other": 0, "total": 0}, {"name": "Dax Goldstein", "title": "Director/secretary", "compensation": 0, "related": 0, "other": 0, "total": 0}, {"name": "Deborah Archer", "title": "Director/president", "compensation": 0, "related": 0, "other": 0, "total": 0}, {"name": "Shaakirrah Sanders", "title": "Director/general Counsel", "compensation": 0, "related": 0, "other": 0, "total": 0}, {"name": "Donita Judge", "title": "Director", "compensation": 0, "related": 0, "other": 0, "total": 0}, {"name": "Michelle Espino", "title": "Director", "compensation": 0, "related": 0, "other": 0, "total": 0}, {"name": "Ruth Colker", "title": "Director", "compensation": 0, "related": 0, "other": 0, "total": 0}, {"name": "Yomi Young", "title": "Director", "compensation": 0, "related": 0, "other": 0, "total": 0}], "pro_fundraising_fees": 561945, "other_salaries": 65923678, "contributions": 287910982, "program_revenue": 0, "investment_income": 9989186, "net_assets": 779690153, "filing": {"object_id": "202533449349300343", "source_url": "https://projects.propublica.org/nonprofits/organizations/136213516/202533449349300343/full", "schedules": {"ScheduleO": "Return Reference | Explanation | Form 990, Part III, Line 4d Description of other program services | (Expenses $ 11,304,349 including grants of $ 4,829,247)(Revenue $ 1,165,759) OTHER PROGRAM SERVICES: LEGISLATIVE ADVOCACY - THE ACLU SEEKS TO IMPACT CIVIL LIBERTIES THROUGH WORK ON LEGISLATION AT THE FEDERAL AND STATE LEVEL, AS APPROPRIATE. THE ORGANIZATION'S LEGISLATIVE ADVOCATES ARE A CONSTANT PRESENCE ON FEDERAL AND STATE CIVIL LIBERTIES LEGISLATIVE ISSUES. UPDATES ON KEY LEGISLATIVE ISSUES IMPACTING CIVIL LIBERTIES ARE INCLUDED IN MAIL, EMAIL, AND OTHER COMMUNICATIONS TO ACLU MEMBERS NATIONWIDE, AS WELL AS IN PUBLIC EDUCATION CAMPAIGNS. IN ADDITION, THE ACLU DEVELOPS POLICY RELATING TO POSITIONS ON CIVIL LIBERTIES ISSUES. EXPENSES $9,381,047. INCLUDING GRANTS OF $4,710,919. REVENUE $0. CIVIL LIBERTIES POLICY FORMULATION - THE BOARD OF DIRECTORS OF THE ACLU WORKS THROUGH ITS STANDING AND SPECIAL COMMITTEES TO ANALYZE CIVIL LIBERTIES ISSUES AND, WHERE APPROPRIATE, TO DEVELOP POLICIES THAT WILL SERVE AS THE FRAME OF REFERENCE FOR LEGISLATIVE, EDUCATIONAL AND CASE-SPECIFIC WORK AT THE NATIONAL LEVEL, AND THE ORGANIZATION IMPLEMENTS AND ASSISTS IN THE DEVELOPMENT OF POLICY GOALS THROUGH ITS AFFILIATES. EXPENSES $1,923,302. INCLUDING GRANTS OF $3,750. REVENUE $0. | Form 990, Part VI, Line 7a Members or stockholders electing members of governing body | ACLU FOUNDATION'S MEMBERS ELECT THE BOARD DIRECTORS OF ACLU FOUNDATION. | Form 990, Part VI, Line 7b Decisions requiring approval by members or stockholders | ACLU HAS THE AUTHORITY TO AMEND ITS BYLAWS, AND UNDER NEW YORK LAW, ACLU HAS THE RIGHT TO APPROVE A DECISION BY THE BOARD TO DISSOLVE, MERGE/CONSOLIDATE WITH ANOTHER ORGANIZATION OR DISPOSE OF ALL OR SUBSTANTIALLY ALL OF THE ORGANIZATION'S ASSETS. | Form 990, Part VI, Line 11b Review of form 990 by governing body | THE FORM 990 WAS PREPARED BY MANAGEMENT IN CONSULTATION WITH THE ORGANIZATION'S OUTSIDE ACCOUNTANTS. THE ORGANIZATION'S AUDIT COMMITTEE REVIEWED A DRAFT OF THE 990 AND PROVIDED COMMENTS. A COMPLETE COPY OF THE FORM 990 WAS PROVIDED TO THE ORGANIZATION'S GOVERNING BODY BEFORE IT WAS FILED. | Form 990, Part VI, Line 12c Conflict of interest policy | THE ORGANIZATION DISTRIBUTES ITS CONFLICT OF INTEREST POLICY ON AN ANNUAL BASIS TO EVERY KEY EMPLOYEE, OFFICER, BOARD DIRECTOR AND STANDING COMMITTEE MEMBER AND REQUESTS DISCLOSURE OF ANY POTENTIAL CONFLICTS OF INTEREST. THE DEPUTY EXECUTIVE DIRECTOR/GENERAL COUNSEL OF THE ORGANIZATION REVIEWS ANY DISCLOSURES MADE DURING THIS ANNUAL REVIEW. IF A MATTER IS RAISED THAT MAY BE A CONFLICT OF INTEREST INVOLVING A BOARD MEMBER, AN OFFICER OR A STANDING COMMITTEE MEMBER, DEPUTY EXECUTIVE DIRECTOR/GENERAL COUNSEL REFERS THE MATTER TO THE BOARD PRESIDENT AND APPROPRIATE FOLLOW UP IS UNDERTAKEN AS SET FORTH IN THE POLICY. IF A MATTER IS RAISED THAT MAY BE A CONFLICT OF INTEREST INVOLVING A KEY EMPLOYEE, DEPUTY EXECUTIVE DIRECTOR/GENERAL COUNSEL REFERS THE MATTER TO THE EXECUTIVE DIRECTOR OR THEIR DESIGNEE AND APPROPRIATE FOLLOW UP IS UNDERTAKEN AS SET FORTH IN THE POLICY. BOARD DIRECTORS, OFFICERS, STANDING COMMITTEE MEMBERS AND KEY EMPLOYEES ALSO MAY REPORT TO THE BOARD ANY POTENTIAL CONFLICTS OF INTEREST THAT ARISE DURING THE YEAR. THE ORGANIZATION'S CONFLICT OF INTEREST POLICY REQUIRES, AMONG OTHER THINGS, THAT INDIVIDUALS WITH CONFLICTS OF INTEREST WITH RESPECT TO A TRANSACTION OR ACTION MAY NOT PARTICIPATE IN THE DECISION-MAKING WITH RESPECT TO THAT TRANSACTION OR ACTION AND IN SOME CIRCUMSTANCES MAY NOT PARTICIPATE IN THE DISCUSSION. | Form 990, Part VI, Line 15a Process to establish compensation of top management official | THE EXECUTIVE DIRECTOR/CEO, OFFICERS AND VARIOUS KEY EMPLOYEES ARE NOT PAID BY AMERICAN CIVIL LIBERTIES UNION FOUNDATION, INC. COMPENSATION IS PAID DIRECTLY BY AMERICAN CIVIL LIBERTIES UNION, INC., A RELATED 501(C)(3) ORGANIZATION, AND SALARY EXPENSE IS ALLOCATED TO THE FILING ORGANIZATION. ACLU AND AMERICAN CIVIL LIBERTIES UNION FOUNDATION HAVE ESTABLISHED THE FOLLOWING PROCEDURES TO DETERMINE THE COMPENSATION OF THESE INDIVIDUALS: THE BOARD OF THE ORGANIZATION AND THE EXECUTIVE COMMITTEE OF THE ACLU BOARD ESTABLISH THE EXECUTIVE DIRECTOR/CEO'S COMPENSATION. THE ORGANIZATION'S AUDIT COMMITTEE APPROVES THE COMPENSATION OF ITS KEY EMPLOYEES AND OFFICERS AS RECOMMENDED BY THE EXECUTIVE DIRECTOR/CEO. NO MEMBER OF THE BOARD OF THE ORGANIZATION, THE EXECUTIVE COMMITTEE OF THE ACLU OR EITHER ORGANIZATION'S AUDIT COMMITTEE (EACH A \"LAY LEADER BODY\") HAS A CONFLICT OF INTEREST WITH RESPECT TO THE COMPENSATION ARRANGEMENT. EACH LAY LEADER BODY REVIEWS COMPENSATION STUDIES AND COMPARABLE COMPENSATION DATA FOR FUNCTIONALLY COMPARABLE POSITIONS AT SIMILARLY SITUATED ORGANIZATIONS. EACH LAY LEADER BODY CONTEMPORANEOUSLY DOCUMENTS AND RECORDS, IN ITS MINUTES, ITS DELIBERATIONS AND DECISIONS. NO ACLU OFFICER RECEIVES COMPENSATION IN THEIR CAPACITY AS A DIRECTOR. | Form 990, Part VI, Line 19 Required documents available to the public | UPON REQUEST, THE ORGANIZATION WILL MAKE AVAILABLE THE 990S AND FINANCIAL STATEMENTS FOR SEVERAL YEARS, BYLAWS, CONFLICT OF INTEREST POLICY AND APPLICATION FOR TAX EXEMPT STATUS WHICH ARE REQUIRED TO BE DISCLOSED UNDER THE PUBLIC INSPECTION LAWS. THESE DOCUMENTS ARE ALSO AVAILABLE ON THE ACLU'S WEBSITE. | Form 990, Part VII, Section A, Line 1a, Column (B) | THE NUMBER OF HOURS REPORTED FOR THOSE INDIVIDUALS RECEIVING COMPENSATION IS BASED ON WEEKLY HOURS FOR PAYROLL PURPOSES. THE ACTUAL NUMBER OF HOURS WORKED IS CONSIDERABLY HIGHER. | Form 990, Part VIII, Line 11d Other Miscellaneous Revenue | TUITION & FEES - Total Revenue: 441245, Related or Exempt Function Revenue: 0, Unrelated Business Revenue: 0, Revenue Excluded from Tax Under Sections 512, 513, or 514: 441245; | Form 990, Part XI, Line 9 Other changes in net assets or fund balances | CHANGES IN VALUE OF SPLIT-INTEREST AGREEMENTS - -624503; LOSS ON UNCOLLECTIBLE PLEDGES - -2999277; CHANGES IN BENEFIT OBLIGATION OTHER THAN NET PERIODIC COST - -1325404; NET PERIODIC COST OTHER THAN SERVICE COSTS - 1192746; Total - -3756438; | For Paperwork Reduction Act Notice, see the Instructions for Form 990 or 990-EZ. | Cat. No. 51056K | Schedule O (Form 990) (Rev. 1-2025) | Additional Data | Software ID: | 24020961 | Software Version: | 2024v5.1 | ", "ScheduleJ": 12817, "ScheduleR": 9426}, "tax_year": 2024, "part_ix": {"total": 245542362, "program": 205120823, "management": 1  Explanation | Form 990, Part III, Line 4d Description of other program services | (Expenses $ 11,304,349 including grants of $ 4,829,247)(Revenue $ 1,165,759) OTHER PROGRAM SERVICES: LEGISLATIVE ADVOCACY - THE ACLU SEEKS TO IMPACT CIVIL LIBERTIES THROUGH WORK ON LEGISLATION AT THE FEDERAL AND STATE LEVEL, AS APPROPRIATE. THE ORGANIZATION'S LEGISLATIVE ADVOCATES ARE A CONSTANT PRESENCE ON FEDERAL AND STATE CIVIL LIBERTIES LEGISLATIVE ISSUES. UPDATES ON KEY LEGISLATIVE ISSUES IMPACTING CIVIL LIBERTIES ARE INCLUDED IN MAIL, EMAIL, AND OTHER COMMUNICATIONS TO ACLU MEMBERS NATIONWIDE, AS WELL AS IN PUBLIC EDUCATION CAMPAIGNS. IN ADDITION, THE ACLU DEVELOPS POLICY RELATING TO POSITIONS ON CIVIL LIBERTIES ISSUES. EXPENSES $9,381,047. INCLUDING GRANTS OF $4,710,919. REVENUE $0. CIVIL LIBERTIES POLICY FORMULATION - THE BOARD OF DIRECTORS OF THE ACLU WORKS THROUGH ITS STANDING AND SPECIAL COMMITTEES TO ANALYZE CIVIL LIBERTIES ISSUES AND, WHERE APPROPRIATE, TO DEVELOP POLICIES THAT WILL SERVE AS THE FRAME OF REFERENCE FOR LEGISLATIVE, EDUCATIONAL AND CASE-SPECIFIC WORK AT THE NATIONAL LEVEL, AND THE ORGANIZATION IMPLEMENTS AND ASSISTS IN THE DEVELOPMENT OF POLICY GOALS THROUGH ITS AFFILIATES. EXPENSES $1,923,302. INCLUDING GRANTS OF $3,750. REVENUE $0. | Form 990, Part VI, Line 7a Members or stockholders electing members of governing body | ACLU FOUNDATION'S MEMBERS ELECT THE BOARD DIRECTORS OF ACLU FOUNDATION. | Form 990, Part VI, Line 7b Decisions requiring approval by members or stockholders | ACLU HAS THE AUTHORITY TO AMEND ITS BYLAWS, AND UNDER NEW YORK LAW, ACLU HAS THE RIGHT TO APPROVE A DECISION BY THE BOARD TO DISSOLVE, MERGE/CONSOLIDATE WITH ANOTHER ORGANIZATION OR DISPOSE OF ALL OR SUBSTANTIALLY ALL OF THE ORGANIZATION'S ASSETS. | Form 990, Part VI, Line 11b Review of form 990 by governing body | THE FORM 990 WAS PREPARED BY MANAGEMENT IN CONSULTATION WITH THE ORGANIZATION'S OUTSIDE ACCOUNTANTS. THE ORGANIZATION'S AUDIT COMMITTEE REVIEWED A DRAFT OF THE 990 AND PROVIDED COMMENTS. A COMPLETE COPY OF THE FORM 990 WAS PROVIDED TO THE ORGANIZATION'S GOVERNING BODY BEFORE IT WAS FILED. | Form 990, Part VI, Line 12c Conflict of interest policy | THE ORGANIZATION DISTRIBUTES ITS CONFLICT OF INTEREST POLICY ON AN ANNUAL BASIS TO EVERY KEY EMPLOYEE, OFFICER, BOARD DIRECTOR AND STANDING COMMITTEE MEMBER AND REQUESTS DISCLOSURE OF ANY POTENTIAL CONFLICTS OF INTEREST. THE DEPUTY EXECUTIVE DIRECTOR/GENERAL COUNSEL OF THE ORGANIZATION REVIEWS ANY DISCLOSURES MADE DURING THIS ANNUAL REVIEW. IF A MATTER IS RAISED THAT MAY BE A CONFLICT OF INTEREST INVOLVING A BOARD MEMBER, AN OFFICER OR A STANDING COMMITTEE MEMBER, DEPUTY EXECUTIVE DIRECTOR/GENERAL COUNSEL REFERS THE MATTER TO THE BOARD PRESIDENT AND APPROPRIATE FOLLOW UP IS UNDERTAKEN AS SET FORTH IN THE POLICY. IF A MATTER IS RAISED THAT MAY BE A CONFLICT OF INTEREST INVOLVING A KEY EMPLOYEE, DEPUTY EXECUTIVE DIRECTOR/GENERAL COUNSEL REFERS THE MATTER TO THE EXECUTIVE DIRECTOR OR THEIR DESIGNEE AND APPROPRIATE FOLLOW UP IS UNDERTAKEN AS SET FORTH IN THE POLICY. BOARD DIRECTORS, OFFICERS, STANDING COMMITTEE MEMBERS AND KEY EMPLOYEES ALSO MAY REPORT TO THE BOARD ANY POTENTIAL CONFLICTS OF INTEREST THAT ARISE DURING THE YEAR. THE ORGANIZATION'S CONFLICT OF INTEREST POLICY REQUIRES, AMONG OTHER THINGS, THAT INDIVIDUALS WITH CONFLICTS OF INTEREST WITH RESPECT TO A TRANSACTION OR ACTION MAY NOT PARTICIPATE IN THE DECISION-MAKING WITH RESPECT TO THAT TRANSACTION OR ACTION AND IN SOME CIRCUMSTANCES MAY NOT PARTICIPATE IN THE DISCUSSION. | Form 990, Part VI, Line 15a Process to establish compensation of top management official | THE EXECUTIVE DIRECTOR/CEO, OFFICERS AND VARIOUS KEY EMPLOYEES ARE NOT PAID BY AMERICAN CIVIL LIBERTIES UNION FOUNDATION, INC. COMPENSATION IS PAID DIRECTLY BY AMERICAN CIVIL LIBERTIES UNION, INC., A RELATED 501(C)(3) ORGANIZATION, AND SALARY EXPENSE IS ALLOCATED TO THE FILING ORGANIZATION. ACLU AND AMERICAN CIVIL LIBERTIES UNION FOUNDATION HAVE ESTABLISHED THE FOLLOWING PROCEDURES TO DETERMINE THE COMPENSATION OF THESE INDIVIDUALS: THE BOARD OF THE ORGANIZATION AND THE EXECUTIVE COMMITTEE OF THE ACLU BOARD ESTABLISH THE EXECUTIVE DIRECTOR/CEO'S COMPENSATION. THE ORGANIZATION'S AUDIT COMMITTEE APPROVES THE COMPENSATION OF ITS KEY EMPLOYEES AND OFFICERS AS RECOMMENDED BY THE EXECUTIVE DIRECTOR/CEO. NO MEMBER OF THE BOARD OF THE ORGANIZATION, THE EXECUTIVE COMMITTEE OF THE ACLU OR EITHER ORGANIZATION'S AUDIT COMMITTEE (EACH A \"LAY LEADER BODY\") HAS A CONFLICT OF INTEREST WITH RESPECT TO THE COMPENSATION ARRANGEMENT. EACH LAY LEADER BODY REVIEWS COMPENSATION STUDIES AND COMPARABLE COMPENSATION DATA FOR FUNCTIONALLY COMPARABLE POSITIONS AT SIMILARLY SITUATED ORGANIZATIONS. EACH LAY LEADER BODY CONTEMPORANEOUSLY DOCUMENTS AND RECORDS, IN ITS MINUTES, ITS DELIBERATIONS AND DECISIONS. NO ACLU OFFICER RECEIVES COMPENSATION IN THEIR CAPACITY AS A DIRECTOR. | Form 990, Part VI, Line 19 Required documents available to the public | UPON REQUEST, THE ORGANIZATION WILL MAKE AVAILABLE THE 990S AND FINANCIAL STATEMENTS FOR SEVERAL YEARS, BYLAWS, CONFLICT OF INTEREST POLICY AND APPLICATION FOR TAX EXEMPT STATUS WHICH ARE REQUIRED TO BE DISCLOSED UNDER THE PUBLIC INSPECTION LAWS. THESE DOCUMENTS ARE ALSO AVAILABLE ON THE ACLU'S WEBSITE. | Form 990, Part VII, Section A, Line 1a, Column (B) | THE NUMBER OF HOURS REPORTED FOR THOSE INDIVIDUALS RECEIVING COMPENSATION IS BASED ON WEEKLY HOURS FOR PAYROLL PURPOSES. THE ACTUAL NUMBER OF HOURS WORKED IS CONSIDERABLY HIGHER. | Form 990, Part VIII, Line 11d Other Miscellaneous Revenue | TUITION & FEES - Total Revenue: 441245, Related or Exempt Function Revenue: 0, Unrelated Business Revenue: 0, Revenue Excluded from Tax Under Sections 512, 513, or 514: 441245; | Form 990, Part XI, Line 9 Other changes in net assets or fund balances | CHANGES IN VALUE OF SPLIT-INTEREST AGREEMENTS - -624503; LOSS ON UNCOLLECTIBLE PLEDGES - -2999277; CHANGES IN BENEFIT OBLIGATION OTHER THAN NET PERIODIC COST - -1325404; NET PERIO ssets": 0.203}}, {"name": "Public Advocates Inc", "ein": "23-7103042", "relationship": "direct_competitor", "latest_year": 2025, "revenue": 9884918, "expenses": 7417229, "top_paid_name": "Guillermo Mayer", "top_paid_total": 265352, "ratios": {"top_paid_pct": 3.58, "officer_comp_pct": 15.64, "personnel_pct": 40.97, "program_pct": 71.23, "fundraising_pct": 8.0, "cost_to_raise_a_dollar": 0.064, "reserves_months": 29.2, "margin_3y": 12.08, "contrib_share": 93.61, "revenue_cagr": 9.35, "liabilities_to_assets": 0.112}}]}, "method_note": "No Form 990 data with revenue and expenses found for this EIN."}, "scan": {"summary": "Public-record scan of the ACLU Foundation of Northern California (EIN 94-0279770) and its 501(c)(4) sister, the \"Union\" (EIN 94-2151925). FY = fiscal year ending March 31.\n\nBOTTOM LINE: No red flag for integrity or solvency was found. The real issues are a restructuring in late 2024 that remains poorly documented, a 17-year executive tenure with no succession evidence found, and opaque money flows to the national ACLU. The core primary documents could not be read: Part IX and Schedules O, L, R and I for FY24-FY25, and the FY25 audit. Those PDFs and ProPublica's filing viewer did not render through the fetch tool. Everything from those documents below comes from search snippets or aggregators and is labeled that way. The opinion paragraphs of the audits were not read.\n\nCORRECTION TO THE ENTITY MAP: The map found no evidence of a parent-subsidiary relationship. Schedule O and Schedule R snippets say the Union appoints the Foundation's board as \"Designator\", and Foundation bylaw amendments need the Union's consent. Union directors are elected by members. Separately, the Foundation's board sets executive pay through its Personnel Committee and budget. So the deductible entity's board is appointed by the non-deductible one. That is a governance fact to understand, not an impropriety finding.\n\nTHE RED FLAG IS MOSTLY ONE YEAR PLUS AN ACCOUNTING BASIS: The -10.32% three-year margin is driven by FY24 (-57.13%). That year, 990 revenue excludes unrealized investment gains: the Foundation's 990 deficit was $6.95M, but net assets fell only $3.51M. The combined audit shows -$3,299,086 for FY24. Still, the operating gap was real. Compensation rose about $2.3M (aggregator) while contributions and program revenue fell about $4.3M. Restructuring was reported in October 2024, about seven months after that year closed. FY25 rebounded to +9.27% on $20.2M of contributions. No source explains that jump directly.\n\nEFFICIENCY: FY23 program share was about 76.9% and FY25 about 78.0% of 990 total expenses (my arithmetic on Part III snippet or aggregator data, not Part IX). The combined audit shows program services of $23,928,698 in FY24 and $25,269,805 in FY23, or about 82% of about $29.2M in FY24 (snippet). These bases differ because audits and annual reports include donated legal services ($3,897,778 in FY24; $6,843,418 in FY22), and 990 totals appear not to. The FY22 annual-report total of $22,076,736 exceeds the 990 total of $15,233,319 by $6,843,417, almost exactly the in-kind figure. Note that the FY2022 row in functional_expenses is on this annual-report basis, not the 990 basis.\n\nMONEY LEAVING THE FOUNDATION OR UNION: The Foundation granted $725,000 to the Union for legislative work in FY25, up from $300,000 in 2020 (aggregators). The Union reported $2,548,286 of grants in FY24, and InfluenceWatch (citing Candid) shows about $2.1M-$2.6M a year to ACLU California Action in 2022-2024. A $3M one-off grant to national for voting-rights work is documented by the FY22 annual report, and aggregators list $3M grants to national entities with conflicting years. The ongoing national gift-sharing formula remains unknown. Audit balances show $422,114 due from the National Union and $620,989 due to the National Foundation at 3/31/2024.\n\nRATINGS: Charity Navigator 97%, four stars, FY25 data; the only metric missed in the Accountability section is posting tax forms on the website (the site's 990 list stops at FY22). Candid Platinum 2025. No BBB or CharityWatch rating found. California AG status comes only from a secondary source: \"Current - Awaiting Reporting\".\n\nCONTROVERSY: One relevant negative item: Above the Law (Oct 29, 2024) reported, from anonymous insiders, layoffs and program cuts, plus an allegation that leadership was pushing out long-time legal staff. The organization did not respond to the outlet. Final numbers and the board outcome were not found. In 2020, management declined voluntary union recognition before staff petitioned the NLRB. No regulatory action, finding against the organization, or employee suit was found. Beware misattribution: the Broccolo suit (2024) and the 2013 loyalty-letter dispute involve the Southern California affiliate and national ACLU respectively, not this organization.\n\nPROGRAM EVIDENCE: Litigation wins are independently checkable, notably the courthouse-arrest rulings of Dec 2025 and June 2026 in Northern California, and the partial Siskiyou County settlement. Impact claims beyond case outcomes and membership counts are self-reported. No independent outcome evaluation was found.", "functional_expenses": [{"year": 2025, "program": 15449667, "management": null, "fundraising": null, "total": 19816451, "source_url": "https://www.intellispect.co/organizations/940279770-american-civil-liberties-unio"}, {"year": 2024, "program": null, "management": null, "fundraising": null, "total": 19118675, "source_url": "https://projects.propublica.org/nonprofits/organizations/940279770/202500369349301225/full"}, {"year": 2023, "program": 12716090, "management": null, "fundraising": null, "total": 16542137, "source_url": "https://pdf.guidestar.org/PDF_Images/2023/940/279/2023-940279770-202420329349300647-9.pdf"}, {"year": 2022, "program": 17985790, "management": 2530963, "fundraising": 1559983, "total": 22076736, "source_url": "https://annualreport.aclunc.org/2022  {"flag_key": "affiliate_94-2151925:top_paid_pct", "explanation": "Mostly a false positive. The 6.72% ratio divides Burlingame's $413,453 total across entities by the Union's $6.15M of expenses. The Union itself reports only $37,835 of that as its own compensation column, about 0.6% of its expenses (my arithmetic). The rest is Foundation pay and other compensation. Note that this person's FY25 total is higher than the Executive Director's, and the staff page now shows Agarwal as Legal Director. Whether FY25 includes transition or retirement payments is unknown and worth asking.", "basis": "inference", "confidence": 0.8, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/942151925", "title": "ProPublica: ACLU of Northern California"}, {"url": "https://www.aclunorcal.org/about-staff/", "title": "ACLU NorCal staff page"}]}, {"flag_key": "affiliate_94-2151925:revenue_volatility", "explanation": "Union revenue swings follow program revenue, which appears to be membership: $5.60M (FY23), $3.49M (FY24), $5.66M (FY25). The balance due from the National Union fell from $2,875,813 to $422,114 during FY24. A hypothesis worth checking is that remittance timing from national, rather than member behavior, explains part of the FY24 dip; the membership accounting note was not read. The FY23 expense spike to $9.98M coincides with a listed $3M grant to ACLU Inc.", "basis": "speculation", "confidence": 0.45, "sources": [{"url": "https://www.aclunorcal.org/app/uploads/2026/03/ACLU-Foundation-and-Union-of-Northern-California-Audit-FY24-1.pdf", "title": "FY24 consolidated audit (search snippet)"}, {"url": "https://www.influencewatch.org/non-profit/aclu-of-northern-california/", "title": "InfluenceWatch: ACLU of Northern California (critical framing; citing Candid)"}]}, {"flag_key": "affiliate_13-6213516:officer_comp_pct,reserves_months,contrib_share,revenue_volatility", "explanation": "The national ACLU Foundation's flags were not researched, because that entit tt.org/?p=28979118", "title": "Hewlett grant record"}]}, {"name": "Concentration read (all funders)", "amount": "1,073 grants, $58,542,491, from 191 funders (all-time per Candid via InfluenceWatch); foundation grants $471,614 in the 2023 report", "year": "Through 2025", "note": "No single-funder concentration is visible. The real exposure is unnamed individuals, bequests and DAF conduits. Government contracts: none found; a 2015 report says no government funding, and nothing current confirms it. National ACLU Foundation is also listed as a 2025 grant source (Impala), amount not shown.", "sources": [{"url": "https://www.influencewatch.org/non-profit/aclu-foundation-of-northern-california2/", "title": "InfluenceWatch, citing Candid"}, {"url": "https://impala.digital/public/profiles/94-0279770/overview", "title": "Impala profile"}, {"url": "https://www.aclunorcal.org/sites/default/files/2015_annual_report.pdf", "title": "2015 annual report (search snippet)"}]}], "program_claims": [{"claim": "ACLU NorCal and partners stopped ICE courthouse arrests in Northern California (organization: 'ordered DHS to cease all arrests at immigration courts in Northern California').", "evidence_status": "independently_verified", "detail": "Multiple news reports and the case record describe Judge Pitts's Dec 24, 2025 stay and a June 2026 summary-judgment ruling vacating three ICE policies. Reports disagree on the June scope (Hoodline: nationwide; Local News Matters per search summary: limited to the SF Area of Responsibility). An ACLU of New York release dated Oct 1, 2026 describes a later nationwide ruling, not confirmed elsewhere in this research. Appeal status: no evidence found. The ruling is verified. Actual reduction in arrests was not measured. Multiple organizations share credit.", "sources": [{"url": "https://missionlocal.org/2025/12/sf-ice-courthouse-arrests-lawsuit-aclu/", "title": "Mission Local, Dec 2025"}, {"url": "https://ktvu.com/news/judge-orders-halt-ice-arrests-san-francisco-courthouse", "title": "KTVU"}, {"url": "https://hoodline.com/2026/06/sf-judge-slaps-nationwide-freeze-on-ice-courthouse-arrests/", "title": "Hoodline, June 2026"}, {"url": "https://aclu.org/press-releases/federal-court-strikes-down-ices-courthouse-arrest-policy-nationwide", "title": "ACLU press release, Oct 2026"}]}, {"claim": "Siskiyou County case won policy change for Asian American residents.", "evidence_status": "independently_verified", "detail": "January 2026 report of a partial settlement: new traffic-stop policy prohibiting race-based stops, a paid compliance auditor and biannual community meetings, plus lifted property liens. Water-access claims were not resolved at that time. An earlier related case led the county to repeal water ordinances (NBC, 2023). Compliance outcomes are not yet known.", "sources": [{"url": "https://nextshark.com/siskiyou-county-settlement-asian-discrimination-lawsuit", "title": "NextShark, Jan 23, 2026"}, {"url": "https://www.nbcnews.com/news/asian-america/california-county-repeals-water-regulations-asian-americans-say-target-rcna98621", "title": "NBC News"}]}, {"claim": "'Grew to over 120,000 ACLU members in Northern California, 20% more than last year' (2025 annual report).", "evidence_status": "self_reported_with_data", "detail": "From a search snippet; the PDF was unreadable. Partial corroboration: Union program revenue, apparently membership, rose from $3.49M (FY24) to $5.66M (FY25). The periods do not match exactly and the count is not independently audited.", "sources": [{"url": "https://www.aclunorcal.org/app/uploads/2026/06/2025-ACLU-NorCal-annual-report.pdf", "title": "2025 annual report (search snippet)"}, {"url": "https://projects.propublica.org/nonprofits/organizations/942151925", "title": "ProPublica: ACLU of Northern California"}]}, {"claim": "'Filed new legal actions while continuing to advance 40 ongoing cases' (2025 annual report).", "evidence_status": "self_reported_with_data", "detail": "The number of new actions was garbled in the snippet. A public case docket exists, and specific matters checked exist (for example SmartRent, filed Dec 4, 2025; San Jose Flock suit, April 2026). The totals were not tallied against the docket. Case counts are outputs, not outcomes.", "sources": [{"url": "https://www.aclunorcal.org/app/uploads/2026/06/2025-ACLU-NorCal-annual-report-2.pdf", "title": "2025 annual report (search snippet)"}, {"url": "https://www.aclunorcal.org/cases/san-francisco-tenants-union-v-smart-rent/", "title": "SmartRent case page"}, {"url": "https://www.404media.co/aclu-and-eff-sue-a-city-blanketed-with-flock-surveillance-cameras/", "title": "404 Media"}]}, {"claim": "'The first year of Trump 2.0 was perhaps the busiest in our 90-plus year history.'", "evidence_status": "self_reported_no_data", "detail": "Rhetorical claim on the annual report page. No comparison data was seen. News volume since September 2025 fits the direction, but cannot test the claim.", "sources": [{"url": "https://www.aclunorcal.org/annualreport/", "title": "2025 Annual Report page"}]}], "media_footprint": {"volume": "Moderate to high for a regional affiliate in 2025-2026, mainly tied to immigration, surveillance and local government suits. Lower and thinner on the institution itself: one article about internal affairs found in three years.", "tone": "Mostly neutral case reporting, with organization statements quoted. Partisan outlets and profiles (for example InfluenceWatch) are critical of its positions. The only institutional criticism found is the anonymously sourced Above the Law piece.", "pattern": "Coverage follows filings and rulings: ICE courthouse arrests (Sept 2025 onward), re-detention, the DHS records suit (June 2026), San Jose Flock cameras (April 2026), the Siskiyou settlement (January 2026). The organization is covered as a litigant rather than as an institution, so the press offers little check on its management. Several hits are low-quality aggregators (Hoodline), and no Chronicle, CalMatters or KQED article on the organization's management surfaced. This pattern is drawn from the search results reviewed, not a full media audit.", "basis": "inference", "sources": [{"url": "https://www.axios.com/local/san-francisco/2025/09/19/ice-courthouse-arrests-civil-rights-lawsuit", "title": "Axios, Sept 2025"}, {"url": "https://missionlocal.org/2025/12/sf-ice-courthouse-arrests-lawsuit-aclu/", "title": "Mission Local, Dec 2025"}, {"url": "https://www.404media.co/aclu-and-eff-sue-a-city-blanketed-with-flock-surveillance-cameras/", "title": "404 Media"}, {"url": "https://hoodline.com/2026/06/aclu-drags-dhs-into-san-francisco-court-over-records-on-filming-feds/", "title": "Hoodline, June 2026"}, {"url": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "title": "Above the Law, Oct 2024"}, {"url": "https://www.influencewatch.org/non-profit/aclu-of-northern-california/", "title": "InfluenceWatch"}]}, "gaps": ["Part IX program, management and fundraising split for FY23, FY24 and FY25: not obtained. ProPublica's filing pages returned only 'Loading...', its XML returned 403, and GuideStar and organization PDFs were unreadable compressed data. Saved copies of several PDFs sit in the session tool-results folder and need a text extractor. Program totals shown are Part III snippet or aggregator data; FY24 program is blank.", "FY22 functional row is on the annual-report basis, including about $6.84M of donated legal services, and is not comparable to the 990 totals in other rows. The annual-report page also had placeholder text, and the search summary's stated period (July-June) conflicts with the March 31 year-end.", "FY25 audit contents: not read at all. FY23-FY24 opinion paragraphs, going-concern conclusion, material weaknesses, restatements and auditor name for FY24-FY25: not confirmed.", "Current national gift-sharing formula and FY25 dollars sent to national: no evidence found. Whether restricted or major gifts are exempt from sharing: no evidence found.", "Schedule L (related-party transactions), Part VI (independent directors, family relationships, whistleblower and conflict policies), Schedule O for FY24-FY25, Schedule I and Schedule R for FY25: not read. Charity Navigator's secondary checks on diversion, loans and audit committee are the only coverage.", "Personnel figures conflict: the extract shows personnel at 59.79% of FY25 Foundation expenses; Intellispect shows compensation and benefits at $15,389,632, or 77.7%. Unresolved. FY25 'service-provider' expenses of $1,337,263 against $22,612 in FY24 and the fall in 'other expenses' may be reclassification; not checked.", "Explanation for the FY25 contribution jump of $9.17M, including bequest amount and any single large gift: no evidence found. The $1,000,000 contribution receivable due 2028 has no named source.", "October 2024 restructuring: board vote result, number laid off, programs ended, severance cost, union response and any organization statement: no evidence found. No Local 20 statement or contract was found. NLRB docket not searched.", "Soltani succession plan or departure: no evidence found. Announcements for Steinbach, Tapken, Le, Burlingame or the Bailey-to-Stuart chair change: no evidence found. Current CFO-level officer: not established.", "BBB Wise Giving Alliance and CharityWatch ratings: no evidence found for this entity in search; their own databases were not queried directly.", "California AG Registry and IRS TEOS: not checked directly. No AG delinquency notice found in search. No direct search of court dockets for suits against the organization.", "Annual reports for 2024 and 2025: PDFs unreadable, so only snippets were seen. Named donor lists, if any, not reviewed. Strategic plan text not read; date range is reported inconsistently (2025-2028 vs 2025-2029).", "Government grants or contracts: no evidence found; the most recent statement of no government funding is from 2015. Schedule of attorney-fee revenue by case: no evidence found.", "Independent evaluation of program outcomes: no evidence found. Evidence covers rulings and settlements, not effects on people.", "Year conflicts in aggregators on the $3M national grants: InfluenceWatch lists $3M to ACLU Foundation Inc in 2021 and $3M from the Union to ACLU Inc in 2023; the FY22 annual report says the affiliate allocated $3M to national. These may be one or two grants. Not resolved. Their role in the FY21 and Union FY23 deficits is inference.", "ACLU California Action: the $2.1M-$2.6M annual grants rest on InfluenceWatch citing Candid. The Union's FY24 Part III grants figure of $2,548,286 fits this, but no Schedule I was read."], "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/940279770", "title": "ProPublica: ACLU Foundation of Northern California"}, {"url": "https://projects.propublica.org/nonprofits/organizations/942151925", "title": "ProPublica: ACLU of Northern California"}, {"url": "https://projects.propublica.org/nonprofits/organizations/940279770/202620339349300347/full", "title": "Foundation filing FYE 3/2025 (page did not load filing content)"}, {"url": "https://pdf.guidestar.org/PDF_Images/2023/940/279/2023-940279770-202420329349300647-9.pdf", "title": "Foundation Form 990 FYE 3/2023, GuideStar (search snippet)"}, {"url": "https://pdf.guidestar.org/PDF_Images/2024/942/151/2024-942151925-202530369349301138-.pdf", "title": "Union Form 990 FYE 3/2024, GuideStar (search snippet)"}, {"url": "https://www.aclunorcal.org/sites/default/files/ACLU_2022_990.pdf", "title": "ACLU NorCal Form 990 (search snippet)"}, {"url": "https://www.aclunorcal.org/app/uploads/2026/03/ACLU-Foundation-and-Union-of-Northern-California-Audit-FY24-1.pdf", "title": "FY24 consolidated audit (search snippets)"}, {"url": "https://www.aclunc.org/sites/default/files/ACLU%20Foundation%20and%20Union%20of%20Northern%20California%20Audit%20FY23.pdf", "title": "FY23 consolidated audit (search snip erties-union-foundation-of-northern-california-940279770", "title": "GrantedAI: Foundation"}, {"url": "https://www.influencewatch.org/non-profit/aclu-foundation-of-northern-california2/", "title": "InfluenceWatch: Foundation"}, {"url": "https://www.influencewatch.org/non-profit/aclu-of-northern-california/", "title": "InfluenceWatch: Union"}, {"url": "https://www.haasjr.org/node/1149", "title": "Haas Jr. Fund grantee page"}, {"url": "https://abovethelaw.com/2024/10/layoffs-are-headed-for-public-interest-attorneys-in-northern-california/", "title": "Above the Law, Oct 29, 2024"}, {"url": "https://www.ifpte.org/news/staff-at-aclu-of-northern-california-file-for-union-recognition-with-nlrb", "title": "IFPTE release, May 13, 2020"}, {"url": "https://news.bloomberglaw.com/litigation/former-aclu-official-alleges-discriminatory-firing-over-politics", "title": "Bloomberg Law, July 8, 2024 (Southern California affiliate)"}, {"url": "https://missionlocal.org/2025/12/sf-ice-courthouse-arrests-lawsuit-aclu/", "title": "Mission Local, Dec 2025"}, {"url": "https://nextshark.com/siskiyou-county-settlement-asian-discrimination-lawsuit", "title": "NextShark, Jan 23, 2026"}, {"url": "https://www.404media.co/aclu-and-eff-sue-a-city-blanketed-with-flock-surveillance-cameras/", "title": "404 Media"}]}, "results": {"mode": {"primary": "qualitative", "rationale": "The work is impact litigation, legislation, ballot positions and organizing. A cost per outcome would be false precision. The organization publishes no outcome data that could feed one, and no affected-person counts exist for its largest rulings. Case outcomes can be checked independently; effects on people mostly cannot."}, "outcomes": [{"rank": 1, "what_changed": "Pablo Sequen v. Albarran (N.D. Cal., Judge Pitts). A Dec 24, 2025 stay halted ICE and EOIR immigration-courthouse arrest policies in ICE's San Francisco area of responsibility. Partial summary judgment on June 23, 2026 and final judgment on June 30, 2026 vacated ICE Policies 11072.3 and 11072.4, EOIR memo 25-06 and the June 2025 nationwide hold-room waiver. Stay pending appeal denied July 10, 2026.", "for_whom": "People attending immigration court nationwide, and people held in ICE short-term hold rooms.", "count": "Not counted. Co-counsel say the policies enabled 'thousands' of arrests since May 2025, with no figure given. A secondhand report says ICE detained no one at San Francisco immigration court after the stay, as of March 2026.", "year": 2026, "program": "Immigrants' rights litigation (Foundation)", "durability": "too_early", "contribution": "co_lead", "counterfactual": "The nationwide result would probably have come anyway, somewhat later. A separate NYCLU and ACLU suit in S.D.N.Y., filed Aug 1, 2025, before this one (Sept 18, 2025), reached a nationwide ruling on Oct 1, 2026. The ACLU's release says that ruling builds on Sequen. The strongest unique claim is about nine months of relief in Northern California before S.D.N.Y. ruled, plus the hold-room relief, which the S.D.N.Y. release does not list (inference).", "others_involved": ["Lawyers' Committee for Civil Rights of the SF Bay Area", "CARECEN SF", "Coblentz Patch Duffy & Bass", "NYCLU and national ACLU (parallel S.D.N.Y. case)"], "significance": 4, "evidence_quality": "independently_verified", "evidence": "The orders are on the public record. The effect on arrests is not measured, apart from one secondhand press report. The ruling leaves arrests outside courthouses, and arrests inside under the prior policies' limits, available. No Ninth Circuit merits ruling found as of today. The Daily Signal argues the ruling conflicts with Supreme Court precedent, so reversal risk is live. Arrests at state courthouses are a separate matter; a Central Valley report describes them rising in summer 2026.", "basis": "evidence", "sources": [{"url": "https://lccrsf.org/pressroom_posts/federal-court-delivers-crushing-blow-to-trumps-mass-deportation-agenda-striking-down-courthouse-arrests-nationwide-and-restoring-protections-against-inhumane-detention/", "title": "LCCRSF release, June 24, 2026"}, {"url": "https://111things.com/national/judge-leaves-courthouse-arrest-policies-vacated-during-appeal/", "title": "Judge leaves courthouse arrest policies vacated during appeal"}, {"url": "https://caselaw.findlaw.com/court/us-dis-crt-n-d-cal/118075512.html", "title": "Pablo Sequen v. Albarran (2025), FindLaw"}, {"url": "https://www.aclunorcal.org/cases/pablo-sequen-v-albarran/", "title": "ACLU NorCal case page"}, {"url": "https://aclu.org/press-releases/federal-court-strikes-down-ices-courthouse-arrest-policy-nationwide", "title": "ACLU release on S.D.N.Y. ruling, Oct 1, 2026"}, {"url": "https://www.keker.com/news/news-items/bay-area-legal-coalition-pushes-back-ice-detentions", "title": "Keker summary of SF Standard, Mar 2026"}, {"url": "https://www.dailysignal.com/2026/06/30/one-judge-has-told-ice-to-stop-the-supreme-court-already-said-no/", "title": "Daily Signal, June 30, 2026"}, {"url": "https://www.turlockjournal.com/news/crime/federal-court-temporarily-lifts-injunction-protecting-valley-from-sweeps-as-immigration-arrests-rise-in-stanislaus/", "title": "Turlock Journal, 2026"}]}, {"rank": 2, "what_changed": "Garro Pinchi v. Noem (N.D. Cal., Judge Pitts). The court provisionally certified a class and blocked ICE's May 2025 policy of re-arresting people it had already found neither dangerous nor a flight risk. Coverage is ICE's San Francisco area: Northern and Central California, Hawai'i, Guam and Saipan.", "for_whom": "Previously released immigrants in that region.", "count": "No class size or number of arrests avoided found.", "year": 2025, "program": "Immigrants' rights litigation (Foundation)", "durability": "too_early", "contribution": "co_lead", "counterfactual": "Individual habeas petitions would have continued; a class-wide regional stop would likely have been slower or absent. Other groups were pursuing similar claims, so the marginal value is speed and class coverage (inference).", "others_involved": ["National ACLU Foundation", "Centro Legal de la Raza", "Keker, Van Nest & Peters"], "significance": 3, "evidence_quality": "independently_verified", "evidence": "A 67-page order per the ACLU release of Dec 22, 2025. A January 2026 order on the stay and class motions is posted by Courthouse News, and the sequence between the two was not resolved. No final judgment or Ninth Circuit ruling found. No evidence on compliance or on arrests avoided.", "basis": "evidence", "sources": [{"url": "https://www.aclunorcal.org/press-releases/federal-court-blocks-ice-rearrest-policy/", "title": "ACLU NorCal release, Dec 22, 2025"}, {"url": "https://www.courthousenews.com/wp-content/uploads/2026/01/order-stay-agency.pdf", "title": "Order on stay of agency action (search result)"}, {"url": "https://clearinghouse.net/doc/165793", "title": "Order granting preliminary injunction, July 24, 2025"}]}, {"rank": 3, "what_changed": "Zepeda Rivas v. Jennings. Class settlement, finally approved in mid-June 2022, required ICE and GEO Group to adopt COVID measures at Mesa Verde and Yuba County Jail, including population caps, intake procedures, testing and vaccine access. It also limited re-detention of hundreds of people released during the suit.", "for_whom": "People detained at the two facilities and people released during the case.", "count": "About 523 detained in March 2020 per Cooley. 'Hundreds' protected from re-detention. Population fell from over 400 to 'well under 100' per the organization's undated page. Exact class size not found.", "year": 2022, "program": "Immigrants' rights litigation (Foundation)", "durability": "partly_reversed", "contribution": "co_lead", "counterfactual": "Some population decline would have occurred anyway during the pandemic. The court-supervised bail process and re-detention limit are harder to imagine without a suit, which had several institutional plaintiffs' counsel. Who did what share is not documented.", "others_involved": ["ACLU of Southern California", "Lawyers' Committee for Civil Rights of the SF Bay Area", "San Francisco Public Defender", "Cooley LLP", "Lakin & Wille"], "significance": 3, "evidence_quality": "independently_verified", "evidence": "Court-approved settlement. It expired on June 9, 2025 by its own terms, just as ICE's new re-detention policy was under way. Whether the re-detention protection survived expiry was not established. The 'partly_reversed' tag reflects expiry, not a court loss.", "basis": "evidence", "sources": [{"url": "https://www.cooley.com/news/coverage/2022/2022-06-22-cooley-secures-civil-rights-win-for-california-ice-detainees", "title": "Cooley release, June 22, 2022"}, {"url": "https://www.aclunorcal.org/our-work/legal-docket/zepeda-rivas-v-jennings-immigration-detention", "title": "ACLU NorCal docket page"}, {"url": "https://sfpublicdefender.org/2022/01/27/groundbreaking-covid-19-settlement-to-yield-protections-for-immigrants-detained-by-ice-limit-re-detention-for-people-released/", "title": "SF Public Defender release, Jan 27, 2022"}]}, {"rank": 4, "what_changed": "United Farm Workers v. Noem (E.D. Cal., Judge Thurston). An April 2025 preliminary injunction barred Border Patrol stops without reasonable suspicion and warrantless arrests without flight-risk findings across the Eastern District. In April 2026 the court found a July 2025 Sacramento Home Depot operation violated it. The Ninth Circuit lifted the injunction on Aug 24, 2026 on standing and sent the question back.", "for_whom": "Farmworkers and Latino residents of the Central Valley and the Eastern District.", "count": "78 arrested in the January 2025 Kern operation, the event that prompted the suit. No stop or arrest figures found for the injunction period.", "year": 2025, "program": "Immigrants' rights litigation (Foundation)", "durability": "partly_reversed", "contribution": "co_lead", "counterfactual": "No comparable suit for the Eastern District appeared in the research. State attorneys general joined only as amici. The Central Valley would likely have had no court-ordered limit for about 16 months (inference). An attorney quoted locally doubts mass sweeps will return, but the injunction's own causal effect is unmeasured.", "others_involved": ["ACLU of Southern California", "ACLU of San Diego & Imperial Counties", "Keker, Van Nest & Peters", "17 attorneys general as amici"], "significance": 3, "evidence_quality": "independently_verified", "evidence": "Multiple reports of the Ninth Circuit order agree. It does not reach the merits. The panel kept jurisdiction, and a local report says the district court has 120 days. The Supreme Court's September 2025 stay in the parallel Los Angeles case shows how exposed this kind of relief is.", "basis": "evidence", "sources": [{"url": "https://www.aclunorcal.org/press-releases/aclu-defends-court-order-barring-border-patrols-unlawful-stop-and-arrest-practices/", "title": "ACLU NorCal release, Apr 22, 2026"}, {"url": "https://www.newsmax.com/us/border-patrol-united-farm-workers-california/2026/08/24/id/1267199/", "title": "9th Circuit lifts block, Aug 24, 2026"}, {"url": "https://ashtalks.substack.com/p/the-ninth-circuit-just-sent-a-border", "title": "Ninth Circuit sends the case back"}, {"url": "https://www.turlockjournal.com/news/crime/federal-court-temporarily-lifts-injunction-protecting-valley-from-sweeps-as-immigration-arrests-rise-in-stanislaus/", "title": "Turlock Journal, 2026"}, {"url": "https://oag.ca.gov/news/press-releases/attorney-general-bonta-leads-coalition-opposing-unlawful-immigration-stops", "title": "California AG amicus release"}]}, {"rank": 5, "what_changed": "Mathis v. County of Siskiyou. A partial settlement finalized in late December 2025 bars race-based traffic stops and intimidation stops. It requires suspicion before search requests, notice of the right to refuse, body cameras and interpreters. It lifts cannabis-fine property liens and adds a paid audi
