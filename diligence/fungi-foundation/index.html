Magazine, 2025"}, {"url": "https://files.speciesconservation.org/grant-files/biographies/biography-10227.pdf", "title": "2014 CV-type biography (unreadable)"}]}, "scenarios": {"horizon_years": 5, "horizon_rationale": "Five years, ending in 2031. [inference] That span covers the 2030 deadline of the Kunming-Montreal framework and the talks on what replaces it. It also covers one change of Chilean government: Kast took office on 11 March 2026, and the next term should start around March 2030, assuming the normal four-year cycle. Three years would stop inside the current Chilean government and show only one political state. Ten years is unreadable for a charity with 2 reported employees and about 2 months of reserves. One caveat: the money question may be settled much sooner than 2031. Net assets of $82,068 at end FY2024, divided by the $54,205 FY2024 deficit, is about 1.5 years. If the fiscal year is the calendar year, which is unverified, that rate would have used up the reserves around mid-2026. The organization was still announcing work in May 2026 and was named in coverage in October 2026, so the deficit has probably narrowed or new money has arrived. No FY2025 data was found. The early signals therefore matter more than the 2031 end states.", "driving_forces": [{"name": "Fungi moving from recognition to implementation in multilateral biodiversity policy", "category": "political", "direction": "Recognition is rising quickly. Binding force and money are not visibly following.", "impact": 5, "uncertainty": 4, "relevance": "This is the arena where the organization's clearest claim to leadership sits. It is the main part of Axis 1.", "basis": "evidence", "sources": [{"url": "https://www.globalfungalconservation.org/", "title": "Global Strategy for Fungal Conservation"}, {"url": "https://news.mongabay.com/short-article/2026/10/fungi-now-have-a-global-conservation-strategy/", "title": "Mongabay: Fungi now have a global conservation strategy (Oct 2026)"}, {"url": "https://www.naturalworldfund.org.uk/cop17-fungi-global-biodiversity-conservation/", "title": "Natural World Fund: COP17 and fungi (30 Oct 2026)"}, {"url": "https://www.cbc.ca/news/science/cop17-fungi-9.7388560", "title": "CBC on COP17 (search result only; page returned 403)"}, {"url": "https://www.winssolutions.org/cop17-yerevan-biodiversity-finance/", "title": "COP17 Yerevan Summit Mobilizes $1.8 Billion for Nature (secondary)"}], "kind": "external_trend", "evidence_it_is_real": "[evidence] The Strategy launched on 21 Oct 2026. More than 50 organizations from 30 countries endorsed it. Its own site says its actions are voluntary, 'without any new commitments or reporting obligations'. CBC's search summary reports 14 Pledge signatories, with more expected at COP17. Natural World Fund reports Italy committing at COP17. No evidence found of a COP17 decision naming fungi; the conference closes today. Finance disputes reportedly ran to the last day, with $1.8 billion in pledges reported by a secondary source.", "channel_to_organization": "[inference] The organization's standing rests on the Pledge and on 3F language. The follow-on work runs through Plantlife, using a plantlife.org.uk contact address, and through a team led by Greg Mueller. The Mongabay piece and the Strategy home page I read name neither the Foundation nor the Pledge. I did not read the endorser list. Binding uptake would raise demand for its policy staff. Voluntary drift would leave it with a lot of credit and little to do next."}, {"name": "Chile's deregulatory turn under the Kast government", "category": "political", "direction": "Clearly away from new environmental instruments through at least early 2030. How far it reaches fungi is unknown.", "impact": 5, "uncertainty": 3, "relevance": "Chile is the organization's home base, its legal success story and its co-launch government. Moves with the multilateral trend, so it is folded into Axis 1.", "basis": "evidence", "sources": [{"url": "https://eldesconcierto.cl/medio-ambiente/primeros-100-dias-kast-37-decretos-pausados-15-inversiones-aprobadas-y-4-leyes-regresion-ambiental-n5459653", "title": "El Desconcierto: Kast's first 100 days (17 Jun 2026, reporting Fundación Chile Sustentable)"}, {"url": "https://www.energyconnects.com/news/renewables/2026/march/chile-cools-on-climate-penguins-in-risk-to-green-credits", "title": "Bloomberg via EnergyConnects: Chile cools on climate (Mar 2026)"}, {"url": "https://www.seafoodsource.com/news/chilean-government-requests-resignation-of-sernapesca-director-proposed-national-budget-includes-environmental-inspection-cuts", "title": "SeafoodSource: proposed budget includes environmental inspection cuts"}, {"url": "https://www.easternprogress.com/chiles-senate-oks-business-friendly-economic-reforms/article_efd905f4-daa8-5326-b59a-1d4881b921aa.html", "title": "Chile's Senate OKs business-friendly economic reforms (Jul 2026; headline and caption only)"}, {"url": "https://www.ffungi.org/blog/positive-fungal-news-from-last-year-to-start-this-2026", "title": "Fungi Foundation: Positive fungal news (Jan 2026)"}, {"url": "https://forbes.cl/sostenibilidad/2024-10-16/chile-y-reino-unido-presentaran-una-iniciativa-para-considerar-a-los-hongos-como-reino-biologico-en-la-cop16", "title": "Forbes Chile: Chile and UK fungi initiative at COP16 (Oct 2024)"}], "kind": "external_trend", "evidence_it_is_real": "[evidence] On 12 Mar 2026 the Environment Ministry withdrew 43 decrees from Contraloría review, including 12 SBAP regulations and three new protected areas, per an environmental NGO report carried by El Desconcierto. Only six had been resubmitted by mid-June. A proposed amendment would block new priority sites. Bloomberg reports the priority-site process was suspended. The proposed 2027 budget cuts environmental inspection. A counter-signal: the finance minister said not all withdrawn decrees would be eliminated.", "channel_to_organization": "[evidence] The Pledge was promoted by the previous minister, Maisa Rojas. As of January 2026 the organization called a ministry MOU 'upcoming'. [inference] No evidence found that it was signed, or of any Kast government position on fungi. The loyo conservation plan, species listings and the curriculum proposal all need Chilean state counterparts. Narrower environmental review could also weaken the fungal inclusion in impact assessments, its founding legal win. [speculation] A fungal agenda with little cost to investors could survive as low-cost green credibility."}, {"name": "Rich-state retreat from biodiversity finance and multilateral bodies", "category": "political", "direction": "Downward in the US and UK, at least through 2027-28.", "impact": 3, "uncertainty": 3, "relevance": "Hits the institutions the organization depends on for evidence and access, rather than its own revenue. Moves with Axis 1.", "basis": "evidence", "sources": [{"url": "https://dialogue.earth/en/climate/trump-abandons-international-climate-biodiversity-and-energy-bodies/", "title": "Dialogue Earth: Trump abandons international climate, biodiversity and energy bodies (search result)"}, {"url": "https://www.jurist.org/news/?p=302685", "title": "JURIST: Trump orders US withdrawal from 66 international organizations"}, {"url": "https://icai.independent.gov.uk/review/uk-aid-spending-to-2029-the-changing-profile-of-development-cooperation/report/", "title": "ICAI: UK aid spending to 2029"}, {"url": "https://e-mc2.gr/el/node/32902", "title": "UK climate aid cuts 'short-sighted', campaigners say"}, {"url": "https://newswav.com/article/uk-aid-cuts-will-cause-untold-damage-wildlife-charities-warn-as-they-fear-f-A2508_fWwiB1", "title": "UK aid cuts: wildlife charities warn"}, {"url": "https://www.gov.uk/government/publications/biodiversity-finance-trends-2026/biodiversity-finance-trends-dashboard-2026-accessible-version", "title": "UK: Biodiversity Finance Trends Dashboard 2026"}], "kind": "external_trend", "evidence_it_is_real": "[evidence] A presidential memorandum of 7 Jan 2026 directed US withdrawal from 66 bodies, including IUCN and IPBES. Implementation status was not confirmed. UK aid falls to 0.3% of GNI by 2027. International climate finance falls to about £6 billion over three years, and search summaries report the £3 billion nature earmark was dropped. I did not check that against a government document. No figure found showing whether the $20 billion a year international flows goal for 2025 was met.", "channel_to_organization": "[inference] IUCN's fungal assessment work supplies the threat evidence used in advocacy, so less IUCN money could thin that evidence. The UK is the other co-launcher and the organization lists a UK Policy Lead. The UK's nature budget squeeze limits how much that partnership can turn into funded programs. Being a US charity carries no visible legal bar on UN advocacy, but the US government is no longer a natural ally in these venues."}, {"name": "Private nature capital growing, and concentrating in large intermediaries", "category": "economic", "direction": "Total giving is rising. Whether it reaches small specialist groups and neglected taxa is open.", "impact": 5, "uncertainty": 4, "relevance": "Contributions are 99% of revenue. This is the main part of Axis 2.", "basis": "evidence", "sources": [{"url": "https://givingusa.org/giving-usa-charitable-giving-rose-to-617-20-billion-in-2025-surpassing-the-600-billion-mark-for-the-first-time/", "title": "Giving USA 2026 press release"}, {"url": "https://www.wlrn.org/npr-breaking-news/2026-08-12/200-million-pledged-for-threatened-species-recovery", "title": "NPR via WLRN: $200 million pledged for threatened species recovery (12 Aug 2026)"}, {"url": "https://www.pulse.bot/philanthropy/news/philea-releases-most-comprehensive-report-to-date-on-environmental-philanthropy-in-europe-b8f7aef6-c70f-4a2b-895f-f06503427c48/", "title": "Philea report summary (May 2026; secondary)"}, {"url": "https://projects.propublica.org/nonprofits/organizations/874391116", "title": "ProPublica: SPUN"}, {"url": "https://www.spun.earth/about/how-we-are-funded", "title": "SPUN: How we are funded"}, {"url": "https://marcellus.in/story/wildlife-conservation-funds-biased-against-smaller-species-study/", "title": "News coverage of conservation funding bias study"}], "kind": "external_trend", "evidence_it_is_real": "[evidence] Giving USA reports environment and animals at about $24.57 billion in 2025, up 11.0% in current dollars and 8.2% after inflation, though that category is broad. Bezos Earth Fund and Re:wild pledged $200 million for 100 threatened 'animals and plants' in Aug 2026; the article does not say whether fungi qualify. SPUN's revenue went from $325,324 in FY2023 to $9,205,437 in FY2024. Fungi and algae together got under 0.2% of conservation project funding from 1992 to 2016, an old figure seen only through news coverage. No fungi-only funding figure was found. No 2026 survey of environmental funders was found.", "channel_to_organization": "[inference] SPUN's jump shows large funders will back a fungal story when it is framed around climate and carbon, and it shows how fast that money can move. SPUN lists Schmidt, Bezos Earth Fund, Quadrature, Arcadia and others. None is visibly funding this organization, which raised $407,817 in FY2024, with 41.8% from three sources per CauseIQ. The question for the organization is whether that money spreads or stays with one or two recipients."}, {"name": "Generational wealth transfer and the growth of donor-advised funds", "category": "economic", "direction": "Upward, over decades. Timing and destination are uncertain.", "impact": 3, "uncertainty": 3, "relevance": "Giving vehicles already carry a visible share of this organization's revenue.", "basis": "evidence", "sources": [{"url": "https://www.cerulli.com/press-releases/cerulli-anticipates-124-trillion-in-wealth-will-transfer-through-2048", "title": "Cerulli: $124 trillion transfer through 2048"}, {"url": "https://www.wealthmanagement.com/high-net-worth/the-great-wealth-transfer-is-coming-just-not-yet", "title": "Wealth Management: The Great Wealth Transfer is coming; just not yet"}, {"url": "https://www.finanzen.net/nachricht/aktien/national-philanthropic-trust-donor-recommended-grants-to-charities-grow-20-in-fy-2025-to-exceed-6-6-billion-15312793", "title": "NPT: donor-recommended grants grow 20% in FY2025"}, {"url": "https://johnsoncenter.org/resource/report-annual-daf-report-2025/", "title": "The Annual DAF Report 2025"}, {"url": "https://www.causeiq.com/organizations/fungi-foundation,851478153/", "title": "CauseIQ: Fungi Foundation (secondary)"}], "kind": "external_trend", "evidence_it_is_real": "[evidence] Cerulli projects $124 trillion transferring through 2048, with $18 trillion to charity. A 2026 trade column urges skepticism on timing. NPT, one sponsor, reports $6.61 billion in grants in FY2025, up about 20%. Sector-wide figures of $89.64 billion in and $64.89 billion out for FY2024 appeared in one search summary, and I could not confirm them against the primary report.", "channel_to_organization": "[inference] Fidelity Charitable's $50,050 is 12.3% of FY2024 revenue, and the donor behind it is hidden. DAF money can grow or stop without warning or explanation. Younger heirs may suit a charismatic, nature-and-culture cause. [speculation] Most of this transfer lands after 2031, so it helps less than it appears to within this horizon."}, {"name": "US charitable tax changes under the 2025 tax act", "category": "economic", "direction": "In effect for tax year 2026. Slightly worse for large itemizers, slightly better for small donors.", "impact": 2, "uncertainty": 2, "relevance": "Modest shift in the donor economics of a nearly all-contribution revenue base.", "basis": "evidence", "sources": [{"url": "https://www.accountingtoday.com/news/charitable-deduction-gets-caps-floors-and-haircuts-in-obbba", "title": "Accounting Today: Charitable deduction gets caps, floors and haircuts"}, {"url": "https://dafgiving360.org/tax-law-changes", "title": "DAFgiving360: tax law changes"}], "kind": "external_trend", "evidence_it_is_real": "[evidence] From 2026: a 0.5% of AGI floor for itemizers, a 35% cap on the value of itemized deductions, and a non-itemizer deduction of $1,000 single or $2,000 joint. No projected dollar effect on total giving was found.", "channel_to_organization": "[inference] Large individual gifts lose a little tax value, and bunching may make gifts lumpier, which matters for an organization with 2.1 months of reserves. Small gifts through Every.org ($45,140 in 2024) gain slightly. The net effect is probably small against the swing from one or two large donors."}, {"name": "US federal scrutiny of nonprofits and their funders", "category": "political", "direction": "Rising since Sept 2025. Aimed mostly at groups framed as political opponents.", "impact": 3, "uncertainty": 4, "relevance": "Low likelihood for this organization, but high consequence given how little of its structure is documented in public. A wildcard across all quadrants.", "basis": "evidence", "sources": [{"url": "https://www.arnoldporter.com/en/perspectives/blogs/enforcement-edge/2026/06/what-to-do-if-the-government-comes-knocking", "title": "Arnold & Porter: preparedness guide (Jun 2026)"}, {"url": "https://www.globalpolicywatch.com/2025/11/practical-advice-for-nonprofits-and-donors-after-the-presidential-memorandum-on-countering-domestic-terrorism-and-organized-political-violence-and-reported-irs-enforcement-changes/", "title": "Covington: practical advice for nonprofits and donors (Nov 2025)"}, {"url": "https://www.foxnews.com/politics/feds-launch-probe-unravel-alleged-nonprofit-funding-behind-antifa-linked-violence.print", "title": "Fox News: probe into alleged nonprofit funding"}, {"url": "https://xapien.com/nspm-7-due-diligence-foundations/", "title": "Xapien: NSPM-7 due diligence for foundations (vendor)"}], "kind": "external_trend", "evidence_it_is_real": "[evidence] NSPM-7 was issued on 25 Sep 2025. Reporting from 2026 describes IRS Criminal Investigation working with federal law enforcement on funding of groups linked to violence. Law firms warn of tax-status risk and have issued preparedness guides. Sources are mainly law firms, advocates and partisan outlets. No evidence found of this being applied to biodiversity or scientific charities.", "channel_to_organization": "[inference] No sign the organization is a target. Its exposure is indirect. Money moving abroad to a Chilean body with unread Schedule F detail, No answers on affiliates and lobbying alongside an India Chapter and advocacy work, and no audit would all make it slow and costly to answer any inquiry. Foundations adding due-diligence steps may also screen such a profile out."}, {"name": "Tighter rules on NGO money abroad: India and Chile", "category": "political", "direction": "Tightening in India. In Chile, politically salient but legislatively unclear.", "impact": 3, "uncertainty": 3, "relevance": "Touches two of the organization's geographies and the cross-border funding model behind its US chapter.", "basis": "evidence", "sources": [{"url": "https://www.icnl.org/wp-content/uploads/India-FCRA-amendments-briefer-June-2026_final.pdf", "title": "ICNL: India FCRA amendments briefer (Jun 2026)"}, {"url": "https://www.deccanchronicle.com/amp/southern-states/andhra-pradesh/fcra-bill-sent-to-jpc-it-seeks-tougher-compliance-from-foreign-funded-ngos-1978714", "title": "Deccan Chronicle: FCRA Bill sent to JPC"}, {"url": "https://www.jurist.org/news/2026/03/india-faces-criticism-over-proposed-expansion-of-foreign-funding-rights-on-ngos", "title": "JURIST: India criticized over foreign funding rules (Mar 2026)"}, {"url": "https://www.elmostrador.cl/noticias/pais/2023/07/29/contraloria-declara-ilegales-29-convenios-de-34-casos-evaluados-involucran-13-mil-millones/", "title": "El Mostrador: Contraloría on convenios (29 Jul 2023)"}, {"url": "https://www.ex-ante.cl/los-objetivos-y-quienes-financian-a-las-ongs-mas-influyentes-de-chile/", "title": "Ex-Ante: who funds Chile's most influential NGOs (date unclear)"}], "kind": "external_trend", "evidence_it_is_real": "[evidence] India's FCRA Amendment Bill was introduced on 25 Mar 2026. Reports conflict on its status: pending, with one headline saying it went to a joint committee. Chile's 2023 Caso Convenios made transfers to foundations a political issue, and Ex-Ante reports an NGO funding transparency bill stalled in the Senate. No evidence found of a Kast government bill on this in 2026.", "channel_to_organization": "[inference] The FY2024 990 lists development of an India Chapter, and the team page lists two India Program Leads. No registered Indian entity was found, so any foreign money paid to Indian partners may need FCRA-compliant routes. In Chile, a stricter NGO transparency law would touch a body whose legal name and registration I could not confirm."}, {"name": "AI search cutting organic discovery of nonprofits", "category": "technological", "direction": "Organic search traffic is falling. The effect on giving is reported but mostly by vendors.", "impact": 2, "uncertainty": 3, "relevance": "Affects small-donor flow and the reach of free education content.", "basis": "evidence", "sources": [{"url": "https://pressgazette.co.uk/news/charity-websites-hit-by-rollout-of-google-ai-answers/", "title": "Press Gazette: charity websites hit by Google AI answers"}, {"url": "https://candid.org/blogs/how-ai-tools-affect-online-giving-research-data/", "title": "Candid: how AI tools affect online giving"}, {"url": "https://www.mrss.com/lab/the-impact-of-ai-search-during-end-of-year-the-news-isnt-good/", "title": "M+R: AI search during end of year"}], "kind": "external_trend", "evidence_it_is_real": "[evidence] UK charities told Press Gazette of significant traffic declines, and one estimated about 27%, mostly on information pages. Candid reports organic search as over a third of nonprofit web traffic and nearly 30% of online revenue in Dec 2024, with AI referrals only 2% of traffic in Jan-Oct 2025. M+R links the fall to weaker year-end online giving. Press Gazette cautions that AI's effect cannot be isolated.", "channel_to_organization": "[inference] Every.org's $45,140 is 11.1% of FY2024 revenue, and no data shows how those donors arrive. The free curriculum and species pages are the kind of informational content most exposed. Its founder-led media profile and branded search should be less exposed. Its claimed reach already fell from 115 outlets in 2024 to 45 in 2025, likely reflecting the COP16 peak rather than AI."}, {"name": "AI and environmental DNA changing how fungi get documented", "category": "technological", "direction": "Fast progress on detection. Naming norms and taxonomic capacity lag.", "impact": 3, "uncertainty": 3, "relevance": "Changes the value of expeditions and of a physical collection of about 2,000 specimens.", "basis": "evidence", "sources": [{"url": "https://www.eurekalert.org/news-releases/1131957", "title": "Kew: State of the World's Plants and Fungi 2026 release"}, {"url": "https://www.scimex.org/newsfeed/new-naming-system-needed-for-fungi", "title": "Scimex: New norms needed to name never-seen fungi"}, {"url": "https://arise-biodiversity.nl/post/dnabarcoder-a-tool-for-edna-identification", "title": "ARISE: dnabarcoder"}, {"url": "https://www.mycostories.com/post/kew-s-2026-report-reveals-how-little-we-know-about-the-fungi-that-sustain-life-on-earth", "title": "Mycostories: commentary on Kew 2026 (secondary)"}], "kind": "external_trend", "evidence_it_is_real": "[evidence] Kew's June 2026 report centers on AI and digital tools and says only 0.6% of fungal species have been assessed for extinction risk, with 411 threatened. eDNA is revealing many fungi known only from DNA, which has prompted calls for new naming norms. One commentary reports mycological expertise is concentrated in high-income countries. No evidence found on specific NSF cuts or herbarium closures.", "channel_to_organization": "[inference] Sequencing at scale favors SPUN and university labs, not a small expedition team. Vouchered specimens and southern-hemisphere field knowledge could become more valuable as ground truth for those models, if the FFCL Fungarium is digitized and linked to sequence data. Its digitization status was not checked."}, {"name": "Land-use pressure and fire in southern Chile and globally", "category": "environmental", "direction": "Worsening threat, and the direction is not much in doubt.", "impact": 3, "uncertainty": 2, "relevance": "Raises the urgency of the mission and can directly damage field sites.", "basis": "evidence", "sources": [{"url": "https://iucn.org/press-release/202503/first-1000-fungi-iucn-red-list-reveal-growing-threats-iucn-red-list", "title": "IUCN: First 1,000 fungi on the Red List (Mar 2025)"}, {"url": "https://globalnews.ca/news/11618804/chile-wildfires-2026-homes-destroyed", "title": "Global News: Chile wildfires 2026"}, {"url": "https://www.latercera.com/nacional/noticia/mas-de-24-mil-hectareas-quemadas-y-18-fallecidos-por-incendios-forestales-en-nuble-y-biobio/", "title": "La Tercera: hectares burned in Ñuble and Biobío (Jan 2026)"}, {"url": "https://www.carbonbrief.org/?p=48322", "title": "Carbon Brief: Kew report on extinction risks (2023 edition)"}], "kind": "external_trend", "evidence_it_is_real": "[evidence] IUCN cited deforestation, farming and urban expansion in March 2025. Fires in Biobío and Ñuble from 16 Jan 2026 burned over 30,000 hectares by one report and killed about 20 people, with counts varying. No attribution study or native-forest loss figure was found in what I read. Kew's 2023 edition ranked land-use change as the main threat. These assessments are first-time ones, not a time series.", "channel_to_organization": "[inference] The rediscovery site in Nahuelbuta and the loyo work in southern Chile sit in a region exposed to fire and plantation pressure. I did not map fire perimeters against its sites. Disasters also compete with fungal policy for Chilean state attention and budget, while strengthening the argument for habitat-based protection over species lists. Dahlberg made a version of that critique in Undark in 2021."}, {"name": "Falling trust in NGOs relative to business", "category": "social", "direction": "Downward for NGOs on ethics in the latest reading.", "impact": 2, "uncertainty": 3, "relevance": "Raises the proof a donor or ministry may ask for from an unaudited, self-reporting organization.", "basis": "evidence", "sources": [{"url": "https://www.edelman.com/news-awards/2026-edelman-trust-barometer-society-slides-into-insularity", "title": "Edelman Trust Barometer 2026"}], "kind": "external_trend", "evidence_it_is_real": "[evidence] Edelman 2026, with about 34,000 respondents in 28 countries and fieldwork Oct-Nov 2025, shows business rated more ethical than NGOs for the first time, 20 against 17. It is a single survey from a communications firm, and it does not speak to small specialist charities.", "channel_to_organization": "[inference] Coverage of the organization is favorable and rarely tests outcomes, so a general trust slide is unlikely to hit it directly. It would make its gaps more costly: no audit on the FY2024 990, no annual report found, and self-reported outputs. Its strongest trust asset is association with governments and known names, which is transferable to skeptics only with documents behind it."}, {"name": "Mainstreaming of psilocybin and mushroom culture", "category": "social", "direction": "Popular interest and state-level legalization rising. Federal status not reliably established in what I read.", "impact": 2, "uncertainty": 4, "relevance": "Shapes the individual-donor pool and the brand context, though the organization's field is wild fungal conservation.", "basis": "inference", "sources": [{"url": "https://www.medboundtimes.com/usa/psilocybin-mushrooms-mainstream-research-regulation-lag", "title": "Psilocybin Mushrooms Are Going Mainstream, but Research and Regulation Lag Behind"}, {"url": "https://www.newswire.com/news/hypha-labs-otcqb-funi-sees-state-by-state-psilocybin-reform-creating-the-next", "title": "Hypha Labs press release (promotional)"}, {"url": "https://tim.blog/2021/07/29/giuliana-furci/", "title": "Interview on tim.blog (2021)"}], "kind": "external_trend", "evidence_it_is_real": "[evidence, weak sources] A 2026 article reports about 11 million US adults used psilocybin in the prior year. A company press release lists statewide programs in Oregon, Colorado and New Mexico. A claim of FDA approval in March 2026 came from a low-quality blog and I do not rely on it.", "channel_to_organization": "[speculation] Some individual donors may come through this cultural interest, given a 2021 interview on tim.blog and Paul Stamets on the board. Schedule B is not public, so this cannot be tested. A boom could widen the donor pool. A backlash or a benefit-sharing dispute over traditional mushroom knowledge could touch its ethnomycology work. I found no such dispute."}, {"name": "Indigenous rights, benefit-sharing and rights-of-nature law", "category": "political", "direction": "Formal recognition has grown since 2021-2024. The money behind it remains nearly empty.", "impact": 2, "uncertainty": 3, "relevance": "This is the area where the organization has no evident substitute.", "basis": "evidence", "sources": [{"url": "https://www.climatechangenews.com/2024/11/03/cop16-hands-power-to-indigenous-people-but-fails-to-bridge-nature-finance-gap-results/", "title": "Climate Home: COP16 hands power to Indigenous people"}, {"url": "https://www.lse.ac.uk/granthaminstitute/publication/from-global-biodiversity-commitments-to-local-action-revenue-potential-and-allocation-dynamics-of-the-cali-fund/", "title": "LSE Grantham: Cali Fund revenue potential"}, {"url": "https://e360.yale.edu/digest/landmark-ruling-blocks-mining-in-ecuadorian-forest-citing-rights-of-nature", "title": "Yale e360: Los Cedros ruling (2021)"}, {"url": "https://cswr.hds.harvard.edu/publications/plants-fungi-2025/fungal-furci", "title": "Fungal Activism and Sovereignty in Ethnomycology (2025)"}], "kind": "external_trend", "evidence_it_is_real": "[evidence] COP16 gave Indigenous peoples a stronger formal role in 2024. LSE reports the Cali Fund had five contributions totaling $10,577 as of Oct 2026, against an aim of billions. Ecuador's Constitutional Court ruled for Los Cedros in 2021. No evidence found on 2026 rulings or on the outcome of the song petition appeal.", "channel_to_organization": "[inference] Community-rooted ethnomycology could be its most defensible niche if funders start asking for Indigenous-led or community-rooted work. An empty Cali Fund means no public money is on the way. Rights-of-nature work adds visibility, but its contribution to fungal protection is unproven."}], "axes": [{"name": "Axis 1: State commitment to fungal conservation", "low_pole": "By 2031 fungi are named in voluntary texts and speeches. Few governments budget for them or bind themselves. Chile's environmental rules have narrowed, and the post-2030 biodiversity talks treat fungi as a footnote. Rough test, my own: fewer than about 25 Pledge countries and no funded national fungal programs outside a handful.", "high_pole": "By 2031 fungi are written into the post-2030 framework and into funded national plans. Chile's next government is implementing species plans and fungal impact assessment, the UK is delivering at home, and new tropical countries are leading. Rough test, my own: about 50 or more countries with fungal targets and at least 10 with budget lines.", "why_critical": "Impact 5, uncertainty 4, product 20, joint highest. The organization's whole differentiated position is government-facing: the Pledge, Chile's law, curriculum and species listings. Whether that work pays off depends on states acting. The evidence points both ways: 14 countries and a new Strategy on one side, and Chile's 43 withdrawn decrees and the Strategy's 'without any new commitments' on the other.", "runners_up_rejected": "Chile's deregulation (15) and rich-state finance retreat (9) move with this axis, so they are folded in, not separate. US scrutiny of nonprofits (12) is rejected as an axis because it is a low-probability shock to this organization, better handled as a wildcard. Generational wealth and DAFs (9) is a slow trend that mostly lands after 2031. AI and eDNA (9) changes methods but does not decide survival. Foreign-funding rules (9) touch only parts of the program. Psilocybin culture (8) is too indirect.", "trend": "[inference] Today: rising language, falling money. Nearer the low pole on substance, moving upward on recognition.", "external": true}, {"name": "Axis 2: Reach of private nature capital", "low_pole": "By 2031 private money for fungi stays thin or sits with one or two climate-framed or science-led organizations. Large funders favor big intermediaries and charismatic species. Small policy and Global South groups remain on individual donors.", "high_pole": "By 2031 several major funders run dedicated fungal or neglected-taxa portfolios, and pooled or regranting vehicles reach small specialist groups, policy work and southern-hemisphere field work. Rough test, my own: at least $50 million a year in identifiable private fungal funding, across at least 10 organizations.", "why_critical": "Impact 5, uncertainty 4, product 20. Contributions are 99% of revenue, and three sources supply 41.8%. Total environmental giving is up, but the visible fungal money sits at SPUN. Nobody knows yet whether that is a first wave or the final allocation. No fungi-only funding series was found.", "runners_up_rejected": "DAF growth and the wealth transfer (9) feed this axis but matter little by themselves before 2031. Tax law changes (4) are too small. AI search (6) affects a modest share of revenue. Falling NGO trust (6) is a general headwind. The organization's own fundraising ability is a consequence, so it is treated inside the scenarios.", "trend": "[inference] Today: growing in total, concentrated in distribution. [evidence] SPUN at $9.2 million in FY2024 against this organization's $0.4 million. Independence test: in 2025-26 environment giving rose while the US, UK and Chile pulled back, so the two axes are not moving together. They are not fully independent, since funders may follow government signals.", "external": true}], "scenarios": [{"quadrant": "high_high", "name": "Funga on the Ledger", "narrative": "[speculation] It is 2031. The post-2030 biodiversity framework names fungi. Governments did not do this out of sudden affection. Soil, carbon and food-security arguments met a growing body of Red List evidence, and Brazil, Italy and several tropical countries took up the cause. Chile's government that took office in 2030 revived the stalled biodiversity regulations and funded its first fungal species plans. Two large funders that began with mycorrhizal mapping opened a pooled fund, which also pays for policy work and field documentation in the southern hemisphere. Nobody calls fungi neglected with a straight face, though most of the budget still goes to science in rich countries. The Fungi Foundation is one respected actor among many. It was not the biggest, and SPUN and the Plantlife-hosted network kept the larger shares of the money. Its advantage held in three places: it knew Chile's ministries, it had long ties to ethnomycology communities, and it had helped write the language governments now use. It passed its first audit in 2027, which made it eligible for the pooled fund. It has a deputy who speaks at negotiations. Its founder remains the public face, but no longer the only one.", "effect_on_org": {"revenue": "[speculation] $1 million to $2 million a year across the two entities, with no funder above about 20%. Most new money comes through institutional grants, and individuals become a smaller share.", "programs": "[speculation] Shifts from pledge-gathering to national implementation: Chile plans, technical support for national plans, and a formal Pledge secretariat. Films and novelty campaigns shrink as a share.", "staff": "[speculation] 20 to 30 people, with clearer employment arrangements across countries. Needs real finance and grants management, not just policy talent.", "standing": "[speculation] High but shared. A recognized policy partner, no longer the lone voice. It gets less sole credit and has to report measured outcomes."}, "early_signals": ["The COP17 final text or follow-up work program names fungi or funga, and the Pledge passes about 20 countries by the end of 2027.", "Chile's ministry signs the MOU announced as 'upcoming' in January 2026, under the Kast government.", "The Bezos Earth Fund and Re:wild Phoenix list includes a fungus, or a named funder publishes a fungal call open to policy work.", "The organization publishes an audit or CPA review and a consolidated US-Chile budget.", "A SPUN funder, such as Schmidt, Quadrature or Arcadia, appears as a grantee relationship of the Foundation in its 990-PF records."], "readiness": {"score": 3, "rationale": "[inference] Strongest fit of the four on content: policy relationships, the Pledge and a 15-person team list. It is held back by controls. There is no audit on the FY2024 990, the Chile money flow cannot be traced, and fundraising was only $41,175 in FY2024. Large institutional grants are likely to require those fixes first."}, "donor_implication": "[inference] Early money buys eligibility for later, larger funding. Fund the audit and consolidation now, and expect your share to shrink. Do not plan to be its main funder for long."}, {"quadrant": "high_low", "name": "Mandate Without Money", "narrative": "[speculation] It is 2031, and fungi won the argument on paper. The post-2030 framework refers to them. Over 50 countries have fungal targets. Yet private funders stayed with carbon, large mammals and big intermediaries, and aid budgets never recovered from the cuts of 2025-27. Ministries now ask for help they cannot pay for: draft this species plan, train these assessors, come to this meeting. Chile's new government wants the work done but offers an MOU rather than a contract. Much of the formal implementation runs through Plantlife, IUCN groups and a few government agencies, which have institutional backing. The Fungi Foundation is cited in nearly every relevant policy text and is invited to everything. It is also living on individual gifts and donor-advised grants, which rise and fall from year to year. Its policy leads spend more on travel to negotiations than its Chilean field program can spare. Staff leave for better-paid posts at larger groups, taking relationships with them. The fungarium is under-resourced. Success has created an obligation that its budget cannot meet, and its best options now involve hosting arrangements or a merger with a better-capitalized partner.", "effect_on_org": {"revenue": "[speculation] $300,000 to $600,000 a year, about today's level, with sharp swings. Government contracts are small and slow if they come at all. Possibly reliant on a few DAF donors.", "programs": "[speculation] Policy crowds out field, education and ethnomycology, which were its most distinctive assets. Expeditions and films are the first cut.", "staff": "[speculation] Burnout and departures of policy staff. The contractor model across countries becomes harder to sustain. Founder dependence grows at the moment the workload peaks.", "standing": "[speculation] Very high in name, thin in delivery. It risks becoming known for commitments that no one tracks, even with its own Fungal Conservation Tracker."}, "early_signals": ["The Pledge grows but the Strategy still names no funder or costed resourcing plan by the end of 2027.", "Governments ask for technical work without contracts. Ask the organization how many unfunded requests it declined.", "Program spending shifts toward travel and policy staff in the FY2025-26 filings, and field line items fall.", "Fungal funding at SPUN grows again while no second fungal organization gets a seven-figure grant.", "UK aid to nature continues to fall after 2027, per ICAI or CGD analysis."], "readiness": {"score": 2, "rationale": "[inference] It has the access to be asked but not the balance sheet to answer. Reserves were 2.1 months. No reserve policy or post-COP17 role statement was found. Its FY2021-24 record shows it expanding programs on one-time money and then cutting program spending 24% in FY2024."}, "donor_implication": "[inference] Beware funding more policy outputs. Fund capacity to say no, reserves, and a formal partnership with whoever holds implementation money. A donor can have real leverage here, because little other money is available."}, {"quadrant": "low_high", "name": "The Private Kingdom", "narrative": "[speculation] It is 2031. States mostly walked away from new biodiversity commitments. The post-2030 talks produced a thin text, with fungi named in passing. Chile's permit reforms stuck even after the 2030 change of government, and its fungal rules survive largely on paper. Philanthropy partly filled the space. A handful of billionaire-backed funds and a generation of younger donors treat soil and fungal life as a serious climate and nature bet. They fund mapping, private land protection, Indigenous-led stewardship and science, and they want data. SPUN has become a substantial institution. In this world, advocacy for government pledges looks dated to many funders, and the pledge that made the Fungi Foundation's name has little to show for itself. The organization faces a clear fork. Where it adapted, it turned its Chilean field knowledge, fungarium and ethnomycology ties into fundable work: documented sites, community agreements and training, often as a subgrantee or partner to a larger group. Where it did not, money flowed past it to better-measured peers while its founder kept speaking at conferences. The likelier result is partial adaptation, a modest budget and a closer tie with a larger funder or a peer.", "effect_on_org": {"revenue": "[speculation] Widest range of the four: $400,000 to $1.5 million. Depends on capturing institutional grants. The likely form is restricted project money or subgrants, not general support.", "programs": "[speculation] Moves away from government-facing policy toward site-based conservation, community work, education and vouchered specimens tied to sequence data. The Chile program survives by working around the state rather than through it.", "staff": "[speculation] Policy roles shrink, and field, data and grants roles grow. Some senior staff may move to better-funded peers.", "standing": "[speculation] Respected as a pioneer, seen as secondary to SPUN. Its standing with funders depends on proving outcomes, where it has no independent evaluation today."}, "early_signals": ["A second fungal organization or pooled fund announces a seven-figure commitment, with or without the Foundation.", "Chile's SBAP amendment passes and the withdrawn SBAP regulations are not resubmitted through 2027.", "The 2027 Chilean budget law confirms cuts to environmental inspection, and no fungal plan appears in ministry work.", "National Geographic Society renews or enlarges its loyo support, or Samueli's giving grows beyond $75,000.", "The Foundation appears as a named partner or subgrantee in a SPUN, Re:wild or Plantlife funded project."], "readiness": {"score": 2, "rationale": "[inference] It has useful assets for this world in the National Geographic relationship, Chile field staff and community ties. It lacks outcome evidence and audited statements, and I found none of SPUN's named funders among its visible supporters. No data on its site-based results was found."}, "donor_implication": "[inference] The question to press is whether your dollar helps it change shape or just sustains its pledge work. Fund outcome measurement and a pilot of site-level protection in Chile. Compare against SPUN and Plantlife each year."}, {"quadrant": "low_low", "name": "Leaf Litter", "narrative": "[speculation] It is 2031. The fungal moment of 2024-2026 now reads as a brief high point. States cut aid and environmental staff. The post-2030 talks were bogged down by finance disputes and barely mention fungi. Chile's rules narrowed under Kast, and the 2030 government had other priorities. Private money also moved elsewhere, as AI, health, security and domestic crises took donors' attention. Some of the fungal money that existed stayed with SPUN and with science groups, and FunDiS's 2025 revenue collapse now looks like an early warning. Without COP-level news, press attention fades; AI answers absorb the traffic that once reached its free curriculum, and small online gifts decline. The Fungi Foundation's US entity struggles with the same two or three funders, and one non-renewal forces a hard choice. Its staff scatter into universities and other jobs. The legal structure, never simple, becomes a burden as Chile and US reporting costs consume management time. It may survive as a small Chilean group with a founder-led voice and a few international fellows, or merge into a partner. The biggest open question is who takes the fungarium, the ethnomycology relationships and the Pledge, none of which has a documented successor.", "effect_on_org": {"revenue": "[speculation] Falls to $100,000 to $300,000. Loss of one of the top three sources, which together made up 41.8% in 2024, could trigger this on its own.", "programs": "[speculation] Expeditions, films, India and UK policy work end or become volunteer. Chile curriculum and fungarium care continue at minimum level, if at all.", "staff": "[speculation] Down to a core of 3 to 5, mostly in Chile. Long-serving program staff may stay for mission reasons, but there is no sign they could be paid. Key-person risk becomes survival risk.", "standing": "[speculation] Credit for early wins remains in the historical record. Current influence falls sharply, and the Pledge sits dormant unless the UK or Chile or a partner adopts it."}, "early_signals": ["FY2025 990 shows a further deficit, or net assets under about $50,000, or no filing by mid-2027.", "Samueli or the Fidelity-routed donor does not repeat in 2025-26 data.", "No new Pledge signatories for 12 months after COP17, and the COP17 outcome omits fungi.", "Press count falls again from the 45 publications in 14 countries reported for 2025.", "Departure of a long-serving program lead such as the Programs Lead or Director of Science, without a stated successor."], "readiness": {"score": 1, "rationale": "[inference] 2.1 months of reserves at FY2024, three straight deficits, no succession plan found and no fungarium succession plan found. Net assets may have fallen further, as no FY2025 data was seen. CEO pay and program spending have already fallen, which suggests the easy cuts have been used. No wind-down or merger planning was found, though this would not normally be public."}, "donor_implication": "[inference] Do not make a large single gift on this path. Stage money, and ring-fence part of it to transfer irreplaceable assets to safe hands. A modest gift can keep the fungarium and records from being lost."}], "most_likely_quadrant": "low_high", "most_dangerous_quadrant": "low_low", "judgment": "[inference] Most likely: The Private Kingdom (low state commitment, high private reach). My rough odds, judgment rather than calculation: low-high 35%, low-low 30%, high-low 20%, high-high 15%. Three things support low on state commitment. Chile's government is moving against new environmental instruments, and the next change of term is not until about 2030. UK and US retreat is already in law or budget plans. The new Strategy itself says it carries no new commitments. Support for high private reach is weaker: environment giving rose 8.2% in real terms in 2025, and SPUN's revenue rose about 28-fold in one year. That is one organization, so low-low is close behind. Fungal money may simply stay concentrated.\n\nMost dangerous: Leaf Litter (low-low). A charity with 99% contributed revenue, three sources at 41.8%, and 2.1 months of reserves at the last reading has no buffer if both states and funders move away. The quiet danger is in the most likely quadrant, though. Money would arrive in the field and pass by an organization that lacks an audit, outcome data and a traceable Chile budget, and whose edge is the policy work that world values least.\n\nWhat would change my mind: a COP17 decision naming fungi, a signed Chile MOU under Kast, or a fungal funder backing a second organization at seven figures. Today's biggest unknown is not in the scenarios at all: FY2025 finances.", "robust_moves": [{"move": "Fund and require one verifiable financial picture: an independent audit or CPA review of the US entity, a consolidated US-Chile budget, and a clear explanation of the $80,097 grants line and the No answers on affiliates and lobbying. Make it a condition of the first tranche.", "why_robust": "[inference] In high-private-reach worlds it unlocks institutional funders. In low-reach worlds it reveals problems early and supports a merger or hosting deal. It also shortens the response to any US or foreign regulatory inquiry. This is cheap relative to the risk it removes. No cost estimate was obtained."}, {"move": "Give multi-year general support of about $100,000 to $150,000 a year for three years, with part earmarked to reach six months of reserves ($231,011 at FY2024 spending, about $149,000 above FY2024 net assets). Tie later tranches to published FY2025 and FY2026 results.", "why_robust": "[inference] Every scenario punishes the same weakness. A cushion buys time for the 2027-2028 signals to resolve, and it prevents a repeat of the FY2022-24 pattern of expanding on one-time money and then cutting. The range fits the room-for-funding finding earlie he mailing address first.", "Read the FY2025 990 before renewing."]}, {"gift_type": "major_unrestricted", "risk": "elevated", "rationale": "[inference] A $100,000 gift is about 22% of FY2024 expense, into an organization with no audit, a Chile flow that cannot be traced, no reserve policy found and an unknown share of a large 2025 award. If the award landed there, your gift matters less than it looks. If not, your gift may be absorbed by a deficit. Either way it may not buy durable capacity.", "risk_reducers": ["Pay in tranches: first after FY2025 statements and current cash, next after a CPA review.", "Require a written account of the Climate Breakthrough funds.", "Require a board-adopted reserve target, with part of the gift designated toward it.", "Offer to pay for the review or audit.", "Meet the board chair and Treasurer without the founder present."]}, {"gift_type": "major_restricted", "risk": "moderate", "rationale": "[inference] Named work, such as the loyo conservation plan, can be milestone-tested, and it fits where the theory of change most needs proof. The risks: thin reserves may press restricted funds into general use, the money may pass to a Chilean body whose legal identity was not confirmed, and restriction starves the overhead the organization lacks. National Geographic Society's support shows at least one institutional funder has backed this project.", "risk_reducers": ["Name the receiving entity and require a written grant agreement down to Chile.", "Include 15-20% overhead.", "Separate bank tracking and half-yearly financial reports.", "Milestones stated as adopted plan, budget or legal step, not outputs.", "Ring-fence the fungarium and records if there is any wind-down."]}, {"gift_type": "multi_year_pledge", "risk": "moderate", "rationale": "[inference] Predictability is the thing the organization most lacks, and three-year funding directly attacks its main weakness. Risk is low if it is conditional and high if not, since an unconditional pledge would be booked up front and could support expansion, repeating the FY2021-24 pattern. Its value also falls if the award already covers the same years.", "risk_reducers": ["Annual releases tied to published audit or review, a reported reserve level, and a report against prior-year goals.", "Exit clause for a change of chief executive, or for no filed 990.", "Check award term first and stagger your years to start where it ends.", "Avoid being more than about 20% of revenue."]}, {"gift_type": "endowment_or_capital", "risk": "high", "rationale": "[inference] An organization with 2.1 months of reserves at last filing, no audit and no custody plan is not ready to hold permanent funds. No building or endowment need is documented for the organization as a whole. The $250,000 Mazatec museum goal (Furci, 2024) is a separate project with community co-management, unverified from the family's side.", "risk_reducers": ["Decline for now; revisit after three clean years.", "For the fungarium, fund digitization and a custody agreement with a university instead.", "For the museum, verify the family's position directly and use a separate agreement with staged payments."]}, {"gift_type": "affiliated_c4", "risk": "not_applicable", "rationale": "[evidence] No affiliated 501(c)(4) found. The FY2024 990 answers No to related organizations. Political campaign activity is also answered No.", "risk_reducers": []}], "efficiency": {"verdict": "Cheap for agenda-setting and unproven for protection. On public data I cannot say that change per dollar is improving, and the failure to reconstruct it is itself a transparency finding.", "change_per_dollar": "[inference] Latest filed year, FY2024: $350,354 program expense, $462,022 total, US entity only. The biggest change near that money is the Fungal Conservation Pledge, launched with Chile and the UK at COP16. Oryx independently credits the Foundation with leading its development, so its share is fair to claim as lead or co-lead. It is non-binding ing": "Even the corrected figure shows spending well above sustainable income, and no public plan explains it.", "evidence_supports": "[inference] Correction is sound and the deficit reading holds. Direction was improving by FY2024 but FY2025 is unseen.", "settling_question": "Did the board approve each deficit budget, and what does the FY2025 result show?"}, {"key": "consecutive_deficits", "label": "Consecutive deficit years: 3", "benign": "Restricted or multi-year money received in FY2021 was deliberately spent over later years.", "worrying": "Expansion was built on non-repeating income and was not controlled, and silence in public reporting reflects a lack of board challenge.", "evidence_supports": "[inference] Between the two: program spending rose to $459,671, then was cut 24%, which shows correction, but no board statement or reserve policy was found.", "settling_question": "Can the chair show the minutes where the FY2022 to FY2024 deficits were approved, with the plan to end them?"}, {"key": "expense_minus_revenue_growth", "label": "Expense growth minus revenue growth: 36.56 points per year", "benign": "A small FY2020 startup base inflates the number and it means little.", "worrying": "Measured from FY2021, revenue fell about 9% a year while expenses rose about 32% a year.", "evidence_supports": "[inference] Magnitude is an artifact, and direction is real through FY2023. FY2024 reversed part of it, with expenses down and revenue up.", "settling_question": "What are FY2025 and budgeted FY2026 revenue and expense, separating one-time from recurring?"}, {"key": "revenue_volatility", "label": "Revenue volatility: 346.8 points", "benign": "Almost entirely the jump from $60,660 to $542,058 at start-up, and revenue has held between about $348,000 and $413,000 since FY2022.", "worrying": "Stable revenue depends on very few donors, so stability is less secure than it looks. A new large award would bring volatility back.", "evidence_supports": "[inference] The benign explanation fits the number. The concentration worry stands separately on secondary figures.", "settling_question": "What share of each year's revenue came from the top five donors, FY2021 to FY2025?"}, {"key": "top_paid_pct", "label": "Highest-paid person as share of expenses: 12.63%", "benign": "The share reflects a small budget. Pay of $58,336 is modest for a chief executive with international duties, and it fell 36% in two years, possibly a sacrifice during deficits.", "worrying": "Reported pay understates the total if Furci is also paid by Chile or personally through an award, or the drop reflects less time on the job.", "evidence_supports": "[inference] Pay is not excessive on filed facts. The 990 shows $0 from related organizations, but the board answers No to having any, so that line would not capture a Chilean body it does not treat as related. The fall predates the September 2025 award.", "settling_question": "What is Furci's total professional income from all entities and awards connected with this work, and what share of working time does the US charity buy?"}, {"key": "contrib_share", "label": "Contributions as share of revenue: 98.98%", "benign": "Normal for advocacy work; peer median is 94.4%. There is no natural earned revenue for this kind of work.", "worrying": "With few donors and an event-and-founder-led funder base, one lapse hurts.", "evidence_supports": "[inference] Share alone is normal. Concentration and reserves, not the ratio itself, are the risk.", "settling_question": "Show the top-10 donors, anonymized, with renewal history and who holds each relationship."}, {"key": "personnel_pct", "label": "Personnel 18.26% with 2 employees, against 14-15 listed team members (not flagged; peer outlier)", "benign": "A legitimate distributed contractor model, with Chile-based staff paid through local arrangements.", "worrying": "Worker misclassification or unmanaged exposure across countries, and a major cost pool that donors cannot see.", "evidence_supports": "[inference] Contractor or Chile-based payment is the likely explanation. Whether it is well-papered is unknown.", "settling_question": "Show a contractor and payroll map by person, country, payer entity and contract type."}, {"key": "officer_comp_pct", "label": "Officer compensation $0 while the chief executive is paid (not flagged; data anomaly)", "benign": "A preparer's classification choice, such as booking CEO pay under other salaries.", "worrying": "Loose preparation that extends to more material answers, given that Part III program revenue also equals total revenue.", "evidence_supports": "[inference] Benign on the money, as the CEO's pay is disclosed. It adds to a pattern of weak filing quality.", "settling_question": "Has the Treasurer reviewed these line items with the preparer, and will FY2025 correct them?"}], "advisor_questions": [{"question": "Is anyone already doing this, and better?", "status": "partial", "answer": "Not this exact combination. SPUN is larger and stronger on science and has its own advocates. Plantlife and the Network lead implementation of the Global Strategy. IUCN groups lead assessments. No peer reviewed combines Chile's policy record, treaty-level policy and ethnomycology. No comparison of quality exists. SPUN is partly an ally: Sheldrake holds roles at both organizations, and a SPUN co-founder shares the 2025 award with Furci.", "basis": "inference", "confidence": 0.6, "sources": [{"url": "https://www.climatebreakthrough.org/awardee/fungi-team/", "title": "Climate Breakthrough: fungi team"}, {"url": "https://www.plantlife.org.uk/our-work/global-strategy-for-fungal-conservation", "title": "Plantlife: Global Strategy"}, {"url": "https://www.cambridge.org/core/journals/oryx/article/fungi-gaining-ground-at-recent-cbd-and-iucn-meetings/01866B1C43C9814E4322A0E3E957C078", "title": "Oryx, 2025"}]}, {"question": "What is the counterfactual if this organization disappeared, and if this gift does not arrive?", "status": "partial", "answer": "If the brand vanished: global momentum continues, slower and less visible. The Pledge loses its main civil-society driver. Chile field work, curriculum advocacy, the fungarium and ethnomycology have no evident heir. If only the US entity vanished, Chile likely shrinks by an unknown amount. If your gift does not arrive: under about $25,000, little changes. At $100,000 or more, the absence would have shown in contractor capacity on FY2024 facts, but this depends on the unknown 2025 award share. No program budget exists to name the exact activity.", "basis": "inference", "confidence": 0.5, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153", "title": "ProPublica"}, {"url": "https://www.ffungi.org/blog/fungi-foundation-global", "title": "Fungi Foundation global, 2020"}]}, {"question": "Is there room for more funding, and what happened to the last big increase?", "status": "partial", "answer": "Probably yes on filed facts, but the size is now uncertain. Earlier sections estimated $100,000 to $250,000 a year. I cap the first year at $100,000 until the award's location is known. Six months of reserves needs about $149,000 above FY2024 net assets. Last big increase: FY2021 revenue of $542,058 against $200,323 spent. It went to program growth, was not replaced, and led to three deficits and a 24% program cut in FY2024. This is the best predictor for a new windfall.", "basis": "inference", "confidence": 0.6, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153", "title": "ProPublica"}, {"url": "https://www.climatebreakthrough.org/awardee/fungi-team/", "title": "Climate Breakthrough: fungi team"}]}, {"question": "Is this the right unit to fund, or should money go to a coalition, policy effort, intermediary, or peer?", "status": "partial", "answer": "Right unit if you believe recognition drives conservation, or you care about Chile and ethnomycology. Wrong unit if you want measured outcomes now or UN's large funders are not visible here. No evidence found of any funder stopping, and the data could not show it.", "basis": "evidence", "confidence": 0.6, "sources": [{"url": "https://www.causeiq.com/organizations/fungi-foundation,851478153/", "title": "CauseIQ"}, {"url": "https://www.climatebreakthrough.org/?p=6703", "title": "Meet the 2025 Climate Breakthrough Awardees"}, {"url": "https://www.climatebreakthrough.org/awardee/fungi-team/", "title": "Climate Breakthrough: fungi team"}, {"url": "https://www.ffungi.org/blog/national-geographic-society-supports-groundbreaking-project-in-chile", "title": "NatGeo Society support, 2026"}]}, {"question": "Is the problem growing or shrinking?", "status": "answered", "answer": "Threat likely growing; neglect narrowing from a very low base. IUCN's fungal count passed 1,000 in March 2025 and cited deforestation, farming and urban expansion. Kew says only 0.6% of species assessed, with 411 threatened. These are first assessments, not a measured trend. Funding-neglect data is old (fungi and algae under 0.2%, 1992-2016). Policy attention has risen quickly.", "basis": "inference", "confidence": 0.7, "sources": [{"url": "https://iucn.org/press-release/202503/first-1000-fungi-iucn-red-list-reveal-growing-threats-iucn-red-list", "title": "IUCN, March 2025"}, {"url": "https://www.eurekalert.org/news-releases/1131957", "title": "Kew 2026 release"}, {"url": "https://marcellus.in/story/wildlife-conservation-funds-biased-against-smaller-species-study/", "title": "Funding bias coverage"}]}, {"question": "Is this a program or an organization (founder dependency, board strength, survivability)?", "status": "partial", "answer": "Between the two, closer to a founder-led network than an institution. Assets of its own: long-tenured program staff, a fungarium, a former executive director who now fronts a funded project. But 2 reported employees, one person connecting two boards, no successor found, and a board whose public voice is close to nil. Six independent voting members look good on paper; oversight of deficits cannot be observed. Survival without Furci: likely in reduced Chilean form.", "basis": "inference", "confidence": 0.65, "sources": [{"url": "https://www.ffungi.org/board", "title": "Board page"}, {"url": "https://www.ffungi.org/team", "title": "Team page"}, {"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Form 990"}]}, {"question": "Who is the executive director, in their own words: risk appetite, candor about failure, relationship to money and donors, and what a departure would do to revenue?", "status": "partial", "answer": "Giuliana Furci, founder. Risk: high strategic and reputational appetite, shown by a new word, a pledge outside the agenda, a forest as co-author. Candor: real on ethics ('being complicit to sharing information that had been obtained without informed consent', 2024, auto-transcribed), none found on organizational finances. Money: 'we measure our success not in revenue of money in the bank, but of durable change' (2021). Project numbers come easily; organizational numbers were not found. Donors: warm and personal ('I hope to make you proud', 2021). Departure: dollar effect unknown. Speculation: a third or more of contributions at risk. Friendly hosts may simply not have asked about finances.", "basis": "inference", "confidence": 0.65, "sources": [{"url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/", "title": "Ferriss transcript, 2021"}, {"url": "https://mckenna.academy/mka-podcast/bridging-fungi-science-and-mazatec-cultural-heritage-initiatives/", "title": "Brainforest Cafe, 2024"}, {"url": "https://tellurideinside.com/2024/08/telluride-mushroom-festival-guiliana-furci-everywhere-you-want-to-be.html", "title": "Telluride Inside, 2024"}]}, {"question": "What do they say they are versus what the money says they are?", "status": "answered", "answer": "Says: a global organization, chapters and re   h += `<div class="two"><div><h3>Mission, verbatim</h3>${prose(I.mission_statement)}</div><div><h3>What they actually do</h3>${prose(I.what_they_actually_do)}</div></div>`;
  h += `<h2>Leadership</h2><table><tr><th>Name</th><th>Role</th><th>Since</th><th>Public footprint</th></tr>${(I.leadership||[]).map(l=>`<tr><td>${esc(l.name)}</td><td class="wrap">${esc(l.title)}</td><td>${esc(l.since||'—')}</td><td class="wrap small">${(l.footprint||[]).map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.title)}</a>`).join(' · ')}</td></tr>`).join('')}</table>`;
  if(I.board) h += `<p class="small">Board: chair ${esc(I.board.chair||'unknown')}${I.board.size?`, ${I.board.size} members`:''}. ${esc(I.board.notes||'')}</p>`;

})();

      if(fd.schedule_o){ h += `<details><summary><span class="r">O</span><span class="fm">Schedule O narrative, as filed</span><span class="pr">excerpt</span></summary><div class="in"><p class="small" style="max-width:none;white-space:pre-wrap">${esc(fd.schedule_o.replace(/ \| /g,'\n').slice(0,12000))}</p></div></details>`; }

/* ratios */
(function(){
  const R = F&&F.primary&&F.primary.ratios;
  if(!R||!R.available){ section('ratios','Ratios',`<h1>Ratios</h1>`+(R?`<div class="empty"><b>No ratios.</b> ${esc(R.reason||'')}</div>`:empty('The financial extract'))); return; }
  let h = `<h1>The weird ratios</h1><p class="sub">Arithmetic on filed numbers, thresholds scaled to the ${esc(R.size_band)} band. Flags prompt questions; they do not settle them.</p>`;
  const anomalies = {}; (A&&A.ratio_anomalies||[]).forEach(a=>anomalies[a.key]=a);
  const order = Object.values(R.ratios).sort((a,b)=>({red:0,amber:1,green:2,na:3}[a.flag]-{red:0,amber:1,green:2,na:3}[b.flag]));
  h += `<div class="ratios">`+order.map(r=>{
    const an = anomalies[r.key];
    return `<div class="ratio ${r.flag}"><div class="l"><span class="light ${r.flag}"></span>${esc(r.label)}</div><div class="v">${r.value==null?'—':num(r.value,2).replace(/\.?0+$/,'')}<small>${esc(r.unit)}</small></div><div class="f">${esc(r.formula)} · ${esc(r.year)}</div>${r.note?`<div class="why muted">${esc(r.note)}</div>`:''}${(R.flags.find(f=>f.key===r.key)||{}).why?`<div class="why">${esc(R.flags.find(f=>f.key===r.key).why)}</div>`:''}${an?`<div class="why"><b>Benign:</b> ${esc(an.benign)}<br><b>Worrying:</b> ${esc(an.worrying)}<br><b>Evidence supports:</b> ${esc(an.evidence_supports)}<br><b>Ask:</b> ${esc(an.settling_question)}</div>`:''}</div>`;
  }).join('')+`</div>`;
  const P = F.peer_comparison;
  if(P&&P.rows&&P.rows.length){
    h += `<h2>Against ${P.peer_count} peers</h2><p class="small muted">Peers were named by the landscape agent; their numbers come from the same Form 990 source. The band is the peer range, the tick the peer median, the dot this organization.</p><table><tr><th>Ratio</th><th class="num">This org</th><th class="num">Peer median</th><th>Range</th><th class="num">Percentile</th></tr>`;
    h += P.rows.map(r=>{const lo=Math.min(r.peer_min,r.subject==null?r.peer_min:r.subject), hi=Math.max(r.peer_max,r.subject==null?r.peer_max:r.subject), sp=(hi-lo)||1, x=v=>((v-lo)/sp*100).toFixed(1)+'%';
      return `<tr><td class="wrap">${esc(r.label)}</td><td class="num">${num(r.subject,2)}</td><td class="num">${num(r.peer_median,2)}</td><td style="min-width:180px"><div class="range"><div class="tr"></div><div class="band" style="left:${x(r.peer_min)};width:${((r.peer_max-r.peer_min)/sp*100).toFixed(1)}%"></div><div class="med" style="left:${x(r.peer_median)}"></div>${r.subject==null?'':`<div class="me" style="left:${x(r.subject)}" title="this organization"></div>`}</div></td><td class="num">${r.percentile==null?'—':r.percentile+'th'}</td></tr>`;}).join('')+`</table>`;
    h += `<table><tr><th>Peer</th><th>Relationship</th><th>FY</th><th class="num">Expenses</th><th>Highest paid</th><th class="num">Total pay</th></tr>${(P.peers||[]).map(p=>`<tr><td class="wrap">${esc(p.name)}</td><td class="small">${esc(p.relationship||'')}</td><td>${p.latest_year||'—'}</td><td class="num">${money(p.expenses)}</td><td class="wrap small">${esc(p.top_paid_name||'—')}</td><td class="num">${money(p.top_paid_total)}</td></tr>`).join('')}</table>`;
  } else h += `<p class="small muted">No peer comparison available (peers without EINs, or the landscape step has not run).</p>`;
  h += `<p class="small muted">${esc(R.method_note)}</p>`;
  section('ratios','Ratios',h);
})();

(function(){

  if(S.media_footprint) h += `<h2>Media footprint</h2>`+claim({statement:`Volume: ${S.media_footprint.volume}. Tone: ${S.media_footprint.tone}. Pattern: ${S.media_footprint.pattern}`,basis:S.media_footprint.basis,sources:S.media_footprint.sources});

/* results */
(function(){
  if(!RS){ section('results','Results',empty('The results ledger')); return; }
  const spark = (series, w=160, h=36) => { const pts=(series||[]).filter(p=>p.value!=null).sort((a,b)=>a.year-b.year); if(pts.length<2) return pts.length===1?`<span class="small muted">${pts[0].year}: ${esc(pts[0].value_text||pts[0].value)}</span>`:'<span class="small muted">no series</span>';
    const xs=pts.map(p=>p.year), ys=pts.map(p=>p.value); const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys); const X=v=>6+(w-12)*((v-x0)/((x1-x0)||1)), Y=v=>h-6-(h-12)*((v-y0)/((y1-y0)||1));
    const d=pts.map((p,i)=>(i?'L':'M')+X(p.year).toFixed(1)+' '+Y(p.value).toFixed(1)).join(' ');
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${pts[0].year} to ${pts[pts.length-1].year}"><path d="${d}" fill="none" stroke="#000080" stroke-width="2" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${X(p.year).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="${p.kind==='actual'?3.5:2.5}" fill="${p.kind==='actual'?'#000080':'#ffffff'}" stroke="#000080" stroke-width="1.5"><title>${p.year} ${p.kind||''}: ${esc(p.value_text||p.value)}</title></circle>`).join('')}</svg>`; };
  const evq = q => badge((q||'unknown').replace(/_/g,' '), q==='independently_verified'?'evidence':q==='self_reported_with_data'?'inference':q==='contradicted'?'red':'speculation');
  const contrib = {lead:'green',co_lead:'green',one_of_many:'amber',claimed_contested:'amber',claimed_contradicted:'red'};
  const dur = {in_force:'green',partly_reversed:'amber',reversed:'red',too_early:'na',unknown:'na'};
  let h = `<h1>Results</h1><p class="sub">What changed in the world because of this organization, and what it cost. ${RS.mode?`Assessed ${esc(RS.mode.primary)}ly: ${esc(RS.mode.rationale)}`:''}</p>${prose(RS.verdict)}`;
  const outs=(RS.outcomes||[]).slice().sort((a,b)=>a.rank-b.rank);
  h += `<h2>Outcome harvest</h2><p class="small muted">The most significant changes over the last five years that the organization claims or can be shown to have contributed to. Significance 1 (local, minor, easily reversed) to 5 (structural, wide, durable). Contribution is the organization's fair share of the credit.</p>`;
  h += outs.map(o=>`<details${o.rank<=2?' open':''}><summary><span class="r">${o.rank}</span><span class="fm">${esc(o.what_changed)}</span><span class="pr"><span class="dots">${'●'.repeat(o.significance)}<span class="off">${'●'.repeat(Math.max(0,5-o.significance))}</span></span> ${o.year||''}</span></summary><div class="in"><div class="row" style="margin:6px 0 10px">${badge('contribution: '+o.contribution.replace(/_/g,' '), contrib[o.contribution]||'na')} ${badge('durability: '+o.durability.replace(/_/g,' '), dur[o.durability]||'na')} ${evq(o.evidence_quality)} ${badge(o.basis,o.basis)}${o.program?` <span class="small muted">${esc(o.program)}</span>`:''}</div><div class="kv"><div>For whom</div><div>${esc(o.for_whom)}${o.count?` · ${esc(o.count)}`:''}</div><div>Counterfactual</div><div>${esc(o.counterfactual)}</div><div>Others involved</div><div>${esc((o.others_involved||[]).join(', ')||'—')}</div><div>Evidence</div><div>${esc(o.evidence)}</div></div>${srcs(o.sources)}</div></details>`).join('') || '<p class="muted small">No outcomes could be established.</p>';
  h += `<h2>Failures and reversals</h2>`+((RS.failures_and_reversals&&RS.failures_and_reversals.length)?RS.failures_and_reversals.map(f=>claim({statement:`${f.consequence}${f.how_handled?'\n\nHow handled: '+f.how_handled:''}`,basis:f.basis,sources:f.sources}, `${f.year||''} ${f.what}`)).join(''):'<p class="muted small">None found in the public record. For an organization more than a few years old that is itself a finding.</p>');
  const d2=RS.dollars_to_change;
  if(d2){ const ns=d2.north_star||{}; const last=(ns.series||[]).slice().sort((a,b)=>b.year-a.year)[0];
    h += `<h2>Dollars to change</h2><div class="two"><div><h3>Latest year${d2.latest&&d2.latest.year?', FY'+d2.latest.year:''}${d2.latest&&d2.latest.spent?' · '+money(d2.latest.spent)+' spent':''}</h3>${prose(d2.latest&&d2.latest.summary)}</div><div><h3>Earliest reconstructed${d2.earliest&&d2.earliest.year?', FY'+d2.earliest.year:''}${d2.earliest&&d2.earliest.spent?' · '+money(d2.earliest.spent)+' spent':''}</h3>${prose(d2.earliest&&d2.earliest.summary)}</div></div>`;
    h += claim({statement:`${d2.qualitative_judgment}\n\nStrongest item: ${d2.strongest_item}\n\nWeakest item: ${d2.weakest_item}`,basis:d2.basis}, 'Portfolio judgment');
    if(ns.measure){ h += `<h3>North star: ${esc(ns.measure)} ${badge(ns.defensible?'defensible':'not defensible from public data', ns.defensible?'green':'amber')}</h3>${last?`<div class="row"><span class="ratio" style="padding:8px 14px"><span class="v" style="font-size:22px">${esc(last.value_text||last.value)}</span><span class="f"> ${last.year}</span></span>${spark(ns.series,320,60)}</div>`:''}<p class="small">${esc(ns.limits||'')}${ns.what_would_make_it_possible?`<br><span class="muted">What would make it possible: ${esc(ns.what_would_make_it_possible)}</span>`:''}</p>`; }
    else if(ns.what_would_make_it_possible) h += `<p class="small"><b>No defensible per-dollar measure.</b> ${esc(ns.what_would_make_it_possible)}</p>`; }
  if(RS.trend) h += `<h2>Trend</h2>`+claim({statement:RS.trend.rationale,basis:RS.trend.basis}, `Change per dollar: ${RS.trend.change_per_dollar.replace(/_/g,' ')} · reporting moving ${RS.trend.reporting_direction.replace(/_/g,' ')}`);
  if(RS.targets){ const r=RS.targets; h += `<h2>Says in advance what it will change?</h2>`+claim({statement:r.summary,basis:r.basis}, `Publishes targets: ${r.publishes_targets}`)+(r.examples&&r.examples.length?`<table><tr><th>Goal</th><th>Year</th><th>Stated</th><th>Result</th></tr>${r.examples.map(t=>`<tr><td class="wrap">${esc(t.goal)}</td><td>${esc(t.year||'—')}</td><td class="wrap">${esc(t.stated)}</td><td class="wrap">${esc(t.result)}${srcs(t.sources)}</td></tr>`).join('')}</table>`:''); }
  h += `<h2>Programs, by year</h2>`+(RS.programs||[]).map(p=>`<h3>${esc(p.program)} ${evq(p.evidence_quality)}</h3><table><tr><th>FY</th><th class="num">Expenses</th><th>Results claimed</th></tr>${(p.years||[]).slice().sort((a,b)=>b.year-a.year).map(y=>`<tr><td>${y.year}</td><td class="num">${money(y.expenses)}</td><td class="wrap">${esc(y.results_claimed)}${srcs(y.sources)}</td></tr>`).join('')}</table>${p.cost_per_unit&&p.cost_per_unit.length?`<table><tr><th>FY</th><th>Outcome unit</th><th class="num">Cost per unit</th><th>Computed as, and why it is defensible</th></tr>${p.cost_per_unit.slice().sort((a,b)=>b.year-a.year).map(c=>`<tr><td>${c.year}</td><td class="wrap">${esc(c.unit)}</td><td class="num">${money(c.cost)}</td><td class="wrap small">${esc(c.numerator)} / ${esc(c.denominator)} · ${esc(c.why_defensible)}</td></tr>`).join('')}</table>`:'<p class="small muted">No defensible outcome unit for a cost-per-unit figure.</p>'}`).join('');
  if(RS.peer_comparables&&RS.peer_comparables.length) h += `<h2>Comparable outcomes reported by peers</h2><table><tr><th>Peer</th><th>Outcome</th><th>Value</th><th>Year</th></tr>${RS.peer_comparables.map(p=>`<tr><td class="wrap">${esc(p.peer)}</td><td class="wrap">${esc(p.outcome)}</td><td class="wrap">${esc(p.value_text)}${srcs(p.sources)}</td><td>${esc(p.year||'—')}</td></tr>`).join('')}</table>`;
  h += `<details><summary><span class="r">#</span><span class="fm">Activity counts, low weight</span><span class="pr">${(RS.activity_counts||[]).length} series</span></summary><div class="in"><p class="small muted">Outputs the organization reports about itself. Useful for spotting a change in reporting, not for judging impact.</p>`+((RS.activity_counts&&RS.activity_counts.length)?`<table><tr><th>Metric</th><th>Level</th><th>Series</th><th>Trend</th><th>Note</th></tr>${RS.activity_counts.map(m=>`<tr><td class="wrap"><b>${esc(m.metric)}</b><br><span class="small muted">${esc(m.unit)}${m.program?' · '+esc(m.program):''}</span></td><td>${badge(m.level, m.level==='impact'?'evidence':m.level==='outcome'?'inference':'na')}</td><td>${spark(m.series)}<br><span class="small muted">${(m.series||[]).slice().sort((a,b)=>a.year-b.year).map(p=>`${p.year}: ${esc(p.value_text||p.value||'—')}${p.kind!=='actual'?' ('+p.kind+')':''}`).join(' · ')}</span></td><td class="small">${esc(m.trend.replace(/_/g,' '))}</td><td class="wrap small">${esc(m.note)}${m.definition_changes?`<br><span class="muted">Definition: ${esc(m.definition_changes)}</span>`:''} ${badge(m.basis,m.basis)}</td></tr>`).join('')}</table>`:'<p class="muted small">None found.</p>')+`</div></details>`;
  h += `<h2>Could not verify</h2>${list(RS.gaps)}<h3>Documents or data that would settle it</h3>${list(RS.documents_that_would_close_gaps)}`;
  section('results','Results',h);
})();

  if(L.differentiation) h += `<h2>Differentiation</h2>`+claim({statement:L.differentiation.rationale,basis:L.differentiation.basis,confidence:L.differentiation.confidence}, `Position: ${L.differentiation.position}`);
  if(L.counterfactual) h += `<h2>Counterfactual</h2>`+claim({statement:`If the organization disappeared: ${L.counterfactual.if_org_disappeared}\n\nWho absorbs the work: ${L.counterfactual.who_absorbs}\n\nIf a gift does not arrive: ${L.counterfactual.if_gift_does_not_arrive}`,basis:L.counterfactual.basis,confidence:L.counterfactual.confidence,sources:L.counterfactual.sources});

  if(L.funder_landscape){ const f=L.funder_landscape; h += `<h2>Funders</h2>${f.known_funders&&f.known_funders.length?`<table><tr><th>Funder</th><th>Note</th></tr>${f.known_funders.map(k=>`<tr><td class="wrap">${esc(k.name)}</td><td class="wrap">${esc(k.note)}${srcs(k.sources)}</td></tr>`).join('')}</table>`:''}`+claim({statement:`Concentration: ${f.concentration_note}\n\nSophisticated funders present: ${f.sophisticated_funders_present||'unknown'}\n\nDepartures: ${f.departures}`,basis:f.basis}); }
  if(L.room_for_funding) h += `<h2>Room for more funding</h2>`+claim({statement:`${L.room_for_funding.verdict}\n\nLast big increase: ${L.room_for_funding.last_big_increase}\n\n${L.room_for_funding.rationale}`,basis:L.room_for_funding.basis,confidence:L.room_for_funding.confidence});
  h += `<h2>Could not establish</h2>${list(L.gaps)}${srcs(L.sources)}`;
  section('field','Field',h);
})();

/* culture */
(function(){

  h += `<h2>Unresolved tensions</h2>${list(C.cultural_tensions)}`;

  h += `<h2>Corpus read</h2><table><tr><th>Source</th><th>Type</th><th>Date</th><th>Why it matters</th></tr>${(C.corpus||[]).map(c=>`<tr><td class="wrap"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a><br><span class="small muted">${esc(c.author_role)}</span></td><td class="small">${esc(c.type)}</td><td class="small">${esc(c.date||'—')}</td><td class="wrap small">${esc(c.why_it_matters)}</td></tr>`).join('')}</table>`;
