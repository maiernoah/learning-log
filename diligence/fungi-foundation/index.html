t about 20 more endangered species, including the Pepper Pot fungus. The Foundation's own Jan 2026 brief argues UK law falls short of the pledge.", "year": 2025, "consequence": "A co-launching government has not made the legal change the pledge asks for. This limits what the pledge can be said to have delivered. The primary government response was not read.", "how_handled": "The Foundation responded with a policy briefing calling for explicit fungal references in law, a useful and candid act of pressure on an ally.", "basis": "evidence", "sources": [{"url": "https://www.mycostories.com/post/uk-government-launches-fungal-conservation-strategy-following-historic-international-pledge", "title": "Mycostories on UK pledge and briefing"}, {"url": "https://assets.ffungi.org/Protecting_and_restoring_the_UK%E2%80%99s_fungi-FF.pdf", "title": "Protecting and restoring the UK's fungi (search snippet)"}]}, {"what": "No self-reported failure anywhere. The 2023, 2024 and 2025 recaps, the impact pages and Schedule O list no lost case, dropped program or missed goal. No independent report of a failed project was found either.", "year": null, "consequence": "An organization with this many stretch goals must have misses. They are simply not reported, so the donor sees only one column from the organization itself.", "how_handled": "Not applicable", "basis": "inference", "sources": [{"url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024", "title": "Highlights from 2024"}, {"url": "https://www.ffungi.org/blog/positive-fungal-news-from-last-year-to-start-this-2026", "title": "2025 recap"}, {"url": "https://www.ffungi.org/blog/2023-recap-a-successful-year-working-for-the-fungi", "title": "2023 recap"}]}], "activity_counts": [{"metric": "Fungal Conservation Pledge signatory countries", "unit": "countries", "level": "outcome", "program": "Fungal Conservation Pledge", "series": [{"year": 2024, "value": 12, "value_text": "12 named including Chile and UK. Oryx's set has Italy and not Germany.", "kind": "actual", "source_url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024"}, {"year": 2025, "value": 13, "value_text": "13, including Ethiopia", "kind": "actual", "source_url": "https://www.ffungi.org/blog/positive-fungal-news-from-last-year-to-start-this-2026"}, {"year": 2026, "value": 14, "value_text": "14 on campaign page; Italy reported committing at COP17", "kind": "actual", "source_url": "https://www.ffungi.org/campaign/fungal-conservation-pledge"}, {"year": 2026, "value": 50, "value_text": "At least 50 by COP17", "kind": "target", "source_url": "https://assets.ffungi.org/Protecting_and_restoring_the_UK%E2%80%99s_fungi-FF.pdf"}], "definition_changes": "'Supported', 'signed' and 'committed' are used loosely. No official list seen.", "trend": "rising", "note": "The only repeated measure that sits near outcome level, and it is soft. Signing a voluntary pledge is not a policy change.", "basis": "evidence"}, {"metric": "Chilean species assessed (fungi and lichens)", "unit": "species", "level": "outcome", "program": "Species assessment", "series": [{"year": 2013, "value": 22, "value_text": "22 fungal species", "kind": "actual", "source_url": "https://ffungi.org/eng/our-impact"}, {"year": 2019, "value": 45, "value_text": "45 in that year's classification, per conservation page", "kind": "actual", "source_url": "https://www.ffungi.org/conservation"}, {"year": 2019, "value": 128, "value_text": "128 fungi and lichens, as reported in the 2022 post and prior scan", "kind": "actual", "source_url": "https://ffungi.org/blog/fungi-foundation-10-cycles-around-the-sun"}, {"year": 2024, "value": 138, "value_text": "138 native species including fungi and lichens", "kind": "actual", "source_url": "https://ffungi.org/eng/our-impact"}], "definition_changes": "Fungi only versus fungi plus lichens; possibly per-process versus cumulative. Unreconciled.", "trend": "mixed", "note": "The rise appears slow from 2019 to 2024 on the 128-to-138 reading. Not verified against Ministry lists. Listing is not protection.", "basis": "evidence"}, {"metric": "Online fungi curriculum enrollments", "unit": "enrollments", "level": "output", "program": "Fungi education curriculum", "series": [{"year": 2023, "value": 4350, "value_text": "4,350 English enrollments, 80 countries", "kind": "actual", "source_url": "https://www.ffungi.org/blog/2023-recap-a-successful-year-working-for-the-fungi"}, {"year": 2024, "value": 6199, "value_text": "6,199 enrollments, 97 countries", "kind": "actual", "source_url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024"}], "definition_changes": "The 2023 count is English only; 2024 may be all languages. An undated page shows 5,100 in 81 countries. No figure was found in the 2025 recap.", "trend": "rising", "note": "Enrollments are not completions, classroom use or learning. No completion data was found.", "basis": "evidence"}, {"metric": "In-person trainees and children reached", "unit": "people", "level": "output", "program": "Education", "series": [{"year": 2023, "value": 200, "value_text": "Over 200 students aged 5 to 15 in New York and New Jersey; about 125 US teachers used grow kit coupons", "kind": "actual", "source_url": "https://www.ffungi.org/blog/2023-recap-a-successful-year-working-for-the-fungi"}, {"year": 2024, "value": 440, "value_text": "Over 90 teachers, professionals and students, plus over 350 children, Chile", "kind": "actual", "source_url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024"}], "definition_changes": "Geography and categories change year to year, so the series is not comparable.", "trend": "insufficient_data", "note": "Small numbers and no measure of learning.", "basis": "evidence"}, {"metric": "Fungal Conservation Tracker coverage", "unit": "countries", "level": "output", "program": "Conservation", "series": [{"year": 2023, "value": 86, "value_text": "86 countries", "kind": "actual", "source_url": "https://www.ffungi.org/blog/2023-recap-a-successful-year-working-for-the-fungi"}, {"year": 2024, "value": 92, "value_text": "92 countries", "kind": "actual", "source_url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024"}], "definition_changes": null, "trend": "rising", "note": "A coverage count. No evidence found of a government or funder using it. Its underlying data could give a real outcome baseline, but no published trend was found.", "basis": "evidence"}, {"metric": "Media items and outlets", "unit": "items/outlets", "level": "output", "program": "Communications", "series": [{"year": 2023, "value": 70, "value_text": "Featured 70 times", "kind": "actual", "source_url": "https://www.ffungi.org/blog/2023-recap-a-successful-year-working-for-the-fungi"}, {"year": 2024, "value": 115, "value_text": "115 outlets, 31 countries", "kind": "actual", "source_url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024"}, {"year": 2025, "value": 45, "value_text": "45 publications, 14 countries", "kind": "actual", "source_url": "https://www.ffungi.org/blog/positive-fungal-news-from-last-year-to-start-this-2026"}], "definition_changes": "'Times featured', 'outlets' and 'publications' are different units.", "trend": "mixed", "note": "The 2024 peak tracks COP16 and the films. Attention, not change.", "basis": "evidence"}, {"metric": "Organizations using 'funga'", "unit": "organizations", "level": "outcome", "program": "3F campaign", "series": [{"year": 2023, "value": 90, "value_text": "Over 90", "kind": "actual", "source_url": "https://www.ffungi.org/blog/2023-recap-a-successful-year-working-for-the-fungi"}], "definition_changes": null, "trend": "insufficient_data", "note": "One data point, no list, no update found in the 2024 or 2025 recaps. A norm-adoption measure worth tracking properly.", "basis": "evidence"}], "programs": [{"program": "Line 4a: single program covering research, conservation, education, exploration and development of fungi", "years": [{"year": 2021, "expenses": 191556, "results_claimed": "Boilerplate mission language only in Part III. $34,555 in grants, recipients unseen. No itemized results in the extract.", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202243199349331904/full", "title": "FY2021 Form 990 (financial extract)"}]}, {"year": 2022, "expenses": 443504, "results_claimed": "Same boilerplate. $112,892 in grants, recipients unseen. Two FY2022 versions exist; the extract's other version shows total expenses of $422,919 rather than $459,336.", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202412229349300126/full", "title": "FY2022 Form 990 (financial extract)"}]}, {"year": 2023, "expenses": 459671, "results_claimed": "Same boilerplate; grants blank in the extract. Blog recap, not the 990, claims Tracker launch, ethical guidelines, Psilocybe stametsii description, possible rediscovery, 4,350 enrollments.", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202443199349303864/full", "title": "FY2023 Form 990 (financial extract)"}, {"url": "https://www.ffungi.org/blog/2023-recap-a-successful-year-working-for-the-fungi", "title": "2023 recap"}]}, {"year": 2024, "expenses": 350354, "results_claimed": "Same boilerplate plus $80,097 in grants, recipients unseen. Schedule O lists 17 'notable achievements', from the pledge launch and curriculum proposal to 115 media outlets. All self-reported, mostly outputs.", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Form 990 and Schedule O (financial extract)"}]}], "cost_per_unit": [], "evidence_quality": "self_reported_no_data"}], "targets": {"publishes_targets": "partly", "summary": "A few campaign goals can fail, such as COP17 adoption and 50 signatories. There is no strategic plan with measures, and no report back against goals was found. The standing conservation goals have no deadlines. Recaps list achievements without comparing them to prior goals.", "examples": [{"goal": "Formal recognition or adoption of the pledge at CBD COP17", "year": "2024 and 2026", "stated": "The 2024 recap names formal adoption at CoP17. The campaign page names recognition at COP17 in Yerevan.", "result": "Open as of 30 Oct 2026, the closing day. No evidence of a decision found.", "sources": [{"url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024", "title": "Highlights from 2024"}, {"url": "https://www.ffungi.org/campaign/fungal-conservation-pledge", "title": "Fungal Conservation Pledge"}]}, {"goal": "At least 50 nations signed by COP17", "year": "2026", "stated": "Foundation brief, Jan 2026 (search snippet)", "result": "Miss on current evidence: about 14 or 15.", "sources": [{"url": "https://assets.ffungi.org/Protecting_and_restoring_the_UK%E2%80%99s_fungi-FF.pdf", "title": "Protecting and restoring the UK's fungi"}]}, {"goal": "CITES resolution and decisions on fungi at CoP20", "year": "2025", "stated": "Jan 2025 paper with John Scanlon asked Parties to submit a draft resolution and Plants Committee decisions.", "result": "Partial hit. Process decisions passed on 5 Dec 2025. No new resolution or listing found. One draft decision was deleted at Canada's request. UK-led.", "sources": [{"url": "https://www.ffungi.org/blog/fundacion-fungi-llama-a-la-cites-a-fortalecer-los-controles-sobre-el-comercio-de-hongos-para-reforzar-la-conservacion-fungica", "title": "Fungi Foundation calls on CITES"}, {"url": "https://www.ecolex.org/details/decision/resolving-the-implementation-of-the-cop12-decision-that-the-convention-applies-to-fungi-e51a7e2a-6f91-47d8-b75a-ec69caeadc2f/", "title": "ECOLEX: Decision 20.248"}]}, {"goal": "Chile curriculum next steps in 2025", "year": "2025", "stated": "2024 recap: under review, next steps expected in 2025.", "result": "Unresolved. The 2025 recap says 'moving toward'. No CNED approval found.", "sources": [{"url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024", "title": "Highlights from 2024"}, {"url": "https://www.ffungi.org/blog/positive-fungal-news-from-last-year-to-start-this-2026", "title": "2025 recap"}]}, {"goal": "Confirm Big Puma identity by DNA; publish Portuguese curriculum 'very soon'", "year": "2023 to 2024", "stated": "2023 recap", "result": "Hits, both delivered in 2024. Small, output-level goals.", "sources": [{"url": "https://www.ffungi.org/blog/2023-recap-a-successful-year-working-for-the-fungi", "title": "2023 recap"}, {"url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024", "title": "Highlights from 2024"}]}, {"goal": "Use the 3Fs as terms; support Rights of Nature; assess extinction risk for fungi on every continent", "year": null, "stated": "Conservation page, undated", "result": "Cannot fail as written; no deadlines.", "sources": [{"url": "https://www.ffungi.org/conservation", "title": "Fungal Conservation page"}]}], "basis": "evidence"}, "dollars_to_change": {"latest": {"year": 2024, "spent": 350354, "summary": "FY2024 US-entity program expense $350,354; total expense $462,022. It funded in whole or part: one co-led diplomatic instrument with no binding force (pledge, significance 2); a curriculum proposal not yet adopted (2); a rediscovery confirmation (1); a museum exhibit (1). 2025 items (CITES, Vienna, UK plan) fall in a year with no filing yet. Chile-side spending is not visible, so the true cost is unknown and probably higher."}, "earliest": {"year": 2021, "spent": 191556, "summary": "FY2021 US-entity program expense $191,556; total $200,323. Main change near this money: IUCN SSC acceptance of the 3F language in Aug 2021 (significance 3, co-lead). That year's work almost certainly rested on Chilean spending and earlier years, so attributing it to FY2021 dollars alone is weak. FY2020 expense was $30,318, too small and too new to reconstruct."}, "north_star": {"defensible": false, "measure": null, "series": [], "limits": "Outcomes are unlike each other, slow, shared with governments and partners, and spread across years. The denominator omits Chilean-entity and in-kind costs. Dollars per signatory or per species listed would be false precision.", "what_would_make_it_possible": "A consolidated US-Chile budget by campaign, plus a tracked measure such as jurisdictions with fungi in binding law or funded recovery plans, each with a documented contribution statement. Even then this would be a portfolio ratio, not an efficiency figure."}, "qualitative_judgment": "About $1.45M of US program spending from FY2021 to FY2024 ($1.66M total expense) bought a small team that punches far above its budget in agenda-setting. It helped move conservation language, and it created the pledge. That is real, cheap field-building for a neglected kingdom. What it has not yet shown is a binding legal change or measured benefit to any fungus attributable to recent money. The best legal win dates to 2012. Near-term results are soft, and government or partner credit is large. The bet is on norms maturing into law. It is a reasonable bet, but still mostly unproven.", "strongest_item": "The Fungal Conservation Pledge, for attribution: Oryx independently credits the Foundation with leading its development. IUCN's 3F acceptance ranks highest in significance among recent items, but credit there is more shared.", "weakest_item": "The National Geographic wildlife-definition claim has no outside support. The Los Cedros song petition has no legal change found. Vienna and the Global Strategy are real events with thin evidence of the Foundation's part.", "basis": "inference"}, "trend": {"change_per_dollar": "insufficient_data", "reporting_direction": "toward_outcomes", "rationale": "Program spending rose from $191,556 (FY2021) to a peak of $459,671 (FY2023), then fell to $350,354 (FY2024). The claimed policy results grew in number between 2021 and 2025: pledge, CITES, Vienna, UK. Yet none has been shown as durable, binding or clearly attributed, and the 2025 items have no filed financials. So more activity at the policy table is visible, but not more verified change per dollar. Significance has stayed at 2 to 3, with attribution generally weakening as more partners and governments enter the field. Reporting moved modestly toward outcomes: the 2023 recap leads with counts and outputs, while the 2025 recap leads with policy claims and gives fewer counts. This shift is partial. Part III has stayed boilerplate in all years, and 2025 language is often soft ('advanced', 'aligned', 'moving toward') with no documents linked. I did not read Schedule O before FY2024.", "basis": "inference"}, "peer_comparables": [{"peer": "Plantlife with the Global Fungal Conservation Network", "outcome": "Global Strategy for Fungal Conservation", "value_text": "Published at COP17; endorsed by 50+ organizations from 30 countries; supports 12 GBF targets. No delivery results yet.", "year": "2026", "sources": [{"url": "https://www.globalfungalconservation.org/", "title": "Global Strategy for Fungal Conservation"}]}, {"peer": "IUCN SSC Fungal Conservation Committee and fungal specialist groups", "outcome": "Global fungal Red List assessments", "value_text": "From 3 in 2003 to nearly 1,000 in 2024. Foundation staff took part in this work but it is a collective result.", "year": "2003 to 2024", "sources": [{"url": "https://www.cambridge.org/core/journals/oryx/article/fungi-gaining-ground-at-recent-cbd-and-iucn-meetings/01866B1C43C9814E4322A0E3E957C078", "title": "Oryx, Mar 2025"}]}, {"peer": "SPUN", "outcome": "Underground Atlas, global mycorrhizal biodiversity map", "value_text": "SPUN claims a 90% conservation gap finding. A new data capability exists; conservation effect not shown. Press release source.", "year": "2025", "sources": [{"url": "https://www.eurekalert.org/news-releases/1091761", "title": "EurekAlert release (search result; specific release not separately read)"}, {"url": "https://envirotecmagazine.com/2025/07/30/world-first-maps-inform-call-for-better-protection-of-underground-fungal-networks/", "title": "Envirotec, 30 Jul 2025"}]}, {"peer": "Natural England (government, not a nonprofit peer)", "outcome": "Threatened Species Recovery Actions", "value_text": "Covers 155 fungi and lichen species in England. Scale comparison for what a state program can do directly.", "year": "2025", "sources": [{"url": "https://naturalengland.blog.gov.uk/2025/10/10/a-landmark-year-for-englands-fungi/", "title": "Natural England, 10 Oct 2025"}]}], "verdict": "In FY2024 the US entity spent $462,022, of which $350,354 was program, and the clearest change it can claim is co-leading a non-binding pledge launched by Chile and the UK at COP16. Oryx independently credits it with developing the pledge, but the pledge missed the formal agenda and has about 14 signatories against the organization's own goal of 50. The 2024 curriculum result is still a proposal, and most other items are films, an exhibit, expeditions and press. Later claims (CITES process decisions, UK plan language, Vienna's law) are mostly confirmed as events but rest largely on the organization's word for its part. The earlier period had one stronger norm win for less money, IUCN's 3F acceptance in 2021 on $200,323, and the only clearly binding, durable change dates to 2012, before this money. No fungus is shown to be better protected because of recent spending. No independent evaluation or cost-per-outcome exists, and Chilean spending is unseen. So I read this as a cheap, credible agenda-setter whose results remain mostly soft and whose reporting overstates at the margins.", "gaps": ["COP17 outcome: no final decision text was available on the closing day. Check whether any decision or preamble names fungi.", "Pledge: no official signatory list or text commitments per government. Whether any signatory changed law or policy because of it is unverified.", "Pledge signatory conflict: Italy is in Oryx's 2024 supporter list but reported as newly committed at COP17. Germany is in the Foundation's list and not Oryx's.", "Chile curriculum: final CNED ruling and whether 'funga' survived. CNED records returned 403.", "Chile species counts: 22, 45, over 80, 128 and 138 are unreconciled against Ministry decrees. I did not count annexes.", "Vienna: LGBl. 45/2025 not read. Foundation's role undocumented.", "UK EIP 2025: exact wording unread because the PDF did not parse. 're-incorporated' and the Foundation's role are untested. The Dec 2025 rejection of species protections is known only from a secondary article.", "CITES: full text of Decisions 20.247 and 20.248 and CoP20 Doc. 101 not read; authorship of SC78 Inf. 27 unknown. CITES and ENB pages returned 403 or were seen as snippets.", "Los Cedros: Ecuador office ruling and appeal outcome not found. My search found only the petition, and the rejection comes from the prior scan.", "National Geographic wildlife definition change: no outside source found.", "Effect on fungi: no population, habitat or enforcement data linked to any recent result. Loyo and gargal recovery plans are at groundwork stage. Size of the National Geographic Society grant unknown.", "Money: US-Chile flows, Schedules F and R, grant recipients, Chilean budget and consolidated program costs unknown. FY2025 and FY2026 financials are not filed or found, so all 2025-2026 outcomes have no matched spend. FY2022 has two versions.", "Possible major funding: a Climate Breakthrough page titled with Furci, Sheldrake and Toby Kiers appeared in search and was not read. It could change the cost picture if it funds this work [speculation].", "Independent evaluation: none found for any program. Education completion or learning data: none found. Tracker use by governments: none found.", "Pre-FY2024 Schedule O text was not in the extract, which limits the claim about reporting direction."], "documents_that_would_close_gaps": ["COP17 final decisions and report (cbd.int), and the COP17 pledge side-event statement from Chile and the UK.", "Official Pledge text and signatory record, with dates, held by Chile, the UK or the Foundation.", "CNED acuerdos on Bases Curriculares 1st to 6th grade and the current Mineduc text, searched for 'funga'.", "Chile Ministry of the Environment classification list, plus the Foundation's species nomination forms.", "Wiener Naturschutzgesetz amendment LGBl. 45/2025 and its explanatory notes.", "UK Environmental Improvement Plan 2025 text, EIP 2023 for comparison, and Defra's Dec 2025 response on Schedule 8 protections.", "CITES CoP20 Doc. 101, SC78 Doc. 75, SC78 Inf. 27 and Decisions 20.247 and 20.248.", "Ecuador SENADI ruling and appeal record in the Los Cedros petition.", "FY2021 to FY2024 Form 990 Schedules F and O in full, FY2025 990, and a consolidated US-Chile budget by campaign.", "Board and funder reports, the 2025 full report linked from the recap post, and any strategic plan with targets.", "Thinkific completion data, plus any before-and-after learning assessment or classroom adoption data.", "Letters or minutes from UK and Chilean officials, and from the Global Strategy authors, describing what the Foundation contributed."], "sources": [{"url": "https://www.cambridge.org/core/journals/oryx/article/fungi-gaining-ground-at-recent-cbd-and-iucn-meetings/01866B1C43C9814E4322A0E3E957C078", "title": "Oryx: Fungi gaining ground at recent CBD and IUCN meetings"}, {"url": "https://naturalengland.blog.gov.uk/2025/10/10/a-landmark-year-for-englands-fungi/", "title": "Natural England: A landmark year for England's fungi"}, {"url": "https://undark.org/2021/08/09/flora-fauna-and-funga/", "title": "Undark: Flora, fauna and funga"}, {"url": "https://iucn.org/sites/default/files/2022-12/statement-3f.pdf", "title": "IUCN SSC statement on Fauna Flora Funga"}, {"url": "https://iucn.org/news/species-survival-commission/202108/rewild-and-iucn-ssc-become-first-global-organizations-call-recognition-fungi-one-three-kingdoms-life-critical-protecting-and-restoring-earth", "title": "IUCN news release, Aug 2021"}, {"url": "https://www.ecolex.org/details/decision/resolving-the-implementation-of-the-cop12-decision-that-the-convention-applies-to-fungi-e51a7e2a-6f91-47d8-b75a-ec69caeadc2f/", "title": "ECOLEX: CITES Decision 20.248"}, {"url": "https://enb.iisd.org/convention-international-trade-endangered-species-wild-fauna-flora-cites-cop20-daily-report-24nov2025", "title": "ENB CITES CoP20 daily report, 24 Nov 2025"}, {"url": "https://www.globalfungalconservation.org/", "title": "Global Strategy for Fungal Conservation"}, {"url": "https://news.mongabay.com/short-article/2026/10/fungi-now-have-a-global-conservation-strategy/", "title": "Mongabay: Fungi now have a global conservation strategy"}, {"url": "https://www.plantlife.org.uk/our-work/global-strategy-for-fungal-conservation", "title": "Plantlife: Global Strategy for Fungal Conservation"}, {"url": "https://www.naturalworldfund.org.uk/cop17-fungi-global-biodiversity-conservation/", "title": "Natural World Fund: COP17 fungi"}, {"url": "https://www.cbc.ca/news/science/cop17-fungi-9.7388560", "title": "CBC: Biologists seek justice for forgotten kingdom of fungi (search result only)"}, {"url": "https://www.cbd.int/article/2026-10-18-06-36-57", "title": "CBD: Spotlight on Yerevan"}, {"url": "https://www.cbd.int/meetings/SBSTTA-28", "title": "CBD: SBSTTA-28 documents"}, {"url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024", "title": "Fungi Foundation: Highlights from 2024"}, {"url": "https://www.ffungi.org/blog/positive-fungal-news-from-last-year-to-start-this-2026", "title": "Fungi Foundation: Positive fungal news (1 Jan 2026)"}, {"url": "https://www.ffungi.org/blog/2023-recap-a-successful-year-working-for-the-fungi", "title": "Fungi Foundation: 2023 recap"}, {"url": "https://ffungi.org/eng/our-impact", "title": "Fungi Foundation: Our impact"}, {"url": "https://www.ffungi.org/conservation", "title": "Fungi Foundation: Fungal Conservation"}, {"url": "https://www.ffungi.org/campaign/fungal-conservation-pledge", "title": "Fungi Foundation: Fungal Conservation Pledge"}, {"url": "https://www.ffungi.org/blog/fundacion-fungi-llama-a-la-cites-a-fortalecer-los-controles-sobre-el-comercio-de-hongos-para-reforzar-la-conservacion-fungica", "title": "Fungi Foundation: Calls on CITES (27 Jan 2025)"}, {"url": "https://assets.ffungi.org/Protecting_and_restoring_the_UK%E2%80%99s_fungi-FF.pdf", "title": "Fungi Foundation: Protecting and restoring the UK's fungi, Jan 2026 (search snippet)"}, {"url": "https://www.mycostories.com/post/uk-government-launches-fungal-conservation-strategy-following-historic-international-pledge", "title": "Mycostories: UK and the pledge"}, {"url": "https://www.mycostories.com/post/new-ethnomycology-guidelines-framework-dedicated-to-human-fungal-knowledge-systems", "title": "Mycostories: Ethnomycology guidelines"}, {"url": "https://eldesconcierto.cl/2024/08/14/al-fin-la-funga-podria-llegar-a-las-salas-de-clases", "title": "El Desconcierto, 14 Aug 2024"}, {"url": "https://www.rewild.org/lost-species/found", "title": "Re:wild: Lost Species Found"}, {"url": "https://www.bcn.cl/leychile/navegar?idNorma=1221953", "title": "Chile: 20th classification process decree"}, {"url": "https://clasificacionespecies.mma.gob.cl/wp-content/uploads/2026/03/DS_54_2025_MMA_oficializa_20_RCE-DO_5_3_2026.pdf", "title": "Chile: DS 54/2025"}, {"url": "https://ucrisportal.univie.ac.at/en/persons/irmgard-greilhuber/", "title": "Irmgard Greilhuber profile, University of Vienna"}, {"url": "https://www.gov.uk/government/publications/the-environmental-improvement-plan-2025-and-the-kunming-montreal-global-biodiversity-framework/the-environmental-improvement-plan-2025-and-the-kunming-montreal-global-biodiversity-framework", "title": "UK: EIP 2025 and the GBF"}, {"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Form 990 (financial extract)"}, {"url": "https://projects.propublica.org/nonprofits/organizations/851478153", "title": "ProPublica Nonprofit Explorer"}]}, "landscape": {"field_definition": "[inference, from the 990 and the organization's reports] Getting fungi recognized and protected as a distinct kingdom in conservation law and policy. \"Fungi\" here means wild fungal species and habitats, not food, medicine or psychedelics. Geography has two tiers: international venues (UN CBD, CITES, IUCN) and national policy work, mainly Chile and the UK; plus field documentation and education rooted in Chile, with work reported in Ecuador, Peru, India and Mongolia. Methods: policy advocacy and government partnership, expeditions and a fungarium, a curriculum and films, and ethnomycology with Indigenous and local communities. Its direct beneficiaries are policymakers, researchers, educators and some communities; it is not a direct-service provider. It is not a lab-science or mapping organization at scale. That role sits closer to SPUN.", "problem_trend": {"direction": "growing", "rationale": "Threat: growing, but measured weakly. [evidence] IUCN's March 2025 update brought the fungal count on the Red List past 1,000 and cited deforestation, farming and urban expansion. A later count reports about 1,300 assessed and at least 411 at risk. Search-snippet threat counts: 279 species from agricultural and urban expansion, 198 from deforestation, 91 from nitrogen and ammonia pollution. [inference] These are first-time assessments, not a time series. They show a large threat, not a measured rate of worsening. Only a small share of an estimated 2.5 million species has been assessed, and about 155,000 are named.\n\nNeglect: large, and narrowing in policy. [evidence] A study of 14,566 conservation projects from 1992 to 2016, totaling about $1.963 billion, gave fungi and algae combined under 0.2%. It is seen through news coverage and its data end in 2016. No fungi-only funding figure was found. [evidence] Recent policy movement: the Pledge at 14 countries (Sept 2026), Brazil's first national threatened-fungi list with 24 species, 'funga' in Vienna's nature conservation law (reported by the organization), and the Global Strategy for Fungal Conservation launched at COP17 on 21 Oct 2026.\n\nNet: [inference] the biological threat is likely growing while the policy gap is closing from a very low base. COP17 outcomes on fungi are not yet established.", "basis": "inference", "sources": [{"url": "https://iucn.org/press-release/202503/first-1000-fungi-iucn-red-list-reveal-growing-threats-iucn-red-list", "title": "IUCN: First 1,000 fungi on IUCN Red List (March 2025)"}, {"url": "https://en.wikipedia.org/wiki/Global_Fungal_Red_List_Initiative", "title": "Global Fungal Red List Initiative, Wikipedia (secondary)"}, {"url": "https://marcellus.in/story/wildlife-conservation-funds-biased-against-smaller-species-study/", "title": "Wildlife conservation funds biased against smaller species (news coverage of the study)"}, {"url": "https://theecologist.org/2026/sep/17/scientists-push-fungi-protection", "title": "The Ecologist: Scientists push for fungi protection (17 Sep 2026)"}, {"url": "https://www.ffungi.org/blog/positive-fungal-news-from-last-year-to-start-this-2026", "title": "Fungi Foundation: Positive fungal news from last year (2026)"}, {"url": "https://ua.news/en/world/na-cop17-u-virmeniyi-prezentuvali-strategiiu-zakhistu-gribiv-mongabay", "title": "UA.News, citing Mongabay: strategy presented at COP17"}]}, "peers": [{"name": "Society for the Protection of Underground Networks (SPUN)", "ein": "87-4391116", "website": "https://www.spun.earth", "relationship": "direct_competitor", "how_they_differ": "[evidence] Maps mycorrhizal networks, funds researchers (92 grants in 43 countries as of Aug 2024, per Wikipedia), and has an Underground Advocates program. It frames fungi around climate and carbon. The subject leads with species recognition, Chile fieldwork, ethnomycology and policy language. [evidence] Furci sits on SPUN's advisory board per Fungi Foundation pages, so it is also a partner. [inference] It is the closest competitor for large environmental donors.", "scale_note": "[evidence] FY2024 revenue $9,205,437, expenses $3,700,264, net assets $7,843,352. That is about 8x the subject's expenses and 96x its net assets. FY2023 revenue was $325,324.", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/874391116", "title": "ProPublica: SPUN"}, {"url": "https://en.wikipedia.org/wiki/Society_for_the_Protection_of_Underground_Networks", "title": "SPUN, Wikipedia (secondary)"}, {"url": "https://www.currentconservation.org/?p=41388", "title": "Current Conservation: Integrating fungi in policy (snippet)"}]}, {"name": "Fungal Diversity Survey (FunDiS)", "ein": "82-3721471", "website": "https://fundis.org", "relationship": "complement", "how_they_differ": "[evidence] Formerly the North American Mycoflora Project. [inference] Community-science documentation centered on North America, not international policy. It is the closest size match, and a warning on volatility.", "scale_note": "[evidence] Revenue $568,765 in FY2024, then $130,574 in FY2025. Expenses $501,534, then $156,409. Net assets $84,457 in FY2025. Impala estimates over 70% government grants in 2024 (aggregator).", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/823721471", "title": "ProPublica: Fungal Diversity Survey Inc"}, {"url": "https://impala.digital/public/profiles/82-3721471", "title": "Impala: FunDiS (secondary)"}, {"url": "https://en.wikipedia.org/wiki/Fungal_Diversity_Survey", "title": "Fungal Diversity Survey, Wikipedia (secondary)"}]}, {"name": "Re:wild", "ein": "26-2887967", "website": "https://www.rewild.org", "relationship": "larger_incumbent", "how_they_differ": "[evidence] All-taxa conservation organization, not fungi-focused. Its Search for Lost Species worked with the Fungi Foundation on the big puma fungus rediscovery, and it has committed to mycologically inclusive language. Furci has a Re:wild profile. [inference] It amplifies the subject's agenda and does not replace its fungal expertise.", "scale_note": "[evidence] FYE June 2025 revenue $75,177,871, expenses $80,899,305, net assets $61,225,950. ProPublica lists it as 'Rewild'.", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/262887967", "title": "ProPublica: Rewild"}, {"url": "https://rewild.org/press/first-ever-lost-fungi-species-found", "title": "Re:wild: first lost fungi species found"}, {"url": "https://rewild.org/get-to-know/fungi", "title": "Re:wild: fungi"}]}, {"name": "Plantlife (Secretariat, Global Strategy for Fungal Conservation)", "ein": null, "website": "https://www.plantlife.org.uk", "relationship": "coalition_partner", "how_they_differ": "[evidence] UK-based plant and fungi conservation group and secretariat for the Strategy, working with the Global Fungal Conservation Network (73 members from 45 organizations in 30 countries, per IMA Fungus, May 2026). The Strategy is described as the 'operational mechanism' for the Pledge's political commitment. [evidence] The Fungi Foundation says it contributed to drafting targets. [inference] This coalition is the main alternative home for implementation work.", "scale_note": "No evidence found: I did not check UK Charity Commission figures. No US EIN found, and I did not search for a US friends-of entity. No funder of the Strategy is named on Plantlife's page.", "sources": [{"url": "https://www.plantlife.org.uk/our-work/global-strategy-for-fungal-conservation", "title": "Plantlife: Global Strategy for Fungal Conservation"}, {"url": "https://imafungus.pensoft.net/news/1245", "title": "IMA Fungus: Putting Fungi on the Agenda (26 May 2026)"}]}, {"name": "IUCN SSC Fungal Conservation Committee and Global Fungal Red List Initiative", "ein": null, "website": "https://redlist.info", "relationship": "coalition_partner", "how_they_differ": "[evidence] Scientific assessment and specialist-group structure inside IUCN, with national and thematic fungal groups. Greg Mueller, named with this committee, led the Strategy's drafting. It produces the threat evidence the subject uses in advocacy. It is not a fundraising competitor in any visible way [inference].", "scale_note": "No evidence found on a fungal-specific budget. About 1,300 fungi assessed per secondary reporting.", "sources": [{"url": "https://cambridge.org/core/product/01866B1C43C9814E4322A0E3E957C078/core-reader", "title": "Barron, Oryx: Fungi gaining ground at recent CBD and IUCN meetings (2025)"}, {"url": "https://redlist.info/", "title": "The Global Fungal Red List Initiative"}, {"url": "https://www.plantlife.org.uk/our-work/global-strategy-for-fungal-conservation", "title": "Plantlife: Global Strategy for Fungal Conservation"}]}, {"name": "Mycological Society of America", "ein": "16-6077141", "website": null, "relationship": "complement", "how_they_differ": "[inference] Professional scientific society, not a conservation advocacy group. Included as a scale benchmark and possible channel to scientists. Its program detail was not reviewed.", "scale_note": "[evidence] FY2024 revenue $327,543, expenses $484,865, net assets $2,468,624. It spends about the same as the subject but holds 30x the net assets.", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/166077141", "title": "ProPublica: Mycological Society of America"}]}, {"name": "North American Mycological Association", "ein": "31-6066799", "website": "https://namyco.org", "relationship": "complement", "how_they_differ": "[inference] Amateur and member-based association in North America, formed in 1959 per CauseIQ. It does not compete in international policy. It is a volunteer base for citizen science rather than a substitute.", "scale_note": "[evidence] FYE June 2025 revenue $90,348, expenses $84,259, net assets $353,974.", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/316066799", "title": "ProPublica: North American Mycological Assn"}, {"url": "https://causeiq.com/organizations/north-american-mycological-assn,316066799", "title": "CauseIQ: NAMA (secondary)"}]}], "differentiation": {"position": "leader", "rationale": "Leader in one narrow lane: fungal recognition in international policy language and government pledges. It is not the leader in fungal science or in funding.\n\nFor:\n- [evidence] An independent Oryx piece (Barron, March 2025) says the Fungi Foundation and the 3Fs Initiative led development of the Pledge. Chile and the UK launched it at COP16 'in collaboration with' the Foundation.\n- [evidence] The Ecologist (Sept 2026) names the Foundation as leading the 3F campaign. Re:wild and IUCN SSC adopted mycologically inclusive language.\n- [evidence, self-reported] Vienna law, Chile's curriculum proposal, the Fungal Conservation Tracker covering 92 countries.\n- [inference] I found no other organization combining a national fungal policy record in Chile, an international policy role, and field and ethnomycology work.\n\nAgainst:\n- [evidence] The Strategy, the operational follow-on, is run through Plantlife and the Global Fungal Conservation Network, with Mueller leading. The Mongabay syndication I read does not mention the Foundation.\n- [evidence] SPUN spends 8x as much and has its own policy-training program.\n- [inference] Attribution is shared. Governments signed the Pledge, and no independent evaluation of the Foundation's causal role was found. Many achievement claims come from its own reports.\n- [inference] Field and education work in Chile is differentiated by geography, but I found no comparison of its quality or reach with other Chilean groups.", "basis": "inference", "confidence": 0.6}, "counterfactual": {"if_org_disappeared": "Separate two cases: losing the US charity versus losing the brand.\n\nIf the whole brand vanished:\n- [inference] The Pledge would survive on paper, since governments launched it. It would likely lose its main civil-society driver. The Foundation's Pledge page shows no separate secretariat or governing body, though a Chile-UK binational platform is reported.\n- [inference] Chilean work would be the hardest loss: the loyo conservation plan work, curriculum advocacy, the planned Environment Ministry MOU, and the Santiago exhibit relationship. No named Chilean substitute was identified, but I did not search for Chilean fungal groups in depth.\n- [inference] The FFCL fungarium would need a new institutional home. No evidence found of a succession plan.\n- [inference] Ethnomycology work with Mazatec, Mapuche, Kichwa and other communities, including ethics guidelines, has no evident substitute among the peers reviewed.\n\nIf only the US entity vanished: [inference] the Chilean body may continue, smaller. Its 2020 post says the US chapter exists to make funding easier to obtain. How much of Chile's budget depends on it is unknown.\n\nGlobal momentum would not collapse. [evidence] The Strategy, SPUN's advocates, IUCN groups and Plantlife exist independently. The field would be slower and less visible, not gone.", "who_absorbs": "[inference] Partial absorption, and no single heir. Plantlife and the Global Fungal Conservation Network: global strategy and implementation. SPUN: policy training and legal tools, and it has the money. IUCN SSC: assessments and listing. Re:wild: lost-species expeditions and communications. The Chile and UK governments: the Pledge, if they choose. No one evident: Chile-specific fieldwork, ethnomycology, and curriculum.", "if_gift_does_not_arrive": "[evidence] Net assets were $82,068 at end of FY2024, about 2.1 months of expenses, after three deficits totaling $290,009. The FY2024 deficit was $54,205. [inference] At that deficit, FY2024 reserves last about 1.5 years, before any FY2025 results. I have no FY2025 filing.\n\n[evidence] The 990 reports one program line, with no breakdown by project, and no public program budget was found. So I cannot honestly name the exact activity a gift would fund.\n\n[inference] A gift under about $25,000, the reported median grant, likely changes one deliverable at most. A gift of $100,000 or more is about 22% of annual expenses or more, and its absence would likely show up in staffing or contractor capacity.\n\n[speculation] First cuts would likely be discretionary: expeditions, films, and transfers such as the $80,097 FY2024 grants line. Post-COP17 follow-up may also thin out. Ask for the FY2026-27 budget to test this.", "basis": "inference", "confidence": 0.5, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153", "title": "ProPublica: Fungi Foundation Inc"}, {"url": "https://www.ffungi.org/campaign/fungal-conservation-pledge", "title": "Fungal Conservation Pledge"}, {"url": "https://www.ffungi.org/blog/positive-fungal-news-from-last-year-to-start-this-2026", "title": "Positive fungal news (2026)"}, {"url": "https://www.ffungi.org/blog/fungi-foundation-global", "title": "Fungi Foundation global (16 Sep 2020)"}, {"url": "https://www.plantlife.org.uk/our-work/global-strategy-for-fungal-conservation", "title": "Plantlife: Global Strategy for Fungal Conservation"}, {"url": "https://www.ffungi.org/blog/national-geographic-society-supports-groundbreaking-project-in-chile", "title": "NatGeo Society supports project in Chile"}]}, "right_unit": {"verdict": "Fund this organization if the donor's theory is that recognition in policy drives fungal conservation, or if they care about Chile and ethnomycology. Keep the first gift moderate and pair it with audit and reporting conditions. If the donor wants measured conservation outcomes or the largest science output, this is the wrong unit.", "alternatives": ["SPUN: for mapping science and data-driven protection of underground ecosystems. It is well funded, so the marginal dollar may matter less.", "Plantlife / Global Fungal Conservation Network: for implementing the Global Strategy. Confirm funding needs directly, since no funder or resourcing plan is public.", "IUCN SSC Fungal Conservation Committee / Global Fungal Red List: for threat assessments that underpin listing and policy. Confirm the giving route.", "FunDiS: for North American community-science documentation. Revenue fell sharply in FY2025, so a gift may matter more, but stability needs checking.", "Re:wild's fungal or lost-species work: only with a restricted gift. Fungi are a small part of an $81M organization."], "rationale": "[evidence] The Foundation's visible edge is agenda-setting, and that phase produced results through 2024-2026. [evidence] The Strategy is described as the mechanism that turns political commitment into action, and it runs through Plantlife and the Network. [inference] The field may now be shifting from recognition to implementation, the lane where this organization's advantage is least proven. Its Chile plans and national work are the likely bridge. Ask how it sees its role after COP17.\n\n[inference] A small, neglected field and thin budgets mean a modest gift has more leverage here than at SPUN or Re:wild. The same fragility raises execution risk. No impact-per-dollar comparison across these options exists, as far as I could find.", "basis": "inference"}, "funder_landscape": {"known_funders": [{"name": "Samueli Foundation", "note": "[evidence, secondary] $75,000, general operations, 2024: 18.4% of FY2024 revenue. An earlier CauseIQ snippet shows $50,000. [inference] This looks like an increase, but the year of the earlier figure is unclear. Impala shows $225K with no period stated, possibly cumulative.", "sources": [{"url": "https://www.causeiq.com/organizations/fungi-foundation,851478153/", "title": "CauseIQ profile (secondary)"}, {"url": "https://impala.digital/public/profiles/85-1478153/overview", "title": "Impala profile (secondary; its percentages do not reconcile)"}]}, {"name": "Fidelity Investments Charitable Gift Fund", "note": "[evidence, secondary] $50,050, 2024. [inference] A donor-advised fund, so the true donor or donors are not visible.", "sources": [{"url": "https://www.causeiq.com/organizations/fungi-foundation,851478153/", "title": "CauseIQ profile (secondary)"}]}, {"name": "Every.org", "note": "[evidence, secondary] $45,140, general support, 2024; an earlier snippet shows $38,078. [inference] A pass-through for small online donors, not an institutional decision.", "sources": [{"url": "https://www.causeiq.com/organizations/fungi-foundation,851478153/", "title": "CauseIQ profile (secondary)"}]}, {"name": "Aurora Foundation; Jewish Communal Fund", "note": "[evidence, secondary] $10,297 and $10,000. CauseIQ's year labels are unclear.", "sources": [{"url": "https://www.causeiq.com/organizations/fungi-foundation,851478153/", "title": "CauseIQ profile (secondary)"}]}, {"name": "WWW Foundation; Social Impact Fund", "note": "[evidence, secondary] WWW Foundation $15,000 general operating in an earlier CauseIQ snippet. Social Impact Fund $125K on Impala, with no period stated. Neither is confirmed against filings.", "sources": [{"url": "https://www.causeiq.com/organizations/fungi-foundation,851478153/", "title": "CauseIQ profile (secondary)"}, {"url": "https://impala.digital/public/profiles/85-1478153/overview", "title": "Impala profile (secondary)"}]}, {"name": "National Geographic Society", "note": "[evidence, self-reported] Supports the first fungal conservation plan project in Chile, focused on loyo. Announcement dated May 2026 per search result. Amount and receiving entity were not found. Furci also received a NatGeo conservation leadership award.", "sources": [{"url": "https://www.ffungi.org/blog/national-geographic-society-supports-groundbreaking-project-in-chile", "title": "NatGeo Society supports project in Chile"}, {"url": "https://www.ffungi.org/blog/fungal-advocate-receives-natgeos-leadership-conservation-award", "title": "Fungal advocate receives NatGeo's leadership conservation award"}]}, {"name": "Mohamed bin Zayed Species Conservation Fund", "note": "[evidence] $20,000 for threatened fungi in Chile, awarded 30 Jan 2015, to the pre-US organization. No evidence of more recent support.", "sources": [{"url": "https://www.speciesconservation.org/small-grant/loyo/10227", "title": "MBZ Species Conservation Fund: Loyo case study"}]}, {"name": "Peer comparison: SPUN's named funders", "note": "[evidence] ADM Capital Foundation, Allen Family Philanthropies, Arcadia, Bezos Earth Fund, Founders Pledge, Grantham Environmental Trust, Mark and Amy Tercek Foundation, Mighty Arrow Family Foundation, NoVo Foundation, Quadrature Climate Foundation, Rivian Foundation, Roger Sant, Schmidt Family Foundation. No amounts on the page, apart from a $3M Schmidt grant announced by SPUN.", "sources": [{"url": "https://www.spun.earth/about/how-we-are-funded", "title": "SPUN: How we are funded"}]}], "concentration_note": "[inference, using CauseIQ figures and FY2024 revenue of $407,817] Samueli 18.4%, Fidelity 12.3%, Every.org 11.1%: 41.8% from three sources, two of which are giving platforms. Contributions were 99% of revenue [evidence]. Impala reports 15 funders in total, 7 grants in 2024, a $25K median and a $75K largest grant (aggregator; its percentages do not reconcile with revenue).", "sophisticated_funders_present": "Mostly absent, based on what I could see. [evidence] National Geographic Society is the one recognized institutional name with recent support, and it is project-specific. [evidence] Large environmental funders are visibly present at SPUN. [inference] Those funders know the field, and I found none listed for this organization. That may reflect fit or size rather than a negative judgment. No evidence found that any of them reviewed it. Individual and family giving appears to be the core, but Schedule B donor names are not public.", "departures": "No evidence found of a named funder quietly stopping. [evidence] Revenue fell from $542,058 in FY2021 to $348,314 in FY2023. [speculation] FY2021 may include one or more non-repeating gifts. WWW Foundation no longer appears among CauseIQ's listed grants, but four grants remain unlisted, so this does not show a departure. Comparing Schedule B-free funder 990-PFs year by year would test this.", "basis": "inference"}, "room_for_funding": {"verdict": "Yes, for about $100,000 to $250,000 a year, staged. A gift above about $500,000 exceeds one year's expenses and the evidence does not show readiness for it. There is real room to fund the existing program and rebuild reserves, but controls need work first.", "last_big_increase": "[evidence] Revenue rose from $60,660 in FY2020 to $542,058 in FY2021, with only $200,323 spent, leaving net assets of $372,077. Program spending then rose from $191,556 to $443,504 in FY2022 and $459,671 in FY2023. Revenue did not hold, so net assets fell to $82,068 by FY2024. [inference] The money went to program growth rather than overhead or reserves, and was spent over three years without replacement income. Program spending fell to $350,354 in FY2024, a 24% cut, which shows the expansion was not sustained.", "rationale": "Evidence of absorption:\n- [evidence] Spending has already been $538,181 (FY2023). The organization ran at about $76,000 more than FY2024 levels recently. So $100,000 or so simply restores recent capacity.\n- [evidence] Six months of FY2024 expenses is $231,011, about $149,000 above current net assets. [inference] The first $150,000 could rebuild reserves productively, though the donor should decide whether it wants that.\n- [evidence] Outputs in 2024-2025 include the Pledge, curriculum work, films and the India chapter, on self-reported data. 14 people across 8 countries (Jan 2026).\n\nReasons for caution:\n- [evidence] No separate or consolidated audit on the FY2024 990. Only 2 employees. Personnel is 18.3% of expenses (about $84,000). [inference] Most spending goes through contractors or Chile, and I could not trace it.\n- [evidence] The FY2024 990 answers No on chapters, related organizations and lobbying. Yet the same filing lists developing an India Chapter, the Chile entity shares a chief executive and brand, and the organization campaigns toward governments. [inference] These answers may be technically correct, but ask the preparer and the board to explain them.\n- [evidence] Management rose from $15,832 to $70,493 and fundraising from $0 to $41,175 between FY2022 and FY2024. [inference] Probably a mix of real capacity and better cost allocation. Fundraising capacity is still thin.\n- [evidence] Top pay fell from $91,035 (FY2022) to $58,336 (FY2024). [inference] Either a real cut under strain or a shift of pay elsewhere. Unknown which.\n\nData note: [inference] The pipeline's FY2022 row ($343,638 / $422,919) appears to be the superseded filing. Only the $413,399 / $459,336 version reconciles net assets from FY2021 to FY2023. Using it, the FY2022 deficit is $45,937 and the three-year average margin is about -26%, not -29.4%. The red flag stands.\n\nForm of gift: [inference] Pay directly rather than via Every.org. Fund general operations in tranches, with a required independent audit, a consolidated US-Chile budget and a stated post-COP17 plan. Multi-year matters more than size.", "basis": "inference", "confidence": 0.6}, "gaps": ["COP17 outcome. The conference ends today (30 Oct 2026). I could not establish whether any final decision names fungi or funga. CBC's report returned 403, and no final decision text was available.", "Who the $80,097 FY2024 grants went to, and how much reaches Chile. Schedule F and any Schedule I were not readable. ProPublica's page failed to load the content. The extract lists only Schedule O.", "Consolidated budget, Chilean entity financials, and Chilean legal registration. No evidence found.", "FY2025 financials. No FY2025 990 was seen for the subject, though FunDiS already shows one. Current reserves are unknown.", "Independent evaluation of the Foundation's outcomes or of its causal share in the Pledge and national policy wins. No evidence found. Most achievement data is self-reported.", "Any criticism of the Foundation by peers, scientists or communities. One targeted search found none. That is thin evidence, and I did not interview anyone.", "Full funder list and amounts. Schedule B names are not public and four CauseIQ-listed grants are hidden. Impala's dollar and percentage figures conflict. No funder 990-PF was read directly.", "Amount and recipient entity of the National Geographic Society support (May 2026).", "Fungi-only share of conservation funding. The under-0.2% figure combines fungi and algae, ends in 2016, and was seen only in news coverage.", "Plantlife's finances and the Strategy's funders. Scale of IUCN fungal work. Chilean peers and the MOTH / NYU partnership were not analyzed as peers.", "Pledge count. Sources give 13 (Jan 2026) and 14 (Sept 2026), and Italy's status varies: a backer in Oryx in 2025, and a COP17 commitment per Natural World Fund (30 Oct 2026). The names of all signatories were not confirmed."], "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153", "title": "ProPublica: Fungi Foundation Inc"}, {"url": "https://projects.propublica.org/nonprofits/organizations/874391116", "title": "ProPublica: SPUN"}, {"url": "https://projects.propublica.org/nonprofits/organizations/823721471", "title": "ProPublica: Fungal Diversity Survey Inc"}, {"url": "https://projects.propublica.org/nonprofits/organizations/262887967", "title": "ProPublica: Rewild"}, {"url": "https://projects.propublica.org/nonprofits/organizations/166077141", "title": "ProPublica: Mycological Society of America"}, {"url": "https://projects.propublica.org/nonprofits/organizations/316066799", "title": "ProPublica: North American Mycological Assn"}, {"url": "https://cambridge.org/core/product/01866B1C43C9814E4322A0E3E957C078/core-reader", "title": "Barron, Oryx: Fungi gaining ground at recent CBD and IUCN meetings (2025)"}, {"url": "https://theecologist.org/2026/sep/17/scientists-push-fungi-protection", "title": "The Ecologist: Scientists push for fungi protection (17 Sep 2026)"}, {"url": "https://imafungus.pensoft.net/news/1245", "title": "IMA Fungus: Putting Fungi on the Agenda (26 May 2026)"}, {"url": "https://www.plantlife.org.uk/our-work/global-strategy-for-fungal-conservation", "title": "Plantlife: Global Strategy for Fungal Conservation"}, {"url": "https://ua.news/en/world/na-cop17-u-virmeniyi-prezentuvali-strategiiu-zakhistu-gribiv-mongabay", "title": "UA.News, citing Mongabay: strategy presented at COP17"}, {"url": "https://www.naturalworldfund.org.uk/cop17-fungi-global-biodiversity-conservation/", "title": "Natural World Fund: COP17, bringing fungi into conservation (30 Oct 2026)"}, {"url": "https://armenpress.am/en/article/1263735", "title": "Armenpress: COP17, 14 decisions adopted in first week"}, {"url": "https://iucn.org/press-release/202503/first-1000-fungi-iucn-red-list-reveal-growing-threats-iucn-red-list", "title": "IUCN: First 1,000 fungi on the Red List (March 2025)"}, {"url": "https://marcellus.in/story/wildlife-conservation-funds-biased-against-smaller-species-study/", "title": "News coverage of conservation funding bias study"}, {"url": "https://www.spun.earth/about/how-we-are-funded", "title": "SPUN: How we are funded"}, {"url": "https://www.causeiq.com/organizations/fungi-foundation,851478153/", "title": "CauseIQ: Fungi Foundation (secondary)"}, {"url": "https://impala.digital/public/profiles/85-1478153/overview", "title": "Impala: Fungi Foundation (secondary)"}, {"url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024", "title": "Fungi Foundation: Another Fungal Year, 2024"}, {"url": "https://www.ffungi.org/blog/positive-fungal-news-from-last-year-to-start-this-2026", "title": "Fungi Foundation: Positive fungal news (2026)"}, {"url": "https://www.ffungi.org/campaign/fungal-conservation-pledge", "title": "Fungi Foundation: Fungal Conservation Pledge"}, {"url": "https://www.ffungi.org/blog/national-geographic-society-supports-groundbreaking-project-in-chile", "title": "Fungi Foundation: NatGeo Society supports project in Chile"}, {"url": "https://rewild.org/press/first-ever-lost-fungi-species-found", "title": "Re:wild: first lost fungi species found"}, {"url": "https://www.speciesconservation.org/small-grant/loyo/10227", "title": "MBZ Species Conservation Fund: Loyo case study"}]}, "culture": {"corpus": [{"author_role": "Founder and CEO (Giuliana Furci), long-form podcast interview", "title": "Tim Ferriss Show transcript: Giuliana Furci", "type": "podcast", "date": "2021-08-05", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/", "why_it_matters": "Longest primary source read. Contains the success definition, the Chile law account, the funding-scarcity statement and a live reply to a $50,000 gift offer."}, {"author_role": "Founder and CEO, Philosophia journal conversation", "title": "Mycorrhizal Movements: A Conversation with Giuliana Furci (philoSOPHIA 15(1))", "type": "interview", "date": "2025", "url": "https://research.gold.ac.uk/id/eprint/39373", "why_it_matters": "The most reflective source on consent and on refusing the psilocybin path. Abstract page was read. The PDF would not parse, so its content comes from search snippets only."}, {"author_role": "Founder and CEO, podcast interview", "title": "Brainforest Cafe Ep. 21: Bridging Fungi Science and Mazatec Cultural Heritage Initiatives", "type": "podcast", "date": "2024-08-26", "url": "https://mckenna.academy/mka-podcast/bridging-fungi-science-and-mazatec-cultural-heritage-initiatives/", "why_it_matters": "The only source found with concrete fundraising numbers ($25,000 archive budget, $250,000 museum goal) and a description of shared project management with a Mazatec family. Auto-generated transcript."}, {"author_role": "Founder and CEO, local press interview", "title": "Telluride Mushroom Festival: Giuliana Furci (Telluride Inside)", "type": "interview", "date": "2024-08-04", "url": "https://tellurideinside.com/2024/08/telluride-mushroom-festival-guiliana-furci-everywhere-you-want-to-be.html", "why_it_matters": "The only public statement found on where sustaining funders come from."}, {"author_role": "Founder and CEO, press interview", "title": "Green Matters interview with Giuliana Furci", "type": "interview", "date": "2024-04-25", "url": "https://www.greenmatters.com/earth-day/giuliana-furci-fungi", "why_it_matters": "States strategy in sequence: delimit language, then help institutions adopt it. Names the Chile law as the proudest achievement."}, {"author_role": "Founder and CEO, podcast (Atmos, The Nature Of)", "title": "Giuliana Furci Is Your Guide to the Enchanting World of Fungi", "type": "podcast", "date": "2026-03-31", "url": "https://atmos.earth/podcast/giuliana-furci-is-your-guide-to-the-enchanting-world-of-fungi/", "why_it_matters": "Most recent long-form statement. Links fungi to habitat protection and describes advocates working for decades before public attention arrived."}, {"author_role": "Reporter Catherine Early quoting Furci and the organization", "title": "Scientists push for fungi protection (The Ecologist)", "type": "other", "date": "2026-09-17", "url": "https://theecologist.org/2026/sep/17/scientists-push-fungi-protection", "why_it_matters": "Current statement that fungi are less neglected than before, which sits awkwardly with the scarcity story. Sympathetic piece with no critics quoted."}, {"author_role": "Organization staff", "title": "Fungi Foundation global", "type": "blog", "date": "2020-09-16", "url": "https://www.ffungi.org/blog/fungi-foundation-global", "why_it_matters": "States openly that the US chapter exists to reach funding. The origin document of the two-layer structure."}, {"author_role": "Director of Communications (Alejandra Olguín)", "title": "Fungi Foundation: 10 cycles around the sun", "type": "blog", "date": "2022-09-20", "url": "https://ffungi.org/blog/fungi-foundation-10-cycles-around-the-sun", "why_it_matters": "The organization's own origin story. Names no funder and no setback across ten years."}, {"author_role": "Organization staff and volunteer", "title": "Another fungal year: highlights from 2024", "type": "blog", "date": null, "url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024", "why_it_matters": "Closest thing to an annual report for 2024. No funder thanks, finances or setbacks. Date is implied by its content, not confirmed."}, {"author_role": "Organization staff and volunteer", "title": "Positive fungal news from last year to start this 2026", "type": "blog", "date": "2026-01-01", "url": "https://www.ffungi.org/blog/positive-fungal-news-from-last-year-to-start-this-2026", "why_it_matters": "Closest thing to an annual report for 2025. Same pattern: achievements only, written in a year after a third straight deficit filing."}, {"author_role": "Organization staff, quoting Programs Director Daniela Torres", "title": "National Geographic Society supports groundbreaking project in Chile", "type": "blog", "date": "2026-05-04", "url": "https://www.ffungi.org/blog/national-geographic-society-supports-groundbreaking-project-in-chile", "why_it_matters": "The rare named funder thanks, and a non-founder staff member speaking publicly for a program."}, {"author_role": "Organization staff and volunteer", "title": "Los Cedros cloud forest: a legal first for nature's creative rights", "type": "blog", "date": "2024-10-29", "url": "https://www.ffungi.org/blog/los-cedros-cloud-forest-a-legal-first-for-natures-creative-rights", "why_it_matters": "Shows the appetite for novel legal framing, and the gap between the petitioner (MOTH Collective) and the organization's 990 claim of achievement."}, {"author_role": "Organization campaign page", "title": "Fungal Conservation Pledge", "type": "org_page", "date": null, "url": "https://www.ffungi.org/campaign/fungal-conservation-pledge", "why_it_matters": "Flagship policy instrument. States the 14-country count and describes the organization as a collaborator with two governments."}, {"author_role": "Organization campaign page", "title": "Fauna Flora Funga campaign", "type": "org_page", "date": null, "url": "https://www.ffungi.org/campaign/fauna-flora-funga", "why_it_matters": "Core theory of change in operating form. Asks people to add a word and sign a petition. No metrics."}, {"author_role": "Organization staff and volunteer", "title": "Flora Fauna Funga: 2023 updates", "type": "blog", "date": "2023-08-07", "url": "https://www.ffungi.org/blog/flora-fauna-funga-2023-updates", "why_it_matters": "Shows how progress is counted: organizations adopting a term."}, {"author_role": "Organization page", "title": "Our impact", "type": "org_page", "date": null, "url": "https://ffungi.org/eng/our-impact", "why_it_matters": "The self-account of impact. Milestones and counts, no methodology or baseline. Gives both 2010 and 2012 as starting dates."}, {"author_role": "Organization pages", "title": "The Fungi Foundation Team", "type": "org_page", "date": null, "url": "https://www.ffungi.org/team", "why_it_matters": "Shows tenure, policy hires, and overlapping affiliations. Also reveals what the organization counts as worth saying about staff."}, {"author_role": "Organization page", "title": "Volunteer With Us (no careers page found; only the volunteer page is linked)", "type": "org_page", "date": null, "url": "https://www.ffungi.org/volunteer-with-us", "why_it_matters": "Says the organization would not be where it is without volunteers and interns, and is not taking more. No paid job listing was found."}, {"author_role": "Organization page about its founder", "title": "Meet Giuliana", "type": "org_page", "date": null, "url": "https://www.ffungi.org/meet-giuliana", "why_it_matters": "How the organization assigns credit between founder and institution."}, {"author_role": "Organization page", "title": "Fungi Foundation in the press", "type": "org_page", "date": null, "url": "https://www.ffungi.org/press", "why_it_matters": "A self-curated record of public visibility. A count of headlines shows who is named."}, {"author_role": "Organization page, with Vision and FAQ read alongside", "title": "Vision & Mission", "type": "org_page", "date": null, "url": "https://www.ffungi.org/vision-mission", "why_it_matters": "The formal statement. It contains no values statement and no theory of change."}, {"author_role": "Employee review sites", "title": "Employee review search: nothing found for this organization", "type": "employee_reviews", "date": null, "url": "https://www.causeiq.com/organizations/fungi-foundation,851478153/", "why_it_matters": "One search returned no reviews for this organization, only unrelated employers. Absence means little with 2 US employees. The URL is the only on-target result of that search, not a review source."}], "verbatim_phrases": [{"phrase": "we measure our success not in revenue of money in the bank, but of durable change", "context": "Furci, Ferriss transcript, 5 Aug 2021. The organization's clearest statement of what success means.", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"phrase": "language creates reality", "context": "Furci, Ferriss transcript, 2021, arguing that fungi must be named in policy. The line also appears in the 2025 philoSOPHIA conversation per search snippet.", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"phrase": "when a law is open to comment, anything can happen", "context": "Furci, 2021, on why the 2010 opening of Chile's environmental law mattered.", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"phrase": "absolutely no funding existed at all, and still hardly exists for anything fungal in terms of policy", "context": "Furci, 2021, on founding the organization.", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"phrase": "We've never had support like that before", "context": "Furci, 2021, replying on air to Tim Ferriss's offer of $50,000.", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"phrase": "I hope to make you proud and we will make durable change for the fungi", "context": "Furci, 2021, same exchange. Accountability to the donor and service to the fungi in one sentence.", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"phrase": "bringing justice to the fungi", "context": "Furci, 2021. The moral framing of the work.", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"phrase": "the Noah's Ark of fungal solutions for the world", "context": "Furci, 2021, describing the Elders program's mapping of traditional fungal uses.", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"phrase": "to facilitate access to funding and collaboration with other relevant stakeholders", "context": "Organization post, 16 Sep 2020, on why the US chapter opened.", "url": "https://www.ffungi.org/blog/fungi-foundation-global"}, {"phrase": "to the fungi, their habitats and the people who depend on them", "context": "Recurring commitment line, 2020 through 2024. Donors and staff are not in it.", "url": "https://www.ffungi.org/blog/fungi-foundation-global"}, {"phrase": "The Fungi Foundation has found its most sustaining funders through the Telluride Mushroom Festival", "context": "Furci, Telluride Inside, 4 Aug 2024. Fundraising is rooted in a community of enthusiasts.", "url": "https://tellurideinside.com/2024/08/telluride-mushroom-festival-guiliana-furci-everywhere-you-want-to-be.html"}, {"phrase": "funga must be considered in the equation at the same level as flora and fauna", "context": "Furci, 4 Aug 2024. The strongest 'must' found. It is about parity.", "url": "https://tellurideinside.com/2024/08/telluride-mushroom-festival-guiliana-furci-everywhere-you-want-to-be.html"}, {"phrase": "children should be taught as much about fungi as they are taught about plants and animals", "context": "Furci, 2021. The education goal, again stated as parity.", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"phrase": "we aim to raise $250,000 to build the museum with permanent facilities for these exhibits", "context": "Furci, Brainforest Cafe, 26 Aug 2024, on the Mazatec archive. Auto-generated transcript.", "url": "https://mckenna.academy/mka-podcast/bridging-fungi-science-and-mazatec-cultural-heritage-initiatives/"}, {"phrase": "The Fungi foundation manages this project together with the family", "context": "Furci, 26 Aug 2024, on the Mazatec archive and the Garcia family. Auto-generated transcript.", "url": "https://mckenna.academy/mka-podcast/bridging-fungi-science-and-mazatec-cultural-heritage-initiatives/"}, {"phrase": "sharing information that had been obtained without informed consent", "context": "Furci, 26 Aug 2024, on what the team had to face in writing ethnomycological guidelines.", "url": "https://mckenna.academy/mka-podcast/bridging-fungi-science-and-mazatec-cultural-heritage-initiatives/"}, {"phrase": "We decided we would never go down that route.", "context": "Furci, philoSOPHIA 2025, seen only in a search snippet. Refers to the wide publicizing of Mazatec psilocybin use. Check against the PDF before reuse.", "url": "https://research.gold.ac.uk/id/eprint/39373"}, {"phrase": "means fungi are no longer as neglected as they once were", "context": "Furci on the 3F proposal, The Ecologist, 17 Sep 2026.", "url": "https://theecologist.org/2026/sep/17/scientists-push-fungi-protection"}, {"phrase": "An entire kingdom one step closer to being seen, valued, and protected.", "context": "Organization statement on 'funga' entering the Cambridge Dictionary, quoted in The Ecologist, 17 Sep 2026.", "url": "https://theecologist.org/2026/sep/17/scientists-push-fungi-protection"}, {"phrase": "help us spread the mycelial message", "context": "Team page, undated, describing volunteers.", "url": "https://www.ffungi.org/team"}, {"phrase": "would not be where it is today without the help of our volunteers and interns", "context": "Volunteer page, undated. The page also says no volunteers are being recruited.", "url": "https://www.ffungi.org/volunteer-with-us"}, {"phrase": "We envision a healthy planet in which fungi are recognized as the interconnectors of nature.", "context": "Vision statement, undated. The end state is stated as recognition.", "url": "https://www.ffungi.org/vision-mission"}, {"phrase": "we aim to promote the development of a Conservation Plan and the recognition of the harvester profession", "context": "Daniela Torres, Programs Director, 4 May 2026, on the loyo project.", "url": "https://www.ffungi.org/blog/national-geographic-society-supports-groundbreaking-project-in-chile"}], "espoused_values": ["Fungal parity: fungi should sit at the same level as flora and fauna in law, language and school. [evidence: Furci 2021, 2024]", "Durable change over money as the measure of success. [evidence: Furci 2021]", "Commitment to 'the fungi, their habitats and the people who depend on them'. [evidence: organization 2020 onward]", "Informed consent and respect for knowledge holders in ethnomycology. [evidence: Ethnomycology Ethical Guidelines, 2023, updated 2025, per search results; Furci 2024]", "Being first and pioneering, stated repeatedly as identity. [evidence: 2020, 2022, team page]", "Collaboration: with governments, NGOs, NYU, Re:wild and families. [evidence: pledge page, campaign page, Brainforest 2024]", "Free public education. [evidence: curriculum described as free on the bio page and in Green Matters 2024]", "Note: the organization publishes no values statement and no theory of change on its Vision & Mission page. [evidence: page read 30 Oct 2026]"], "operating_values": [{"value": "Recognition is the working goal.", "evidence": "The vision is stated as fungi being 'recognized'. Progress is counted in organizations adopting a term (over 70 in 2023), signatory countries (14) and a dictionary entry. No habitat or population outcome is reported on the impact page.", "basis": "inference", "sources": [{"url": "https://www.ffungi.org/vision-mission", "title": "Vision & Mission"}, {"url": "https://www.ffungi.org/blog/flora-fauna-funga-2023-updates", "title": "Flora Fauna Funga: 2023 updates"}, {"url": "https://ffungi.org/eng/our-impact", "title": "Our impact"}]}, {"value": "Program breadth comes before balance-sheet strength.", "evidence": "FY2024 Schedule O lists 17 achievements across expeditions on three fronts, policy, film, education, a museum exhibit and an India chapter. That year's US expenses were $462,022 against revenue of $407,817, the third straight deficit. Net assets fell from $372,077 to $82,068. No reserve policy or deficit explanation was found.", "basis": "inference", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Form 990 and Schedule O (via public-record scan)"}]}, {"value": "Policy and communications capacity is a priority.", "evidence": "The team page lists a UK Policy Lead, an International Policy Lead who was a former Chilean CBD negotiator, a climate and 3F coordinator, a Director of Communications and a Communications Assistant, out of 15 people. These are five of the 15 named roles. Pay and hours for each are not visible.", "basis": "evidence", "sources": [{"url": "https://www.ffungi.org/team", "title": "Team page"}]}, {"value": "Staff loyalty and long tenure, on flexible arrangements.", "evidence": "Moreno since 2013, Torres since 2015, Cortez Chau since 2021, Olguín since 2022. Yet the 990 aggregators show 2 US employees, and several team members hold outside academic or consulting roles. This suggests a flexible, multi-affiliated model. Actual pay terms are unknown.", "basis": "inference", "sources": [{"url": "https://www.ffungi.org/team", "title": "Team page"}, {"url": "https://www.causeiq.com/organizations/fungi-foundation,851478153/", "title": "CauseIQ profile"}]}, {"value": "Consent is taken seriously enough to cost something, at least in one program.", "evidence": "The organization wrote guidelines in 2023 and updated them in 2025 per search results. Furci says the archive material was meant to stay in the region and describes shared management with the family. The museum opening is self-reported, and no community voice was read independently.", "basis": "inference", "sources": [{"url": "https://mckenna.academy/mka-podcast/bridging-fungi-science-and-mazatec-cultural-heritage-initiatives/", "title": "Brainforest Cafe, 2024"}, {"url": "https://www.ffungi.org/campaign/ethnomycology-ethical-guidelines", "title": "Ethnomycology Ethical Guidelines (search result)"}, {"url": "https://www.ffungi.org/blog/positive-fungal-news-from-last-year-to-start-this-2026", "title": "Positive fungal news, 2026"}]}, {"value": "Good news is public. Finances and setbacks are not.", "evidence": "The 2022, 2024 and 2025 retrospectives thank no funders and report no setback. Financial statements are available on written request per Schedule O. No annual report was found.", "basis": "evidence", "sources": [{"url": "https://ffungi.org/blog/fungi-foundation-10-cycles-around-the-sun", "title": "10 cycles, 2022"}, {"url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024", "title": "Highlights 2024"}, {"url": "https://www.ffungi.org/blog/positive-fungal-news-from-last-year-to-start-this-2026", "title": "Positive fungal news, 2026"}, {"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Schedule O (via scan)"}]}], "money_stance": {"summary": "Relational and project-specific, with a scarcity story about the field and near silence about its own finances. Money is openly instrumental: the US chapter exists 'to facilitate access to funding'. Furci states that success is not 'money in the bank'. In the one recorded exchange, Furci receives a $50,000 offer with visible gratitude and a promise of results. No embarrassment or sense of entitlement appears in what was read. Concrete numbers appear only for a discrete project: $25,000 for archive work, $250,000 for a museum. No public statement was found on overall budget, reserves, deficits or cost of operating, despite three straight deficits. Inference: the organization treats fundraising as an event in a relationship, not as a managed function with public reporting. Rests on about ten sources, and private donor communications were not seen.", "basis": "inference", "confidence": 0.65, "sources": [{"url": "https://www.ffungi.org/blog/fungi-foundation-global", "title": "Fungi Foundation global, 2020"}, {"url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/", "title": "Ferriss transcript, 2021"}, {"url": "https://mckenna.academy/mka-podcast/bridging-fungi-science-and-mazatec-cultural-heritage-initiatives/", "title": "Brainforest Cafe, 2024"}, {"url": "https://projects.propublica.org/nonprofits/organizations/851478153/", "title": "ProPublica filings (via scan)"}]}, "donor_stance": {"summary": "Donors appear as fellow travelers met through community and media, not as an audience owed a public account. Furci says the most sustaining funders came through the Telluride Mushroom Festival. Paul Stamets, a board member, made the first archive donation. Ferriss offered $50,000 on air. The FAQ says only that gifts 'are used to support our campaigns' and lists donor categories including corporate sponsor and 'symbiotic organization'. Public thanks is rare; the National Geographic Society post is the clear exception, and that is an institutional funder. No flattery of donors and no donor-recognition list was found. A donor should expect warmth and access, and should not expect standard reporting without asking. That last point is inference.", "basis": "inference", "confidence": 0.6, "sources": [{"url
