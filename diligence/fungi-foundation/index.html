<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dossier</title>
<style>
/* ===== Noah's Weblog house style (exhibits) v2 =====
   Matches noahmaier.net: white page, Times for reading, Verdana for
   controls, blue underlined links, two-tone rules, gray beveled buttons. */
:root {
  --page: #ffffff;
  --ink: #000000;
  --ink-soft: #2b2b2b;
  --link: #0000ee;
  --visited: #551a8b;
  --active: #ff0000;
  --lo: #999999;          /* rule, border, axis */
  --hi: #e2e2e2;          /* rule highlight, gridline */
  --tint: #f2f2f2;        /* callout and table-header fill */
  --field: #6e6e6e;       /* input border */
  --btn: #c0c0c0;         /* button face */
  --btn-face: #dfdfdf;
  --btn-lo: #808080;
  --btn-dark: #0a0a0a;
  --new: #cc0000;
  /* data colors, in order: classic HTML named colors */
  --c1: #000080;  /* navy */
  --c2: #800000;  /* maroon */
  --c3: #008080;  /* teal */
  --c4: #808000;  /* olive (marks only; too light for text) */
  --c5: #800080;  /* purple */
  --c6: #008000;  /* green */
  --serif: "Times New Roman", Times, serif;
  --sans: Verdana, Geneva, Tahoma, sans-serif;
  --mono: "Courier New", Courier, monospace;
  --measure: 42.75rem;    /* one column width (684px): text, boxes, questions, tables, figures */
}
* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; padding: 10px 16px 32px; background: var(--page); color: var(--ink);
       font: 18px/1.45 var(--serif); -webkit-text-size-adjust: 100%; }
.page { max-width: 1020px; }
/* Text, boxes, questions, tables and figures share one column width, so their left and
   right edges line up. Add class="wide" only to something that genuinely needs more room. */
main p, main ul, main ol, main dl, main blockquote, main table, main fieldset, main figure,
main details, main .box, main h2, main h3, main .view > *, .prose { max-width: var(--measure); }
.wide { max-width: none !important; }
a { color: var(--link); } a:visited { color: var(--visited); } a:active { color: var(--active); }
:focus-visible { outline: 2px dotted var(--ink); outline-offset: 2px; }

h1 { font-size: 2.3em; line-height: 1.1; margin: 0.35em 0 0.15em; }
h2 { font-size: 1em; font-weight: bold; margin: 1.6em 0 0.7em; padding-bottom: 2px;
     border-bottom: 1px solid var(--lo); }
h3 { font-size: 1.15em; line-height: 1.25; margin: 1.2em 0 0.3em; }
p { margin: 0 0 0.8em; }
.dek { font-style: italic; margin: 0 0 0.5em; }
.nav { font: 13px/1.6 var(--sans); margin: 0; }
hr { border: 0; border-top: 1px solid var(--lo); border-bottom: 1px solid var(--hi);
     height: 0; margin: 10px 0 14px; }
code, pre, kbd { font-family: var(--mono); font-size: 0.9em; }

/* controls and small text use Verdana */
label, legend, button, input, select, textarea, table, figcaption, output, .ui, .meta {
  font-family: var(--sans); }
.ui, .meta, figcaption { font-size: 13px; line-height: 1.5; }
.meta { color: var(--ink-soft); }
p.meta { margin: 6px 0 12px; }

fieldset { border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi);
           margin: 0 0 16px; padding: 10px 12px 12px; min-width: 0; }
/* The legend sits inside the box as its first line, so long legends wrap cleanly
   instead of breaking through the border. */
legend { float: left; width: 100%; padding: 0; margin: 0 0 8px; font-size: 13px; font-weight: bold; }
legend + * { clear: both; }
label { font-size: 13px; }
.choices { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.choices label { display: inline-flex; align-items: center; gap: 5px; }
input[type=radio], input[type=checkbox], input[type=range] { accent-color: var(--c1); }

button {
  font-size: 13px; line-height: 1.2; color: #000; background: var(--btn);
  border: 0; border-radius: 0; padding: 6px 12px; cursor: pointer;
  box-shadow: inset -1px -1px var(--btn-dark), inset 1px 1px #fff,
              inset -2px -2px var(--btn-lo), inset 2px 2px var(--btn-face);
}
button:active, button[aria-pressed="true"] {
  box-shadow: inset 1px 1px var(--btn-dark), inset -1px -1px #fff,
              inset 2px 2px var(--btn-lo), inset -2px -2px var(--btn-face);
  padding: 7px 11px 5px 13px;
}
button:disabled { color: var(--btn-lo); text-shadow: 1px 1px #fff; cursor: default; }
button.primary { font-weight: bold; }

input[type=text], input[type=number], input[type=search], input[type=email],
select, textarea {
  font-size: 14px; color: var(--ink); background: #fff; border: 1px solid var(--field);
  border-radius: 0; box-shadow: inset 1px 1px 0 #b4b4b4; padding: 4px 6px;
}

table { border-collapse: collapse; font-size: 13px; line-height: 1.4; }
main table { width: 100%; }
th, td { border: 1px solid var(--lo); padding: 4px 8px; text-align: left; vertical-align: top; }
th { background: var(--tint); }

.box { background: var(--tint); box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi);
       padding: 8px 10px; margin: 0 0 1em; font: 13px/1.5 var(--sans); }
.result { font-size: 1.15em; }
.result strong { font-variant-numeric: tabular-nums; }

.meter { height: 16px; background: #fff; border: 1px solid var(--field);
         box-shadow: inset 1px 1px 0 #b4b4b4; }
.meter > div { height: 100%; width: 0; background: var(--c1); }

footer address { font-style: normal; font-size: 0.85em; }

@media (max-width: 780px) { body { font-size: 17px; padding: 8px 16px 28px; } h1 { font-size: 1.8em; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media print { .nav { display: none; } }

/* ===== Dossier: page-specific rules, house variables only ===== */
.shell { display: grid; grid-template-columns: minmax(0, 1fr) 256px; gap: 32px; align-items: start; }
.shell > main { min-width: 0; }
.menu { position: sticky; top: 10px; }
.menu fieldset { margin: 0 0 12px; }
.menu ol { margin: 0; padding-left: 22px; font: 13px/1.7 var(--sans); }
.menu ol a[aria-current="true"] { color: var(--ink); font-weight: bold; text-decoration: none; }
.menu .n { color: var(--ink-soft); font-size: 11px; margin-left: 6px; }
.menu .meta { margin: 8px 0 0; font-size: 11px; }
.filter .opts label { display: block; margin: 2px 0; }
section.page { display: none; }
section.page.active { display: block; }
.notice { font: 13px/1.5 var(--sans); background: var(--tint); box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); padding: 8px 10px; margin: 0 0 14px; max-width: none; }
.notice strong { font-weight: bold; }
h1 { font-size: 2.1em; }
.sub { font: 13px/1.5 var(--sans); color: var(--ink-soft); margin: 0 0 14px; }
.lede { font-size: 1.15em; line-height: 1.4; margin: 10px 0 14px; }
.prose p { margin: 0 0 0.8em; }
.pre { white-space: pre-wrap; }
.muted { color: var(--ink-soft); }
.small { font: 13px/1.5 var(--sans); }
.row { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; }
.empty { border: 1px dashed var(--lo); padding: 10px 12px; font: 13px/1.5 var(--sans); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: none; }
.two h3:first-child { margin-top: 0.6em; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 16px; font: 13px/1.5 var(--sans); margin: 8px 0 12px; }
.kv div:nth-child(odd) { color: var(--ink-soft); }
/* tags */
.b { display: inline-block; font: 11px/1.4 var(--sans); padding: 0 4px; border: 1px solid var(--lo); color: var(--ink-soft); vertical-align: middle; white-space: nowrap; background: #fff; }
.b.evidence { color: var(--c1); border-color: var(--c1); }
.b.inference { color: var(--c3); border-color: var(--c3); }
.b.speculation { color: var(--c2); border-color: var(--c2); }
.b.red { color: var(--c2); border-color: var(--c2); }
.b.amber { color: var(--ink); border-color: var(--c4); border-left-width: 4px; }
.b.green { color: var(--c6); border-color: var(--c6); }
.b.na { color: var(--ink-soft); }
.light { display: inline-block; width: 10px; height: 10px; vertical-align: middle; margin-right: 6px; background: var(--lo); border: 1px solid var(--field); }
.light.red { background: var(--c2); } .light.amber { background: var(--c4); } .light.green { background: var(--c6); } .light.na { background: var(--hi); }
.conf { font: 11px/1.4 var(--sans); color: var(--ink-soft); }
/* claims */
.claim { border-left: 3px solid var(--lo); padding: 4px 0 4px 12px; margin: 10px 0; }
.claim[data-basis="evidence"] { border-left-color: var(--c1); }
.claim[data-basis="inference"] { border-left-color: var(--c3); }
.claim[data-basis="speculation"] { border-left-color: var(--c2); }
.claim .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 2px; font-size: 0.95em; }
.claim .body { white-space: pre-line; }
.claim .src { font: 12px/1.5 var(--sans); color: var(--ink-soft); margin-top: 3px; }
.hidden-by-filter { display: none !important; }
.redact { background: var(--ink); color: transparent; cursor: pointer; }
.redact:hover, .redact:focus, .redact.open { background: transparent; color: inherit; }
/* tables */
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.wrap { white-space: normal; }
tr.flag-red td:first-child { color: var(--c2); }
/* cover */
.cover-grid { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 24px; align-items: start; max-width: none; }
.stamp { border: 3px double var(--ink); padding: 10px 14px; display: inline-block; min-width: 180px; }
.stamp .n { font-size: 2.6em; line-height: 1; font-weight: bold; font-variant-numeric: tabular-nums; }
.stamp .g { font: 13px/1.4 var(--sans); margin-top: 4px; }
.stamp .l { font: 11px/1.4 var(--sans); color: var(--ink-soft); margin-top: 6px; }
.failure { background: var(--tint); box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); padding: 12px 14px; margin: 14px 0; }
.failure .t { font: 12px/1.4 var(--sans); color: var(--ink-soft); margin-bottom: 6px; }
.failure .f { font-size: 1.25em; line-height: 1.3; }
.failure .m { margin-top: 8px; font-size: 0.95em; }
.boot { display: none; }
/* score bars */
.bars { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 6px 12px; align-items: center; max-width: var(--measure); font: 13px/1.5 var(--sans); }
.bars .track { height: 14px; background: #fff; border: 1px solid var(--field); box-shadow: inset 1px 1px 0 #b4b4b4; }
.bars .fill { height: 100%; background: var(--c1); }
.bars .v { font-variant-numeric: tabular-nums; }
/* chart */
.chart-wrap { margin: 8px 0; position: relative; max-width: none; }
.chart-wrap svg { width: 100%; height: auto; display: block; font-family: var(--sans); }
.legend { display: flex; gap: 16px; font: 12px/1.5 var(--sans); margin: 4px 0 0; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
.tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--field); padding: 3px 6px; font: 12px/1.4 var(--sans); display: none; white-space: nowrap; z-index: 3; }
/* ratio boxes */
.ratios { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin: 8px 0; max-width: none; }
.ratio { border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi); padding: 8px 10px; }
.ratio.red { border-left: 4px solid var(--c2); } .ratio.amber { border-left: 4px solid var(--c4); }
.ratio .l { font: 12px/1.4 var(--sans); min-height: 2.8em; }
.ratio .v { font-size: 1.6em; line-height: 1.1; font-weight: bold; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
.ratio .v small { font: 12px var(--sans); font-weight: normal; margin-left: 3px; }
.ratio .f { font: 11px/1.4 var(--sans); color: var(--ink-soft); }
.ratio .why { font: 12px/1.45 var(--sans); margin-top: 6px; }
.range { position: relative; height: 16px; margin: 2px 0; }
.range .tr { position: absolute; left: 0; right: 0; top: 7px; height: 1px; background: var(--lo); }
.range .band { position: absolute; top: 4px; height: 7px; background: var(--tint); border: 1px solid var(--lo); }
.range .med { position: absolute; top: 2px; width: 1px; height: 12px; background: var(--ink); }
.range .me { position: absolute; top: 3px; width: 9px; height: 9px; background: var(--c1); margin-left: -4px; }
/* scenarios */
.quad { display: grid; grid-template-columns: auto 1fr 1fr; grid-template-rows: auto 1fr 1fr auto; gap: 6px; max-width: none; margin: 12px 0; }
.quad .ax { font: 12px/1.4 var(--sans); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px; }
.quad .ax.y { writing-mode: vertical-rl; transform: rotate(180deg); max-height: 420px; overflow: hidden; }
.q { text-align: left; min-height: 120px; display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; font: 13px/1.4 var(--sans); }
.q .nm { font: 1.1em/1.25 var(--serif); }
.q .qd { font-size: 11px; color: var(--ink-soft); }
.q .tag { font-size: 11px; font-weight: bold; color: var(--c2); }
.q .rd { margin-top: auto; font-size: 11px; color: var(--ink-soft); }
.scen-detail { border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi); padding: 10px 12px 12px; margin: 0 0 16px; }
.dots { letter-spacing: 1px; color: var(--c1); }
.dots .off { color: var(--hi); }
/* expanders */
details { border: 1px solid var(--lo); margin: 8px 0; }
summary { cursor: pointer; padding: 8px 10px; list-style: none; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
summary::-webkit-details-marker { display: none; }
summary .r { font: bold 13px var(--sans); color: var(--c1); }
summary .fm { }
summary .pr { font: 12px/1.4 var(--sans); color: var(--ink-soft); white-space: nowrap; }
details[open] summary { border-bottom: 1px solid var(--lo); background: var(--tint); }
details .in { padding: 6px 12px 12px 48px; }
.chain li { font-size: 0.9em; }
.q-status { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--hi); }
.q-status .qq { font-weight: bold; margin-bottom: 2px; }
.q-status .aa { }
.statusline { font: 0.85em/1.5 var(--serif); margin-top: 24px; }
.statusline span + span::before { content: " · "; }
button.b { font: 12px var(--sans); padding: 5px 10px; }
@media (max-width: 780px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .menu { position: static; }
  .cover-grid, .two { grid-template-columns: 1fr; }
  .quad { grid-template-columns: 1fr; grid-template-rows: auto; }
  .quad .ax { display: none; }
  .quad .q { grid-column: auto !important; grid-row: auto !important; }
}
@media print {
  .nav, .menu, .statusline, #print-brief, .notice { display: none !important; }
  .shell { display: block; }
  section.page { display: none !important; } section.page#sec-brief { display: block !important; }
  body { font-size: 12px; } h1 { font-size: 1.7em; } .lede { font-size: 1.05em; }
  .cover-grid { grid-template-columns: 1fr 160px; }
  a { color: var(--ink); text-decoration: none; }
}

/* ===== polish pass: same palette and type, finer rhythm ===== */
.quotes { margin: 6px 0 0; padding-left: 18px; font-size: 0.92em; }
.quotes li { margin: 0 0 4px; }
body { line-height: 1.5; }
.page { max-width: 1040px; }
header h1 { font-size: 2.2em; letter-spacing: -0.01em; margin-bottom: 0.1em; }
header .dek { font-size: 0.95em; color: var(--ink-soft); }
.notice { padding: 9px 12px; line-height: 1.55; border-left: 3px solid var(--lo); box-shadow: none; }
.shell { gap: 40px; }
.shell > main > section > h1 { font-size: 1.75em; margin: 0.2em 0 0.1em; }
.sub { margin: 0 0 18px; }
h2 { font-size: 0.85em; letter-spacing: 0.02em; color: var(--ink-soft); margin: 2em 0 0.8em; padding-bottom: 3px; }
h3 { font-size: 1.05em; margin: 1.3em 0 0.35em; }
.prose, .lede, .pre, .claim .body, .failure, details .in p { max-width: var(--measure); }
.lede { font-size: 1.2em; line-height: 1.42; }
/* tables: horizontal rules only, numbers aligned, tinted head */
table { font-size: 12.5px; line-height: 1.45; margin: 6px 0 10px; }
main table { max-width: none; }
td.wrap { min-width: 9em; }
th, td { border: 0; border-bottom: 1px solid var(--hi); padding: 6px 10px 6px 0; }
th { border-bottom: 1px solid var(--lo); background: transparent; font-weight: bold; color: var(--ink-soft); }
tr:last-child td { border-bottom: 1px solid var(--lo); }
/* health panel on the cover */
.health { border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi); padding: 12px 14px 10px; font: 12.5px/1.45 var(--sans); }
.health .n { font: bold 3em/1 var(--serif); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.health .n small { font: 13px var(--sans); color: var(--ink-soft); margin-left: 6px; letter-spacing: 0; }
.health .g { margin: 4px 0 10px; color: var(--ink-soft); }
.health table { margin: 0; font-size: 12px; }
.health td { padding: 3px 0; border-bottom: 1px solid var(--hi); }
.health td.num { padding-left: 10px; }
.health tr:last-child td { border-bottom: 0; }
.health .bar { height: 5px; background: var(--hi); margin-top: 3px; }
.health .bar > i { display: block; height: 100%; background: var(--c1); }
.stamp { display: none; }
.failure { padding: 14px 16px; margin: 18px 0; border-left: 3px solid var(--c2); box-shadow: none; }
.failure .f { font-size: 1.3em; }
.kv { gap: 4px 18px; margin: 12px 0 16px; }
/* claims */
.claim { padding: 2px 0 2px 12px; margin: 12px 0; }
.claim .head { font: 12px/1.5 var(--sans); gap: 6px; }
.b { font-size: 10.5px; padding: 0 5px; }
/* ratio cards */
.ratios { gap: 12px; }
.ratio { padding: 10px 12px 10px; background: #fff; }
.ratio .l { font-size: 12px; color: var(--ink-soft); min-height: 2.6em; }
.ratio .v { font-size: 1.75em; margin: 6px 0 2px; }
.ratio .why { color: var(--ink); }
/* scenario tiles as panels, not buttons */
.quad { gap: 8px; }
button.q, button.q:active, button.q[aria-pressed="true"] { background: #fff; color: var(--ink); border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--hi); padding: 12px 14px; }
button.q:hover { border-color: var(--field); }
button.q[aria-pressed="true"] { border-color: var(--c1); box-shadow: inset 3px 0 0 var(--c1), inset 1px 1px 0 var(--hi); }
.q .nm { font-size: 1.15em; }
.q .qd { font-size: 10.5px; }
.scen-detail { padding: 14px 16px 16px; }
/* expanders */
details { border: 0; border-top: 1px solid var(--hi); margin: 0; }
details:last-of-type { border-bottom: 1px solid var(--hi); }
summary { padding: 10px 4px; grid-template-columns: 28px minmax(0, 1fr) auto; }
summary .r { color: var(--c1); }
summary .fm { font-size: 1.05em; }
details[open] summary { background: transparent; border-bottom: 0; }
details .in { padding: 0 4px 14px 32px; }
/* score bars */
.bars { gap: 7px 14px; }
.bars .track { height: 9px; box-shadow: none; border-color: var(--lo); }
/* contents */
.menu fieldset { padding: 10px 12px 10px; }
.menu ol { line-height: 1.8; }
.menu .n { font-size: 10.5px; }
/* footer */
.statusline { line-height: 1.55; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="brand-name">Dossier</h1>
    <p class="dek" id="brand-sub"></p>
    <p class="nav" id="topnav"></p>
    <hr>
  </header>
  <p class="notice" id="stripe"><span id="stripe-l"></span> <span id="stripe-r"></span></p>
  <div class="shell">
    <main id="main"></main>
    <aside class="menu" aria-label="Contents">
      <fieldset><legend>Contents</legend><ol id="nav"></ol></fieldset>
      <fieldset class="filter"><legend>Show claims tagged</legend>
        <div class="opts">
          <label><input type="radio" name="basis" value="3" checked> evidence, inference, speculation</label>
          <label><input type="radio" name="basis" value="2"> evidence and inference</label>
          <label><input type="radio" name="basis" value="1"> evidence only</label>
        </div>
      </fieldset>
      <p class="meta" id="meta"></p>
    </aside>
  </div>
  <footer>
    <hr>
    <address class="statusline" id="status"></address>
  </footer>
</div>
<script>

nce] Fungi Foundation Inc is a 501(c)(3), with exemption issued July 2020 (ProPublica). Its FAQ says it is \"registered in the State of New York\". I did not check the New York Charities Bureau registry directly.\n- Chilean entity. [evidence] The brand began in Chile. Third-party biographies date Fundación Fungi to 2012. A 16 Sep 2020 post by the organization says the Chilean NGO opened a US chapter, \"Fungi Foundation, Inc\", to make funding easier to obtain. The founding-year 2020 in this record is the US entity's. The brand's is 2012.\n- Separate boards. [evidence] The board page lists a US board and a Chile board. Giuliana Furci chairs the Chile board and is the paid chief executive of the US entity.\n- Other sites. [evidence] The website says its global sites are regional branches or local affiliates that are \"separate entities\". It names none of them.\n- Control. [inference] No evidence found of a formal parent-subsidiary link in either direction. The practical link is shared leadership and brand, resting on the board page and the 990 officer lists.\n- US-to-Chile money flow. Not established. I could not read Schedule F, Schedule R, or Schedule O. ProPublica's filing views did not render, its XML returned 403, and the organization's PDFs were unreadable with my tools. One aggregator reports $80,097 of grants inside $350,354 of FY2024 program expense, without recipients. [inference] Much of this likely funds work in Chile. [speculation] The $80,097 may be the transfer to the Chilean entity. Check Schedules F and R of the FY2024 990 first.", "affiliated_entities": [{"name": "Fundación Fungi (also seen as Fundación Científica Fungi; Chile)", "ein": null, "relationship": "[evidence] Original Chilean organization under the same brand, with its own board chaired by Giuliana Furci. Furci's 2024 CV, seen as a search snippet, lists Executive Director of \"Fungi Foundation & Fundación Fungi\" since 2012 and a chair role since 2017. [inference] The two names may be one very.org (donation platform, not an affiliate)", "ein": null, "relationship": "[evidence] The site's footer donate link goes to Every.org. Every.org is a third-party platform with no evidence of shared governance.", "money_and_control": "[evidence] CauseIQ reports $45,140 from Every Org to the Foundation in 2024, labeled general support. [inference] Online gifts may reach the Foundation as a grant from the platform. If so, the receipt may come from Every.org. Every.org pages returned 429, so its terms were not read.", "sources": [{"url": "https://www.causeiq.com/organizations/fungi-foundation,851478153/", "title": "CauseIQ profile (secondary)"}, {"url": "https://www.ffungi.org", "title": "Fungi Foundation home page"}]}], "donor_check_goes_to": "Fungi Foundation Inc, EIN 85-1478153, the New York 501(c)(3). [evidence] The tax and legal page says checks by mail are accepted, and the site's online donate link goes through Every.org. [inference] A donation made through that link may be received and regranted by Every.org, so a large gift is cleaner paid directly. Only the US entity is shown as US tax-deductible; no evidence found that the Chilean entity has US status.", "mission_statement": "\"The Fungi Foundation is a global organization that explores fungi to increase knowledge of their diversity, promote innovative solutions to contingent problems, educate about their existence and applications, as well as recommending public policy for their conservation.\"", "what_they_actually_do": "A small team doing field mycology, conservation policy advocacy, and public education, with roots in Chile and a growing international policy role. Evidence below comes mostly from the organization's own account, not independent evaluation.\n\n- Expeditions and collections. [evidence] It runs fungal expeditions and maintains the FFCL Fungarium, which it reported at close to 2,000 specimens and accepted into Index Herbariorum in 2014.\n- Policy. [evidence] It reports 128 fungi and lichen ttempt in legal and environmental history, alongside four humans.6. We launched the Fungal Conservation Tracker, a tool that sheds light on the successes and deficiencies of fungal conservation efforts around the world.7. Held DNA analysis to confirm the rediscovery of a species lost to science for 40 years Austroomphaliaster nahuelbutensis.8. Launch of the documentary In Search of a Lost Fungus.9. Held mycological expeditions to Mongolias Gobi Desert, Ecuadors Sarayaku Territory, and Chilean Patagonia.10. Chiles Curriculum Update Proposal now includes funga alongside flora and fauna, after years of advocacy by the Fungi Foundation.11. Published the Portuguese translation of the FF curriculum and Fantastic Fungi Educational Film.12. Conducted training sessions and talks for 90 teachers and 350 students.13. Developed the Fungi Foundations India Chapter.14. Premiered the ethnomycological documentary The Mushroom Keepers, filmed in India.15. Carried out the pilot phase of the project Remembering the Forest with people living in long-term elder care facilities in southern Chile.16. Premiered National Geographics documentary Flora Fauna Funga, recorded on a mycological expedition to Tierra del Fuego in Chile.17. Featured in 115 outlets across 31 countries through podcasts, interviews, articles, and videos. | For Paperwork Reduction Act Notice, see the Instructions for Form 990 or 990-EZ. | Cat. No. 51056K | Schedule O (Form 990) (Rev. 1-2025) | Additional Data | Software ID: | Software Version: | "}, "tax_year": 2024, "part_iii": [{"line": "4a", "expenses": 350354, "grants": 80097, "revenue": 407817, "description": "KINGDOM FUNGI IS INDISPENSABLE TO EARTHS MANY ECOSYSTEMS AND THE ORGANISMS THAT INHABIT THE PLANET. OUR MAIN FOCUS IS ON RESEARCH, CONSERVATION, EDUCATION, EXPLORATION AND DEVELOPMENT OF FUNGI. THE ORGANIZATION ENVISIONS A HEALTHY PLANET IN WHICH FUNGI ARE RECOGNIZED AS THE INTERCONNECTORS OF NATURE."}], "part_ix": {"total": 462022, "program": 350354, "manage  film a documentary. 8. A team of mycologists from the Fungi Foundation traveled to Chiles Nahuelbuta mountain range searching for the Big Puma Fungus (Austroomphaliaster nahuelbutensis), a fungus that had only been documented by science once in 1988. They found it. 9. Premier of the documentary 10 Days in the Forest, screened in six festivals in Chile, Mexico, the US and Austria.10. Developed and published the online tool Fungal Conservation Tracker. 11. Over 90 organizations and institutions used or adopted the term funga in their communications, based on the Fungi Foundations advocacy for this terminology. 12. Daniela Torres, Programs Lead at the Fungi Foundation, gave a talk at the Latin American Mycology Congress and took part in the pre-congress Workshop 3rd IUCN Latin American Workshop for the evaluation of fungal and lichen species. 13. The work of the Fungi Foundation was featured 70 times during the year in articles, digital and printed publications, podcasts, and videos. | For Paperwork Reduction Act Notice, see the Instructions for Form 990 or 990-EZ. | Cat. No. 51056K | Schedule O (Form 990) 2023 | Additional Data | Software ID: | Software Version: | "}, "tax_year": 2023, "part_iii": [{"line": "4a", "expenses": 459671, "grants": null, "revenue": 348314, "description": "KINGDOM FUNGI IS INDISPENSABLE TO EARTHS MANY ECOSYSTEMS AND THE ORGANISMS THAT INHABIT THE PLANET. OUR MAIN FOCUS IS ON RESEARCH, CONSERVATION, EDUCATION, EXPLORATION AND DEVELOPMENT OF FUNGI. THE ORGANIZATION ENVISIONS A HEALTHY PLANET IN WHICH FUNGI ARE RECOGNIZED AS THE INTERCONNECTORS OF NATURE."}], "part_ix": {"total": 538181, "program": 459671, "management": 68954, "fundraising": 9556}, "voting_members": 6, "independent_voting_members": 6, "employees": 2, "volunteers": 10, "contrib_related_orgs": null, "contrib_government": null, "contrib_other": 333314, "contrib_noncash": 40000, "contrib_membership_dues": null, "contrib_fundraising_events": null, "governance": {"family_or_business scovery of a species lost to science for 40 years Austroomphaliaster nahuelbutensis.8. Launch of the documentary In Search of a Lost Fungus.9. Held mycological expeditions to Mongolias Gobi Desert, Ecuadors Sarayaku Territory, and Chilean Patagonia.10. Chiles Curriculum Update Proposal now includes funga alongside flora and fauna, after years of advocacy by the Fungi Foundation.11. Published the Portuguese translation of the FF curriculum and Fantastic Fungi Educational Film.12. Conducted training sessions and talks for 90 teachers and 350 students.13. Developed the Fungi Foundations India Chapter.14. Premiered the ethnomycological documentary The Mushroom Keepers, filmed in India.15. Carried out the pilot phase of the project Remembering the Forest with people living in long-term elder care facilities in southern Chile.16. Premiered National Geographics documentary Flora Fauna Funga, recorded on a mycological expedition to Tierra del Fuego in Chile.17. Featured in 115 outlets across 31 countries through podcasts, interviews, articles, and videos. | For Paperwork Reduction Act Notice, see the Instructions for Form 990 or 990-EZ. | Cat. No. 51056K | Schedule O (Form 990) (Rev. 1-2025) | Additional Data | Software ID: | Software Version: | ", "schedules_present": ["ScheduleO"]}, {"year": 2023, "object_id": "202443199349303864", "source_url": "https://projects.propublica.org/nonprofits/organizations/851478153/202443199349303864/full", "tax_year": 2023, "part_iii": [{"line": "4a", "expenses": 459671, "grants": null, "revenue": 348314, "description": "KINGDOM FUNGI IS INDISPENSABLE TO EARTHS MANY ECOSYSTEMS AND THE ORGANISMS THAT INHABIT THE PLANET. OUR MAIN FOCUS IS ON RESEARCH, CONSERVATION, EDUCATION, EXPLORATION AND DEVELOPMENT OF FUNGI. THE ORGANIZATION ENVISIONS A HEALTHY PLANET IN WHICH FUNGI ARE RECOGNIZED AS THE INTERCONNECTORS OF NATURE."}], "part_ix": {"total": 538181, "program": 459671, "management": 68954, "fundraising": 9556}, "voting_members": 6, "independ ed in honor of the legendary mycologist Paul Stamets.7. Our team, together with the Society for the Protection of the Underground Networks (SPUN) spent three weeks at the southern tip of the South American continent, in Chile, doing above and below-ground fieldwork. They were joined by the National Geographic Society to film a documentary. 8. A team of mycologists from the Fungi Foundation traveled to Chiles Nahuelbuta mountain range searching for the Big Puma Fungus (Austroomphaliaster nahuelbutensis), a fungus that had only been documented by science once in 1988. They found it. 9. Premier of the documentary 10 Days in the Forest, screened in six festivals in Chile, Mexico, the US and Austria.10. Developed and published the online tool Fungal Conservation Tracker. 11. Over 90 organizations and institutions used or adopted the term funga in their communications, based on the Fungi Foundations advocacy for this terminology. 12. Daniela Torres, Programs Lead at the Fungi Foundation, gave a talk at the Latin American Mycology Congress and took part in the pre-congress Workshop 3rd IUCN Latin American Workshop for the evaluation of fungal and lichen species. 13. The work of the Fungi Foundation was featured 70 times during the year in articles, digital and printed publications, podcasts, and videos. | For Paperwork Reduction Act Notice, see the Instructions for Form 990 or 990-EZ. | Cat. No. 51056K | Schedule O (Form 990) 2023 | Additional Data | Software ID: | Software Version: | ", "schedules_present": ["ScheduleO"]}, {"year": 2022, "object_id": "202412229349300126", "source_url": "https://projects.propublica.org/nonprofits/organizations/851478153/202412229349300126/full", "tax_year": 2022, "part_iii": [{"line": "4a", "expenses": 443504, "grants": 112892, "revenue": 413399, "description": "KINGDOM FUNGI IS INDISPENSABLE TO EARTHS MANY ECOSYSTEMS AND THE ORGANISMS THAT INHABIT THE PLANET. OUR MAIN FOCUS IS ON RESEARCH, CONSERVATION, EDUCATION, EXPLORATION AND DEVELOPM wsuit, regulatory action, or investigative reporting was found, but that search was not exhaustive. The real issues are money and verifiability.\n\n- Finances. Three straight deficit years have used up most of a 2021 surplus. Net assets fell from $372,077 (FY2021) to $82,068 (FY2024), about 2.1 months of expenses. The FY2024 deficit of $54,205 implies roughly 18 months of runway at that rate [inference]. No FY2025 filing or financial statements were found.\n- Audit. The FY2024 990 answers No to a separate audit. New York rules, per secondary sources, call for a CPA review at this revenue level. I did not see one.\n- Structure. The FY2024 990 answers No to related organizations and to chapters or affiliates. Yet the organization has a Chile board, lists an India Chapter in its own Schedule O, and says some global sites are separate entities. This may be technically correct if no legal control exists. It also means donors cannot see the Chile money flow from this filing alone.\n- Data conflict. The extract carries two FY2022 versions. Only the $413,399 revenue and $459,336 expense version rolls forward to FY2023 net assets, and it moves the three-year margin from -29.4% to about -24.8% [inference]. The deficit story holds either way.\n- Rating. Charity Navigator shows three stars, 80%, on FY2024 data, with one of four beacons completed. No Candid, BBB, or CharityWatch rating was found.\n- Programs. The policy results have real outside confirmation: Chile's law (Undark) and the UK-Chile pledge launch (Natural England). Their conservation effect has no independent evidence. Most other figures are self-reported outputs, not outcomes. The Fungal Conservation Pledge sat outside the formal COP16 agenda, per the organization's own blog.\n- Funders. Named funders are few and two are pass-through vehicles (Fidelity Charitable, Every.org). The largest named grant is Samueli Foundation, reported as $75,000 by CauseIQ and $50,000 in a separate snippet of the same site.\n- Site-visit priorities: the Schedule F and Chile money flow, FY2025 results and cash, the CPA review report, the FY2022 amendment, and why CEO pay fell 36% in two years.", "functional_expenses": [{"year": 2024, "program": 350354, "management": 70493, "fundraising": 41175, "total": 462022, "source_url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full"}, {"year": 2023, "program": 459671, "management": 68954, "fundraising": 9556, "total": 538181, "source_url": "https://projects.propublica.org/nonprofits/organizations/851478153/202443199349303864/full"}, {"year": 2022, "program": 443504, "management": 15832, "fundraising": 0, "total": 459336, "source_url": "https://projects.propublica.org/nonprofits/organizations/851478153/202412229349300126/full"}, {"year": 2021, "program": 191556, "management": 8767, "fundraising": 0, "total": 200323, "source_url": "https://projects.propublica.org/nonprofits/organizations/851478153/202243199349331904/full"}], "program_service_accomplishments": [{"year": 2024, "program": "Line 4a, single program: research, conservation, education, exploration and development of fungi", "expenses": 350354, "description": "Part III gives one generic description and $80,097 in grants, recipients not named here. Schedule O lists 17 achievements: Fungal Conservation Pledge launched at COP16 with Chile and the UK (stated as 13 countries); Funga Tool Kit; National Geographic definition of wildlife; first permanent fungi exhibit in Chile with Museo Interactivo Mirador; Los Cedros song petition; Fungal Conservation Tracker; DNA confirmation of Austroomphaliaster nahuelbutensis; expeditions to Mongolia's Gobi, Ecuador's Sarayaku Territory and Chilean Patagonia; funga in Chile's curriculum update proposal; Portuguese curriculum translation; training for 90 teachers and 350 students; India Chapter; two documentaries plus a National Geographic documentary premiere; elder-care pilot in southern Chile; 115 outlets across 31 countries. All self-reported.", "source_url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full"}, {"year": 2023, "program": "Line 4a, single program: research, conservation, education, exploration and development of fungi", "expenses": 459671, "description": "Same generic description. Grants field is blank in the extract. No itemized accomplishments are available for this year.", "source_url": "https://projects.propublica.org/nonprofits/organizations/851478153/202443199349303864/full"}, {"year": 2022, "program": "Line 4a, single program: research, conservation, education, exploration and development of fungi", "expenses": 443504, "description": "Same generic description, with $112,892 in grants, recipients not seen. No itemized accomplishments are available for this year.", "source_url": "https://projects.propublica.org/nonprofits/organizations/851478153/202412229349300126/full"}, {"year": 2021, "program": "Line 4a, single program: research, conservation, education, exploration and development of fungi", "expenses": 191556, "description": "Same generic description, with $34,555 in grants, recipients not seen. No itemized accomplishments are available for this year.", "source_url": "https://projects.propublica.org/nonprofits/organizations/851478153/202243199349331904/full"}], "governance_notes": [{"statement": "FY2024 990: 6 voting members, all 6 counted as independent. Employees 2, volunteers 10. The website shows 5 US board members; the filing also lists JR Rahn at $0. Rahn's absence from the site is unexplained.", "basis": "evidence", "confidence": 0.9, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Form 990 (financial extract)"}, {"url": "https://www.ffungi.org/board", "title": "Board of Directors"}]}, {"statement": "FY2024 Part IV and VI answers: conflict of interest, whistleblower and document retention policies Yes. Board reviewed 990 Yes. CEO pay independently reviewed Yes. Family or business relationships, excess benefit, insider loans, grants or business, and material diversion all No. These are self-attested and I saw no underlying policies.", "basis": "evidence", "confidence": 0.9, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Form 990 (financial extract)"}]}, {"statement": "Schedule O says the 990 is prepared by an outside accounting firm, reviewed by the Treasurer and then emailed to the board for approval. CEO pay is set annually by the board using comparable organizations' data and documented in minutes. Form 1023, financial statements, conflict policy, articles and by-laws are available on written request.", "basis": "evidence", "confidence": 0.9, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Schedule O (financial extract)"}]}, {"statement": "Schedule O says the conflict policy applies to the board of directors, with annual disclosure at board meetings. It does not mention staff or contractors. That matters here because most of the team appears to sit off the US payroll.", "basis": "inference", "confidence": 0.6, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Schedule O (financial extract)"}, {"url": "https://www.ffungi.org/team", "title": "Team page"}]}, {"statement": "The 990 answers No to related organizations and to local chapters or affiliates. Schedule O lists 'Fungi Foundation's India Chapter', the site says some global sites are 'separate entities', and a separately boarded Chile organization exists. The No may be technically correct if neither entity controls the other, since Furci is the only visible link between the boards. It leaves the legal relationship undocumented in this filing and should be asked directly.", "basis": "inference", "confidence": 0.7, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Form 990 (financial extract)"}, {"url": "https://www.ffungi.org/tax-and-legal-information", "title": "Tax and legal information"}, {"url": "https://www.ffungi.org/board", "title": "Board of Directors"}]}, {"statement": "The extract's schedules_present lists only Schedule O. This should not be read as proof that no Schedule F or R exists: every 501(c)(3) also files Schedule A, and it is not listed, so the field looks incomplete. Foreign grant recipients remain unseen.", "basis": "inference", "confidence": 0.65, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Form 990 (financial extract)"}]}, {"statement": "Filing quality: Part III line 4a program revenue equals total revenue in FY2022 to FY2024 (for example $407,817 in FY2024, against $4,140 of program revenue). Officer compensation reads $0 in FY2023 and FY2024 while the CEO is paid $79,603 and $58,336. Both suggest preparer classification choices rather than wrongdoing. They are worth asking the Treasurer about.", "basis": "inference", "confidence": 0.65, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Form 990 (financial extract)"}]}, {"statement": "The 990 answers No to lobbying activities, while the organization describes policy advocacy as core work, with policy staff, the pledge and curriculum advocacy. Most of this may be government engagement that is not lobbying as the IRS defines it. I did not test this. Ask how lobbying is tracked.", "basis": "speculation", "confidence": 0.35, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Form 990 (financial extract)"}, {"url": "https://www.ffungi.org/team", "title": "Team page"}]}], "flag_explanations": [{"flag_key": "reserves_months", "explanation": "Net assets fell from $372,077 (FY2021) to $82,068 (FY2024), or 2.1 months. The cause is visible: the FY2021 surplus was spent down by later deficits. No FY2025 balance was found. The January 2026 post says the team grew to 14 people in 8 countries in 2025, which gives no sign of cost reduction, though funding for that growth is unknown.", "basis": "inference", "confidence": 0.8, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Form 990 (financial extract)"}, {"url": "https://www.ffungi.org/blog/positive-fungal-news-from-last-year-to-start-this-2026", "title": "Positive fungal news (1 Jan 2026)"}]}, {"flag_key": "margin_3y", "explanation": "The -29.4% uses the extract's FY2022 row ($343,638 revenue, $422,919 expenses). Another FY2022 version shows $413,399 and $459,336. Only that second version rolls forward: $372,077 less $45,937 gives $326,140, and less FY2023's $189,867 gives the reported $136,273. On that version the margin is about -24.8%. Still a sustained deficit. ProPublica shows two FY2022 filings. The reason for the second is unknown.", "basis": "inference", "confidence": 0.8, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202412229349300126/full", "title": "FY2022 Form 990 (financial extract)"}, {"url": "https://projects.propublica.org/nonprofits/organizations/851478153", "title": "ProPublica Nonprofit Explorer"}]}, {"flag_key": "consecutive_deficits", "explanation": "FY2022 to FY2024 are deficits under either FY2022 version. The pattern reads as a deliberate or tolerated spend-down of 2021 money after payroll and program costs rose: expenses went from $200,323 to $538,181 in two years. No board statement, plan or deficit explanation was found in Schedule O or on the site. FY2024 improved, with revenue up 17.1% and expenses down from FY2023, but it was still a $54,205 deficit.", "basis": "inference", "confidence": 0.7, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Form 990 (financial extract)"}]}, {"flag_key": "expense_minus_revenue_growth", "explanation": "The size of this flag is inflated by a thin base. FY2020 is a start-up year (exemption July 2020, $30,318 expenses). Measured from FY2021, revenue fell about 9% a year and expenses rose about 32% a year. So the direction of the flag stands, and the 36.56-point magnitude should not be quoted alone.", "basis": "inference", "confidence": 0.8, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202243199349331904/full", "title": "FY2021 Form 990 (financial extract)"}, {"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Form 990 (financial extract)"}]}, {"flag_key": "revenue_volatility", "explanation": "Mostly an artifact of the jump from $60,660 (FY2020) to $542,058 (FY2021). Since FY2022, revenue has been between about $344,000 and $413,000. The 2021 peak coincides with The Future is Fungi conference, whose proceeds went to the Foundation, per a Paul Stamets page. No amount was found, so the event's share of the spike is unknown. Coverage from the 2020 Fantastic Fungi premiere and the 2021 Tim Ferriss interview may also have helped [speculation].", "basis": "inference", "confidence": 0.6, "sources": [{"url": "https://paulstamets.com/news/future-is-fungi-conference-2021", "title": "Future is Fungi conference 2021"}, {"url": "https://ffungi.org/eng/our-impact", "title": "Our impact"}, {"url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/", "title": "Tim Ferriss transcript (Aug 2021)"}]}, {"flag_key": "top_paid_pct", "explanation": "At $58,336 for FY2024, the amber flag reflects the small budget, not high pay. Reported pay fell from $91,035 (FY2022) to $79,603 and then $58,336 he 2021 fundraiser. Amount unknown. Search results report Bolt Threads later halted Mylo production. No evidence on whether this affected Foundation funding.", "sources": [{"url": "https://ffungi.org/eng/our-impact", "title": "Our impact"}, {"url": "https://www.biofuelsdigest.com/bdigest/?p=171096", "title": "Biofuels Digest on Bolt Threads"}]}], "program_claims": [{"claim": "Chile became the first country to include fungi in environmental law, through the Foundation's founder's work (2012-2013).", "evidence_status": "independently_verified", "detail": "Undark (9 Aug 2021) reports that Furci and other nonprofits proposed the change in 2010 and that the motion passed in 2012, making Chile the first. The organization says 2012 for recognition and a 2013 decree for impact assessments; one page gives 2013 as the law's year. The work predates or straddles the organization's founding. Effect on fungi is unverified. Anders Dahlberg, quoted in Undark, says species laws are 'meaningless without protection for the broader habitats'. I did not read the Chilean legal text.", "sources": [{"url": "https://undark.org/2021/08/09/flora-fauna-and-funga/", "title": "Undark: Flora, fauna and funga (2021)"}, {"url": "https://ffungi.org/blog/fungi-foundation-10-cycles-around-the-sun", "title": "10 cycles around the sun (2022)"}, {"url": "https://ffungi.org/eng/our-impact", "title": "Our impact"}]}, {"claim": "Launched with Chile and the UK a Fungal Conservation Pledge at UN CBD COP16, signed by 13 or 14 countries.", "evidence_status": "independently_verified", "detail": "Natural England (10 Oct 2025) confirms the UK and Chile co-launch and links a pledge PDF hosted on an ffungi.org domain. The Guardian reported the plan. Counts differ: 12 named in the 2024 highlights post, 13 in the FY2024 Schedule O and January 2026 post, 14 on the campaign page. The full list was not seen. The organization's blog says the pledge was not on the formal agenda item. No binding force was shown. Natural England names no specific commitments. The Foundation's role as co-launcher is self-described, since the Natural England post does not name it.", "sources": [{"url": "https://naturalengland.blog.gov.uk/2025/10/10/a-landmark-year-for-englands-fungi/", "title": "Natural England: A landmark year for England's fungi"}, {"url": "https://www.ffungi.org/campaign/fungal-conservation-pledge", "title": "Fungal Conservation Pledge"}, {"url": "https://www.ffungi.org/blog/chile-and-the-uk-call-on-the-un-convention-on-biological-diversity-to-take-global-action-for-the-conservation-of-fungi", "title": "Chile and the UK called on the UN CBD"}, {"url": "https://inkl.com/news/fungi-may-get-status-boost-under-uk-chile-conservation-plan", "title": "Guardian repost on inkl"}]}, {"claim": "Species assessed: 22 first assessed in Chile's process and on the IUCN Red List; 128 fungi and lichens by 2019; 138 by 2024.", "evidence_status": "self_reported_with_data", "detail": "A Latin American journal article in search results attributes the 22-species listing to a decree, which partly supports the start of the series. The 128 and 138 figures come from the organization. Wikipedia says 'over 80' fungi, and the page uses 138 for two different things (species evaluated; species proposed to IUCN). Chile's Ministry of the Environment classification list was not checked. A listing is not a protection outcome.", "sources": [{"url": "https://ffungi.org/eng/our-impact", "title": "Our impact"}, {"url": "https://revistas.ucr.ac.cr/index.php/rbt/article/download/37415/38209/125115", "title": "Journal article, Revista de Biología Tropical (search snippet)"}, {"url": "https://en.wikipedia.org/wiki/Giuliana_Furci", "title": "Giuliana Furci, Wikipedia"}]}, {"claim": "Education reach: Chile's curriculum update now includes funga; the curriculum has 6,199 enrollments from 97 countries; training for 90 teachers and 350 children.", "evidence_status": "self_reported_with_data", "detail": "Schedule O's 'now includes' refers to a proposal. The 2024 highlights post says it is under review by the National Education Council. El Desconcierto (Aug 2024) reports the term in the proposal, a piece also carried on the organization's blog. No evidence found of approval. Enrollments are not completions or learning. The in-person training numbers are small. No outcome evaluation found.", "sources": [{"url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024", "title": "Highlights from 2024"}, {"url": "https://eldesconcierto.cl/2024/08/14/al-fin-la-funga-podria-llegar-a-las-salas-de-clases", "title": "El Desconcierto (14 Aug 2024)"}, {"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Schedule O (financial extract)"}]}, {"claim": "Rediscovered Austroomphaliaster nahuelbutensis, 'lost to science for 40 years', confirmed by DNA analysis.", "evidence_status": "independently_verified", "detail": "Re:wild lists the find as 36 years lost, with Fundación Nahuelbuta as a partner on the May 2023 expedition. The Foundation says 40 years and some press says 42. The search summary inferred about 35 to 36 years from the 1988 description. The event is supported by partner sources, not an arm's-length review. No peer-reviewed confirmation was checked. The year count is rounded up in the organization's own telling.", "sources": [{"url": "https://www.rewild.org/lost-species/found", "title": "Re:wild Lost Species Found"}, {"url": "https://ffungi.org/blog/endemic-species-of-fungus-in-chile-has-been-found-after-being-lost-to-science-for-40-years", "title": "Endemic species found after 40 years (Fungi Foundation)"}, {"url": "https://en.wikipedia.org/wiki/Austroomphaliaster", "title": "Austroomphaliaster, Wikipedia"}, {"url": "https://reports.speciesconservation.org/ar-case-studies/rediscovery-after-40-years/", "title": "Species Conservation case study"}]}, {"claim": "National Geographic included fungi in its definition of wildlif f-reported, 2023; no list seen)", "year": 2021, "program": "Part III line 4a; Fauna Flora Funga (3F) campaign", "durability": "in_force", "contribution": "co_lead", "counterfactual": "Fungal conservation was already growing through IUCN specialist groups and Kew's State of the World's Fungi reports, so some of this language shift would probably have come anyway, later. The organization's distinct contribution is the campaign and its packaging. Credit runs partly through Furci's IUCN role as deputy chair of the fungal committee, not only through the charity.", "others_involved": ["IUCN SSC Fungal Conservation Committee", "Re:wild", "NYU Earth Advocacy Clinic", "Merlin Sheldrake", "UN Biodiversity (CBD Secretariat)"], "significance": 3, "evidence_quality": "independently_verified", "evidence": "IUCN's own statement and news release confirm the change. A secondary source (Wikipedia) names the initiative as a collaboration of the Foundation, NYU and Sheldrake. The UN statement is known here only through secondary reports. A term in use is not protection. The 90-organization count is unverified.", "basis": "evidence", "sources": [{"url": "https://iucn.org/sites/default/files/2022-12/statement-3f.pdf", "title": "IUCN SSC statement on Fauna Flora Funga"}, {"url": "https://iucn.org/news/species-survival-commission/202108/rewild-and-iucn-ssc-become-first-global-organizations-call-recognition-fungi-one-three-kingdoms-life-critical-protecting-and-restoring-earth", "title": "IUCN news release, Aug 2021"}, {"url": "https://www.downtoearth.org.in/news/wildlife-biodiversity/funga-un-wants-us-all-to-say-it-along-with-flora-fauna--91440", "title": "Down To Earth on UN Biodiversity call"}, {"url": "https://en.wikipedia.org/wiki/Funga", "title": "Funga, Wikipedia (secondary)"}, {"url": "https://www.ffungi.org/blog/2023-recap-a-successful-year-working-for-the-fungi", "title": "2023 recap"}]}, {"rank": 2, "what_changed": "A non-binding Fungal Conservation Pledge now exists. The UK and Chile presented it at CBD COP16 in Cali (Oct 2024). It asks Parties to recognize fungi as an independent kingdom in law and policy, and it gives governments a named commitment to sign.", "for_whom": "National governments that sign. No legal effect in any signatory has been traced to it, though Natural England describes follow-on fungal work in England without attributing it to the pledge.", "count": "12 countries named in 2024; 13 in Jan 2026; 14 on the campaign page and in CBC, 2026. Italy reported committing at COP17, though Oryx already listed Italy as a supporter in 2024. No authoritative list seen.", "year": 2024, "program": "Part III line 4a; Fungal Conservation Pledge campaign", "durability": "too_early", "contribution": "co_lead", "counterfactual": "This pledge in this form probably would not exist without the organization. Oryx, a conservation journal, says the Foundation and the 3Fs Initiative led its development. Its Chile access is an unusual asset. Governments were the actors and their ministers fronted it. Whether it changes any government's behavior is untested. Natural England's fungal work rests on domestic programs and may have happened anyway.", "others_involved": ["Government of Chile", "Government of the UK", "3Fs Initiative", "SPUN (COP17 side event co-organizer)"], "significance": 2, "evidence_quality": "independently_verified", "evidence": "Oryx (Mar 2025) credits the Foundation and 3Fs Initiative and says the pledge did not reach the latest agenda. Chile instead made a plenary statement on a soil biodiversity action plan. Natural England confirms the UK-Chile launch but does not name the Foundation. The existence and authorship are verified. The effect is not.", "basis": "evidence", "sources": [{"url": "https://www.cambridge.org/core/journals/oryx/article/fungi-gaining-ground-at-recent-cbd-and-iucn-meetings/01866B1C43C9814E4322A0E3E957C078", "title": "Oryx: Fungi gaining ground at recent CBD and IUCN meetings"}, {"url": "https://naturalengland.blog.gov.uk/2025/10/10/a-landmark-year-for-englands-fungi/", "title": "Natural England, 10 Oct 2025"}, {"url": "https://www.ffungi.org/campaign/fungal-conservation-pledge", "title": "Fungal Conservation Pledge"}, {"url": "https://www.naturalworldfund.org.uk/cop17-fungi-global-biodiversity-conservation/", "title": "Natural World Fund on COP17 (30 Oct 2026)"}]}, {"rank": 3, "what_changed": "CITES CoP20 adopted Decisions 20.247 and 20.248 (5 Dec 2025), 'Resolving the implementation of the CoP12 decision that the Convention applies to fungi'. They commission scientific and technical advice to the Standing Committee on how the treaty applies to fungi. No fungal species listing was found.", "for_whom": "CITES Parties and committees. No traded species is protected by this step.", "count": null, "year": 2025, "program": "Part III line 4a; CITES advocacy", "durability": "too_early", "contribution": "one_of_many", "counterfactual": "The UK government carried it, through SC78 Doc. 75 and CoP20 Doc. 101. The Foundation's Jan 2025 paper with John Scanlon itself cites the UK proposal to SC78, so the sequence does not show the Foundation originated it. It may have supplied expertise and pressure. Whether the same decisions would have passed without it is unknown.", "others_involved": ["UK government", "John Scanlon", "CITES Standing, Animals and Plants Committees"], "significance": 2, "evidence_quality": "independently_verified", "evidence": "ECOLEX records the decisions, and ENB reports that the UK presented the document and that Canada had a draft decision removed. The decisions are independently verified. The Foundation's causal share is inference only. Its 2025 recap says Chilean and British delegations 'aligned', but no document seen credits it.", "basis": "inference", "sources": [{"url": "https://www.ecolex.org/details/decision/resolving-the-implementation-of-the-cop12-decision-that-the-convention-applies-to-fungi-e51a7e2a-6f91-47d8-b75a-ec69caeadc2f/", "title": "ECOLEX: Decision 20.248"}, {"url": "https://enb.iisd.org/convention-international-trade-endangered-species-wild-fauna-flora-cites-cop20-daily-report-24nov2025", "title": "ENB daily report, 24 Nov 2025 (search snippet)"}, {"url": "https://www.ffungi.org/blog/fundacion-fungi-llama-a-la-cites-a-fortalecer-los-controles-sobre-el-comercio-de-hongos-para-reforzar-la-conservacion-fungica", "title": "Fungi Foundation calls on CITES, 27 Jan 2025"}, {"url": "https://www.ffungi.org/blog/positive-fungal-news-from-last-year-to-start-this-2026", "title": "2025 recap (1 Jan 2026)"}]}, {"rank": 4, "what_changed": "England's Environmental Improvement Plan 2025 (Dec 2025) names fungi among priorities, per search snippets and a March 2026 parliamentary answer. Separately, Natural England's Threatened Species Recovery Actions (Aug 2025) cover 155 fungi and lichen species. The Foundation claims fungi were 're-incorporated' in the plan.", "for_whom": "Fungi and lichens in England, through government planning", "count": "155 fungi and lichen species in the recovery actions (not attributed to the Foundation)", "year": 2025, "program": "Part III line 4a; UK policy work", "durability": "in_force", "contribution": "one_of_many", "counterfactual": "Likely much of it would have happened anyway. Natural England has its own mycologist and programs, and Plantlife and the Network for Fungal Conservation are active. Natural England's account does not name the Foundation or the plan. The Foundation does employ a UK Policy Lead, and the UK co-launched its pledge, so some influence is plausible.", "others_involved": ["Defra", "Natural England", "Plantlife", "Network for Fungal Conservation"], "significance": 2, "evidence_quality": "self_reported_no_data", "evidence": "The government text is confirmed only from snippets. The PDF could not be parsed, so exact wording is unread and the 're-incorporated' story is untested. The attribution rests solely on the Foundation's recap, with no supporting document seen.", "basis": "inference", "sources": [{"url": "https://www.gov.uk/government/publications/the-environmental-improvement-plan-2025-and-the-kunming-montreal-global-biodiversity-framework/the-environmental-improvement-plan-2025-and-the-kunming-montreal-global-biodiversity-framework", "title": "EIP 2025 and the GBF (search snippet)"}, {"url": "https://parallelparliament.co.uk/question/HL11789/fungi-conservation", "title": "Fungi: Conservation, parliamentary question (search snippet; fetch returned 403)"}, {"url": "https://naturalengland.blog.gov.uk/2025/10/10/a-landmark-year-for-englands-fungi/", "title": "Natural England, 10 Oct 2025"}, {"url": "https://www.ffungi.org/blog/positive-fungal-news-from-last-year-to-start-this-2026", "title": "2025 recap (1 Jan 2026)"}]}, {"rank": 5, "what_changed": "The Foundation reports that fungi or 'funga' were included alongside flora and fauna in Vienna's Nature Conservation Law in 2025. The statute was amended by LGBl. 45/2025, but I could not read what changed.", "for_whom": "Fungi in one city-state", "count": null, "year": 2025, "program": "Part III line 4a; 3F policy work", "durability": "unknown", "contribution": "one_of_many", "counterfactual": "A University of Vienna mycologist, Irmgard Greilhuber, lists a 2026 talk on bringing fungi into the Vienna act, which suggests local scientists drove or shared this. The Foundation's own part is not described. It may have stood near this rather than caused it [speculation].", "others_involved": ["Irmgard Greilhuber, University of Vienna", "City of Vienna legislature"], "significance": 2, "evidence_quality": "self_reported_no_data", "evidence": "Only the Foundation describes the amendment. The researcher's talk title gives partial corroboration of the change, not of the Foundation's role. Statutory text was not read.", "basis": "inference", "sources": [{"url": "https://www.ffungi.org/blog/positive-fungal-news-from-last-year-to-start-this-2026", "title": "2025 recap (1 Jan 2026)"}, {"url": "https://ucrisportal.univie.ac.at/en/persons/irmgard-greilhuber/", "title": "Irmgard Greilhuber profile (search snippet)"}, {"url": "https://www.ris.bka.gv.at/Dokumente/Landesnormen/LWI40017759/LWI40017759.pdf", "title": "Wiener Naturschutzgesetz, RIS (search snippet)"}]}, {"rank": 6, "what_changed": "'Funga' entered Chile's proposed school curriculum update, per the Foundation and El Desconcierto (Aug 2024). This is a proposal, not an adopted curriculum. A Ministry timeline shows public consultation from Nov 2024 to Apr 2025, and CNED records show a 1st to 6th grade proposal being resubmitted. No approval was found.", "for_whom": "Chilean schoolchildren, if adopted. No count applies yet.", "count": null, "year": 2024, "program": "Part III line 4a; education", "durability": "too_early", "contribution": "lead", "counterfactual": "Fungi already appear in current Chilean curriculum objectives (for example, grade 5 microorganisms and grade 7 comparisons). The change is a framing upgrade. 'After years of advocacy' is the Foundation's account, and El Desconcierto supports the presence of the term but its piece also runs on the Foundation's blog. No Ministry source credits it.", "others_involved": ["Chile Ministry of Education", "National Education Council (CNED)"], "significance": 2, "evidence_quality": "self_reported_with_data", "evidence": "The proposal is reported; adoption is not. Whether the funga wording survived the CNED resubmission is unknown. CNED documents returned 403.", "basis": "evidence", "sources": [{"url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024", "title": "Highlights from 2024"}, {"url": "https://eldesconcierto.cl/2024/08/14/al-fin-la-funga-podria-llegar-a-las-salas-de-clases", "title": "El Desconcierto, 14 Aug 2024"}, {"url": "https://cned.cl/wp-content/uploads/2026/05/903-21-01.pdf", "title": "CNED record (search snippet)"}, {"url": "https://www.curriculumnacional.cl/curriculum/1o-6o-basico/ciencias-naturales/5-basico", "title": "Grade 5 natural sciences, current curriculum (search snippet)"}]}, {"rank": 7, "what_changed": "Global Strategy for Fungal Conservation published at COP17 on 21 Oct 2026, endorsed by more than 50 organizations from 30 countries and supporting 12 Global Biodiversity Framework targets. The Foundation says it 'contributed to drafting its targets'.", "for_whom": "Governments and conservation practitioners", "count": "50+ organizations, 30 countries", "year": 2026, "program": "Part III line 4a; conservation policy", "durability": "too_early", "contribution": "one_of_many", "counterfactual": "It would very likely have happened without the Foundation. Plantlife is the secretariat, Greg Mueller and Cátia Canteiro led it per Mongabay, and neither Mongabay nor the strategy's home page names the Foundation.", "others_involved": ["Plantlife", "Global Fungal Conservation Network", "Chicago Botanic Garden", "IUCN SSC Fungal Conservation Committee", "SPUN"], "significance": 2, "evidence_quality": "self_reported_no_data", "evidence": "The strategy is independently verified. The Foundation's role is its own statement. This is stood-near credit until an authors list shows otherwise.", "basis": "evidence", "sources": [{"url": "https://www.globalfungalconservation.org/", "title": "Global Strategy for Fungal Conservation"}, {"url": "https://news.mongabay.com/short-article/2026/10/fungi-now-have-a-global-conservation-strategy/", "title": "Mongabay, 26 Oct 2026"}, {"url": "https://www.plantlife.org.uk/our-work/global-strategy-for-fungal-conservation", "title": "Plantlife"}, {"url": "https://www.ffungi.org/blog/positive-fungal-news-from-last-year-to-start-this-2026", "title": "2025 recap (1 Jan 2026)"}]}, {"rank": 8, "what_changed": "Fungi remain in Chile's official species classification, including in the 20th process decree (2025). The Foundation says assessed fungi and lichens rose from 22 to 138 by 2024, but its own pages also give 45 for 2019 versus a reported 128. Official decrees confirm a fungi section but I did not count it.", "for_whom": "Native Chilean fungi and lichens; decision-makers using status lists", "count": "Conflicting: 22, 45, over 80, 128, 138. One press note gives 5 fungi among 59 species in the 19th process.", "year": 2024, "program": "Part III line 4a; species assessment", "durability": "in_force", "contribution": "co_lead", "counterfactual": "The Ministry runs the process and the classification committee decides. Without the Foundation's nominations and field data, fewer fungi would probably be listed, since few other groups work on them in Chile [inference]. Nomination records were not read.", "others_involved": ["Chile Ministry of the Environment", "Classification Committee"], "significance": 2, "evidence_quality": "self_reported_with_data", "evidence": "Government decrees confirm fungi are classified. The numbers and the credit are the Foundation's, and they conflict across its own pages. A listing is not protection on the ground. Loyo was listed endangered, but its recovery plan is only at the groundwork stage per 2025 and 2026 posts.", "basis": "evidence", "sources": [{"url": "https://www.bcn.cl/leychile/navegar?idNorma=1221953", "title": "20th classification process decree (search snippet)"}, {"url": "https://ffungi.org/eng/our-impact", "title": "Our impact"}, {"url": "https://www.ffungi.org/conservation", "title": "Fungal Conservation page"}, {"url": "https://www.mediabanco.com/consejo-de-ministros-aprueba-clasificacion-de-especies-amenazadas-en-chile", "title": "Press note on 19th process (search snippet)"}, {"url": "https://www.ffungi.org/blog/national-geographic-society-supports-groundbreaking-project-in-chile", "title": "NatGeo Society supports project in Chile (4 May 2026)"}]}, {"rank": 9, "what_changed": "A fungus on Re:wild's most-wanted lost species list, Austroomphaliaster nahuelbutensis, was found in Nahuelbuta in May 2023 and confirmed by DNA in 2024. This is new knowledge, not a change in the species' protection.", "for_whom": "Science; one endemic Chilean species", "count": "1 species", "year": 2024, "program": "Part III line 4a; expeditions", "durability": "in_force", "contribution": "co_lead", "counterfactual": "Few teams were looking. Re:wild's list and Fundación Nahuelbuta framed and supported the search, so the Foundation is a strong co-lead for a small result. No protection measure followed in what I found.", "others_involved": ["Re:wild", "Fundación Nahuelbuta", "Species Conservation partners"], "significance": 1, "evidence_quality": "self_reported_with_data", "evidence": "Re:wild's list confirms the find, but it is a partner, not an arm's-length reviewer. No peer-reviewed confirmation was checked. Re:wild says 36 years lost, the Foundation says 40.", "basis": "evidence", "sources": [{"url": "https://www.rewild.org/lost-species/found", "title": "Re:wild Lost Species Found"}, {"url": "https://www.ffungi.org/blog/2023-recap-a-successful-year-working-for-the-fungi", "title": "2023 recap"}, {"url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024", "title": "Highlights from 2024"}]}, {"rank": 10, "what_changed": "Chile's first permanent fungi exhibit opened in Feb 2024 at Museo Interactivo Mirador, Santiago, per Schedule O and the 2024 recap.", "for_whom": "Museum visitors. The museum receives about 800,000 a year, but exhibit attendance is not reported.", "count": "About 800,000 museum visitors a year (self-reported; not exhibit attendance)", "year": 2024, "program": "Part III line 4a; education", "durability": "unknown", "contribution": "co_lead", "counterfactual": "Unlikely to exist without the Foundation's push, but no museum source was read. Whether it changed anyone's knowledge or behavior is unmeasured.", "others_involved": ["Museo Interactivo Mirador"], "significance": 1, "evidence_quality": "self_reported_no_data", "evidence": "Organization's own statements only.", "basis": "evidence", "sources": [{"url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024", "title": "Highlights from 2024"}, {"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Schedule O (financial extract)"}]}, {"rank": 11, "what_changed": "Ethnomycology Ethical Guidelines published in 2023 and revised in 2025. One reported application: the Kichwa people of Sarayaku, Ecuador, 2024. No journal or university adoption was reported.", "for_whom": "Researchers and Indigenous communities working with fungal knowledge", "count": "1 reported application", "year": 2025, "program": "Part III line 4a; elders and ethnomycology", "durability": "too_early", "contribution": "lead", "counterfactual": "The guidelines are the Foundation's own document, authored by Furci, Haro-Luna and Turner, so authorship is clear. Whether field practice changed is not shown, and broader research ethics codes already exist.", "others_involved": ["Sarayaku Kichwa people", "SPUN", "More-Than-Human Programme", "Local Contexts"], "significance": 1, "evidence_quality": "self_reported_no_data", "evidence": "A capability now exists. Adoption is unreported beyond one partner project. The Foundation claims Indigenous endorsement but the endorsers were not independently seen.", "basis": "evidence", "sources": [{"url": "https://www.mycostories.com/post/new-ethnomycology-guidelines-framework-dedicated-to-human-fungal-knowledge-systems", "title": "Mycostories on the guidelines"}, {"url": "https://www.ffungi.org/campaign/ethnomycology-ethical-guidelines", "title": "Ethnomycology Ethical Guidelines"}]}, {"rank": 12, "what_changed": "Pre-window, and bought with none of the money in this ledger: Chile became the first country to bring fungi into environmental law (motion passed 2012 per Undark; 2013 decree per the Foundation). Current text of Article 37 of Ley 19.300, as amended by Ley 21.600 (2023), still covers fungi, per a 2026 decree snippet.", "for_whom": "Native Chilean fungi. Assessment and impact review obligations.", "count": null, "year": 2012, "program": "Pre-dates the US entity (Chilean organization)", "durability": "in_force", "contribution": "co_lead", "counterfactual": "Undark says Furci and other nonprofits proposed it in 2010. Without them, the change would likely have come much later. This is the organization's strongest and best-evidenced result. The carry-through into Ley 21.600 may reflect drafting inertia, and no credit to the Foundation for that was found. Anders Dahlberg, in Undark, doubts species laws matter without habitat protection.", "others_involved": ["Chilean legislators and Ministry of the Environment", "Other Chilean nonprofits"], "significance": 4, "evidence_quality": "independently_verified", "evidence": "Undark's reporting, plus official decrees that carry a fungi kingdom. Effect on fungal populations is unmeasured. Listed here for scale; excluded from the recent-dollars judgment.", "basis": "evidence", "sources": [{"url": "https://undark.org/2021/08/09/flora-fauna-and-funga/", "title": "Undark, 9 Aug 2021"}, {"url": "https://clasificacionespecies.mma.gob.cl/wp-content/uploads/2026/03/DS_54_2025_MMA_oficializa_20_RCE-DO_5_3_2026.pdf", "title": "DS 54/2025, 20th process (search snippet)"}, {"url": "https://www.ffungi.org/conservation", "title": "Fungal Conservation page"}]}], "failures_and_reversals": [{"what": "The Pledge did not reach the formal COP16 agenda or get adopted. Chile fell back to a plenary statement about submissions under a soil biodiversity plan.", "year": 2024, "consequence": "The pledge stayed a voluntary list of governments rather than a CBD decision.", "how_handled": "The Foundation presented this as a launch and moved the adoption goal to COP17. Its recap says 'formal adoption at CoP17' remains the goal.", "basis": "evidence", "sources": [{"url": "https://www.cambridge.org/core/journals/oryx/article/fungi-gaining-ground-at-recent-cbd-and-iucn-meetings/01866B1C43C9814E4322A0E3E957C078", "title": "Oryx, Mar 2025"}, {"url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024", "title": "Highlights from 2024"}]}, {"what": "Goal of at least 50 signatory nations by COP17 looks missed. A Jan 2026 Foundation brief states the goal with 13 signed; the campaign page and CBC say 14; one more commitment (Italy) was reported at COP17.", "year": 2026, "consequence": "About 15 of 50, or under a third, on the best reading. Signing pace was roughly one or two a year after the launch.", "how_handled": "No public acknowledgment of the shortfall found.", "basis": "evidence", "sources": [{"url": "https://assets.ffungi.org/Protecting_and_restoring_the_UK%E2%80%99s_fungi-FF.pdf", "title": "Protecting and restoring the UK's fungi, Jan 2026 (search snippet; my PDF read failed)"}, {"url": "https://www.ffungi.org/campaign/fungal-conservation-pledge", "title": "Fungal Conservation Pledge"}, {"url": "https://www.cbc.ca/news/science/cop17-fungi-9.7388560", "title": "CBC on COP17 (search result only)"}, {"url": "https://www.naturalworldfund.org.uk/cop17-fungi-global-biodiversity-conservation/", "title": "Natural World Fund, 30 Oct 2026"}]}, {"what": "No evidence yet of formal fungal recognition at COP17. COP17 runs 19 to 30 October 2026, so it closes today. I saw no dedicated fungi item in the SBSTTA-28 agenda summary, and a mid-conference CBD update on 14 decisions does not mention fungi. The Foundation's campaign page sets this as its target.", "year": 2026, "consequence": "Too early to call a miss. A miss would be the second consecutive COP with the same headline goal unmet.", "how_handled": "A side event on the pledge was scheduled for 26 Oct. Outcome statements not yet available.", "basis": "inference", "sources": [{"url": "https://www.cbd.int/article/2026-10-18-06-36-57", "title": "Spotlight on Yerevan (search snippet)"}, {"url": "https://www.cbd.int/meetings/SBSTTA-28", "title": "SBSTTA-28 documents (search snippet)"}, {"url": "https://www.ffungi.org/campaign/fungal-conservation-pledge", "title": "Fungal Conservation Pledge"}]}, {"what": "Los Cedros petition: the prior scan found an undated report that Ecuador's copyright office rejected it and that an appeal followed. My own search found no decision. This is listed as a 2024 achievement though no legal change is shown.", "year": 2024, "consequence": "As far as I can establish, there has been no legal recognition. Coverage was the main output. Furci is a named co-creator, so the claimed achievement overlaps with the CEO's own creative credit.", "how_handled": "No Foundation update on the rejection or the appeal was found.", "basis": "inference", "sources": [{"url": "https://www.ffungi.org/blog/los-cedros-cloud-forest-a-legal-first-for-natures-creative-rights", "title": "Los Cedros: a legal first"}, {"url": "https://www.cbc.ca/radio/asithappens/ecuador-forest-song-1.7368497", "title": "CBC As It Happens (search snippet)"}, {"url": "https://atmos.earth/did-nature-write-this-song-ecuador-deliberates-pivotal-case/", "title": "Atmos (from prior scan)"}]}, {"what": "The FY2024 Schedule O overstates the curriculum result. It says the proposal 'now includes' funga 'after years of advocacy', but a proposal under review is not a curriculum change. The 2024 recap expected next steps in 2025. The 2025 recap says only 'moving toward' integration.", "year": 2025, "consequence": "Two years on, no adoption found. The result reads larger in the filing than the record supports.", "how_handled": "Later reporting keeps forward-looking language without saying what happened at the CNED.", "basis": "evidence", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Schedule O (financial extract)"}, {"url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024", "title": "Highlights from 2024"}, {"url": "https://www.ffungi.org/blog/positive-fungal-news-from-last-year-to-start-this-2026", "title": "2025 recap"}]}, {"what": "The species count does not survive comparison across the Foundation's own pages: 45 fungi and lichens in the most recent 2019 classification on one page; 128 by 2019 in another account; 138 for two different things on the impact page.", "year": 2024, "consequence": "The organization's flagship numeric outcome cannot be relied on until reconciled against Ministry lists. The gap may reflect cumulative versus per-process counts [speculation].", "how_handled": "No correction found.", "basis": "evidence", "sources": [{"url": "https://www.ffungi.org/conservation", "title": "Fungal Conservation page"}, {"url": "https://ffungi.org/eng/our-impact", "title": "Our impact"}, {"url": "https://en.wikipedia.org/wiki/Giuliana_Furci", "title": "Giuliana Furci, Wikipedia (says 'over 80'; secondary)"}]}, {"what": "Smaller claims are inflated or unsupported. National Geographic's wildlife definition change has no external source. 'Lost for 40 years' is 36 per Re:wild. Schedule O lists launching the Tracker in FY2024, yet the 2023 recap says it launched then with 86 countries. Schedule O says 90 teachers, the recap says 90 teachers, professionals and students.", "year": 2024, "consequence": "The FY2024 achievement list cannot be taken at face value. Most errors favor the organization.", "how_handled": "None found.", "basis": "evidence", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Schedule O (financial extract)"}, {"url": "https://www.ffungi.org/blog/2023-recap-a-successful-year-working-for-the-fungi", "title": "2023 recap"}, {"url": "https://www.rewild.org/lost-species/found", "title": "Re:wild Lost Species Found"}, {"url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024", "title": "Highlights from 2024"}]}, {"what": "UK domestic law did not follow the pledge's direction. A secondary report says that in Dec 2025 the government rejected recommendations to protec
