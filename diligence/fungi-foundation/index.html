": "https://tellurideinside.com/2024/08/telluride-mushroom-festival-guiliana-furci-everywhere-you-want-to-be.html", "title": "Telluride Inside, 2024"}, {"url": "https://mckenna.academy/mka-podcast/bridging-fungi-science-and-mazatec-cultural-heritage-initiatives/", "title": "Brainforest Cafe, 2024"}, {"url": "https://www.ffungi.org/faq", "title": "FAQ"}, {"url": "https://www.ffungi.org/blog/national-geographic-society-supports-groundbreaking-project-in-chile", "title": "NatGeo Society post, 2026"}]}, "risk_and_growth": {"summary": "High appetite for reputational and intellectual risk. Low visible attention to financial risk. They pursue new words, treaty-level pledges outside the formal agenda, a forest as song co-author, and a campaign for COP17 adoption. Growth is geographic and institutional, not revenue-led: 10 staff in 2022, 15 listed now; new India and UK roles; work in Mongolia, Ecuador and Mexico. US expenses jumped from $200,323 in FY2021 to $538,181 in FY2023, then settled at $462,022, with revenue flat at $348,000 to $413,000 after FY2021. Evidence of a limit: the volunteer page says no new volunteers are being taken. No public risk statement, reserve policy or growth plan was found. Whether the board has discussed these in private is unknown.", "basis": "inference", "confidence": 0.7, "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153", "title": "ProPublica Nonprofit Explorer"}, {"url": "https://www.ffungi.org/team", "title": "Team page"}, {"url": "https://ffungi.org/blog/fungi-foundation-10-cycles-around-the-sun", "title": "10 cycles, 2022"}, {"url": "https://www.ffungi.org/volunteer-with-us", "title": "Volunteer page"}, {"url": "https://www.ffungi.org/campaign/fungal-conservation-pledge", "title": "Fungal Conservation Pledge"}]}, "theory_of_change": {"in_their_words": "'Language creates reality' (Furci, 2021). 'When a law is open to comment, anything can happen' (Furci, 2021). The team started by 'delimiting the language' and helped institutions adopt 'mycologically inclusive languages' (Furci, 2024). Fungi are 'a very important pathway to the conservation of natural spaces and natural habitats' (Furci, 2026). No written theory of change was found.", "theory_of_power": "Inference. Power sits in the vocabularies of institutions: treaty secretariats, ministries, the IUCN, National Geographic, curricula and dictionaries. A small expert group with legitimacy can shift these at low cost by waiting for open windows, supplying the text and borrowing state partners. Celebrity and media attention (Ferriss, Fantastic Fungi, Sheldrake's book) build public demand. The hire of a former Chilean CBD negotiator and Furci's IUCN committee role fit this model. It is an elite-institutional theory with a real record: Chile's law, CBD Secretariat endorsement and the UK-Chile pledge launch. Its untested link is the last one, from recognition to protection. Anders Dahlberg, quoted in Undark in 2021, called species laws 'meaningless without protection for the broader habitats'. Furci's 2026 habitat argument partly answers this, but no evidence was found that it has been tested.", "basis": "inference", "sources": [{"url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/", "title": "Ferriss transcript, 2021"}, {"url": "https://www.greenmatters.com/earth-day/giuliana-furci-fungi", "title": "Green Matters, 2024"}, {"url": "https://atmos.earth/podcast/giuliana-furci-is-your-guide-to-the-enchanting-world-of-fungi/", "title": "Atmos, 2026"}, {"url": "https://undark.org/2021/08/09/flora-fauna-and-funga/", "title": "Undark, 2021 (via scan)"}, {"url": "https://www.ffungi.org/team", "title": "Team page"}]}, "metaphors": [{"metaphor": "Mycelium and symbiosis as the model for the organization", "example": "Volunteers 'spread the mycelial message'; fungi as 'interconnectors of nature'; a donor category called 'symbiotic organization'.", "reveals": "A self-image of distributed, mutual, low-hierarchy work. It fits a remote team with many outside affiliations.", "hides": "Who controls what. Contracts, money flow between entities, and the fact that one person links two boards. Note: Furci's 2021 transcript uses mycelium for biology, not for the organization, so this is organizational copy, not a confirmed leadership metaphor.", "url": "https://www.ffungi.org/team"}, {"metaphor": "Justice and neglect", "example": "'bringing justice to the fungi' (Furci, 2021); 'neglected' (Furci, 2026).", "reveals": "The moral heat of the work. Fungi are treated as a wronged party, and parity becomes the remedy.", "hides": "Trade-offs. Parity sets no priority among species or places. It does not tell a donor what protection is worth per dollar.", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"metaphor": "Language as creation", "example": "'language creates reality' (Furci, 2021); 'kindom' preferred over 'kingdom' (philoSOPHIA, 2025, search snippet).", "reveals": "Why a term, a dictionary entry or a treaty clause counts as a win.", "hides": "The gap between naming and enforcement or habitat outcomes.", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"metaphor": "The ark", "example": "'the Noah's Ark of fungal solutions for the world' (Furci, 2021, on the Elders program).", "reveals": "Urgency about the loss of traditional knowledge, and a view of it as a global store.", "hides": "Who owns what goes aboard. It sits in tension with the later consent guidelines.", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"metaphor": "Exploration and firsts", "example": "'first NGO in the world'; 'Explore the Last Wild Places on Earth'; 'lost to science for 40 years'.", "reveals": "The attention model. Novelty draws press and sets the field's reference point.", "hides": "Maintenance work, partner contributions, and a growing field. Re:wild lists the same species as lost for 36 years.", "url": "https://ffungi.org/blog/fungi-foundation-10-cycles-around-the-sun"}, {"metaphor": "Service to a non-human client", "example": "'make durable change for the fungi' (Furci, 2021); a 2021 podcast host's framing of 'living in service to the fungi'.", "reveals": "A mission held above the organization and donors.", "hides": "Accountability. The client cannot complain, renew a grant or testify, so humans must define whether it has been served.", "url": "https://soundfood.libsyn.com/the-fungal-dimension-living-in-service-to-the-fungi-with-giuliana-furci"}, {"metaphor": "Decomposition", "example": "'we have to let things rot' (Furci, 2021); the film Let Things Rot.", "reveals": "Willingness to find value where others see waste. A long time horizon.", "hides": "Nothing clear in the record. Noted because no one applies it to the organization's own programs, such as ending one.", "url": "https://tim.blog/2021/07/29/giuliana-furci/"}], "figure_and_ground": {"always_in_frame": ["Firsts: first NGO, first country, first permanent exhibit, first conservation plan for a fungus. [evidence]", "The word funga and the 3F proposal. [evidence]", "Chile's 2012 law as founding proof. Furci named it as the proudest achievement in 2024. [evidence]", "Global institutions: UN CBD, IUCN, National Geographic, Harvard. [evidence]", "The founder's name and credentials on the org's own bio, press page and in media. [evidence]", "Elders and Indigenous knowledge, mostly described by the organization, not by community members. [evidence for the framing; community voices were not looked for separately]", "Counts: enrollments, countries, outlets, specimens. [evidence]"], "never_mentioned": ["Deficits, reserves and the decline in net assets: no public statement found in any source read. [evidence of absence in the sources read]", "The Chile money flow and how the entities relate: no explanation found. [evidence of absence]", "A failed program, ended project or stated mistake: none found in 25-odd sources. The nearest thing is the admission that informed consent had been missing from earlier shared material. [evidence of absence]", "Measures of conservation outcomes: none found. No baselines or evaluation. [evidence of absence]", "Named critics or opponents: none. Furci cites legislators' reluctance to change wording, without an adversary. [evidence]", "Other funders' names in annual retrospectives. [evidence]", "Succession or what happens after the founder: none found. [evidence of absence]", "Staff conditions, pay or contractor arrangements: none found. [evidence of absence]", "Competitors or overlap with SPUN, Plantlife or the Global Fungal Conservation Network as rivals for funds: not discussed. They are named only as partners. [evidence of absence, limited search]"]}, "contradictions": [{"said": "'we measure our success not in revenue of money in the bank, but of durable change' (Furci, 2021).", "done": "The impact page and Schedule O list outputs and counts: enrollments, outlets, signatories. No baseline, method or evaluation of durable change was found.", "significance": "The stated test has no public instrument. A donor cannot verify it from what is published.", "basis": "evidence", "sources": [{"url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/", "title": "Ferriss transcript, 2021"}, {"url": "https://ffungi.org/eng/our-impact", "title": "Our impact"}]}, {"said": "FY2024 Schedule O says Chile's curriculum update now includes funga, per the scan.", "done": "The organization's own 2024 highlights post says the proposal 'is currently under review by the National Education Council'. No approval found.", "significance": "A claim in a federal filing runs ahead of the organization's own blog. Small but checkable.", "basis": "evidence", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Schedule O (via scan)"}, {"url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024", "title": "Highlights 2024"}]}, {"said": "Schedule O lists the Los Cedros song petition among FY2024 achievements.", "done": "The organization's own post attributes the petition to the MOTH Collective. The Foundation's named role is co-hosting a side event. Furci is a named human co-creator of the song, per the scan.", "significance": "The line between organizational achievement and the founder's outside creative work is blurred. No compensation link was seen, and none is implied.", "basis": "evidence", "sources": [{"url": "https://www.ffungi.org/blog/los-cedros-cloud-forest-a-legal-first-for-natures-creative-rights", "title": "Los Cedros post, 2024"}, {"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Schedule O (via scan)"}]}, {"said": "The organization calls itself global, refers to an 'India Chapter' and says some sites are 'separate entities'.", "done": "The FY2024 990 answers No to related organizations and to chapters or affiliates, per the scan. It reports 2 employees.", "significance": "Possibly correct on narrow legal tests. But the public identity and the filed identity describe different things, and the donor cannot see the Chile flow.", "basis": "inference", "sources": [{"url": "https://www.greenmatters.com/earth-day/giuliana-furci-fungi", "title": "Green Matters, 2024"}, {"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Form 990 (via scan)"}, {"url": "https://www.ffungi.org/tax-and-legal-information", "title": "Tax and legal information"}]}, {"said": "Furci admires Jane Goodall's approach of 'leaving yourself out of the picture and focusing on what your mission is' (2021).", "done": "The organization's bio credits Furci personally with most achievements, such as 'her work triggered' the Chilean law. On its press page, 14 of about 75 headlines name Furci and none name other staff.", "significance": "This is an aspiration against an institutional habit, not a charge of vanity. Media favor founders, and 61 headlines do not name Furci. The bio is the organization's own choice, however.", "basis": "inference", "sources": [{"url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/", "title": "Ferriss transcript, 2021"}, {"url": "https://www.ffungi.org/meet-giuliana", "title": "Meet Giuliana"}, {"url": "https://www.ffungi.org/press", "title": "Press page"}]}, {"said": "Elders program as 'the Noah's Ark of fungal solutions for the world' (Furci, 2021). The impact page reports a map of 48 countries and 98 human groups.", "done": "By 2023 to 2025, guidelines require prior informed consent, and Furci says of the psilocybin history 'We decided we would never go down that route' (snippet).", "significance": "Could be real learning, not contradiction. It raises a practical question: was the existing map built to the later standard? No evidence found either way.", "basis": "inference", "sources": [{"url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/", "title": "Ferriss transcript, 2021"}, {"url": "https://ffungi.org/eng/our-impact", "title": "Our impact"}, {"url": "https://research.gold.ac.uk/id/eprint/39373", "title": "philoSOPHIA, 2025"}]}, {"said": "The organization calls the Fungal Conservation Pledge launched 'in collaboration with the Fungi Foundation', and an Atmos bio says Furci 'spearheaded' it.", "done": "Natural England confirms the UK-Chile launch without naming the Foundation, per the scan. A Natural World Fund post of 30 Oct 2026 credits its own Lead Scientist with work on Italy's commitment and does not name the Foundation.", "significance": "Others are also claiming credit, and outside confirmation of the Foundation's role is thin. The role may still be real: the pledge PDF is on its domain. Contribution is unproven, not disproven.", "basis": "inference", "sources": [{"url": "https://www.ffungi.org/campaign/fungal-conservation-pledge", "title": "Pledge page"}, {"url": "https://naturalengland.blog.gov.uk/2025/10/10/a-landmark-year-for-englands-fungi/", "title": "Natural England (via scan)"}, {"url": "https://www.naturalworldfund.org.uk/cop17-fungi-global-biodiversity-conservation/", "title": "Natural World Fund, 2026"}, {"url": "https://atmos.earth/podcast/giuliana-furci-is-your-guide-to-the-enchanting-world-of-fungi/", "title": "Atmos, 2026"}]}, {"said": "Stated numbers: species 'lost to science for 40 years'; pledge signed by 12, 13 or 14 countries in different documents; founding given as both 2010 and 2012 on one page.", "done": "Re:wild lists 36 years. Counts vary by page and date, partly from natural growth.", "significance": "Each is minor. The pattern is loose handling of numbers in the organization's own telling, always in the favorable or rounder direction where direction exists.", "basis": "evidence", "sources": [{"url": "https://www.rewild.org/lost-species/found", "title": "Re:wild Lost Species Found (via scan)"}, {"url": "https://ffungi.org/eng/our-impact", "title": "Our impact"}, {"url": "https://www.ffungi.org/campaign/fungal-conservation-pledge", "title": "Pledge page"}]}, {"said": "Furci in 2021 describes years of 'talking to senators, talking to members of parliament, producing briefs' for Chile's law. The team now includes policy leads.", "done": "The FY2024 990 answers No to lobbying, per the scan.", "significance": "Speculation only. The Chile effort predates the US entity, and current work may not meet the IRS definition. Ask how legislative contact abroad is tracked.", "basis": "speculation", "sources": [{"url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/", "title": "Ferriss transcript, 2021"}, {"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Form 990 (via scan)"}]}], "five_whys": [{"observation": "An organization in three straight deficit years publishes yearly retrospectives with no mention of money, funders or setbacks.", "chain": ["Why no money talk? The retrospectives are built as achievement lists (2022, 2024 and 2026 posts).", "Why achievement lists? Attention is the visible fundraising route. Funders came through a festival and a major podcast produced a $50,000 gift (Telluride 2024, Ferriss 2021).", "Why rely on attention? Furci says funding 'still hardly exists for anything fungal in terms of policy' (2021), so there is no established grantmaker category to report to.", "Why no such category? Fungi sat outside conservation frameworks. The Harvard conference summary, per snippet, says NatGeo's definition change unlocked research funding for mycologists.", "Why does that loop back? The recognition campaign is also the route to creating a funding field. Recognition is both mission and business model."], "insight": "Inference: public confidence is an operating asset here, so bad-news reporting feels costly. A donor who funds reporting and reserves buys something the current model does not reward on its own."}, {"observation": "Filings and pages credit the organization with outcomes where others also played a role or the result is unfinished: Los Cedros, the curriculum, the NatGeo definition, the pledge.", "chain": ["Why broad claims? Schedule O reports 17 achievements in a single list with no attribution of shares.", "Why no attribution? The chosen test is 'durable change', which is hard to measure over short periods.", "Why no measure? The work is upstream, where causation is shared among governments and coalitions (pledge page, NYU and Sheldrake partners).", "Why not report contribution anyway? No evaluation function or funder demand for one is visible. Named funders include vehicles (DAFs, Every.org) which typically ask little. That last part is inference.", "Why does it persist? Being first and being credited gives a small organization its standing with institutions and press."], "insight": "Inference: credit is standing in for measurement. This is not evidence of bad faith. The fix is cheap: a contribution-tracking log and a short list of outcome indicators, possibly built on the Fungal Conservation Tracker listed in Schedule O."}], "unmet_needs": [{"need": "Unrestricted reserves and a sustainable revenue base.", "level": "common", "evidence": "Net assets $82,068 at FY2024, about 2.1 months of expenses. Three deficits. No reserve policy found. FY2025 is unknown.", "donor_implication": "Multi-year general operating support is worth more than a project gift. Tie it to a board-approved reserve target and see current cash first."}, {"need": "Basic financial transparency: a CPA review or audit, and a consolidated US and Chile view.", "level": "common", "evidence": "990 answers No to a separate audit, per the scan. Statements are by written request. Chile's budget and transfers are not visible.", "donor_implication": "Make a reviewed or audited statement and a consolidated budget a gift condition, and offer to pay for it."}, {"need": "A legally clear structure for working across Chile, the US, the UK, India and Mexico.", "level": "context", "evidence": "2 employees against 15 listed staff. 'Chapter' language against 990 No answers. Conflict policy addressed to the board only, per Schedule O. Multiple affiliated staff.", "donor_implication": "Ask for the intercompany agreement, contractor map and whether conflict disclosures reach staff. Legal structuring could be funded."}, {"need": "Succession and depth beyond the founder.", "level": "context", "evidence": "Furci is the visible link between boards and the public voice. No succession plan found. Torres and Moreno show program depth.", "donor_implication": "Ask the board for a succession plan and fund a deputy or second public voice."}, {"need": "Evidence connecting recognition to protection.", "level": "activity", "evidence": "No outcome evaluation found. Dahlberg's critique (Undark, 2021). Furci's 2026 claim that fungi are a path to habitat protection is untested in what was read.", "donor_implication": "Fund a small, independent look at what Chile's 2012 law changed. It is the longest natural experiment they have."}, {"need": "A way to turn signatures and words into implemented national policy.", "level": "activity", "evidence": "Pledge of 14 countries with no binding force shown. MOU with Chile's Ministry 'upcoming' (Jan 2026). First conservation plan for a fungus in Chile still at groundwork stage (May 2026).", "donor_implication": "Fund implementation with named milestones, such as the loyo plan. Ask for a target list of national commitments after COP17."}, {"need": "Program focus: a rule for what they will stop or decline.", "level": "activity", "evidence": "Seventeen listed achievements in FY2024 on $350,354 program expense. Volunteer intake closed. No stated stopping decision found.", "donor_implication": "Ask which program they would close at a 20% lower budget. The answer is itself diligence."}, {"need": "Continued standing as the field's reference point as others enter it.", "level": "qualifier", "evidence": "Global Strategy launched at COP17 by other organizations, with more than 50 endorsers, per search results. Furci says fungi are 'no longer as neglected'. The first-mover identity is central in all self-description. Harvard and National Geographic credentials are prominent.", "donor_implication": "Do not treat 'first' as a reason to fund. Ask what they do that SPUN, Plantlife or the Global Fungal Conservation Network do not. Overlap with SPUN deserves explicit mapping."}], "leadership_dependency": {"verdict": "High. The organization has a developing identity of its own, but its public voice, access and structure still run through its founder.", "rationale": "Furci is the paid chief executive of the US entity and chair of the Chile board, with no other visible overlap between the boards. Furci is the only staff member named in press-page headlines (14 of about 75; no other staff). The organization's bio assigns most achievements personally. Counterweights: Torres served as executive director from 2017 for three years and is now a National Geographic Explorer leading a funded project. Moreno has been there since 2013. Olguín and Betanzo hold specialized roles. The 3F campaign is a coalition with NYU and Sheldrake, whose name carries its own weight. The 2017 to 2020 period is an underused precedent: the sequence is unclear, but the former director stays on staff. No succession plan was found. This reading rests on public materials, and internal delegation was not observed. The separate in-depth read covers the executive director.", "basis": "inference", "confidence": 0.7}, "cultural_tensions": ["First-and-alone identity against a field that is filling up. Furci says fungi are 'no longer as neglected', and other bodies launched the Global Strategy at COP17. Scarcity may no longer be the best story. [inference]", "Global ambition against a very small legal base: a $462,022 US budget and 2 US employees, with COP-level campaigns in several countries. [evidence on numbers; inference on strain]", "Recognition against protection. Wins are stated as words and signatures. The mission's stated end is a healthy planet. [inference]", "Knowledge as a resource for the world ('Noah's Ark', 'fungal solutions') against knowledge held by communities and protected by consent. The mission still promotes 'innovative solutions', and the team page includes a program lead whose stated vision is people reclaiming control 'through mushrooms'. How this fits with the refusal of the psilocybin route was not explained in sources read. [inference]", "Scientist against activist. Furci's public title includes 'fungal activist', while the organization's authority rests on science and its fungarium. Ecologist quotes Furci saying science and advocacy reinforce each other. No sign yet of conflict; worth watching as advocacy outpaces evidence. [inference]", "Celebrity reach against institutional discipline. Stamets, Sheldrake, Kelley and a Ferriss gift bring attention. Filing quality and financial reporting look less developed. [inference]", "Team language and founder credit. Furci speaks 'on behalf of the team and the board', while pages and press center on one name. [evidence on language; inference on tension]", "Volunteer-dependent history against professional staffing. Staff blog posts are bylined 'FFungi Staff and FFungi Volunteer', and the page credits volunteers and interns, yet only 2 are US employees. Paid-versus-unpaid boundaries are unclear. [evidence on bylines; inference on the rest]"], "failure_tells": [{"pattern": "Founder-centered identity without visible succession", "evidence": "Founder holds the US CEO and Chile chair roles. Other staff absent from press headlines. No succession plan found. Not the same as entrenchment: there is no evidence of the founder blocking anyone, and a former executive director remains on staff.", "basis": "inference", "sources": [{"url": "https://www.ffungi.org/board", "title": "Board page"}, {"url": "https://www.ffungi.org/press", "title": "Press page"}, {"url": "https://www.ffungi.org/team", "title": "Team page"}]}, {"pattern": "Good-news-only reporting during financial decline", "evidence": "Three deficit years with net assets down 78% from FY2021 to FY2024. The retrospectives covering the period mention neither. The 2024 highlights post and 2026 post have no thanks and no finances.", "basis": "evidence", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153", "title": "ProPublica"}, {"url": "https://www.ffungi.org/blog/positive-fungal-news-from-last-year-to-start-this-2026", "title": "Positive fungal news, 2026"}]}, {"pattern": "Claims rounding upward and filings ahead of facts", "evidence": "Curriculum 'now includes' against 'under review'. Forty years against 36. NatGeo definition change with no NatGeo document found; a Harvard conference summary repeats it per snippet, likely from Furci's own talk.", "basis": "evidence", "sources": [{"url": "https://www.ffungi.org/blog/another-fungal-year-highlights-from-2024", "title": "Highlights 2024"}, {"url": "https://www.rewild.org/lost-species/found", "title": "Re:wild (via scan)"}, {"url": "https://cswr.hds.harvard.edu/publications/plants-fungi-2025/fungal-furci", "title": "Harvard CSWR, search snippet"}]}, {"pattern": "Scope spreading faster than core finance", "evidence": "Mission covers exploring, solutions, education and policy. Activity now includes film, museums, an India chapter, a forest authorship petition and a loyo plan, while revenue has been flat since FY2022. This could be disciplined opportunism, not creep. Each item connects to the stated mission, so 'creep' is not yet shown.", "basis": "inference", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153/202523219349321402/full", "title": "FY2024 Schedule O (via scan)"}, {"url": "https://www.ffungi.org/vision-mission", "title": "Vision & Mission"}]}, {"pattern": "Outputs presented as impact, without hostility to measurement", "evidence": "Enrollments and counts stand in for outcomes. No statement against evaluation was found. This is absence of measurement, not resistance to it.", "basis": "inference", "sources": [{"url": "https://ffungi.org/eng/our-impact", "title": "Our impact"}]}, {"pattern": "Tells looked for and not found", "evidence": "No us-versus-them framing of critics. No named opponents at all. No donor flattery beyond a thank-you. No burnout language in sources read. No public staff grievance. No sign of a public response to criticism, because no criticism was found to respond to. Limited search, and a self-curated press page, weaken this.", "basis": "evidence", "sources": [{"url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/", "title": "Ferriss transcript, 2021"}, {"url": "https://www.ffungi.org/press", "title": "Press page"}]}], "ethics_note": "Used only public professional material: interviews, podcasts, published articles, organizational pages and filings. Individuals are named in their professional roles. Excluded on purpose: the personal, family, health and personal-substance-use passages of long interviews (including Ferriss), personal background not needed for a professional reading, private social media, and personal LinkedIn content. No diagnosis, typology or character verdict is offered. Readings of the founder are limited to how the organization works and are left for the separate in-depth section. Allegations: none were found, and none are reported. Ferriss's gift offer is cited as a public on-air professional exchange. Team page text about a named program lead is used only as an organizational statement.", "gaps": ["Method limit: page reads were done through a small extraction model, so quotes were not seen in full context. Check any quote against the source before reusing it.", "philoSOPHIA 2025: both PDFs would not parse. Only the abstract and search snippets were read, including 'We decided we would never go down that route'. This is the most valuable unread source.", "Harvard CSWR talk 'Fungal Activism and Sovereignty in Ethnomycology' (2025) and its conference summary: returned 403. Snippets only. CBC COP17 piece: 403, snippet only. FALTER 2025: paywalled, headline only.", "Other interviews not read in full: Mushroom Hour Ep. 28 and Ep. 86 (only show notes for Ep. 86), LifeWorlds, Plants of the Gods, Wonderstruck audio. Show notes are not her words.", "No newsletter, Substack, annual report, strategic plan, public donor letter or careers page found. No personal newsletter was searched for separately.", "Other leaders are barely present in public words. Nothing substantive from Foster, Lobo, Turner, Mendelsohn or Kuhar was found. Sheldrake was seen in search results only and writes mostly in another capacity. Stamets and Kelley speech on the Foundation not read. So 'leadership team' here is largely the founder plus organizational copy.", "Spanish-language corpus thin: La Tercera 2022 was read; El Mostrador and Chilean talks were not. Chile-based staff and community voices may read differently.", "Community voices: no independent statement by Mazatec partners, loyo harvesters or Sarayaku representatives was read.", "Employee perspective: one search found no reviews. No former staff accounts. Staff pay and conditions unknown.", "COP17 outcomes: conference coverage is days old. Formal adoption of the pledge, final signatory count and Italy's commitment (single source) are unconfirmed as of 30 Oct 2026.", "Dictionary claim: 'funga' in the Cambridge Dictionary is per The Ecologist and one Spanish-language article. The dictionary itself was not checked.", "Critics: one targeted search for criticism of the organization or the term found none. Academic literature was not searched in depth.", "Financial facts here come from earlier dossier steps and were not re-read. Schedules F and R remain unseen."]}, "leader": {"subject": {"name": "Giuliana Furci", "title": "Foundress, Executive Director and CEO, Fungi Foundation Inc. (titles vary by page; 'Chief Executive Director' on the FY2024 990). Also Chair, Chile board.", "since": "2012 per CV snippet and organization. A team page says Daniela Torres was executive director for three years from 2017. That sequence is unresolved.", "why_this_person": "Furci is both founder and executive director, so no choice between figures was needed. Furci is the paid US chief executive, the Chile board chair, and the only visible link between the two boards. No public words were found from the board chair, Joanna Foster. Those facts are evidence. The conclusion that Furci is the dominant figure is inference."}, "corpus": [{"title": "Mushroom Hour Ep. 28 (show notes only; no transcript)", "type": "podcast", "date": "2020-07-15", "url": "https://www.welcometomushroomhour.com/blogs/podcasts/ep-28-fungi-foundation-how-to-save-the-world-by-protecting-promoting-fungi-feat-giuliana-furci", "pressure_moment": false, "note": "Host's words only. No Furci quotes. Oldest dated item. Audio not heard."}, {"title": "The Urgency to Protect Fungi", "type": "signed_post", "date": "2020-09-16", "url": "https://www.ffungi.org/blog/the-urgency-to-protect-fungi", "pressure_moment": false, "note": "Furci byline. Field-case post with outside numbers such as IUCN listings. Sole authorship not confirmed."}, {"title": "Fungi Foundation Global", "type": "signed_post", "date": "2020-09-16", "url": "https://www.ffungi.org/blog/fungi-foundation-global", "pressure_moment": false, "note": "Furci byline but written in third person, including 'Furci explained'. Treated as an organizational voice carrying Furci's name."}, {"title": "Furci's Fungi Foundation goes global (Telluride Inside)", "type": "press_quote", "date": "2020-09-20", "url": "https://tellurideinside.com/2020/09/furcis-fungi-foundation-goes-global.html", "pressure_moment": false, "note": "Narration only, with no direct Furci quotes."}, {"title": "The Influence of Hallucinogenic Mushrooms on Christmas", "type": "signed_post", "date": "2020-12-22", "url": "https://www.ffungi.org/blog/the-influence-of-hallucinogenic-mushrooms-on-christmas", "pressure_moment": false, "note": "Title seen in the blog index only. Not read."}, {"title": "Tim Ferriss Show transcript", "type": "podcast", "date": "2021-08-05", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/", "pressure_moment": false, "note": "Longest source. First 100,000 of 101,325 characters read through extraction. Friendly host. Contains the live reply to a $50,000 offer."}, {"title": "Flora, fauna and funga (Undark)", "type": "press_quote", "date": "2021-08-09", "url": "https://undark.org/2021/08/09/flora-fauna-and-funga/", "pressure_moment": true, "note": "The only substantive outside challenge found. Dahlberg doubts Chile's law as a model. The article carries no reply from Furci."}, {"title": "CHV Noticias interview", "type": "interview", "date": "2021-09-24", "url": "https://www.chilevision.cl/noticias/a idelines and restoring an archive with a Mazatec family (2024-2025). [evidence]", "Explaining fungi to public audiences through metaphor. [evidence]", "Thanking a donor once on tape, then promising results. [evidence]", "Never described: managing staff, running a budget, preparing a board meeting, cutting costs. [evidence of absence in the sources read]"], "environments": ["Forests, Patagonia and remote field sites.", "Chile's Congress, as told in retrospect. COP16 and COP17 settings, as described by press.", "Festivals, especially Telluride ('I found my tribe there', 2021).", "Podcasts, university conferences, museums and art spaces.", "Never described: an office, a finance meeting, a board room."], "interactions": ["Fungi are treated as the client: 'works for the fungi' (2025).", "Legislators: described as a group, 'reticent' and unnamed.", "NGO allies: 'a group of NGOs', unnamed (2021).", "Mazatec guardians: a named family and shared management (2024).", "Board: thanked and listed by famous name in 2021. No account of the board advising or disagreeing.", "Staff: 'the team' or 'I got a team together'. Almost no staff are named in Furci's own speech. [evidence, within sources read]", "Donors: one live thank-you, plus Stamets funding the archive, per the culture read."], "objects": ["Words and terms: funga, 3F, 'mycologically inclusive language'.", "Laws, decrees, pledges and open letters.", "Field guides, fungarium, curriculum.", "Ethical guidelines (2023, revised 2025).", "An audio-visual archive of María Sabina recordings.", "Project budgets, spoken only for the archive and museum: $25,000, under $100,000, $250,000."], "present": ["Fungi as protagonists.", "Injustice and omission from language.", "Mentors, especially Jane Goodall.", "Ancestral knowledge holders.", "Long time horizons."], "absent": ["Organizational budget, deficits and reserves.", "Named opponents or critics.", "Staff departures and the 2017-2020 leadership period.", "Any account of a board disagreement.", "Evaluation results.", "A successor.", "The rejected Los Cedros petition, in Furci's own words (none found).", "Any reply to Dahlberg's critique."]}, "figure_and_ground": {"always_center": ["The fungal kingdom as a neglected party owed recognition.", "Language as the lever that changes everything downstream.", "Chile's law as the proof case: 'proudest' in 2024 and retold in nearly every long interview.", "Being first: 'the world's first NGO'."], "never_appears": ["The organization's own financial condition. No Furci statement was found on three deficits or on net assets falling to $82,068.", "Staff as named actors in Furci's own speech. Torres, Moreno and Kuhar are absent from the extracted passages of the Ferriss transcript.", "The organization's own power, such as what a small NGO's backing or refusal can do. The exception is the consent discussion, which touches it.", "A mistake in strategy or management. The only self-correction concerns ethics.", "What happens when the founder is not there."]}, "metaphors": [{"metaphor": "Service to a client: working 'for the fungi'", "example": "'works for the fungi'", "date": "2025-07-24", "reveals": "A mission loyalty above the institution. The accountable party is the organism.", "hides": "Fungi cannot review the work. The people who can, donors, board and communities, drop out of the sentence.", "url": "https://newhumanist.org.uk/articles/meet-the-fungi-finders/"}, {"metaphor": "Language as reality", "example": "'language creates reality'", "date": "2021-08-05", "reveals": "The whole theory of change: name it, then institutions, money and law follow.", "hides": "The distance from recognition to protection on the ground. That is exactly what Dahlberg questions.", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"metaphor": "Rescue vessel", "example": "'the Noah's Ark of fungal solutions for the world'", "date": "2021-08-05", "reveals": "Urgency and a preservation instinct: collect everything before it is lost.", "hides": "Who consented to boarding. By 2024-2025 Furci is raising that very question about this work.", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"metaphor": "Hidden structural ingredient", "example": "'The fungi are like the egg in a cake.'", "date": "2021-08-05", "reveals": "A gift for making an abstract idea stick with lay audiences.", "hides": "Nothing harmful. It shows the repertoire is built for persuasion, not for measurement.", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"metaphor": "Medical diagnosis", "example": "'like trying to diagnose a disease without doing a blood test'", "date": "2024-10-18", "reveals": "A shift to a policy audience. Fungi are presented as missing information for decision makers.", "hides": "A blood test implies a treatment. The pledge shown has no demonstrated binding force.", "url": "https://www.salon.com/2024/10/18/fungi-deserve-same-protections-as-plants-and-animals-conservationists-argue/"}, {"metaphor": "Decay as renewal", "example": "'The death of a life form isn't the end of life'", "date": "2021-08-05", "reveals": "Comfort with endings at the level of nature and a very long view.", "hides": "Speculation: the frame could soften how institutional decline is seen. It has not been seen applied to the organization.", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"metaphor": "Collaboration over competition", "example": "'el éxito para la sobrevivencia está en la colaboración y no en la competencia'", "date": "2021-09-24", "reveals": "An instinct for coalitions, consistent with co-signed letters and shared project management.", "hides": "Credit and control. Co-founders, partners and a global strategy led by others all compete for the same recognition.", "url": "https://www.chilevision.cl/noticias/alerta-climatica/giuliana-furci-micologa-los-hongos-demuestran-que-el-exito-de-la-sobrevivencia-esta-en-la-colaboracion-y-no-en-la-competencia-2/"}, {"metaphor": "Community as kin", "example": "'I found my tribe there.'", "date": "2021-08-05", "reveals": "Fundraising and alliance run through a shared subculture.", "hides": "Concentration. A funding base built on one festival community has limited reach. That is inference.", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}], "normative_and_charged": [{"passage": "'Fungi must be incorporated into law-making and decision-making'", "date": "2022-12-14", "kind": "normative", "reading": "The 'must' clusters on institutions outside the organization. Inference from the open letter and the COP texts. Co-signed, so not Furci's sole wording.", "url": "https://www.ffungi.org/blog/open-letter-on-the-crucial-role-of-fungi-in-preserving-and-enhancing-biodiversity-2"}, {"passage": "'To conserve a fungus, you need to conserve its habitat.'", "date": "2021-10-27", "kind": "normative", "reading": "A clear rule, published two months after Dahlberg's habitat critique. Evidence for the timing. No evidence links the two, and Furci may have held this view all along.", "url": "https://www.slowdown.media/article/fungi-foundation-giuliana-furci"}, {"passage": "'It takes a long time and it's okay for it to take a long time.'", "date": "2021-08-05", "kind": "normative", "reading": "Patience stated as a principle. It sets the frame a donor should expect around slow results.", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"passage": "'being complicit to sharing information that had been obtained without informed consent'", "date": "2024-08-26", "kind": "emotionally_charged", "reading": "The strongest moral word in the corpus, and it points at Furci's own program. This is where the earlier 'collect everything' frame breaks. Auto-transcribed.", "url": "https://mckenna.academy/mka-podcast/bridging-fungi-science-and-mazatec-cultural-heritage-initiatives/"}, {"passage": "'most of the relationships we had documented were collected without free, prior, informed consent'", "date": "2025-05", "kind": "emotionally_charged", "reading": "Plain and first person plural. Read through a search excerpt only, so check against the full transcript.", "url": "https://cswr.hds.harvard.edu/publications/plants-fungi-2025/fungal-furci"}, {"passage": "'We decided we would never go down that route.'", "date": "2025-08-04", "kind": "normative", "reading": "A rare statement of a decision, made as a refusal, about the psilocybin history. From an excerpt.", "url": "https://eprints.whiterose.ac.uk/id/eprint/230152/"}, {"passage": "'actually facing the injustice of not mentioning them'", "date": "2026-03-31", "kind": "emotionally_charged", "reading": "Omission of fungi is described as injustice, not as an oversight. The charge is moral but aimed at no named person.", "url": "https://atmos.earth/podcast/giuliana-furci-is-your-guide-to-the-enchanting-world-of-fungi/"}, {"passage": "'Or I could use my life's effort to make sure that nobody else would ever be faced with that decision again.'", "date": "2021-08-05", "kind": "emotionally_charged", "reading": "The founding story, told as a vow rather than a job. This supports a reading of high identity fusion. Inference.", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}], "contradictions": [{"said": "'we measure our success not in revenue of money in the bank, but of durable change' (2021).", "did_or_showed": "Net assets fell from $372,077 (FY2021) to $82,068 (FY2024), about 2.1 months of expenses. No Furci statement on this was found.", "significance": "Durable change needs an institution that lasts. The frame may be right as a value, but it leaves the institution's own durability outside the success test.", "basis": "inference", "sources": [{"url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/", "title": "Ferriss transcript, 2021"}, {"url": "https://projects.propublica.org/nonprofits/organizations/851478153", "title": "ProPublica"}]}, {"said": "'It takes a long time and it's okay for it to take a long time' (2021).", "did_or_showed": "The scan infers about 18 months of runway at the FY2024 deficit rate. No FY2025 data is available.", "significance": "A horizon measured in decades sits on a balance sheet measured in months. Furci has not been found addressing this gap in public. FY2025 could have changed the arithmetic.", "basis": "inference", "sources": [{"url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/", "title": "Ferriss transcript, 2021"}, {"url": "https://projects.propublica.org/nonprofits/organizations/851478153", "title": "ProPublica"}]}, {"said": "'absolutely no funding existed at all' (2021, on the founding era). Funding for fungal work still barely exists, per the same passage.", "did_or_showed": "By 2026: 'fungi are no longer as neglected as they once were.' Furci also said at Harvard in 2025, per a search excerpt, that the National Geographic definition change unlocked research funding. No figures accompany these claims.", "significance": "Both claims can be true over time. A donor should ask which story applies now and whether more money for the field reaches this organization. The FY2022-FY2024 revenue was flat.", "basis": "inference", "sources": [{"url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/", "title": "Ferriss transcript, 2021"}, {"url": "https://theecologist.org/2026/sep/17/scientists-push-fungi-protection", "title": "The Ecologist, 2026"}, {"url": "https://cswr.hds.harvard.edu/publications/plants-fungi-2025/fungal-furci", "title": "Harvard talk, search excerpt"}]}, {"said": "In Furci's own account, the Chile law was collective: 'we went forward to Congress with a group of NGOs' (2021).", "did_or_showed": "Furci-bylined and organizational text credits one person: 'Under the leadership of the NGO's founder' (2020), and the bio says Furci's work triggered the inclusion. The bio dates it 2014, while Furci and others place the motion in 2012.", "significance": "Furci's spoken credit is more shared nforest Cafe, 2024"}, {"url": "https://ffungi.org/eng/our-impact", "title": "Our impact"}]}, {"said": "Furci, Harvard 2025 excerpt: 'almost 30 countries' have incorporated the word at some level of policy.", "did_or_showed": "No list was found. The same organization's pledge count is 14 countries, a different measure. A global fungal strategy launched at COP17 is reported without naming the Foundation, under leaders Greg Mueller and Cátia Canteiro.", "significance": "Influence is real but its size is self-reported. It may also be shared more widely than Furci's telling suggests. 'At some level' is a loose standard. Ask for the list.", "basis": "inference", "sources": [{"url": "https://cswr.hds.harvard.edu/publications/plants-fungi-2025/fungal-furci", "title": "Harvard talk, search excerpt"}, {"url": "https://www.ffungi.org/campaign/fungal-conservation-pledge", "title": "Pledge page"}, {"url": "https://news.mongabay.com/short-article/2026/10/fungi-now-have-a-global-conservation-strategy/", "title": "Mongabay, Oct 2026"}]}], "eras": [{"period": "2010-2019", "label": "Chilean founder and advocate", "voice": "Almost no contemporaneous record was retrievable. The era is known through later retelling, which favors the Chile law. The 2014 CV would not parse.", "specificity": "same", "candor": "same", "example_quote": null, "sources": [{"url": "https://files.speciesconservation.org/grant-files/biographies/biography-10227.pdf", "title": "2014 CV-type biography (unreadable)"}]}, {"period": "2020-2021", "label": "Going global, telling the origin story", "voice": "Warm, vivid and metaphor-rich, aimed at new US audiences as the US entity starts. Specific about the law's process. Silent on budget.", "specificity": "more", "candor": "same", "example_quote": "founding the world's first NGO in a world where absolutely no funding existed at all", "sources": [{"url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/", "title": "Ferriss transcript, 2021"}, {"url": "https://www.ffungi.org/blog/fungi-foundation-global", "title": "Fungi Foundation Global, 2020"}]}, {"period": "2022-2023", "label": "Coalition and treaty voice", "voice": "More institutional. Co-signed letters and public-science talks. 'Must' language directed at treaties. Few cases.", "specificity": "less", "candor": "same", "example_quote": "It's time we give them the attention they deserve", "sources": [{"url": "https://www.ffungi.org/blog/open-letter-on-the-crucial-role-of-fungi-in-preserving-and-enhancing-biodiversity-2", "title": "Open letter, 2022"}, {"url": "https://www.kcur.org/health/2023-06-21/fungi-mushrooms-last-of-us-cordyceps-mycology-giuliana-furci", "title": "KCUR, 2023"}]}, {"period": "2024-2025", "label": "Ethical reckoning alongside policy peak", "voice": "Two tracks. Press around COP16 is confident. Conversations with specialist audiences are the most self-questioning of the record, naming complicity and consent. Project dollars appear for the first time.", "specificity": "more", "candor": "more", "example_quote": "being complicit to sharing information that had been obtained without informed consent", "sources": [{"url": "https://mckenna.academy/mka-podcast/bridging-fungi-science-and-mazatec-cultural-heritage-initiatives/", "title": "Brainforest Cafe, 2024"}, {"url": "https://cswr.hds.harvard.edu/publications/plants-fungi-2025/fungal-furci", "title": "Harvard talk, search excerpt"}, {"url": "https://eprints.whiterose.ac.uk/id/eprint/230152/", "title": "Mycorrhizal Movements"}]}, {"period": "2026", "label": "Elder of a field that is arriving", "voice": "Settled and more senior: 'an oldie in the space'. Press quotes sound more institutional, with progress framed as momentum. Thin sample and largely press excerpts.", "specificity": "less", "candor": "less", "example_quote": "I'm very proud to be an oldie in the space.", "sources": [{"url": "https://atmos.earth/podcast/giuliana-furci-is-your-guide-to-the-enchanting-world-of-fungi/", "title": "Atmos, 2026"}, {"url": "https://theecologist.org/2026/sep/17/scientists-push-fungi-protection", "title": "The Ecologist, 2026"}]}], "five_whys": [{"observation": "Furci publicly names an ethics failure in the organization's own work, but no public statement on its finances was found.", "chain": ["Why name consent? Because it breaches the mission's own standard: 'being complicit' (2024).", "Why is the mission the standard? Furci's stated ideal is 'really, really leaving yourself out of the picture and focusing on what your mission is' (2021).", "Why does money not trigger the same test? Money is explicitly placed outside it: 'not in revenue of money in the bank' (2021).", "Why no public account to donors? Funding is experienced as relationship: 'most sustaining funders through the Telluride Mushroom Festival' (2024).", "Why might deficits not register as failure in public? Scarcity is the founding condition: 'absolutely no funding existed at all' (2021). [inference, not stated by Furci]"], "insight": "Inference: Furci's conscience answers to fungi and knowledge holders. Donors should not read silence on money as concealment, nor expect disclosure unasked. The test is whether Furci can apply the 2024 candor to the balance sheet."}, {"observation": "Nearly every claimed win is an act of naming or recognition: a law, a term, a pledge, a definition.", "chain": ["Why words? 'language creates reality' (2021).", "Why start there practically? 'We will never be able to create funding streams for their research' without recognition (2021).", "Why is that an achievable lever for a small NGO? Rule changes are rare openings: 'when a law is open to comment, anything can happen' (2021).", "Why does it recur? It worked and is 'The inclusion of fungi in the environmental legislation in Chile', the proudest result (2024).", "Why does it stop short of outcomes? Implementation belongs to governments. 'To conserve a fungus, you need to conserve its habitat' (2021) sets a test the organization cannot itself meet. [inference]"], "insight": "Inference: a donor is funding door-opening, which is cheap and leveraged. That is a good bet if the doors lead somewhere. Furci has given no public measure of what lies behind them. The honest question is how the organization would know if funga recognition did nothing."}], "needs": [{"need": "Sustain the organization's basic operation", "level": "common", "explicit": false, "evidence": "Three deficits and flat revenue. The US chapter was opened 'to facilitate access to funding' (2020).", "from_whom": "donors"}, {"need": "Fund work where no funding category exists yet", "level": "context", "explicit": true, "evidence": "'We will never be able to create funding streams' without recognition (2021).", "from_whom": "donors and institutions"}, {"need": "Recognize fungi in formal language", "level": "context", "explicit": true, "evidence": "'helped countries and organizations to adopt mycologically inclusive languages' (2024).", "from_whom": "governments, treaty bodies, publishers, the public"}, {"need": "Finance discrete rescues fast", "level": "activity", "explicit": true, "evidence": "'find the funding to hang in and then move this archive before it was lost' (2024); $250,000 museum goal.", "from_whom": "donors, festival and podcast communities"}, {"need": "Give cover and judgment on the money", "level": "activity", "explicit": false, "evidence": "Finance is absent from Furci's speech. Schedule O shows the Treasurer reviewing the 990 before an emailed board approval. [inference]", "from_whom": "board and Treasurer, Finance Director"}, {"need": "Carry programs without the founder in the frame", "level": "activity", "explicit": false, "evidence": "Torres leads the loyo plan with a named National Geographic post (2026). Press otherwise follows Furci. [inference]", "from_whom": "senior staff"}, {"need": "Trust the slow pace", "level": "qualifier", "explicit": true, "evidence": "'It takes a long time and it's okay' (2021).", "from_whom": "donors and board"}, {"need": "Respect consent limits, even when they constrain publication", "level": "qualifier", "explicit": true, "evidence": "'We decided we would never go down that route' (2025, excerpt).", "from_whom": "donors, researchers and partners"}, {"need": "Keep the relationship warm and personal", "level": "qualifier", "explicit": false, "evidence": "'I found my tribe there' (2021) and the Telluride funder statement (2024). [inference]", "from_whom": "donors"}], "empathy_gap": {"rating": "connected", "rationale": "On fungi, field sites and knowledge holders Furci writes from the territory: named places, a named family, 'many months of the year walking', and the Empedrado work after the 2017 fires as told by the organization. Furci's own later framing shows one vacuum episode, since excerpts say the first guidelines came without consulting Indigenous peoples, and it was self-identified. The drift is not toward communities but toward the institution. On staff, money and internal operations, the public record is close to blank. Community views of Furci were not found, so this rating rests on Furci's own account.", "basis": "inference"}, "profile": {"self_concept": {"summary": "Furci casts themself as a servant of an organism and a first mover, then a field elder. The role is more vow than job. It moved from founder with a story (2020-21) to a senior voice in a growing field (2026). The word 'manager' or anything like it does not appear.", "quotes": [{"quote": "My life's work has been to move the perception of fungi away from 'the three Ds'", "date": "2025-07-24", "context": "Magazine profile", "url": "https://newhumanist.org.uk/articles/meet-the-fungi-finders/"}, {"quote": "I'm very proud to be an oldie in the space.", "date": "2026-03-31", "context": "Atmos podcast", "url": "https://atmos.earth/podcast/giuliana-furci-is-your-guide-to-the-enchanting-world-of-fungi/"}, {"quote": "really, really leaving yourself out of the picture and focusing on what your mission is", "date": "2021-08-05", "context": "What Furci admires and strives for, on Jane Goodall", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}], "basis": "evidence", "confidence": 0.8}, "decision_style": {"summary": "Decisions appear as binary moral or life choices, then long persistence. Furci rarely describes consultation. When 'we' decides, the 'we' is unnamed. Openings are seized opportunistically. No account of a contested internal decision was found. Whether the board or staff shape calls is unknown.", "quotes": [{"quote": "My choice was I could leave Chile and I could go back to England.", "date": "2021-08-05", "context": "Origin decision", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"quote": "when a law is open to comment, anything can happen.", "date": "2021-08-05", "context": "Why the 2010 revision was an opening", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"quote": "We decided we would never go down that route.", "date": "2025-08-04", "context": "Psilocybin history, search excerpt", "url": "https://eprints.whiterose.ac.uk/id/eprint/230152/"}], "basis": "inference", "confidence": 0.55}, "risk_appetite": {"summary": "Strategic and reputational risk: high, in pursuit of first-of-kind moves. These include a word as a policy tool, a pledge outside the formal agenda, a forest as co-author. Ethical risk: increasingly cautious, including a self-imposed refusal on psilocybin-era disclosure. Financial risk: never discussed, but spending exceeded revenue for three years. Legal risk taken is mostly petition, not conflict.", "quotes": [{"quote": "If this pledge is adopted by the CBD, it will introduce a new opportunity for decision-making, a new way of seeing", "date": "2024-10-18", "context": "Pledge bet; Guardian via Salon", "url": "https://www.salon.com/2024/10/18/fungi-deserve-same-protections-as-plants-and-animals-conservationists-argue/"}, {"quote": "We do not talk about edibility.", "date": "2025-08-04", "context": "Limit on the ethnomycology work, per excerpt", "url": "https://eprints.whiterose.ac.uk/id/eprint/230152/"}], "basis": "inference", "confidence": 0.65}, "absorbing_loss": {"summary": "Split pattern. On ethics Furci owns the loss and changes practice. On program and money the record is silence. No Furci statement was found on the reported Los Cedros rejection or the deficits. Evidence on the pay side: CEO compensation on the 990s fell from $91,035 to $58,336 over two years, with no reason found. Speculation only: the leader may be absorbing the shortfall personally. It may equally reflect time split or pay elsewhere. No sign of blaming anyone was found.", "quotes": [{"quote": "most of the relationships we had documented were collected without free, prior, informed consent", "date": "2025-05", "context": "Harvard talk, search excerpt", "url": "https://cswr.hds.harvard.edu/publications/plants-fungi-2025/fungal-furci"}, {"quote": "The death of a life form isn't the end of life", "date": "2021-08-05", "context": "About decomposition, not about the organization", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}], "basis": "evidence", "confidence": 0.6}, "criticism_and_dissent": {"summary": "Largely untested. Very little criticism of Furci or the organization exists to respond to. Doubt is told as an obstacle overcome. The one substantive critique, from Dahlberg in 2021, drew no recorded reply, though Furci also stresses habitat before and since. Furci criticizes the field's history, without naming a living opponent. No internal dissent was found: no staff, union or board conflict. That does not mean none existed. Reading: absent rather than defensive.", "quotes": [{"quote": "What are you doing? Why? Why would you do that?", "date": "2021-08-05", "context": "How others reacted to the work", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"quote": "To conserve a fungus, you need to conserve its habitat.", "date": "2021-10-27", "context": "Two months after Undark. No stated link to it.", "url": "https://www.slowdown.media/article/fungi-foundation-giuliana-furci"}], "basis": "inference", "confidence": 0.5}, "under_pressure": {"summary": "The record has no classic crisis, such as a layoff, lawsuit or scandal. Two moments stand in. First, the Mazatec archive emergency: Furci turned to a concrete plan, a team, a crowdfund and a dollar estimate. Words became more specific, not less. Second, the consent problem: Furci responded with guidelines written from 2018 per an excerpt, released 2023, revised 2025, and public acknowledgment later. Words in the deficit years were not found to change at all. Under project pressure Furci gets concrete. Under institutional pressure the public record goes quiet.", "quotes": [{"quote": "we'd calculated that we needed about $25,000 to do the whole job.", "date": "2024-08-26", "context": "Archive rescue", "url": "https://mckenna.academy/mka-podcast/bridging-fungi-science-and-mazatec-cultural-heritage-initiatives/"}, {"quote": "I got a team together to start putting, like looking at a crowdfunding campaign.", "date": "2024-08-26", "context": "Response to the guardian's request for help", "url": "https://mckenna.academy/mka-podcast/bridging-fungi-science-and-mazatec-cultural-heritage-initiatives/"}], "basis": "evidence", "confidence": 0.6}, "money_and_donors": {"summary": "Money is a tool and a scarcity story. Gratitude is direct and unembellished, and is paired with a promise of mission results rather than metrics. Dollars appear at project level, with an unusually plain 'under $100,000'. Donors appear as members of a community or, in one exchange, as someone to make proud. The budget, reserve, cost of operating and overhead never appear. Note: 'We've never had support like that before' is a live statement about a $50,000 offer. Whether that was strictly accurate cannot be tested from the filings, since FY2021 gifts are not itemized and the offer's receipt is unconfirmed.", "quotes": [{"quote": "We've never had support like that before.", "date": "2021-08-05", "context": "Reply to Ferriss's $50,000 offer", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"quote": "I hope to make you proud and we will make durable change for the fungi.", "date": "2021-08-05", "context": "Same exchange", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"quote": "The Fungi Foundation has found its most sustaining funders through the Telluride Mushroom Festival.", "date": "2024-08-04", "context": "Local press", "url": "https://tellurideinside.com/2024/08/telluride-mushroom-festival-guiliana-furci-everywhere-you-want-to-be.html"}, {"quote": "under $100,000, but quite a lot of money that has enabled us to clean back up.", "date": "2024-08-26", "context": "Archive funds to date", "url": "https://mckenna.academy/mka-podcast/bridging-fungi-science-and-mazatec-cultural-heritage-initiatives/"}], "basis": "evidence", "confidence": 0.7}, "power_and_relationships": {"summary": "Toward the board: thankful, name-forward, describing prominence rather than oversight. Toward allies: shares credit in speech, including NGOs and co-authors, and a family named as co-manager. Toward government: patient persuader, not adversary. Toward staff: rarely named. Written institutional text centers the founder more than Furci's speech does. Its 'The Fungi Foundation manages this project together with the family' is a notable power-sharing claim, unverified from the family's side.", "quotes": [{"quote": "The organization is blessed to have Paul Stamets on its board", "date": "2021-08-05", "context": "Board described by name", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"quote": "we went forward to Congress with a group of NGOs and made the case.", "date": "2021-08-05", "context": "Chile law; collective credit", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"quote": "The Fungi foundation manages this project together with the family.", "date": "2024-08-26", "context": "Mazatec archive", "url": "https://mckenna.academy/mka-podcast/bridging-fungi-science-and-mazatec-cultural-heritage-initiatives/"}], "basis": "inference", "confidence": 0.6}, "time_horizon_and_growth": {"summary": "Horizon is decades and generational. Growth is framed as reach, recognition and field-building, never as revenue or headcount. No growth plan or end state was found. Furci welcomes other organizations entering the field, which reads as field-first rather than empire-first, and it also raises an unaddressed question about this organization's niche.", "quotes": [{"quote": "It takes a long time and it's okay for it to take a long time.", "date": "2021-08-05", "context": "Pace of change", "url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/"}, {"quote": "I've been working for the fungi for almost 26 years now", "date": "2026-03-31", "context": "Tenure", "url": "https://atmos.earth/podcast/giuliana-furci-is-your-guide-to-the-enchanting-world-of-fungi/"}, {"quote": "more and more organisations are working to give fungi the recognition they deserve.", "date": "2026-09-17", "context": "Field growth", "url": "https://theecologist.org/2026/sep/17/scientists-push-fungi-protection"}], "basis": "evidence", "confidence": 0.75}}, "candor_index": {"items_read": 23, "failures_named": 2, "embarrassing_numbers_named": 0, "admitted_mistakes": 1, "note": "Count covers 23 usable items of the 31 listed; the rest were unread, show notes or third-party. Failures: documented relationships collected without consent (2024, 2025); guidelines developed without consulting Indigenous peoples (2025). The second is the one admitted mistake, and its source is a fragmentary excerpt reported as expressing regret. Numbers: none about the organization's condition. 'Under $100,000' for the archive was treated as plain disclosure, not an embarrassment. Nearly all candor sits with specialist audiences, and none concerns money, staff or strategy. The count likely understates, since many podcasts could not be read and full texts were read through an extraction tool. The audience is also skewed toward friendly hosts."}, "strengths": [{"pattern": "Self-correction on ethics, in public, about their own work", "evidence": "Moved from 'map every known' use (2021) to naming complicity (2024) and missing consent (2025), and produced guidelines revised in 2025. Few leaders volunteer this.", "basis": "evidence", "sources": [{"url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/", "title": "Ferriss, 2021"}, {"url": "https://mckenna.academy/mka-podcast/bridging-fungi-science-and-mazatec-cultural-heritage-initiatives/", "title": "Brainforest, 2024"}, {"url": "https://cswr.hds.harvard.edu/publications/plants-fungi-2025/fungal-furci", "title": "Harvard talk, excerpt"}]}, {"pattern": "Persistence on a single idea", "evidence": "Same thesis across 2021-2026: recognition in language opens protection. Backed by an independently reported Chile law. Also 'almost 26 years' in the field.", "basis": "evidence", "sources": [{"url": "https://undark.org/2021/08/09/flora-fauna-and-funga/", "title": "Undark, 2021"}, {"url": "https://atmos.earth/podcast/giuliana-furci-is-your-guide-to-the-enchanting-world-of-fungi/", "title": "Atmos, 2026"}]}, {"pattern": "Coalition instinct and field-first posture", "evidence": "Co-signed letter with Sheldrake, Kiers and others (2022). Credits a group of NGOs for the law. Welcomes more organizations (2026). No us-versus-them aimed at critics or rivals was found.", "basis": "evidence", "sources": [{"url": "https://www.ffungi.org/blog/open-letter-on-the-crucial-role-of-fungi-in-preserving-and-enhancing-biodiversity-2", "title": "Open letter"}, {"url": "https://theecologist.org/2026/sep/17/scientists-push-fungi-protection", "title": "The Ecologist, 2026"}]}, {"pattern": "Concrete under project pressure", "evidence": "The archive account gives a budget estimate, sum raised and a goal. Rare among sources but shows the skill exists.", "basis": "evidence", "sources": [{"url": "https://mckenna.academy/mka-podcast/bridging-fungi-science-and-mazatec-cultural-heritage-initiatives/", "title": "Brainforest, 2024"}]}, {"pattern": "Unusual communication reach for the budget", "evidence": "Vivid, repeated framing has carried into Guardian-syndicated, CBC and E360 pieces. Inference on the cause: media appeal also comes from the novelty of the topic.", "basis": "inference", "sources": [{"url": "https://www.salon.com/2024/10/18/fungi-deserve-same-protections-as-plants-and-animals-conservationists-argue/", "title": "Salon/Guardian"}, {"url": "https://e360.yale.edu/features/fungi-kingdom", "title": "E360, 2026"}]}], "warning_patterns": [{"pattern": "Silence on institutional trouble", "evidence": "No Furci statement found on three deficit years, a 78% fall in net assets, or a pay drop. Long interviews in 2024 and 2026 pass over the finances, though hosts may not have asked.", "basis": "evidence", "sources": [{"url": "https://projects.propublica.org/nonprofits/organizations/851478153", "title": "ProPublica"}, {"url": "https://atmos.earth/podcast/giuliana-furci-is-your-guide-to-the-enchanting-world-of-fungi/", "title": "Atmos, 2026"}]}, {"pattern": "Identity fused with the organization", "evidence": "'my life's effort' (2021), 'My life's work' (2025), a Furci byline on third-person text praising the founder (2020), the chair and CEO roles combined across entities.", "basis": "inference", "sources": [{"url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/", "title": "Ferriss, 2021"}, {"url": "https://www.ffungi.org/blog/fungi-foundation-global", "title": "Fungi Foundation Global"}, {"url": "https://www.ffungi.org/board", "title": "Board page"}]}, {"pattern": "Recognition stands in for outcome", "evidence": "'proudest' is a legal inclusion. 'Almost 30 countries' at 'some level of policy'. No Furci statement of a measured conservation result was found. Furci's own habitat rule implies a harder test.", "basis": "inference", "sources": [{"url": "https://www.greenmatters.com/earth-day/giuliana-furci-fungi", "title": "Green Matters, 2024"}, {"url": "https://cswr.hds.harvard.edu/publications/plants-fungi-2025/fungal-furci", "title": "Harvard talk, excerpt"}]}, {"pattern": "Firsts and superlatives, loosely dated", "evidence": "Law year varies: bio says 2014, others 2012 or 2013. 'First' is a constant claim, even as the claim of primacy is hard to test. Direction is favorable. Each slip is small.", "basis": "evidence", "sources": [{"url": "https://www.ffungi.org/meet-giuliana", "title": "Meet Giuliana"}, {"url": "https://undark.org/2021/08/09/flora-fauna-and-funga/", "title": "Undark, 2021"}]}, {"pattern": "Stale repertoire risk", "evidence": "Same set pieces recur: the Chile law, 'firmament of life' in 2024 and 2026, the three-word proposal. This is normal for an advocate. A donor should press past the set piece. Mild.", "basis": "inference", "sources": [{"url": "https://www.salon.com/2024/10/18/fungi-deserve-same-protections-as-plants-and-animals-conservationists-argue/", "title": "Salon/Guardian, 2024"}, {"url": "https://e360.yale.edu/features/fungi-kingdom", "title": "E360, 2026"}]}], "dependency_and_succession": {"identity_fusion": "high", "tenure_signals": "Vow language and 'almost 26 years' in the field, stated with pride in 2026. No statement of leaving or a next chapter. No fatigue language in the sources, apart from one joking 'It's only been 10 years. I'm trying to recover!' (2021), which should not be over-read.", "successor_signals": "No named successor or plan found. Torres was listed as executive director for three years from 2017, stayed on staff, and now fronts a funded program as a National Geographic Explorer. That is the best precedent and it is unexplained. Furci's CV lists Executive Director since 2012. Whether the earlier handover was real delegation is the key unknown.", "revenue_exposure": "Unknown in dollars. Furci named Telluride as the source of the most sustaining funders. The biggest on-record gift offer came from a Furci interview, and Stamets, a board member, funded the archive. Speculation: a large share of individual gifts follows Furci personally, and institutional grants like National Geographic's may travel better. Ask for the top-10 donor list marked by who holds each relationship.", "basis": "inference", "confidence": 0.65}, "in_the_room": {"likely_pitch": "Inference. A story from the field, then the Chile law as proof, then one memorable metaphor. Then a moment of momentum: COP17, the pledge, a new word, a specific rescue with a budget. Warm and direct, with an invitation into a community. Likely framed as small money, outsized leverage, and durable change. Expect sincerity. Expect project numbers more readily than organizational numbers.", "will_avoid": "Inference, resting on absence rather than observed evasion: unprompted discussion of deficits, reserves, how many months of cash remain, who pays the team, the Chile money flow, what happened in 2017-2020, and any measure of conservation effect. Nothing suggests a refusal if directly asked. No one on record seems to have asked.", "test_questions": ["You've said you measure success in durable change, not money in the bank. Show me your last three years' deficits next to the durable change they bought, and tell me what you'd cut first if revenue stayed flat.", "You named a consent failure in your own data, which took courage. What's the equivalent thing you've gotten wrong in running the organization, and who told you?", "If you stepped away for 12 months starting tomorrow, who runs it, which funders stay, and what actually happened when Daniela Torres held the executive director title from 2017?"]}, "reframe": "See Furci less as a charismatic founder hiding weak finances and more as a principled, persistent field-maker whose accountability runs to fungi and knowledge holders, so any donor who wants financial accountability will need to build it into the gift.", "secondary": [{"name": "Joanna Foster", "title": "Chair of the Board, US entity", "self_concept": "No evidence found. No public statement in this role was located. Telluride Inside's 2020 article describes Foster as a natural winemaker and geographer, a description not in Foster's words.", "risk": "No evidence found.", "money": "No evidence found. The FY2024 Schedule O places 990 review with the Treasurer, then an emailed board approval. Foster's own stance on the deficits is unknown.", "dependency": "Inference: the chair is the donor's natural independent check, and it is not visible in public. This is the highest-value conversation other than Furci.", "quotes": [], "basis": "inference"}, {"name": "Paul Stamets", "title": "Board Member, US entity, since 2020", "self_concept": "No Stamets words on the Foundation were retrieved in this section. The Meet Giuliana page carries a testimonial attributed to Stamets, not extracted here.", "risk": "No evidence found.", "money": "Furci says the archive work started when Stamets funded it (2024). The amount for that gift was not separately stated. Whether Stamets gives annually is unknown.", "dependency": "Inference: reputational asset and possible funder. The name appears when Furci introduces the board. Stamets' loss would be noticed, but the effect on revenue is unknown.", "quotes": [], "basis": "inference"}], "ethics_note": "Scope: professional public statements only. Excluded: a remark about family made in the Ferriss interview, which was seen and not used. Also excluded: personal background, private experiences with fungi, personal social media (LinkedIn and personal Every.org pages were not read), and any personal finances beyond CEO pay reported on the public 990. No leaked material or anonymous allegations were used. No clinical or typological language is used. A remark about 'recovering' was treated as a joke and not read as a statement about wellbeing. Readings are of professional conduct as the record shows it. The record is mostly interviews with friendly hosts. Several readings rest on absence, which may reflect what was never asked. Furci's pronouns were not confirmed in a statement read for this section, so they/them is used, except inside a source's own words.", "gaps": ["Method limit: most pages were read through an extraction tool, not line by line. Quotes are as returned by that tool. Verify any quote before repeating it outside this dossier.", "Mycorrhizal Movements and the Ethical Guidelines PDFs would not parse. The Harvard transcript returned 403. All three are the most important reads and come from search excerpts only. The 'without consulting Indigenous peoples' point and the regret reading are paraphrase from a fragmentary excerpt. Read them in full.", "Time op-ed with Sheldrake not retrieved. Exact date unknown.", "Podcasts without transcripts not heard: Mushroom Hour (2020), Inner Lives of Fungi, The Future is Funga, Plants of the Gods (2023), Emergence (2025).", "The 2014 CV, 2021 CV and 2024 CV PDFs were not read. Furci's own writing before 2020 is effectively missing.", "No evidence found of a founder letter, annual-report letter or donor letter. No private donor updates seen.", "No evidence found of any Furci statement on deficits, reserves, pay, the 2017-2020 leadership period, or the reported Los Cedros rejection.", "No evidence found of staff, board, or Mazatec family perspectives on Furci's leadership. No criticism of Furci by name, beyond Dahlberg's policy doubt, was found.", "COP17 ends today, 30 Oct 2026. The pledge's formal outcome and Furci's reaction were not found. How Furci speaks in the next few weeks is a live pressure test if adoption falls short.", "Yale E360 (12 Mar 2026) says Furci shared a 2025 MacArthur grant with Toby Kiers. No confirming source found. One 2025 fellows roundup excerpt names neither, and neither the Foundation's bio nor its January 2026 post mentions it. Treat as unverified. It may be a press error.", "CBC page returned 403, so its quotes were read as a paraphrased excerpt.", "The culture read said no National Geographic document supports the wildlife definition change. The Foundation's 12 Mar 2024 post quotes two named National Geographic staff but links no definition. Still no National Geographic-hosted source seen."], "probe_in_conversation": ["Walk through the 2017-2020 period: who actually ran the organization, why it changed, and what Furci learned.", "Current cash, months of runway, FY2025 result, and who first raises a deficit at the board.", "Why CEO pay on the 990 fell, and whether any Furci pay comes from a non-US entity.", "Top-10 donors, and which relationships would survive Furci's departure.", "What was done with records gathered before the consent standard. Have Indigenous partners now reviewed the guidelines?", "What evidence would show that funga recognition has failed to help any habitat, and whether Furci has looked for it.", "What Furci thinks of Dahlberg's critique of the Chile law, given a direct chance to answer it.", "What happens to the strategy if the COP17 pledge does not get formal adoption.", "Who writes text published under Furci's byline, and who signs off on claims in the 990's Schedule O.", "Permission to speak to Foster, Lobo, Torres and the Mazatec project family without Furci present."], "sources": [{"url": "https://tim.blog/2021/08/05/giuliana-furci-transcript/", "title": "Tim Ferriss Show transcript, 2021"}, {"url": "https://mckenna.academy/mka-podcast/bridging-fungi-science-and-mazatec-cultural-heritage-initiatives/", "title": "Brainforest Cafe, 2024"}, {"url": "https://atmos.earth/podcast/giuliana-furci-is-your-guide-to-the-enchanting-world-of-fungi/", "title": "Atmos, 2026"}, {"url": "https://tellurideinside.com/2024/08/telluride-mushroom-festival-guiliana-furci-everywhere-you-want-to-be.html", "title": "Telluride Inside, 2024"}, {"url": "https:/
