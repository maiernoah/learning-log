<style>
/* Layout: a single light column on a pale wash. The attendee's path runs top to bottom in phases; each touchpoint shows Expectations beside Exceed. A second tab holds the shared checklist. Light only, matching cofo.org. */
:root {
  color-scheme: light;
  --wash-top: #f1edf4;
  --wash-bottom: #f8f8f8;
  --card: #fbfaf8;
  --ink: #36454f;
  --text: #5e6a72;
  --soft: #788e9d;
  --line: #e6e3e8;
  --tint: rgba(101, 92, 254, .06);
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "DM Sans", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  background-color: var(--wash-bottom);
  background-image: linear-gradient(180deg, var(--wash-top) 0, var(--wash-bottom) 640px);
  background-repeat: no-repeat;
  color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.6;
  overflow-x: hidden;
}
.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 80px; position: relative; }
h1, h2, h3 { font-family: var(--display); color: var(--ink); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.4rem, 7vw, 3.4rem); line-height: 1.05; letter-spacing: -0.03em; }
h2 { font-size: 1.6rem; line-height: 1.15; letter-spacing: -0.01em; }
h3 { font-size: 1.25rem; line-height: 1.25; font-weight: 500; }
p { margin: 0; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 8px; }
.label { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--soft); font-weight: 500; }

/* Hero with fine arcs, like the foundation's site */
.arcs-box { position: absolute; inset: 0 0 auto 0; height: 520px; overflow: hidden; pointer-events: none; }
.arcs { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 1400px; max-width: none; height: 520px; }
.hero { position: relative; text-align: center; padding-block: 72px 40px; display: grid; gap: 16px; justify-items: center; }
.hero .lede { max-width: 56ch; font-size: 1.05rem; }
.facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 6px; }
.fact { background: var(--card); border-radius: 999px; padding: 6px 16px; font-size: .9rem; color: var(--ink); box-shadow: 0 4px 20px rgba(200, 200, 214, .35); }
.fact span { color: var(--soft); margin-right: 6px; }
.sample { font-size: .82rem; color: var(--soft); }

/* Tabs */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; justify-content: center; padding-block: 12px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--wash-top); }
.tabs { display: inline-flex; gap: 4px; background: rgba(251, 250, 248, .94); border-radius: 999px; padding: 4px; box-shadow: 0 4px 20px rgba(200, 200, 214, .45); }
.tabs button { border: 0; background: transparent; color: var(--text); padding: 8px 20px; border-radius: 999px; cursor: pointer; font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--ink); color: #fff; }

/* Journey strip */
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 8px 2px 18px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.strip button { flex: 0 0 auto; border: 2px solid var(--soft); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .88rem; white-space: nowrap; }
.strip button:hover { background: var(--card); }

/* Map */
.phase { padding-top: 36px; display: grid; gap: 14px; scroll-margin-top: 80px; }
.phase-head { display: grid; gap: 2px; }
.tp { background: var(--card); border-radius: 12px; padding: 20px 22px; display: grid; gap: 14px; box-shadow: 0 4px 20px rgba(200, 200, 214, .35); }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.col { border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.col.expect { background: #f3f1ee; }
.col.exceed { background: var(--tint); }
.col ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.col li { color: var(--ink); }
.col li b { font-weight: 700; }
.col li span { color: var(--text); }

/* Checklist */
.progress { background: var(--card); border-radius: 12px; padding: 20px 22px; display: grid; gap: 12px; box-shadow: 0 4px 20px rgba(200, 200, 214, .35); margin-top: 8px; }
.progress .row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; }
.progress .big { font-family: var(--display); font-size: 2rem; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 999px; transition: width .3s; }
.status { font-size: .85rem; color: var(--soft); }
.clist { padding-top: 30px; display: grid; gap: 10px; }
.cphase { padding-top: 22px; }
.cphase:first-child { padding-top: 0; }
.pcount { font-family: var(--body); font-size: .85rem; font-weight: 500; color: var(--soft); margin-left: 12px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.cgroup { background: var(--card); border-radius: 12px; padding: 8px 22px 10px; box-shadow: 0 4px 20px rgba(200, 200, 214, .35); }
.cgroup h3 { font-family: var(--body); font-size: .95rem; font-weight: 700; color: var(--ink); padding: 12px 0 4px; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; }
.cgroup h3 + .item { border-top: 0; }
.item input { appearance: none; width: 20px; height: 20px; margin: 2px 0 0; border: 2px solid var(--soft); border-radius: 50%; cursor: pointer; display: grid; place-items: center; background: #fff; }
.item input:checked { background: var(--ink); border-color: var(--ink); }
.item input:checked::after { content: ""; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.item input:disabled { opacity: .5; cursor: not-allowed; }
.item span { color: var(--ink); }
.item.done span { color: var(--soft); text-decoration: line-through; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #fff; padding: 9px 18px; border-radius: 999px; font-size: .88rem; z-index: 20; }

@media (max-width: 640px) {
  .cols { grid-template-columns: 1fr; }
  .hero { padding-block: 48px 28px; }
  .tp, .cgroup, .progress { padding-left: 16px; padding-right: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
